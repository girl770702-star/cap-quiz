cience_q14","pk":"109_science","ans":"B"},{"id":"109-science-15","y":"109","n":15,"img":"109_science_q15","pk":"109_science","ans":"C","exp":"由圖(十一)，40℃ 時甲的溶解度約 110 g/100 g 水，10 g 水最多溶 11 g，加入 12 g 會剩下沉澱。乙在 40℃ 時溶解度約 55 g/100 g 水，10 g 水最多溶約 5.5 g，加入 5 g 可全部溶解。"},{"id":"109-science-16","y":"109","n":16,"img":"109_science_q16","pk":"109_science","ans":"B","exp":"抗菌物質 X 殺死大部分細菌後，少數對 X 有抗藥性的細菌會存活並繁殖，這就是天擇。所以長期使用會篩選出不被 X 破壞的細菌。(A)(D)細菌不會讓人體產生抗藥性或分泌 X；(C)細菌不是為了生存而主動分泌 X。"},{"id":"109-science-17","y":"109","n":17,"img":"109_science_q17","pk":"109_science","ans":"A","exp":"自花授粉仍是花粉中的精細胞與胚珠中的卵結合，有經過配子結合，所以屬於有性生殖。(B)受精後仍會結果；(C)子代具有繁殖能力；(D)有性生殖的子代會有基因重組，性狀不一定完全相同。"},{"id":"109-science-18","y":"109","n":18,"img":"109_science_q18","pk":"109_science","ans":"D","exp":"解剖顯微鏡 40 倍與複式顯微鏡 10×4=40 倍放大倍率相同，所以圖形大小不變。但複式顯微鏡看到的是上下左右都顛倒的像，也就是把原圖轉 180 度，原本在左上延伸的線會變成在右下延伸。"},{"id":"109-science-19","y":"109","n":19,"img":"109_science_q19","pk":"109_science","ans":"C","exp":"手握時不能熔化，熔化溫度要高於手部皮膚溫度，兩種氣溫下手部最高為 33℃，所以要大於 33℃。放入口中要熔化，熔化溫度要低於正常體溫約 37℃。符合 33℃ 到 37℃ 之間的只有 35℃ 的丙。"},{"id":"109-science-20","y":"109","n":20,"img":"109_science_q20","pk":"109_science","ans":"D"},{"id":"109-science-21","y":"109","n":21,"img":"109_science_q21","pk":"109_science","ans":"C"},{"id":"109-science-22","y":"109","n":22,"img":"109_science_q22","pk":"109_science","ans":"A"},{"id":"109-science-23","y":"109","n":23,"img":"109_science_q23","pk":"109_science","ans":"C","exp":"北半球的低氣壓，風會逆時針向內吹；高氣壓則是順時針向外吹。圖中右側的氣流逆時針向內，是低壓中心，氣壓應最低；左側氣流順時針向外，是高壓。氣壓數值由中心向外要遞增(低壓)，所以右側中心 996 最低、左側為 1020 的高壓。"},{"id":"109-science-24","y":"109","n":24,"img":"109_science_q24","pk":"109_science","ans":"B","exp":"合力向東且物體原本向東運動，所以兩段時間都是加速運動，速度持續增加。F1 大於 F2，加速度也較大，所以 15 秒後速度仍增加，只是斜率變小。(A)(D)速度變小表示合力向西；(C)斜率變大表示 F2 較大。"},{"id":"109-science-25","y":"109","n":25,"img":"109_science_q25","pk":"109_science","ans":"D"},{"id":"109-science-26","y":"109","n":26,"img":"109_science_q26","pk":"109_science","ans":"B","exp":"電解水時氫氣與氧氣的體積比約 2：1，氫氣是氧氣的兩倍。X 為 4.9 mL，若 Y 是氫氣，X 就是氧氣，所以氫氣體積約為 9.8 mL。(A)(C)若 Y 是氧氣，X 為氫氣，則 Y 約 2.45 mL，選項也沒有這個數值。"},{"id":"109-science-27","y":"109","n":27,"img":"109_science_q27","pk":"109_science","ans":"B","exp":"立方體體積為 10×10×10＝1000 cm³。合金共 10 kg，球為 2 kg，所以立方體是 8 kg＝8000 g，密度為 8 g/cm³。同一種均勻材質密度相同，球的體積為 2000÷8＝250 cm³。"},{"id":"109-science-28","y":"109","n":28,"img":"109_science_q28","pk":"109_science","ans":"A"},{"id":"109-science-29","y":"109","n":29,"img":"109_science_q29","pk":"109_science","ans":"B","exp":"速率對時間圖的面積是位移，梯形面積＝(500＋200)÷2×1.0＝350 m，所以家距離車站 350 m。以醫院為 0，便利商店 100、銀行 250、書局 350、車站 650，家在 650－350＝300 m，位於銀行與書局之間。"},{"id":"109-science-30","y":"109","n":30,"img":"109_science_q30","pk":"109_science","ans":"A"},{"id":"109-science-31","y":"109","n":31,"img":"109_science_q31","pk":"109_science","ans":"C","exp":"NO3⁻ 變成 NO2⁻ 時，氮的氧化數由 +5 降到 +3，且失去氧，是被還原。被還原的物質在反應中是氧化劑，所進行的是還原反應。"},{"id":"109-science-32","y":"109","n":32,"img":"109_science_q32","pk":"109_science","ans":"D","exp":"一種粒子在三個球中，質子數、電子數、中子數各占一個。比對各欄可得：白球是中子數 18、黑球是質子數、灰球是電子數；甲離子質子 17、電子 18，是帶負電的 Cl⁻；乙離子質子 12、電子 10，是 Mg²⁺；丙離子質子 11、電子 10，是 Na⁺。所以負離子的電子數是 18。"},{"id":"109-science-33","y":"109","n":33,"img":"109_science_q33","pk":"109_science","ans":"C","exp":"孩子的父親及祖父母都能捲舌，但父親的兄弟姊妹有人不能捲舌，不能捲舌是隱性，所以祖父母必定都帶有隱性基因，基因型都是 Rr，故基因型必相同。(A)(B)孩子父母的基因型與表現型無法確定；(D)祖父母都能捲舌，表現型相同。"},{"id":"109-science-34","y":"109","n":34,"img":"109_science_q34","pk":"109_science","ans":"A","exp":"夏至正午北緯 35 度的太陽高度角＝90°－35°＋23.5°＝78.5°。太陽能板要與陽光垂直，板面與水平面的夾角就是 90°－78.5°＝11.5°。"},{"id":"109-science-35","y":"109","n":35,"img":"109_science_q35","pk":"109_science","ans":"B","exp":"震度表示某地搖晃的程度，會因離震央遠近而不同；規模才表示地震釋放的能量大小。題目只給同一測站的震度，震度 3 級比 2 級搖晃較大，但無法由震度比較兩次地震釋放的能量。"},{"id":"109-science-36","y":"109","n":36,"img":"109_science_q36","pk":"109_science","ans":"D","exp":"圖中是海底擴張的張裂型板塊交界(中洋脊)，兩側板塊向相反方向遠離。岩漿在交界處冒出形成新海洋地殼，所以離交界越近越新，越遠越老。貼紙要選能同時符合箭頭向外離開、年齡由交界往兩側變老的組合。"},{"id":"109-science-37","y":"109","n":37,"img":"109_science_q37","pk":"109_science","ans":"C","exp":"電功率 P＝V²÷R。甲：3²÷9＝1 W；乙：4²÷1＝16 W；丙：8²÷2＝32 W；丁：9²÷3＝27 W。丙的耗電功率最高。"},{"id":"109-science-38","y":"109","n":38,"img":"109_science_q38","pk":"109_science","ans":"C"},{"id":"109-science-39","y":"109","n":39,"img":"109_science_q39","pk":"109_science","ans":"D","exp":"水結冰與冰融化的過程中，有冰水共存時溫度維持在 0℃，所以乙、丙是 0℃，甲冰低於 0℃。只有水沒有冰的丁，才可能是 4℃，所以溫度計顯示 4℃ 屬於丁。"},{"id":"109-science-40","y":"109","n":40,"img":"109_science_q40","pk":"109_science","ans":"B","exp":"S3 這條支路沒有燈泡，只有開關。S3 與 S4 接通後，電流可直接從這條支路流回電池，形成短路，兩燈泡都沒有電流通過而不亮。(A)沒接 S4，電路不通；(C)(D)中沒有 S3，接通的燈泡會發亮。"},{"id":"109-science-41","y":"109","n":41,"img":"109_science_q41","pk":"109_science","ans":"D","exp":"酵素的主要成分是蛋白質，無論是澱粉酶、脂肪酶還是蛋白酶都一樣。甲、乙、丙寫的是酵素作用的受質或產物，不是酵素本身的成分。"},{"id":"109-science-42","y":"109","n":42,"img":"109_science_q42","pk":"109_science","ans":"A","exp":"凹透鏡只能成正立縮小的虛像，不能成在紙屏上，與蠟燭位置無關。小華觀察到正立縮小的像，表示這是凹透鏡，所以蠟燭移到 13 cm 處，仍然是正立縮小的虛像。"},{"id":"109-science-43","y":"109","n":43,"img":"109_science_q43","pk":"109_science","ans":"D"},{"id":"109-science-44","y":"109","n":44,"img":"109_science_q44","pk":"109_science","ans":"D","exp":"960 g 鎂有 960÷24＝40 mol。每 1 mol Mg 來自 1 mol MgCl2，而每 1 mol MgCl2 需要 2 mol HCl，所以共需 80 mol HCl，質量為 80×36.5＝2920 g。鹽酸濃度 80%，所以要 2920÷0.8＝3650 g。"},{"id":"109-science-45","y":"109","n":45,"img":"109_science_q45","pk":"109_science","ans":"B","exp":"俊傑：萬有引力的大小與兩物體質量及距離有關，橡皮擦與每個物體的作用力大小並不相同，所以不符合。美玲：地球與人的萬有引力是一對作用力與反作用力，大小相等，並不是地球作用於人的力較大，所以也不符合。"},{"id":"109-science-46","y":"109","n":46,"img":"109_science_q46","pk":"109_science","ans":"C","pimg":"109_science_p46","grp":"109-science-46～47","exp":"中性浮力表示浮力等於總重，才能懸浮在水中不上浮也不下沉。浮力＝排開海水的重量，排開體積為人加裝備的體積，所以 (V人＋V裝)×D海＝M人＋M裝。"},{"id":"109-science-47","y":"109","n":47,"img":"109_science_q47","pk":"109_science","ans":"B","pimg":"109_science_p46","grp":"109-science-46～47"},{"id":"109-science-48","y":"109","n":48,"img":"109_science_q48","pk":"109_science","ans":"A","pimg":"109_science_p48","grp":"109-science-48～49","exp":"滿月在東方剛升起，表示太陽剛在西方落下，所以是傍晚約 6 點。他坐在右側窗，窗外是東方，所以飛機右側朝東，機頭應朝北，也就是航向北方。"},{"id":"109-science-49","y":"109","n":49,"img":"109_science_q49","pk":"109_science","ans":"D","pimg":"109_science_p48","grp":"109-science-48～49"},{"id":"109-science-50","y":"109","n":50,"img":"109_science_q50","pk":"109_science","ans":"D","pimg":"109_science_p50","grp":"109-science-50～51"},{"id":"109-science-51","y":"109","n":51,"img":"109_science_q51","pk":"109_science","ans":"D","pimg":"109_science_p50","grp":"109-science-50～51","exp":"紅血球數量最多，所以是 380 萬至 600 萬的丙。血小板數量約 20 萬至 45 萬，所以是乙。甲的正常數量最少，是白血球；病患白血球由正常範圍增加到 2.9 萬，符合細菌感染時白血球增多。"},{"id":"109-science-52","y":"109","n":52,"img":"109_science_q52","pk":"109_science","ans":"B","pimg":"109_science_p52","grp":"109-science-52～54","exp":"酵素在反應前後本身不變，可加快反應速率，所以是催化反應，不是脫水反應。產物中有 HCN，含 C、H、N；X 又含 -OH，有 O，所以化合物 X 至少含有 C、H、N、O 共 4 種元素。"},{"id":"109-science-53","y":"109","n":53,"img":"109_science_q53","pk":"109_science","ans":"C","pimg":"109_science_p52","grp":"109-science-52～54","exp":"竹筍照到陽光會出青而變苦，所以要用不透光的黑色塑膠布覆蓋，才能擋住光。透明塑膠布仍會讓光通過。採收時選陽光較弱時，可減少筍尖被曬到而轉綠。"},{"id":"109-science-54","y":"109","n":54,"img":"109_science_q54","pk":"109_science","ans":"A","pimg":"109_science_p52","grp":"109-science-52～54"},{"id":"110-science-1","y":"110","n":1,"img":"110_science_q01","pk":"110_science","ans":"A"},{"id":"110-science-2","y":"110","n":2,"img":"110_science_q02","pk":"110_science","ans":"D"},{"id":"110-science-3","y":"110","n":3,"img":"110_science_q03","pk":"110_science","ans":"C","exp":"同一次地震的規模只有一個數值，所以 X 就是 6.2。震度則是離震央越遠越小，震央在南部，新竹比嘉義遠，嘉義震度 4 級，新竹應該更小，所以 Y 為 2。"},{"id":"110-science-4","y":"110","n":4,"img":"110_science_q04","pk":"110_science","ans":"D","exp":"肌肉顫抖是身體冷到發抖產熱，表示甲環境溫度低於體溫；皮膚血管擴張、血流量增加是為了散熱，表示乙環境溫度高於體溫。所以乙 > 體溫 > 甲。"},{"id":"110-science-5","y":"110","n":5,"img":"110_science_q05","pk":"110_science","ans":"D","exp":"每公升湖水含鹽 340 公克，而每公升湖水重 1.24 公斤＝1240 公克，所以鹽的重量百分濃度＝340÷1240×100%，約 27.4%。湖水總量和蒸發量題目都沒給，無法算出 (A)(B)(C)。"},{"id":"110-science-6","y":"110","n":6,"img":"110_science_q06","pk":"110_science","ans":"C"},{"id":"110-science-7","y":"110","n":7,"img":"110_science_q07","pk":"110_science","ans":"A","exp":"甲、乙只差在有沒有放銀幣（其他條件都相同），乙未檢出而甲有大量細菌，所以支持銀幣能抑制細菌。(B)乙與丙的變因不同，不能直接比較效果；(C)單位是 CFU/g，不是每杯；(D)實驗沒有測試金幣，不能推測。"},{"id":"110-science-8","y":"110","n":8,"img":"110_science_q08","pk":"110_science","ans":"B","exp":"要證明「只有頻率相同才會共振」，必須讓兩支音叉頻率不同，觀察是否不會共振。(B)把其中一支換成 500 Hz，兩支頻率不同，若不共振才能支持妮妮；(A)(D)頻率仍相同，(C)兩支仍相同，都無法檢驗頻率不同的情形。"},{"id":"110-science-9","y":"110","n":9,"img":"110_science_q09","pk":"110_science","ans":"B"},{"id":"110-science-10","y":"110","n":10,"img":"110_science_q10","pk":"110_science","ans":"A"},{"id":"110-science-11","y":"110","n":11,"img":"110_science_q11","pk":"110_science","ans":"C","exp":"甲是完整的葉子，散失水分最多。乙塗上表皮、只剩下表皮能蒸散，丙塗下表皮、只剩上表皮能蒸散，乙散失量比丙多，代表下表皮氣孔較多。丁兩面都塗，幾乎不散失。"},{"id":"110-science-12","y":"110","n":12,"img":"110_science_q12","pk":"110_science","ans":"D"},{"id":"110-science-13","y":"110","n":13,"img":"110_science_q13","pk":"110_science","ans":"B"},{"id":"110-science-14","y":"110","n":14,"img":"110_science_q14","pk":"110_science","ans":"A","exp":"星星每天東升西落，是因為地球自轉（約每小時轉 15 度），不是公轉。星星相對地面向西移動，所以 4 小時後，原來頭頂上的星星會偏到西方天空，應往西方尋找。"},{"id":"110-science-15","y":"110","n":15,"img":"110_science_q15","pk":"110_science","ans":"A"},{"id":"110-science-16","y":"110","n":16,"img":"110_science_q16","pk":"110_science","ans":"C","exp":"歹徒的身體要「回到右後方」，是相對於車子往右、往後移動。身體因慣性維持原本運動狀態：車子向左急轉時，人相對車子往右偏；車子急加速時，人相對車子往後。所以是先急左轉再急加速。"},{"id":"110-science-17","y":"110","n":17,"img":"110_science_q17","pk":"110_science","ans":"A"},{"id":"110-science-18","y":"110","n":18,"img":"110_science_q18","pk":"110_science","ans":"C","exp":"同材質的物體，吸收的熱量＝質量×比熱×上升溫度，熱源穩定，所以所需時間與質量×上升溫度成正比。甲為 100×20＝2000 對應 120 秒，乙為 300×10＝3000，時間為 120×3000÷2000＝180 秒。"},{"id":"110-science-19","y":"110","n":19,"img":"110_science_q19","pk":"110_science","ans":"B","exp":"深色是顯性，深色蛾的基因型為 BB 或 Bb，淺色蛾只有 bb。乙圖深色 50%、淺色 50%，所以 BB+Bb＝bb。(A)甲深色只有 10%，BB+Bb < bb；(D)丁淺色 bb 為 10%，深色 90%，若 Bb＝bb＝10%，則 BB＝80%，BB > Bb。"},{"id":"110-science-20","y":"110","n":20,"img":"110_science_q20","pk":"110_science","ans":"C","exp":"月亮在農曆初一前後（新月）幾乎看不到，月光干擾最小。表中農曆 9 月 2 日最接近初一，夜晚幾乎無月光，所以天龍座流星雨受到月光影響最小。其他日期（農曆 16、23、9 日）月亮明亮或較晚下山。"},{"id":"110-science-21","y":"110","n":21,"img":"110_science_q21","pk":"110_science","ans":"D","exp":"阿牧依常溫下是否為固態分類，固態、氣態是物理性質（狀態）。小菲依是否與水反應冒泡分類，是物質發生化學變化的性質，屬於化學性質。所以只有小菲是依化學性質分類。"},{"id":"110-science-22","y":"110","n":22,"img":"110_science_q22","pk":"110_science","ans":"A","exp":"實驗中只改變胡蘿蔔的切法，也就是改變與雙氧水接觸的表面積，並比較同樣 5 分鐘內收集到的氧氣量，是在探討接觸面積與反應速率的關係。(D)胡蘿蔔是催化劑，不是反應物，雙氧水的量才決定最終氧氣量；(C)水量改變會改變雙氧水濃度，可能影響結果。"},{"id":"110-science-23","y":"110","n":23,"img":"110_science_q23","pk":"110_science","ans":"C","exp":"反應式中 NO 與 NO2 需要 1：1 才能完全反應，但廢氣中 NO 是 NO2 的 9 倍，NO2 不夠。所以要把一部分 NO 氧化成 NO2（氧化是得到氧原子），提高 NO2 的比例。(B)(D)方向與需求不符。"},{"id":"110-science-24","y":"110","n":24,"img":"110_science_q24","pk":"110_science","ans":"A"},{"id":"110-science-25","y":"110","n":25,"img":"110_science_q25","pk":"110_science","ans":"A"},{"id":"110-science-26","y":"110","n":26,"img":"110_science_q26","pk":"110_science","ans":"D","exp":"不與 As（第 15 族）同族、與 Ge（第 4 週期）不同週期，排除第 15 族和第 4 週期。又不與 Te（第 16 族）同族、與 Cl（第 3 週期）不同週期，排除第 16 族和第 3 週期。圖中剩下 Sn（50）和 I（53）。"},{"id":"110-science-27","y":"110","n":27,"img":"110_science_q27","pk":"110_science","ans":"D","exp":"不計摩擦力，力學能守恆。甲與丙等高，重力位能相等，U丙－U甲＝0；甲、丙都在最高點，速度為 0，動能 E甲＝E丙＝0，所以 E甲－E丙＝0，(D)兩邊相等。(A)左邊是 E乙，右邊是 0；(C)右邊是負的 E乙，不相等。"},{"id":"110-science-28","y":"110","n":28,"img":"110_science_q28","pk":"110_science","ans":"A"},{"id":"110-science-29","y":"110","n":29,"img":"110_science_q29","pk":"110_science","ans":"D"},{"id":"110-science-30","y":"110","n":30,"img":"110_science_q30","pk":"110_science","ans":"D"},{"id":"110-science-31","y":"110","n":31,"img":"110_science_q31","pk":"110_science","ans":"B"},{"id":"110-science-32","y":"110","n":32,"img":"110_science_q32","pk":"110_science","ans":"B","exp":"太陽光直射井底，表示正午太陽在天頂，也就是太陽直射該緯度。5 月 16 日介於春分（3/21）和夏至（6/22）之間，直射點正由赤道往北回歸線移動，約在北緯 19 度左右。(A)赤道一年有春分、秋分兩天直射，不是 5/16；(C)23.5 度是夏至那天。"},{"id":"110-science-33","y":"110","n":33,"img":"110_science_q33","pk":"110_science","ans":"B"},{"id":"110-science-34","y":"110","n":34,"img":"110_science_q34","pk":"110_science","ans":"A"},{"id":"110-science-35","y":"110","n":35,"img":"110_science_q35","pk":"110_science","ans":"B"},{"id":"110-science-36","y":"110","n":36,"img":"110_science_q36","pk":"110_science","ans":"D"},{"id":"110-science-37","y":"110","n":37,"img":"110_science_q37","pk":"110_science","ans":"D","exp":"水銀和水面外的容器 Q、S 點是暴露在大氣中，壓力就是一大氣壓。玻璃管內液面上方 P、R 是真空（托里切利實驗），氣壓為 0。所以選 Q、S。"},{"id":"110-science-38","y":"110","n":38,"img":"110_science_q38","pk":"110_science","ans":"C","exp":"此時臺灣受到鋒面影響，低壓 L 在東北方，鋒面南端的冷鋒向西南延伸。乙在太平洋上，是高壓，標示 H，屬於暖氣團。甲在大陸上，也是高壓 H，但屬於冷氣團。(A)甲雖標 H，但暖氣團錯；(B)甲不是低壓；(D)乙不是低壓。"},{"id":"110-science-39","y":"110","n":39,"img":"110_science_q39","pk":"110_science","ans":"D","exp":"每秒轉 2 圈，3 秒轉 6 圈，剛好回到原來位置，也就是手的正東方。小球作逆時針圓周運動，速度沿切線方向，所以在東方時速度朝正北。"},{"id":"110-science-40","y":"110","n":40,"img":"110_science_q40","pk":"110_science","ans":"D","exp":"甲沉在水底，排開水的體積等於本身體積，水位由 200 mL 升到 250 mL，所以體積為 50 cm3，但質量無法由體積求出。乙漂浮，浮力等於重力，排開水 80 mL（80 g）的重量就等於乙的重量，所以乙質量為 80 g，但乙的體積大於排開水的體積，不知道。"},{"id":"110-science-41","y":"110","n":41,"img":"110_science_q41","pk":"110_science","ans":"A","exp":"反應物是乙酸和異丁醇，濃硫酸脫水作用是催化，產物是乙酸異丁酯和水。依質量守恆，酯的分子量＝60＋74－18＝116。硫酸在反應前後不變，不能加進計算。"},{"id":"110-science-42","y":"110","n":42,"img":"110_science_q42","pk":"110_science","ans":"C","exp":"胃的 pH 小於 5，酵素會完全被破壞，這種破壞是永久的，到了小腸活性也不會恢復，所以胃和小腸的活性都是 0。口腔 pH 約 7，接近 pH 8，酵素仍有活性。"},{"id":"110-science-43","y":"110","n":43,"img":"110_science_q43","pk":"110_science","ans":"B","exp":"球只受重力，加速度固定為向下 9.8 m/s2，所以 v－t 圖是一條斜率為 －9.8 的直線，也就是每經過 1 秒，速度減少 9.8 m/s。上拋時速度向上為正，起點為正值，並且約 1 秒後速度減為 0 開始下墜。(A)的斜率只有 －1，(C)(D)速度先增大再減小，不合上拋運動。"},{"id":"110-science-44","y":"110","n":44,"img":"110_science_q44","pk":"110_science","ans":"C","exp":"丙為海洋地殼時，它的下方就是地函，所以乙（在丙以下）一定是地函，密度 4.5。(A)丙是大陸地殼時，乙可能是海洋地殼或地函，甲也不一定是地函；(B)甲的厚度大，不能推出各層名稱；(D)甲密度最大，但只靠提示無法確定。"},{"id":"110-science-45","y":"110","n":45,"img":"110_science_q45","pk":"110_science","ans":"A","exp":"「濃度越大，X 越小」，所以 X 應隨濃度上升而變小，排除 (B)(C)。(A)中 X 是 100、50、33、25，倒數 1/X 約 0.01、0.02、0.03、0.04，與濃度成正比，是向上的直線。(D)的 X 變小，倒數會變大，圖形應向上而不是向下。"},{"id":"110-science-46","y":"110","n":46,"img":"110_science_q46","pk":"110_science","ans":"B","pimg":"110_science_p46","grp":"110-science-46～47"},{"id":"110-science-47","y":"110","n":47,"img":"110_science_q47","pk":"110_science","ans":"A","pimg":"110_science_p46","grp":"110-science-46～47"},{"id":"110-science-48","y":"110","n":48,"img":"110_science_q48","pk":"110_science","ans":"C","pimg":"110_science_p48","grp":"110-science-48～49","exp":"X 牌對甲蚊存活 705，Y 牌存活 2404，X 牌殺死的甲蚊較多，所以 (C) 合理。(A)(B)不同牌子的殺蟲劑效果不同，不能只比較蚊子種類；(D)乙蚊用 X 牌存活 109，少於 Y 牌 128，X 牌較有效。"},{"id":"110-science-49","y":"110","n":49,"img":"110_science_q49","pk":"110_science","ans":"C","pimg":"110_science_p48","grp":"110-science-48～49","exp":"天擇說明：族群中本來就有個體的變異，少數蚊子原本就有抗藥性，殺蟲劑把不具抗性的殺死，抗性個體存活並繁殖，使抗藥族群增加。(A)(B)殺蟲劑不會使蚊子突變或產生抗力；(D)抗性不是因為沒接觸。"},{"id":"110-science-50","y":"110","n":50,"img":"110_science_q50","pk":"110_science","ans":"C","pimg":"110_science_p50","grp":"110-science-50～51"},{"id":"110-science-51","y":"110","n":51,"img":"110_science_q51","pk":"110_science","ans":"B","pimg":"110_science_p50","grp":"110-science-50～51"},{"id":"110-science-52","y":"110","n":52,"img":"110_science_q52","pk":"110_science","ans":"B","pimg":"110_science_p52","grp":"110-science-52～54"},{"id":"110-science-53","y":"110","n":53,"img":"110_science_q53","pk":"110_science","ans":"D","pimg":"110_science_p52","grp":"110-science-52～54","exp":"岩層沒有倒轉時，下面的岩層較老、上面較新。劍龍（155～150 Ma）最老，其次是始祖鳥（151～149 Ma），暴龍（68～66 Ma）較新，甲類生物最新，因此由下到上為劍龍、暴龍、甲類。"},{"id":"110-science-54","y":"110","n":54,"img":"110_science_q54","pk":"110_science","ans":"B","pimg":"110_science_p52","grp":"110-science-52～54","exp":"三角龍（68～65 Ma）與暴龍（68～66 Ma）生存時間重疊，所以可能發生暴龍咬三角龍。始祖鳥（約 150 Ma）和劍龍（約 155～150 Ma）都比暴龍早約 8000 萬年以上，所以 (A)(C)(D)不可能。"},{"id":"111-science-1","y":"111","n":1,"img":"111_science_q01","pk":"111_science","ans":"A"},{"id":"111-science-2","y":"111","n":2,"img":"111_science_q02","pk":"111_science","ans":"C"},{"id":"111-science-3","y":"111","n":3,"img":"111_science_q03","pk":"111_science","ans":"D"},{"id":"111-science-4","y":"111","n":4,"img":"111_science_q04","pk":"111_science","ans":"C"},{"id":"111-science-5","y":"111","n":5,"img":"111_science_q05","pk":"111_science","ans":"A"},{"id":"111-science-6","y":"111","n":6,"img":"111_science_q06","pk":"111_science","ans":"B"},{"id":"111-science-7","y":"111","n":7,"img":"111_science_q07","pk":"111_science","ans":"B","exp":"洋芋片包裝膨脹是因為山上氣壓較低，包裝內的氣體向外膨脹，和氣溫無關。(A)(C)(D)都控制了溫度相同，包裝仍會膨脹，可以反駁小真；(B)玻璃瓶很堅硬，不容易變形，沒膨脹不能說明溫度的影響，所以不適合用來反駁。"},{"id":"111-science-8","y":"111","n":8,"img":"111_science_q08","pk":"111_science","ans":"B","exp":"體積由小到大依序為氫原子、口腔皮膜細胞、月球、太陽。氫原子是原子，比細胞小很多；細胞要用顯微鏡才看得到；月球和太陽是天體，其中太陽的體積遠大於月球。"},{"id":"111-science-9","y":"111","n":9,"img":"111_science_q09","pk":"111_science","ans":"C"},{"id":"111-science-10","y":"111","n":10,"img":"111_science_q10","pk":"111_science","ans":"A"},{"id":"111-science-11","y":"111","n":11,"img":"111_science_q11","pk":"111_science","ans":"C","exp":"O 型的基因型是 ii，子女必須從父母各得到一個 i。丙組的父親是 O 型(ii)、母親是 AB 型(IAIB)，母親沒有 i，所以子女只會是 A 型或 B 型，不可能是 O 型。甲、乙兩組的 A 型、B 型父母若基因型為 IAi、IBi，仍可能生出 O 型。"},{"id":"111-science-12","y":"111","n":12,"img":"111_science_q12","pk":"111_science","ans":"A","exp":"探討某一因素的影響時，只能改變該因素，其他條件要控制不變。實驗 1、2 的夾角與石塊重量都相同，只有斜面長度不同，所以石塊重量控制不變。(B)3、4 的斜面長度不同；(C)2、4 的夾角和重量都不同；(D)1、3 的夾角和重量都不同，都無法單獨比較一個因素。"},{"id":"111-science-13","y":"111","n":13,"img":"111_science_q13","pk":"111_science","ans":"C"},{"id":"111-science-14","y":"111","n":14,"img":"111_science_q14","pk":"111_science","ans":"A"},{"id":"111-science-15","y":"111","n":15,"img":"111_science_q15","pk":"111_science","ans":"C"},{"id":"111-science-16","y":"111","n":16,"img":"111_science_q16","pk":"111_science","ans":"B"},{"id":"111-science-17","y":"111","n":17,"img":"111_science_q17","pk":"111_science","ans":"C"},{"id":"111-science-18","y":"111","n":18,"img":"111_science_q18","pk":"111_science","ans":"C","exp":"榕樹的葉肉細胞等含葉綠體的細胞才能行光合作用，但根、莖等部分細胞沒有葉綠體；而所有活細胞都有粒線體，都能行呼吸作用。所以可行光合作用的細胞數目比可行呼吸作用的少。(A)(B)植物細胞都有粒線體；(D)並非每個細胞都有葉綠體。"},{"id":"111-science-19","y":"111","n":19,"img":"111_science_q19","pk":"111_science","ans":"B"},{"id":"111-science-20","y":"111","n":20,"img":"111_science_q20","pk":"111_science","ans":"A","exp":"圖中只有各月的平均氣溫，無法得知同一天的最高溫與最低溫，所以不能推論畫夜溫差，(A)最不合理。(B)臺北每月降雨柱都超過 50 mm；(C)恆春降雨集中在 5～10 月；(D)臺北最高約 28℃、最低約 15℃，變化約 13℃，比恆春大。"},{"id":"111-science-21","y":"111","n":21,"img":"111_science_q21","pk":"111_science","ans":"D"},{"id":"111-science-22","y":"111","n":22,"img":"111_science_q22","pk":"111_science","ans":"B","exp":"文中說乙酸乙酯較無安全疑慮，所以應該是對人體無害、日常生活就能接觸到的物質。酯類有果香味，香蕉、柳丁等水果本來就含有。(A)酯類含有氧原子，不是只有碳和氫；(C)題目沒有提到沸點；(D)皂化反應的產物是肥皂和甘油，不是酯。"},{"id":"111-science-23","y":"111","n":23,"img":"111_science_q23","pk":"111_science","ans":"D","exp":"食物鏈為稻→鼠→蛇→鷹，能量塔由下而上是甲(生產者)、乙(鼠)、丙(蛇)、丁(鷹)。能量沿食物鏈傳遞時，每一階層大約只剩下上一階層的十分之一。蛇(丙)為 10,000，所以鼠(乙)約為 10,000×10＝100,000 能量單位。"},{"id":"111-science-24","y":"111","n":24,"img":"111_science_q24","pk":"111_science","ans":"B","exp":"圖中甲在大陸上，是冷高壓；乙是低壓(輕颱)，呂宋島北部在乙的西北方，低壓周圍風向逆時針吹，所以吹偏北風或東北風。(A)甲是大陸冷氣團，不是太平洋暖氣團；(C)東北風使臺灣北部、東北部降雨較多；(D)颱風接近會帶來風雨，不是晴朗炎熱。"},{"id":"111-science-25","y":"111","n":25,"img":"111_science_q25","pk":"111_science","ans":"D","exp":"v-t 圖中，甲速度為正且不變，乙速度為 0(靜止)，丙、丁速度為負且越來越大。甲向前、乙不動，距離會改變；丙、丁斜率相同，速度差固定，距離會穩定改變；甲向前、丙向後，愈來愈遠；乙靜止、丁愈跑愈快，所以乙、丁距離愈來愈遠。"},{"id":"111-science-26","y":"111","n":26,"img":"111_science_q26","pk":"111_science","ans":"D","exp":"含氧量高的是動脈血，含氧量低的是靜脈血。甲 19.8 含氧量高，是左心室，連接主動脈，送出富含氧的血；乙 15.2 含氧量較低，是右心室，連接肺動脈，把缺氧的血送到肺部。心室連接的是動脈，不會連接大靜脈或肺靜脈，所以(A)(B)錯誤。"},{"id":"111-science-27","y":"111","n":27,"img":"111_science_q27","pk":"111_science","ans":"B","exp":"用表(六)計算各國每度電碳排放量：甲國 2015 年約 0.43×380＋0.33×790≈424 g，2030 年約 0.26×380＋0.25×790≈296 g，減少；乙國 2015 年約 0.30×380＋0.47×790≈485 g，2030 年約 0.45×380＋0.32×790≈424 g，也減少。燃煤比例下降是兩國碳排放變少的主因。"},{"id":"111-science-28","y":"111","n":28,"img":"111_science_q28","pk":"111_science","ans":"B","exp":"熱源相同、熱量完全被水吸收，所以兩杯水吸收的熱量相同。由 Q＝m×s×Δt 可知，質量越大，上升溫度越小。甲的質量是乙的 3/2，所以甲的上升溫度只有乙的 2/3，圖中甲的線應比乙平緩，且兩線都是通過原點的直線。"},{"id":"111-science-29","y":"111","n":29,"img":"111_science_q29","pk":"111_science","ans":"A"},{"id":"111-science-30","y":"111","n":30,"img":"111_science_q30","pk":"111_science","ans":"A","exp":"鍍銅時，鑰匙接電源負極，電子是由電源流向鑰匙；圖中粗黑箭頭是電流方向，空心箭頭才是電子流動方向。鋅銅電池中，電子流入乙電極，所以乙是電子進入的正極，也就是銅電極，溶液中的銅離子在這裡得到電子變成銅。(B)(D)是失去電子的反應，鋅離子不會被還原。"},{"id":"111-science-31","y":"111","n":31,"img":"111_science_q31","pk":"111_science","ans":"C","exp":"電子的質量最小，所以 X 是電子。陽離子的質子數大於電子數，(A)(B)中 N_X＝N_Z 表示 Z 的數目和電子一樣多，若 Z 是質子就會變成中性，Z 也不可能是電子，所以都不合理。陰離子的電子數大於質子數，(C)中 N_X＝N_Y＞N_Z，Z 是質子，可成立；(D)說 Z 是電子，但電子已是 X。"},{"id":"111-science-32","y":"111","n":32,"img":"111_science_q32","pk":"111_science","ans":"C"},{"id":"111-science-33","y":"111","n":33,"img":"111_science_q33","pk":"111_science","ans":"A","exp":"力矩＝力×力臂。圖(十七)中，兩個力分別在轉軸兩側，且方向相反，使槓桿朝同一方向轉，所以力矩相加：L1＝F×20＋F×20＝40F。圖(十八)中 L2＝F×40＝40F，因此 L1＝L2。不能因為圖(十七)有兩個力就以為力矩相互抵消。"},{"id":"111-science-34","y":"111","n":34,"img":"111_science_q34","pk":"111_science","ans":"D"},{"id":"111-science-35","y":"111","n":35,"img":"111_science_q35","pk":"111_science","ans":"B"},{"id":"111-science-36","y":"111","n":36,"img":"111_science_q36","pk":"111_science","ans":"D","exp":"阿忠不合理：F＝ma 中的 F 是合力，書櫃沒被推動時加速度為 0，不是質量大所以需要的力一定較大。小志合理：書越多，書櫃對地面的垂直作用力越大，最大靜摩擦力也越大，推力必須超過它才推得動。"},{"id":"111-science-37","y":"111","n":37,"img":"111_science_q37","pk":"111_science","ans":"B"},{"id":"111-science-38","y":"111","n":38,"img":"111_science_q38","pk":"111_science","ans":"A","exp":"空心金屬球放入水中，排開水的體積 V 包含中間的空心部分，比金屬本身的體積大。質量 M 是金屬的質量(空氣質量可忽略)。D＝M/V，V 偏大，所以算出的 D 比純銅密度 8.96 小。(B)V 不是只有金屬的體積；(C)(D)會使 D 大於 8.96，不符合。"},{"id":"111-science-39","y":"111","n":39,"img":"111_science_q39","pk":"111_science","ans":"B","exp":"性染色體成對的細胞，必須是含有細胞核的體細胞(2n)。卵細胞是生殖細胞，只有一條性染色體(X)；成熟的紅血球沒有細胞核，也沒有染色體，所以甲、丁不具有成對性染色體。受精卵和口腔皮膜細胞都是 2n，具有成對的性染色體。"},{"id":"111-science-40","y":"111","n":40,"img":"111_science_q40","pk":"111_science","ans":"D","exp":"地層未倒轉，下方比上方老。乙是 15,000～10,000 年前，所以上方的甲比 10,000 年前更年輕，丙則比 15,000 年前更老。火成岩脈切過丙和乙，表示它形成時乙已經存在，所以形成時間距今不到 15,000 年。(A)(B)的年代方向相反；(C)無法確定超過 10,000 年。"},{"id":"111-science-41","y":"111","n":41,"img":"111_science_q41","pk":"111_science","ans":"D","exp":"步驟二中，鈉燃燒後溶於水成氫氧化鈉，是鹼性，使酚酞變紅(甲瓶)；硫燃燒產生的二氧化硫溶於水成亞硫酸，是酸性，酚酞不變色(乙瓶)。把酸倒入鹼中，若酸不足以中和，仍是鹼性，維持紅色；若酸足夠中和而過量，溶液變成酸性，紅色會消失，所以有兩種可能。"},{"id":"111-science-42","y":"111","n":42,"img":"111_science_q42","pk":"111_science","ans":"B","pimg":"111_science_p42","grp":"111-science-42～44"},{"id":"111-science-43","y":"111","n":43,"img":"111_science_q43","pk":"111_science","ans":"C","pimg":"111_science_p42","grp":"111-science-42～44"},{"id":"111-science-44","y":"111","n":44,"img":"111_science_q44","pk":"111_science","ans":"D","pimg":"111_science_p42","grp":"111-science-42～44","exp":"排開水量就是收集到的氣體量，數值越大代表產氣越多、發酵越快。(A)34℃ 在第二天排開水量最大，溫度高時活性反而更強；(B)用排水集氣法收集，表示氣體不易溶於水；(C)題目沒有提供甲烷的體積百分比。"},{"id":"111-science-45","y":"111","n":45,"img":"111_science_q45","pk":"111_science","ans":"D","pimg":"111_science_p45","grp":"111-science-45～46"},{"id":"111-science-46","y":"111","n":46,"img":"111_science_q46","pk":"111_science","ans":"D","pimg":"111_science_p45","grp":"111-science-45～46","exp":"圖中深色粗大的乙、丙是木質部，運送水分向上；甲、丁在外側，是韌皮部，運送醣類，而且醣類可往下運到根，也能往上運到生長旺盛的部位。同學 4 的答案符合。同學 1 漏了丁，且醣類只寫往下；同學 2 把水和醣類的位置弄反；同學 3 把丁的醣類只寫往下，漏了往上。"},{"id":"111-science-47","y":"111","n":47,"img":"111_science_q47","pk":"111_science","ans":"A","pimg":"111_science_p47","grp":"111-science-47～48"},{"id":"111-science-48","y":"111","n":48,"img":"111_science_q48","pk":"111_science","ans":"D","pimg":"111_science_p47","grp":"111-science-47～48","exp":"由電路圖(二十七)可知，丙與甲串聯，再與丁並聯，電池與乙在幹線上。乙測的是流過整個電路的總電流，等於丙(甲)這條支路與丁這條支路的電流相加，所以 I乙＞I甲，表中 I甲＞I乙 不合理。電流流經串聯的元件時處處相同，並不會因為靠近負極就比較大。"},{"id":"111-science-49","y":"111","n":49,"img":"111_science_q49","pk":"111_science","ans":"C","pimg":"111_science_p49","grp":"111-science-49～50","exp":"阿明的卡片中，小日期是滿月(約 15 日)，大日期應是月底的殘月，亮面朝東(左)；他放的是亮面朝西(右)的眉月，那是月初的月相，所以放錯。小豪放的是上弦月(約初八)和亮面朝東的殘月(月底)，放置正確。阿明先按鈴卻答錯，所以小豪得 1 分。"},{"id":"111-science-50","y":"111","n":50,"img":"111_science_q50","pk":"111_science","ans":"D","pimg":"111_science_p49","grp":"111-science-49～50"},{"id":"112-science-1","y":"112","n":1,"img":"112_science_q01","pk":"112_science","ans":"D"},{"id":"112-science-2","y":"112","n":2,"img":"112_science_q02","pk":"112_science","ans":"B"},{"id":"112-science-3","y":"112","n":3,"img":"112_science_q03","pk":"112_science","ans":"D"},{"id":"112-science-4","y":"112","n":4,"img":"112_science_q04","pk":"112_science","ans":"C","exp":"毛黴菌屬於真菌，是異營生物，不能行光合作用，所以沒有葉綠體。(A)黴菌會產生孢子繁殖；(B)真菌是真核生物，具有粒線體；(D)真菌具有細胞壁，成分和植物不同。"},{"id":"112-science-5","y":"112","n":5,"img":"112_science_q05","pk":"112_science","ans":"A","exp":"潮差是同一天高潮與低潮的水位差。8/11 約由 2.5 公尺降到 -2.5 公尺，潮差約 5 公尺；8/14 約由 1.5 公尺降到 -1.5 公尺，潮差約 3 公尺，兩者相差約 2 公尺。"},{"id":"112-science-6","y":"112","n":6,"img":"112_science_q06","pk":"112_science","ans":"A","exp":"溫度計的液球若碰到杯底，會測到被加熱的杯底溫度，而不是水溫，所以要懸吊在水中。(B)靠近火焰會直接受熱；(C)溫度計易碎，不能拿來攪拌；(D)酒精裝滿容易發生危險，也不能讓火焰大小固定。"},{"id":"112-science-7","y":"112","n":7,"img":"112_science_q07","pk":"112_science","ans":"B"},{"id":"112-science-8","y":"112","n":8,"img":"112_science_q08","pk":"112_science","ans":"C"},{"id":"112-science-9","y":"112","n":9,"img":"112_science_q09","pk":"112_science","ans":"C"},{"id":"112-science-10","y":"112","n":10,"img":"112_science_q10","pk":"112_science","ans":"B"},{"id":"112-science-11","y":"112","n":11,"img":"112_science_q11","pk":"112_science","ans":"D","exp":"椰子油加氫氧化鈉會進行皂化反應，產生肥皂和甘油。步驟四加入飽和食鹽水，肥皂較難溶於食鹽水而浮到液面，與甘油等其他物質分離。(A)乙醇是溶劑，不是反應物；(B)加熱是為了加快反應；(C)水不是催化劑。"},{"id":"112-science-12","y":"112","n":12,"img":"112_science_q12","pk":"112_science","ans":"A"},{"id":"112-science-13","y":"112","n":13,"img":"112_science_q13","pk":"112_science","ans":"A"},{"id":"112-science-14","y":"112","n":14,"img":"112_science_q14","pk":"112_science","ans":"B","exp":"DDT 難被代謝，會沿食物鏈累積，位置越高濃度越高。濃度由低到高為丁(0.04)、乙(0.2)、甲(2.0)、丙(20)，所以食性關係為丁→乙→甲→丙，丁是生產者，丙是最高級消費者。"},{"id":"112-science-15","y":"112","n":15,"img":"112_science_q15","pk":"112_science","ans":"B","exp":"夏季盛行西南季風，風由西南吹向東北，有利於從臺灣向北航行；黑潮是由南向北流的暖流，流經臺灣東側。(A)(C)東北季風出現在冬季；中國沿岸流是冬季向南流的海流，會阻礙北上。"},{"id":"112-science-16","y":"112","n":16,"img":"112_science_q16","pk":"112_science","ans":"A"},{"id":"112-science-17","y":"112","n":17,"img":"112_science_q17","pk":"112_science","ans":"B"},{"id":"112-science-18","y":"112","n":18,"img":"112_science_q18","pk":"112_science","ans":"A","exp":"400 公尺賽跑每位選手實際跑的路程都相同，最先抵達者所用時間最短，所以平均速率（路程÷時間）必定最大。(B)各跑道起點不同，位移不同，平均速度不一定最大；(C)(D)最大速率與最大速度與是否先到終點沒有必然關係。"},{"id":"112-science-19","y":"112","n":19,"img":"112_science_q19","pk":"112_science","ans":"C","exp":"不計摩擦與阻力，力學能守恆。小球由 1.0 公尺高處靜止釋放，動能為 0，總能量全部是重力位能；最高點動能又為 0，位能與起點相同，所以高度也是 1.0 公尺。"},{"id":"112-science-20","y":"112","n":20,"img":"112_science_q20","pk":"112_science","ans":"B","exp":"由學名可知 Lil-2 與 Lil-3 同為 Lilium 屬，同屬必同科，(A)可確定；Lil-2 與 Lil-1 屬名不同，(C)可確定；Lil-2 與 Myr-6 屬名不同，(D)可確定。但表中沒有提供目的資料，無法判斷 Lil-2 與 Myr-6 是否同目。"},{"id":"112-science-21","y":"112","n":21,"img":"112_science_q21","pk":"112_science","ans":"D","exp":"Y 軸由內而外越來越大，應為與太陽的平均距離，土星最遠。X 軸中，木星、土星是密度小的氣態行星，地球等類地行星是密度大的岩質行星，所以 X 軸應為密度。(A)(B)體積不會是木星、土星小而地球大。"},{"id":"112-science-22","y":"112","n":22,"img":"112_science_q22","pk":"112_science","ans":"B","exp":"發病（體溫超出恆定範圍）出現在第 6 天，潛伏期是感染到發病的 1～3 天，所以感染日應在第 3～5 天。選項中只有第 3 天符合，第 1 天太早，第 6、8 天已是發病期或發病之後。"},{"id":"112-science-23","y":"112","n":23,"img":"112_science_q23","pk":"112_science","ans":"C","exp":"由 v-t 圖斜率求加速度：甲 a＝30÷20＝1.5 m/s²，乙 a＝20÷30≈0.67 m/s²。質量相同，由 F＝ma 得 F甲＞F乙。甲受力約 20 秒，乙從 10 秒到 40 秒受力約 30 秒，所以乙施力時間較長。"},{"id":"112-science-24","y":"112","n":24,"img":"112_science_q24","pk":"112_science","ans":"D","exp":"葡萄糖能通過膜，達到平衡後試管內外都有葡萄糖，所以用本氏液檢測兩邊都會變色。澱粉不能通過膜，只留在燒杯，所以碘液只會讓燒杯中的溶液變色，(A)(B)都不對。"},{"id":"112-science-25","y":"112","n":25,"img":"112_science_q25","pk":"112_science","ans":"D","exp":"空氣約含 78％氮氣、21％氧氣，二氧化碳極少。要減緩蘋果熟成，就要降低氧氣、提高二氧化碳，(D)正是這種情形。(A)是一般空氣的組成；(B)氮氣不是題目要調整的重點；(C)氧氣比例太高，仍會加速熟成。"},{"id":"112-science-26","y":"112","n":26,"img":"112_science_q26","pk":"112_science","ans":"A"},{"id":"112-science-27","y":"112","n":27,"img":"112_science_q27","pk":"112_science","ans":"A","exp":"甲的燃燒：C 有 2 個、H 有 6 個，O 原子共 4＋3＝7 個，反應物氧氣只供應 6 個，故甲含 1 個 O，為 C₂H₆O（分子量 46，乙醇，醇類）。乙：H 有 4 個，O 原子 4＋2＝6 個剛好由氧氣供應，所以乙為 C₂H₄（分子量 28，烴類）。故甲分子量較大且可能是醇類。"},{"id":"112-science-28","y":"112","n":28,"img":"112_science_q28","pk":"112_science","ans":"A"},{"id":"112-science-29","y":"112","n":29,"img":"112_science_q29","pk":"112_science","ans":"B","exp":"海拔越高，氣壓越低；氣溫也隨高度升高而降低（每升高約 100 公尺降約 0.6℃）。所以 17:00 在武嶺時氣壓與氣溫都是最低，10:00 與 21:00 在臺中時氣壓最高，氣溫也較高。(A)(C)氣壓的變化與高度相反；(D)氣壓畫反。"},{"id":"112-science-30","y":"112","n":30,"img":"112_science_q30","pk":"112_science","ans":"C","exp":"黑麻油浮在水面，表示密度小於 1 g/cm³，同樣體積的質量會比 mL 前的數字小。乙牌 275 mL 卻只有 275 g，等於密度 1，不合理，g 前的數字應小於 mL 前的數字。(A)(B)c.c.與 mL 是體積單位，不是質量單位，且甲牌 260 c.c.對 240 g，密度小於 1，是合理的。"},{"id":"112-science-31","y":"112","n":31,"img":"112_science_q31","pk":"112_science","ans":"C","exp":"顯微鏡下的影像是上下左右顛倒的。培養皿往左移，視野中的影像會往右移，所以最右邊的血管先消失。血液由左側血管流入，經中間細管，再匯集到右側血管，左為小動脈、中間為微血管、右為小靜脈，因此消失順序為小靜脈、微血管、小動脈。"},{"id":"112-science-32","y":"112","n":32,"img":"112_science_q32","pk":"112_science","ans":"C","exp":"餐後口腔變酸，牙齒表面的 pH 會下降到 7 以下；咀嚼口香糖後唾液增加，把酸性中和，pH 又回到接近中性 7，所以曲線是先降後升回 7。(A)(B)pH 上升表示變成鹼性，不合；(D)原本的 pH 為 9，不是接近中性。"},{"id":"112-science-33","y":"112","n":33,"img":"112_science_q33","pk":"112_science","ans":"C","exp":"外力 200 gw 時木塊仍靜止，表示最大靜摩擦力至少 200 gw；外力 300 gw 時已經動起來，表示最大靜摩擦力小於 300 gw。運動後的動摩擦力為 250 gw，而最大靜摩擦力通常大於動摩擦力，所以 250 gw＜fs＜300 gw。"},{"id":"112-science-34","y":"112","n":34,"img":"112_science_q34","pk":"112_science","ans":"D","exp":"標示的 1200 W 就是最大功率，表示每秒消耗 1200 J 的電能。每分鐘是 60 秒，所以消耗的電能＝1200×60＝72000 J。(C)只是 1 秒的電能。"},{"id":"112-science-35","y":"112","n":35,"img":"112_science_q35","pk":"112_science","ans":"C"},{"id":"112-science-36","y":"112","n":36,"img":"112_science_q36","pk":"112_science","ans":"A","exp":"中午竿影消失，表示太陽直射該地。太陽直射只發生在南北回歸線之間，且 11 月底與 1 月底各一次，代表太陽直射點在這段時間經過該緯度，直射點此時位在南半球約南緯 20 度。甲在南緯 20 度左右，符合；乙在赤道，約 3、9 月各一次；丙在北半球，會在春夏出現；丁靠近南回歸線，一年只有一次。"},{"id":"112-science-37","y":"112","n":37,"img":"112_science_q37","pk":"112_science","ans":"B"},{"id":"112-science-38","y":"112","n":38,"img":"112_science_q38","pk":"112_science","ans":"D","exp":"軟骨發育不全由 F 引起，只要帶有一個 F 就會發病，是顯性遺傳。阿佑患病但父母都沒有病，父母都不含 F，基因型為 ff；阿佑的突變是新發生的。(A)(B)(C)只要有 F 的人都會發病，與父母未患病不合。"},{"id":"112-science-39","y":"112","n":39,"img":"112_science_q39","pk":"112_science","ans":"D","exp":"9 日有月食為農曆 15 日前後的滿月，23 日有日食為新月，兩者相差約 14 天，剛好半個月相週期。滿月前約 7 天（2 日）為上弦月，滿月後約 7 天（16 日）為下弦月，新月後約 7 天（30 日）為上弦月。(A)(B)(C)與此推算不合。"},{"id":"112-science-40","y":"112","n":40,"img":"112_science_q40","pk":"112_science","ans":"A","exp":"三氯化氮由氮氣和氯反應生成，但空氣中本來就有大量氮氣，一般泳池與氮氣長期接觸卻不會發生類似意外，所以三氯化氮不是這次昏迷的原因。(B)(D)反而支持三氯化氮是原因；(C)只是說明泳池有氯，並不能排除它。"},{"id":"112-science-41","y":"112","n":41,"img":"112_science_q41","pk":"112_science","ans":"A","exp":"丙難溶於水，所以步驟一加水過濾，丙留在濾紙上（○）；甲、乙溶於水，在濾液中（◆＋▲），步驟二再用沸點不同把兩者分離。(B)丙不會出現在濾液中；(C)(D)○是留下的難溶物，只可能是丙，不會是甲。"},{"id":"112-science-42","y":"112","n":42,"img":"112_science_q42","pk":"112_science","ans":"D","exp":"圖(二十六)、(二十七)中甲、乙都是並聯，乙的燈絲燒斷時甲都不受影響，仍會發亮，所以小明不合理。圖(二十六)的丙、丁是供應兩盞燈的共同導線，斷裂時甲也不亮；圖(二十七)中甲有自己的導線接電池，仍會亮，所以阿華合理。"},{"id":"112-science-43","y":"112","n":43,"img":"112_science_q43","pk":"112_science","ans":"A","pimg":"112_science_p43","grp":"112-science-43～44"},{"id":"112-science-44","y":"112","n":44,"img":"112_science_q44","pk":"112_science","ans":"D","pimg":"112_science_p43","grp":"112-science-43～44"},{"id":"112-science-45","y":"112","n":45,"img":"112_science_q45","pk":"112_science","ans":"C","pimg":"112_science_p45","grp":"112-science-45～46"},{"id":"112-science-46","y":"112","n":46,"img":"112_science_q46","pk":"112_science","ans":"B","pimg":"112_science_p45","grp":"112-science-45～46","exp":"圖(三十)中 Cp 的最大值約在 v₂/v₁＝0.33 處，約 0.59。v₁＝10 m/s，所以 v₂＝10×0.33≈3.3 m/s。(A)(D)在曲線兩端，Cp 為 0.5 或 0；(C)是 Cp 的數值 0.59，不是風速。"},{"id":"112-science-47","y":"112","n":47,"img":"112_science_q47","pk":"112_science","ans":"B","pimg":"112_science_p47","grp":"112-science-47～48","exp":"觀點①說清水浸泡時不加添加物效果較好。乙（不加）的抑制率 34.21％高於丁（加蔬果洗滌劑）的 18.42％，表示丁的農藥殘留較少，加添加物反而較好，所以觀點①不恰當。(A)乙、丙比較只支持①；(C)(D)甲、戊與乙、戊的比較都支持②，不是不恰當。"},{"id":"112-science-48","y":"112","n":48,"img":"112_science_q48","pk":"112_science","ans":"B","pimg":"112_science_p47","grp":"112-science-47～48"},{"id":"112-science-49","y":"112","n":49,"img":"112_science_q49","pk":"112_science","ans":"A","pimg":"112_science_p49","grp":"112-science-49～50","exp":"模擬地震參數得到的是當地可能的搖晃程度，也就是地面搖晃的強弱，與地震強度（震度）最直接相關。(B)規模代表地震釋放的總能量，與地點無關，不是各地的搖晃程度；(C)(D)位置與斷層類型不能直接表示某地搖晃多大。"},{"id":"112-science-50","y":"112","n":50,"img":"112_science_q50","pk":"112_science","ans":"C","pimg":"112_science_p49","grp":"112-science-49～50"},{"id":"113-science-1","y":"113","n":1,"img":"113_science_q01","pk":"113_science","ans":"B"},{"id":"113-science-2","y":"113","n":2,"img":"113_science_q02","pk":"113_science","ans":"B"},{"id":"113-science-3","y":"113","n":3,"img":"113_science_q03","pk":"113_science","ans":"C"},{"id":"113-science-4","y":"113","n":4,"img":"113_science_q04","pk":"113_science","ans":"C"},{"id":"113-science-5","y":"113","n":5,"img":"113_science_q05","pk":"113_science","ans":"A"},{"id":"113-science-6","y":"113","n":6,"img":"113_science_q06","pk":"113_science","ans":"C"},{"id":"113-science-7","y":"113","n":7,"img":"113_science_q07","pk":"113_science","ans":"A"},{"id":"113-science-8","y":"113","n":8,"img":"113_science_q08","pk":"113_science","ans":"C","exp":"地球自轉方向是由西向東（從北極上方看為逆時針）。美國正午時在向日面中央，隨自轉往逆時針方向轉動，會先到達日夜交界線，再進入夜晚，此處的人看到的就是夕陽西下，因此法國應在向日面與背日面的交界處。"},{"id":"113-science-9","y":"113","n":9,"img":"113_science_q09","pk":"113_science","ans":"A","exp":"醃漬時外界鹽濃度高於細胞內，水會由細胞內往外界流出，使細胞膜連同細胞質收縮而離開細胞壁。(B)(D)鹽無法大量通過細胞膜；(C)水流入細胞會使細胞脹大，不會出現這種情形。"},{"id":"113-science-10","y":"113","n":10,"img":"113_science_q10","pk":"113_science","ans":"D"},{"id":"113-science-11","y":"113","n":11,"img":"113_science_q11","pk":"113_science","ans":"B","exp":"到達平衡時，正反應與逆反應仍然持續進行，只是兩者速率相等，所以顏色不再改變。這是動態平衡，速率並不是 0，也不是反應停止。"},{"id":"113-science-12","y":"113","n":12,"img":"113_science_q12","pk":"113_science","ans":"D","exp":"Aa × Aa 的子代基因型比例為 AA：Aa：aa＝1：2：1，長翅（顯性）：短翅（隱性）約為 3：1。1000 隻應約有 750 隻長翅、250 隻短翅，與表中 400：600 差很多。"},{"id":"113-science-13","y":"113","n":13,"img":"113_science_q13","pk":"113_science","ans":"D","exp":"磁鐵進入線圈時，磁場方向相反，感應電流方向也相反。兩個磁鐵相同、落下高度相同，剛進入線圈時速度與磁通量變化快慢大致相同，所以感應電流大小大致相同。"},{"id":"113-science-14","y":"113","n":14,"img":"113_science_q14","pk":"113_science","ans":"B"},{"id":"113-science-15","y":"113","n":15,"img":"113_science_q15","pk":"113_science","ans":"D","exp":"等壓線只告訴我們各處的氣壓高低，有一條線的數值就能知道氣壓由高往低的方向，進而判斷風大致的方向。(A)等壓線密集表示氣壓變化大、風大，並非氣壓高；(B)等壓線只是連接氣壓相等的位置，不一定是最高處；(C)氣壓無法判斷溫度。"},{"id":"113-science-16","y":"113","n":16,"img":"113_science_q16","pk":"113_science","ans":"B"},{"id":"113-science-17","y":"113","n":17,"img":"113_science_q17","pk":"113_science","ans":"B","exp":"由實驗一可知 pH 值越小，酸性越強，牙齒重量減少的百分比越大。實驗二中乙杯重量減少最多，所以乙杯最酸，pH 值最小。"},{"id":"113-science-18","y":"113","n":18,"img":"113_science_q18","pk":"113_science","ans":"C"},{"id":"113-science-19","y":"113","n":19,"img":"113_science_q19","pk":"113_science","ans":"B","exp":"有機化合物一定含碳與氫。乙的 C 與 O 質量比換算成原子數比約為 1：2，可能是二氧化碳，沒有氫，不是有機物；丙只含碳，是碳單質，也不是有機物。甲（甲烷）與丁含碳、氫，可能是有機物。"},{"id":"113-science-20","y":"113","n":20,"img":"113_science_q20","pk":"113_science","ans":"C","exp":"要驗證「所有」都成立，只要找到一個反例就能推翻。若能在淡水中找到刺絲胞動物，就證明不是所有刺絲胞動物都生活在海洋中。(A)(B)(D)只是增加符合的例子，不能證明「全部」。"},{"id":"113-science-21","y":"113","n":21,"img":"113_science_q21","pk":"113_science","ans":"A","exp":"發芽比例是發芽數除以灑落種子數：甲＝100/500＝20%、乙＝80/400＝20%、丙＝80/350≈22.9%。所以甲、乙發芽比例相等，不能只看發芽數多寡比較。"},{"id":"113-science-22","y":"113","n":22,"img":"113_science_q22","pk":"113_science","ans":"C","exp":"形成層外圍的構造包含韌皮部，剝除後養分無法往下運送到根部，所以植物死亡。這種有形成層的莖是雙子葉植物的特徵；單子葉植物的維管束散生、沒有形成層，所以只有小書合理。"},{"id":"113-science-23","y":"113","n":23,"img":"113_science_q23","pk":"113_science","ans":"A","exp":"氫與金屬氧化物反應時，氫得到氧，被氧化；金屬氧化物失去氧，被還原，所以是氧化還原反應。(B)被氧化的是氫，不是礦物；(C)(D)這裡並沒有酸與鹼反應生成鹽和水。"},{"id":"113-science-24","y":"113","n":24,"img":"113_science_q24","pk":"113_science","ans":"C","exp":"圖中第二日 9 至 12 點太陽明亮面積暫時降為 0 又恢復，且天氣晴朗，這是日食，是月球擋住太陽，把影子投在地球上。日食發生在農曆初一（新月），不是十五；也與夏至、冬至白晝長短無關。"},{"id":"113-science-25","y":"113","n":25,"img":"113_science_q25","pk":"113_science","ans":"D"},{"id":"113-science-26","y":"113","n":26,"img":"113_science_q26","pk":"113_science","ans":"A","exp":"金屬球以感應起電帶正電後，用手觸摸接地，地球的電子會經由手流向金屬球，中和多餘的正電荷，使球不帶電。(B)移動的是電子，不是正電荷；(D)電子只會補到正負電相等為止。"},{"id":"113-science-27","y":"113","n":27,"img":"113_science_q27","pk":"113_science","ans":"A","exp":"冰在一大氣壓下熔點為 0°C，所以水平線段的溫度 T₁＝0。(B)t₁ 是時間，不是溫度；(C)t₂ 以後水沸騰變成水蒸氣，但仍有液態水；(D)t₁～t₂ 是冰熔化，固體與液體共存。"},{"id":"113-science-28","y":"113","n":28,"img":"113_science_q28","pk":"113_science","ans":"B","exp":"颱風與暖氣團中心氣壓不同：颱風是低氣壓，地面空氣由四周流入中心，屬於甲類。太平洋暖氣團與蒙古大陸冷氣團都是高氣壓，空氣由中心向外流出，應屬於乙類。所以只需把太平洋暖氣團移到乙類。"},{"id":"113-science-29","y":"113","n":29,"img":"113_science_q29","pk":"113_science","ans":"D","exp":"表（七）是不加熱、只靜置的對照，餘氯量會隨時間慢慢下降；表（八）有加熱，可與靜置的結果比較，才能判斷加熱是否有助降低餘氯量。(A)(B)兩個表中同時改變時間與溫度，單看一張表不能判斷；(C)表中沒有 10°C 的資料。"},{"id":"113-science-30","y":"113","n":30,"img":"113_science_q30","pk":"113_science","ans":"A","exp":"卵子是減數分裂後的生殖細胞，染色體數減半，每對同源染色體只留下 1 條。性染色體有 1 對（雌蛙為 XX），所以卵子內只有 1 條性染色體。"},{"id":"113-science-31","y":"113","n":31,"img":"113_science_q31","pk":"113_science","ans":"D","exp":"臺灣在北半球，正午太陽偏南，冬季太陽高度最低，陽光射入教室最深。直射範圍從第 1 排逐漸擴大到第 3 排，再縮回第 2 排，表示太陽高度由高變低再變高，最可能是冬至前後。"},{"id":"113-science-32","y":"113","n":32,"img":"113_science_q32","pk":"113_science","ans":"D","exp":"游泳池中安賽蜜總質量可由 2.1×10⁻⁷ g/L × 840000 L 算出，再除以尿液中安賽蜜的平均濃度，才能換算出尿液體積。所以空格最可能是加拿大人尿液中安賽蜜的平均濃度。"},{"id":"113-science-33","y":"113","n":33,"img":"113_science_q33","pk":"113_science","ans":"D","exp":"乙血管氧氣含量較高，是動脈（腎動脈），血液由乙流入丙（腎臟），再由腎靜脈甲流出。腎臟的功能是過濾血液形成尿液；尿素是在肝臟形成，不是在腎臟。"},{"id":"113-science-34","y":"113","n":34,"img":"113_science_q34","pk":"113_science","ans":"B","exp":"物體在水中所受浮力等於其重量。密度小於水的甲會浮起，其水下體積＝質量 20 g ÷ 1.0 ＝ 20 cm³；乙密度與水相同，會懸浮，30 cm³ 全部在水下；丙、丁下沉，水下體積分別為 20、10 cm³。所以乙最大。"},{"id":"113-science-35","y":"113","n":35,"img":"113_science_q35","pk":"113_science","ans":"C"},{"id":"113-science-36","y":"113","n":36,"img":"113_science_q36","pk":"113_science","ans":"B"},{"id":"113-science-37","y":"113","n":37,"img":"113_science_q37","pk":"113_science","ans":"B","exp":"兩反應都產生 2.0 g（1 莫耳）氫氣，表示都消耗相同量的鹽酸（2 莫耳 HCl，質量相同）。但甲、乙金屬質量不同，生成的金屬氯化物質量等於金屬質量加上氯的質量，所以產物總質量不同。"},{"id":"113-science-38","y":"113","n":38,"img":"113_science_q38","pk":"113_science","ans":"D","exp":"外力對木塊作功 W＝F×S，轉換成動能。F 與 S 都不變，動能就不變，與木塊質量無關。小明、小華只改變質量，木塊動能仍然相同，所以兩人都不合理。"},{"id":"113-science-39","y":"113","n":39,"img":"113_science_q39","pk":"113_science","ans":"C"},{"id":"113-science-40","y":"113","n":40,"img":"113_science_q40","pk":"113_science","ans":"B"},{"id":"113-science-41","y":"113","n":41,"img":"113_science_q41","pk":"113_science","ans":"D","exp":"10:30 起溫度升到 85°C，酵素 X 超過 75°C 失去功能，不再催化。降溫回 35°C 後酵素也無法恢復，所以 10:50 與 11:00 物質乙的量都不再增加，兩者最相近。"},{"id":"113-science-42","y":"113","n":42,"img":"113_science_q42","pk":"113_science","ans":"C","pimg":"113_science_p42","grp":"113-science-42～43"},{"id":"113-science-43","y":"113","n":43,"img":"113_science_q43","pk":"113_science","ans":"D","pimg":"113_science_p42","grp":"113-science-42～43"},{"id":"113-science-44","y":"113","n":44,"img":"113_science_q44","pk":"113_science","ans":"A","pimg":"113_science_p44","grp":"113-science-44～45"},{"id":"113-science-45","y":"113","n":45,"img":"113_science_q45","pk":"113_science","ans":"B","pimg":"113_science_p44","grp":"113-science-44～45"},{"id":"113-science-46","y":"113","n":46,"img":"113_science_q46","pk":"113_science","ans":"D","pimg":"113_science_p46","grp":"113-science-46～48","exp":"圖中 2021 年住宅用電為 52729 億度，即 52729×10⁸ 度＝5.2729×10⁴×10⁸＝5.2729×10¹² 度。注意單位是億度，要乘上 10⁸。"},{"id":"113-science-47","y":"113","n":47,"img":"113_science_q47","pk":"113_science","ans":"A","pimg":"113_science_p46","grp":"113-science-46～48","exp":"要找冷氣時與住宅用電同升同降的資料。2017～2018 年兩者都下降，符合說法。(B)2020～2021 年冷氣時略降但用電上升；(C)(D)最低、最高年分都沒有對應。"},{"id":"113-science-48","y":"113","n":48,"img":"113_science_q48","pk":"113_science","ans":"C","pimg":"113_science_p46","grp":"113-science-46～48"},{"id":"113-science-49","y":"113","n":49,"img":"113_science_q49","pk":"113_science","ans":"C","pimg":"113_science_p49","grp":"113-science-49～50"},{"id":"113-science-50","y":"113","n":50,"img":"113_science_q50","pk":"113_science","ans":"C","pimg":"113_science_p49","grp":"113-science-49～50","exp":"CO₂ 的變化量為 5～10 ppm，約占 2～3%。但大氣中 O₂ 濃度比 CO₂ 高很多（約 21%），光合作用產生的 O₂ 量與消耗的 CO₂ 量相近，所以 O₂ 的變化百分比會比 2～3% 小很多。(A)(B)的分子量大小與百分比無關。"},{"id":"114-science-1","y":"114","n":1,"img":"114_science_q01","pk":"114_science","ans":"C","exp":"超聲波（超音波）是頻率高於20000 Hz的聲波，超過人耳能聽到的範圍，所以孕婦聽不見。聽不見是因為頻率太高，與波速無關。","goal":"能知道超聲波的定義","pr":81},{"id":"114-science-2","y":"114","n":2,"img":"114_science_q02","pk":"114_science","ans":"B","exp":"密度＝質量÷體積。用甲（天平）測質量，用丙（量筒，排水法）測形狀不規則石頭的體積。丁（直尺）無法量不規則物體的體積；乙是收集氣體的裝置。","goal":"能知道測量物質密度所需的實驗器材","pr":81},{"id":"114-science-3","y":"114","n":3,"img":"114_science_q03","pk":"114_science","ans":"A","exp":"白尾八哥和麻雀築巢位置、食物種類相近，彼此爭奪資源，是「競爭」；白尾八哥會吃麻雀幼鳥，是「掠食」。","goal":"能了解生物間的交互作用關係","pr":90},{"id":"114-science-4","y":"114","n":4,"img":"114_science_q04","pk":"114_science","ans":"A","exp":"硫磺是元素，只含硫一種原子；笑氣（N₂O）是化合物，含氮、氧兩種原子；花岡岩是混合物，含多種礦物、多種原子。所以笑氣＞硫磺。","goal":"能了解元素、化合物、混合物的差異","pr":68},{"id":"114-science-5","y":"114","n":5,"img":"114_science_q05","pk":"114_science","ans":"D","exp":"暖空氣較輕，會沿著鋒面被抬升，成雲致雨。圖中乙側的空氣沿鋒面往上爬，是暖空氣；甲側在鋒面下方，是較重的冷空氣。","goal":"能知道鋒面的形式以及鋒面兩側的空氣性質","pr":70},{"id":"114-science-6","y":"114","n":6,"img":"114_science_q06","pk":"114_science","ans":"A","exp":"過度抽取地下水，地下含水層被壓縮，造成地層下陷，使建築物高度出現落差。(B)(C)是土石流、山崩；(D)是地震。","goal":"能知道超抽地下水可能造成的災害","pr":95},{"id":"114-science-7","y":"114","n":7,"img":"114_science_q07","pk":"114_science","ans":"B","exp":"網路說法認為只有端午節正午太陽直射北半球時才能立蛋。若用同一種生雞蛋，在聖誕節（太陽直射南半球）正午的臺灣也能立起來，就能推翻這個說法。(A)把蛋煮熟改變了其他條件，不適合比較。","goal":"能運用邏輯思辯能力來反駁他人的說法","pr":78},{"id":"114-science-8","y":"114","n":8,"img":"114_science_q08","pk":"114_science","ans":"A","exp":"甲部位照光呈綠色，有葉綠素，可以行光合作用釋出氧氣；乙部位沒有照光、呈白色，不能行光合作用。兩個部位都會行呼吸作用釋出二氧化碳。","goal":"能了解光合作用與呼吸作用","pr":68},{"id":"114-science-9","y":"114","n":9,"img":"114_science_q09","pk":"114_science","ans":"D","exp":"鉛筆靜止，所受合力為零，所以 F右＝F左＝1 N。F右′ 是 F右 的反作用力，作用力與反作用力大小相等，F右′＝F右＝1 N。","goal":"能了解牛頓第三運動定律與力平衡的概念","pr":75},{"id":"114-science-10","y":"114","n":10,"img":"114_science_q10","pk":"114_science","ans":"B","exp":"靜電力與距離平方成反比。甲、乙距離從2 m變1 m，F甲乙變為4倍，變大；乙、丙距離從1 m變2 m，F乙丙變為1/4，變小。","goal":"能了解庫倫定律的意義","pr":72},{"id":"114-science-11","y":"114","n":11,"img":"114_science_q11","pk":"114_science","ans":"C","exp":"每1000 g溶液含30 mg，30 mg÷1000 g＝30÷1000000，也就是百萬分之三十，即 30 ppm。","goal":"能了解ppm等濃度的表示法","pr":71},{"id":"114-science-12","y":"114","n":12,"img":"114_science_q12","pk":"114_science","ans":"C","exp":"兩人都是看到明星（受器是眼睛），經大腦判斷後做出反應，控制的中樞都是大腦，所以(C)正確。(A)受器是眼睛，不是嘴巴和腳；(B)尖叫也需要肌肉；(D)兩人都同時需要感覺神經和運動神經。","goal":"能了解神經傳導途徑","pr":70},{"id":"114-science-13","y":"114","n":13,"img":"114_science_q13","pk":"114_science","ans":"D","exp":"臺北冬天受東北季風影響，陽臺朝北、東北會被雨打到。高雄冬季位在東北季風的背風面，天氣較乾燥，所以這個建議不適用於高雄。(A)臺南冬季也在背風面，偏乾；(B)基隆、(C)宜蘭冬季位在迎風面，偏溼。","goal":"能根據季風的特性了解不同位置的降雨情形","pr":70},{"id":"114-science-14","y":"114","n":14,"img":"114_science_q14","pk":"114_science","ans":"C","exp":"在紅光下呈紅色，表示會反射紅光，在白光下可能是紅色或白色等；呈黑色表示不反射紅光，在白光下可能是黑、綠、藍等。所以最多只有兩顆是白球。(A)兩顆可能都是白球；(B)第三顆可能是綠色；(D)最多只有一顆綠球。","goal":"能應用顏色相關的光學概念","pr":67},{"id":"114-science-15","y":"114","n":15,"img":"114_science_q15","pk":"114_science","ans":"B","exp":"板塊在軟流圈上緩慢移動，使陸地和海底的地形隨之改變。(A)板塊交界和海陸交界不一定吻合；(C)不是每個交界都有山脈；(D)交界有聚合、張裂、錯動等不同類型，不全是中洋脊。","goal":"能知道板塊與板塊運動的相關概念","pr":74},{"id":"114-science-16","y":"114","n":16,"img":"114_science_q16","pk":"114_science","ans":"C","exp":"地層未翻轉，下面的地層較老。石灰岩在火山灰岩層（8百萬年前）的下方，一定比8百萬年前更早形成，不可能在7百萬年前形成，所以(C)最不合理。","goal":"能根據地層剖面中的資訊做出合理的推論","pr":68},{"id":"114-science-17","y":"114","n":17,"img":"114_science_q17","pk":"114_science","ans":"A","exp":"Ca²⁺ 質子數 w＝20，失去2個電子，電子數 y＝18；Cl⁻ 質子數 x＝17，得到1個電子，電子數 z＝18。w(20)＞z(18)，所以(A)正確。","goal":"能了解離子含有的質子數和電子數","pr":66},{"id":"114-science-18","y":"114","n":18,"img":"114_science_q18","pk":"114_science","ans":"C","exp":"圖中外力小於400 gw時，摩擦力等於外力，是靜摩擦力，外力越小、靜摩擦力也越小。(A)最大靜摩擦力是400 gw；(B)外力超過400 gw才會開始運動；(D)動摩擦力固定為300 gw。","goal":"能了解摩擦力的相關概念","pr":59},{"id":"114-science-19","y":"114","n":19,"img":"114_science_q19","pk":"114_science","ans":"C","exp":"二氧化碳溶於水後，與岩層中的鈣、鎂離子反應，形成難溶於水的碳酸鈣、碳酸鎂沉澱，「固化」填充在岩層空隙中。","goal":"能從資料中解讀出所對應的二氧化碳性質","pr":60},{"id":"114-science-20","y":"114","n":20,"img":"114_science_q20","pk":"114_science","ans":"B","exp":"吃甲之後血糖上升得比較快、比較高，身體會更早分泌胰島素來降低血糖。升糖素是血糖太低時才分泌的。","goal":"能依據血糖恆定概念判斷圖表資訊","pr":55},{"id":"114-science-21","y":"114","n":21,"img":"114_science_q21","pk":"114_science","ans":"D","exp":"比較兩張圖，三種材質在70℃時的質量變化率都比50℃時大，耗損率較高。(A)PET 變化率最大，最不適合；(B)PP 變化率最小，最適合；(C)資料沒有提到鏈狀、網狀結構。","goal":"能正確地解讀科學資料","pr":65},{"id":"114-science-22","y":"114","n":22,"img":"114_science_q22","pk":"114_science","ans":"C","exp":"蒸散作用散失的水分，是由木質部從根往上運輸的。雙子葉植物莖的維管束中，木質部在內側（乙），韌皮部在外側（甲）負責運輸養分。","goal":"能了解植物莖橫切面特徵，並依功能進行推論","pr":65},{"id":"114-science-23","y":"114","n":23,"img":"114_science_q23","pk":"114_science","ans":"B","exp":"等壓線越密集、相鄰兩線的氣壓差越大，風速越大。(B)每條線相差8百帕（1008、1000、992），氣壓梯度最大，風速最大。","goal":"能根據天氣圖上的氣壓差來推論該地的風速大小","pr":50},{"id":"114-science-24","y":"114","n":24,"img":"114_science_q24","pk":"114_science","ans":"A","exp":"同一科一定同一目，表中有3個科，最多3個目。學名第一個字是屬名：Mareca、Aythya、Phalacrocorax、Pelecanus，共4個屬。","goal":"能根據有限的分類資訊進行合理推論","pr":56},{"id":"114-science-25","y":"114","n":25,"img":"114_science_q25","pk":"114_science","ans":"B","exp":"大銅/大鋅的電功率1.58 mW。把正極（銅）換小，降到0.62 mW；把負極（鋅）換小，降到1.37 mW。正極面積改變造成的影響較大。","goal":"能依據實驗結果與鋅銅電池的概念做出合理的推論","pr":53},{"id":"114-science-26","y":"114","n":26,"img":"114_science_q26","pk":"114_science","ans":"D","exp":"比熱比較要用相同質量、相同加熱條件。吸收相同熱量時，溫度上升越快的比熱越小。熔化先後還和熔點有關，不能用來比較比熱。","goal":"能應用比熱概念設計實驗","pr":62},{"id":"114-science-27","y":"114","n":27,"img":"114_science_q27","pk":"114_science","ans":"D","exp":"甲可換不同倍率的鏡片（物鏡）、乙可調整清晰度（調節輪）、丙放樣本（載物臺），功能都和現代顯微鏡相同。丁是調整角度讓光線射入的反光鏡，現代顯微鏡的光圈則是調整光線多寡，差異最大。","goal":"能將對顯微鏡的理解類推到陌生的情境","pr":42},{"id":"114-science-28","y":"114","n":28,"img":"114_science_q28","pk":"114_science","ans":"B","exp":"綠茶茶水和維生素C一樣，能使碘液棕色消失，表示碘被還原，茶水中必有能被氧化的物質（還原劑）。但不一定就是維生素C。","goal":"能依據實驗結果與氧化還原反應的概念做出合理的推論","pr":57},{"id":"114-science-29","y":"114","n":29,"img":"114_science_q29","pk":"114_science","ans":"D","exp":"X 在下層，密度比 Y 大。三管總體積都是10 mL，X 越多總質量越大：丙（X 7 mL）＞甲（X 5 mL）＞乙（X 3 mL）。","goal":"能運用密度概念以解決問題","pr":54},{"id":"114-science-30","y":"114","n":30,"img":"114_science_q30","pk":"114_science","ans":"A","exp":"黑眼睛的甲、乙生出紅眼睛（aa）子代，表示兩者都帶有隱性因子 a，基因型都是 Aa，一定相同。黑眼睛的丙、丁可能是 AA 或 Aa。","goal":"能應用孟德爾遺傳研究的相關概念進行推論","pr":63},{"id":"114-science-31","y":"114","n":31,"img":"114_science_q31","pk":"114_science","ans":"A","exp":"銅線南北放置，通電後磁針會偏向東西方向。磁針放在導線上方和下方時，磁場方向相反，偏轉方向也相反；乙組多一顆電池、電流較大，偏轉角度也較大。符合的是(A)。","goal":"能應用安培右手定則","pr":47},{"id":"114-science-32","y":"114","n":32,"img":"114_science_q32","pk":"114_science","ans":"B","exp":"反應式為 2H₂S＋SO₂ → 2H₂O＋3S。64 g 的 SO₂（1莫耳）會和 68 g H₂S 反應，剩下 2 g H₂S，SO₂ 用完；生成 36 g 水和 96 g 硫，加上原本的 2 g，硫共 98 g。(B) 符合，總質量也和反應前一樣是136 g（質量守恆）。","goal":"能了解化學反應式與質量守恆的概念","pr":47},{"id":"114-science-33","y":"114","n":33,"img":"114_science_q33","pk":"114_science","ans":"D","exp":"斷層面是傾斜的，震源在斷層面上，震央在震源正上方，所以斷層面會往震央那一側向下傾斜。不論正斷層或逆斷層，從與震央同側的乙處往下鑽，才能鑽到斷層面。","goal":"能根據震央位置推論斷層面的位置","pr":43},{"id":"114-science-34","y":"114","n":34,"img":"114_science_q34","pk":"114_science","ans":"D","exp":"甲有細胞核、有菌絲、沒有葉綠素，屬於真菌界；乙沒有細胞核、有葉綠素，是原核生物（如藍綠菌），屬於原核生物界。","goal":"能依據生物的特徵進行分類","pr":53},{"id":"114-science-35","y":"114","n":35,"img":"114_science_q35","pk":"114_science","ans":"A","exp":"葉片繁殖出幼苗、種子萌芽長成幼苗，都是細胞數量增加的生長過程，進行的是細胞分裂（甲：染色體數目不變）。乙是減數分裂，只在產生配子時發生。","goal":"能了解細胞分裂的種類，並依條件進行歸類","pr":33},{"id":"114-science-36","y":"114","n":36,"img":"114_science_q36","pk":"114_science","ans":"A","exp":"碘液變色表示還有澱粉，本氏液變色表示有糖。甲有澱粉、沒有糖，澱粉完全沒被分解，酵素已失去作用。乙澱粉被分解完、有糖；丙兩種都有，酵素仍有部分作用。","goal":"能利用試劑檢測結果，推論澱粉酶活性","pr":42},{"id":"114-science-37","y":"114","n":37,"img":"114_science_q37","pk":"114_science","ans":"B","exp":"火星運行到太陽另一側時，太陽會位在地球與火星之間。(A)地球在金星、水星軌道外側，不會在兩者之間；(C)金星、水星分別在太陽兩側時，太陽就在兩者之間；(D)火星在太陽另一側時，地球可能在火星與木星之間。","goal":"能根據太陽系行星的排列順序推論不同行星的位置關係","pr":47},{"id":"114-science-38","y":"114","n":38,"img":"114_science_q38","pk":"114_science","ans":"C","exp":"檢測不同電扇的風速時，規定電扇距地面、距牆面的位置，是讓這些條件都相同，增加控制變因，比較才公平。","goal":"能應用變因概念分析資訊，找出其中隱含的意義","pr":41},{"id":"114-science-39","y":"114","n":39,"img":"114_science_q39","pk":"114_science","ans":"C","exp":"v-t 圖的斜率是加速度。0～4秒加速度4 m/s²，4～6秒等速、加速度0，6～10秒加速度－4 m/s²。合力＝質量×加速度，所以 F₂＝F₇（大小相同），F₅＝0，F₂＝F₇＞F₅。","goal":"能統整力學相關概念","pr":43},{"id":"114-science-40","y":"114","n":40,"img":"114_science_q40","pk":"114_science","ans":"A","exp":"冰塊使瓶內上方溫度降低，水蒸氣凝結，瓶內氣壓降低，水的沸點跟著降低，水又汽化沸騰冒出氣泡，達到新的平衡。這是物理變化，水沒有分解。","goal":"能了解溫度會影響物質的狀態，也會影響平衡","pr":46},{"id":"114-science-41","y":"114","n":41,"img":"114_science_q41","pk":"114_science","ans":"D","exp":"圖中液化氫在橫軸最右邊（單位質量能量最多），在縱軸最低（單位體積能量最少）。產生相同能量時，需要的液化氫質量最少（較輕），但體積最大（占空間大）。","goal":"能了解圖表資訊並進一步指出液化氫的特點","pr":31},{"id":"114-science-42","y":"114","n":42,"img":"114_science_q42","pk":"114_science","ans":"B","exp":"「度」就是 kWh。產生的電能0.021 kWh＝0.021度，電費＝0.021×3 元。","goal":"能應用電功率相關概念以計算電費","pr":37},{"id":"114-science-43","y":"114","n":43,"img":"114_science_q43","pk":"114_science","ans":"D","pimg":"114_science_p43","grp":"114-science-43～44","exp":"實驗一全程10℃，到第15天才全部變色；實驗二全程25℃，第5天仍0%；先在－13℃或10℃放3天、再改25℃，第5天就有96%～100%變色。可見先低溫處理再改25℃能加快變色。","goal":"能依據實驗內容找出適合蒜頭變色的操作變因","pr":59},{"id":"114-science-44","y":"114","n":44,"img":"114_science_q44","pk":"114_science","ans":"C","pimg":"114_science_p43","grp":"114-science-43～44","exp":"四種溶液 pH 值都調成3.0，酸性相同。食醋（醋酸）和甲酸都含 –COOH 原子團，蒜頭會變色；鹽酸和硫酸沒有，蒜頭不變色。所以有 –COOH 的環境有利蒜頭變綠。","goal":"能依據實驗內容，並應用pH值與有機酸的概念做出合理的推論","pr":42},{"id":"114-science-45","y":"114","n":45,"img":"114_science_q45","pk":"114_science","ans":"D","pimg":"114_science_p45","grp":"114-science-45～46","exp":"每30秒用濾紙接觸一次，圖中的出血點超過10個，表示出血時間超過5分鐘，屬於「過長」，可能罹患X減少症或其他凝血因子異常。","goal":"能依據出血時間檢查的操作，評量學生能否正確解讀資訊","pr":65},{"id":"114-science-46","y":"114","n":46,"img":"114_science_q46","pk":"114_science","ans":"D","pimg":"114_science_p45","grp":"114-science-45～46","exp":"與凝血有關、數量減少會使出血時間過長的血球成分，是血小板。","goal":"能了解血球功能，並用於推論相關疾病","pr":72},{"id":"114-science-47","y":"114","n":47,"img":"114_science_q47","pk":"114_science","ans":"B","pimg":"114_science_p47","grp":"114-science-47～48","exp":"由圖(二十九)，砝碼200 g時彈簧秤讀數 F＝150 gw。拉力作功＝F×彈簧秤移動距離＝150×10＝1500 gw．cm。","goal":"能統整簡單機械與作功概念","pr":42},{"id":"114-science-48","y":"114","n":48,"img":"114_science_q48","pk":"114_science","ans":"D","pimg":"114_science_p47","grp":"114-science-47～48","exp":"動滑輪省力一半，但彈簧秤除了拉砝碼，也要拉起動滑輪本身。F＝(M＋動滑輪質量)÷2，所以 M＝0 時 F 不是0，直線不通過原點。","goal":"能分析實驗數據，找出其中隱含的資訊","pr":54},{"id":"114-science-49","y":"114","n":49,"img":"114_science_q49","pk":"114_science","ans":"C","pimg":"114_science_p49","grp":"114-science-49～50","exp":"太陽光方向是固定的，月球受光的亮面在甲、乙兩處都應朝向同一個方向（朝向太陽），且與地月連線垂直，從地球看才會是一半亮的上弦月和下弦月。符合的是(C)。","goal":"能根據月相形成的原因推論太陽的相對位置","pr":37},{"id":"114-science-50","y":"114","n":50,"img":"114_science_q50","pk":"114_science","ans":"B","pimg":"114_science_p49","grp":"114-science-49～50","exp":"上弦月（約農曆初八）到下弦月（約農曆二十二、三）大約相隔15天，地球每天自轉一圈，所以大約自轉了15圈。","goal":"能根據月相變化的規律推論其變化日期","pr":53},{"id":"115-science-1","y":"115","n":1,"img":"science_q01","pk":"115_science","ans":"A","exp":"指針偏左表示左邊較重。歸零時要調整校準螺絲：把左邊的螺絲向內旋入（靠近支點），左邊的力矩變小，指針就會回到中央。放秤量紙會讓左邊更重；不能用砝碼夾撥指針。","goal":"能知道上皿天平的歸零方法","pr":80},{"id":"115-science-2","y":"115","n":2,"img":"science_q02","pk":"115_science","ans":"C","exp":"有良好的導電性、導熱性和延展性，可拉成細絲、壓成箔片，是金屬的特性。題目說的是「它」這種元素（例如銅），在自然界多以化合物存在，但它本身是金屬元素。","goal":"能知道金屬元素的性質","pr":87},{"id":"115-science-3","y":"115","n":3,"img":"science_q03","pk":"115_science","ans":"B","exp":"同一族的元素最外層電子排列相似，所以化學性質相似。鈍氣都很穩定、不容易起反應。(A)鈍氣常溫下是氣體，熔點很低；(C)沸點、密度等物理性質不同；(D)鈍氣是單原子分子。","goal":"能知道週期表中同族元素具有相似的化學性質","pr":74},{"id":"115-science-4","y":"115","n":4,"img":"science_q04","pk":"115_science","ans":"B","exp":"圖例：2015 淺灰線、2016 黑線、2017 虛線。2018 年的海岸線比 2017 年的虛線更靠海的一側，表示 2017 到 2018 年海岸線往海的方向擴張（沉積較多）。","goal":"能應用資訊，了解地貌改變的結果與原因","pr":82},{"id":"115-science-5","y":"115","n":5,"img":"science_q05","pk":"115_science","ans":"C","exp":"把方格當坐標，鏡子在左邊、牆在上方（牆長5格）。利用反射定律（入射角＝反射角），T→R：T 在距鏡4格、距牆5格，R 距牆3格，光每往左4格上升2格，反射後每往右4格再上升2格，到達牆的高度時已在距鏡6格處，超過牆的長度，所以照不到牆。其他三種方式反射後都會打到牆上。","goal":"能應用反射定律","pr":76},{"id":"115-science-6","y":"115","n":6,"img":"science_q06","pk":"115_science","ans":"D","exp":"圖(四)的比例尺 20 μm，灰色斑塊大小約 10～20 μm。對照圖(三)，細胞是 10～30 μm；血紅素、病毒是奈米等級，粒線體約 1 μm，在這個倍率下看不到。所以灰色斑塊是一個細胞。","goal":"能利用比例尺判斷物體實際尺寸","pr":87},{"id":"115-science-7","y":"115","n":7,"img":"science_q07","pk":"115_science","ans":"B","exp":"看電路：上方燈泡和下方「A₂＋燈泡」兩條支路並聯，並聯後再和「A₁＋燈泡」串聯，A₃ 也在同一條幹線上。串聯電路各處電流相同，A₁ 和 A₃ 都測總電流，所以 A₃＝A₁＝500 mA（A₂ 只測其中一條支路的 300 mA，另一支路是 200 mA）。","goal":"能知道串並聯電路中的電流運作情形","pr":64},{"id":"115-science-8","y":"115","n":8,"img":"science_q08","pk":"115_science","ans":"C","exp":"跑馬燈顯示「可能震度4級，到達時間約13秒後」，表示劇烈搖晃前約有13秒可以避難。(A)13秒是到達時間不是搖晃時間；(B)震度是學校當地的估計；(D)震度不是規模。","goal":"能知道地震資訊所代表的意義","pr":90},{"id":"115-science-9","y":"115","n":9,"img":"science_q09","pk":"115_science","ans":"C","exp":"室外暖濕的空氣吹進室內，遇到溫度較低的磁磚牆面，空氣中的水蒸氣遇冷「凝結」成小水珠，這就是返潮。","goal":"能知道溫度會影響物質的狀態","pr":76},{"id":"115-science-10","y":"115","n":10,"img":"science_q10","pk":"115_science","ans":"A","exp":"甲是大腦，聽到槍聲的「聽覺」在大腦產生。乙是小腦，負責維持平衡；丙是腦幹，調節呼吸、心跳；丁是脊髓。所以只有(A)正確。","goal":"能知道人體神經系統的運作方式","pr":62},{"id":"115-science-11","y":"115","n":11,"img":"science_q11","pk":"115_science","ans":"C","exp":"動作甲肺中氣體量多，是盡力吸氣後：橫膈下降、肋骨上舉，胸腔變大。動作乙氣體量少，是盡力呼氣後：橫膈上升、肋骨下降，胸腔變小，所以(C)正確。","goal":"能判讀實驗數據推論人體胸腔的變化","pr":67},{"id":"115-science-12","y":"115","n":12,"img":"science_q12","pk":"115_science","ans":"D","exp":"反應速率要比較「在一定時間內」產物的多少，或「完成反應所需的時間」。實驗只記錄最後的肥皂質量，沒有記錄各組反應花了多少時間，所以無法知道鹼的濃度和反應速率的關係。","goal":"能知道所提供的資料是否足以判斷反應速率","pr":63},{"id":"115-science-13","y":"115","n":13,"img":"science_q13","pk":"115_science","ans":"B","exp":"育種時讓具有某些特徵的植株「雜交」，經由花（生殖器官）授粉產生種子，是有性生殖。子代的基因型、表現型會與親代不同，玉米粒才會慢慢改變。","goal":"能知道遺傳變異的產生有多種途徑，並能分辨之","pr":56},{"id":"115-science-14","y":"115","n":14,"img":"science_q14","pk":"115_science","ans":"C","exp":"第8～14天看到的是左半邊亮、逐漸變細的月亮，是下弦月到殘月（農曆約22～29日）。往前推7天，前7天應該是從滿月慢慢虧缺到下弦月（左側亮的凸月），也就是(C)。","goal":"能了解月相變化的規律","pr":81},{"id":"115-science-15","y":"115","n":15,"img":"science_q15","pk":"115_science","ans":"B","exp":"滿潮與下一次滿潮約相隔12小時25分，每天的漲退潮時間約延後50分鐘。當天17:00滿潮，隔天約5:25滿潮、約11:35乾潮，退潮期間的一半約在8:30左右，所以選上午8～9點。","goal":"能應用潮汐週期判斷漲退潮","pr":47},{"id":"115-science-16","y":"115","n":16,"img":"science_q16","pk":"115_science","ans":"A","exp":"小忠想呈現的是打鼾聲「很大聲」，聲音的大小（響度）用分貝（dB）表示。Hz 是頻率（音調高低），340 m/s 是聲速，0.004秒是週期，都不能說明很吵。","goal":"能知道聲學中分貝的意義","pr":70},{"id":"115-science-17","y":"115","n":17,"img":"science_q17","pk":"115_science","ans":"A","exp":"恆星是能自行發光發熱的星體，所以方式一正確。方式二錯誤：例如月球繞地球公轉，但地球不是恆星。","goal":"能知道恆星與其他星體的區分方法","pr":67},{"id":"115-science-18","y":"115","n":18,"img":"science_q18","pk":"115_science","ans":"A","exp":"排水法要測不溶於水、不和水反應、會沉入水中的物體。銅片符合。鉀會和水劇烈反應；食鹽、葡萄糖會溶於水，都不適合。","goal":"能知道適合以排水法來測量體積的物質","pr":60},{"id":"115-science-19","y":"115","n":19,"img":"science_q19","pk":"115_science","ans":"D","exp":"CH₄＋2O₂→CO₂＋2H₂O，1個甲烷分子產生1個二氧化碳分子。要把1公噸甲烷換算成二氧化碳的質量，需要兩者的分子量：CH₄＝16，CO₂＝44，1公噸甲烷約產生 44/16＝2.75 公噸二氧化碳。","goal":"能依據情境推知要算出二氧化碳排放量所需的資訊","pr":66},{"id":"115-science-20","y":"115","n":20,"img":"science_q20","pk":"115_science","ans":"C","exp":"過濾體內液體、再吸收有用物質、排出多餘的含氮廢物，就是人體腎臟的功能（過濾、再吸收、形成尿液）。","goal":"能了解人體器官的功能，並依此類推其他動物的相似器官","pr":52},{"id":"115-science-21","y":"115","n":21,"img":"science_q21","pk":"115_science","ans":"D","exp":"捉放法：池中鯉魚總數 N，50/N＝5/50，N＝500隻，扣掉放入的50隻紅鯉魚，黑鯉魚 X＝450隻。捉放法是用抽樣估算，所以是「可能數量」，不一定是實際數量。","goal":"能了解族群調查的方式及限制","pr":55},{"id":"115-science-22","y":"115","n":22,"img":"science_q22","pk":"115_science","ans":"D","exp":"論點二只說「兩側距支點相同距離吊相同質量會平衡」。實驗四兩側砝碼的位置和數量不同、卻仍保持平衡，這種情況不在論點二的說明範圍內，所以無法用論點二解釋；但也不能因此證明論點二錯誤。","goal":"能評估簡單模型的適用性","pr":63},{"id":"115-science-23","y":"115","n":23,"img":"science_q23","pk":"115_science","ans":"C","exp":"要找出影響乾燥速率的變因，每次比較只能改變一個變因。第二組（熱水、沒加鹽）和第三組（冷水、加鹽）同時改變了水溫和加鹽兩個變因，無法判斷是哪一個造成差異。","goal":"能了解實驗的操縱變因","pr":60},{"id":"115-science-24","y":"115","n":24,"img":"science_q24","pk":"115_science","ans":"D","exp":"光合作用：水＋二氧化碳（甲）→ 氧氣＋葡萄糖＋水。甲是二氧化碳，從空氣經氣孔進入，不是從土壤吸收；氧氣主要由葉子的氣孔排出。葡萄糖和氧氣都可以作為呼吸作用的反應物，所以(D)合理。呼吸作用的產物是二氧化碳和水，與乙不同。","goal":"能理解呼吸作用及光合作用","pr":56},{"id":"115-science-25","y":"115","n":25,"img":"science_q25","pk":"115_science","ans":"B","exp":"兩袋黑白棋各半，相當於兩個雜合（Aa）親代交配。子代 AA：Aa：aa＝1：2：1，黑色（AA、Aa）約占 3/4，白色約占 1/4。100次約 75 黑、25 白，最接近 78、22。","goal":"能應用遺傳法則對實驗結果進行預測","pr":53},{"id":"115-science-26","y":"115","n":26,"img":"science_q26","pk":"115_science","ans":"A","exp":"圖中是紅海，兩側陸地距離逐年增加，是張裂性板塊交界。張裂處地函物質上升，岩漿湧出冷卻形成火成岩（玄武岩）。(B)新形成的海洋地殼很年輕；(C)兩側在不同板塊；(D)海溝在聚合性交界。","goal":"能根據資訊，推論板塊相互分離時可能的特徵","pr":44},{"id":"115-science-27","y":"115","n":27,"img":"science_q27","pk":"115_science","ans":"A","exp":"氣溫在對流層隨高度增加而降低，在平流層則隨高度增加而上升，所以用甲圖（氣溫–高度）可以區分。氣壓在兩層都隨高度增加而降低，乙圖無法區分。","goal":"能區分不同大氣分層的特性","pr":56},{"id":"115-science-28","y":"115","n":28,"img":"science_q28","pk":"115_science","ans":"C","exp":"延長線上的壓鈕等同無熔絲開關，是保護延長線本身。延長線上同時插很多電器時，流經延長線的總電流變大，超過延長線能負荷的最大電流就叫超載，壓鈕會跳起斷電。","goal":"能了解無熔絲開關的功能","pr":55},{"id":"115-science-29","y":"115","n":29,"img":"science_q29","pk":"115_science","ans":"C","exp":"穿山龍有花、種子，是開花植物（被子植物），被子植物的種子包在果實裡，所以有果實的構造。(A)棒槌瓜和穿山龍都是俗名；(B)孢子囊堆是蕨類；(D)毬果是裸子植物。","goal":"能知道不同植物分類的重要特徵","pr":53},{"id":"115-science-30","y":"115","n":30,"img":"science_q30","pk":"115_science","ans":"A","exp":"質量相等、熱源相同，相同時間吸收相同熱量，溫度上升越慢的比熱越大。500秒內：甲上升 100－40＝60°C，乙上升 80－20＝60°C，丙上升 70－20＝50°C。甲、乙相同，丙上升最少，比熱最大：S甲＝S乙＜S丙。","goal":"能應用比熱相關公式","pr":51},{"id":"115-science-31","y":"115","n":31,"img":"science_q31","pk":"115_science","ans":"B","exp":"電鍍時，被鍍物（鑰匙）接電源負極當陰極，鍍層金屬（銅片）接正極當陽極。溶液中的銅離子（Cu²⁺）帶正電，會往負極的鑰匙移動並析出銅。符合的是(B)。","goal":"能知道電鍍的相關概念","pr":58},{"id":"115-science-32","y":"115","n":32,"img":"science_q32","pk":"115_science","ans":"B","exp":"密度均勻的長方體放在桌上，壓力＝重量÷底面積＝密度×g×高度，只和高度有關。截去長、寬不影響高度，高度從10 cm 變成 8 cm，壓力變成原本的 8/10，也就是 4/5 P。","goal":"能應用壓力公式","pr":38},{"id":"115-science-33","y":"115","n":33,"img":"science_q33","pk":"115_science","ans":"B","exp":"碗漂浮時，浮力＝碗重＋碗內水重。陶瓷密度比水大，所以碗必須比「碗內水面與碗外水面同高」時再沉得更深，碗外水面一定比碗內水面高。甲圖碗內水面高於碗外；乙圖碗內外水面一樣高，兩張圖都不合理。","goal":"能應用阿基米德原理","pr":46},{"id":"115-science-34","y":"115","n":34,"img":"science_q34","pk":"115_science","ans":"D","exp":"甲在太平洋上，是太平洋高壓（高氣壓），讓臺灣乾熱。北方冷高壓與太平洋高壓勢力相當，冷暖氣團僵持，形成長期停留在日本到中國之間的滯留鋒（梅雨鋒面），造成持續暴雨。","goal":"能應用圖中資訊，推論氣團與鋒面的性質","pr":47},{"id":"115-science-35","y":"115","n":35,"img":"science_q35","pk":"115_science","ans":"C","exp":"電流通過導線時，導線上方的磁場方向和導線垂直。磁針原本指向南北：放在南北向或斜向導線上方時，磁場有東西方向的分量，磁針會明顯偏轉。丙所在的導線是東西向，它產生的磁場是南北方向，和磁針原本的方向在同一直線上，磁針不會左右偏轉，最不適合用來判斷。","goal":"能應用安培右手定則","pr":43},{"id":"115-science-36","y":"115","n":36,"img":"science_q36","pk":"115_science","ans":"D","exp":"甲：20÷(20＋20)＝50%；乙：30÷(30＋20)＝60%。濃度比＝50：60＝5：6。","goal":"能應用重量百分率濃度","pr":45},{"id":"115-science-37","y":"115","n":37,"img":"science_q37","pk":"115_science","ans":"B","exp":"酵素分解蛋白質，蛋白質減少、產物X增加。人體消化液中能分解蛋白質的有胃液和胰液（含胰蛋白酶），膽汁不含酵素。此酵素催化的是蛋白質的分解，X 是產物。","goal":"能正確判讀圖片獲得資訊，並依據該資訊及習得知識進行推論","pr":41},{"id":"115-science-38","y":"115","n":38,"img":"science_q38","pk":"115_science","ans":"C","exp":"緯度越高，季節的白天長短差異越大：夏季白天比嘉義更長，冬季白天比嘉義更短；春分、秋分（約9/23）時各地白天都約12小時，兩線會相交。符合的是(C)。","goal":"能推論不同季節、不同緯度地區的晝夜長短","pr":42},{"id":"115-science-39","y":"115","n":39,"img":"science_q39","pk":"115_science","ans":"D","exp":"肺臟流出的血液經肺靜脈先進入「左心房」；肝臟流出的血液經肝靜脈進入下大靜脈，再進入「右心房」，不是右心室。兩人都錯。","goal":"能了解人體循環及血液流動路徑","pr":42},{"id":"115-science-40","y":"115","n":40,"img":"science_q40","pk":"115_science","ans":"A","exp":"中和反應中鈉離子不參與反應，數目不變，但加入鹽酸後溶液總體積增加，所以鈉離子濃度變小。食鹽易溶於水，不會析出。","goal":"能了解酸鹼中和反應的離子濃度變化","pr":27},{"id":"115-science-41","y":"115","n":41,"img":"science_q41","pk":"115_science","ans":"B","exp":"甲靜止、乙等速度運動，都是受力平衡，外力＝重力（mg）。丙等加速度向下運動，合力向下，外力小於重力。所以 F甲＝F乙＞F丙。","goal":"能統整牛頓運動定律相關概念","pr":23},{"id":"115-science-42","y":"115","n":42,"img":"science_q42","pk":"115_science","ans":"D","pimg":"science_p42","grp":"115-science-42～43","exp":"環保署在該市只有一個測站，環保局則設了多個測站取平均，單一測站和多個測站平均的結果可能不同，所以會有兩種結果。","goal":"能對不同結果，提出可能的科學解釋","pr":73},{"id":"115-science-43","y":"115","n":43,"img":"science_q43","pk":"115_science","ans":"B","pimg":"science_p42","grp":"115-science-42～43","exp":"甲組臺北、宜蘭位在東北季風的迎風面，乙組雲林、嘉義在背風面。比較兩組的雨水 pH 平均值，是想了解迎風、背風是否會影響雨水 pH 值的平均。","goal":"能根據資訊，了解探究活動的可能主題","pr":70},{"id":"115-science-44","y":"115","n":44,"img":"science_q44","pk":"115_science","ans":"C","pimg":"science_p44","grp":"115-science-44～45","exp":"圖(二十九)中，12～13時的長條最高，表示這段時間氣泡移動最多，平均蒸散速率最大。(A)、(B)0～1、3～4時仍有少量移動，有發生蒸散；(D)6～7時的長條比7～8時低。","goal":"能正確判讀圖中數據","pr":76},{"id":"115-science-45","y":"115","n":45,"img":"science_q45","pk":"115_science","ans":"D","pimg":"science_p44","grp":"115-science-44～45","exp":"植物是由根吸水，從葉子的氣孔散失水分，不會從氣孔吸收水分向下運輸，所以氣泡不會因此向左移動。室內環境穩定、沒有日夜變化，所以(A)(B)可能發生；室內光線不足時氣孔關閉，(C)也可能發生。","goal":"能了解植物的運輸，並依此預測不同實驗條件下的實驗結果","pr":63},{"id":"115-science-46","y":"115","n":46,"img":"science_q46","pk":"115_science","ans":"C","pimg":"science_p46","grp":"115-science-46～47","exp":"不計空氣阻力，水滴自由落下時，落下的高度越高，到達石英板時的速度越快。調整針頭高度就能改變衝擊速度。改變溫度、大小或攝影設定都不會改變落下速度。","goal":"能根據實驗目的調整適當的實驗條件","pr":64},{"id":"115-science-47","y":"115","n":47,"img":"science_q47","pk":"115_science","ans":"A","pimg":"science_p46","grp":"115-science-46～47","exp":"F′ 和 F 是作用力與反作用力，大小相等。圖(三十一)中力最大的時刻是第一個高峰（約0.006 N），對應水滴剛撞上石英板的狀態，也就是(A)。","goal":"能擷取圖中資訊並應用反作用力相關知識","pr":49},{"id":"115-science-48","y":"115","n":48,"img":"science_q48","pk":"115_science","ans":"D","pimg":"science_p48","grp":"115-science-48～50","exp":"組別一通入氧氣，可用雙氧水分解製造；組別四通入二氧化碳，可用鹽酸和碳酸鈣（大理石）反應製造。鹽酸和鎂帶反應產生的是氫氣。","goal":"能了解氣體的製備方法","pr":59},{"id":"115-science-49","y":"115","n":49,"img":"science_q49","pk":"115_science","ans":"D","pimg":"science_p48","grp":"115-science-48～50","exp":"組別二通入空氣，160分鐘時從5.00 mL降到4.50 mL，消耗0.5 mL，約占10%。空氣中氧氣約占21%，所以氧氣沒有耗盡，消耗比例只有氧氣含量的一半左右。","goal":"能知道大氣中氧氣的含量並分析數據","pr":38},{"id":"115-science-50","y":"115","n":50,"img":"science_q50","pk":"115_science","ans":"A","pimg":"science_p48","grp":"115-science-48～50","exp":"表(五)的活性：鎂＞碳＞鋅＞鐵＞銅＞金。鐵的活性比碳小，無法搶走二氧化碳中的氧，所以理論上鐵粉不會被氧化。","goal":"能依據物質對氧的活性大小，判斷是否發生氧化還原反應","pr":42},{"id":"ak-science-1","y":"ak","n":1,"html":"小琪把盆栽放在窗邊，植物的葉片在陽光下製造養分。植物細胞中，進行光合作用製造葡萄糖的構造是下列何者？","opts":["粒線體","細胞核","葉綠體","液胞"],"ans":"C","exp":"葉綠體含有葉綠素，是進行光合作用、製造葡萄糖的地方。粒線體負責呼吸作用；細胞核控制遺傳；液胞儲存水分與物質。","topic":"生物：光合作用"},{"id":"ak-science-2","y":"ak","n":2,"html":"某植物的高莖（A）對矮莖（a）為顯性。兩株基因型都是 Aa 的高莖植物雜交，子代出現矮莖的機率為何？","opts":["0","1/4","1/2","3/4"],"ans":"B","exp":"Aa × Aa 的子代基因型比例為 AA：Aa：aa＝1：2：1。矮莖必須是 aa，機率為 1/4。","topic":"生物：遺傳"},{"id":"ak-science-3","y":"ak","n":3,"html":"小傑吃白飯時，細嚼一陣子後覺得有甜味。白飯中的澱粉最早開始被消化的部位是哪裡？","opts":["小腸","口腔","胃","大腸"],"ans":"B","exp":"口腔中的唾液含澱粉酶，會把澱粉分解成麥芽糖，所以細嚼白飯會覺得甜。澱粉從口腔就開始被消化。","topic":"生物：消化"},{"id":"ak-science-4","y":"ak","n":4,"html":"一個金屬塊的質量為 60 g，放入裝水的量筒後，水面上升了 20 mL。這個金屬塊的密度為多少？","opts":["0.33 g/cm³","3 g/cm³","40 g/cm³","1200 g/cm³"],"ans":"B","exp":"水面上升 20 mL，金屬塊體積為 20 cm³。密度＝質量÷體積＝60÷20＝3 g/cm³。","topic":"理化：密度"},{"id":"ak-science-5","y":"ak","n":5,"html":"一輛機車由靜止出發，沿直線行駛，10 秒後速度達到 20 m/s。若為等加速度運動，加速度為多少？","opts":["0.5 m/s²","2 m/s²","10 m/s²","200 m/s²"],"ans":"B","exp":"加速度＝速度變化÷時間＝(20－0)÷10＝2 m/s²。","topic":"理化：加速度"},{"id":"ak-science-6","y":"ak","n":6,"html":"一個物體所受的合力為零時，它的運動狀態最可能是下列何者？","opts":["一定做圓周運動","保持靜止或等速度直線運動","速度越來越快","速度越來越慢"],"ans":"B","exp":"依牛頓第一運動定律，物體所受合力為零時，靜者恆靜、動者恆做等速度直線運動。","topic":"理化：力"},{"id":"ak-science-7","y":"ak","n":7,"html":"將 25 g 的糖完全溶解在 100 g 的水中，這杯糖水的重量百分濃度為多少？","opts":["20%","25%","80%","125%"],"ans":"A","exp":"重量百分濃度＝溶質÷溶液×100%＝25÷(25＋100)×100%＝20%。注意分母是溶液（糖＋水），不是只有水。","topic":"理化：濃度"},{"id":"ak-science-8","y":"ak","n":8,"html":"甲溶液的 pH 值為 3，乙溶液的 pH 值為 5。甲溶液的氫離子濃度是乙溶液的幾倍？","opts":["1/1 /* backup code */
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pipe(u8,T){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer())}
async function exportCode(){
  const raw=new TextEncoder().encode(JSON.stringify({seen:st.seen,wrong:st.wrong,hist:st.hist,wa:st.wa||{}}));
  if(window.CompressionStream){try{return 'CAP1:'+b64e(await pipe(raw,CompressionStream))}catch(e){}}
  return 'CAP0:'+b64e(raw);
}
async function importCode(t){t=t.replace(/\s+/g,'');
  if(t.startsWith('CAP1:'))return JSON.parse(new TextDecoder().decode(await pipe(b64d(t.slice(5)),DecompressionStream)));
  if(t.startsWith('CAP0:'))return JSON.parse(new TextDecoder().decode(b64d(t.slice(5))));
  throw new Error('bad');
}

function qBody(q,i,c){
  const sel=c.ans[q.id], sub=c.sub, ok=sel===q.ans;
  const wr=wrongOf(subj)[q.id];
  let h=`<div class="q${sub?(ok?' right':' wrong'):''}" id="q-${i}"><div class="qhead"><span class="qno">${i+1}.</span><span class="tag${q.y==='ak'?' ak':''}">${srcLabel(q)}</span>${c.mode==='wrong'&&wr!==undefined&&!sub?`<span class="streak">已連對 ${wr} 次</span>`:''}</div>`;
  if(q.img)h+=imgTag(q.pk,q.img);
  else h+=`<div class="txt"><p class="stem">${q.html}</p><ol class="opts">${q.opts.map((o,k)=>`<li><span>(${L[k]})</span>${o}</li>`).join('')}</ol></div>`;
  h+=`<div class="choices" role="group" aria-label="第${i+1}題"><span class="qn">${i+1}</span>${[...L].map(x=>`<button class="bub${sub&&x===q.ans?' is-ans':''}" data-i="${i}" data-a="${x}" aria-pressed="${sel===x}" ${sub?'disabled':''}>${x}</button>`).join('')}`;
  if(sub)h+=`<span class="verdict ${sel?(ok?'ok':'no'):'skip'}">${sel?(ok?'答對':'答錯，正解 '+q.ans):'未作答，正解 '+q.ans}</span>`;
  h+='</div>';
  if(sub)h+=expHtml(q,!ok);
  return h+'</div>';
}
function expHtml(q,open){
    let body;
    if(q.exp)body=`<p class="exp-body"><b>(${q.ans})</b>${esc(q.exp)}</p>`;
    else if(q.pr!=null&&q.pr>=60)body=`<p class="exp-body"><b>(${q.ans})</b>這題屬於基本題，全國答對率 ${q.pr}%，對照答案再看一次題目應該就能理解。</p>`;
    else body=`<p class="exp-body"><b>(${q.ans})</b>詳解補充中。</p>`;
    const meta=[q.goal?'評量目標：'+esc(q.goal):'',q.pr!=null?'全國答對率 '+q.pr+'%':'',q.topic?'單元：'+esc(q.topic):''].filter(Boolean);
    return `<details class="exp"${open?' open':''}><summary>詳解</summary>${body}${meta.length?`<p class="exp-meta">${meta.map(m=>`<span>${m}</span>`).join('')}</p>`:''}</details>`;
}

    h+=qBody(q,i,c);

function renderCard(){

  $('grid').innerHTML=c.ids.map((id,i)=>{let cl='';const a=c.ans[id];
    if(c.sub)cl=a?(a===byId[id].ans?'ok':'no'):'skip';else if(a)cl='done';
    return `<button class="cell ${cl}" data-i="${i}">${i+1}${a&&!c.sub?' '+a:''}</button>`}).join('');
  const p=c.sub?`答對 ${c.res.ok}/${n}`:`已作答 ${done}/${n}`;
  $('prog').textContent=p;$('mprog').textContent=p+'　'+$('timer').textContent;
  $('limit').textContent=`/ ${SUBJ[subj].min}:00`;
  $('actions').innerHTML=c.sub
    ?`<button class="btn primary" id="again">${c.mode==='wrong'?'回到首頁':'再測一次'}</button><button class="btn ghost" id="pdf" hidden>下載 PDF</button>`
    :`<button class="btn primary" id="submit">交卷</button><button class="btn ghost" id="pdf" hidden>下載 PDF</button><button class="btn ghost" id="quit">放棄</button>`;

function submit(){
  const c=st.cur[subj],wr=wrongOf(subj),seen=seenOf(subj);let ok=0,out=0;
  c.el=Date.now()-c.t0;
  const wa=st.wa||(st.wa={});
  for(const id of c.ids){const right=c.ans[id]===byId[id].ans;if(right)ok++;seen.add(id);
    if(!right)wa[id]=c.ans[id]||'';
    if(c.mode==='wrong'){if(right){wr[id]=(wr[id]||0)+1;if(wr[id]>=2){delete wr[id];delete wa[id];out++}}else wr[id]=0}
    else if(!right)wr[id]=0;
  }
  const n=c.ids.length;let g=null;
  if(c.mode==='test'&&CUT[subj]&&n===SUBJ[subj].n){g='C';for(let i=0;i<6;i++)if(ok>=CUT[subj][i]){g=GR[i];break}}
  c.sub=true;c.res={ok,n,g,out};st.seen[subj]=[...seen];
  const d=new Date();(st.hist[subj]=st.hist[subj]||[]).push({d:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,m:c.mode,ok,n,g,out:c.mode==='wrong'?out:0});
  if(st.hist[subj].length>40)st.hist[subj]=st.hist[subj].slice(-40);
  save();openCard(false);show();window.scrollTo(0,0);
}

function tick(){const c=st.cur[subj];if(!c)return;const ms=c.sub?c.el:Date.now()-c.t0;const t=$('timer');t.textContent=fmt(ms);t.classList.toggle('over',ms>SUBJ[subj].min*60000);

let dl=null;
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{dl=d;if(d&&$('pdf'))$('pdf').hidden=false}).catch(()=>{})}
else dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);return{status:'saved'}}};
function loadJsPDF(){return window.jspdf?Promise.resolve():new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)})}
const PX=8; // canvas px per mm
function textCanvas(paras,wmm,size,bold){
  const c=document.createElement('canvas'),x=c.getContext('2d'),W=Math.round(wmm*PX),fs=size*PX,lh=fs*1.55;
  const font=`${bold?'700 ':''}${fs}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;x.font=font;
  const lines=[];for(const p of paras){let cur='';for(const ch of p){if(x.measureText(cur+ch).width>W&&cur){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur)}
  c.width=W;c.height=Math.ceil(lines.length*lh+fs*0.4);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';x.font=font;x.textBaseline='top';
  lines.forEach((l,i)=>x.fillText(l,0,i*lh+fs*0.2));return c;
}
const strip=h=>{const d=document.createElement('div');d.innerHTML=h.replace(/<\/p>|<br\s*\/?>/g,'\n');return d.textContent.split('\n').map(t=>t.trim()).filter(Boolean)};
async function imgCanvas(pk,name){const u=await imgURL(pk,name);const im=new Image();im.src=u;await im.decode();
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);return c}
async function makePDF(){
  const b=$('pdf');const old=b.textContent;b.disabled=true;b.textContent='製作中…';
  try{
    await loadJsPDF();const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
    const M=12,W=210-2*M,H=297-2*M;let y=M;
    const put=(c,wmm)=>{let w=wmm,h=c.height/c.width*w;if(h>H){h=H;w=c.width/c.height*h}
      if(y+h>M+H){doc.addPage();y=M}doc.addImage(c.toDataURL('image/jpeg',0.85),'JPEG',M,y,w,h);y+=h+3};
    const hOf=(c,w)=>Math.min(H,c.height/c.width*w);const keep=h=>{if(y+h>M+H&&h<=H){doc.addPage();y=M}};
    const c=st.cur[subj],S=SUBJ[subj];
    put(textCanvas([`${S.name}　${c.mode==='wrong'?'錯題區練習':'隨機測驗'}　共 ${c.ids.length} 題　作答時間 ${S.min} 分鐘`],W,5,true),W);
    let lastG=null;
    for(let i=0;i<c.ids.length;i++){const q=byId[c.ids[i]];
      if(q.grp&&q.grp!==lastG){const lb=textCanvas(['【題組】請閱讀以下內容，回答下列各題'],W,3.6,true);
        const k=q.pimg?await imgCanvas(q.pk,q.pimg):textCanvas(strip(q.passage||''),W,4.2),kw=q.pimg?Math.min(W,k.width/5):W;
        keep(hOf(lb,W)+hOf(k,kw)+3);put(lb,W);put(k,kw)}
      lastG=q.grp||null;
      const lb=textCanvas([`第 ${i+1} 題（${srcLabel(q)}）`],W,3.2,true);
      const k=q.img?await imgCanvas(q.pk,q.img):textCanvas([...strip(q.html),...q.opts.map((o,k)=>`(${L[k]}) ${strip(o).join(' ')}`)],W,4.2),kw=q.img?Math.min(W,k.width/5):W;
      keep(hOf(lb,W)+hOf(k,kw)+3);put(lb,W);put(k,kw);
    }
    doc.addPage();y=M;
    put(textCanvas(['答案'],W,5,true),W);
    const rows=[];for(let i=0;i<c.ids.length;i+=10)rows.push(c.ids.slice(i,i+10).map((id,k)=>`${String(i+k+1).padStart(2,' ')}.${byId[id].ans}`).join('　'));
    put(textCanvas(rows,W,4),W);
    const d=new Date(),fn=`會考練習_${S.name}_${d.getMonth()+1}月${d.getDate()}日.pdf`;
    await dl.save({filename:fn,data:doc.output('blob')});
  }catch(e){if(!e||e.code!=='declined'){b.textContent='無法產生 PDF';setTimeout(()=>{b.textContent=old},2500);b.disabled=false;return}}
  b.disabled=false;b.textContent=old;
}

show();
})();
</script>
