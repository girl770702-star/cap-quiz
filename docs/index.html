<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>會考練習卷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: exam booklet on the left, a sticky red-ink answer card (答案卡) on the right; on phones the card becomes a bottom bar. */
:root{
  --paper:#f3f5f7; --sheet:#ffffff; --ink:#1c2230; --muted:#5d6676; --rule:#d9dee5;
  --red:#c5303f; --red-soft:#fbe9eb; --graphite:#23262b; --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#b4541a;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#13161b; --sheet:#1c2027; --ink:#e6e9ef; --muted:#9aa3b2; --rule:#2e343e;
  --red:#ef6b79; --red-soft:#3a1d22; --graphite:#e6e9ef; --ok:#5fcf94; --ok-soft:#173326; --warn:#f0a06a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13161b; --sheet:#1c2027; --ink:#e6e9ef; --muted:#9aa3b2; --rule:#2e343e;
  --red:#ef6b79; --red-soft:#3a1d22; --graphite:#e6e9ef; --ok:#5fcf94; --ok-soft:#173326; --warn:#f0a06a; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;border-bottom:2px solid var(--red);padding-bottom:10px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;margin-left:10px}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--red)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 18px;padding-bottom:4px}
nav.tabs button{flex:0 0 auto;font:inherit;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:96px}
nav.tabs button b{font-family:var(--f-display);font-size:17px}
nav.tabs button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"]{border-color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}
nav.tabs button:focus-visible,.bub:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.note{font-size:13.5px;color:var(--muted);background:var(--sheet);border:1px dashed var(--rule);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.section-h{font-family:var(--f-display);font-size:18px;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.section-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.passage{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--muted);border-radius:6px;padding:12px;margin:22px 0 10px}
.passage .lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 12px 10px;margin-bottom:12px;scroll-margin-top:16px}
.q.wrong{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.q.right{border-color:var(--ok)}
.imgbox{background:#fff;border-radius:3px;overflow-x:auto}
.imgbox img{display:block;width:100%;max-width:760px;height:auto}
.choices{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule)}
.choices .qn{font-family:var(--f-mono);font-weight:600;color:var(--red);min-width:30px}
.bub{font:600 15px var(--f-mono);width:48px;height:32px;border-radius:50%;border:1.6px solid var(--red);background:transparent;color:var(--red);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.bub[aria-pressed="true"]{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.bub.is-ans{box-shadow:0 0 0 3px var(--ok);border-color:var(--ok)}
.bub:disabled{cursor:default}
.verdict{font-size:13.5px;font-weight:700;margin-left:auto}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--red)} .verdict.skip{color:var(--warn)}
.exp{margin-top:10px;border-top:1px dashed var(--rule);padding-top:8px}
.exp summary{cursor:pointer;font-weight:700;color:var(--ok);font-size:14px}
.exp summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.exp-body{margin:8px 0 6px;line-height:1.75;max-width:70ch}
.exp-body b{color:var(--ok);margin-right:2px}
.exp-meta{margin:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
.papers{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline}
.chip span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.chip[aria-selected="true"] span{color:var(--sheet);opacity:.8}
.chip.ak{border-style:dashed}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.qhead{margin-bottom:8px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:1px 8px}
.tag.ak{color:var(--ok);border-color:var(--ok);border-style:dashed}
.txt{font-size:16px;line-height:1.8;max-width:72ch}
.txt p{margin:0 0 6px}
.stem b{font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.opts{list-style:none;margin:4px 0 0;padding:0 0 0 1.6em;display:grid;gap:2px}
.opts span{font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.passage .txt{padding:4px 6px}
aside.card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--sheet);border:1.5px solid var(--red);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
.card h2{margin:0;font-family:var(--f-display);font-size:17px;color:var(--red);letter-spacing:.1em}
.timer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer .t{font:600 26px var(--f-mono);font-variant-numeric:tabular-nums}
.timer .t.over{color:var(--red)}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;border:1.5px solid var(--red);background:var(--sheet);color:var(--red)}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{font:500 12.5px var(--f-mono);border:1px solid var(--rule);border-radius:5px;padding:4px 0;text-align:center;background:transparent;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.cell.done{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.cell.no{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.cell.skip{color:var(--warn);border-color:var(--warn)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score{border-top:1px dashed var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.score .big{display:flex;align-items:baseline;gap:10px}
.score .num{font:600 30px var(--f-mono)}
.score .grade{font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--red)}
.score small{color:var(--muted);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.confirm{font-size:13px;background:var(--red-soft);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.mbar{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.card{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:12px 12px 0 0;max-height:70vh;z-index:20;border-width:1.5px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(calc(100% - 64px - env(safe-area-inset-bottom,0px)));transition:transform .2s}
  aside.card.open{transform:none}
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
  .card h2{display:none}
  .bub{width:52px;height:36px}
}
@media (prefers-reduced-motion:reduce){aside.card{transition:none}}
.panel{display:none}.panel.on{display:block}
.home{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px}
.box h3{margin:0 0 8px;font-family:var(--f-display);font-size:18px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:4px 0 14px}
.stat b{display:block;font:600 26px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.red b{color:var(--red)}
.big-actions{display:flex;flex-wrap:wrap;gap:10px}
.big-actions .btn{padding:12px 18px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--rule);font-variant-numeric:tabular-nums}
.hist li:last-child{border-bottom:0}
.hist .m{color:var(--muted)}
.muted{color:var(--muted);font-size:13.5px}
textarea.code{width:100%;min-height:90px;font:12px var(--f-mono);border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);padding:8px;word-break:break-all}
.msg{font-size:13.5px;font-weight:700;color:var(--ok);min-height:1.2em}
.msg.err{color:var(--red)}
.qno{font:600 14px var(--f-mono);color:var(--red);margin-right:8px}
.streak{font-size:12px;font-weight:700;color:var(--warn);margin-left:6px}
.imgbox img{background:#fff;min-height:40px}
.imgbox img:not([src]){background:repeating-linear-gradient(90deg,#eef1f4 0 20px,#f7f8fa 20px 40px)}
.mode-tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--sheet);background:var(--red);border-radius:4px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.mode-tag.w{background:var(--warn)}
.result{background:var(--sheet);border:1.5px solid var(--red);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.result .num{font:600 30px var(--f-mono)}
.result .grade{font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--red);margin-left:10px}
.inline-confirm{display:none}.inline-confirm.on{display:flex}
@media print{aside.card,nav.tabs,header.top .src{display:none}}
</style>

</section>

33～35"},{"id":"113-chinese-35","y":"113","n":35,"img":"113_chinese_q35","pk":"113_chinese","ans":"C","pimg":"113_chinese_p33","grp":"113-chinese-33～35"},{"id":"113-chinese-36","y":"113","n":36,"img":"113_chinese_q36","pk":"113_chinese","ans":"C","pimg":"113_chinese_p36","grp":"113-chinese-36～37"},{"id":"113-chinese-37","y":"113","n":37,"img":"113_chinese_q37","pk":"113_chinese","ans":"B","pimg":"113_chinese_p36","grp":"113-chinese-36～37"},{"id":"113-chinese-38","y":"113","n":38,"img":"113_chinese_q38","pk":"113_chinese","ans":"B","pimg":"113_chinese_p38","grp":"113-chinese-38～39"},{"id":"113-chinese-39","y":"113","n":39,"img":"113_chinese_q39","pk":"113_chinese","ans":"B","pimg":"113_chinese_p38","grp":"113-chinese-38～39"},{"id":"113-chinese-40","y":"113","n":40,"img":"113_chinese_q40","pk":"113_chinese","ans":"C","pimg":"113_chinese_p40","grp":"113-chinese-40～42"},{"id":"113-chinese-41","y":"113","n":41,"img":"113_chinese_q41","pk":"113_chinese","ans":"D","pimg":"113_chinese_p40","grp":"113-chinese-40～42"},{"id":"113-chinese-42","y":"113","n":42,"img":"113_chinese_q42","pk":"113_chinese","ans":"B","pimg":"113_chinese_p40","grp":"113-chinese-40～42"},{"id":"114-chinese-1","y":"114","n":1,"img":"114_chinese_q01","pk":"114_chinese","ans":"D","exp":"簡訊說水費逾期、「務必於三日內繳費，逾期將終止供水」，營造必須馬上處理的緊迫感，讓人來不及思考就點連結，屬於④引發情緒反應。","goal":"能應用文本","pr":90},{"id":"114-chinese-2","y":"114","n":2,"img":"114_chinese_q02","pk":"114_chinese","ans":"B","exp":"文中強調驗屍時「涉案人、關係人和家屬必須在場」，所以(B)正確。(A)禁止把屍體帶到他處；(C)一般大眾可以圍觀；(D)目的是讓大家「質對明白」，不會拒絕家屬確認。","goal":"能應用文本","pr":95},{"id":"114-chinese-3","y":"114","n":3,"img":"114_chinese_q03","pk":"114_chinese","ans":"B","exp":"「月」是依月亮形狀畫出的象形字。「木」畫出樹的枝幹與根，也是象形字。「出」是腳走出坑穴的會意字；「汝」是從水、女聲的形聲字。","goal":"能辨別常用字造字原則","pr":79},{"id":"114-chinese-4","y":"114","n":4,"img":"114_chinese_q04","pk":"114_chinese","ans":"B","exp":"詩中說快樂除以悲傷，「得到的商卻只是1」，一個數除以另一個數等於1，表示兩者相等，也就是「我的快樂等同於我的悲傷」。","goal":"能理解文意","pr":81},{"id":"114-chinese-5","y":"114","n":5,"img":"114_chinese_q05","pk":"114_chinese","ans":"A","exp":"《說文解字》以小篆為主，兼收古文、籀文，都是秦以前的古文字。(A)是楷書，楷書在漢末之後才成熟，《說文》不會收錄。","goal":"能辨別書法字體","pr":88},{"id":"114-chinese-6","y":"114","n":6,"img":"114_chinese_q06","pk":"114_chinese","ans":"A","exp":"資料中各國自封城後，家暴通報、專線來電都上升，所以可推論封城容易誘發家庭暴力。(B)來電增加不代表通報意願較高；(C)是收入與行動受限讓女性更易受害，因果相反；(D)資料沒有提到。","goal":"能根據文本推論","pr":79},{"id":"114-chinese-7","y":"114","n":7,"img":"114_chinese_q07","pk":"114_chinese","ans":"B","exp":"甲圖說最末字仄聲貼右邊（上聯）、平聲貼左邊（下聯）；乙圖標示上聯尾字是仄聲、下聯尾字是平聲。兩圖都指出上聯仄聲結尾、下聯平聲結尾，就是「仄起平收」。(C)順序是上聯→下聯→橫批；(D)面向大門右邊貼上聯。","goal":"能理解對聯的原則與貼法","pr":84},{"id":"114-chinese-8","y":"114","n":8,"img":"114_chinese_q08","pk":"114_chinese","ans":"C","exp":"「菊花」是秋天的花，「金風」指秋風，「桂枝香」是秋天的桂花香，都呼應題目「秋」。(A)〈小梁州〉是曲牌名，不是題目；(B)黃、光、藏、盪、香、望、江、漾、行都押同一韻，一韻到底；(D)斜月、新雁是寫秋景。","goal":"能分析文本的寫作手法","pr":80},{"id":"114-chinese-9","y":"114","n":9,"img":"114_chinese_q09","pk":"114_chinese","ans":"C","exp":"文中說等級最高的是第一種「香片」，例如茉莉花茶；玫瑰烏龍茶是成品內有花的第二種，所以(C)的建議不恰當。","goal":"能應用文本","pr":78},{"id":"114-chinese-10","y":"114","n":10,"img":"114_chinese_q10","pk":"114_chinese","ans":"A","exp":"文中說「北方乾燥，土穴所釀多出於此」，可知土穴中的蜜（穴蜜）多產於乾燥的地方。(B)人工養蜂只占十分之二，崖蜜是天然的；(C)南方卑溼仍有崖蜜；(D)「與蔗漿分勝」是說兩者不相上下。","goal":"能根據文本推論","pr":83},{"id":"114-chinese-11","y":"114","n":11,"img":"114_chinese_q11","pk":"114_chinese","ans":"D","exp":"作者說時間是「傑出的編輯」，那些沒寫成的遊記交給時間處理，最後可能發現不寫也罷。意思是經過時間沉澱，自然會知道什麼才值得寫。","goal":"能理解文意","pr":72},{"id":"114-chinese-12","y":"114","n":12,"img":"114_chinese_q12","pk":"114_chinese","ans":"C","exp":"「我清楚明白」後面接的是明白的內容：「科學需要人文的關懷，而文學需要理性的自覺」，用來提示下文的冒號最適合放在丙。","goal":"能依語境評斷標點符號使用的適切性","pr":71},{"id":"114-chinese-13","y":"114","n":13,"img":"114_chinese_q13","pk":"114_chinese","ans":"C","exp":"(C)「延宕」是拖延，「竣工」是完工，使用正確。(A)「淪為」用於變壞，應為「傳為佳話」；(B)應為「竟然」；(D)應為「多虧」。","goal":"能依語境評斷語詞使用的適切性","pr":57},{"id":"114-chinese-14","y":"114","n":14,"img":"114_chinese_q14","pk":"114_chinese","ans":"A","exp":"(A)揶揄的「揶」讀ㄧㄝˊ，正確。(B)晾讀ㄌㄧㄤˋ；(C)藩讀ㄈㄢ；(D)栽讀ㄗㄞ。","goal":"能記憶常用字的字音","pr":55},{"id":"114-chinese-15","y":"114","n":15,"img":"114_chinese_q15","pk":"114_chinese","ans":"A","exp":"文中引魯迅說此書「亦頗有從唐傳奇轉化而出者」，可見有些唐傳奇是蒲松齡寫作的來源。(B)能找到原型的約百篇，找不到的超過全書一半；(C)能找到原型的是短篇小說；(D)短篇小說長達數千言。","goal":"能理解文意","pr":61},{"id":"114-chinese-16","y":"114","n":16,"img":"114_chinese_q16","pk":"114_chinese","ans":"A","exp":"(A)「有志竟成」正確。(B)應為「趕盡殺絕」；(C)應為「情不自禁」；(D)應為「眼不見為淨」。","goal":"能記憶常用字的字形","pr":52},{"id":"114-chinese-17","y":"114","n":17,"img":"114_chinese_q17","pk":"114_chinese","ans":"C","exp":"「遺恨濃」是抽象的情感，用「碧波流不斷」的江水具體表現遺恨綿延不絕。(A)濃、重、鐘、朧、空、紅、風、中都押平聲韻；(B)下片也是寫景抒情；(D)綠蕪是寫春天已過，並非反襯。","goal":"能分析文本的寫作手法","pr":51},{"id":"114-chinese-18","y":"114","n":18,"img":"114_chinese_q18","pk":"114_chinese","ans":"D","exp":"作者扣門沒人應，「欲去問西家」，西家的人「報道山中去」，所以作者見到了陸鴻漸的鄰居。(A)是桑麻農地，不荒蕪；(B)菊花「未著花」；(C)陸鴻漸要到太陽西斜才回來，作者沒見到他。","goal":"能理解文意","pr":59},{"id":"114-chinese-19","y":"114","n":19,"img":"114_chinese_q19","pk":"114_chinese","ans":"A","exp":"(A)「不可名狀」指無法用言語形容，用來形容戰爭的慘烈正確。(B)「不以為意」是不在意，和「表面上毫不在乎」不能用「但」轉折；(C)「不言而喻」是不用說就明白；(D)「不置可否」是不表示意見，不會讓人有明確方向。","goal":"能依語境評斷詞語使用的適切性","pr":61},{"id":"114-chinese-20","y":"114","n":20,"img":"114_chinese_q20","pk":"114_chinese","ans":"D","exp":"劉基把換丞相比喻成換柱子，「須得大木」，若綁小木頭來做，很快就倒。意思是李善長是能撐住國家的大木，自己只是小木，所以李善長比自己更適合當丞相。(A)是李善長多次想害劉基；(B)太祖想讓劉基取代李善長。","goal":"能理解文意","pr":51},{"id":"114-chinese-21","y":"114","n":21,"img":"114_chinese_q21","pk":"114_chinese","ans":"D","exp":"單淘汰制下，在同一半區的兩隊不可能同時進冠軍賽。(A)阿根廷、巴西都在左半區；(B)荷蘭和澳大利亞在8強前就會碰頭，澳大利亞不可能得季軍；(C)法國、西班牙都在右半區。(D)克羅埃西亞（左）、摩洛哥（右）可在冠軍賽相遇，塞內加爾可在右半區四強輸給摩洛哥後再贏得季軍。","goal":"能根據文本推論","pr":61},{"id":"114-chinese-22","y":"114","n":22,"img":"114_chinese_q22","pk":"114_chinese","ans":"B","exp":"作者給賣餅者一萬錢增加本錢，後來賣餅者不唱歌了，說「本流既大，所謀益增，不暇唱曲矣」，資本變大、要忙的事變多，沒空唱歌。(A)作者是借錢給他，用餅慢慢抵；(D)他仍繼續賣餅。","goal":"能理解文意","pr":51},{"id":"114-chinese-23","y":"114","n":23,"img":"114_chinese_q23","pk":"114_chinese","ans":"D","exp":"文中說遠方戍卒「不習地勢而心畏胡」，而招募的居民保衛家園「赴胡不避死」，所以遠卒畏懼胡人、屯戍的居民不畏懼。(A)遠卒「一歲而更」，屯民久居；(B)室屋、田器、衣食都是給屯民的；(C)遠卒不熟悉地勢。","goal":"能理解文意","pr":43},{"id":"114-chinese-24","y":"114","n":24,"img":"114_chinese_q24","pk":"114_chinese","ans":"B","exp":"文中說後來才知道《碧雲騢》「乃魏泰所為，嫁之聖俞也」，是魏泰寫的，卻栽贓給梅聖俞，所以應非梅聖俞所作。(A)范文正是被揭發的人；(C)官運不達的說法是指梅聖俞，且是誤傳；(D)作者肯定歐陽脩不記人過惡。","goal":"能指出作者的觀點","pr":30},{"id":"114-chinese-25","y":"114","n":25,"img":"114_chinese_q25","pk":"114_chinese","ans":"B","pimg":"114_chinese_p25","grp":"114-chinese-25～26","exp":"公呆遇到動物接近會一起噴水警示，「正好讓人發現位置」，所以噴水反而暴露藏身處。(A)孫子說公呆受不了北極深海；(C)閉殼像石頭的是文蛤，公呆殼很薄；(D)晒太陽是孫子的想像。","goal":"能理解文意","pr":90},{"id":"114-chinese-26","y":"114","n":26,"img":"114_chinese_q26","pk":"114_chinese","ans":"A","pimg":"114_chinese_p25","grp":"114-chinese-25～26","exp":"外婆說公呆「懶」「呆」，孫子卻認為牠們是殼太薄才躺平，且要趁活著享受溫暖；結尾「在躺平年代裡，更容易理解躺平生物」，透過祖孫對話呈現不同世代的價值觀差異。","goal":"能分析文本的寫作手法","pr":86},{"id":"114-chinese-27","y":"114","n":27,"img":"114_chinese_q27","pk":"114_chinese","ans":"B","pimg":"114_chinese_p27","grp":"114-chinese-27～28","exp":"文中說春季北返有兩條路線：一條經臺灣東南外海的蘭嶼、琉球回日本，另一條經臺灣西岸。圖(二)的北上路線只畫了西岸這條，少畫了經由蘭嶼的路線。","goal":"能應用文本","pr":82},{"id":"114-chinese-28","y":"114","n":28,"img":"114_chinese_q28","pk":"114_chinese","ans":"C","pimg":"114_chinese_p27","grp":"114-chinese-27～28","exp":"文中說八卦山的次生林「提供了豐富的食物來源」，且山脈地形能提供猛禽滑翔需要的上升氣流，所以是食物豐富、地形適合。","goal":"能理解文意","pr":89},{"id":"114-chinese-29","y":"114","n":29,"img":"114_chinese_q29","pk":"114_chinese","ans":"C","pimg":"114_chinese_p29","grp":"114-chinese-29～31","exp":"甲文說視覺化寫作是用文字勾勒圖像，描寫場景與角色，讓劇本「深植於令人感覺真實的世界」，讀劇本的人因此較容易掌握情境。(A)視覺化寫作是對白以外的部分；(D)希區考克強調的是整個劇本。","goal":"能理解文意","pr":64},{"id":"114-chinese-30","y":"114","n":30,"img":"114_chinese_q30","pk":"114_chinese","ans":"D","pimg":"114_chinese_p29","grp":"114-chinese-29～31","exp":"「喀啦」是鼓棒斷掉的聲音，安德魯因此停下來，情節從拚命練習轉為停頓、疲憊，製造了轉折。(A)乙劇本沒有對白；(B)只有一個角色；(C)節拍器沒有故障。","goal":"能分析文本的寫作手法","pr":84},{"id":"114-chinese-31","y":"114","n":31,"img":"114_chinese_q31","pk":"114_chinese","ans":"C","pimg":"114_chinese_p29","grp":"114-chinese-29～31","exp":"畫線處寫「陰暗狹小的練習室」（場景外觀）、節拍器正在閃爍（場景事件）、安德魯試著打出雙跳（角色行動），但沒有描寫安德魯的長相或穿著，所以最無法呼應「角色外貌」。","goal":"能比較不同文本的內容","pr":84},{"id":"114-chinese-32","y":"114","n":32,"img":"114_chinese_q32","pk":"114_chinese","ans":"C","pimg":"114_chinese_p32","grp":"114-chinese-32～33","exp":"文中說這些人「並不關切生活品質、工作熱忱……」，一心只想問出金額比大小，所以「重視良好的生活品質」最不可能是原因。","goal":"能理解文意","pr":81},{"id":"114-chinese-33","y":"114","n":33,"img":"114_chinese_q33","pk":"114_chinese","ans":"D","pimg":"114_chinese_p32","grp":"114-chinese-32～33","exp":"「出賣自我、夢想、健康、幸福、信念，到了『夠』的時候，沒有人能不說夠」，意思是為了賺錢犧牲這些東西，犧牲到了極限時，每個人都只能說夠了。","goal":"能理解文意","pr":70},{"id":"114-chinese-34","y":"114","n":34,"img":"114_chinese_q34","pk":"114_chinese","ans":"A","pimg":"114_chinese_p34","grp":"114-chinese-34～35","exp":"「縮水式漲價」是價格不變、分量或內容減少。(A)是直接調漲價格，不是縮水式漲價。(B)滷蛋變半顆、(C)容量變少、(D)不再贈送作業簿，都是價格不變但內容減少。","goal":"能應用文本","pr":80},{"id":"114-chinese-35","y":"114","n":35,"img":"114_chinese_q35","pk":"114_chinese","ans":"D","pimg":"114_chinese_p34","grp":"114-chinese-34～35","exp":"企業推出小包裝新品或搭售，讓「消費者不易與原先的價格比較」，因此較不抗拒，原因是較難直觀察覺價格改變。","goal":"能理解文意","pr":75},{"id":"114-chinese-36","y":"114","n":36,"img":"114_chinese_q36","pk":"114_chinese","ans":"B","pimg":"114_chinese_p36","grp":"114-chinese-36～37","exp":"《舊五代史》把稱帝的十國君主列入「僭偽列傳」，《新五代史》以「世家」（諸侯王的體例）定位，兩者都沒有用帝王的「本紀」，所以都不承認南唐君主的帝王身分。","goal":"能理解文意","pr":52},{"id":"114-chinese-37","y":"114","n":37,"img":"114_chinese_q37","pk":"114_chinese","ans":"C","pimg":"114_chinese_p36","grp":"114-chinese-36～37","exp":"作者指出五代王位之爭血腥、難有建樹，反而南唐三位國君重視文教、珍藏圖書、網羅畫師，使南唐成為文化重鎮，可見作者肯定李氏三代對文化的貢獻。","goal":"能指出作者的觀點","pr":58},{"id":"114-chinese-38","y":"114","n":38,"img":"114_chinese_q38","pk":"114_chinese","ans":"A","pimg":"114_chinese_p38","grp":"114-chinese-38～39","exp":"諸樊、餘祭、夷眛、季子札是四兄弟；公子光是諸樊的兒子；僚是夷眛的兒子。符合的是(A)。","goal":"能理解文意","pr":62},{"id":"114-chinese-39","y":"114","n":39,"img":"114_chinese_q39","pk":"114_chinese","ans":"D","pimg":"114_chinese_p38","grp":"114-chinese-38～39","exp":"公子光說：若照兄弟順序，應該由季子札繼位；若照父子傳承，自己是長兄諸樊的嫡子，應該由自己繼位。僚兩種條件都不符合，所以公子光最無法接受僚當吳王。","goal":"能理解文意","pr":54},{"id":"114-chinese-40","y":"114","n":40,"img":"114_chinese_q40","pk":"114_chinese","ans":"B","pimg":"114_chinese_p40","grp":"114-chinese-40～42","exp":"「比來」是近來的意思。(A)「令郎」是對方的兒子，「令尊」是對方的父親；(C)「一旦」是某天、忽然；(D)「俗故」指世俗雜事，不是老友。","goal":"能理解文言文中字詞的意義","pr":58},{"id":"114-chinese-41","y":"114","n":41,"img":"114_chinese_q41","pk":"114_chinese","ans":"D","pimg":"114_chinese_p40","grp":"114-chinese-40～42","exp":"司馬光形容石月屏「天質圓瑩，非刻非繪」，像秋高氣清般天然，是天地的珍寶，所以非常喜愛。(A)他之前曾在京城朋友處見過；(B)「雖受文錦、白璧，未為重賜」是說石月屏對他來說比這些更珍貴；(C)他欣然收下。","goal":"能理解文意","pr":50},{"id":"114-chinese-42","y":"114","n":42,"img":"114_chinese_q42","pk":"114_chinese","ans":"B","pimg":"114_chinese_p40","grp":"114-chinese-40～42","exp":"這是一封答謝信（〈答薛虢州謝石月屏書〉），司馬光說「豈意一旦不煩懇請，坐致握中」，喜出望外，並為「久不遑修謝」感到惶恐，所以是寫信表達謝意。","goal":"能理解文意","pr":41},{"id":"115-chinese-1","y":"115","n":1,"img":"chinese_q01","pk":"115_chinese","ans":"B","exp":"「若即若離」的「即」是靠近、接近，「離」是離開，形容關係忽近忽遠。(A)立即、(C)就、(D)招之即來的「即」都是「立刻、就」的意思。","goal":"能理解常用字的字義","pr":86},{"id":"115-chinese-2","y":"115","n":2,"img":"chinese_q02","pk":"115_chinese","ans":"A","exp":"文中說「滇、緬、泰、越、寮位置鄰近，料理自然互相滲透，彼此影響」，椒麻雞從雲南傳到泰北再到臺灣，正說明料理會因地緣關係互相影響。其他選項文中都沒有提到。","goal":"能指出作者的觀點","pr":93},{"id":"115-chinese-3","y":"115","n":3,"img":"chinese_q03","pk":"115_chinese","ans":"D","exp":"資料一說史學家用「價值判斷」剪裁歷史；資料二說「史學家的解釋也互有出入」。兩者都認為史學家對歷史會有不同詮釋，所以選(D)。(A)資料一正好說史學家有偏見；(B)資料二認為歷史的客觀性「不容懷疑」；(C)兩則資料都沒有說不能懷疑史學家的記載。","goal":"能比較不同文本的內容","pr":89},{"id":"115-chinese-4","y":"115","n":4,"img":"chinese_q04","pk":"115_chinese","ans":"A","exp":"《說文解字》說「鬲」是「象腹交文，三足」，也就是依照器物的腹部紋路和三隻腳的外形畫出來，屬於依形狀造字的「象形」。","goal":"能辨別漢字造字原則","pr":75},{"id":"115-chinese-5","y":"115","n":5,"img":"chinese_q05","pk":"115_chinese","ans":"D","exp":"空格後面是在解釋「自由」包含哪些內容（體例、選材、篇幅、思想的自由），用來補充說明的標點是破折號「――」。","goal":"能依語境評斷標點符號使用的適切性","pr":78},{"id":"115-chinese-6","y":"115","n":6,"img":"chinese_q06","pk":"115_chinese","ans":"D","exp":"(A)「一無反顧」應為「義無反顧」；(B)「無名小足」應為「無名小卒」；(C)「防不慎防」應為「防不勝防」。只有(D)「安然無恙」完全正確。","goal":"能記憶常用字的字形","pr":55},{"id":"115-chinese-7","y":"115","n":7,"img":"chinese_q07","pk":"115_chinese","ans":"C","exp":"(A)瘡讀ㄔㄨㄤ；(B)置喙的「喙」讀ㄏㄨㄟˋ（鳥嘴，比喻插嘴）；(D)孰讀ㄕㄨˊ。(C)偕同的「偕」讀ㄒㄧㄝˊ，正確。","goal":"能記憶常用字的字音","pr":72},{"id":"115-chinese-8","y":"115","n":8,"img":"chinese_q08","pk":"115_chinese","ans":"C","exp":"資料說「第十二夜」是指聖誕節後第十二天的主顯節，劇本是為這天的宮廷戲劇展演而寫，「故得名」，所以劇名和主顯節的日期有關。(A)劇情與劇名「無直接關聯」；(B)沒有說連演十二天；(D)是先有宮中演戲的習俗，才有這齣劇。","goal":"能根據文本推論","pr":75},{"id":"115-chinese-9","y":"115","n":9,"img":"chinese_q09","pk":"115_chinese","ans":"C","exp":"詩人把書比喻成孩子：書被燒時像慈父生氣地把哭鬧的孩子丟開，但又「徐徐復自撫摩之」，慢慢地再去撫摸，表現捨不得書被燒壞的心情。(A)「元氣不可復」是說書受損後無法恢復，不是作者時日無多；(B)是一時的氣憤；(D)「上壽八十」是感嘆人的壽命有限。","goal":"能理解文意","pr":61},{"id":"115-chinese-10","y":"115","n":10,"img":"chinese_q10","pk":"115_chinese","ans":"D","exp":"《魏三體石經》（又稱正始石經）以古文、小篆、隸書三種字體刻成。圖中最下一列字形扁平、有波磔，正是隸書。行書、草書、楷書都不是這部石經的字體。","goal":"能辨別書法字體","pr":70},{"id":"115-chinese-11","y":"115","n":11,"img":"chinese_q11","pk":"115_chinese","ans":"B","exp":"「寫真式描寫」要細密、按次序、客觀地呈現完整形象。(B)依序寫兩手攀、兩腳縮、身子向左傾，像照片一樣客觀具體（出自朱自清〈背影〉）。(A)是議論；(C)、(D)用了大量抽象、象徵性的語彙。","goal":"能應用文本","pr":66},{"id":"115-chinese-12","y":"115","n":12,"img":"chinese_q12","pk":"115_chinese","ans":"D","exp":"文中說後漢高祖的襆頭「左右長尺餘，橫直之，不復上翹，迄今不改」，「迄今」指作者所在的宋代。所以宋代帝王的襆頭是兩腳又長又平直地向左右伸出，就是(D)。","goal":"能應用文本","pr":58},{"id":"115-chinese-13","y":"115","n":13,"img":"chinese_q13","pk":"115_chinese","ans":"A","exp":"作者評論高帝與僧虔比書法「亦猶雞之搏狸」，像雞去和狸貓打架，表示高帝不自量力，可見作者認為高帝的書法不如僧虔。(B)文中沒說子敬天下第一；(C)「稍乏風骨」是作者的評語；(D)「雞之搏狸」也是作者說的，不是僧虔。","goal":"能理解文意","pr":62},{"id":"115-chinese-14","y":"115","n":14,"img":"chinese_q14","pk":"115_chinese","ans":"B","exp":"2022年的大會訂下「2030年以前」全球陸域和海域要有「30%」保護區。所以前面的30指陸域和海域保護區的面積百分比，後面的30指預計達成目標的年分（2030年）。","goal":"能理解文意","pr":57},{"id":"115-chinese-15","y":"115","n":15,"img":"chinese_q15","pk":"115_chinese","ans":"A","exp":"團隊分工、長輩傳授年輕人、長者祈福，都和人與人之間的連結、文化傳承有關，所以有助社群凝聚與文化延續。「成品可以使用至少30年」只是說地毯耐用，和社群凝聚無關。","goal":"能理解文意","pr":57},{"id":"115-chinese-16","y":"115","n":16,"img":"chinese_q16","pk":"115_chinese","ans":"A","exp":"(A)「小女」謙稱自己的女兒，「令嬡」敬稱對方的女兒，使用正確。(B)問對方的哥哥應說「令兄」；(C)對方說的是「愚父子」（自己和兒子），回應卻用「賢昆仲」（敬稱對方兄弟），稱謂不符；(D)「令堂」是對方的母親，回答卻說「家父」，答非所問。","goal":"能依語境評斷稱謂使用的適切性","pr":51},{"id":"115-chinese-17","y":"115","n":17,"img":"chinese_q17","pk":"115_chinese","ans":"D","exp":"文中最後說賈似道「只想寫給喜愛鬥蟋蟀的賭徒參考」，所以《促織經》的目的是教人鬥蟋蟀時如何取勝。(A)歐洲的書晚了三百年才出現，沒說受它啟發；(C)作者說他不像歐洲博物學家那樣熱衷自然。","goal":"能根據文本推論","pr":56},{"id":"115-chinese-18","y":"115","n":18,"img":"chinese_q18","pk":"115_chinese","ans":"D","exp":"子產身為大國宰相，去拜見壺丘子林時卻和弟子們依年齡就座，「能捨之」放下身分，「以心與人相索」用真心與人交往，所以是跳脫貴賤框架、以誠待人。(C)「唯刑三人、殺二人」說明刑罰很少，不是嚴刑峻法。","goal":"能理解文意","pr":49},{"id":"115-chinese-19","y":"115","n":19,"img":"chinese_q19","pk":"115_chinese","ans":"A","exp":"(A)「胸無點墨」指沒有學問，用來說寫不出好文章，正確。(B)「休戚與共」指同甘共苦，不是休息；(C)「間不容髮」比喻情勢危急，不能形容關係好；(D)「瓜田李下」比喻容易引人懷疑的場合，不是田園生活。","goal":"能依語境評斷詞語使用的適切性","pr":50},{"id":"115-chinese-20","y":"115","n":20,"img":"chinese_q20","pk":"115_chinese","ans":"B","exp":"縣令派來的小吏寧可得罪人也要拿到回信才敢回去，蔣堂推斷「令必能者，使人不敢慢其命令如此」，表示縣令管理嚴格、治事有方；後來證實「縣令果能者」。(A)小吏是忠於命令；(C)蔣堂是替縣令宣揚名聲；(D)「卒為名臣」的是縣令。","goal":"能理解文意","pr":42},{"id":"115-chinese-21","y":"115","n":21,"img":"chinese_q21","pk":"115_chinese","ans":"D","exp":"無鬚者嘲笑鬚者臉皮厚，鬍鬚都能鑽透出來；鬚者反擊：「足下面皮更老，這等硬鬚還鑽不透」，意思是對方的臉皮厚到連硬鬍鬚都鑽不出來，所以以鬚者的立場，最硬的是無鬚者的面皮。","goal":"能理解文意","pr":49},{"id":"115-chinese-22","y":"115","n":22,"img":"chinese_q22","pk":"115_chinese","ans":"C","exp":"有人提議把梁山泊抽乾當農田，被質問大雨時水要往哪裡排？貢父說在旁邊再挖一個一樣大的池子就好，等於又把湖挖回來，大家聽了大笑，提議的人很慚愧。可見貢父是用反諷凸顯這個提議的荒謬。(A)提議是為了增加農田，不是解決淹水。","goal":"能理解文意","pr":54},{"id":"115-chinese-23","y":"115","n":23,"img":"chinese_q23","pk":"115_chinese","ans":"B","exp":"甲曲有「月淡」「一枝雪裡」等視覺，以及「暗香」嗅覺；乙曲有「雪散珍珠亂篩」視覺，以及「一枝風送香來」嗅覺。(A)甲沒有以雪喻梅，乙是以珍珠喻雪；(C)甲的次句「霜禽翠羽同期」沒有回答「誰知」；(D)沒有由近而遠的推移。","goal":"能分析文本的寫作手法","pr":46},{"id":"115-chinese-24","y":"115","n":24,"img":"chinese_q24","pk":"115_chinese","ans":"B","pimg":"chinese_p24","grp":"115-chinese-24～25","exp":"第二節寫黑白切是「一盤切碎的心肝腸肺」，咀嚼起來是「零零落落、毫無秩序的酸甜苦辣」，「切碎」的樣子正好呼應「零零落落」。(A)「野性」指夏天的生命力；(C)「啊！原來夏天如此爽口」是讚嘆；(D)沒有象徵人心險惡。","goal":"能分析文本的寫作手法","pr":80},{"id":"115-chinese-25","y":"115","n":25,"img":"chinese_q25","pk":"115_chinese","ans":"A","pimg":"chinese_p24","grp":"115-chinese-24～25","exp":"麻薏帶出「是去年與誰的故事」，黑白切帶出「生活的色香味」，兩節都是透過食物寫出生活的滋味與回憶。(B)沒有引用典故；(C)只有第二節寫黑與白；(D)黑白切不是當季食材。","goal":"能比較不同文本的內容","pr":86},{"id":"115-chinese-26","y":"115","n":26,"img":"chinese_q26","pk":"115_chinese","ans":"B","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"甲文說垂直農法「在密閉的室內種植農作物」，用營養液和LED燈，不受天候直接影響，所以受風災影響比傳統農業少。(A)用水量只有傳統的十分之一；(C)亞洲支持是因為人口稠密，不是成本低；(D)垂直農場目前只能為少數人服務。","goal":"能根據文本推論","pr":71},{"id":"115-chinese-27","y":"115","n":27,"img":"chinese_q27","pk":"115_chinese","ans":"B","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"②把高爾夫球場、運動場修剪的草屑和啤酒廠用過的穀物、麩，回收做成乳牛飼料，讓別處的廢棄物重新被利用，最能呼應「資源循環再生」。①是產量；③畫線部分講機器代勞；④是減少運輸成本。","goal":"能應用文本","pr":87},{"id":"115-chinese-28","y":"115","n":28,"img":"chinese_q28","pk":"115_chinese","ans":"A","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"研究人員說「乳牛應該在自然棲息地漫步」，把牠們搬到工業化環境「不是對待牠們應有的方式」，考量的是動物福利，也就是友善動物。","goal":"能理解文意","pr":88},{"id":"115-chinese-29","y":"115","n":29,"img":"chinese_q29","pk":"115_chinese","ans":"D","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"兩者都能減少食物里程（樓上種樓下賣、就近銷往當地）、都設在城市、都需要很高的資金成本（成本太高、三億歐元）。漂浮牧場的餵食、擠奶、清理都由機器代勞，並不需要大量人力，所以選(D)。","goal":"能比較不同文本的內容","pr":81},{"id":"115-chinese-30","y":"115","n":30,"img":"chinese_q30","pk":"115_chinese","ans":"D","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"④「有史以來最珍貴的船貨」把孩子比喻成最珍貴的東西，最能看出爸爸對孩子的重視。①②是對家鄉的回憶，③是寫航程的危險。","goal":"能理解文意","pr":84},{"id":"115-chinese-31","y":"115","n":31,"img":"chinese_q31","pk":"115_chinese","ans":"C","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"文中提到「我們穆斯林的清真寺」，家鄉經歷抗議、圍困、轟炸，現在和阿富汗人、敘利亞人等一起在海灘等船、「尋找家園」，還被說是「不速之客」，可知是逃離戰爭的穆斯林難民。","goal":"能理解文意","pr":81},{"id":"115-chinese-32","y":"115","n":32,"img":"chinese_q32","pk":"115_chinese","ans":"A","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"作者先回憶霍姆斯過去繁華的老城、市場、散步的夜晚，再寫後來的轟炸與死亡，用記憶畫面對照今昔變化。(B)列舉國家是說明難民來自各地；(C)他們是離開家鄉，不是近鄉情怯；(D)海的深廣是凸顯父親的無力。","goal":"能分析文本的寫作手法","pr":51},{"id":"115-chinese-33","y":"115","n":33,"img":"chinese_q33","pk":"115_chinese","ans":"C","pimg":"chinese_p33","grp":"115-chinese-33～34","exp":"文中說「翰林供奉的薪水參照八品京官」。(A)獨立辦公的是翰林學士；(B)翰林供奉「大都不兼職」；(D)翰林供奉會幫皇帝處理奏章。","goal":"能理解文意","pr":83},{"id":"115-chinese-34","y":"115","n":34,"img":"chinese_q34","pk":"115_chinese","ans":"B","pimg":"chinese_p33","grp":"115-chinese-33～34","exp":"翰林學士是從翰林供奉中挑出的佼佼者，「不光文筆一流，還通曉政治」，所以處理政務的能力優於翰林供奉。(A)是翰林學士兼任尚書、侍郎；(C)翰林待詔是陪皇帝玩的「幫閒」；(D)三者都「沒有專門的品級」。","goal":"能根據文本推論","pr":77},{"id":"115-chinese-35","y":"115","n":35,"img":"chinese_q35","pk":"115_chinese","ans":"C","pimg":"chinese_p35","grp":"115-chinese-35～36","exp":"文中說「每人四枝箭……四箭投完，司射計算總分，並宣告此局勝負」，所以四箭算一局。(A)沒有讓分的規定；(B)先秦時以禮數為旨，「而非娛樂競技」；(D)是「三局兩勝」，不是比總分。","goal":"能理解文意","pr":71},{"id":"115-chinese-36","y":"115","n":36,"img":"chinese_q36","pk":"115_chinese","ans":"C","pimg":"chinese_p35","grp":"115-chinese-35～36","exp":"依計分方式計算：第一局客人「×✓×✓」＝散箭1＋散箭1＝2分，主人「✓×✓×」＝有初10＋散箭1＝11分，主人勝。第二局客人「✓×××」＝10分，主人「×✓✓×」＝散箭1＋連中5＝6分，客人勝。第三局客人「×××✓」＝有終15分，主人「✓×××」＝10分，客人勝。客人兩勝一負，是最終贏家，所以(C)正確。","goal":"能應用文本","pr":79},{"id":"115-chinese-37","y":"115","n":37,"img":"chinese_q37","pk":"115_chinese","ans":"C","pimg":"chinese_p37","grp":"115-chinese-37～38","exp":"熱帶大頭家蟻殺死保護金合歡的舉尾蟻，沒有舉尾蟻的金合歡被非洲象破壞的速度快了5～7倍。(A)獅子數量保持穩定；(B)金合歡減少後獅子難以伏擊，斑馬反而較不易被獵殺；(D)舉尾蟻是被殺死，不是不再攻擊。","goal":"能理解文意","pr":80},{"id":"115-chinese-38","y":"115","n":38,"img":"chinese_q38","pk":"115_chinese","ans":"A","pimg":"chinese_p37","grp":"115-chinese-37～38","exp":"研究是在保護區內進行，但外來螞蟻照樣入侵並改變生態，所以無法說明設置保護區有助於維護原始生態。(B)外來種造成衝擊、(C)獅子改獵水牛、(D)舉尾蟻與金合歡的互利關係被破壞後引起連鎖反應，都能從研究中看出。","goal":"能根據文本推論","pr":73},{"id":"115-chinese-39","y":"115","n":39,"img":"chinese_q39","pk":"115_chinese","ans":"C","pimg":"chinese_p39","grp":"115-chinese-39～40","exp":"「嘗從余客荔城」的「客」是「旅居、作客」，當動詞用。(A)「至」是副詞，極、非常；(B)「若」是代名詞，你；(D)「過」是名詞，過錯。","goal":"能理解文言文中字詞的詞性","pr":52},{"id":"115-chinese-40","y":"115","n":40,"img":"chinese_q40","pk":"115_chinese","ans":"C","pimg":"chinese_p39","grp":"115-chinese-39～40","exp":"作者要去杭城，遂哭著要跟去，「余止之」，後來遂留在家鄉，所以是想跟從但聽命留下。(A)過世的是「主母」，而且是遂自己去買湯餅；(B)是怕摔壞主人轎中的東西；(D)文中沒有提到歸葬海山。","goal":"能理解文意","pr":42},{"id":"115-chinese-41","y":"115","n":41,"img":"chinese_q41","pk":"115_chinese","ans":"B","pimg":"chinese_p41","grp":"115-chinese-41～42","exp":"「見食相告」指雞看到食物會呼叫同伴，被視為「仁」。(A)「不見察」是不被賞識；(C)「一舉千里」是一飛就是千里；(D)「去之燕」是離開魯國前往燕國。","goal":"能理解句意","pr":68},{"id":"115-chinese-42","y":"115","n":42,"img":"chinese_q42","pk":"115_chinese","ans":"B","pimg":"chinese_p41","grp":"115-chinese-41～42","exp":"田饒說雞有五德卻被烹來吃，是因為「所從來者近」；黃鵠沒有五德卻被看重，是因為「所從來者遠」。意思是哀公看輕身邊的人才、看重遠方來的人，就像俗語「遠來的和尚會念經」。","goal":"能理解文意","pr":35},{"id":"ak-chinese-1","y":"ak","n":1,"html":"下列文句「」中的字，何者讀音正確？","opts":["面試前他「惴」惴不安，一直深呼吸：ㄓㄨㄟˋ","聽到這個消息，大家都「瞠」目結舌：ㄊㄤˊ","他誤觸法網，最後身陷「囹」圄：ㄌㄧㄥˋ","「莘」莘學子齊聚一堂，準備迎接會考：ㄒㄧㄣ"],"ans":"A","exp":"(A)惴讀ㄓㄨㄟˋ，正確。(B)瞠讀ㄔㄥ；(D)莘莘學子的「莘」讀ㄕㄣ；(C)囹讀ㄌㄧㄥˊ。","topic":"字音"},{"id":"ak-chinese-2","y":"ak","n":2,"html":"下列文句，何者用字完全正確？","opts":["他做事一向按步就班，從不馬虎","這次比賽他脫穎而出，令人刮目相看","面對挑戰，我們要再接再勵，不可放棄","老師的講解言簡意駭，大家一聽就懂"],"ans":"B","exp":"(A)應為「按部就班」；(C)應為「再接再厲」；(D)應為「言簡意賅」。只有(B)完全正確。","topic":"字形"},{"id":"ak-chinese-3","y":"ak","n":3,"html":"下列文句「」中的成語，何者使用最恰當？","opts":["他讀書總是「三心二意」，所以成績始終名列前茅","他筆下的花鳥「栩栩如生」，彷彿就要從紙上飛出來","兩人「一見如故」，從此反目成仇，不相往來","這家新開的餐廳「門可羅雀」，每天都大排長龍"],"ans":"B","exp":"(B)「栩栩如生」形容生動逼真，正確。(D)「門可羅雀」形容冷清，與大排長龍矛盾；(A)三心二意是不專心，與名列前茅不合；(C)一見如故是初見就很投緣，與反目成仇矛盾。","topic":"成語"},{"id":"ak-chinese-4","y":"ak","n":4,"html":"「這趟環島旅行，我最難忘的是三個地方□太魯閣的峽谷、墾丁的海灘，以及阿里山的日出。」根據文意，□處最適合填入哪一個標點符號？","opts":["，","；","：","。"],"ans":"C","exp":"空格後面是在列舉「三個地方」的具體內容，用來提示下文的標點是冒號「：」。","topic":"標點符號"},{"id":"ak-chinese-5","y":"ak","n":5,"html":"「讀書如交友，貴精不貴多。與其匆匆翻過一百本書，不如把一本好書讀上十遍，每一遍都會遇見不同的自己。」這段文字的主旨最接近下列何者？","opts":["讀書要廣泛涉獵，越多越好","交朋友應該以數量為重","好書值得反覆細讀，常讀常新","讀書的速度比讀書的內容重要"],"ans":"C","exp":"作者說讀書「貴精不貴多」，一本好書讀十遍，每遍都有新收穫，主旨是好書值得反覆細讀。(A)(D)與文意相反；(B)交友只是比喻。","topic":"文意理解"},{"id":"ak-chinese-6","y":"ak","n":6,"html":"表哥家的新房子落成，想送一幅匾額祝賀，下列題辭何者最適合？","opts":["美輪美奐","福壽全歸","杏林春暖","弄璋之喜"],"ans":"A","exp":"「美輪美奐」形容房屋高大華美，適合賀新居落成。(D)弄璋之喜賀生男孩；(C)杏林春暖用於讚美醫生；(B)福壽全歸用於輓年長男性。","topic":"題辭"},{"id":"ak-chinese-7","y":"ak","n":7,"html":"「時間是一位沉默的雕刻家，在每個人的臉上刻下歲月的紋路。」這句話主要使用了下列哪一種修辭？","opts":["設問","排比","誇飾","譬喻"],"ans":"D","exp":"「時間是一位雕刻家」把時間比喻成雕刻家，屬於譬喻（暗喻）。沒有誇大、沒有句型相同的排比，也沒有提問。","topic":"修辭"},{"id":"ak-chinese-8","y":"ak","n":8,"html":"《論語》：「三人行，必有我師焉：擇其善者而從之，其不善者而改之。」這段話的意思，與下列何者最接近？","opts":["出門在外最好三人同行，彼此照應","只和品德好的人交往，遠離品德不好的人","老師應該從學生身上學習，教學相長","看到別人的優點就學習，看到缺點就反省自己"],"ans":"D","exp":"「擇其善者而從之」是學習別人的優點，「其不善者而改之」是看到別人的缺點，就反省改正自己。所以是(D)。","topic":"文言單題"},{"id":"ak-chinese-9","y":"ak","n":9,"html":"根據本文，友人感到「慚」愧的原因最可能是下列何者？","opts":["陳太丘不等他就先離開了","被元方指出自己既不守信又沒有禮貌","元方年紀雖小，卻不願理睬他","他遲到太久，被罰不能進門"],"ans":"B","exp":"元方說友人約好中午卻沒來是「無信」，當著兒子的面罵父親是「無禮」，友人聽了覺得慚愧。","topic":"文言題組","grp":"ak-chinese-9～10","passage":"<p>陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。<\/p><p style=\"text-align:right\">——《世說新語》<\/p>"},{"id":"ak-chinese-10","y":"ak","n":10,"html":"文中「尊君在不」的「尊君」，指的是下列何者？","opts":["對方的父親","一國的君王","學生的老師","自己的父親"],"ans":"A","exp":"「尊君」是對別人父親的敬稱，相當於「令尊」；元方說的「家君」才是對自己父親的謙稱。客人問的是元方的父親陳太丘在不在。","topic":"文言題組","grp":"ak-chinese-9～10","passage":"<p>陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。<\/p><p style=\"text-align:right\">——《世說新語》<\/p>"},{"id":"ak-chinese-11","y":"ak","n":11,"html":"根據本文，青少年早上不容易起床的主要原因是什麼？","opts":["課業壓力太大","晚上沉迷手機，太晚睡覺","早餐吃得太少","生理時鐘往後延"],"ans":"D","exp":"文中說青春期大腦分泌褪黑激素的時間往後延，「這並不是懶惰，而是生理時鐘的改變」。手機、課業、早餐文中都沒有提到。","topic":"白話閱讀","grp":"ak-chinese-11～12","passage":"<p>研究指出，青少年進入青春期後，大腦分泌褪黑激素的時間會往後延，使他們晚上較晚才有睡意，早上也不容易醒來。這並不是懶惰，而是生理時鐘的改變。然而學校多半很早開始上課，使許多學生長期睡眠不足，上課時注意力下降，情緒也較容易起伏。<\/p><p>美國部分學區將第一節課延後約一小時後，學生遲到與缺席的情形減少，考試成績也略有提升。不過，延後上課也讓家長接送、課後活動的時間安排變得更困難，因此是否跟進，各地仍有不同意見。<\/p>"},{"id":"ak-chinese-12","y":"ak","n":12,"html":"關於文中「延後上課」的說明，下列何者最恰當？","opts":["美國所有學區都已經全面實施","會讓學生的考試成績大幅下降","有好處，但也帶來時間安排上的困難","可以完全解決學生睡眠不足的問題"],"ans":"C","exp":"延後上課讓遲到缺席減少、成績略升（好處），但家長接送和課後活動更難安排（困難）。(D)文中沒說完全解決；(A)只有部分學區；(B)成績是略有提升。","topic":"白話閱讀","grp":"ak-chinese-11～12","passage":"<p>研究指出，青少年進入青春期後，大腦分泌褪黑激素的時間會往後延，使他們晚上較晚才有睡意，早上也不容易醒來。這並不是懶惰，而是生理時鐘的改變。然而學校多半很早開始上課，使許多學生長期睡眠不足，上課時注意力下降，情緒也較容易起伏。<\/p><p>美國部分學區將第一節課延後約一小時後，學生遲到與缺席的情形減少，考試成績也略有提升。不過，延後上課也讓家長接送、課後活動的時間安排變得更困難，因此是否跟進，各地仍有不同意見。<\/p>"},{"id":"ak-chinese-13","y":"ak","n":13,"html":"根據公告，下列敘述何者正確？","opts":["週一晚上可以到館借書","每張借書證最多可借 21 冊","7 月 21 日仍可以把書投入館外還書箱歸還","預約的書可以線上續借一次"],"ans":"C","exp":"整修期間（7/20～7/22）「還書請投入館外還書箱」，所以 7 月 21 日可以這樣還書。(A)週一休館；(D)預約書不得續借；(B)每證最多 10 冊，21 是借期天數。","topic":"公告判讀","grp":"ak-chinese-13～15","passage":"<p><b>【社區圖書館暑期公告】<\/b><\/p><p>一、開放時間：週二至週日 9:00～21:00，週一休館。<br>二、借閱：每證最多借 10 冊，借期 21 天，可線上續借一次（14 天）；預約書不得續借。<br>三、逾期：每冊每日罰款 5 元。<br>四、7 月 20 日至 7 月 22 日館內整修暫停開放，期間還書請投入館外還書箱。<\/p>"},{"id":"ak-chinese-14","y":"ak","n":14,"html":"阿哲借了 3 本書，逾期 4 天才歸還，依公告他需要繳多少罰款？","opts":["20 元","45 元","60 元","84 元"],"ans":"C","exp":"每冊每日 5 元：3 冊 × 4 天 × 5 元 ＝ 60 元。","topic":"公告判讀","grp":"ak-chinese-13～15","passage":"<p><b>【社區圖書館暑期公告】<\/b><\/p><p>一、開放時間：週二至週日 9:00～21:00，週一休館。<br>二、借閱：每證最多借 10 冊，借期 21 天，可線上續借一次（14 天）；預約書不得續借。<br>三、逾期：每冊每日罰款 5 元。<br>四、7 月 20 日至 7 月 22 日館內整修暫停開放，期間還書請投入館外還書箱。<\/p>"},{"id":"ak-chinese-15","y":"ak","n":15,"html":"若想讓一本一般的書借得最久，下列做法何者正確？","opts":["借書後線上續借一次，最長可借 35 天","線上續借兩次，最長可借 49 天","先預約這本書，再線上續借","整修期間不算借期，可多借 3 天"],"ans":"A","exp":"借期 21 天，可線上續借一次 14 天，最長 21＋14＝35 天。(B)只能續借一次；(C)預約書不得續借；(D)公告沒有這樣說。","topic":"公告判讀","grp":"ak-chinese-13～15","passage":"<p><b>【社區圖書館暑期公告】<\/b><\/p><p>一、開放時間：週二至週日 9:00～21:00，週一休館。<br>二、借閱：每證最多借 10 冊，借期 21 天，可線上續借一次（14 天）；預約書不得續借。<br>三、逾期：每冊每日罰款 5 元。<br>四、7 月 20 日至 7 月 22 日館內整修暫停開放，期間還書請投入館外還書箱。<\/p>"}],"english":[{"id":"104-english-1","y":"104","n":1,"img":"104_english_q01","pk":"104_english","ans":"D"},{"id":"104-english-2","y":"104","n":2,"img":"104_english_q02","pk":"104_english","ans":"B"},{"id":"104-english-3","y":"104","n":3,"img":"104_english_q03","pk":"104_english","ans":"D"},{"id":"104-english-4","y":"104","n":4,"img":"104_english_q0 50},{"id":"115-english-38","y":"115","n":38,"img":"english_q38","pk":"115_english","ans":"C","pimg":"english_p35","grp":"115-english-35～39","exp":"Adams 認為冰島人可能很快放棄冰島語，是擔心的；Eggertsson 說 does the future really look that bad?，認為冰島語人數足夠、還有學校教，並不擔心。","goal":"指出作者的目的或態度","pr":56},{"id":"115-english-39","y":"115","n":39,"img":"english_q39","pk":"115_english","ans":"B","pimg":"english_p35","grp":"115-english-35～39","exp":"Adams 說冰島語使用者只有 314,000 人，人數少，所以公司不願改語言；Eggertsson 說至少要 35,000 人才安全，314,000 人已足夠。兩人都談到說冰島語的人數是否夠多。","goal":"推論文中隱含的訊息","pr":48},{"id":"115-english-40","y":"115","n":40,"img":"english_q40","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"國王沒有孩子，擔心死後國家落入壞人手中，所以「決定選一個孩子接位」。他發種子給孩子們，所以是要「選出下一任國王」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":68},{"id":"115-english-41","y":"115","n":41,"img":"english_q41","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"後文說 Wong still didn't find anything in his（他的盆裡還是什麼都沒有），所以是「好幾個月過去了，什麼都沒長出來」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":58},{"id":"115-english-42","y":"115","n":42,"img":"english_q42","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"Sung 是第一個告訴大家他的種子長出小植物的人，接著大家才一個個說自己的也長了，所以他是「第一個分享好消息的人」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":49},{"id":"115-english-43","y":"115","n":43,"img":"english_q43","pk":"115_english","ans":"C","pimg":"english_p40","grp":"115-english-40～43","exp":"國王事先把種子煮過，根本不可能發芽。只有 Wong 誠實地帶著空盆子來，所以只有他「誠實」到足以當國王。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":61},{"id":"ak-english-1","y":"ak","n":1,"html":"My brother is really into ______. He plays the guitar, the piano, and the drums.","opts":["drawing","sports","music","cooking"],"ans":"C","exp":"他會彈吉他、鋼琴和打鼓，所以他熱衷的是「音樂」（music）。be into 是「熱衷於」。","topic":"字彙"},{"id":"ak-english-2","y":"ak","n":2,"html":"It's raining cats and dogs outside. Don't forget to take your ______ with you.","opts":["fan","gloves","umbrella","sunglasses"],"ans":"C","exp":"raining cats and dogs 是「下傾盆大雨」，所以要帶傘（umbrella）。","topic":"字彙"},{"id":"ak-english-3","y":"ak","n":3,"html":"Amy loves Japanese food. She has ______ to Japan three times.","opts":["be","been","go","went"],"ans":"B","exp":"現在完成式 has/have + 過去分詞。have been to 表示「去過某地（已經回來）」，所以用 been。","topic":"現在完成式"},{"id":"ak-english-4","y":"ak","n":4,"html":"This chocolate cake looks great! It ______ by my mom last night.","opts":["was made","has made","made","is made"],"ans":"A","exp":"蛋糕是「被做」的，用被動語態 be + 過去分詞；last night 是過去時間，所以用 was made。","topic":"被動語態"},{"id":"ak-english-5","y":"ak","n":5,"html":"Excuse me. Could you tell me ______ the next train will arrive?","opts":["which","when","what","who"],"ans":"B","exp":"問的是火車「什麼時候」到，間接問句用 when + 主詞 + 動詞：when the next train will arrive。","topic":"間接問句"},{"id":"ak-english-6","y":"ak","n":6,"html":"Kevin is the ______ runner in our class. Nobody runs faster than he does.","opts":["fast","fastest","faster","most fast"],"ans":"B","exp":"沒有人跑得比他快，表示他是全班「最快」的。the + 最高級：the fastest。fast 是單音節，不用 most。","topic":"最高級"},{"id":"ak-english-7","y":"ak","n":7,"html":"If it ______ tomorrow, we will stay at home and watch movies.","opts":["rained","will rain","rains","raining"],"ans":"C","exp":"表示未來可能情況的 if 子句，用現在式代替未來式：If it rains tomorrow, we will…","topic":"條件句"},{"id":"ak-english-8","y":"ak","n":8,"html":"Tom: Would you like some more tea?<br>Lisa: ______ I've had enough.","opts":["No, thanks.","Here you are.","Yes, please.","Of course."],"ans":"A","exp":"Lisa 說「我已經喝夠了」，所以要婉拒：No, thanks.","topic":"對話"},{"id":"ak-english-9","y":"ak","n":9,"html":"The movie was so ______ that I fell asleep halfway through it.","opts":["boring","scary","exciting","interesting"],"ans":"A","exp":"看到一半睡著了，表示電影很「無聊」（boring）。so…that… 表示「如此……以致於……」。","topic":"字彙"},{"id":"ak-english-10","y":"ak","n":10,"html":"Neither Ben nor his sisters ______ at home right now. They are all at school.","opts":["is","was","are","be"],"ans":"C","exp":"neither A nor B 的動詞和較靠近的 B 一致；his sisters 是複數，加上 right now 用現在式，所以用 are。","topic":"主詞動詞一致"},{"id":"ak-english-11","y":"ak","n":11,"html":"Why did Owen buy new running shoes?","opts":["He joined a running team.","His old ones were too small.","His grandma asked him to.","They were on sale."],"ans":"B","exp":"信中說 because my old ones were too small，舊鞋太小了。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-12","y":"ak","n":12,"html":"What do we know about the bike?","opts":["He will ride it to the science fair.","Owen has already bought it.","Grandma gave it to him as a gift.","His mom will pay for half of it if he saves enough."],"ans":"D","exp":"Mom says if I save half of the price by December, she'll pay the other half：如果他在12月前存到一半，媽媽會付另一半。他還在存錢，還沒買。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-13","y":"ak","n":13,"html":"What is the main purpose of Owen's letter?","opts":["To invite Grandma to the science fair.","To ask Grandma for more money.","To explain how to build a robot.","To thank Grandma and share his news."],"ans":"D","exp":"信一開始感謝奶奶的卡片和錢，接著分享買鞋、存錢、科展的近況，最後邀請奶奶來過聖誕節。主要目的是道謝和分享近況。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-14","y":"ak","n":14,"html":"Jenny, a junior high student, goes to the pool alone. She brings her student ID but forgets her swimming cap. How much does she need to pay?","opts":["$60","$100","$110","$150"],"ans":"C","exp":"學生票（有學生證）$60，加上一定要戴泳帽，要在櫃臺買一頂 $50，共 $110。","topic":"閱讀：告示","grp":"ak-english-14～15","passage":"<p><b>City Swimming Pool — Summer Hours<\/b><\/p><p>Monday–Friday: 6:00 a.m.–9:00 p.m.<br>Saturday–Sunday: 8:00 a.m.–6:00 p.m.<\/p><p>Tickets: Adults $100 / Students (with ID) $60 / Children under 6: free<\/p><p>* Swimming caps are required. Caps can be bought at the front desk ($50).<br>* The pool is closed for cleaning on the first Monday of every month.<\/p>"},{"id":"ak-english-15","y":"ak","n":15,"html":"Which is true about the City Swimming Pool?","opts":["Children under 6 need to pay $60.","You can swim there at 7:00 a.m. on Sunday.","It is open until 9:00 p.m. on Saturday.","It is closed on the first Monday of every month."],"ans":"D","exp":"告示寫 closed for cleaning on the first Monday of every month。(B)(C)週末是 8:00 a.m.～6:00 p.m.；(A)6歲以下免費。","topic":"閱讀：告示","grp":"ak-english-14～15","passage":"<p><b>City Swi h-2","y":"ak","n":2,"html":"小安和小平各有一些貼紙。小安的貼紙張數是 3x − 7，小平是 2x + 5。若兩人的貼紙一樣多，則 x 為何？","opts":["−12","−2","2","12"],"ans":"D","exp":"3x－7＝2x＋5，移項得 3x－2x＝5＋7，x＝12。","topic":"一元一次方程式"},{"id":"ak-math-3","y":"ak","n":3,"html":"計算 √48 + √27 的結果為何？","opts":["7√3","12√3","√75","5√3"],"ans":"A","exp":"√48＝√(16×3)＝4√3，√27＝√(9×3)＝3√3，相加得 7√3。注意 √48＋√27 不等於 √75。","topic":"根式"},{"id":"ak-math-4","y":"ak","n":4,"html":"計程車的車資 y（元）與里程 x（公里）的關係為 y = 20x + 85。若某趟車資為 245 元，則里程為多少公里？","opts":["6","7","8","9"],"ans":"C","exp":"20x＋85＝245，20x＝160，x＝8 公里。","topic":"一次函數"},{"id":"ak-math-5","y":"ak","n":5,"html":"小組五人一週運動的天數分別為 3、5、5、7、10 天。關於這組資料，下列敘述何者正確？","opts":["平均數、中位數、眾數三者都相等","中位數等於眾數","平均數等於中位數","平均數等於眾數"],"ans":"B","exp":"平均數＝(3＋5＋5＋7＋10)÷5＝30÷5＝6；由小到大排列後中位數是第3個＝5；眾數（出現最多次）是5。中位數＝眾數＝5，平均數是6。","topic":"統計"},{"id":"ak-math-6","y":"ak","n":6,"html":"禮堂的座位第 1 排有 4 個，之後每一排都比前一排多 3 個。第 10 排有幾個座位？","opts":["30","31","34","37"],"ans":"B","exp":"首項 4、公差 3 的等差數列，第 n 項＝4＋(n－1)×3。第10排＝4＋9×3＝31 個。","topic":"等差數列"},{"id":"ak-math-7","y":"ak","n":7,"html":"直角三角形兩股長分別為 6 與 8，則斜邊上的高為多少？","opts":["4","4.8","5","7"],"ans":"B","exp":"斜邊＝√(6²＋8²)＝10。面積＝6×8÷2＝24，也等於 10×高÷2，所以高＝48÷10＝4.8。","topic":"畢氏定理"},{"id":"ak-math-8","y":"ak","n":8,"html":"將 x² − 5x − 14 因式分解，結果為下列何者？","opts":["(x − 14)(x + 1)","(x + 7)(x − 2)","(x + 14)(x − 1)","(x − 7)(x + 2)"],"ans":"D","exp":"找兩數相乘為 −14、相加為 −5：−7 和 2。所以 x²－5x－14＝(x－7)(x＋2)。","topic":"因式分解"},{"id":"ak-math-9","y":"ak","n":9,"html":"某正多邊形的每一個內角都是 140°，則它是正幾邊形？","opts":["正七邊形","正八邊形","正九邊形","正十邊形"],"ans":"C","exp":"每個外角＝180°－140°＝40°，正多邊形外角和為 360°，邊數＝360÷40＝9。","topic":"多邊形"},{"id":"ak-math-10","y":"ak","n":10,"html":"一圓的半徑為 5 公分，圓心到某一條弦的距離為 3 公分，則這條弦長為多少公分？","opts":["4","6","8","10"],"ans":"C","exp":"圓心到弦的垂線平分弦，半弦長＝√(5²－3²)＝4，弦長＝2×4＝8 公分。","topic":"圓"},{"id":"ak-math-11","y":"ak","n":11,"html":"袋中有 3 顆紅球、5 顆白球，每顆球被取出的機會相等。從袋中任取一顆，取到紅球的機率為何？","opts":["1/3","3/8","3/5","5/8"],"ans":"B","exp":"共 3＋5＝8 顆球，紅球 3 顆，機率＝3/8。","topic":"機率"},{"id":"ak-math-12","y":"ak", social-52～54"},{"id":"114-social-1","y":"114","n":1,"img":"114_social_q01","pk":"114_social","ans":"A","exp":"題目說臺灣因位於地震帶、常有颱風而被列入。日本同樣位在環太平洋地震帶，又常受颱風侵襲，最符合。伊朗多地震但少颱風；北韓、澳洲都不是兩者兼具。","goal":"了解世界重要國家的自然環境特色。","pr":91},{"id":"114-social-2","y":"114","n":2,"img":"114_social_q02","pk":"114_social","ans":"A","exp":"臺灣開放農場、牧場合法聘僱農業移工，主要是因為農村人口老化、年輕人不願務農，農業勞動力不足。","goal":"了解臺灣面臨的農業問題與可能的因應方式。","pr":86},{"id":"114-social-3","y":"114","n":3,"img":"114_social_q03","pk":"114_social","ans":"B","exp":"電影中移民在美國仍說華語、過春節清明，是移民把原鄉文化帶到新居地延續。泰、緬新住民與移工在臺灣齊聚慶祝潑水節，也是同樣的概念。","goal":"了解文化擴散的概念。","pr":83},{"id":"114-social-4","y":"114","n":4,"img":"114_social_q04","pk":"114_social","ans":"B","exp":"從1904年臺灣堡圖可看到挖仔聚落位在河道彎曲處旁邊，且在臺灣西南部平原，地名最可能是指鄰近河道轉彎的地方。","goal":"判讀地圖資訊並作出合理推論。","pr":62},{"id":"114-social-5","y":"114","n":5,"img":"114_social_q05","pk":"114_social","ans":"B","exp":"離島地區醫療資源不足，重症常需送往本島，所以離島民眾最關心醫療資源分配。房價、重工業汙染、大規模土石流都較不是離島的主要問題。","goal":"了解臺灣的區域差異及問題。","pr":81},{"id":"114-social-6","y":"114","n":6,"img":"114_social_q06","pk":"114_social","ans":"C","exp":"圖中標示「臺灣總督府」「帝國大學」「鐵道部工場」「臺灣神社」，都是日本統治時期的建築，所以是〈臺北州大觀〉。","goal":"認識臺灣日治時期社會的樣貌。","pr":85},{"id":"114-social-7","y":"114","n":7,"img":"114_social_q07","pk":"114_social","ans":"D","exp":"提倡女性的入學、交友、營業、財產、出入、婚姻自由等「自然權利」，是受到近代歐洲天賦人權思想影響，屬於晚清西方思潮傳入中國的時期。","goal":"認識中國晚清時期婦女角色的轉變。","pr":79},{"id":"114-social-8","y":"114","n":8,"img":"114_social_q08","pk":"114_social","ans":"C","exp":"在廣州負責管理外國商人、收取關稅、接收貢品、專賣進口商品的機構，是唐宋以後設立的「市舶司」。洋行是清代的；總理衙門是清末的外交機構。","goal":"認識中國歷史上對外商貿的管理機構。","pr":66},{"id":"114-social-9","y":"114","n":9,"img":"114_social_q09","pk":"114_social","ans":"C","exp":"五四運動後，部分知識分子對西方失望，轉向俄國革命理論（共產主義），因此在1921年成立中國共產黨。","goal":"了解中國共產黨成立的歷史背景。","pr":52},{"id":"114-social-10","y":"114","n":10,"img":"114_social_q10","pk":"114_social","ans":"B","exp":"版畫把羅馬教宗畫成怪獸，諷刺教會用「滿滿一袋赦罪，用錢來贖」販賣贖罪券，這是宗教改革時期支持路德、批評天主教會的立場。路德主張「因信得救」。","goal":"了解宗教改革的重要主張。","pr":62},{"id":"114-social-11","y":"114","n":11,"img":"114_social_q11","pk":"114_social","ans":"C","exp":"跨國咖啡公司改用與當地環境相容的色系、當地文字招牌、加入當地料理，是尊重當地文化並與之融合。","goal":"發覺面對文化差異時，互相尊重與包容的作為。","pr":90},{"id":"114-social-12","y":"114","n":12,"img":"114_social_q12","pk":"114_social","ans":"D","exp":"美國禁止進口新疆強迫勞動生產的商品，是為了避免企業從侵害人權的生產中獲利。","goal":"從他國實例中發覺關於人權議題的作為。","pr":88},{"id":"114-social-13","y":"114","n":13,"img":"114_social_q13","pk":"114_social","ans":"D","exp":"廠商越多，消費者選擇越多，彼此競爭越激烈。招募更多廠商進駐美食街最能提升市場競爭程度。","goal":"理解市場競爭程度的概念。","pr":74},{"id":"114-social-14","y":"114","n":14,"img":"114_social_q14","pk":"114_social","ans":"C","exp":"乙、丙是姊妹（旁系血親），甲和乙、丙和丁是夫妻（配偶），甲和丙、乙和丁、甲和丁是姻親。四人之中沒有父母子女這種直系血親。","goal":"理解家人間的親屬關係。","pr":63},{"id":"114-social-15","y":"114","n":15,"img":"114_social_q15","pk":"114_social","ans":"C","exp":"W電視報導該候選人時負面報導占了28%中的21%，水果臺則多數是正面報導，可見不同媒體對同一候選人有不同立場，閱聽人要留意媒體是否持有特定立場。","goal":"檢視媒體報導政治人物時間、評價的差異，探討媒體在公共意見形成過程中的影響。","pr":78},{"id":"114-social-16","y":"114","n":16,"img":"114_social_q16","pk":"114_social","ans":"C","exp":"西部陸海新通道從成都、重慶通往廣西南寧，再出海往南，最主要是方便中國西部與東南亞國家（東協）的貿易往來。","goal":"分析交通建設對區域發展的影響。","pr":74},{"id":"114-social-17","y":"114","n":17,"img":"114_social_q17","pk":"114_social","ans":"A","exp":"告示牌說上游水壩會洩洪，不能進入溪谷，所以祕境在水壩下游的溪谷中。圖中甲位在水壩下游的河谷，最符合。","goal":"了解水系的概念並判讀等高線地形圖。","pr":60},{"id":"114-social-18","y":"114","n":18,"img":"114_social_q18","pk":"114_social","ans":"B","exp":"甲地物價、房價高，鄰國乙地一天薪水在甲地一小時就賺得到，人們住在乙地、通勤到甲地工作。美國與墨西哥相鄰、薪資差距很大，最符合。","goal":"了解世界重要國家的經濟發展特色。","pr":72},{"id":"114-social-19","y":"114","n":19,"img":"114_social_q19","pk":"114_social","ans":"D","exp":"甲區域的人口金字塔底部寬、頂部尖，幼年人口多、老年人口少，是高出生率的年輕型人口結構，最可能是漠南非洲。歐洲、北美、東北亞都較高齡化。","goal":"判讀人口金字塔及了解漠南非洲的人口特色。","pr":67},{"id":"114-social-20","y":"114","n":20,"img":"114_social_q20","pk":"114_social","ans":"C","exp":"圖(八)的漏斗狀陶器（糖漏）是用來製糖的。18～19世紀臺灣的製糖業集中在西南部的臺南一帶，也就是丙。","goal":"認識臺灣清帝國時期的糖業發展。","pr":65},{"id":"114-social-21","y":"114","n":21,"img":"114_social_q21","pk":"114_social","ans":"A","exp":"由統治者任用非世襲的官員，建立中央集權政府，起源於東周、秦統一後全面施行，是「郡縣制度」。封建制度是世襲的；科舉、九品官人法是選才制度。","goal":"了解中國歷史上的重要政治制度。","pr":63},{"id":"114-social-22","y":"114","n":22,"img":"114_social_q22","pk":"114_social","ans":"C","exp":"報導中提到重慶是「陪都」，和中、英、美、蘇「四國」聯合同盟，慶祝「大功告成」，是八年抗戰勝利的慶祝。","goal":"認識第二次世界大戰期間的中國局勢。","pr":72},{"id":"114-social-23","y":"114","n":23,"img":"114_social_q23","pk":"114_social","ans":"A","exp":"1989年的泛歐野餐，從共產國家逃往奧地利的大多是東德人。圖中甲是當時的東德，屬於共產集團；乙、丙、丁都是西歐國家。","goal":"了解美、蘇冷戰下的歐洲局勢。","pr":68},{"id":"114-social-24","y":"114","n":24,"img":"114_social_q24","pk":"114_social","ans":"D","exp":"各年級願意用網路投票的比例（90%以上）都遠高於實體投票（約40多%），可見使用科技能提升學生參與公共事務的程度。","goal":"發覺科技發展對中學生參與公共事務的影響。","pr":82},{"id":"114-social-25","y":"114","n":25,"img":"114_social_q25","pk":"114_social","ans":"D","exp":"規定出勤紀錄預設是加班，要由雇主舉證，因為員工通常較難取得證據，這樣規定是為了平衡勞資雙方不對等的權力關係。","goal":"從日常生活的勞資糾紛中，解釋立法保障勞動權益的理由。","pr":73},{"id":"114-social-26","y":"114","n":26,"img":"114_social_q26","pk":"114_social","ans":"A","exp":"家中有未滿6歲子女的已婚女性，勞動力參與率比沒有子女或子女都在6歲以上的女性低，可見照顧幼兒等家務勞動影響了女性參與市場勞動的機會。","goal":"檢視關於已婚女性勞動力參與率的統計資料，解析家務勞動的分擔影響女性的個人發展與市場勞動參與。","pr":74},{"id":"114-social-27","y":"114","n":27,"img":"114_social_q27","pk":"114_social","ans":"D","exp":"博斯普魯斯海峽航運量太大，船隻常要排隊等候。開鑿新運河分流後，等候通過海峽的時間會減少。","goal":"分析交通路線的興建對區域發展的影響。","pr":71},{"id":"114-social-28","y":"114","n":28,"img":"114_social_q28","pk":"114_social","ans":"B","exp":"圖中國家是新加坡，位在北緯1.33度，接近赤道、在太陽直射範圍內，太陽輻射強，適合發展太陽能。最高點只有163公尺，沒有高山發展水力。","goal":"分析世界重要國家發展綠能的條件。","pr":63},{"id":"114-social-29","y":"114","n":29,"img":"114_social_q29","pk":"114_social","ans":"B","exp":"中國降水由東南沿海向西北內陸遞減。年降水量低於全國平均（691.6毫米）的地區，主要是北方和西北內陸，所以深灰色應分布在北部與西部，符合(B)。","goal":"了解中國的氣候特色。","pr":57},{"id":"114-social-30","y":"114","n":30,"img":"114_social_q30","pk":"114_social","ans":"C","exp":"碳匯是能吸收、儲存碳的地方，如土壤、森林。恢復農地並以友善環境方式耕作，可以增加土壤的儲碳量。(A)焚林會釋放碳；(B)(D)是減少排放，不是增加碳匯。","goal":"了解減緩全球暖化的策略。","pr":66},{"id":"114-social-31","y":"114","n":31,"img":"114_social_q31","pk":"114_social","ans":"A","exp":"碑文說政府召募高砂族青年組成義勇隊，在南洋戰場上作戰，這是二次大戰時期日本推動皇民化運動的背景。","goal":"了解皇民化時期臺灣原住民的戰爭經驗。","pr":65},{"id":"114-social-32","y":"114","n":32,"img":"114_social_q32","pk":"114_social","ans":"B","exp":"臺灣原住民被日本人帶去日本、回來後被荷蘭人監禁，引發日人挾持臺灣長官的衝突（濱田彌兵衛事件），發生在17世紀荷蘭統治的大員（今臺南安平）。","goal":"認識大航海時代臺灣原住民與各方勢力的互動。","pr":70},{"id":"114-social-33","y":"114","n":33,"img":"114_social_q33","pk":"114_social","ans":"D","exp":"1946年臺灣光復後與中國大陸仍有往來，可以出口鳳梨罐頭；1949年政府遷臺後兩岸隔絕，之後出口數量都是0。符合的是丁。","goal":"了解臺海兩岸關係變化對臺灣貿易的影響。","pr":38},{"id":"114-social-34","y":"114","n":34,"img":"114_social_q34","pk":"114_social","ans":"C","exp":"演講者曾擔任立法委員，立法委員可以對司法院院長的被提名人行使同意權。(A)審核決算是監察院審計部；(B)提請任命部會首長是行政院長；(D)彈劾法官是監察委員。","goal":"理解立法院的職權。","pr":53},{"id":"114-social-35","y":"114","n":35,"img":"114_social_q35","pk":"114_social","ans":"B","exp":"乙資料中地方議會要求政府依法召開公聽會、聽取居民意見，顯示政府權力受到約束與制衡。甲資料是強迫人民服勞役，沒有保障勞動權利。","goal":"從不同時空脈絡中的人類生活情形，探討法治與人治的差異。","pr":77},{"id":"114-social-36","y":"114","n":36,"img":"114_social_q36","pk":"114_social","ans":"A","exp":"甲是檢察官，依據犯罪事證提起公訴是檢察官的職權，所以(A)適當。(B)法庭上有檢察官，是刑事案件，被告說要償還借款（民事）不符情境；(C)丙是辯護律師，判決是法官的工作，不是由檢察官甲判決；(D)撤銷行政處分是行政訴訟，與本案不符。","goal":"理解在犯罪的追訴及處罰過程中，檢察官及法官的功能與權限。","pr":68},{"id":"114-social-37","y":"114","n":37,"img":"114_social_q37","pk":"114_social","ans":"C","exp":"社會企業以商業活動獲利，並把利潤投入改善社會問題。提倡公平貿易、用合理價格收購小農產品幫助小農，符合這種模式。(D)募捐是非營利組織的做法。","goal":"檢視新型態的企業經營模式，解析有助促進社會公平正義的商業活動。","pr":43},{"id":"114-social-38","y":"114","n":38,"img":"114_social_q38","pk":"114_social","ans":"A","exp":"法院對爺爺作出監護宣告後，爺爺會成為無行為能力人，他自己做的贈與等法律行為無效，由監護人代理，以保障他的財產。","goal":"從新聞事件中的法律議題，解析監護宣告的目的及法律效果。","pr":43},{"id":"114-social-39","y":"114","n":39,"img":"114_social_q39","pk":"114_social","ans":"A","exp":"每月用相同的日幣換披索，年底換到的披索卻變少，表示1日幣能換的披索變少，也就是披索相對日幣升值（日幣貶值），在日本工作的實際收入減少。","goal":"從國際移工變更工作地點的考量，解析匯率與機會成本的變化情形。","pr":65},{"id":"114-social-40","y":"114","n":40,"img":"114_social_q40","pk":"114_social","ans":"D","exp":"加里寧格勒是俄羅斯在波羅的海、夾在波蘭和立陶宛之間的飛地，周圍都是北約國家，是俄羅斯面對北約的重要軍事基地。它不靠太平洋，也不在往芬蘭的路徑上。","goal":"分析位置對國際合作與競爭的重要性。","pr":46},{"id":"114-social-41","y":"114","n":41,"img":"114_social_q41","pk":"114_social","ans":"D","exp":"表中各水庫2020年11月底蓄水已偏低，到2021年5月更是見底。2020年沒有颱風侵臺，夏秋缺乏颱風雨補充水庫，是最主要的原因。","goal":"分析影響臺灣水資源豐缺的因素。","pr":32},{"id":"114-social-42","y":"114","n":42,"img":"114_social_q42","pk":"114_social","ans":"C","exp":"可以調解的是民事事件和告訴乃論的刑事案件。2020年：民事200件，加上超過半數（多於90件）的刑事案件，可調解件數應在290～380件之間。2021年：民事230件，加上不到半數（少於75件）的刑事案件，應在230～305件之間。只有(C)兩年都符合。","goal":"檢視法律諮詢服務件數的相關統計資料，解析可採調解方式處理的紛爭類型。","pr":60},{"id":"114-social-43","y":"114","n":43,"img":"114_social_q43","pk":"114_social","ans":"B","pimg":"114_social_p43","grp":"114-social-43～45","exp":"博物館在墨西哥首都，館藏以當地古文明（阿茲提克、馬雅等）文物為主，所以阿茲提克容器最可能是主要館藏。巴比倫城門、南島語族樹皮布、因紐特獵具都不是當地文物。","goal":"認識美洲重要的古文明。","pr":71},{"id":"114-social-44","y":"114","n":44,"img":"114_social_q44","pk":"114_social","ans":"A","pimg":"114_social_p43","grp":"114-social-43～45","exp":"選文說神官手中的物品是「原產於美洲的作物」，也是當地古文明的主食，答案是玉米。橄欖、小麥、稻米都原產於舊大陸。","goal":"認識世界歷史上的重要作物。","pr":65},{"id":"114-social-45","y":"114","n":45,"img":"114_social_q45","pk":"114_social","ans":"D","pimg":"114_social_p43","grp":"114-social-43～45","exp":"文中說展品說明大多僅採用「今日當地的官方語文」，墨西哥曾受西班牙殖民，官方語言是西班牙文。","goal":"認識近代歐洲的海外擴張與殖民。","pr":67},{"id":"114-social-46","y":"114","n":46,"img":"114_social_q46","pk":"114_social","ans":"D","pimg":"114_social_p46","grp":"114-social-46～48","exp":"我國車牌不用數字「4」，是因為民眾認為與「死」諧音、觸霉頭，政府施政因而受到民間習俗這種社會規範的影響。民間習俗本身沒有強制力。","goal":"發覺社會規範對於政府施政的影響。","pr":57},{"id":"114-social-47","y":"114","n":47,"img":"114_social_q47","pk":"114_social","ans":"D","pimg":"114_social_p46","grp":"114-social-46～48","exp":"同樣的車牌號碼，有些人願意多付錢買8888等特殊號碼，有些人在意紀念日號碼，有些人完全不在意，說明不同人對同一誘因的感受不同。","goal":"從民眾是否付費選擇車牌的行為，說明不同人對同一誘因反應不同的概念。","pr":82},{"id":"114-social-48","y":"114","n":48,"img":"114_social_q48","pk":"114_social","ans":"C","pimg":"114_social_p46","grp":"114-social-46～48","exp":"違反《道路交通管理處罰條例》被罰是行政處分（罰鍰），不服可以透過行政救濟（如聲明異議、行政訴訟）維護權益。(A)訴願不是向立法機關提出；(D)不是刑事案件。","goal":"理解生活中常見的行政管制與行政救濟的途徑。","pr":50},{"id":"114-social-49","y":"114","n":49,"img":"114_social_q49","pk":"114_social","ans":"A","pimg":"114_social_p49","grp":"114-social-49～51","exp":"巴斯人的祖先來自伊朗高原，世代信仰發源於伊朗高原的宗教，也就是祆教（瑣羅亞斯德教）。","goal":"認識西亞古文明的重要宗教。","pr":55},{"id":"114-social-50","y":"114","n":50,"img":"114_social_q50","pk":"114_social","ans":"B","pimg":"114_social_p49","grp":"114-social-49～51","exp":"18世紀後期到19世紀中期，巴斯人與英國殖民者合作，從印度把鴉片運到中國販賣，換取白銀。","goal":"了解中國晚清時期的對外貿易情形。","pr":59},{"id":"114-social-51","y":"114","n":51,"img":"114_social_q51","pk":"114_social","ans":"D","pimg":"114_social_p49","grp":"114-social-49～51","exp":"墓碑用「伊嗣俟紀元」紀年，伊嗣俟是薩珊王朝最後一位國王，巴斯人用他的紀元，反映他們珍視薩珊王朝的歷史。(B)碑上只有去世年份，無法確定何時來華。","goal":"了解紀年對建構族群認同所代表的意義。","pr":63},{"id":"114-social-52","y":"114","n":52,"img":"114_social_q52","pk":"114_social","ans":"C","pimg":"114_social_p52","grp":"114-social-52～54","exp":"1982年與英國爆發戰爭、宣稱擁有南大西洋島嶼主權的是阿根廷（福克蘭群島戰爭），圖中甲也位在阿根廷附近。","goal":"了解全球海陸分布及世界重要國家的位置。","pr":49},{"id":"114-social-53","y":"114","n":53,"img":"114_social_q53","pk":"114_social","ans":"B","pimg":"114_social_p52","grp":"114-social-52～54","exp":"圖中冰山從2017年7月的位置，經2019年11月，到2020年7月往南喬治亞島移動，依圖上經緯度判斷，是從西南往東北漂流。","goal":"應用經緯度座標判斷方位。","pr":45},{"id":"114-social-54","y":"114","n":54,"img":"114_social_q54","pk":"114_social","ans":"D","pimg":"114_social_p52","grp":"114-social-52～54","exp":"選文說南喬治亞島有大量海獅、象鼻海豹、國王企鵝等動物，巨大冰山撞上島嶼會破壞海岸，危及動物棲地。島上幾乎沒有常住人口和工業；冰山融化會讓鹽度下降而不是上升。","goal":"分析氣候變遷所造成的影響。","pr":73},{"id":"115-social-1","y":"115","n":1,"img":"social_q01","pk":"115_social","ans":"A","exp":"7月下旬是颱風季，雲林、臺南、嘉義位在西南部平原，颱風（2024年凱米颱風）帶來的西南氣流豪雨容易淹沒農田。東北季風在冬季；梅雨在5～6月；焚風多發生在東部。","goal":"了解臺灣的氣象災害及其影響。","pr":80},{"id":"115-social-2","y":"115","n":2,"img":"social_q02","pk":"115_social","ans":"D","exp":"臺灣同樣缺乏看護、營造等勞動力，而且外籍移工主要來自越南、菲律賓、印尼、泰國，和日本招募的來源國高度重疊，彼此會搶人，衝擊最大。","goal":"分析不同國家的人口結構及其外籍勞工來源。","pr":84},{"id":"115-social-3","y":"115","n":3,"img":"social_q03","pk":"115_social","ans":"C","exp":"坐標約北緯6度、東經38度，位於衣索比亞（咖啡產地）。圖中說明要「以人工翻動果實」曬乾、剝除果皮果肉，需要大量人力；產品「上市販售」是為了賣錢，所以是勞力密集的商業性農業。","goal":"了解非洲熱帶栽培業的特色。","pr":71},{"id":"115-social-4","y":"115","n":4,"img":"social_q04","pk":"115_social","ans":"A","exp":"雪山山脈與中央山脈之間的平原是蘭陽平原，也就是宜蘭縣，當地平埔族為噶瑪蘭族。","goal":"了解臺灣主要地形與行政區的分布。","pr":68},{"id":"115-social-5","y":"115","n":5,"img":"social_q05","pk":"115_social","ans":"A","exp":"歐洲西半部國家經濟發達、工業化早，人均國民所得高、都市化程度也高，所以位於兩項都高於世界平均的「甲」區塊。","goal":"了解世界各洲的經濟及都市發展特色。","pr":70},{"id":"115-social-6","y":"115","n":6,"img":"social_q06","pk":"115_social","ans":"D","exp":"斯巴達以軍事教育聞名，男孩從小接受嚴格軍事訓練，所以後人容易誤以為斯巴達會丟棄不健壯的嬰兒。","goal":"認識古希臘的城邦政治。","pr":77},{"id":"115-social-7","y":"115","n":7,"img":"social_q07","pk":"115_social","ans":"D","exp":"漫畫標示1931年，主角是「銀行倒閉的受害者」，存在銀行的錢都沒了，這是1929年美國股市崩盤後引發的經濟大恐慌，大量銀行倒閉。","goal":"認識經濟大恐慌期間的社會面貌。","pr":89},{"id":"115-social-8","y":"115","n":8,"img":"social_q08","pk":"115_social","ans":"B","exp":"《中美共同防禦條約》即將失效、權貴想移民國外、政府推動愛國捐獻，〈龍的傳人〉也是1978年底的歌曲，這是1978年美國宣布將與中華民國斷交（1979年生效）時的社會情況。","goal":"認識戰後臺灣的國際處境。","pr":70},{"id":"115-social-9","y":"115","n":9,"img":"social_q09","pk":"115_social","ans":"A","exp":"17世紀西班牙曾占領臺灣北部（基隆、淡水一帶），在當地傳教，所以會說西班牙語、受洗為天主教徒的原住民分布在北部的「甲」區域。","goal":"認識大航海時代各方勢力在臺灣的競逐。","pr":77},{"id":"115-social-10","y":"115","n":10,"img":"social_q10","pk":"115_social","ans":"C","exp":"同樣的「○」「✓」符號，在臺灣和日本代表的意思不同，這說明不同文化之間存在差異。","goal":"發覺生活經驗中的文化差異。","pr":96},{"id":"115-social-11","y":"115","n":11,"img":"social_q11","pk":"115_social","ans":"C","exp":"原本售價19,999元、供貨99臺。調整後幾分鐘就賣光，還多出數百筆訂單，表示需求量突然大增，最可能是售價降到9,999元。若只把供貨量改成19臺，不會多出數百筆訂單；改成999臺或漲價都不會讓商品瞬間賣光。","goal":"理解價格如何影響資源分配。","pr":80},{"id":"115-social-12","y":"115","n":12,"img":"social_q12","pk":"115_social","ans":"D","exp":"臭蟲因觀光客、商務旅客、國際移工跨國移動而擴散到許多國家，說明經濟全球化讓人員流動頻繁，也影響人類的日常生活。","goal":"發覺社會現象中全球化帶來的影響。","pr":68},{"id":"115-social-13","y":"115","n":13,"img":"social_q13","pk":"115_social","ans":"C","exp":"陳小花受監護宣告，吳阿杰被褫奪公權，兩人都不能登記為公職人員候選人。(A)受監護宣告者為無行為能力人；(B)受監護宣告不是刑罰；(D)褫奪公權不影響投票權，吳阿杰年滿20歲且設籍超過4個月，仍可投票。","goal":"理解公平投票的原則。","pr":69},{"id":"115-social-14","y":"115","n":14,"img":"social_q14","pk":"115_social","ans":"A","exp":"阿德是小蔓母親的丈夫（繼父），小蔓與阿德沒有血緣關係，因為婚姻而產生的親屬關係是「姻親」（若沒有辦理收養）。","goal":"理解家人間的親屬關係。","pr":62},{"id":"115-social-15","y":"115","n":15,"img":"social_q15","pk":"115_social","ans":"C","exp":"位於安地斯山脈高山上、以石塊精密堆砌、能抗地震的古城，是印加文明的馬丘比丘，在南美洲西部的秘魯，也就是「丙」。","goal":"了解美洲古文明的分布與環境特色。","pr":56},{"id":"115-social-16","y":"115","n":16,"img":"social_q16","pk":"115_social","ans":"A","exp":"全球暖化使北極海冰大量融化，北極航線通航時間變長，歐亞之間行經北極的航行次數因此增加。","goal":"分析北極融冰加劇對於全球航運的影響。","pr":58},{"id":"115-social-17","y":"115","n":17,"img":"social_q17","pk":"115_social","ans":"B","exp":"石油輸出國家組織（OPEC）減產會讓全球石油供應變少，歐盟更難找到替代俄羅斯的油源，無助於擺脫對俄依賴。其他選項都能減少能源需求或增加替代來源。","goal":"分析歐洲降低能源依賴的策略。","pr":57},{"id":"115-social-18","y":"115","n":18,"img":"social_q18","pk":"115_social","ans":"B","exp":"黃河泥沙主要來自上游的黃土高原。瀑布「上游」推動造林固沙，減少泥沙流入，才可能讓壺口的河水變清。(A)會讓河水更濁；(C)、(D)是下游的事，影響不了上游的瀑布。","goal":"分析人類活動對自然環境的影響。","pr":60},{"id":"115-social-19","y":"115","n":19,"img":"social_q19","pk":"115_social","ans":"A","exp":"「扶清滅洋」、誅殺洋人與「教匪」（傳教士和教徒），還宣稱「神明附身」，這是清末的義和團。","goal":"認識中國晚清時期的東西方衝突。","pr":80},{"id":"115-social-20","y":"115","n":20,"img":"social_q20","pk":"115_social","ans":"B","exp":"西元7～8世紀是唐朝，從中亞引進馬匹、羊肉消費增加、婦女戴胡帽騎馬，都是胡人文化的影響，屬於魏晉到隋唐的民族互動。","goal":"了解中國隋唐時期不同民族間的文化交流。","pr":58},{"id":"115-social-21","y":"115","n":21,"img":"social_q21","pk":"115_social","ans":"D","exp":"圖中有「鐵道部」「電信郵便局」「公學校校長」等日治時期的機關與職稱，所以是日治時期的《臺灣總督府公文類纂》。","goal":"認識臺灣在日本時期的重要發展。","pr":78},{"id":"115-social-22","y":"115","n":22,"img":"social_q22","pk":"115_social","ans":"C","exp":"19世紀末美國取得菲律賓，總統主張用教育和基督教「教化欠缺能力」的人民，認為某些民族較優越、有責任教化其他民族，這是社會達爾文主義。","goal":"了解十九世紀帝國主義的發展。","pr":59},{"id":"115-social-23","y":"115","n":23,"img":"social_q23","pk":"115_social","ans":"B","exp":"依我國規定，外國人取得永久居留仍不是國民，不能參與公投、不能擔任民意代表，也沒有接受國民教育的義務；但言論自由是人人都享有的權利，所以兩者都能發表時事評論。","goal":"理解本國國民與外國籍勞工在權利義務上的異同。","pr":70},{"id":"115-social-24","y":"115","n":24,"img":"social_q24","pk":"115_social","ans":"B","exp":"小毛「起訴」案件是檢察官，阿雄「判決」案件是法官，小芳替大家「調解」糾紛是調解委員。騎車撞傷人涉及過失傷害（告訴乃論的刑事案件）和民事賠償，可以由檢察官偵查起訴、法官審判，也可以申請調解。(A)竊盜不是告訴乃論，不能調解；(C)借錢不還是純民事；(D)不服罰單屬行政程序。","goal":"理解檢察官、法官與調解委員的職權範圍。","pr":45},{"id":"115-social-25","y":"115","n":25,"img":"social_q25","pk":"115_social","ans":"A","exp":"對貝里斯白蝦零關稅，進口白蝦成本下降、供給增加，我國市場上白蝦售價可能下降。(B)貝里斯出口增加，出超應上升；(C)宏都拉斯出口減少，出超應下降；(D)宏都拉斯白蝦減少，競爭程度下降。","goal":"檢視我國市場上商品進口來源的變化，解析開放外國商品進口對我國市場及市場競爭程度的影響。","pr":62},{"id":"115-social-26","y":"115","n":26,"img":"social_q26","pk":"115_social","ans":"B","exp":"民事紛爭的途徑：至法院提告對方違反契約（甲）；結果：雙方在法院達成訴訟上和解（丁）。乙「自訴」和丙「罰金」都屬於刑事案件。","goal":"理解民事紛爭的解決途徑。","pr":56},{"id":"115-social-27","y":"115","n":27,"img":"social_q27","pk":"115_social","ans":"A","exp":"壯年人口比例高（15～64歲占近70%），而且「未來數十年仍占極高比例」，表示底下的幼年人口也還多，未來會持續補充勞動力，所以是(A)這種青壯年多、底部也寬的金字塔。(D)壯年集中在中高齡、幼年少，未來勞動力會減少。","goal":"判讀人口金字塔及了解世界重要國家的人口組成及其經濟發展特色。","pr":53},{"id":"115-social-28","y":"115","n":28,"img":"social_q28","pk":"115_social","ans":"A","exp":"震央在阿拉斯加南方海域（西經149度、北緯56度），位於太平洋北部，所以由太平洋海嘯警報中心研判。","goal":"應用全球經緯度座標判斷位置。","pr":49},{"id":"115-social-29","y":"115","n":29,"img":"social_q29","pk":"115_social","ans":"B","exp":"閩南的「坑頭」在溪流上游；客家依開墾順序命名，由下游往上游開墾，最後開墾的「坑尾」也在上游。所以兩個聚落都應位在溪谷上游（地勢較高、等高線數值較大處），只有(B)符合。","goal":"判讀等高線地形圖及了解各族群聚落地名的命名與環境的關係。","pr":50},{"id":"115-social-30","y":"115","n":30,"img":"social_q30","pk":"115_social","ans":"A","exp":"契約寫明竹塹社因「稅賦繁重」加上鹿變少，才把草地賣給漢人，並由漢人每年補貼稅銀，可見官府的賦稅影響原住民的土地經營方式。(B)竹塹社繳稅，屬「熟番」；(C)漢人買地是為了開墾；(D)文中沒有提到遷徙。","goal":"了解臺灣清帝國時期原住民社會的發展。","pr":67},{"id":"115-social-31","y":"115","n":31,"img":"social_q31","pk":"115_social","ans":"B","exp":"法國國王為解決財政危機，召開自1614年後就未再召開的「三級會議」（1789年），這也是法國大革命的開端。","goal":"認識法國大革命的歷史背景。","pr":61},{"id":"115-social-32","y":"115","n":32,"img":"social_q32","pk":"115_social","ans":"D","exp":"日治時期臺灣人要求設置臺灣議會（臺灣議會設置請願運動），檢察官說統治「過於優厚」、要臺灣人做日本國民，指的是當時推行的「內地延長主義」，把臺灣視為日本內地的延長。","goal":"了解臺灣在日本時期各階段的統治政策。","pr":68},{"id":"115-social-33","y":"115","n":33,"img":"social_q33","pk":"115_social","ans":"A","exp":"「伐遼」「從契丹人手中奪回燕雲十六州」是宋代的背景。宋代重視科舉，考中進士者由皇帝親授官職，因此有「比收復燕雲十六州還光榮」的說法。","goal":"了解中國歷史上的重要政治制度。","pr":64},{"id":"115-social-34","y":"115","n":34,"img":"social_q34","pk":"115_social","ans":"C","exp":"文物以拉丁文刻寫《新約聖經》的經文，又刻有福音書的宗教故事，是基督教在西歐盛行時期的作品，最可能是西元9世紀的西歐（如查理曼帝國時期）。西元前沒有《新約聖經》；14世紀的中南美洲尚未接觸基督教。","goal":"了解世界歷史上重要宗教的發展。","pr":47},{"id":"115-social-35","y":"115","n":35,"img":"social_q35","pk":"115_social","ans":"C","exp":"行政院對立法院通過的法案認為窒礙難行而提出覆議，是行政權對立法權的制衡，符合權力分立的精神。","goal":"理解我國政府體制中權力分立與制衡的機制。","pr":69},{"id":"115-social-36","y":"115","n":36,"img":"social_q36","pk":"115_social","ans":"C","exp":"罰鍰是行政罰，不服行政處分可以提起訴願救濟。(A)罰鍰是負向誘因；(B)臺北市的自治條例由臺北市議會修正；(D)罰鍰不是刑事處罰。","goal":"檢視地方政府制定地方法規處理問題的過程，解析地方自治的制度及行政救濟的途徑。","pr":56},{"id":"115-social-37","y":"115","n":37,"img":"social_q37","pk":"115_social","ans":"D","exp":"出席會議、提出法律修正案、審查預算，都是立法委員的工作。要評鑑立委的工作品質，可以看他「質詢內容」。(A)糾正案是監察院；(B)審理案件是法院；(C)編列預算是行政機關。","goal":"理解立法委員的職權。","pr":53},{"id":"115-social-38","y":"115","n":38,"img":"social_q38","pk":"115_social","ans":"D","exp":"APP 讓消費者知道哪些企業違反環保法規，藉此影響消費者的偏好，進而改變購買行為。","goal":"檢視環保團體的作為，解析影響消費行為的因素。","pr":56},{"id":"115-social-39","y":"115","n":39,"img":"social_q39","pk":"115_social","ans":"B","exp":"官軍從鹿港登陸、事件後將「諸羅」改名「嘉義」，是清乾隆年間的林爽文事件。","goal":"了解臺灣清帝國時期重要民變及其影響。","pr":53},{"id":"115-social-40","y":"115","n":40,"img":"social_q40","pk":"115_social","ans":"A","exp":"甲的航線遍布北美、印度等地，符合殖民地最多的英國；乙的航線集中到南非好望角與東印度群島（印尼），符合荷蘭的勢力範圍。","goal":"了解大航海時代以來，歐洲國家在世界各地的擴張情形。","pr":52},{"id":"115-social-41","y":"115","n":41,"img":"social_q41","pk":"115_social","ans":"B","exp":"乙幣價格固定，若成本（甲幣）越來越低，表示1甲幣能換到越來越多乙幣，匯率上升；6月22日成本最高，表示當天1甲幣換到的乙幣最少，匯率最低。所以匯率是6月初先上升，之後下降，到6月22日左右最低，符合(B)。","goal":"解析匯率變動對進口貿易的影響。","pr":42},{"id":"115-social-42","y":"115","n":42,"img":"social_q42","pk":"115_social","ans":"D","exp":"喀土穆位於青尼羅河與白尼羅河交會處，尼羅河往北流入埃及，埃及用水依賴尼羅河。若喀土穆被占領、河流遭控制，會影響埃及用水。(A)蘇丹不與肯亞相鄰；(B)蘇丹港不在波斯灣；(C)圖上沒有橄欖園。","goal":"分析國際衝突的影響。","pr":44},{"id":"115-social-43","y":"115","n":43,"img":"social_q43","pk":"115_social","ans":"B","exp":"修法後從母姓的比例雖然逐年增加，但到2018年也只有2.3%，表示大多數人仍選擇從父姓，選擇姓氏時仍受傳統社會規範影響。","goal":"檢視我國新生兒從母姓統計資料的變化，解析社會規範對於選擇新生兒姓氏的影響。","pr":47},{"id":"115-social-44","y":"115","n":44,"img":"social_q44","pk":"115_social","ans":"D","pimg":"social_p44","grp":"115-social-44～45","exp":"「五腳基」有頂蓋的步行通道，在新加坡這種炎熱多雨的熱帶氣候下，可以讓行人避免日晒和雨淋。","goal":"了解自然環境對人類生活型態的影響。","pr":87},{"id":"115-social-45","y":"115","n":45,"img":"social_q45","pk":"115_social","ans":"C","pimg":"social_p44","grp":"115-social-44～45","exp":"因地形多山、可耕地少而大量人口移往南洋，返鄉蓋洋樓，這是中國東南沿海的福建、廣東一帶（僑鄉）。","goal":"了解中國人口遷移的原因及影響。","pr":62},{"id":"115-social-46","y":"115","n":46,"img":"social_q46","pk":"115_social","ans":"A","pimg":"social_p46","grp":"115-social-46～48","exp":"阿華透過通訊群組轉傳訊息，朋友們看了開始批評政府和法律，可見是透過社群網路影響公共意見。","goal":"發覺生活經驗中社群網路對公共意見的影響。","pr":84},{"id":"115-social-47","y":"115","n":47,"img":"social_q47","pk":"115_social","ans":"C","pimg":"social_p46","grp":"115-social-46～48","exp":"表(八)顯示新增感染者人數從2017年的2,519人逐年減少到2021年的1,247人，訊息說「同性婚姻合法化後患者大幅增加」與事實不符。(D)我國盛行率0.3%和歐美國家差不多，不是較低。","goal":"檢視關於疾病統計數據的變化，探討日常生活中個人或群體可能面臨的不公平處境。","pr":80},{"id":"115-social-48","y":"115","n":48,"img":"social_q48","pk":"115_social","ans":"B","pimg":"social_p46","grp":"115-social-46～48","exp":"小明收到訊息後，主動查詢政府公開的統計資料和其他國家資料來查證，顯示面對各種媒體資訊，要具備媒體識讀能力。","goal":"理解閱聽人具備媒體識讀能力的重要性。","pr":88},{"id":"115-social-49","y":"115","n":49,"img":"social_q49","pk":"115_social","ans":"D","pimg":"social_p49","grp":"115-social-49～51","exp":"最適合製糖的作物是甘蔗，生長在高溫多雨的熱帶、副熱帶地區，大約南緯25度到北緯25度之間。","goal":"了解重要農作物的生產與地理環境的關係。","pr":71},{"id":"115-social-50","y":"115","n":50,"img":"social_q50","pk":"115_social","ans":"A","pimg":"social_p49","grp":"115-social-49～51","exp":"1950年代政府以出口糖、米等農產加工品賺取外匯，用來扶植國內的輕工業，這是臺灣戰後初期的產業特色。","goal":"了解臺灣產業發展的歷程。","pr":50},{"id":"115-social-51","y":"115","n":51,"img":"social_q51","pk":"115_social","ans":"C","pimg":"social_p49","grp":"115-social-49～51","exp":"糖廠除了製糖，也生產酒精、有機肥、飼料，並轉型觀光，目的是提高產業的附加價值。","goal":"分析產業轉型的原因與目的。","pr":86},{"id":"115-social-52","y":"115","n":52,"img":"social_q52","pk":"115_social","ans":"B","pimg":"social_p52","grp":"115-social-52～54","exp":"配合自強運動的商人家族，最可能經營的是自強運動推動的新式事業，如興築鐵路、開採煤鐵礦。(C)大躍進是中共時期；(D)市舶司是唐宋以後的海關機構。","goal":"了解中國晚清時期的重要變革。","pr":53},{"id":"115-social-53","y":"115","n":53,"img":"social_q53","pk":"115_social","ans":"B","pimg":"social_p52","grp":"115-social-52～54","exp":"1933～1937年發行「航空公路建設獎券」，是國民政府北伐統一後（1928～1937年）推動「十年建設」的一部分。","goal":"了解中國現代歷史的發展。","pr":56},{"id":"115-social-54","y":"115","n":54,"img":"social_q54","pk":"115_social","ans":"D","pimg":"social_p52","grp":"115-social-52～54","exp":"1941年太平洋戰爭爆發，日本向英美宣戰，進占上海租界，並以「東亞民族解放者」自居，開放中國人使用租界內的設施。","goal":"了解日本帝國主義對中國的侵略行為。","pr":45},{"id":"ak-social-1","y":"ak","n":1,"html":"小羽寒假到臺灣各地旅行，發現某地一月時幾乎天天下雨，當地人說這是「冬季季風帶來的雨」。小羽最可能在下列哪一個縣市？","opts":["宜蘭縣","臺南市","臺中市","屏東縣"],"ans":"A","exp":"臺灣冬季吹東北季風，位在東北部迎風面的宜蘭、基隆冬天多雨。屏東、臺南、臺中在背風面，冬季較乾燥。","topic":"地理：氣候"},{"id":"ak-social-2","y":"ak","n":2,"html":"某地位於赤道以南、本初子午線以東。下列哪一個坐標（緯度, 經度）最可能是該地？","opts":["(20°N, 30°W)","(20°N, 30°E)","(20°S, 30°E)","(20°S, 30°W)"],"ans":"C","exp":"赤道以南是南緯（S），本初子午線以東是東經（E），所以是 (20°S, 30°E)。","topic":"地理：經緯度"},{"id":"ak-social-3","y":"ak","n":3,"html":"夏天傍晚，阿哲發現市中心的氣溫常比郊區山邊高好幾度。造成這種「都市熱島效應」的原因，最可能是下列何者？","opts":["市中心的森林覆蓋率比郊區高","市中心建築密集、柏油路面吸熱，冷氣與車輛也排放廢熱","市中心的海拔比郊區高","市中心位在季風的迎風面"],"ans":"B","exp":"都市建築密集不易散熱，水泥、柏油吸熱後慢慢放出，加上冷氣、汽機車排放廢熱，使市區比郊區熱。海拔越高氣溫反而越低；森林多會降溫。","topic":"地理：都市"},{"id":"ak-social-4","y":"ak","n":4,"html":"小華到印尼交換學生，發現當地每天有固定時間的禮拜，學校餐廳也不供應豬肉。這最可能和印尼信仰人口最多的哪一種宗教有關？","opts":["伊斯蘭教","天主教","印度教","佛教"],"ans":"A","exp":"印尼是全世界穆斯林人口最多的國家。伊斯蘭教每天有固定的禮拜時間，並禁食豬肉。","topic":"地理：東南亞"},{"id":"ak-social-5","y":"ak","n":5,"html":"十七世紀荷蘭東印度公司來到臺灣，在當地建立熱蘭遮城作為統治與貿易中心。這座城位在今天的哪裡？","opts":["臺北萬華","基隆和平島","彰化鹿港","臺南安平"],"ans":"D","exp":"荷蘭人以大員（今臺南安平）為據點，建立熱蘭遮城。基隆和平島是西班牙人建城的地方。","topic":"臺灣史：荷蘭時期"},{"id":"ak-social-6","y":"ak","n":6,"html":"1860 年代臺灣開港通商後，北臺灣的經濟地位逐漸超越南臺灣，最主要的原因是下列何者？","opts":["茶葉與樟腦大量外銷","政府設立加工出口區","稻米大量輸往日本","蔗糖產量大幅增加"],"ans":"A","exp":"開港後茶、糖、樟腦是三大出口品，茶葉和樟腦主要產在北部，帶動北部發展。蔗糖主要產在南部；加工出口區是戰後的政策。","topic":"臺灣史：清代開港"},{"id":"ak-social-7","y":"ak","n":7,"html":"某時期政府鼓勵臺灣人改日本姓名、在家說日語可獲「國語家庭」認定，並推動參拜神社。這些措施屬於下列何者？","opts":["土地改革","皇民化運動","十大建設","開山撫番"],"ans":"B","exp":"改日本姓名、國語家庭、參拜神社，是日治後期（中日戰爭爆發後）推動的皇民化運動，目的是讓臺灣人成為效忠天皇的日本人。","topic":"臺灣史：日治"},{"id":"ak-social-8","y":"ak","n":8,"html":"戰後政府推行「三七五減租」、「公地放領」與「耕者有其田」。這一系列政策的主要目的是下列何者？","opts":["吸引外國資金投資","改善佃農生活並提高農業生產","推動都市更新","發展重化工業"],"ans":"B","exp":"這三項是戰後的土地改革，降低佃租、讓佃農擁有自己的土地，提高耕作意願與農業生產，也改善佃農的生活。","topic":"臺灣史：戰後"},{"id":"ak-social-9","y":"ak","n":9,"html":"十八世紀後期，某國率先以蒸汽機帶動紡織業機械化，工廠林立，人口大量湧向城市。這個率先發生工業革命的國家是下列何者？","opts":["美國","德國","英國","法國"],"ans":"C","exp":"工業革命最早在十八世紀後期的英國展開，瓦特改良蒸汽機，紡織業率先機械化。","topic":"世界史"},{"id":"ak-social-10","y":"ak","n":10,"html":"依我國憲法規定，下列何者同時是人民的權利，也是人民的義務？","opts":["納稅","服兵役","受國民教育","集會遊行"],"ans":"C","exp":"憲法規定人民有受國民教育的權利與義務。服兵役、納稅是義務；集會遊行是權利。","topic":"公民：權利義務"},{"id":"ak-social-11","y":"ak","n":11,"html":"15 歲的小凱沒有告訴父母，就用壓歲錢在網路上買了一臺 3 萬元的筆電。依我國《民法》，這個買賣契約的效力為何？","opts":["無效，因為小凱未成年","效力未定，須經法定代理人承認才有效","有效，因為是用自己的錢","有效，但父母可以隨時撤銷"],"ans":"B","exp":"7 歲以上未滿 18 歲是限制行為能力人，訂立一般契約須經法定代理人（父母）同意；事前未同意的，效力未定，父母事後承認才生效。","topic":"公民：行為能力"},{"id":"ak-social-12","y":"ak","n":12,"html":"小明週六下午可以去便利商店打工賺 800 元，也可以去看一場免費的展覽，他最後選擇去看展覽。他看展覽的機會成本是下列何者？","opts":["展覽的門票錢","看展覽的交通費","0 元，因為展覽免費","放棄的 800 元打工收入"],"ans":"D","exp":"機會成本是做選擇時放棄的其他選項中價值最高者。小明選了看展，放棄的是打工的 800 元收入。","topic":"經濟：機會成本"},{"id":"ak-social-13","y":"ak","n":13,"html":"颱風過後，許多菜園受損，市場上的高麗菜價格大漲。若其他條件不變，這主要是因為下列何者？","opts":["供給減少","需求減少","需求增加","供給增加"],"ans":"A","exp":"菜園受損使高麗菜的供給減少，在需求不變的情況下，價格上漲。","topic":"經濟：供需"},{"id":"ak-social-14","y":"ak","n":14,"html":"下列何者是我國立法院的職權？","opts":["彈劾違法失職的公務人員","審判民事與刑事案件","舉辦公務人員考試","議決法律案與預算案"],"ans":"D","exp":"立法院議決法律案、預算案。彈劾是監察院；審判是司法院（法院）；舉辦考試是考試院。","topic":"公民：政府"},{"id":"ak-social-15","y":"ak","n":15,"html":"小芸在網路上看到一則「喝某種茶可以治好近視」的貼文，轉傳數已破萬。下列哪一種做法最能展現媒體識讀能力？","opts":["既然很多人轉傳，內容應該可信","先轉傳給家人，讓他們自己判斷","查證訊息來源，並比對專業機構的資料","只要貼文附有照片，就可以相信"],"ans":"C","exp":"媒體識讀是能判斷訊息的真假與立場。轉傳多、附照片都不代表正確，應查證來源、比對專業機構的資料。","topic":"公民：媒體識讀"}],"science":[{"id":"104-science-1","y":"104","n":1,"img":"104_science_q01", 3,"img":"114_science_q03","pk":"114_science","ans":"A","exp":"白尾八哥和麻雀築巢位置、食物種類相近，彼此爭奪資源，是「競爭」；白尾八哥會吃麻雀幼鳥，是「掠食」。","goal":"能了解生物間的交互作用關係","pr":90},{"id":"114-science-4","y":"114","n":4,"img":"114_science_q04","pk":"114_science","ans":"A","exp":"硫磺是元素，只含硫一種原子；笑氣（N₂O）是化合物，含氮、氧兩種原子；花岡岩是混合物，含多種礦物、多種原子。所以笑氣＞硫磺。","goal":"能了解元素、化合物、混合物的差異","pr":68},{"id":"114-science-5","y":"114","n":5,"img":"114_science_q05","pk":"114_science","ans":"D","exp":"暖空氣較輕，會沿著鋒面被抬升，成雲致雨。圖中乙側的空氣沿鋒面往上爬，是暖空氣；甲側在鋒面下方，是較重的冷空氣。","goal":"能知道鋒面的形式以及鋒面兩側的空氣性質","pr":70},{"id":"114-science-6","y":"114","n":6,"img":"114_science_q06","pk":"114_science","ans":"A","exp":"過度抽取地下水，地下含水層被壓縮，造成地層下陷，使建築物高度出現落差。(B)(C)是土石流、山崩；(D)是地震。","goal":"能知道超抽地下水可能造成的災害","pr":95},{"id":"114-science-7","y":"114","n":7,"img":"114_science_q07","pk":"114_science","ans":"B","exp":"網路說法認為只有端午節正午太陽直射北半球時才能立蛋。若用同一種生雞蛋，在聖誕節（太陽直射南半球）正午的臺灣也能立起來，就能推翻這個說法。(A)把蛋煮熟改變了其他條件，不適合比較。","goal":"能運用邏輯思辯能力來反駁他人的說法","pr":78},{"id":"114-science-8","y":"114","n":8,"img":"114_science_q08","pk":"114_science","ans":"A","exp":"甲部位照光呈綠色，有葉綠素，可以行光合作用釋出氧氣；乙部位沒有照光、呈白色，不能行光合作用。兩個部位都會行呼吸作用釋出二氧化碳。","goal":"能了解光合作用與呼吸作用","pr":68},{"id":"114-science-9","y":"114","n":9,"img":"114_science_q09","pk":"114_science","ans":"D","exp":"鉛筆靜止，所受合力為零，所以 F右＝F左＝1 N。F右′ 是 F右 的反作用力，作用力與反作用力大小相等，F右′＝F右＝1 N。","goal":"能了解牛頓第三運動定律與力平衡的概念","pr":75},{"id":"114-science-10","y":"114","n":10,"img":"114_science_q10","pk":"114_science","ans":"B","exp":"靜電力與距離平方成反比。甲、乙距離從2 m變1 m，F甲乙變為4倍，變大；乙、丙距離從1 m變2 m，F乙丙變為1/4，變小。","goal":"能了解庫倫定律的意義","pr":72},{"id":"114-science-11","y":"114","n":11,"img":"114_science_q11","pk":"114_science","ans":"C","exp":"每1000 g溶液含30 mg，30 mg÷1000 g＝30÷1000000，也就是百萬分之三十，即 30 ppm。","goal":"能了解ppm等濃度的表示法","pr":71},{"id":"114-science-12","y":"114","n":12,"img":"114_science_q12","pk":"114_science","ans":"C","exp":"兩人都是看到明星（受器是眼睛），經大腦判斷後做出反應，控制的中樞都是大腦，所以(C)正確。(A)受器是眼睛，不是嘴巴和腳；(B)尖叫也需要肌肉；(D)兩人都同時需要感覺神經和運動神經。","goal":"能了解神經傳導途徑","pr":70},{"id":"114-science-13","y":"114","n":13,"img":"114_science_q13","pk":"114_science","ans":"D","exp":"臺北冬天受東北季風影響，陽臺朝北、東北會被雨打到。高雄冬季位在東北季風的背風面，天氣較乾燥，所以這個建議不適用於高雄。(A)臺南冬季也在背風面，偏乾；(B)基隆、(C)宜蘭冬季位在迎風面，偏溼。","goal":"能根據季風的特性了解不同位置的降雨情形","pr":70},{"id":"114-science-14","y":"114","n":14,"img":"114_science_q14","pk":"114_science","ans":"C","exp":"在紅光下呈紅色，表示會反射紅光，在白光下可能是紅色或白色等；呈黑色表示不反射紅光，在白光下可能是黑、綠、藍等。所以最多只有兩顆是白球。(A)兩顆可能都是白球；(B)第三顆可能是綠色；(D)最多只有一顆綠球。","goal":"能應用顏色相關的光學概念","pr":67},{"id":"114-science-15","y":"114","n":15,"img":"114_science_q15","pk":"114_science","ans":"B","exp":"板塊在軟流圈上緩慢移動，使陸地和海底的地形隨之改變。(A)板塊交界和海陸交界不一定吻合；(C)不是每個交界都有山脈；(D)交界有聚合、張裂、錯動等不同類型，不全是中洋脊。","goal":"能知道板塊與板塊運動的相關概念","pr":74},{"id":"114-science-16","y":"114","n":16,"img":"114_science_q16","pk":"114_science","ans":"C","exp":"地層未翻轉，下面的地層較老。石灰岩在火山灰岩層（8百萬年前）的下方，一定比8百萬年前更早形成，不可能在7百萬年前形成，所以(C)最不合理。","goal":"能根據地層剖面中的資訊做出合理的推論","pr":68},{"id":"114-science-17","y":"114","n":17,"img":"114_science_q17","pk":"114_science","ans":"A","exp":"Ca²⁺ 質子數 w＝20，失去2個電子，電子數 y＝18；Cl⁻ 質子數 x＝17，得到1個電子，電子數 z＝18。w(20)＞z(18)，所以(A)正確。","goal":"能了解離子含有的質子數和電子數","pr":66},{"id":"114-science-18","y":"114","n":18,"img":"114_science_q18","pk":"114_science","ans":"C","exp":"圖中外力小於400 gw時，摩擦力等於外力，是靜摩擦力，外力越小、靜摩擦力也越小。(A)最大靜摩擦力是400 gw；(B)外力超過400 gw才會開始運動；(D)動摩擦力固定為300 gw。","goal":"能了解摩擦力的相關概念","pr":59},{"id":"114-science-19","y":"114","n":19,"img":"114_science_q19","pk":"114_science","ans":"C","exp":"二氧化碳溶於水後，與岩層中的鈣、鎂離子反應，形成難溶於水的碳酸鈣、碳酸鎂沉澱，「固化」填充在岩層空隙中。","goal":"能從資料中解讀出所對應的二氧化碳性質","pr":60},{"id":"114-science-20","y":"114","n":20,"img":"114_science_q20","pk":"114_science","ans":"B","exp":"吃甲之後血糖上升得比較快、比較高，身體會更早分泌胰島素來降低血糖。升糖素是血糖太低時才分泌的。","goal":"能依據血糖恆定概念判斷圖表資訊","pr":55},{"id":"114-science-21","y":"114","n":21,"img":"114_science_q21","pk":"114_science","ans":"D","exp":"比較兩張圖，三種材質在70℃時的質量變化率都比50℃時大，耗損率較高。(A)PET 變化率最大，最不適合；(B)PP 變化率最小，最適合；(C)資料沒有提到鏈狀、網狀結構。","goal":"能正確地解讀科學資料","pr":65},{"id":"114-science-22","y":"114","n":22,"img":"114_science_q22","pk":"114_science","ans":"C","exp":"蒸散作用散失的水分， 4_science_q32","pk":"114_science","ans":"B","exp":"反應式為 2H₂S＋SO₂ → 2H₂O＋3S。64 g 的 SO₂（1莫耳）會和 68 g H₂S 反應，剩下 2 g H₂S，SO₂ 用完；生成 36 g 水和 96 g 硫，加上原本的 2 g，硫共 98 g。(B) 符合，總質量也和反應前一樣是136 g（質量守恆）。","goal":"能了解化學反應式與質量守恆的概念","pr":47},{"id":"114-science-33","y":"114","n":33,"img":"114_science_q33","pk":"114_science","ans":"D","exp":"斷層面是傾斜的，震源在斷層面上，震央在震源正上方，所以斷層面會往震央那一側向下傾斜。不論正斷層或逆斷層，從與震央同側的乙處往下鑽，才能鑽到斷層面。","goal":"能根據震央位置推論斷層面的位置","pr":43},{"id":"114-science-34","y":"114","n":34,"img":"114_science_q34","pk":"114_science","ans":"D","exp":"甲有細胞核、有菌絲、沒有葉綠素，屬於真菌界；乙沒有細胞核、有葉綠素，是原核生物（如藍綠菌），屬於原核生物界。","goal":"能依據生物的特徵進行分類","pr":53},{"id":"114-science-35","y":"114","n":35,"img":"114_science_q35","pk":"114_science","ans":"A","exp":"葉片繁殖出幼苗、種子萌芽長成幼苗，都是細胞數量增加的生長過程，進行的是細胞分裂（甲：染色體數目不變）。乙是減數分裂，只在產生配子時發生。","goal":"能了解細胞分裂的種類，並依條件進行歸類","pr":33},{"id":"114-science-36","y":"114","n":36,"img":"114_science_q36","pk":"114_science","ans":"A","exp":"碘液變色表示還有澱粉，本氏液變色表示有糖。甲有澱粉、沒有糖，澱粉完全沒被分解，酵素已失去作用。乙澱粉被分解完、有糖；丙兩種都有，酵素仍有部分作用。","goal":"能利用試劑檢測結果，推論澱粉酶活性","pr":42},{"id":"114-science-37","y":"114","n":37,"img":"114_science_q37","pk":"114_science","ans":"B","exp":"火星運行到太陽另一側時，太陽會位在地球與火星之間。(A)地球在金星、水星軌道外側，不會在兩者之間；(C)金星、水星分別在太陽兩側時，太陽就在兩者之間；(D)火星在太陽另一側時，地球可能在火星與木星之間。","goal":"能根據太陽系行星的排列順序推論不同行星的位置關係","pr":47},{"id":"114-science-38","y":"114","n":38,"img":"114_science_q38","pk":"114_science","ans":"C","exp":"檢測不同電扇的風速時，規定電扇距地面、距牆面的位置，是讓這些條件都相同，增加控制變因，比較才公平。","goal":"能應用變因概念分析資訊，找出其中隱含的意義","pr":41},{"id":"114-science-39","y":"114","n":39,"img":"114_science_q39","pk":"114_science","ans":"C","exp":"v-t 圖的斜率是加速度。0～4秒加速度4 m/s²，4～6秒等速、加速度0，6～10秒加速度－4 m/s²。合力＝質量×加速度，所以 F₂＝F₇（大小相同），F₅＝0，F₂＝F₇＞F₅。","goal":"能統整力學相關概念","pr":43},{"id":"114-science-40","y":"114","n":40,"img":"114_science_q40","pk":"114_science","ans":"A","exp":"冰塊使瓶內上方溫度降低，水蒸氣凝結，瓶內氣壓降低，水的沸點跟著降低，水又汽化沸騰冒出氣泡，達到新的平衡。這是物理變化，水沒有分解。","goal":"能了解溫度會影響物質的狀態，也會影響平衡","pr":46},{"id":"114-science-41","y":"114","n":41,"img":"114_science_q41","pk":"114_science","ans":"D"
