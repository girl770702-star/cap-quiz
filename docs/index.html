向是固定的，月球受光的亮面在甲、乙兩處都應朝向同一個方向（朝向太陽），且與地月連線垂直，從地球看才會是一半亮的上弦月和下弦月。符合的是(C)。","goal":"能根據月相形成的原因推論太陽的相對位置","pr":37},{"id":"114-science-50","y":"114","n":50,"img":"114_science_q50","pk":"114_science","ans":"B","pimg":"114_science_p49","grp":"114-science-49～50","exp":"上弦月（約農曆初八）到下弦月（約農曆二十二、三）大約相隔15天，地球每天自轉一圈，所以大約自轉了15圈。","goal":"能根據月相變化的規律推論其變化日期","pr":53},{"id":"115-science-1","y":"115","n":1,"img":"science_q01","pk":"115_science","ans":"A","exp":"指針偏左表示左邊較重。歸零時要調整校準螺絲：把左邊的螺絲向內旋入（靠近支點），左邊的力矩變小，指針就會回到中央。放秤量紙會讓左邊更重；不能用砝碼夾撥指針。","goal":"能知道上皿天平的歸零方法","pr":80},{"id":"115-science-2","y":"115","n":2,"img":"science_q02","pk":"115_science","ans":"C","exp":"有良好的導電性、導熱性和延展性，可拉成細絲、壓成箔片，是金屬的特性。題目說的是「它」這種元素（例如銅），在自然界多以化合物存在，但它本身是金屬元素。","goal":"能知道金屬元素的性質","pr":87},{"id":"115-science-3","y":"115","n":3,"img":"science_q03","pk":"115_science","ans":"B","exp":"同一族的元素最外層電子排列相似，所以化學性質相似。鈍氣都很穩定、不容易起反應。(A)鈍氣常溫下是氣體，熔點很低；(C)沸點、密度等物理性質不同；(D)鈍氣是單原子分子。","goal":"能知道週期表中同族元素具有相似的化學性質","pr":74},{"id":"115-science-4","y":"115","n":4,"img":"science_q04","pk":"115_science","ans":"B","exp":"圖例：2015 淺灰線、2016 黑線、2017 虛線。2018 年的海岸線比 2017 年的虛線更靠海的一側，表示 2017 到 2018 年海岸線往海的方向擴張（沉積較多）。","goal":"能應用資訊，了解地貌改變的結果與原因","pr":82},{"id":"115-science-5","y":"115","n":5,"img":"science_q05","pk":"115_science","ans":"C","exp":"把方格當坐標，鏡子在左邊、牆在上方（牆長5格）。利用反射定律（入射角＝反射角），T→R：T 在距鏡4格、距牆5格，R 距牆3格，光每往左4格上升2格，反射後每往右4格再上升2格，到達牆的高度時已在距鏡6格處，超過牆的長度，所以照不到牆。其他三種方式反射後都會打到牆上。","goal":"能應用反射定律","pr":76},{"id":"115-science-6","y":"115","n":6,"img":"science_q06","pk":"115_science","ans":"D","exp":"圖(四)的比例尺 20 μm，灰色斑塊大小約 10～20 μm。對照圖(三)，細胞是 10～30 μm；血紅素、病毒是奈米等級，粒線體約 1 μm，在這個倍率下看不到。所以灰色斑塊是一個細胞。","goal":"能利用比例尺判斷物體實際尺寸","pr":87},{"id":"115-science-7","y":"115","n":7,"img":"science_q07","pk":"115_science","ans":"B","exp":"看電路：上方燈泡和下方「A₂＋燈泡」兩條支路並聯，並聯後再和「A₁＋燈泡」串聯，A₃ 也在同一條幹線上。串聯電路各處電流相同，A₁ 和 A₃ 都測總電流，所以 A₃＝A₁＝500 mA（A₂ 只測其中一條支路的 300 mA，另一支路是 200 mA）。","goal":"能知道串並聯電路中的電流運作情形","pr":64},{"id":"115-science-8","y":"115","n":8,"img":"science_q08","pk":"115_science","ans":"C","exp":"跑馬燈顯示「可能震度4級，到達時間約13秒後」，表示劇烈搖晃前約有13秒可以避難。(A)13秒是到達時間不是搖晃時間；(B)震度是學校當地的估計；(D)震度不是規模。","goal":"能知道地震資訊所代表的意義","pr":90},{"id":"115-science-9","y":"115","n":9,"img":"science_q09","pk":"115_science","ans":"C","exp":"室外暖濕的空氣吹進室內，遇到溫度較低的磁磚牆面，空氣中的水蒸氣遇冷「凝結」成小水珠，這就是返潮。","goal":"能知道溫度會影響物質的狀態","pr":76},{"id":"115-science-10","y":"115","n":10,"img":"science_q10","pk":"115_science","ans":"A","exp":"甲是大腦，聽到槍聲的「聽覺」在大腦產生。乙是小腦，負責維持平衡；丙是腦幹，調節呼吸、心跳；丁是脊髓。所以只有(A)正確。","goal":"能知道人體神經系統的運作方式","pr":62},{"id":"115-science-11","y":"115","n":11,"img":"science_q11","pk":"115_science","ans":"C","exp":"動作甲肺中氣體量多，是盡力吸氣後：橫膈下降、肋骨上舉，胸腔變大。動作乙氣體量少，是盡力呼氣後：橫膈上升、肋骨下降，胸腔變小，所以(C)正確。","goal":"能判讀實驗數據推論人體胸腔的變化","pr":67},{"id":"115-science-12","y":"115","n":12,"img":"science_q12","pk":"115_science","ans":"D","exp":"反應速率要比較「在一定時間內」產物的多少，或「完成反應所需的時間」。實驗只記錄最後的肥皂質量，沒有記錄各組反應花了多少時間，所以無法知道鹼的濃度和反應速率的關係。","goal":"能知道所提供的資料是否足以判斷反應速率","pr":63},{"id":"115-science-13","y":"115","n":13,"img":"science_q13","pk":"115_science","ans":"B","exp":"育種時讓具有某些特徵的植株「雜交」，經由花（生殖器官）授粉產生種子，是有性生殖。子代的基因型、表現型會與親代不同，玉米粒才會慢慢改變。","goal":"能知道遺傳變異的產生有多種途徑，並能分辨之","pr":56},{"id":"115-science-14","y":"115","n":14,"img":"science_q14","pk":"115_science","ans":"C","exp":"第8～14天看到的是左半邊亮、逐漸變細的月亮，是下弦月到殘月（農曆約22～29日）。往前推7天，前7天應該是從滿月慢慢虧缺到下弦月（左側亮的凸月），也就是(C)。","goal":"能了解月相變化的規律","pr":81},{"id":"115-science-15","y":"115","n":15,"img":"science_q15","pk":"115_science","ans":"B","exp":"滿潮與下一次滿潮約相隔12小時25分，每天的漲退潮時間約延後50分鐘。當天17:00滿潮，隔天約5:25滿潮、約11:35乾潮，退潮期間的一半約在8:30左右，所以選上午8～9點。","goal":"能應用潮汐週期判斷漲退潮","pr":47},{"id":"115-science-16","y":"115","n":16,"img":"science_q16","pk":"115_science","ans":"A","exp":"小忠想呈現的是打鼾聲「很大聲」，聲音的大小（響度）用分貝（dB）表示。Hz 是頻率（音調高低），340 m/s 是聲速，0.004秒是週期，都不能說明很吵。","goal":"能知道聲學中分貝的意義","pr":70},{"id":"115-science-17","y":"115","n":17,"img":"science_q17","pk":"115_science","ans":"A","exp":"恆星是能自行發光發熱的星體，所以方式一正確。方式二錯誤：例如月球繞地球公轉，但地球不是恆星。","goal":"能知道恆星與其他星體的區分方法","pr":67},{"id":"115-science-18","y":"115","n":18,"img":"science_q18","pk":"115_science","ans":"A","exp":"排水法要測不溶於水、不和水反應、會沉入水中的物體。銅片符合。鉀會和水劇烈反應；食鹽、葡萄糖會溶於水，都不適合。","goal":"能知道適合以排水法來測量體積的物質","pr":60},{"id":"115-science-19","y":"115","n":19,"img":"science_q19","pk":"115_science","ans":"D","exp":"CH₄＋2O₂→CO₂＋2H₂O，1個甲烷分子產生1個二氧化碳分子。要把1公噸甲烷換算成二氧化碳的質量，需要兩者的分子量：CH₄＝16，CO₂＝44，1公噸甲烷約產生 44/16＝2.75 公噸二氧化碳。","goal":"能依據情境推知要算出二氧化碳排放量所需的資訊","pr":66},{"id":"115-science-20","y":"115","n":20,"img":"science_q20","pk":"115_science","ans":"C","exp":"過濾體內液體、再吸收有用物質、排出多餘的含氮廢物，就是人體腎臟的功能（過濾、再吸收、形成尿液）。","goal":"能了解人體器官的功能，並依此類推其他動物的相似器官","pr":52},{"id":"115-science-21","y":"115","n":21,"img":"science_q21","pk":"115_science","ans":"D","exp":"捉放法：池中鯉魚總數 N，50/N＝5/50，N＝500隻，扣掉放入的50隻紅鯉魚，黑鯉魚 X＝450隻。捉放法是用抽樣估算，所以是「可能數量」，不一定是實際數量。","goal":"能了解族群調查的方式及限制","pr":55},{"id":"115-science-22","y":"115","n":22,"img":"science_q22","pk":"115_science","ans":"D","exp":"論點二只說「兩側距支點相同距離吊相同質量會平衡」。實驗四兩側砝碼的位置和數量不同、卻仍保持平衡，這種情況不在論點二的說明範圍內，所以無法用論點二解釋；但也不能因此證明論點二錯誤。","goal":"能評估簡單模型的適用性","pr":63},{"id":"115-science-23","y":"115","n":23,"img":"science_q23","pk":"115_science","ans":"C","exp":"要找出影響乾燥速率的變因，每次比較只能改變一個變因。第二組（熱水、沒加鹽）和第三組（冷水、加鹽）同時改變了水溫和加鹽兩個變因，無法判斷是哪一個造成差異。","goal":"能了解實驗的操縱變因","pr":60},{"id":"115-science-24","y":"115","n":24,"img":"science_q24","pk":"115_science","ans":"D","exp":"光合作用：水＋二氧化碳（甲）→ 氧氣＋葡萄糖＋水。甲是二氧化碳，從空氣經氣孔進入，不是從土壤吸收；氧氣主要由葉子的氣孔排出。葡萄糖和氧氣都可以作為呼吸作用的反應物，所以(D)合理。呼吸作用的產物是二氧化碳和水，與乙不同。","goal":"能理解呼吸作用及光合作用","pr":56},{"id":"115-science-25","y":"115","n":25,"img":"science_q25","pk":"115_science","ans":"B","exp":"兩袋黑白棋各半，相當於兩個雜合（Aa）親代交配。子代 AA：Aa：aa＝1：2：1，黑色（AA、Aa）約占 3/4，白色約占 1/4。100次約 75 黑、25 白，最接近 78、22。","goal":"能應用遺傳法則對實驗結果進行預測","pr":53},{"id":"115-science-26","y":"115","n":26,"img":"science_q26","pk":"115_science","ans":"A","exp":"圖中是紅海，兩側陸地距離逐年增加，是張裂性板塊交界。張裂處地函物質上升，岩漿湧出冷卻形成火成岩（玄武岩）。(B)新形成的海洋地殼很年輕；(C)兩側在不同板塊；(D)海溝在聚合性交界。","goal":"能根據資訊，推論板塊相互分離時可能的特徵","pr":44},{"id":"115-science-27","y":"115","n":27,"img":"science_q27","pk":"115_science","ans":"A","exp":"氣溫在對流層隨高度增加而降低，在平流層則隨高度增加而上升，所以用甲圖（氣溫–高度）可以區分。氣壓在兩層都隨高度增加而降低，乙圖無法區分。","goal":"能區分不同大氣分層的特性","pr":56},{"id":"115-science-28","y":"115","n":28,"img":"science_q28","pk":"115_science","ans":"C","exp":"延長線上的壓鈕等同無熔絲開關，是保護延長線本身。延長線上同時插很多電器時，流經延長線的總電流變大，超過延長線能負荷的最大電流就叫超載，壓鈕會跳起斷電。","goal":"能了解無熔絲開關的功能","pr":55},{"id":"115-science-29","y":"115","n":29,"img":"science_q29","pk":"115_science","ans":"C","exp":"穿山龍有花、種子，是開花植物（被子植物），被子植物的種子包在果實裡，所以有果實的構造。(A)棒槌瓜和穿山龍都是俗名；(B)孢子囊堆是蕨類；(D)毬果是裸子植物。","goal":"能知道不同植物分類的重要特徵","pr":53},{"id":"115-science-30","y":"115","n":30,"img":"science_q30","pk":"115_science","ans":"A","exp":"質量相等、熱源相同，相同時間吸收相同熱量，溫度上升越慢的比熱越大。500秒內：甲上升 100－40＝60°C，乙上升 80－20＝60°C，丙上升 70－20＝50°C。甲、乙相同，丙上升最少，比熱最大：S甲＝S乙＜S丙。","goal":"能應用比熱相關公式","pr":51},{"id":"115-science-31","y":"115","n":31,"img":"science_q31","pk":"115_science","ans":"B","exp":"電鍍時，被鍍物（鑰匙）接電源負極當陰極，鍍層金屬（銅片）接正極當陽極。溶液中的銅離子（Cu²⁺）帶正電，會往負極的鑰匙移動並析出銅。符合的是(B)。","goal":"能知道電鍍的相關概念","pr":58},{"id":"115-science-32","y":"115","n":32,"img":"science_q32","pk":"115_science","ans":"B","exp":"密度均勻的長方體放在桌上，壓力＝重量÷底面積＝密度×g×高度，只和高度有關。截去長、寬不影響高度，高度從10 cm 變成 8 cm，壓力變成原本的 8/10，也就是 4/5 P。","goal":"能應用壓力公式","pr":38},{"id":"115-science-33","y":"115","n":33,"img":"science_q33","pk":"115_science","ans":"B","exp":"碗漂浮時，浮力＝碗重＋碗內水重。陶瓷密度比水大，所以碗必須比「碗內水面與碗外水面同高」時再沉得更深，碗外水面一定比碗內水面高。甲圖碗內水面高於碗外；乙圖碗內外水面一樣高，兩張圖都不合理。","goal":"能應用阿基米德原理","pr":46},{"id":"115-science-34","y":"115","n":34,"img":"science_q34","pk":"115_science","ans":"D","exp":"甲在太平洋上，是太平洋高壓（高氣壓），讓臺灣乾熱。北方冷高壓與太平洋高壓勢力相當，冷暖氣團僵持，形成長期停留在日本到中國之間的滯留鋒（梅雨鋒面），造成持續暴雨。","goal":"能應用圖中資訊，推論氣團與鋒面的性質","pr":47},{"id":"115-science-35","y":"115","n":35,"img":"science_q35","pk":"115_science","ans":"C","exp":"電流通過導線時，導線上方的磁場方向和導線垂直。磁針原本指向南北：放在南北向或斜向導線上方時，磁場有東西方向的分量，磁針會明顯偏轉。丙所在的導線是東西向，它產生的磁場是南北方向，和磁針原本的方向在同一直線上，磁針不會左右偏轉，最不適合用來判斷。","goal":"能應用安培右手定則","pr":43},{"id":"115-science-36","y":"115","n":36,"img":"science_q36","pk":"115_science","ans":"D","exp":"甲：20÷(20＋20)＝50%；乙：30÷(30＋20)＝60%。濃度比＝50：60＝5：6。","goal":"能應用重量百分率濃度","pr":45},{"id":"115-science-37","y":"115","n":37,"img":"science_q37","pk":"115_science","ans":"B","exp":"酵素分解蛋白質，蛋白質減少、產物X增加。人體消化液中能分解蛋白質的有胃液和胰液（含胰蛋白酶），膽汁不含酵素。此酵素催化的是蛋白質的分解，X 是產物。","goal":"能正確判讀圖片獲得資訊，並依據該資訊及習得知識進行推論","pr":41},{"id":"115-science-38","y":"115","n":38,"img":"science_q38","pk":"115_science","ans":"C","exp":"緯度越高，季節的白天長短差異越大：夏季白天比嘉義更長，冬季白天比嘉義更短；春分、秋分（約9/23）時各地白天都約12小時，兩線會相交。符合的是(C)。","goal":"能推論不同季節、不同緯度地區的晝夜長短","pr":42},{"id":"115-science-39","y":"115","n":39,"img":"science_q39","pk":"115_science","ans":"D","exp":"肺臟流出的血液經肺靜脈先進入「左心房」；肝臟流出的血液經肝靜脈進入下大靜脈，再進入「右心房」，不是右心室。兩人都錯。","goal":"能了解人體循環及血液流動路徑","pr":42},{"id":"115-science-40","y":"115","n":40,"img":"science_q40","pk":"115_science","ans":"A","exp":"中和反應中鈉離子不參與反應，數目不變，但加入鹽酸後溶液總體積增加，所以鈉離子濃度變小。食鹽易溶於水，不會析出。","goal":"能了解酸鹼中和反應的離子濃度變化","pr":27},{"id":"115-science-41","y":"115","n":41,"img":"science_q41","pk":"115_science","ans":"B","exp":"甲靜止、乙等速度運動，都是受力平衡，外力＝重力（mg）。丙等加速度向下運動，合力向下，外力小於重力。所以 F甲＝F乙＞F丙。","goal":"能統整牛頓運動定律相關概念","pr":23},{"id":"115-science-42","y":"115","n":42,"img":"science_q42","pk":"115_science","ans":"D","pimg":"science_p42","grp":"115-science-42～43","exp":"環保署在該市只有一個測站，環保局則設了多個測站取平均，單一測站和多個測站平均的結果可能不同，所以會有兩種結果。","goal":"能對不同結果，提出可能的科學解釋","pr":73},{"id":"115-science-43","y":"115","n":43,"img":"science_q43","pk":"115_science","ans":"B","pimg":"science_p42","grp":"115-science-42～43","exp":"甲組臺北、宜蘭位在東北季風的迎風面，乙組雲林、嘉義在背風面。比較兩組的雨水 pH 平均值，是想了解迎風、背風是否會影響雨水 pH 值的平均。","goal":"能根據資訊，了解探究活動的可能主題","pr":70},{"id":"115-science-44","y":"115","n":44,"img":"science_q44","pk":"115_science","ans":"C","pimg":"science_p44","grp":"115-science-44～45","exp":"圖(二十九)中，12～13時的長條最高，表示這段時間氣泡移動最多，平均蒸散速率最大。(A)、(B)0～1、3～4時仍有少量移動，有發生蒸散；(D)6～7時的長條比7～8時低。","goal":"能正確判讀圖中數據","pr":76},{"id":"115-science-45","y":"115","n":45,"img":"science_q45","pk":"115_science","ans":"D","pimg":"science_p44","grp":"115-science-44～45","exp":"植物是由根吸水，從葉子的氣孔散失水分，不會從氣孔吸收水分向下運輸，所以氣泡不會因此向左移動。室內環境穩定、沒有日夜變化，所以(A)(B)可能發生；室內光線不足時氣孔關閉，(C)也可能發生。","goal":"能了解植物的運輸，並依此預測不同實驗條件下的實驗結果","pr":63},{"id":"115-science-46","y":"115","n":46,"img":"science_q46","pk":"115_science","ans":"C","pimg":"science_p46","grp":"115-science-46～47","exp":"不計空氣阻力，水滴自由落下時，落下的高度越高，到達石英板時的速度越快。調整針頭高度就能改變衝擊速度。改變溫度、大小或攝影設定都不會改變落下速度。","goal":"能根據實驗目的調整適當的實驗條件","pr":64},{"id":"115-science-47","y":"115","n":47,"img":"science_q47","pk":"115_science","ans":"A","pimg":"science_p46","grp":"115-science-46～47","exp":"F′ 和 F 是作用力與反作用力，大小相等。圖(三十一)中力最大的時刻是第一個高峰（約0.006 N），對應水滴剛撞上石英板的狀態，也就是(A)。","goal":"能擷取圖中資訊並應用反作用力相關知識","pr":49},{"id":"115-science-48","y":"115","n":48,"img":"science_q48","pk":"115_science","ans":"D","pimg":"science_p48","grp":"115-science-48～50","exp":"組別一通入氧氣，可用雙氧水分解製造；組別四通入二氧化碳，可用鹽酸和碳酸鈣（大理石）反應製造。鹽酸和鎂帶反應產生的是氫氣。","goal":"能了解氣體的製備方法","pr":59},{"id":"115-science-49","y":"115","n":49,"img":"science_q49","pk":"115_science","ans":"D","pimg":"science_p48","grp":"115-science-48～50","exp":"組別二通入空氣，160分鐘時從5.00 mL降到4.50 mL，消耗0.5 mL，約占10%。空氣中氧氣約占21%，所以氧氣沒有耗盡，消耗比例只有氧氣含量的一半左右。","goal":"能知道大氣中氧氣的含量並分析數據","pr":38},{"id":"115-science-50","y":"115","n":50,"img":"science_q50","pk":"115_science","ans":"A","pimg":"science_p48","grp":"115-science-48～50","exp":"表(五)的活性：鎂＞碳＞鋅＞鐵＞銅＞金。鐵的活性比碳小，無法搶走二氧化碳中的氧，所以理論上鐵粉不會被氧化。","goal":"能依據物質對氧的活性大小，判斷是否發生氧化還原反應","pr":42},{"id":"ak-science-1","y":"ak","n":1,"html":"小琪把盆栽放在窗邊，植物的葉片在陽光下製造養分。植物細胞中，進行光合作用製造葡萄糖的構造是下列何者？","opts":["粒線體","細胞核","葉綠體","液胞"],"ans":"C","exp":"葉綠體含有葉綠素，是進行光合作用、製造葡萄糖的地方。粒線體負責呼吸作用；細胞核控制遺傳；液胞儲存水分與物質。","topic":"生物：光合作用"},{"id":"ak-science-2","y":"ak","n":2,"html":"某植物的高莖（A）對矮莖（a）為顯性。兩株基因型都是 Aa 的高莖植物雜交，子代出現矮莖的機率為何？","opts":["0","1/4","1/2","3/4"],"ans":"B","exp":"Aa × Aa 的子代基因型比例為 AA：Aa：aa＝1：2：1。矮莖必須是 aa，機率為 1/4。","topic":"生物：遺傳"},{"id":"ak-science-3","y":"ak","n":3,"html":"小傑吃白飯時，細嚼一陣子後覺得有甜味。白飯中的澱粉最早開始被消化的部位是哪裡？","opts":["小腸","口腔","胃","大腸"],"ans":"B","exp":"口腔中的唾液含澱粉酶，會把澱粉分解成麥芽糖，所以細嚼白飯會覺得甜。澱粉從口腔就開始被消化。","topic":"生物：消化"},{"id":"ak-science-4","y":"ak","n":4,"html":"一個金屬塊的質量為 60 g，放入裝水的量筒後，水面上升了 20 mL。這個金屬塊的密度為多少？","opts":["0.33 g/cm³","3 g/cm³","40 g/cm³","1200 g/cm³"],"ans":"B","exp":"水面上升 20 mL，金屬塊體積為 20 cm³。密度＝質量÷體積＝60÷20＝3 g/cm³。","topic":"理化：密度"},{"id":"ak-science-5","y":"ak","n":5,"html":"一輛機車由靜止出發，沿直線行駛，10 秒後速度達到 20 m/s。若為等加速度運動，加速度為多少？","opts":["0.5 m/s²","2 m/s²","10 m/s²","200 m/s²"],"ans":"B","exp":"加速度＝速度變化÷時間＝(20－0)÷10＝2 m/s²。","topic":"理化：加速度"},{"id":"ak-science-6","y":"ak","n":6,"html":"一個物體所受的合力為零時，它的運動狀態最可能是下列何者？","opts":["一定做圓周運動","保持靜止或等速度直線運動","速度越來越快","速度越來越慢"],"ans":"B","exp":"依牛頓第一運動定律，物體所受合力為零時，靜者恆靜、動者恆做等速度直線運動。","topic":"理化：力"},{"id":"ak-science-7","y":"ak","n":7,"html":"將 25 g 的糖完全溶解在 100 g 的水中，這杯糖水的重量百分濃度為多少？","opts":["20%","25%","80%","125%"],"ans":"A","exp":"重量百分濃度＝溶質÷溶液×100%＝25÷(25＋100)×100%＝20%。注意分母是溶液（糖＋水），不是只有水。","topic":"理化：濃度"},{"id":"ak-science-8","y":"ak","n":8,"html":"甲溶液的 pH 值為 3，乙溶液的 pH 值為 5。甲溶液的氫離子濃度是乙溶液的幾倍？","opts":["1/100 倍","2 倍","20 倍","100 倍"],"ans":"D","exp":"pH 值每差 1，氫離子濃度相差 10 倍。pH 3 比 pH 5 小 2，氫離子濃度是 10×10＝100 倍。","topic":"理化：酸鹼"},{"id":"ak-science-9","y":"ak","n":9,"html":"鎂帶在空氣中燃燒，發出強光並生成白色的氧化鎂。關於鎂的變化，下列敘述何者正確？","opts":["鎂被氧化","鎂被還原","鎂是氧化劑","鎂沒有參與反應"],"ans":"A","exp":"鎂和氧結合成氧化鎂，鎂得到氧，是被氧化；鎂本身是還原劑，氧氣是氧化劑。","topic":"理化：氧化"},{"id":"ak-science-10","y":"ak","n":10,"html":"將一個 6 Ω 的電阻接在 12 V 的電池兩端，通過電阻的電流為多少？","opts":["0.5 A","2 A","18 A","72 A"],"ans":"B","exp":"歐姆定律 I＝V÷R＝12÷6＝2 A。","topic":"理化：電學"},{"id":"ak-science-11","y":"ak","n":11,"html":"將兩個 6 Ω 的電阻並聯，總電阻為多少？","opts":["1.5 Ω","3 Ω","6 Ω","12 Ω"],"ans":"B","exp":"並聯：1/R＝1/6＋1/6＝2/6，R＝3 Ω。兩個相同電阻並聯，總電阻是其中一個的一半。","topic":"理化：電路"},{"id":"ak-science-12","y":"ak","n":12,"html":"北半球的夏至這一天，中午太陽直射的位置在哪裡？","opts":["南回歸線（約南緯 23.5 度）","北回歸線（約北緯 23.5 度）","赤道","北極圈"],"ans":"B","exp":"夏至時太陽直射北回歸線，北半球白天最長；冬至直射南回歸線；春分、秋分直射赤道。","topic":"地科：季節"},{"id":"ak-science-13","y":"ak","n":13,"html":"農曆十五的晚上，小樂看到又大又圓的月亮。此時太陽、地球、月球的相對位置最可能是下列何者？","opts":["月球在太陽與地球之間","三者排成直角","地球在太陽與月球之間","太陽在地球與月球之間"],"ans":"C","exp":"滿月時，地球在太陽和月球之間，月球亮面完全朝向地球。月球在中間時是新月；排成直角時是上、下弦月。","topic":"地科：月相"},{"id":"ak- /* backup code */
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pipe(u8,T){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer())}
async function exportCode(){
  const raw=new TextEncoder().encode(JSON.stringify({seen:st.seen,wrong:st.wrong,hist:st.hist,wa:st.wa||{}}));
  if(window.CompressionStream){try{return 'CAP1:'+b64e(await pipe(raw,CompressionStream))}catch(e){}}
  return 'CAP0:'+b64e(raw);
}
async function importCode(t){t=t.replace(/\s+/g,'');
  if(t.startsWith('CAP1:'))return JSON.parse(new TextDecoder().decode(await pipe(b64d(t.slice(5)),DecompressionStream)));
  if(t.startsWith('CAP0:'))return JSON.parse(new TextDecoder().decode(b64d(t.slice(5))));
  throw new Error('bad');
}

function loadJsPDF(){return window.jspdf?Promise.resolve():new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)})}
const PX=8; // canvas px per mm
function textCanvas(paras,wmm,size,bold){
  const c=document.createElement('canvas'),x=c.getContext('2d'),W=Math.round(wmm*PX),fs=size*PX,lh=fs*1.55;
  const font=`${bold?'700 ':''}${fs}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;x.font=font;
  const lines=[];for(const p of paras){let cur='';for(const ch of p){if(x.measureText(cur+ch).width>W&&cur){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur)}
  c.width=W;c.height=Math.ceil(lines.length*lh+fs*0.4);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';x.font=font;x.textBaseline='top';
  lines.forEach((l,i)=>x.fillText(l,0,i*lh+fs*0.2));return c;
}

async function makePDF(){
  const b=$('pdf');const old=b.textContent;b.disabled=true;b.textContent='製作中…';
  try{
    await loadJsPDF();const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
    const M=12,W=210-2*M,H=297-2*M;let y=M;
    const put=(c,wmm)=>{let w=wmm,h=c.height/c.width*w;if(h>H){h=H;w=c.width/c.height*h}
      if(y+h>M+H){doc.addPage();y=M}doc.addImage(c.toDataURL('image/jpeg',0.85),'JPEG',M,y,w,h);y+=h+3};
    const hOf=(c,w)=>Math.min(H,c.height/c.width*w);const keep=h=>{if(y+h>M+H&&h<=H){doc.addPage();y=M}};
    const c=st.cur[subj],S=SUBJ[subj];
    put(textCanvas([`${S.name}　${c.mode==='wrong'?'錯題區練習':'隨機測驗'}　共 ${c.ids.length} 題　作答時間 ${S.min} 分鐘`],W,5,true),W);
    let lastG=null;
    for(let i=0;i<c.ids.length;i++){const q=byId[c.ids[i]];
      if(q.grp&&q.grp!==lastG){const lb=textCanvas(['【題組】請閱讀以下內容，回答下列各題'],W,3.6,true);
        const k=q.pimg?await imgCanvas(q.pk,q.pimg):textCanvas(strip(q.passage||''),W,4.2),kw=q.pimg?Math.min(W,k.width/5):W;
        keep(hOf(lb,W)+hOf(k,kw)+3);put(lb,W);put(k,kw)}
      lastG=q.grp||null;
      const lb=textCanvas([`第 ${i+1} 題（${srcLabel(q)}）`],W,3.2,true);
      const k=q.img?await imgCanvas(q.pk,q.img):textCanvas([...strip(q.html),...q.opts.map((o,k)=>`(${L[k]}) ${strip(o).join(' ')}`)],W,4.2),kw=q.img?Math.min(W,k.width/5):W;
      keep(hOf(lb,W)+hOf(k,kw)+3);put(lb,W);put(k,kw);
    }
    doc.addPage();y=M;
    put(textCanvas(['答案'],W,5,true),W);
    const rows=[];for(let i=0;i<c.ids.length;i+=10)rows.push(c.ids.slice(i,i+10).map((id,k)=>`${String(i+k+1).padStart(2,' ')}.${byId[id].ans}`).join('　'));
    put(textCanvas(rows,W,4),W);
    const d=new Date(),fn=`會考練習_${S.name}_${d.getMonth()+1}月${d.getDate()}日.pdf`;
    await dl.save({filename:fn,data:doc.output('blob')});
  }catch(e){if(!e||e.code!=='declined'){b.textContent='無法產生 PDF';setTimeout(()=>{b.textContent=old},2500);b.disabled=false;return}}
  b.disabled=false;b.textContent=old;
}

show();
})();
</script>
