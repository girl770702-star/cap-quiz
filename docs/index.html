"110_social","ans":"B","pimg":"110_social_p56","grp":"110-social-56～57"},{"id":"110-social-58","y":"110","n":58,"img":"110_social_q58","pk":"110_social","ans":"C","pimg":"110_social_p58","grp":"110-social-58～60"},{"id":"110-social-59","y":"110","n":59,"img":"110_social_q59","pk":"110_social","ans":"B","pimg":"110_social_p58","grp":"110-social-58～60"},{"id":"110-social-60","y":"110","n":60,"img":"110_social_q60","pk":"110_social","ans":"A","pimg":"110_social_p58","grp":"110-social-58～60"},{"id":"110-social-61","y":"110","n":61,"img":"110_social_q61","pk":"110_social","ans":"C","pimg":"110_social_p61","grp":"110-social-61～63"},{"id":"110-social-62","y":"110","n":62,"img":"110_social_q62","pk":"110_social","ans":"C","pimg":"110_social_p61","grp":"110-social-61～63"},{"id":"110-social-63","y":"110","n":63,"img":"110_social_q63","pk":"110_social","ans":"D","pimg":"110_social_p61","grp":"110-social-61～63"},{"id":"111-social-1","y":"111","n":1,"img":"111_social_q01","pk":"111_social","ans":"C"},{"id":"111-social-2","y":"111","n":2,"img":"111_social_q02","pk":"111_social","ans":"B","exp":"題目說該地位於板塊交界和海岸山脈最南端，泥岩惡地是臺東利吉一帶的特色，也就是乙。(A)甲在東北角，(C)丙在恆春半島，(D)丁雖在臺南也有泥岩，但不在海岸山脈最南端，也不是板塊交界。"},{"id":"111-social-3","y":"111","n":3,"img":"111_social_q03","pk":"111_social","ans":"C","exp":"夏季東南季風帶來水氣，東南沿海濕熱；往西北深入內陸，離海越來越遠，水氣變少，轉為乾熱，所以是由東南指向西北的丙。其他路線的方向不是由沿海走向內陸乾燥區。"},{"id":"111-social-4","y":"111","n":4,"img":"111_social_q04","pk":"111_social","ans":"A"},{"id":"111-social-5","y":"111","n":5,"img":"111_social_q05","pk":"111_social","ans":"D","exp":"圖中要求報紙不必事先登記、不必事先檢查，是在爭取出版與言論自由。這些限制是戒嚴時期的報禁，所以訴求與消弭戒嚴體制對人權的限制有關。(A)是國會全面改選；(B)是二二八事件；(C)是國語運動，都和報禁無關。"},{"id":"111-social-6","y":"111","n":6,"img":"111_social_q06","pk":"111_social","ans":"B","exp":"戶籍上記載每戶的人口、年齡和性別，目的是掌握人力，作為徵收賦稅和徵調勞役的依據。建初十二年是西元416年，屬南北朝時期。(A)科舉要到隋唐才出現；(C)(D)與登記戶口的目的無關。"},{"id":"111-social-7","y":"111","n":7,"img":"111_social_q07","pk":"111_social","ans":"C"},{"id":"111-social-8","y":"111","n":8,"img":"111_social_q08","pk":"111_social","ans":"C"},{"id":"111-social-9","y":"111","n":9,"img":"111_social_q09","pk":"111_social","ans":"B","exp":"廟方違法擴建、侵占國土，卻以神明指示為由拒絕拆除，衝突在於國家法律規定與宗教信仰。(D)看似合理，但這裡被處罰的原因是違反法令，不是政府侵犯人民的財產權。"},{"id":"111-social-10","y":"111","n":10,"img":"111_social_q10","pk":"111_social","ans":"C"},{"id":"111-social-11","y":"111","n":11,"img":"111_social_q11","pk":"111_social","ans":"B"},{"id":"111-social-12","y":"111","n":12,"img":"111_social_q12","pk":"111_social","ans":"A","exp":"圖中越晚出生的女性，一生累積的生育數越少，代表少子化。要讓人口結構維持穩定，就要鼓勵生育，所以提高幼兒教育補助最合適。(B)會讓生育更少；(C)(D)並不能提高出生人數。"},{"id":"111-social-13","y":"111","n":13,"img":"111_social_q13","pk":"111_social","ans":"B","exp":"我國國籍採屬人主義，看父母的國籍，不看出生地，所以李大賢雖然生在臺中，但父母都是美國籍，就不曾有我國國籍。王大軒和林小潔父母是中華民國國籍；陳小涵能擔任市議員，必須具備我國國籍，所以是曾經取得過。"},{"id":"111-social-14","y":"111","n":14,"img":"111_social_q14","pk":"111_social","ans":"C"},{"id":"111-social-15","y":"111","n":15,"img":"111_social_q15","pk":"111_social","ans":"D"},{"id":"111-social-16","y":"111","n":16,"img":"111_social_q16","pk":"111_social","ans":"C","exp":"圖中原始森林面積逐年縮小。開發森林造成野生動物的棲地被破壞而減少，趨勢與森林相同；(A)(B)(D)油田、聚落、熱帶作物都是隨開發而增加，趨勢相反。"},{"id":"111-social-17","y":"111","n":17,"img":"111_social_q17","pk":"111_social","ans":"B"},{"id":"111-social-18","y":"111","n":18,"img":"111_social_q18","pk":"111_social","ans":"C"},{"id":"111-social-19","y":"111","n":19,"img":"111_social_q19","pk":"111_social","ans":"C","exp":"歷史事實是客觀、可以查證的事件：在皇宮空地搭突厥帳篷、穿突厥可汗的服飾、用佩刀割羊肉，是具體行為，所以選丙。(甲)(乙)(丁)中的「熱情」「傑出的模仿者」「很有限」都帶有評價或推測，屬於歷史解釋。"},{"id":"111-social-20","y":"111","n":20,"img":"111_social_q20","pk":"111_social","ans":"A"},{"id":"111-social-21","y":"111","n":21,"img":"111_social_q21","pk":"111_social","ans":"B","exp":"葡萄牙天主教徒到日本傳教貿易，是在十六世紀大航海時代，西方國家開拓新航線來到東方的背景下發生的。(A)是十九世紀中葉；(C)是隋唐時期；(D)是冷戰時期，都不是葡萄牙人來日本的時代。"},{"id":"111-social-22","y":"111","n":22,"img":"111_social_q22","pk":"111_social","ans":"D","exp":"列寧領導的布爾什維克黨主張退出戰爭。德國當時與俄國正在第一次世界大戰中作戰，讓列寧回國，是希望俄國發生革命而退出戰爭，德國就可以集中兵力在西線。(A)拿破崙是十九世紀初；(B)冷戰在二戰後；(C)德蘇互不侵犯條約是1939年。"},{"id":"111-social-23","y":"111","n":23,"img":"111_social_q23","pk":"111_social","ans":"D","exp":"甲國要求記者通過效忠領袖思想的考試才能拿到記者證，目的是控管記者的思想，影響民眾看到的新聞。(A)(B)與新聞自由指數長期排名接近倒數不符；(C)圖中記者證數量2020年反而大增，不是削減。"},{"id":"111-social-24","y":"111","n":24,"img":"111_social_q24","pk":"111_social","ans":"B"},{"id":"111-social-25","y":"111","n":25,"img":"111_social_q25","pk":"111_social","ans":"C"},{"id":"111-social-26","y":"111","n":26,"img":"111_social_q26","pk":"111_social","ans":"B","exp":"圖中鐵路穿越瑞士阿爾卑斯山區，全長約291公里，海拔大多在1000公尺以上，中途還翻越高山、再下降又上升，只有(B)的曲線符合。(A)是平地；(C)一路上升；(D)低於海平面，不可能在山區。"},{"id":"111-social-27","y":"111","n":27,"img":"111_social_q27","pk":"111_social","ans":"D"},{"id":"111-social-28","y":"111","n":28,"img":"111_social_q28","pk":"111_social","ans":"D"},{"id":"111-social-29","y":"111","n":29,"img":"111_social_q29","pk":"111_social","ans":"D","exp":"依定義，要比「歷年最暖月」的最高氣溫平均值高5℃以上。臺北最暖月是7月，平均最高氣溫34.3℃，34.3加5是39.3℃，所以要連續5天出現39.3℃以上才算熱浪。(A)(B)(C)是用了其他月份或沒加5℃。"},{"id":"111-social-30","y":"111","n":30,"img":"111_social_q30","pk":"111_social","ans":"B","exp":"「中華民國成立紀念」、國民黨黨旗與國旗飄揚，又提到抵制日貨、勿忘國恥，是1928年國民政府統一全國後的十年建設時期。(A)自強運動時還沒有中華民國；(C)(D)是中華人民共和國時期，不會懸掛國民黨黨旗。"},{"id":"111-social-31","y":"111","n":31,"img":"111_social_q31","pk":"111_social","ans":"D","exp":"第II階段（約1650到1675年）對日本、馬尼拉、南洋的貿易額都大幅下降，這時鄭氏在東南沿海與清廷對抗，清廷實施海禁與遷界，使貿易受阻。(A)(B)(C)時間或內容都與這段貿易驟減不符。"},{"id":"111-social-32","y":"111","n":32,"img":"111_social_q32","pk":"111_social","ans":"A","exp":"謝先生違反保護令，被判拘役，是刑事責任，他必須自己負責。(B)保護令是由法院核發，不是警察局；(C)刑事判決不服應向上級法院上訴，不是提起民事訴訟；(D)《性別平等教育法》規範的是校園，不適用於此。"},{"id":"111-social-33","y":"111","n":33,"img":"111_social_q33","pk":"111_social","ans":"A"},{"id":"111-social-34","y":"111","n":34,"img":"111_social_q34","pk":"111_social","ans":"D"},{"id":"111-social-35","y":"111","n":35,"img":"111_social_q35","pk":"111_social","ans":"D","exp":"到調解委員會調解，經法院核定後與確定判決有相同效力，既能解決糾紛又不必走訴訟，符合「紓解訟源」。(A)訴願是向上級機關申訴行政處分；(B)偷竊是刑事案件；(C)私下和解沒有與判決相同的效力。"},{"id":"111-social-36","y":"111","n":36,"img":"111_social_q36","pk":"111_social","ans":"D","exp":"機會成本是做選擇時放棄的最好選項的價值。大華最在意就近，小年最在意價格低；大華去離家較遠的乙商店，就放棄了近的方便；小年去售價較高的甲商店，就放棄了便宜的價格，所以兩人去對方在意的反面那家，機會成本較高。"},{"id":"111-social-37","y":"111","n":37,"img":"111_social_q37","pk":"111_social","ans":"C","exp":"文中批評政府假借預備立憲、搜刮錢財、出賣鐵路權又不保護人民，顯示對清廷改革徹底失望，因此體認到革命也是救國的方法。(A)是自強運動；(B)是戊戌變法；(D)是新文化運動，與文中批評清廷的內容不符。"},{"id":"111-social-38","y":"111","n":38,"img":"111_social_q38","pk":"111_social","ans":"C"},{"id":"111-social-39","y":"111","n":39,"img":"111_social_q39","pk":"111_social","ans":"C"},{"id":"111-social-40","y":"111","n":40,"img":"111_social_q40","pk":"111_social","ans":"D"},{"id":"111-social-41","y":"111","n":41,"img":"111_social_q41","pk":"111_social","ans":"B"},{"id":"111-social-42","y":"111","n":42,"img":"111_social_q42","pk":"111_social","ans":"D","exp":"甲國出口到乙國，進口來自丙國。要讓出口和進口都大增，甲國貨幣要相對乙國貶值，讓產品在乙國變便宜；同時相對丙國升值，讓從丙國進口變便宜，所以選(D)。"},{"id":"111-social-43","y":"111","n":43,"img":"111_social_q43","pk":"111_social","ans":"A"},{"id":"111-social-44","y":"111","n":44,"img":"111_social_q44","pk":"111_social","ans":"B","pimg":"111_social_p44","grp":"111-social-44～45","exp":"1855年臺灣尚未依條約開港（要到1858年天津條約後才開港），所以裕鐸說洋船不得直接在安平停泊。但官員私下允許洋船在打狗貿易，實際上已有洋商來臺貿易。"},{"id":"111-social-45","y":"111","n":45,"img":"111_social_q45","pk":"111_social","ans":"B","pimg":"111_social_p44","grp":"111-social-44～45","exp":"英國商人說，是府城泉州人組成的商人團體（郊）向福建巡撫告狀，指控外商收購物產使物價上漲，影響本地商人生意，所以府城商人藉「郊」來維護自身利益。(D)與文意相反，郊是在反對洋行，不是與洋行合作。"},{"id":"111-social-46","y":"111","n":46,"img":"111_social_q46","pk":"111_social","ans":"A","pimg":"111_social_p46","grp":"111-social-46～48"},{"id":"111-social-47","y":"111","n":47,"img":"111_social_q47","pk":"111_social","ans":"A","pimg":"111_social_p46","grp":"111-social-46～48"},{"id":"111-social-48","y":"111","n":48,"img":"111_social_q48","pk":"111_social","ans":"B","pimg":"111_social_p46","grp":"111-social-46～48","exp":"「墩」代表位在某一地物或水體的旁邊。圖二十五、二十六顯示家鄉旁有水體，所以地名最可能是潭墩。(A)海墩要靠海；(C)岸壁墩要有岸壁；(D)黑礁墩要有礁石，圖中都沒有這些地貌。"},{"id":"111-social-49","y":"111","n":49,"img":"111_social_q49","pk":"111_social","ans":"C","pimg":"111_social_p49","grp":"111-social-49～51"},{"id":"111-social-50","y":"111","n":50,"img":"111_social_q50","pk":"111_social","ans":"D","pimg":"111_social_p49","grp":"111-social-49～51"},{"id":"111-social-51","y":"111","n":51,"img":"111_social_q51","pk":"111_social","ans":"C","pimg":"111_social_p49","grp":"111-social-49～51"},{"id":"111-social-52","y":"111","n":52,"img":"111_social_q52","pk":"111_social","ans":"A","pimg":"111_social_p52","grp":"111-social-52～54"},{"id":"111-social-53","y":"111","n":53,"img":"111_social_q53","pk":"111_social","ans":"B","pimg":"111_social_p52","grp":"111-social-52～54","exp":"西歐盛行西風，空氣汙染物會被吹向汙染源的下風處，也就是東邊。低技術勞動階級被迫住在汙染嚴重的地方，所以最可能在汙染源東邊的乙。"},{"id":"111-social-54","y":"111","n":54,"img":"111_social_q54","pk":"111_social","ans":"A","pimg":"111_social_p52","grp":"111-social-52～54","exp":"文中描述資本家與勞動階級居住區因貧富差距而不同，勞動階級被迫住在汙染區，恩格斯為此不平。這種關心勞動階級、反對貧富不公的思想屬於社會主義。(B)(C)(D)關心的是民族、侵略擴張與極權統治，不是貧富居住差距。"},{"id":"112-social-1","y":"112","n":1,"img":"112_social_q01","pk":"112_social","ans":"C"},{"id":"112-social-2","y":"112","n":2,"img":"112_social_q02","pk":"112_social","ans":"D"},{"id":"112-social-3","y":"112","n":3,"img":"112_social_q03","pk":"112_social","ans":"A"},{"id":"112-social-4","y":"112","n":4,"img":"112_social_q04","pk":"112_social","ans":"A","exp":"2010年幼年人口比例是16.60%，2020年回升到17.95%，代表出生人口增加。中國在2016年開放生育第二胎，是造成微幅回升的原因。(B)一胎化政策會讓幼年比例持續下降；(C)(D)與2010至2020年的小幅回升無關。"},{"id":"112-social-5","y":"112","n":5,"img":"112_social_q05","pk":"112_social","ans":"A"},{"id":"112-social-6","y":"112","n":6,"img":"112_social_q06","pk":"112_social","ans":"C"},{"id":"112-social-7","y":"112","n":7,"img":"112_social_q07","pk":"112_social","ans":"C","exp":"甲約在1815年前後（拿破崙戰爭）、乙約在1870年（普法戰爭）、丙約在1914至1918年（第一次世界大戰）、丁約在1939至1945年（第二次世界大戰），都是壽命突然下降的年份。這些戰爭讓大量青壯年死亡，所以平均壽命驟降。(A)(B)(D)都不符合這四個時間點。"},{"id":"112-social-8","y":"112","n":8,"img":"112_social_q08","pk":"112_social","ans":"D","exp":"李科羅返回廈門時，當地新統治者是清朝，而鄭氏政權（國姓爺家族）與清帝國敵對，李科羅曾為鄭氏出使，擔心被清朝送往北京處置，所以趁亂逃亡。(A)(B)(C)的國家關係與這段背景無關。"},{"id":"112-social-9","y":"112","n":9,"img":"112_social_q09","pk":"112_social","ans":"C"},{"id":"112-social-10","y":"112","n":10,"img":"112_social_q10","pk":"112_social","ans":"C","exp":"領土包括領陸、領海與領空。圖中甲為陸地，乙為12浬以內的領海，丁、戊分別是甲、乙上方的領空。丙為12至200浬的專屬經濟海域，不屬於領土，其上空的己也不是領空。"},{"id":"112-social-11","y":"112","n":11,"img":"112_social_q11","pk":"112_social","ans":"B"},{"id":"112-social-12","y":"112","n":12,"img":"112_social_q12","pk":"112_social","ans":"D"},{"id":"112-social-13","y":"112","n":13,"img":"112_social_q13","pk":"112_social","ans":"A"},{"id":"112-social-14","y":"112","n":14,"img":"112_social_q14","pk":"112_social","ans":"B","exp":"「水落魚梁淺」是水位變低而露出沙洲，這是河流在乾季（枯水期）水量減少的現象，也就是季節性降水差異造成的水位變化。(A)襄陽不靠冰融補水；(C)襄陽在內陸，不會因海水入侵變化；(D)唐代並無大型堤壩。"},{"id":"112-social-15","y":"112","n":15,"img":"112_social_q15","pk":"112_social","ans":"A","exp":"臺灣不是CPTPP成員國，出口到成員國越南時要面對關稅，而成員之間的貿易關稅階段性取消，臺灣商品就會處於關稅劣勢。(B)(C)的雙方都是成員國，關稅降低反而有利；(D)印度不是成員國。"},{"id":"112-social-16","y":"112","n":16,"img":"112_social_q16","pk":"112_social","ans":"C","exp":"玻里尼西亞位於南太平洋，緯度應為南緯、經度應為西經，只有(C)南緯16.84度、西經151.37度符合，位置在大溪地一帶。(A)在北半球的西非；(B)在北半球的東亞內陸；(D)在南美洲南部，不屬於玻里尼西亞。"},{"id":"112-social-17","y":"112","n":17,"img":"112_social_q17","pk":"112_social","ans":"A","exp":"淡水、雞籠開港通商是在1860年代，大稻埕因此成為茶葉的集散出口中心，周成從事新興商品出口而致富，應是茶葉。(B)鹿皮是荷治時期的出口品；(C)蔗糖主要產在南部；(D)鴉片是進口品。"},{"id":"112-social-18","y":"112","n":18,"img":"112_social_q18","pk":"112_social","ans":"A"},{"id":"112-social-19","y":"112","n":19,"img":"112_social_q19","pk":"112_social","ans":"D","exp":"圖中有許多警察官吏駐在所，還發現炮臺、機槍陣地，顯示這條道路是日治時期為了控制山區原住民而開闢的警備道路，與理蕃政策有關。(A)劃界封山是清代政策；(B)(C)與山區步道無關。"},{"id":"112-social-20","y":"112","n":20,"img":"112_social_q20","pk":"112_social","ans":"A","exp":"文中的人是張學良，因與蔣中正的意見衝突，決定以武力拘禁他，這是1936年的西安事變。張學良的主張是停止內戰、聯合各黨派抗日。(D)攘外必先安內正是蔣中正的主張，與張學良相反。"},{"id":"112-social-21","y":"112","n":21,"img":"112_social_q21","pk":"112_social","ans":"B","exp":"題目討論遷都婆羅洲的好處（改善雅加達問題），同時也要考慮破壞紅毛猩猩棲地的代價，也就是做了這個選擇後放棄的其他價值，這是機會成本的概念。(A)(C)(D)文中都沒有談到。"},{"id":"112-social-22","y":"112","n":22,"img":"112_social_q22","pk":"112_social","ans":"D"},{"id":"112-social-23","y":"112","n":23,"img":"112_social_q23","pk":"112_social","ans":"B","exp":"圖中兩個灰色時期，收入最低20%家庭的可支配所得成長率都掉到負值（約-10%），而收入最高20%家庭仍維持正成長，表示經濟大衰退時低收入者受到的衝擊較嚴重。(A)(D)與圖相反；(C)圖中沒有區域資料。"},{"id":"112-social-24","y":"112","n":24,"img":"112_social_q24","pk":"112_social","ans":"B","exp":"甲是在質詢部長，所以甲是立法委員，立法院的職權包括審查中央政府預算。(A)審查法律是否違憲是司法院大法官的職權；(C)立委是全國性選舉產生；(D)部長才是由行政院院長提請總統任命，不是甲。"},{"id":"112-social-25","y":"112","n":25,"img":"112_social_q25","pk":"112_social","ans":"A","exp":"圖中橫軸是人口占世界的累計百分比，甲國寬度約16%，表示人口很多，但人均GDP遠低於世界平均，符合印度。(B)美國、(C)德國人均GDP高；(D)奈及利亞人口比例沒有那麼大。"},{"id":"112-social-26","y":"112","n":26,"img":"112_social_q26","pk":"112_social","ans":"B","exp":"巴拿馬到哥倫比亞之間的路段位在熱帶雨林地區，這段地形崎嶇、生態珍貴，因此未修建公路以保護熱帶雨林生態。(A)熱帶地區年溫差小；(C)運河在巴拿馬中部，不在此路段；(D)因紐特人住在北極圈，不在此地。"},{"id":"112-social-27","y":"112","n":27,"img":"112_social_q27","pk":"112_social","ans":"D","exp":"圖中熔岩流與火山灰都向西延伸，火山灰往西落下，表示當時吹東風，熔岩流由東向西流往海洋，所以地勢東高西低。依比例尺，噴發地點到海邊約6公里，(D)正確。(A)風向應為東風；(B)地勢東高西低；(C)西班牙海外島嶼在大西洋，不是太平洋。"},{"id":"112-social-28","y":"112","n":28,"img":"112_social_q28","pk":"112_social","ans":"B","exp":"乙站在臺灣北端的基隆一帶，位於東北季風的迎風面，冬季多雨，年降水量最多。甲在花蓮、丁在臺中盆地、丙在臺南平原，降水量都較少。"},{"id":"112-social-29","y":"112","n":29,"img":"112_social_q29","pk":"112_social","ans":"A","exp":"天狼星與太陽同時出現在地平線的時間，與尼羅河每年定期氾濫的時間吻合，古埃及人藉此推算氾濫日期並安排農事，發明了太陽曆。(B)是希臘城邦；(C)是印度；(D)是希伯來人。"},{"id":"112-social-30","y":"112","n":30,"img":"112_social_q30","pk":"112_social","ans":"D"},{"id":"112-social-31","y":"112","n":31,"img":"112_social_q31","pk":"112_social","ans":"C","exp":"俄國在第一次世界大戰初期支援斯拉夫兄弟塞爾維亞而參戰，1917年國內爆發革命、共產政權成立後，與同盟國議和退出戰爭。(A)是日本；(B)是德國；(D)是美國參戰的原因。"},{"id":"112-social-32","y":"112","n":32,"img":"112_social_q32","pk":"112_social","ans":"D","exp":"周朝為了管理遼闊的土地，實施封建制度，依照貴族的身分等級授予土地並冊封爵位。(A)郡縣制是秦朝；(B)科舉制度是隋唐以後；(C)編戶齊民與法律規範是戰國秦漢以後的作法。"},{"id":"112-social-33","y":"112","n":33,"img":"112_social_q33","pk":"112_social","ans":"B","exp":"文中描述西羅馬帝國滅亡後知識衰退，君主聘請學者復興文化、推廣拉丁文，這是查理曼聘請的學者，約在西元八世紀，當時的知識分子多為基督教教士。(A)(C)(D)的時代都不符合。"},{"id":"112-social-34","y":"112","n":34,"img":"112_social_q34","pk":"112_social","ans":"D","exp":"要同時比較每位醫師與每張病床負擔人數，數字越大代表資源越不足。丙地區的醫師負擔764.3人、病床負擔210.1人，兩項都是最高，所以最不足。(A)(B)人口與老年人口多寡不能直接決定資源不足；(C)乙地區並非最高。"},{"id":"112-social-35","y":"112","n":35,"img":"112_social_q35","pk":"112_social","ans":"D","exp":"飢餓行銷是利用排隊搶購的話題與流行，引發民眾的購買欲望，這是非價格的誘因，也就是非金錢誘因。(C)文中並未降價，不是價格誘因；(A)(B)談的是廠商競爭，與題意無關。"},{"id":"112-social-36","y":"112","n":36,"img":"112_social_q36","pk":"112_social","ans":"C"},{"id":"112-social-37","y":"112","n":37,"img":"112_social_q37","pk":"112_social","ans":"B","exp":"題目要的是增加國民人數，只有鼓勵各國人才歸化入籍，才會增加具有國籍的國民。(A)外籍移工不會成為國民；(C)(D)是照顧老人或育兒的措施，不能直接增加國民人數。"},{"id":"112-social-38","y":"112","n":38,"img":"112_social_q38","pk":"112_social","ans":"D","exp":"乙寫客家人抗日（1895年乙未戰爭前後），丙是1920年代文化協會與農民運動，甲是1940年代前後臺灣青年被徵召到南洋戰場。所以時間順序為乙、丙、甲。"},{"id":"112-social-39","y":"112","n":39,"img":"112_social_q39","pk":"112_social","ans":"A","exp":"1830年代清朝仍採一口通商，只有廣州可以對外貿易，上海要到1842年南京條約後才開港，所以出口量只出現在廣州，上海為0。(B)(C)(D)都顯示上海已有出口，是開港以後的情形。"},{"id":"112-social-40","y":"112","n":40,"img":"112_social_q40","pk":"112_social","ans":"A","exp":"1甲幣由可換10乙幣變成20乙幣，表示甲幣升值、乙幣貶值。甲國商品換算成乙幣後變貴，在乙國銷售量下滑；乙國商品則變便宜，在甲國更好賣。所以(B)(C)(D)的方向都反了。"},{"id":"112-social-41","y":"112","n":41,"img":"112_social_q41","pk":"112_social","ans":"C"},{"id":"112-social-42","y":"112","n":42,"img":"112_social_q42","pk":"112_social","ans":"D","exp":"不實業者被主管機關處罰，是違反行政法規而受到的行政罰。(D)少年抽菸、父母被處分也是行政處分。(A)借物不還是民事問題；(B)竊盜是刑事責任；(C)官員政策引發不滿，是政治責任。"},{"id":"112-social-43","y":"112","n":43,"img":"112_social_q43","pk":"112_social","ans":"C","exp":"表中30至44歲女性未就業主因是照顧子女，45歲以後則多是負責打理家務，顯示女性仍被期待承擔家庭照顧工作，因此家庭平權觀念仍待加強。(A)(B)(D)無法由表中數據看出。"},{"id":"112-social-44","y":"112","n":44,"img":"112_social_q44","pk":"112_social","ans":"C","pimg":"112_social_p44","grp":"112-social-44～45"},{"id":"112-social-45","y":"112","n":45,"img":"112_social_q45","pk":"112_social","ans":"D","pimg":"112_social_p44","grp":"112-social-44～45","exp":"「政治局勢發生變化」是指琉球王國被日本併吞，日本藉牡丹社事件向琉球及臺灣擴張勢力，進而在1879年廢琉球藩。(A)(C)的時間在琉球被併吞之後；(B)唐朝時日本效法中國，與此無關。"},{"id":"112-social-46","y":"112","n":46,"img":"112_social_q46","pk":"112_social","ans":"B","pimg":"112_social_p46","grp":"112-social-46～48","exp":"富士山每年7月上旬至9月上旬開放，是夏季，山上冬季的積雪大多已融化，適合登山。(C)日本夏季多雨，不是乾季；(D)西北季風盛行是冬季；(A)地質與地震不是季節性開放的原因。"},{"id":"112-social-47","y":"112","n":47,"img":"112_social_q47","pk":"112_social","ans":"C","pimg":"112_social_p46","grp":"112-social-46～48","exp":"圖中起點靠近1400公尺等高線，終點在3600公尺以上，最符合起點海拔1,440公尺、終點3,715公尺的丙。甲乙丁的起點分別是2,305、1,970、2,380公尺，都比圖中的起點高很多。"},{"id":"112-social-48","y":"112","n":48,"img":"112_social_q48","pk":"112_social","ans":"D","pimg":"112_social_p46","grp":"112-social-46～48","exp":"小婷要選平均坡度最陡的路線，丁是26.7%最大。體力、經驗不足者要選坡度最緩的路線，甲是18.9%最小。(B)(C)的選擇不是最陡或最緩。"},{"id":"112-social-49","y":"112","n":49,"img":"112_social_q49","pk":"112_social","ans":"B","pimg":"112_social_p49","grp":"112-social-49～51","exp":"開普敦在南緯約34度、非洲西南端，屬於地中海型氣候，位在南半球，所以一月是夏季，溫暖且雨量少，冬季才多雨。(A)(C)(D)的氣溫與降水型態都不符合。"},{"id":"112-social-50","y":"112","n":50,"img":"112_social_q50","pk":"112_social","ans":"A","pimg":"112_social_p49","grp":"112-social-49～51","exp":"文中說部分奴隸是荷蘭由亞洲殖民地輸出，荷蘭在亞洲的殖民地是現在的印尼一帶，也就是南洋群島。(B)(C)(D)都不是荷蘭當時的亞洲殖民地。"},{"id":"112-social-51","y":"112","n":51,"img":"112_social_q51","pk":"112_social","ans":"A","pimg":"112_social_p49","grp":"112-social-49～51","exp":"1869年蘇伊士運河通航，歐洲到印度洋周邊不用再繞過好望角，航程大幅縮短，所以船隻改走新航線，開普敦因此沒落。(B)(C)(D)與蘇伊士運河的位置和優勢無關。"},{"id":"112-social-52","y":"112","n":52,"img":"112_social_q52","pk":"112_social","ans":"D","pimg":"112_social_p52","grp":"112-social-52～54"},{"id":"112-social-53","y":"112","n":53,"img":"112_social_q53","pk":"112_social","ans":"B","pimg":"112_social_p52","grp":"112-social-52～54","exp":"標語邀請大家「試試看不要打小孩」，是希望透過改變家長的觀念與價值觀，進而帶動社會風氣的改變。(A)標語沒有主張提告；(C)沒有請願行動；(D)對象是大人，不是教導兒童。"},{"id":"112-social-54","y":"112","n":54,"img":"112_social_q54","pk":"112_social","ans":"C","pimg":"112_social_p52","grp":"112-social-52～54"},{"id":"113-social-1","y":"113","n":1,"img":"113_social_q01","pk":"113_social","ans":"B"},{"id":"113-social-2","y":"113","n":2,"img":"113_social_q02","pk":"113_social","ans":"A"},{"id":"113-social-3","y":"113","n":3,"img":"113_social_q03","pk":"113_social","ans":"B","exp":"上營盤在地勢較高處，營盤腳是它的西北山腳，所以上營盤應在營盤腳的東南方且等高線數值較大。圖中乙位於營盤腳東南方約140至150公尺處，符合；甲在北方、丁在西北方，丙在西南方，方位都不對。"},{"id":"113-social-4","y":"113","n":4,"img":"113_social_q04","pk":"113_social","ans":"A","exp":"圖中第五名是阿拉伯語，主要使用地區在西亞和北非。(B)東亞、南亞對應華語、印度語等；(C)南歐、南美洲是西班牙語和葡萄牙語；(D)北美洲、大洋洲主要是英語。"},{"id":"113-social-5","y":"113","n":5,"img":"113_social_q05","pk":"113_social","ans":"B","exp":"漳州人與客家人為了對抗泉州人，靠宗教活動團結成「七十二庄」，這是清代移民社會中不同籍貫、族群為爭奪土地水源而常發生的械鬥。(A)(C)(D)和閩客聯合對抗泉州人無關。"},{"id":"113-social-6","y":"113","n":6,"img":"113_social_q06","pk":"113_social","ans":"C","exp":"「圍攻外國領事館」「慈禧太后」「洋鬼子」指的是1900年的義和團事件，之後英、美、日、俄、德、法、奧、義八國組成聯軍攻入北京。(B)是鴉片戰爭；(D)是1926年國民政府北伐。"},{"id":"113-social-7","y":"113","n":7,"img":"113_social_q07","pk":"113_social","ans":"D","exp":"地圖畫的是西元前六世紀的巴比倫城與幼發拉底河，巴比倫位於兩河流域，當地使用的是楔形文字。象形文字是古埃及；拉丁文是羅馬及歐洲；片假名是日本。"},{"id":"113-social-8","y":"113","n":8,"img":"113_social_q08","pk":"113_social","ans":"C","exp":"日本在1894年的甲午戰爭、第一次世界大戰、九一八事變到太平洋戰爭都曾參與，日本在十九世紀末於廣島似島設置檢疫所。德國、法國沒有參與甲午戰爭；美國沒有參與九一八事變。"},{"id":"113-social-9","y":"113","n":9,"img":"113_social_q09","pk":"113_social","ans":"A","exp":"十七世紀荷蘭東印度公司在臺灣提供土地、耕牛與資金，招募漢人興建城堡、種稻種蔗，並常以武力處罰不服從的人。清帝國與鄭氏的統治在時間或方式上都不符合。"},{"id":"113-social-10","y":"113","n":10,"img":"113_social_q10","pk":"113_social","ans":"C"},{"id":"113-social-11","y":"113","n":11,"img":"113_social_q11","pk":"113_social","ans":"C"},{"id":"113-social-12","y":"113","n":12,"img":"113_social_q12","pk":"113_social","ans":"B","exp":"大法官宣告《民法》違反《憲法》，表示一切法律不得牴觸憲法，也就是憲法的法律位階最高。(A)規範範圍最廣和題意無關；(C)修改程序困難說的是憲法修憲門檻高。"},{"id":"113-social-13","y":"113","n":13,"img":"113_social_q13","pk":"113_social","ans":"C","exp":"7歲以上未滿18歲是限制行為能力人，訂定契約須經法定代理人同意才有效，目的是保護這類未成年人的權益。(A)無行為能力人是未滿7歲或受監護宣告者；(B)(D)與犯罪無關。"},{"id":"113-social-14","y":"113","n":14,"img":"113_social_q14","pk":"113_social","ans":"D"},{"id":"113-social-15","y":"113","n":15,"img":"113_social_q15","pk":"113_social","ans":"C","exp":"對照1976年與1985年的圖，新的市區範圍原本是魚塭的位置，可見新市區用地是由魚塭填土而來。(A)圖中沒有顯示海岸侵蝕；(B)魚塭面積是先因新生地增加再被取代，並非先減後增。"},{"id":"113-social-16","y":"113","n":16,"img":"113_social_q16","pk":"113_social","ans":"C","exp":"撒哈拉以南非洲經濟發展較落後、醫療衛生條件較差，因此平均壽命最低，但人口成長快。圖中只有丙在1990年約50歲、2019年約61歲，壽命最低且人口增加很多，最符合。"},{"id":"113-social-17","y":"113","n":17,"img":"113_social_q17","pk":"113_social","ans":"A"},{"id":"113-social-18","y":"113","n":18,"img":"113_social_q18","pk":"113_social","ans":"C"},{"id":"113-social-19","y":"113","n":19,"img":"113_social_q19","pk":"113_social","ans":"D","exp":"乙國領袖要求對方停止在古巴建立飛彈基地，是美國對蘇聯的要求；甲國提到對方在周邊部署飛彈包圍自己，是蘇聯的回應。這是1962年的古巴飛彈危機。"},{"id":"113-social-20","y":"113","n":20,"img":"113_social_q20","pk":"113_social","ans":"A","exp":"中世紀歐洲主流是地心說，認為地球在宇宙中心，太陽、月球、行星都繞地球轉，所以是圖左，說明為太陽繞行地球。圖右是日心說，要到哥白尼之後才逐漸被接受。"},{"id":"113-social-21","y":"113","n":21,"img":"113_social_q21","pk":"113_social","ans":"B","exp":"題目提到十四世紀中國結合原料製成特色商品，銷往印度、埃及，西班牙商船運往馬尼拉、墨西哥城、利馬，並受歐洲貴族喜愛，這是中國的瓷器。白銀是由美洲流向中國的，不符合題意。"},{"id":"113-social-22","y":"113","n":22,"img":"113_social_q22","pk":"113_social","ans":"C","exp":"表中柬埔寨、泰國、緬甸、不丹、斯里蘭卡都是信仰佛教人口比例高的國家，佛教發源於古印度，位置是圖中的丙。丁是西亞（伊斯蘭教、猶太教、基督教發源地附近）。"},{"id":"113-social-23","y":"113","n":23,"img":"113_social_q23","pk":"113_social","ans":"B","exp":"表中男性有71.4%從事產業移工，女性有99.2%從事社福移工，工作類別有明顯性別差異。(C)印尼移工主要從事看護等第三級產業；(D)越南移工主要在營建、製造、漁業，這些屬第一、二級產業。表中沒有薪資或權益差別的資料。"},{"id":"113-social-24","y":"113","n":24,"img":"113_social_q24","pk":"113_social","ans":"A"},{"id":"113-social-25","y":"113","n":25,"img":"113_social_q25","pk":"113_social","ans":"B","exp":"旁系血親是同源於祖父母輩的親戚，舅舅是母親的兄弟，姑姑是父親的姊妹，姨丈和伯母屬於姻親。再看地點：新北市、臺南市是直轄市，沒有市民代表，只有縣轄市和鄉鎮等才有市民代表，因此只有花蓮縣的舅舅符合。"},{"id":"113-social-26","y":"113","n":26,"img":"113_social_q26","pk":"113_social","ans":"C","exp":"復興區位於石門水庫集水區的上游，區內土地利用方式（如開墾、農藥）會隨雨水流入水庫，影響水質。(A)玉山山脈不在石門水庫集水區內；(B)福山位於集水區範圍外；(D)石門(3)是雨量站，並非淤積的河道。"},{"id":"113-social-27","y":"113","n":27,"img":"113_social_q27","pk":"113_social","ans":"A"},{"id":"113-social-28","y":"113","n":28,"img":"113_social_q28","pk":"113_social","ans":"B","exp":"後期最嚴重的地區已移到高鐵沿線附近，雲林地層下陷主要是過度抽取地下水造成，改種省水作物可減少抽水。(A)提高水費可能反而讓民眾更依賴地下水；(D)臺鐵不在下陷最嚴重處。"},{"id":"113-social-29","y":"113","n":29,"img":"113_social_q29","pk":"113_social","ans":"A","exp":"荔枝適合溫暖潮濕的亞熱帶氣候。臺灣中南部是亞熱帶，澳洲東北海岸的甲也是亞熱帶溼潤氣候；乙塔斯馬尼亞偏冷，丙在內陸沙漠區，丁在西南部是夏乾冬雨的地中海型氣候。"},{"id":"113-social-30","y":"113","n":30,"img":"113_social_q30","pk":"113_social","ans":"C","exp":"他希望女子能當總統、組織新政權，總統是共和制才有的職位，所以必須推翻清朝建立共和。(B)(D)保留皇帝或君主，不可能由人民選出總統。"},{"id":"113-social-31","y":"113","n":31,"img":"113_social_q31","pk":"113_social","ans":"D"},{"id":"113-social-32","y":"113","n":32,"img":"113_social_q32","pk":"113_social","ans":"A"},{"id":"113-social-33","y":"113","n":33,"img":"113_social_q33","pk":"113_social","ans":"D","exp":"此電纜橫跨太平洋，一端連到東南亞。丁一端在臺灣（約24.86°N、121.83°E），另一端在美國西岸洛杉磯附近（33.91°N、118.42°W），可由臺灣連到東南亞。甲在非洲與馬來西亞之間，乙橫跨大西洋，丙在地中海。"},{"id":"113-social-34","y":"113","n":34,"img":"113_social_q34","pk":"113_social","ans":"D","exp":"認養規定一的要求是年滿20歲才能自己辦理。小安第一次由爸爸陪同辦理，表示還沒滿20歲，卻已能投票，只有公民投票的投票權是年滿18歲；選舉的投票權要年滿20歲，所以第二次是自己辦理時的中央選舉。"},{"id":"113-social-35","y":"113","n":35,"img":"113_social_q35","pk":"113_social","ans":"B"},{"id":"113-social-36","y":"113","n":36,"img":"113_social_q36","pk":"113_social","ans":"B"},{"id":"113-social-37","y":"113","n":37,"img":"113_social_q37","pk":"113_social","ans":"C","exp":"題目要降低經過馬六甲海峽的風險，並連接中國西部與西亞、南亞，就是由新疆南下經巴基斯坦到阿拉伯海的中巴經濟走廊（丙）。乙是向西通往歐洲的陸路，丁是通往中南半島，甲是向北。"},{"id":"113-social-38","y":"113","n":38,"img":"113_social_q38","pk":"113_social","ans":"D","exp":"有法國租界、英國租界、自來水管和水塔，是上海在十九世紀末的情況。上海在鴉片戰爭後開港，設有英、法等國租界；北京在十八世紀初沒有租界；廣州在十八世紀末是一口通商，也沒有這樣的租界。"},{"id":"113-social-39","y":"113","n":39,"img":"113_social_q39","pk":"113_social","ans":"C"},{"id":"113-social-40","y":"113","n":40,"img":"113_social_q40","pk":"113_social","ans":"B","exp":"非告訴乃論案件不能調解，只有告訴乃論案件才可以調解。若調解不成功改由法院判決，所有刑事判決件數（甲）會增加，而非告訴乃論的案件（乙）不會因此改變。"},{"id":"113-social-41","y":"113","n":41,"img":"113_social_q41","pk":"113_social","ans":"A","exp":"11月11日是第一次世界大戰停戰紀念日，英國及其殖民地在獨立後仍保留，澳洲曾是英國殖民地且屬大英國協，所以最可能有同樣活動。巴西、韓國不是英國殖民地；荷蘭也不是。"},{"id":"113-social-42","y":"113","n":42,"img":"113_social_q42","pk":"113_social","ans":"D","exp":"島嶼高僅2公尺、很快消失，是河流在恆河口堆積的泥沙形成的沙洲，豪雨時河流帶來大量堆積物最可能造成。(A)恆河口不在板塊交界火山帶；(B)水土保持改善會讓泥沙減少；(C)海平面上升會淹沒陸地，不會形成島。"},{"id":"113-social-43","y":"113","n":43,"img":"113_social_q43","pk":"113_social","ans":"A","exp":"打狗港輸往日本的金額從1906至1915年大增，與日本資本投入糖業有關。(B)基隆離日本近，但表中打狗港對日本輸出額反而最多；(C)十八世紀後期臺灣的主要港口在鹿港、府城一帶；(D)十大建設是1970年代，與表中日治時期無關。"},{"id":"113-social-44","y":"113","n":44,"img":"113_social_q44","pk":"113_social","ans":"C","pimg":"113_social_p44","grp":"113-social-44～45","exp":"巫童被宗教團體當作災難來源而遭到虐待，顯示人們的行為會受到宗教信仰、習俗等社會規範影響，而且即使傷害孩子也深信不疑。(B)文中看不出法律比宗教強；(D)未提到公共意見的形成。"},{"id":"113-social-45","y":"113","n":45,"img":"113_social_q45","pk":"113_social","ans":"A","pimg":"113_social_p44","grp":"113-social-44～45"},{"id":"113-social-46","y":"113","n":46,"img":"113_social_q46","pk":"113_social","ans":"B","pimg":"113_social_p46","grp":"113-social-46～48","exp":"電動自行車不需掛牌、不需駕照、價格低廉，所以使用它的機會成本較低（花費的金錢和手續較少）。(A)(C)文中沒提；(D)負向誘因會讓人減少使用，與題意相反。"},{"id":"113-social-47","y":"113","n":47,"img":"113_social_q47","pk":"113_social","ans":"D","pimg":"113_social_p46","grp":"113-social-46～48","exp":"修正《道路交通管理處罰條例》是修改法律，必須由立法院三讀通過，再由總統公布。公民投票複決是修憲或領土變更時才有的程序；憲法法庭審理是解釋或審查憲法問題。"},{"id":"113-social-48","y":"113","n":48,"img":"113_social_q48","pk":"113_social","ans":"C","pimg":"113_social_p46","grp":"113-social-46～48","exp":"規定自2022年11月30日起施行，施行前已持有者在施行後二年內領用，最晚到2024年11月29日。逾期是遭主管機關開罰，屬於行政處罰，不是刑事處罰。"},{"id":"113-social-49","y":"113","n":49,"img":"113_social_q49","pk":"113_social","ans":"A","pimg":"113_social_p49","grp":"113-social-49～51","exp":"圖中南部和西部的州（如德州、佛羅里達）席次增加，東北部州席次減少，表示南部人口成長速度比東北部快。(B)全國席次固定，人口沒有持續負成長；(C)(D)文中沒有提到移民或禁止移民的因素。"},{"id":"113-social-50","y":"113","n":50,"img":"113_social_q50","pk":"113_social","ans":"D","pimg":"113_social_p49","grp":"113-social-49～51","exp":"席次僅1席的州多在高緯度或內陸，如阿拉斯加、北達科他、蒙大拿，常有地形、氣候、工業機會不足等因素。殖民地式經濟並非美國各州人口多寡的原因，所以較無關。"},{"id":"113-social-51","y":"113","n":51,"img":"113_social_q51","pk":"113_social","ans":"B","pimg":"113_social_p49","grp":"113-social-49～51"},{"id":"113-social-52","y":"113","n":52,"img":"113_social_q52","pk":"113_social","ans":"D","pimg":"113_social_p52","grp":"113-social-52～54"},{"id":"113-social-53","y":"113","n":53,"img":"113_social_q53","pk":"113_social","ans":"B","pimg":"113_social_p52","grp":"113-social-52～54"},{"id":"113-social-54","y":"113","n":54,"img":"113_social_q54","pk":"113_social","ans":"C","pimg":"113_social_p52","grp":"113-social-52～54","exp":"削蘋果事件是政府限制電影的內容，是對言論及出版自由的限制，禁止過度血腥暴力影像出版也屬於同類限制。(A)被告褫奪公權是參政權；(B)是應考試服公職權；(D)入境審查是遷徙自由。"},{"id":"114-social-1","y":"114","n":1,"img":"114_social_q01","pk":"114_social","ans":"A","exp":"題目說臺灣因位於地震帶、常有颱風而被列入。日本同樣位在環太平洋地震帶，又常受颱風侵襲，最符合。伊朗多地震但少颱風；北韓、澳洲都不是兩者兼具。","goal":"了解世界重要國家的自然環境特色。","pr":91},{"id":"114-social-2","y":"114","n":2,"img":"114_social_q02","pk":"114_social","ans":"A","exp":"臺灣開放農場、牧場合法聘僱農業移工，主要是因為農村人口老化、年輕人不願務農，農業勞動力不足。","goal":"了解臺灣面臨的農業問題與可能的因應方式。","pr":86},{"id":"114-social-3","y":"114","n":3,"img":"114_social_q03","pk":"114_social","ans":"B","exp":"電影中移民在美國仍說華語、過春節清明，是移民把原鄉文化帶到新居地延續。泰、緬新住民與移工在臺灣齊聚慶祝潑水節，也是同樣的概念。","goal":"了解文化擴散的概念。","pr":83},{"id":"114-social-4","y":"114","n":4,"img":"114_social_q04","pk":"114_social","ans":"B","exp":"從1904年臺灣堡圖可看到挖仔聚落位在河道彎曲處旁邊，且在臺灣西南部平原，地名最可能是指鄰近河道轉彎的地方。","goal":"判讀地圖資訊並作出合理推論。","pr":62},{"id":"114-social-5","y":"114","n":5,"img":"114_social_q05","pk":"114_social","ans":"B","exp":"離島地區醫療資源不足，重症常需送往本島，所以離島民眾最關心醫療資源分配。房價、重工業汙染、大規模土石流都較不是離島的主要問題。","goal":"了解臺灣的區域差異及問題。","pr":81},{"id":"114-social-6","y":"114","n":6,"img":"114_social_q06","pk":"114_social","ans":"C","exp":"圖中標示「臺灣總督府」「帝國大學」「鐵道部工場」「臺灣神社」，都是日本統治時期的建築，所以是〈臺北州大觀〉。","goal":"認識臺灣日治時期社會的樣貌。","pr":85},{"id":"114-social-7","y":"114","n":7,"img":"114_social_q07","pk":"114_social","ans":"D","exp":"提倡女性的入學、交友、營業、財產、出入、婚姻自由等「自然權利」，是受到近代歐洲天賦人權思想影響，屬於晚清西方思潮傳入中國的時期。","goal":"認識中國晚清時期婦女角色的轉變。","pr":79},{"id":"114-social-8","y":"114","n":8,"img":"114_social_q08","pk":"114_social","ans":"C","exp":"在廣州負責管理外國商人、收取關稅、接收貢品、專賣進口商品的機構，是唐宋以後設立的「市舶司」。洋行是清代的；總理衙門是清末的外交機構。","goal":"認識中國歷史上對外商貿的管理機構。","pr":66},{"id":"114-social-9","y":"114","n":9,"img":"114_social_q09","pk":"114_social","ans":"C","exp":"五四運動後，部分知識分子對西方失望，轉向俄國革命理論（共產主義），因此在1921年成立中國共產黨。","goal":"了解中國共產黨成立的歷史背景。","pr":52},{"id":"114-social-10","y":"114","n":10,"img":"114_social_q10","pk":"114_social","ans":"B","exp":"版畫把羅馬教宗畫成怪獸，諷刺教會用「滿滿一袋赦罪，用錢來贖」販賣贖罪券，這是宗教改革時期支持路德、批評天主教會的立場。路德主張「因信得救」。","goal":"了解宗教改革的重要主張。","pr":62},{"id":"114-social-11","y":"114","n":11,"img":"114_social_q11","pk":"114_social","ans":"C","exp":"跨國咖啡公司改用與當地環境相容的色系、當地文字招牌、加入當地料理，是尊重當地文化並與之融合。","goal":"發覺面對文化差異時，互相尊重與包容的作為。","pr":90},{"id":"114-social-12","y":"114","n":12,"img":"114_social_q12","pk":"114_social","ans":"D","exp":"美國禁止進口新疆強迫勞動生產的商品，是為了避免企業從侵害人權的生產中獲利。","goal":"從他國實例中發覺關於人權議題的作為。","pr":88},{"id":"114-social-13","y":"114","n":13,"img":"114_social_q13","pk":"114_social","ans":"D","exp":"廠商越多，消費者選擇越多，彼此競爭越激烈。招募更多廠商進駐美食街最能提升市場競爭程度。","goal":"理解市場競爭程度的概念。","pr":74},{"id":"114-social-14","y":"114","n":14,"img":"114_social_q14","pk":"114_social","ans":"C","exp":"乙、丙是姊妹（旁系血親），甲和乙、丙和丁是夫妻（配偶），甲和丙、乙和丁、甲和丁是姻親。四人之中沒有父母子女這種直系血親。","goal":"理解家人間的親屬關係。","pr":63},{"id":"114-social-15","y":"114","n":15,"img":"114_social_q15","pk":"114_social","ans":"C","exp":"W電視報導該候選人時負面報導占了28%中的21%，水果臺則多數是正面報導，可見不同媒體對同一候選人有不同立場，閱聽人要留意媒體是否持有特定立場。","goal":"檢視媒體報導政治人物時間、評價的差異，探討媒體在公共意見形成過程中的影響。","pr":78},{"id":"114-social-16","y":"114","n":16,"img":"114_social_q16","pk":"114_social","ans":"C","exp":"西部陸海新通道從成都、重慶通往廣西南寧，再出海往南，最主要是方便中國西部與東南亞國家（東協）的貿易往來。","goal":"分析交通建設對區域發展的影響。","pr":74},{"id":"114-social-17","y":"114","n":17,"img":"114_social_q17","pk":"114_social","ans":"A","exp":"告示牌說上游水壩會洩洪，不能進入溪谷，所以祕境在水壩下游的溪谷中。圖中甲位在水壩下游的河谷，最符合。","goal":"了解水系的概念並判讀等高線地形圖。","pr":60},{"id":"114-social-18","y":"114","n":18,"img":"114_social_q18","pk":"114_social","ans":"B","exp":"甲地物價、房價高，鄰國乙地一天薪水在甲地一小時就賺得到，人們住在乙地、通勤到甲地工作。美國與墨西哥相鄰、薪資差距很大，最符合。","goal":"了解世界重要國家的經濟發展特色。","pr":72},{"id":"114-social-19","y":"114","n":19,"img":"114_social_q19","pk":"114_social","ans":"D","exp":"甲區域的人口金字塔底部寬、頂部尖，幼年人口多、老年人口少，是高出生率的年輕型人口結構，最可能是漠南非洲。歐洲、北美、東北亞都較高齡化。","goal":"判讀人口金字塔及了解漠南非洲的人口特色。","pr":67},{"id":"114-social-20","y":"114","n":20,"img":"114_social_q20","pk":"114_social","ans":"C","exp":"圖(八)的漏斗狀陶器（糖漏）是用來製糖的。18～19世紀臺灣的製糖業集中在西南部的臺南一帶，也就是丙。","goal":"認識臺灣清帝國時期的糖業發展。","pr":65},{"id":"114-social-21","y":"114","n":21,"img":"114_social_q21","pk":"114_social","ans":"A","exp":"由統治者任用非世襲的官員，建立中央集權政府，起源於東周、秦統一後全面施行，是「郡縣制度」。封建制度是世襲的；科舉、九品官人法是選才制度。","goal":"了解中國歷史上的重要政治制度。","pr":63},{"id":"114-social-22","y":"114","n":22,"img":"114_social_q22","pk":"114_social","ans":"C","exp":"報導中提到重慶是「陪都」，和中、英、美、蘇「四國」聯合同盟，慶祝「大功告成」，是八年抗戰勝利的慶祝。","goal":"認識第二次世界大戰期間的中國局勢。","pr":72},{"id":"114-social-23","y":"114","n":23,"img":"114_social_q23","pk":"114_social","ans":"A","exp":"1989年的泛歐野餐，從共產國家逃往奧地利的大多是東德人。圖中甲是當時的東德，屬於共產集團；乙、丙、丁都是西歐國家。","goal":"了解美、蘇冷戰下的歐洲局勢。","pr":68},{"id":"114-social-24","y":"114","n":24,"img":"114_social_q24","pk":"114_social","ans":"D","exp":"各年級願意用網路投票的比例（90%以上）都遠高於實體投票（約40多%），可見使用科技能提升學生參與公共事務的程度。","goal":"發覺科技發展對中學生參與公共事務的影響。","pr":82},{"id":"114-social-25","y":"114","n":25,"img":"114_social_q25","pk":"114_social","ans":"D","exp":"規定出勤紀錄預設是加班，要由雇主舉證，因為員工通常較難取得證據，這樣規定是為了平衡勞資雙方不對等的權力關係。","goal":"從日常生活的勞資糾紛中，解釋立法保障勞動權益的理由。","pr":73},{"id":"114-social-26","y":"114","n":26,"img":"114_social_q26","pk":"114_social","ans":"A","exp":"家中有未滿6歲子女的已婚女性，勞動力參與率比沒有子女或子女都在6歲以上的女性低，可見照顧幼兒等家務勞動影響了女性參與市場勞動的機會。","goal":"檢視關於已婚女性勞動力參與率的統計資料，解析家務勞動的分擔影響女性的個人發展與市場勞動參與。","pr":74},{"id":"114-social-27","y":"114","n":27,"img":"114_social_q27","pk":"114_social","ans":"D","exp":"博斯普魯斯海峽航運量太大，船隻常要排隊等候。開鑿新運河分流後，等候通過海峽的時間會減少。","goal":"分析交通路線的興建對區域發展的影響。","pr":71},{"id":"114-social-28","y":"114","n":28,"img":"114_social_q28","pk":"114_social","ans":"B","exp":"圖中國家是新加坡，位在北緯1.33度，接近赤道、在太陽直射範圍內，太陽輻射強，適合發展太陽能。最高點只有163公尺，沒有高山發展水力。","goal":"分析世界重要國家發展綠能的條件。","pr":63},{"id":"114-social-29","y":"114","n":29,"img":"114_social_q29","pk":"114_social","ans":"B","exp":"中國降水由東南沿海向西北內陸遞減。年降水量低於全國平均（691.6毫米）的地區，主要是北方和西北內陸，所以深灰色應分布在北部與西部，符合(B)。","goal":"了解中國的氣候特色。","pr":57},{"id":"114-social-30","y":"114","n":30,"img":"114_social_q30","pk":"114_social","ans":"C","exp":"碳匯是能吸收、儲存碳的地方，如土壤、森林。恢復農地並以友善環境方式耕作，可以增加土壤的儲碳量。(A)焚林會釋放碳；(B)(D)是減少排放，不是增加碳匯。","goal":"了解減緩全球暖化的策略。","pr":66},{"id":"114-social-31","y":"114","n":31,"img":"114_social_q31","pk":"114_social","ans":"A","exp":"碑文說政府召募高砂族青年組成義勇隊，在南洋戰場上作戰，這是二次大戰時期日本推動皇民化運動的背景。","goal":"了解皇民化時期臺灣原住民的戰爭經驗。","pr":65},{"id":"114-social-32","y":"114","n":32,"img":"114_social_q32","pk":"114_social","ans":"B","exp":"臺灣原住民被日本人帶去日本、回來後被荷蘭人監禁，引發日人挾持臺灣長官的衝突（濱田彌兵衛事件），發生在17世紀荷蘭統治的大員（今臺南安平）。","goal":"認識大航海時代臺灣原住民與各方勢力的互動。","pr":70},{"id":"114-social-33","y":"114","n":33,"img":"114_social_q33","pk":"114_social","ans":"D","exp":"1946年臺灣光復後與中國大陸仍有往來，可以出口鳳梨罐頭；1949年政府遷臺後兩岸隔絕，之後出口數量都是0。符合的是丁。","goal":"了解臺海兩岸關係變化對臺灣貿易的影響。","pr":38},{"id":"114-social-34","y":"114","n":34,"img":"114_social_q34","pk":"114_social","ans":"C","exp":"演講者曾擔任立法委員，立法委員可以對司法院院長的被提名人行使同意權。(A)審核決算是監察院審計部；(B)提請任命部會首長是行政院長；(D)彈劾法官是監察委員。","goal":"理解立法院的職權。","pr":53},{"id":"114-social-35","y":"114","n":35,"img":"114_social_q35","pk":"114_social","ans":"B","exp":"乙資料中地方議會要求政府依法召開公聽會、聽取居民意見，顯示政府權力受到約束與制衡。甲資料是強迫人民服勞役，沒有保障勞動權利。","goal":"從不同時空脈絡中的人類生活情形，探討法治與人治的差異。","pr":77},{"id":"114-social-36","y":"114","n":36,"img":"114_social_q36","pk":"114_social","ans":"A","exp":"甲是檢察官，依據犯罪事證提起公訴是檢察官的職權，所以(A)適當。(B)法庭上有檢察官，是刑事案件，被告說要償還借款（民事）不符情境；(C)丙是辯護律師，判決是法官的工作，不是由檢察官甲判決；(D)撤銷行政處分是行政訴訟，與本案不符。","goal":"理解在犯罪的追訴及處罰過程中，檢察官及法官的功能與權限。","pr":68},{"id":"114-social-37","y":"114","n":37,"img":"114_social_q37","pk":"114_social","ans":"C","exp":"社會企業以商業活動獲利，並把利潤投入改善社會問題。提倡公平貿易、用合理價格收購小農產品幫助小農，符合這種模式。(D)募捐是非營利組織的做法。","goal":"檢視新型態的企業經營模式，解析有助促進社會公平正義的商業活動。","pr":43},{"id":"114-social-38","y":"114","n":38,"img":"114_social_q38","pk":"114_social","ans":"A","exp":"法院對爺爺作出監護宣告後，爺爺會成為無行為能力人，他自己做的贈與等法律行為無效，由監護人代理，以保障他的財產。","goal":"從新聞事件中的法律議題，解析監護宣告的目的及法律效果。","pr":43},{"id":"114-social-39","y":"114","n":39,"img":"114_social_q39","pk":"114_social","ans":"A","exp":"每月用相同的日幣換披索，年底換到的披索卻變少，表示1日幣能換的披索變少，也就是披索相對日幣升值（日幣貶值），在日本工作的實際收入減少。","goal":"從國際移工變更工作地點的考量，解析匯率與機會成本的變化情形。","pr":65},{"id":"114-social-40","y":"114","n":40,"img":"114_social_q40","pk":"114_social","ans":"D","exp":"加里寧格勒是俄羅斯在波羅的海、夾在波蘭和立陶宛之間的飛地，周圍都是北約國家，是俄羅斯面對北約的重要軍事基地。它不靠太平洋，也不在往芬蘭的路徑上。","goal":"分析位置對國際合作與競爭的重要性。","pr":46},{"id":"114-social-41","y":"114","n":41,"img":"114_social_q41","pk":"114_social","ans":"D","exp":"表中各水庫2020年11月底蓄水已偏低，到2021年5月更是見底。2020年沒有颱風侵臺，夏秋缺乏颱風雨補充水庫，是最主要的原因。","goal":"分析影響臺灣水資源豐缺的因素。","pr":32},{"id":"114-social-42","y":"114","n":42,"img":"114_social_q42","pk":"114_social","ans":"C","exp":"可以調解的是民事事件和告訴乃論的刑事案件。2020年：民事200件，加上超過半數（多於90件）的刑事案件，可調解件數應在290～380件之間。2021年：民事230件，加上不到半數（少於75件）的刑事案件，應在230～305件之間。只有(C)兩年都符合。","goal":"檢視法律諮詢服務件數的相關統計資料，解析可採調解方式處理的紛爭類型。","pr":60},{"id":"114-social-43","y":"114","n":43,"img":"114_social_q43","pk":"114_social","ans":"B","pimg":"114_social_p43","grp":"114-social-43～45","exp":"博物館在墨西哥首都，館藏以當地古文明（阿茲提克、馬雅等）文物為主，所以阿茲提克容器最可能是主要館藏。巴比倫城門、南島語族樹皮布、因紐特獵具都不是當地文物。","goal":"認識美洲重要的古文明。","pr":71},{"id":"114-social-44","y":"114","n":44,"img":"114_social_q44","pk":"114_social","ans":"A","pimg":"114_social_p43","grp":"114-social-43～45","exp":"選文說神官手中的物品是「原產於美洲的作物」，也是當地古文明的主食，答案是玉米。橄欖、小麥、稻米都原產於舊大陸。","goal":"認識世界歷史上的重要作物。","pr":65},{"id":"114-social-45","y":"114","n":45,"img":"114_social_q45","pk":"114_social","ans":"D","pimg":"114_social_p43","grp":"114-social-43～45","exp":"文中說展品說明大多僅採用「今日當地的官方語文」，墨西哥曾受西班牙殖民，官方語言是西班牙文。","goal":"認識近代歐洲的海外擴張與殖民。","pr":67},{"id":"114-social-46","y":"114","n":46,"img":"114_social_q46","pk":"114_social","ans":"D","pimg":"114_social_p46","grp":"114-social-46～48","exp":"我國車牌不用數字「4」，是因為民眾認為與「死」諧音、觸霉頭，政府施政因而受到民間習俗這種社會規範的影響。民間習俗本身沒有強制力。","goal":"發覺社會規範對於政府施政的影響。","pr":57},{"id":"114-social-47","y":"114","n":47,"img":"114_social_q47","pk":"114_social","ans":"D","pimg":"114_social_p46","grp":"114-social-46～48","exp":"同樣的車牌號碼，有些人願意多付錢買8888等特殊號碼，有些人在意紀念日號碼，有些人完全不在意，說明不同人對同一誘因的感受不同。","goal":"從民眾是否付費選擇車牌的行為，說明不同人對同一誘因反應不同的概念。","pr":82},{"id":"114-social-48","y":"114","n":48,"img":"114_social_q48","pk":"114_social","ans":"C","pimg":"114_social_p46","grp":"114-social-46～48","exp":"違反《道路交通管理處罰條例》被罰是行政處分（罰鍰），不服可以透過行政救濟（如聲明異議、行政訴訟）維護權益。(A)訴願不是向立法機關提出；(D)不是刑事案件。","goal":"理解生活中常見的行政管制與行政救濟的途徑。","pr":50},{"id":"114-social-49","y":"114","n":49,"img":"114_social_q49","pk":"114_social","ans":"A","pimg":"114_social_p49","grp":"114-social-49～51","exp":"巴斯人的祖先來自伊朗高原，世代信仰發源於伊朗高原的宗教，也就是祆教（瑣羅亞斯德教）。","goal":"認識西亞古文明的重要宗教。","pr":55},{"id":"114-social-50","y":"114","n":50,"img":"114_social_q50","pk":"114_social","ans":"B","pimg":"114_social_p49","grp":"114-social-49～51","exp":"18世紀後期到19世紀中期，巴斯人與英國殖民者合作，從印度把鴉片運到中國販賣，換取白銀。","goal":"了解中國晚清時期的對外貿易情形。","pr":59},{"id":"114-social-51","y":"114","n":51,"img":"114_social_q51","pk":"114_social","ans":"D","pimg":"114_social_p49","grp":"114-social-49～51","exp":"墓碑用「伊嗣俟紀元」紀年，伊嗣俟是薩珊王朝最後一位國王，巴斯人用他的紀元，反映他們珍視薩珊王朝的歷史。(B)碑上只有去世年份，無法確定何時來華。","goal":"了解紀年對建構族群認同所代表的意義。","pr":63},{"id":"114-social-52","y":"114","n":52,"img":"114_social_q52","pk":"114_social","ans":"C","pimg":"114_social_p52","grp":"114-social-52～54","exp":"1982年與英國爆發戰爭、宣稱擁有南大西洋島嶼主權的是阿根廷（福克蘭群島戰爭），圖中甲也位在阿根廷附近。","goal":"了解全球海陸分布及世界重要國家的位置。","pr":49},{"id":"114-social-53","y":"114","n":53,"img":"114_social_q53","pk":"114_social","ans":"B","pimg":"114_social_p52","grp":"114-social-52～54","exp":"圖中冰山從2017年7月的位置，經2019年11月，到2020年7月往南喬治亞島移動，依圖上經緯度判斷，是從西南往東北漂流。","goal":"應用經緯度座標判斷方位。","pr":45},{"id":"114-social-54","y":"114","n":54,"img":"114_social_q54","pk":"114_social","ans":"D","pimg":"114_social_p52","grp":"114-social-52～54","exp":"選文說南喬治亞島有大量海獅、象鼻海豹、國王企鵝等動物，巨大冰山撞上島嶼會破壞海岸，危及動物棲地。島上幾乎沒有常住人口和工業；冰山融化會讓鹽度下降而不是上升。","goal":"分析氣候變遷所造成的影響。","pr":73},{"id":"115-social-1","y":"115","n":1,"img":"social_q01","pk":"115_social","ans":"A","exp":"7月下旬是颱風季，雲林、臺南、嘉義位在西南部平原，颱風（2024年凱米颱風）帶來的西南氣流豪雨容易淹沒農田。東北季風在冬季；梅雨在5～6月；焚風多發生在東部。","goal":"了解臺灣的氣象災害及其影響。","pr":80},{"id":"115-social-2","y":"115","n":2,"img":"social_q02","pk":"115_social","ans":"D","exp":"臺灣同樣缺乏看護、營造等勞動力，而且外籍移工主要來自越南、菲律賓、印尼、泰國，和日本招募的來源國高度重疊，彼此會搶人，衝擊最大。","goal":"分析不同國家的人口結構及其外籍勞工來源。","pr":84},{"id":"115-social-3","y":"115","n":3,"img":"social_q03","pk":"115_social","ans":"C","exp":"坐標約北緯6度、東經38度，位於衣索比亞（咖啡產地）。圖中說明要「以人工翻動果實」曬乾、剝除果皮果肉，需要大量人力；產品「上市販售」是為了賣錢，所以是勞力密集的商業性農業。","goal":"了解非洲熱帶栽培業的特色。","pr":71},{"id":"115-social-4","y":"115","n":4,"img":"social_q04","pk":"115_social","ans":"A","exp":"雪山山脈與中央山脈之間的平原是蘭陽平原，也就是宜蘭縣，當地平埔族為噶瑪蘭族。","goal":"了解臺灣主要地形與行政區的分布。","pr":68},{"id":"115-social-5","y":"115","n":5,"img":"social_q05","pk":"115_social","ans":"A","exp":"歐洲西半部國家經濟發達、工業化早，人均國民所得高、都市化程度也高，所以位於兩項都高於世界平均的「甲」區塊。","goal":"了解世界各洲的經濟及都市發展特色。","pr":70},{"id":"115-social-6","y":"115","n":6,"img":"social_q06","pk":"115_social","ans":"D","exp":"斯巴達以軍事教育聞名，男孩從小接受嚴格軍事訓練，所以後人容易誤以為斯巴達會丟棄不健壯的嬰兒。","goal":"認識古希臘的城邦政治。","pr":77},{"id":"115-social-7","y":"115","n":7,"img":"social_q07","pk":"115_social","ans":"D","exp":"漫畫標示1931年，主角是「銀行倒閉的受害者」，存在銀行的錢都沒了，這是1929年美國股市崩盤後引發的經濟大恐慌，大量銀行倒閉。","goal":"認識經濟大恐慌期間的社會面貌。","pr":89},{"id":"115-social-8","y":"115","n":8,"img":"social_q08","pk":"115_social","ans":"B","exp":"《中美共同防禦條約》即將失效、權貴想移民國外、政府推動愛國捐獻，〈龍的傳人〉也是1978年底的歌曲，這是1978年美國宣布將與中華民國斷交（1979年生效）時的社會情況。","goal":"認識戰後臺灣的國際處境。","pr":70},{"id":"115-social-9","y":"115","n":9,"img":"social_q09","pk":"115_social","ans":"A","exp":"17世紀西班牙曾占領臺灣北部（基隆、淡水一帶），在當地傳教，所以會說西班牙語、受洗為天主教徒的原住民分布在北部的「甲」區域。","goal":"認識大航海時代各方勢力在臺灣的競逐。","pr":77},{"id":"115-social-10","y":"115","n":10,"img":"social_q10","pk":"115_social","ans":"C","exp":"同樣的「○」「✓」符號，在臺灣和日本代表的意思不同，這說明不同文化之間存在差異。","goal":"發覺生活經驗中的文化差異。","pr":96},{"id":"115-social-11","y":"115","n":11,"img":"social_q11","pk":"115_social","ans":"C","exp":"原本售價19,999元、供貨99臺。調整後幾分鐘就賣光，還多出數百筆訂單，表示需求量突然大增，最可能是售價降到9,999元。若只把供貨量改成19臺，不會多出數百筆訂單；改成999臺或漲價都不會讓商品瞬間賣光。","goal":"理解價格如何影響資源分配。","pr":80},{"id":"115-social-12","y":"115","n":12,"img":"social_q12","pk":"115_social","ans":"D","exp":"臭蟲因觀光客、商務旅客、國際移工跨國移動而擴散到許多國家，說明經濟全球化讓人員流動頻繁，也影響人類的日常生活。","goal":"發覺社會現象中全球化帶來的影響。","pr":68},{"id":"115-social-13","y":"115","n":13,"img":"social_q13","pk":"115_social","ans":"C","exp":"陳小花受監護宣告，吳阿杰被褫奪公權，兩人都不能登記為公職人員候選人。(A)受監護宣告者為無行為能力人；(B)受監護宣告不是刑罰；(D)褫奪公權不影響投票權，吳阿杰年滿20歲且設籍超過4個月，仍可投票。","goal":"理解公平投票的原則。","pr":69},{"id":"115-social-14","y":"115","n":14,"img":"social_q14","pk":"115_social","ans":"A","exp":"阿德是小蔓母親的丈夫（繼父），小蔓與阿德沒有血緣關係，因為婚姻而產生的親屬關係是「姻親」（若沒有辦理收養）。","goal":"理解家人間的親屬關係。","pr":62},{"id":"115-social-15","y":"115","n":15,"img":"social_q15","pk":"115_social","ans":"C","exp":"位於安地斯山脈高山上、以石塊精密堆砌、能抗地震的古城，是印加文明的馬丘比丘，在南美洲西部的秘魯，也就是「丙」。","goal":"了解美洲古文明的分布與環境特色。","pr":56},{"id":"115-social-16","y":"115","n":16,"img":"social_q16","pk":"115_social","ans":"A","exp":"全球暖化使北極海冰大量融化，北極航線通航時間變長，歐亞之間行經北極的航行次數因此增加。","goal":"分析北極融冰加劇對於全球航運的影響。","pr":58},{"id":"115-social-17","y":"115","n":17,"img":"social_q17","pk":"115_social","ans":"B","exp":"石油輸出國家組織（OPEC）減產會讓全球石油供應變少，歐盟更難找到替代俄羅斯的油源，無助於擺脫對俄依賴。其他選項都能減少能源需求或增加替代來源。","goal":"分析歐洲降低能源依賴的策略。","pr":57},{"id":"115-social-18","y":"115","n":18,"img":"social_q18","pk":"115_social","ans":"B","exp":"黃河泥沙主要來自上游的黃土高原。瀑布「上游」推動造林固沙，減少泥沙流入，才可能讓壺口的河水變清。(A)會讓河水更濁；(C)、(D)是下游的事，影響不了上游的瀑布。","goal":"分析人類活動對自然環境的影響。","pr":60},{"id":"115-social-19","y":"115","n":19,"img":"social_q19","pk":"115_social","ans":"A","exp":"「扶清滅洋」、誅殺洋人與「教匪」（傳教士和教徒），還宣稱「神明附身」，這是清末的義和團。","goal":"認識中國晚清時期的東西方衝突。","pr":80},{"id":"115-social-20","y":"115","n":20,"img":"social_q20","pk":"115_social","ans":"B","exp":"西元7～8世紀是唐朝，從中亞引進馬匹、羊肉消費增加、婦女戴胡帽騎馬，都是胡人文化的影響，屬於魏晉到隋唐的民族互動。","goal":"了解中國隋唐時期不同民族間的文化交流。","pr":58},{"id":"115-social-21","y":"115","n":21,"img":"social_q21","pk":"115_social","ans":"D","exp":"圖中有「鐵道部」「電信郵便局」「公學校校長」等日治時期的機關與職稱，所以是日治時期的《臺灣總督府公文類纂》。","goal":"認識臺灣在日本時期的重要發展。","pr":78},{"id":"115-social-22","y":"115","n":22,"img":"social_q22","pk":"115_social","ans":"C","exp":"19世紀末美國取得菲律賓，總統主張用教育和基督教「教化欠缺能力」的人民，認為某些民族較優越、有責任教化其他民族，這是社會達爾文主義。","goal":"了解十九世紀帝國主義的發展。","pr":59},{"id":"115-social-23","y":"115","n":23,"img":"social_q23","pk":"115_social","ans":"B","exp":"依我國規定，外國人取得永久居留仍不是國民，不能參與公投、不能擔任民意代表，也沒有接受國民教育的義務；但言論自由是人人都享有的權利，所以兩者都能發表時事評論。","goal":"理解本國國民與外國籍勞工在權利義務上的異同。","pr":70},{"id":"115-social-24","y":"115","n":24,"img":"social_q24","pk":"115_social","ans":"B","exp":"小毛「起訴」案件是檢察官，阿雄「判決」案件是法官，小芳替大家「調解」糾紛是調解委員。騎車撞傷人涉及過失傷害（告訴乃論的刑事案件）和民事賠償，可以由檢察官偵查起訴、法官審判，也可以申請調解。(A)竊盜不是告訴乃論，不能調解；(C)借錢不還是純民事；(D)不服罰單屬行政程序。","goal":"理解檢察官、法官與調解委員的職權範圍。","pr":45},{"id":"115-social-25","y":"115","n":25,"img":"social_q25","pk":"115_social","ans":"A","exp":"對貝里斯白蝦零關稅，進口白蝦成本下降、供給增加，我國市場上白蝦售價可能下降。(B)貝里斯出口增加，出超應上升；(C)宏都拉斯出口減少，出超應下降；(D)宏都拉斯白蝦減少，競爭程度下降。","goal":"檢視我國市場上商品進口來源的變化，解析開放外國商品進口對我國市場及市場競爭程度的影響。","pr":62},{"id":"115-social-26","y":"115","n":26,"img":"social_q26","pk":"115_social","ans":"B","exp":"民事紛爭的途徑：至法院提告對方違反契約（甲）；結果：雙方在法院達成訴訟上和解（丁）。乙「自訴」和丙「罰金」都屬於刑事案件。","goal":"理解民事紛爭的解決途徑。","pr":56},{"id":"115-social-27","y":"115","n":27,"img":"social_q27","pk":"115_social","ans":"A","exp":"壯年人口比例高（15～64歲占近70%），而且「未來數十年仍占極高比例」，表示底下的幼年人口也還多，未來會持續補充勞動力，所以是(A)這種青壯年多、底部也寬的金字塔。(D)壯年集中在中高齡、幼年少，未來勞動力會減少。","goal":"判讀人口金字塔及了解世界重要國家的人口組成及其經濟發展特色。","pr":53},{"id":"115-social-28","y":"115","n":28,"img":"social_q28","pk":"115_social","ans":"A","exp":"震央在阿拉斯加南方海域（西經149度、北緯56度），位於太平洋北部，所以由太平洋海嘯警報中心研判。","goal":"應用全球經緯度座標判斷位置。","pr":49},{"id":"115-social-29","y":"115","n":29,"img":"social_q29","pk":"115_social","ans":"B","exp":"閩南的「坑頭」在溪流上游；客家依開墾順序命名，由下游往上游開墾，最後開墾的「坑尾」也在上游。所以兩個聚落都應位在溪谷上游（地勢較高、等高線數值較大處），只有(B)符合。","goal":"判讀等高線地形圖及了解各族群聚落地名的命名與環境的關係。","pr":50},{"id":"115-social-30","y":"115","n":30,"img":"social_q30","pk":"115_social","ans":"A","exp":"契約寫明竹塹社因「稅賦繁重」加上鹿變少，才把草地賣給漢人，並由漢人每年補貼稅銀，可見官府的賦稅影響原住民的土地經營方式。(B)竹塹社繳稅，屬「熟番」；(C)漢人買地是為了開墾；(D)文中沒有提到遷徙。","goal":"了解臺灣清帝國時期原住民社會的發展。","pr":67},{"id":"115-social-31","y":"115","n":31,"img":"social_q31","pk":"115_social","ans":"B","exp":"法國國王為解決財政危機，召開自1614年後就未再召開的「三級會議」（1789年），這也是法國大革命的開端。","goal":"認識法國大革命的歷史背景。","pr":61},{"id":"115-social-32","y":"115","n":32,"img":"social_q32","pk":"115_social","ans":"D","exp":"日治時期臺灣人要求設置臺灣議會（臺灣議會設置請願運動），檢察官說統治「過於優厚」、要臺灣人做日本國民，指的是當時推行的「內地延長主義」，把臺灣視為日本內地的延長。","goal":"了解臺灣在日本時期各階段的統治政策。","pr":68},{"id":"115-social-33","y":"115","n":33,"img":"social_q33","pk":"115_social","ans":"A","exp":"「伐遼」「從契丹人手中奪回燕雲十六州」是宋代的背景。宋代重視科舉，考中進士者由皇帝親授官職，因此有「比收復燕雲十六州還光榮」的說法。","goal":"了解中國歷史上的重要政治制度。","pr":64},{"id":"115-social-34","y":"115","n":34,"img":"social_q34","pk":"115_social","ans":"C","exp":"文物以拉丁文刻寫《新約聖經》的經文，又刻有福音書的宗教故事，是基督教在西歐盛行時期的作品，最可能是西元9世紀的西歐（如查理曼帝國時期）。西元前沒有《新約聖經》；14世紀的中南美洲尚未接觸基督教。","goal":"了解世界歷史上重要宗教的發展。","pr":47},{"id":"115-social-35","y":"115","n":35,"img":"social_q35","pk":"115_social","ans":"C","exp":"行政院對立法院通過的法案認為窒礙難行而提出覆議，是行政權對立法權的制衡，符合權力分立的精神。","goal":"理解我國政府體制中權力分立與制衡的機制。","pr":69},{"id":"115-social-36","y":"115","n":36,"img":"social_q36","pk":"115_social","ans":"C","exp":"罰鍰是行政罰，不服行政處分可以提起訴願救濟。(A)罰鍰是負向誘因；(B)臺北市的自治條例由臺北市議會修正；(D)罰鍰不是刑事處罰。","goal":"檢視地方政府制定地方法規處理問題的過程，解析地方自治的制度及行政救濟的途徑。","pr":56},{"id":"115-social-37","y":"115","n":37,"img":"social_q37","pk":"115_social","ans":"D","exp":"出席會議、提出法律修正案、審查預算，都是立法委員的工作。要評鑑立委的工作品質，可以看他「質詢內容」。(A)糾正案是監察院；(B)審理案件是法院；(C)編列預算是行政機關。","goal":"理解立法委員的職權。","pr":53},{"id":"115-social-38","y":"115","n":38,"img":"social_q38","pk":"115_social","ans":"D","exp":"APP 讓消費者知道哪些企業違反環保法規，藉此影響消費者的偏好，進而改變購買行為。","goal":"檢視環保團體的作為，解析影響消費行為的因素。","pr":56},{"id":"115-social-39","y":"115","n":39,"img":"social_q39","pk":"115_social","ans":"B","exp":"官軍從鹿港登陸、事件後將「諸羅」改名「嘉義」，是清乾隆年間的林爽文事件。","goal":"了解臺灣清帝國時期重要民變及其影響。","pr":53},{"id":"115-social-40","y":"115","n":40,"img":"social_q40","pk":"115_social","ans":"A","exp":"甲的航線遍布北美、印度等地，符合殖民地最多的英國；乙的航線集中到南非好望角與東印度群島（印尼），符合荷蘭的勢力範圍。","goal":"了解大航海時代以來，歐洲國家在世界各地的擴張情形。","pr":52},{"id":"115-social-41","y":"115","n":41,"img":"social_q41","pk":"115_social","ans":"B","exp":"乙幣價格固定，若成本（甲幣）越來越低，表示1甲幣能換到越來越多乙幣，匯率上升；6月22日成本最高，表示當天1甲幣換到的乙幣最少，匯率最低。所以匯率是6月初先上升，之後下降，到6月22日左右最低，符合(B)。","goal":"解析匯率變動對進口貿易的影響。","pr":42},{"id":"115-social-42","y":"115","n":42,"img":"social_q42","pk":"115_social","ans":"D","exp":"喀土穆位於青尼羅河與白尼羅河交會處，尼羅河往北流入埃及，埃及用水依賴尼羅河。若喀土穆被占領、河流遭控制，會影響埃及用水。(A)蘇丹不與肯亞相鄰；(B)蘇丹港不在波斯灣；(C)圖上沒有橄欖園。","goal":"分析國際衝突的影響。","pr":44},{"id":"115-social-43","y":"115","n":43,"img":"social_q43","pk":"115_social","ans":"B","exp":"修法後從母姓的比例雖然逐年增加，但到2018年也只有2.3%，表示大多數人仍選擇從父姓，選擇姓氏時仍受傳統社會規範影響。","goal":"檢視我國新生兒從母姓統計資料的變化，解析社會規範對於選擇新生兒姓氏的影響。","pr":47},{"id":"115-social-44","y":"115","n":44,"img":"social_q44","pk":"115_social","ans":"D","pimg":"social_p44","grp":"115-social-44～45","exp":"「五腳基」有頂蓋的步行通道，在新加坡這種炎熱多雨的熱帶氣候下，可以讓行人避免日晒和雨淋。","goal":"了解自然環境對人類生活型態的影響。","pr":87},{"id":"115-social-45","y":"115","n":45,"img":"social_q45","pk":"115_social","ans":"C","pimg":"social_p44","grp":"115-social-44～45","exp":"因地形多山、可耕地少而大量人口移往南洋，返鄉蓋洋樓，這是中國東南沿海的福建、廣東一帶（僑鄉）。","goal":"了解中國人口遷移的原因及影響。","pr":62},{"id":"115-social-46","y":"115","n":46,"img":"social_q46","pk":"115_social","ans":"A","pimg":"social_p46","grp":"115-social-46～48","exp":"阿華透過通訊群組轉傳訊息，朋友們看了開始批評政府和法律，可見是透過社群網路影響公共意見。","goal":"發覺生活經驗中社群網路對公共意見的影響。","pr":84},{"id":"115-social-47","y":"115","n":47,"img":"social_q47","pk":"115_social","ans":"C","pimg":"social_p46","grp":"115-social-46～48","exp":"表(八)顯示新增感染者人數從2017年的2,519人逐年減少到2021年的1,247人，訊息說「同性婚姻合法化後患者大幅增加」與事實不符。(D)我國盛行率0.3%和歐美國家差不多，不是較低。","goal":"檢視關於疾病統計數據的變化，探討日常生活中個人或群體可能面臨的不公平處境。","pr":80},{"id":"115-social-48","y":"115","n":48,"img":"social_q48","pk":"115_social","ans":"B","pimg":"social_p46","grp":"115-social-46～48","exp":"小明收到訊息後，主動查詢政府公開的統計資料和其他國家資料來查證，顯示面對各種媒體資訊，要具備媒體識讀能力。","goal":"理解閱聽人具備媒體識讀能力的重要性。","pr":88},{"id":"115-social-49","y":"115","n":49,"img":"social_q49","pk":"115_social","ans":"D","pimg":"social_p49","grp":"115-social-49～51","exp":"最適合製糖的作物是甘蔗，生長在高溫多雨的熱帶、副熱帶地區，大約南緯25度到北緯25度之間。","goal":"了解重要農作物的生產與地理環境的關係。","pr":71},{"id":"115-social-50","y":"115","n":50,"img":"social_q50","pk":"115_social","ans":"A","pimg":"social_p49","grp":"115-social-49～51","exp":"1950年代政府以出口糖、米等農產加工品賺取外匯，用來扶植國內的輕工業，這是臺灣戰後初期的產業特色。","goal":"了解臺灣產業發展的歷程。","pr":50},{"id":"115-social-51","y":"115","n":51,"img":"social_q51","pk":"115_social","ans":"C","pimg":"social_p49","grp":"115-social-49～51","exp":"糖廠除了製糖，也生產酒精、有機肥、飼料，並轉型觀光，目的是提高產業的附加價值。","goal":"分析產業轉型的原因與目的。","pr":86},{"id":"115-social-52","y":"115","n":52,"img":"social_q52","pk":"115_social","ans":"B","pimg":"social_p52","grp":"115-social-52～54","exp":"配合自強運動的商人家族，最可能經營的是自強運動推動的新式事業，如興築鐵路、開採煤鐵礦。(C)大躍進是中共時期；(D)市舶司是唐宋以後的海關機構。","goal":"了解中國晚清時期的重要變革。","pr":53},{"id":"115-social-53","y":"115","n":53,"img":"social_q53","pk":"115_social","ans":"B","pimg":"social_p52","grp":"115-social-52～54","exp":"1933～1937年發行「航空公路建設獎券」，是國民政府北伐統一後（1928～1937年）推動「十年建設」的一部分。","goal":"了解中國現代歷史的發展。","pr":56},{"id":"115-social-54","y":"115","n":54,"img":"social_q54","pk":"115_social","ans":"D","pimg":"social_p52","grp":"115-social-52～54","exp":"1941年太平洋戰爭爆發，日本向英美宣戰，進占上海租界，並以「東亞民族解放者」自居，開放中國人使用租界內的設施。","goal":"了解日本帝國主義對中國的侵略行為。","pr":45},{"id":"ak-social-1","y":"ak","n":1,"html":"小羽寒假到臺灣各地旅行，發現某地一月時幾乎天天下雨，當地人說這是「冬季季風帶來的雨」。小羽最可能在下列哪一個縣市？","opts":["宜蘭縣","臺南市","臺中市","屏東縣"],"ans":"A","exp":"臺灣冬季吹東北季風，位在東北部迎風面的宜蘭、基隆冬天多雨。屏東、臺南、臺中在背風面，冬季較乾燥。","topic":"地理：氣候"},{"id":"ak-social-2","y":"ak","n":2,"html":"某地位於赤道以南、本初子午線以東。下列哪一個坐標（緯度, 經度）最可能是該地？","opts":["(20°N, 30°W)","(20°N, 30°E)","(20°S, 30°E)","(20°S, 30°W)"],"ans":"C","exp":"赤道以南是南緯（S），本初子午線以東是東經（E），所以是 (20°S, 30°E)。","topic":"地理：經緯度"},{"id":"ak-social-3","y":"ak","n":3,"html":"夏天傍晚，阿哲發現市中心的氣溫常比郊區山邊高好幾度。造成這種「都市熱島效應」的原因，最可能是下列何者？","opts":["市中心的森林覆蓋率比郊區高","市中心建築密集、柏油路面吸熱，冷氣與車輛也排放廢熱","市中心的海拔比郊區高","市中心位在季風的迎風面"],"ans":"B","exp":"都市建築密集不易散熱，水泥、柏油吸熱後慢慢放出，加上冷氣、汽機車排放廢熱，使市區比郊區熱。海拔越高氣溫反而越低；森林多會降溫。","topic":"地理：都市"},{"id":"ak-social-4","y":"ak","n":4,"html":"小華到印尼交換學生，發現當地每天有固定時間的禮拜，學校餐廳也不供應豬肉。這最可能和印尼信仰人口最多的哪一種宗教有關？","opts":["伊斯蘭教","天主教","印度教","佛教"],"ans":"A","exp":"印尼是全世界穆斯林人口最多的國家。伊斯蘭教每天有固定的禮拜時間，並禁食豬肉。","topic":"地理：東南亞"},{"id":"ak-social-5","y":"ak","n":5,"html":"十七世紀荷蘭東印度公司來到臺灣，在當地建立熱蘭遮城作為統治與貿易中心。這座城位在今天的哪裡？","opts":["臺北萬華","基隆和平島","彰化鹿港","臺南安平"],"ans":"D","exp":"荷蘭人以大員（今臺南安平）為據點，建立熱蘭遮城。基隆和平島是西班牙人建城的地方。","topic":"臺灣史：荷蘭時期"},{"id":"ak-social-6","y":"ak","n":6,"html":"1860 年代臺灣開港通商後，北臺灣的經濟地位逐漸超越南臺灣，最主要的原因是下列何者？","opts":["茶葉與樟腦大量外銷","政府設立加工出口區","稻米大量輸往日本","蔗糖產量大幅增加"],"ans":"A","exp":"開港後茶、糖、樟腦是三大出口品，茶葉和樟腦主要產在北部，帶動北部發展。蔗糖主要產在南部；加工出口區是戰後的政策。","topic":"臺灣史：清代開港"},{"id":"ak-social-7","y":"ak","n":7,"html":"某時期政府鼓勵臺灣人改日本姓名、在家說日語可獲「國語家庭」認定，並推動參拜神社。這些措施屬於下列何者？","opts":["土地改革","皇民化運動","十大建設","開山撫番"],"ans":"B","exp":"改日本姓名、國語家庭、參拜神社，是日治後期（中日戰爭爆發後）推動的皇民化運動，目的是讓臺灣人成為效忠天皇的日本人。","topic":"臺灣史：日治"},{"id":"ak-social-8","y":"ak","n":8,"html":"戰後政府推行「三七五減租」、「公地放領」與「耕者有其田」。這一系列政策的主要目的是下列何者？","opts":["吸引外國資金投資","改善佃農生活並提高農業生產","推動都市更新","發展重化工業"],"ans":"B","exp":"這三項是戰後的土地改革，降低佃租、讓佃農擁有自己的土地，提高耕作意願與農業生產，也改善佃農的生活。","topic":"臺灣史：戰後"},{"id":"ak-social-9","y":"ak","n":9,"html":"十八世紀後期，某國率先以蒸汽機帶動紡織業機械化，工廠林立，人口大量湧向城市。這個率先發生工業革命的國家是下列何者？","opts":["美國","德國","英國","法國"],"ans":"C","exp":"工業革命最早在十八世紀後期的英國展開，瓦特改良蒸汽機，紡織業率先機械化。","topic":"世界史"},{"id":"ak-social-10","y":"ak","n":10,"html":"依我國憲法規定，下列何者同時是人民的權利，也是人民的義務？","opts":["納稅","服兵役","受國民教育","集會遊行"],"ans":"C","exp":"憲法規定人民有受國民教育的權利與義務。服兵役、納稅是義務；集會遊行是權利。","topic":"公民：權利義務"},{"id":"ak-social-11","y":"ak","n":11,"html":"15 歲的小凱沒有告訴父母，就用壓歲錢在網路上買了一臺 3 萬元的筆電。依我國《民法》，這個買賣契約的效力為何？","opts":["無效，因為小凱未成年","效力未定，須經法定代理人承認才有效","有效，因為是用自己的錢","有效，但父母可以隨時撤銷"],"ans":"B","exp":"7 歲以上未滿 18 歲是限制行為能力人，訂立一般契約須經法定代理人（父母）同意；事前未同意的，效力未定，父母事後承認才生效。","topic":"公民：行為能力"},{"id":"ak-social-12","y":"ak","n":12,"html":"小明週六下午可以去便利商店打工賺 800 元，也可以去看一場免費的展覽，他最後選擇去看展覽。他看展覽的機會成本是下列何者？","opts":["展覽的門票錢","看展覽的交通費","0 元，因為展覽免費","放棄的 800 元打工收入"],"ans":"D","exp":"機會成本是做選擇時放棄的其他選項中價值最高者。小明選了看展，放棄的是打工的 800 元收入。","topic":"經濟：機會成本"},{"id":"ak-social-13","y":"ak","n":13,"html":"颱風過後，許多菜園受損，市場上的高麗菜價格大漲。若其他條件不變，這主要是因為下列何者？","opts":["供給減少","需求減少","需求增加","供給增加"],"ans":"A","exp":"菜園受損使高麗菜的供給減少，在需求不變的情況下，價格上漲。","topic":"經濟：供需"},{"id":"ak-social-14","y":"ak","n":14,"html":"下列何者是我國立法院的職權？","opts":["彈劾違法失職的公務人員","審判民事與刑事案件","舉辦公務人員考試","議決法律案與預算案"],"ans":"D","exp":"立法院議決法律案、預算案。彈劾是監察院；審判是司法院（法院）；舉辦考試是考試院。","topic":"公民：政府"},{"id":"ak-social-15","y":"ak","n":15,"html":"小芸在網路上看到一則「喝某種茶可以治好近視」的貼文，轉傳數已破萬。下列哪一種做法最能展現媒體識讀能力？","opts":["既然很多人轉傳，內容應該可信","先轉傳給家人，讓他們自己判斷","查證訊息來源，並比對專業機構的資料","只要貼文附有照片，就可以相信"],"ans":"C","exp":"媒體識讀是能判斷訊息的真假與立場。轉傳多、附照片都不代表正確，應查證來源、比對專業機構的資料。","topic":"公民：媒體識讀"}],"science":[{"id":"104-science-1","y":"104","n":1,"img":"104_science_q01","pk":"104_science","ans":"C"},{"id":"104-science-2","y":"104","n":2,"img":"104_science_q02","pk":"104_science","ans":"A"},{"id":"104-science-3","y":"104","n":3,"img":"104_science_q03","pk":"104_science","ans":"C"},{"id":"104-science-4","y":"104","n":4,"img":"104_science_q04","pk":"104_science","ans":"B"},{"id":"104-science-5","y":"104","n":5,"img":"104_science_q05","pk":"104_science","ans":"B"},{"id":"104-science-6","y":"104","n":6,"img":"104_science_q06","pk":"104_science","ans":"D"},{"id":"104-science-7","y":"104","n":7,"img":"104_science_q07","pk":"104_science","ans":"B"},{"id":"104-science-8","y":"104","n":8,"img":"104_science_q08","pk":"104_science","ans":"A"},{"id":"104-science-9","y":"104","n":9,"img":"104_science_q09","pk":"104_science","ans":"C"},{"id":"104-science-10","y":"104","n":10,"img":"104_science_q10","pk":"104_science","ans":"C"},{"id":"104-science-11","y":"104","n":11,"img":"104_science_q11","pk":"104_science","ans":"A"},{"id":"104-science-12","y":"104","n":12,"img":"104_science_q12","pk":"104_science","ans":"C"},{"id":"104-science-13","y":"104","n":13,"img":"104_science_q13","pk":"104_science","ans":"B"},{"id":"104-science-14","y":"104","n":14
