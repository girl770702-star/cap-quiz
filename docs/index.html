"img":"107_math_q20","pk":"107_math","ans":"B","exp":"∠BEA＝60°，AB＝6√3，所以 AE＝6√3÷√3＝6。摺起後 A 落在 A'，EA'＝AE＝6，∠A'EB＝60°，所以 EA' 與 ED 夾角 ∠A'ED＝180°－60°－60°＝60°。A' 在 E 右邊的水平距離＝6×cos60°＝3，A' 離 AD 左端的水平位置為 AE＋3＝9，所以 AF＝BC－9＝13－9＝4。"},{"id":"107-math-21","y":"107","n":21,"img":"107_math_q21","pk":"107_math","ans":"A","exp":"L 是 y＝－2。與 y＝3x²＋a 相交：3x²＝－2－a，AB＝2 表示 x＝±1，所以 3＝－2－a，a＝－5。與 y＝－2x²＋b 相交：2x²＝b＋2，CD＝4 表示 x＝±2，所以 8＝b＋2，b＝6。a＋b＝1。"},{"id":"107-math-22","y":"107","n":22,"img":"107_math_q22","pk":"107_math","ans":"D","exp":"兩圓相切於 P，A、B 與 C、D 分別在過 P 的直線上，位置相對，所以 AC∥BD，△PAC～△PBD。因此 ∠PBD＝∠PAC，∠PDB＝∠PCA。△PAC 中 AP＝10＞CP＝9，大邊對大角，所以 ∠PCA＞∠PAC，也就是 ∠PDB＞∠PBD。(A)(B) 兩角其實相等，所以都錯。"},{"id":"107-math-23","y":"107","n":23,"img":"107_math_q23","pk":"107_math","ans":"B","exp":"設蘋果、芭樂、柳丁原本為 9k、7k、6k。柳丁沒用，仍是 6k，對應後來比例的 4 份，所以 1 份＝1.5k，後來蘋果 6 份＝9k，芭樂 3 份＝4.5k。蘋果的數量沒變，表示沒用蘋果；芭樂從 7k 剩 4.5k，用掉 2.5k，所以只使用芭樂。"},{"id":"107-math-24","y":"107","n":24,"img":"107_math_q24","pk":"107_math","ans":"D","exp":"DFGB 是平行四邊形（DE∥BC、FG∥AB），所以 DF＝BG＝4；同理 FEHC 是平行四邊形，FE＝HC＝5，因此 DE＝9。又 ∠FGH＝∠B、∠FHG＝∠C，所以 △FGH～△ABC，且 △ADE～△ABC。對應邊 DE：GH＝9：6＝3：2，面積比是平方，為 9：4。"},{"id":"107-math-25","y":"107","n":25,"img":"107_math_q25","pk":"107_math","ans":"C","exp":"設方形盒 x 元、圓形盒 y 元，錢為 M。3x＋7y＝M＋240，7x＋3y＝M－240。兩式相加得 10x＋10y＝2M，M＝5x＋5y；兩式相減得 4x－4y＝－480，y＝x＋120。所以 M＝5x＋5(x＋120)＝10x＋600，買 10 盒方形禮盒剩 600 元。"},{"id":"107-math-26","y":"107","n":26,"img":"107_math_q26","pk":"107_math","ans":"A","exp":"L 通過圓心 P 且垂直弦 AB，所以 L 是 AB 的中垂線，C 在 L 上，因此 CA＝CB。CB＝4－(－5)＝9，CA²＝a²＋5²＝81，a²＝56，a＝±2√14。圖中 A 在 x 軸負側，所以 a＝－2√14。"},{"id":"108-math-1","y":"108","n":1,"img":"108_math_q01","pk":"108_math","ans":"A"},{"id":"108-math-2","y":"108","n":2,"img":"108_math_q02","pk":"108_math","ans":"A"},{"id":"108-math-3","y":"108","n":3,"img":"108_math_q03","pk":"108_math","ans":"D"},{"id":"108-math-4","y":"108","n":4,"img":"108_math_q04","pk":"108_math","ans":"C","exp":"圖（三）是把 4 個三角柱拼成一個大三角柱，底面是邊長變 2 倍的大正三角形，面積是 4a，上下兩個共 8a。三個側面都變成長和寬各 2 倍的長方形，面積各為 2b，共 6b。所以表面積為 8a＋6b。"},{"id":"108-math-5","y":"108","n":5,"img":"108_math_q05","pk":"108_math","ans":"B"},{"id":"108-math-6","y":"108","n":6,"img":"108_math_q06","pk":"108_math","ans":"C","exp":"430 萬瓩＝4300000 瓩＝4.3×10⁶ 瓩。1 瓩＝1 千瓦＝1000 瓦，所以要再乘以 10³，得 4.3×10⁶×10³＝4.3×10⁹ 瓦。"},{"id":"108-math-7","y":"108","n":7,"img":"108_math_q07","pk":"108_math","ans":"D"},{"id":"108-math-8","y":"108","n":8,"img":"108_math_q08","pk":"108_math","ans":"A","exp":"5x²＋17x－12 用十字交乘法分解成 (x＋4)(5x－3)，展開後確實是 5x²＋17x－12。所以 a＝4、c＝－3，a＋c＝1。"},{"id":"108-math-9","y":"108","n":9,"img":"108_math_q09","pk":"108_math","ans":"A"},{"id":"108-math-10","y":"108","n":10,"img":"108_math_q10","pk":"108_math","ans":"D","exp":"|d－5|＝|d－c| 表示 D 到 5 和到 c 的距離相等，所以 D 是 c 與 5 的中點。c 在 －5 與 0 之間，因此中點 d＝(c＋5)／2 會介於 0 與 2.5 之間，也就是在 O、B 之間。"},{"id":"108-math-11","y":"108","n":11,"img":"108_math_q11","pk":"108_math","ans":"C","exp":"虛線與底邊成 45°，所以梯形的高 8 等於斜邊在底邊上的水平長度 8。設左邊梯形的上底為 x，則下底為 x＋8；右邊梯形上底 20－x、下底 12－x。兩個梯形全等，較短底相等，x＝12－x，得 x＝6。"},{"id":"108-math-12","y":"108","n":12,"img":"108_math_q12","pk":"108_math","ans":"D","exp":"設買桂圓蛋糕 x 盒，金棗 (10－x) 盒。總花費 350x＋200(10－x)＝2000＋150x≦2500，得 x≦3 又 1／3。蛋糕數 12x＋6(10－x)＝60＋6x≧75，得 x≧2.5。所以 x＝3，花費 2000＋450＝2450 元。"},{"id":"108-math-13","y":"108","n":13,"img":"108_math_q13","pk":"108_math","ans":"D","exp":"E 是 D 對 AB 的對稱點，所以 ∠EAB＝∠DAB；F 是 D 對 AC 的對稱點，所以 ∠FAC＝∠DAC。因此 ∠EAF＝2(∠DAB＋∠DAC)＝2∠BAC。∠BAC＝180°－62°－51°＝67°，所以 ∠EAF＝134°。"},{"id":"108-math-14","y":"108","n":14,"img":"108_math_q14","pk":"108_math","ans":"D","exp":"每次抽完都放回，每一次抽球是互相獨立的，前面抽到什麼完全不影響第 53 次。所以第 53 次抽到紅球的機率就是 2／(53＋2)＝2／55。不要被「前 52 次抽到 1 次紅球」誤導。"},{"id":"108-math-15","y":"108","n":15,"img":"108_math_q15","pk":"108_math","ans":"C","exp":"AC＝BC，所以 ∠A＝∠B；AB 最長，所以 ∠C 最大，∠C＞∠B。外角 ∠1＝180°－∠B，∠2＝180°－∠C，因此 ∠1＞∠2，(A)(B) 錯。∠A＋∠2＝∠A＋180°－∠C，而 ∠A＜∠C，所以小於 180°。(D) 中 ∠A＋∠1＝180°＋∠A－∠B＝180°，不是大於 180°。"},{"id":"108-math-16","y":"108","n":16,"img":"108_math_q16","pk":"108_math","ans":"B","exp":"設咖啡豆每公克 p 元。小涵有自備容器：250p－5＝295，得 250p＝300，p＝300／250。阿嘉沒有自備容器，不用減 5 元，所以 y＝(300／250)x。"},{"id":"108-math-17","y":"108","n":17,"img":"108_math_q17","pk":"108_math","ans":"D","exp":"大三角形面積 14、底 7，所以高為 2×14÷7＝4。上方小三角形與大三角形相似，底 3 對 7，高為 4×3／7＝12／7。平行四邊形的高為 4－12／7＝16／7，底為 3，面積 3×16／7＝48／7。"},{"id":"108-math-18","y":"108","n":18,"img":"108_math_q18","pk":"108_math","ans":"B","exp":"摩天輪逆時針轉，圖中最高點的車廂往左移動，所以 21 號之後最高的是右邊的 22 號，依序為 23、24……。從 21 號到 9 號要經過 22 到 36 再到 1 到 9，共 24 個車廂間隔。36 個間隔轉一圈 30 分鐘，24 個間隔需要 30×24／36＝20 分鐘。"},{"id":"108-math-19","y":"108","n":19,"img":"108_math_q19","pk":"108_math","ans":"D","exp":"內切圓的切線長相等：BD＝BE＝1，CE＝CF＝4，設 AD＝AF＝x。則 AB＝x＋1，BC＝5，AC＝x＋4。直角三角形用畢氏定理：(x＋1)²＋5²＝(x＋4)²，化簡 2x＋26＝8x＋16，得 x＝5／3。"},{"id":"108-math-20","y":"108","n":20,"img":"108_math_q20","pk":"108_math","ans":"A","exp":"去程 15 人、回程 10 人共搭 25 人次纜車。設來回都搭的有 p 人，只搭單程的有 s 人，則 2p＋s＝25、300p＋200s＝4100。代入得 300p＋200(25－2p)＝4100，p＝9，s＝7，總人數 9＋7＝16。"},{"id":"108-math-21","y":"108","n":21,"img":"108_math_q21","pk":"108_math","ans":"A"},{"id":"108-math-22","y":"108","n":22,"img":"108_math_q22","pk":"108_math","ans":"C","exp":"a 與 420 的最大公因數是 35，420＝2²×3×5×7，所以 a 含有 5 和 7，但不能再含 2、3 的因數。20＝2²×5，若 20 是 a 的因數，a 會有因數 2，最大公因數會多出 2，不可能。25 可以，例如 a＝175，與 420 的最大公因數仍是 35。"},{"id":"108-math-23","y":"108","n":23,"img":"108_math_q23","pk":"108_math","ans":"C","exp":"旋轉後的三角形與原來全等，I 與 I′ 到直線 L 的距離都等於內切圓半徑，所以 II′ 平行 L。IC 與 L 的夾角是 ∠C 的一半，I′A′ 與 L 的夾角是 ∠A 的一半，要平行需 ∠A＝∠C，但 ∠A＜∠C，所以不平行。"},{"id":"108-math-24","y":"108","n":24,"img":"108_math_q24","pk":"108_math","ans":"B","exp":"AD 是直徑，AB＝BD＝90°，BC＝CD＝45°。∠APQ＝130° 所對的弧是不含 P 的那段 AQ，其度數為 260°，也就是 180°（A 經下方到 D）再加上 DQ，所以 DQ＝80°。因為 CD 只有 45°，Q 會越過 C 落在 BC 上，BQ＝90°－80°＝10°，QC＝45°－10°＝35°，所以 BQ＜QC。"},{"id":"108-math-25","y":"108","n":25,"img":"108_math_q25","pk":"108_math","ans":"A"},{"id":"108-math-26","y":"108","n":26,"img":"108_math_q26","pk":"108_math","ans":"B","exp":"A 是頂點，B、C 在 y＝2 上且 △ABC 為正三角形，所以高為 2，邊長為 4／√3，C 的橫坐標比 A 多 2／√3。設 y＝a(x＋3)²，代入 C 得 2＝a×(2／√3)²＝4a／3，a＝3／2。令 x＝0，y＝3／2×9＝27／2。"},{"id":"109-math-1","y":"109","n": math","ans":"D","exp":"P 到 AD 的距離是 AB 的一半，即 1，Q 與 P 對稱於 AD，所以 Q 在 AD 的垂直平分線上、距 AD 為 1。AD 一半是 2，QA＝√(2²＋1²)＝√5，QD、RB、RC 同理也是 √5。周長＝AB＋CD＋4√5＝2＋2＋4√5＝4＋4√5。"},{"id":"109-math-18","y":"109","n":18,"img":"109_math_q18","pk":"109_math","ans":"A","exp":"小麗進電梯後不能響，所以 x＋50≤300，得 x≤250。小歐再進去後響了，所以 x＋50＋70＞300，得 x＞180。合併為 180＜x≤250。注意第一個條件是「不響」，所以可以等於 300，不能漏掉。"},{"id":"109-math-19","y":"109","n":19,"img":"109_math_q19","pk":"109_math","ans":"B"},{"id":"109-math-20","y":"109","n":20,"img":"109_math_q20","pk":"109_math","ans":"A"},{"id":"109-math-21","y":"109","n":21,"img":"109_math_q21","pk":"109_math","ans":"C","exp":"圖形的對稱軸是 x＝－7，A、C 對稱於此軸，設 C 的橫坐標為 －7＋d、A 為 －7－d。B 在 y 軸上（x＝0），所以 BC＝d－7、AB＝7＋d。由 AB：BC＝5：1 得 7＋d＝5(d－7)，d＝10.5，所以 AC＝2d＝21。"},{"id":"109-math-22","y":"109","n":22,"img":"109_math_q22","pk":"109_math","ans":"B","exp":"正九邊形每個內角為 140°。∠APQ 的外角為 75°，所以 ∠BPQ＝75°。六邊形 PBCDEQ 內角和為 720°，其中 ∠B、∠C、∠D、∠E 各 140°，共 560°，所以 ∠BPQ＋∠PQE＝160°，∠PQE＝160°－75°＝85°。"},{"id":"109-math-23","y":"109","n":23,"img":"109_math_q23","pk":"109_math","ans":"D"},{"id":"109-math-24","y":"109","n":24,"img":"109_math_q24","pk":"109_math","ans":"D","exp":"沿平行 BC 剪下的小三角形與 △ABC 相似，面積比 1：3，所以邊長比 1：√3，即 AP＝AB×(1/√3)≈0.577AB。D 在 1/3≈0.333、F 在 1/2、E 在 2/3≈0.667，0.577 介於 F 與 E 之間。"},{"id":"109-math-25","y":"109","n":25,"img":"109_math_q25","pk":"109_math","ans":"B","exp":"免費的是這 5 個蛋糕中最便宜的一個，設其價格為 m，則 y＝x＋55－m。因為 5 個裡面一定有 55 元的黑櫻桃，m 只可能是 40、45 或 55，對應 y＝x＋15、x＋10、x。y＝x＋5 要 m＝50，菜單上沒有，所以不可能。"},{"id":"109-math-26","y":"109","n":26,"img":"109_math_q26","pk":"109_math","ans":"A","exp":"甲：BP⊥AC，所以 ∠APB＝90°，AB 是直角三角形的斜邊，斜邊中點 O 就是外心，正確。乙：O 為圓心、OA 為半徑畫弧，P 滿足 OP＝OA＝OB，O 到 △ABP 三頂點等距，所以 O 是外心，也正確。"},{"id":"110-math-1","y":"110","n":1,"img":"110_math_q01","pk":"110_math","ans":"A"},{"id":"110-math-2","y":"110","n":2,"img":"110_math_q02","pk":"110_math","ans":"B"},{"id":"110-math-3","y":"110","n":3,"img":"110_math_q03","pk":"110_math","ans":"D"},{"id":"110-math-4","y":"110","n":4,"img":"110_math_q04","pk":"110_math","an :10,"img":"105_social_q10","pk":"105_social","ans":"A"},{"id":"105-social-11","y":"105","n":11,"img":"105_social_q11","pk":"105_social","ans":"A","exp":"清朝中葉以後，鴉片戰爭的南京條約開放五口通商，英法聯軍後的天津條約、北京條約又允許傳教士到內地傳教。傳教範圍擴大，是因為清朝陸續簽訂條約。(B)太平天國與傳教士活動範圍的法律規定無直接關係；(C)門戶開放政策是美國的主張，並非清朝開放傳教。"},{"id":"105-social-12","y":"105","n":12,"img":"105_social_q12","pk":"105_social","ans":"D","exp":"小韓還在偵查階段，尚未經過法院判決，卻已被旁人當成犯人，這違反「無罪推定」，也就是法官判決有罪確定之前，應視為無罪。(C)是「罪刑法定」原則，說的是法律沒有規定的行為不能處罰，與題意不同；(A)是告訴乃論之罪的規定。"},{"id":"105-social-13","y":"105","n":13,"img":"105_social_q13","pk":"105_social","ans":"B","exp":"專屬經濟區是從海岸基線起算200浬，不屬於任何國家專屬經濟區的海域才是可自由捕魚的公海。圖中甲、丁在X國範圍內，丙在Y國範圍內，只有乙在兩個圓之外。"},{"id":"105-social-14","y":"105","n":14,"img":"105_social_q14","pk":"105_social","ans":"B","exp":"機會成本是做選擇時放棄的最高價值選項。甲的機會成本是丙的薪資，表示甲高於丙；乙、丙的機會成本都是甲，表示甲最高；乙被放棄的最佳選項是甲，而甲被放棄的最佳選項是丙，可知丙又高於乙，所以由高到低是甲、丙、乙。"},{"id":"105-social-15","y":"105","n":15,"img":"105_social_q15","pk":"105_social","ans":"C","exp":"對行政機關的罰緩處分不服，要先提出訴願，由原處分機關的上級機關審查；訴願被駁回仍不服，才能向高等行政法院提起行政訴訟。(D)是訴願之後的下一步；(B)上訴是民事、刑事案件的程序；(A)請願只是向政府表達意見，不是救濟程序。"},{"id":"105-social-16","y":"105","n":16,"img":"105_social_q16","pk":"105_social","ans":"B"},{"id":"105-social-17","y":"105","n":17,"img":"105_social_q17","pk":"105_social","ans":"D"},{"id":"105-social-18","y":"105","n":18,"img":"105_social_q18","pk":"105_social","ans":"D"},{"id":"105-social-19","y":"105","n":19,"img":"105_social_q19","pk":"105_social","ans":"A","exp":"表中冰河消退、珊瑚白化、棲息地減少等，都是全球暖化的影響。暖化使冰川融化、海水膨脹，海平面上升，會淹沒沿海低窪地區。(C)地層下陷主要是超抽地下水造成；(B)冰融化反而使海水鹽度下降。"},{"id":"105-social-20","y":"105","n":20,"img":"105_social_q20","pk":"105_social","ans":"C","exp":"臺灣東方的洋流是黑潮，是由南向北流的暖流，流經臺灣東岸後往東北方向，會經過日本的琉球群島附近。(A)海南島在西南方；(B)爪哇島、(D)呂宋島在南方，都在黑潮的上游，不是漂流木會到達的方向。"},{"id":"105-social-21","y":"105","n":21,"img":"105_social_q21","pk":"105_social","ans":"C","exp":"全球多數國家人口集中在低地，但熱帶（23.5°N～23.5°S）的低地又濕又熱，容易有疾病，高地氣候涼爽舒適，反而人口較稠密，所以與多數國家相反。(A)(B)(D)緯度較高，低地氣候溫和，仍是低地較稠密。"},{"id":"105-social-22","y":"105","n":22,"img":"105_social_q22","pk":"105_social","ans":"D","exp":"臺灣河川坡陡流急，雨季（夏秋）水量大、枯水期（冬春）水量很小，是荒溪型河川。冬春水淺可架簡易竹橋，夏秋水量暴漲會沖毀竹橋，只能改用渡船。(A)(B)並不是造成冬夏過溪方式不同的原因。"},{"id":"105-social-23","y":"105","n":23,"img":"105_social_q23","pk":"105_social","ans":"B"},{"id":"105-social-24","y":"105","n":24,"img":"105_social_q24","pk":"105_social","ans":"D"},{"id":"105-social-25","y":"105","n":25,"img":"105_social_q25","pk":"105_social","ans":"D"},{"id":"105-social-26","y":"105","n":26,"img":"105_social_q26","pk":"105_social","ans":"D","exp":"安納托力亞高原是現今土耳其的位置，十三世紀興起、十六世紀控制巴爾幹半島，第一次世界大戰戰敗而瓦解，都符合鄂圖曼土耳其帝國。(B)拜占庭帝國在1453年就被鄂圖曼滅亡；(C)神聖羅馬帝國在德意志地區；(A)奧匈帝國也在一戰後瓦解，但不是興起於安納托力亞。"},{"id":"105-social-27","y":"105","n":27,"img":"105_social_q27","pk":"105_social","ans":"A","exp":"題目描述的是清領時期臺灣與福建、華中、華北等地的貿易，負責運銷稻米、糖的商人所組成的組織是「郊」，即行郊。(B)洋行是外國商人的商號；(C)市舶司是宋、明管理海外貿易的官署；(D)總理衙門是清朝處理外交事務的官署，都不是商人自行組成。"},{"id":"105-social-28","y":"105","n":28,"img":"105_social_q28","pk":"105_social","ans":"D"},{"id":"105-social-29","y":"105","n":29,"img":"105_social_q29","pk":"105_social","ans":"C","exp":"乙是自由權，投書媒體評論政府政策屬於言論自由。(A)報考公職人員考試是應考試權，屬於參政權；(B)提供職業訓練管道是受益權；(D)禁止性別差異而同工不同酬，屬於平等權。"},{"id":"105-social-30","y":"105","n":30,"img":"105_social_q30","pk":"105_social","ans":"D","exp":"判處死刑是法官的權責，檢察官負責偵查與起訴，所以「檢察官作出死刑判決」是錯的。(A)十三歲觸法可移送少年法院；(B)罰緩是行政機關處罰；(C)監察院對行政機關提出糾正，都是正確的。"},{"id":"105-social-31","y":"105","n":31,"img":"105_social_q31","pk":"105_social","ans":"C","exp":"需求法則是指價格下降時，需求量會增加。丙的「憑票根免費搭回程」等於是降低船票的實質價格，吸引更多人搭乘，運用了需求法則。(B)提升設備品質，是靠品質吸引旅客，不是價格與數量的關係；(A)(D)強調的是安全。"},{"id":"105-social-32","y":"105","n":32,"img":"105_social_q32","pk":"105_social","ans":"C","exp":"民間基金會捐款做公益，是企業主動負起回饋社會的社會責任。(A)地方自治組織是政府機關；(B)集會遊行法規範的是集會、遊行活動；(D)職業團體是依職業組成（如工會），基金會是公益性質的民間團體。"},{"id":"105-social-33","y":"105","n":33,"img":"105_social_q33","pk":"105_social","ans":"D","exp":"調解主要用在民事案件，也可用在部分告訴乃論的刑事案件，所以可調解的案件數至少是民事的145件，最多是民事加刑事的187件，只有162件落在範圍內。公訴屬於刑事案件，不可能超過刑事案件總數42件，(A)(B)都不合理；(C)126件比民事案件還少，也不合理。"},{"id":"105-social-34","y":"105","n":34,"img":"105_social_q34","pk":"105_social","ans":"B","exp":"I代表東北風、III代表西南風。表中冬季盛行東北風（約72%）、夏季盛行西南風，這是東北季風與西南季風的特色，符合臺灣北部。(A)英國西部、(D)義大利南部冬季多吹西風；(C)中國東北部冬季吹西北風。"},{"id":"105-social-35","y":"105","n":35,"img":"105_social_q35","pk":"105_social","ans":"A","exp":"北京位於內陸，沒有海運或河運，只有鐵路與公路交會，屬於甲類。重慶位於長江上游，沒有出海口，屬丙類；大連是港口，沒有大河，屬乙類；上海有長江河運和海運，屬丁類，所以只有(A)正確。"},{"id":"105-social-36","y":"105","n":36,"img":"105_social_q36","pk":"105_social","ans":"A","exp":"南半球的12～2月是夏季，乾季的遊客最多，表示當地夏季乾燥，這是地中海型氣候，位於南半球的澳洲西南部符合。(C)(D)法國地中海沿岸、美國西北部沿岸雖也是夏乾，但在北半球，夏季是6～8月；(B)彭巴草原沒有明顯乾季。"},{"id":"105-social-37","y":"105","n":37,"img":"105_social_q37","pk":"105_social","ans":"A","exp":"俄羅斯、北韓邊界、資源型城市轉型、老工業基地升級，指的是中國東北地區的振興計畫。東北有黑龍江的三江平原等，是重要糧食產區，因此會改善農地排水、增加糧食生產。(B)南水北調針對華北缺水；(C)中亞貿易是西北地區；(D)三峽大壩在長江中游。"},{"id":"105-social-38","y":"105","n":38,"img":"105_social_q38","pk":"105_social","ans":"C","exp":"版圖遼闊、民族複雜，曾遠征西亞、歐洲，並帶回波斯、俄羅斯與東歐人士，是蒙古人建立的元朝，色目人眾多。(B)唐朝版圖雖大，但沒有遠征到歐洲；(A)漢朝、(D)清朝都沒有大規模西征歐洲的經歷。"},{"id":"105-social-39","y":"105","n":39,"img":"105_social_q39","pk":"105_social","ans":"C"},{"id":"105-social-40","y":"105","n":40,"img":"105_social_q40","pk":"105_social","ans":"C","exp":"乙場景是1874年日本出兵臺灣（牡丹社事件），丁場景是清廷在北京專約中承認日本出兵為保民義舉。中間應是清廷得知後派沈葆楨來臺加強防務，所以丙是(C)。(A)淡水、基隆為戰場是清法戰爭；(B)原住民在南投抗日是日治時期的霧社事件。"},{"id":"105-social-41","y":"105","n":41,"img":"105_social_q41","pk":"105_social","ans":"A"},{"id":"105-social-42","y":"105","n":42,"img":"105_social_q42","pk":"105_social","ans":"D","exp":"甲是總統，乙是立法院（同意大法官人選的機關）。立法院可以對行政院長提出不信任案。(A)覆議是立法院通過法案後，由行政院提出；(B)質詢是立法委員對行政院官員提出，不是對總統；(C)解釋法律命令是大法官的職權。"},{"id":"105-social-43","y":"105","n":43,"img":"105_social_q43","pk":"105_social","ans":"C"},{"id":"105-social-44","y":"105","n":44,"img":"105_social_q44","pk":"105_social","ans":"D","exp":"各國前三大黨席次合計超過95%，若第三大黨只有2%（丙），代表只有兩個大黨，是兩黨制；丁的第二大黨47%更接近兩黨制，而丁的第三大黨有31%，表示有三個勢力相近的大黨，最傾向多黨制。"},{"id":"105-social-45","y":"105","n":45,"img":"105_social_q45","pk":"105_social","ans":"C","exp":"小岩生產饅頭的機會成本是40/50＝0.8個包子，小太是甲/40，小岩在饅頭有比較利益，表示0.8＜甲/40，甲＞32。小冬生產包子的機會成本是1個饅頭，小太是40/甲，小冬在包子有比較利益，表示1＜40/甲，甲＜40。所以甲介於32到40之間，只有35符合。"},{"id":"105-social-46","y":"105","n":46,"img":"105_social_q46","pk":"105_social","ans":"B"},{"id":"105-social-47","y":"105","n":47,"img":"105_social_q47","pk":"105_social","ans":"B"},{"id":"105-social-48","y":"105","n":48,"img":"105_social_q48","pk":"105_social","ans":"A","exp":"小周的例子說的是文字從隸書、楷書逐漸演變成今日文字，是文化會不斷累積、改變的特性，不是不同地區文化的差異性，所以舉例不適當。(B)世界各地都有團圓習俗，是普遍性；(C)交通法規規定繫安全帶，是制約性；(D)交通工具越來越進步，是累積性。"},{"id":"105-social-49","y":"105","n":49,"img":"105_social_q49","pk":"105_social","ans":"B","exp":"1991到2010年臺灣成衣出口值持續下降，主要是國內工資、土地等生產成本提高，業者把工廠外移到成本較低的國家。(A)加入世貿組織通常有助於出口；(D)成衣附加價值提升不會使出口值連年下降。"},{"id":"105-social-50","y":"105","n":50,"img":"105_social_q50","pk":"105_social","ans":"C"},{"id":"105-social-51","y":"105","n":51,"img":"105_social_q51","pk":"105_social","ans":"D"},{"id":"105-social-52","y":"105","n":52,"img":"105_social_q52","pk":"105_social","ans":"C","exp":"法幣政策是1935年國民政府統一幣制，由中央、中國、交通三家銀行發行，此時北伐統一已完成，政府致力於各項建設，屬於南京政府時期。(D)抗戰後期是為了軍費才大量發鈔，與題中改善幣制混亂的情況不同；(A)(B)是清末的事。"},{"id":"105-social-53","y":"105","n":53,"img":"105_social_q53","pk":"105_social","ans":"B","exp":"全國的幼年人口、老年人口比例的變化是幼年下降、老年上升，上海則是老年人口下降、勞動人口（15～64歲）上升，原因是上海經濟發達、就業機會多，吸引大量外地年輕勞動人口遷入，使得老年人口比例反而下降。"},{"id":"105-social-54","y":"105","n":54,"img":"105_social_q54","pk":"105_social","ans":"B","exp":"十六世紀西班牙人在印加帝國神廟上建教堂，印加帝國的中心是庫斯科，位於現今的秘魯。(D)墨西哥是阿茲特克文明，(A)古巴、(C)巴西不是印加帝國的範圍（巴西主要是葡萄牙殖民）。"},{"id":"105-social-55","y":"105","n":55,"img":"105_social_q55","pk":"105_social","ans":"C","exp":"這位臺南人1947年被徵召到華北參戰，被中國共產黨所俘，編入共軍；1950年代參加韓戰，成為聯合國軍（以美軍為主）的俘虜。所以先後被中國共產黨、美國所俘。(A)(B)日本與1947年的國共內戰無關；(D)北韓是共軍的盟友，不會俘虜共軍。"},{"id":"105-social-56","y":"105","n":56,"img":"105_social_q56","pk":"105_social","ans":"B","pimg":"105_social_p56","grp":"105-social-56～58"},{"id":"105-social-57","y":"105","n":57,"img":"105_social_q57","pk":"105_social","ans":"D","pimg":"105_social_p56","grp":"105-social-56～58"},{"id":"105-social-58","y":"105","n":58,"img":"105_social_q58","pk":"105_social","ans":"A","pimg":"105_social_p56","grp":"105-social-56～58","exp":"卡達人口少，大量外籍勞工移入，所以社會增加率為正且很高，外籍勞工多為青壯年，所以老年人口比例很低，只有甲符合。乙是德國（自然增加率為負、老年人口多）；丙是墨西哥（社會增加率為負，人口外移）；丁是埃及（自然增加率高但社會增加率接近0）。"},{"id":"105-social-59","y":"105","n":59,"img":"105_social_q59","pk":"105_social","ans":"B","pimg":"105_social_p59","grp":"105-social-59～60","exp":"皮雷茨基是波蘭人，納粹在波蘭境內設集中營，波蘭位於德國東邊，圖中乙位於德國東方的波蘭一帶。(A)甲在俄羅斯；(C)丙是西班牙；(D)丁是英國，都不是題中被攻陷的祖國波蘭。"},{"id":"105-social-60","y":"105","n":60,"img":"105_social_q60","pk":"105_social","ans":"B","pimg":"105_social_p59","grp":"105-social-59～60","exp":"皮雷茨基因反對當時由蘇聯操控的共產政權而被處死，直到1990年代才平反，這與1989年後東歐共產政權瓦解有關。(A)法西斯在二戰後已衰微，與1990年代平反無關；(D)歐洲經濟共同體是1950年代建立。"},{"id":"105-social-61","y":"105","n":61,"img":"105_social_q61","pk":"105_social","ans":"C","pimg":"105_social_p61","grp":"105-social-61～63","exp":"連任六屆的職務沒有任期限制才有可能，縣議員可連選連任。(A)鎮長、(B)市長都最多連任一次；(D)臺灣省諮議員不是民選，且省已虛級化。"},{"id":"105-social-62","y":"105","n":62,"img":"105_social_q62","pk":"105_social","ans":"D","pimg":"105_social_p61","grp":"105-social-61～63","exp":"主角提出補助育兒津貼、營造優質育嬰環境，是為了鼓勵生育，因應生育率持續下降（少子化）的問題。(B)性別比例失衡要處理的是性別問題；(C)死亡率上升與育兒政策無關。"},{"id":"105-social-63","y":"105","n":63,"img":"105_social_q63","pk":"105_social","ans":"C","pimg":"105_social_p61","grp":"105-social-61～63","exp":"主角從只想教書，到發現自己對政治有熱忱，並以完成父親理想、成為傑出政治人物而自豪，是追求自我實現的過程，可用需求層次理論解釋。(B)需求法則是價格與需求量的關係；(A)(D)社會主義、社會達爾文主義與個人心路歷程無關。"},{"id":"106-social-1","y":"106","n":1,"img":"106_social_q01","pk":"106_social","ans":"B"},{"id":"106-social-2","y":"106","n":2,"img":"106_social_q02","pk":"106_social","ans":"A","exp":"馬拉松路線在臺灣北海岸，這一帶是岩岸，海岸線曲折，岬角與海灣相間。(B)潟湖、沙洲多見於西南沿海；(C)珊瑚礁見於南部恆春半島一帶；(D)峭壁、峽谷是東部太魯閣等地的景觀。"},{"id":"106-social-3","y":"106","n":3,"img":"106_social_q03","pk":"106_social","ans":"B"},{"id":"106-social-4","y":"106","n":4,"img":"106_social_q04","pk":"106_social","ans":"C","exp":"圖中北部與東北部雨量最多，中部山區次之，西南平地雨量很少，這是冬季東北季風迎風面北部、東北部多雨的分布。(A)對流雨、(D)颱風多在夏季，雨量會集中在南部與山區；(B)滯留鋒雨是春夏之交（梅雨）的現象。"},{"id":"106-social-5","y":"106","n":5,"img":"106_social_q05","pk":"106_social","ans":"B","exp":"國土四分之一在北極圈內、有冰蝕湖，位於北歐，旗子是白底藍十字，是芬蘭。(A)丹麥國旗是紅底白十字；(C)瑞士不在北歐；(D)俄羅斯不是北歐國家，國旗也不是十字旗。"},{"id":"106-social-6","y":"106","n":6,"img":"106_social_q06","pk":"106_social","ans":"D","exp":"文中的街庄、保甲都是日治時期的地方制度，且藉學校教育與報章雜誌宣導衛生，是日本統治時期政府與民間推廣公共衛生觀念。(A)(C)(B)的時期或做法，都沒有街庄與保甲制度。"},{"id":"106-social-7","y":"106","n":7,"img":"106_social_q07","pk":"106_social","ans":"C","exp":"圖中說明是從唐朝到明朝在港口設置的官方機構，負責管船隻出入港並收稅、發許可證，這是市舶司。(A)郊與(B)公行是民間商人組織；(D)總理各國事務衙門是清末處理外交的官署。"},{"id":"106-social-8","y":"106","n":8,"img":"106_social_q08","pk":"106_social","ans":"C","exp":"左宗棠、曾國藩等人是漢人，靠湘軍起家。清朝為了鎮壓太平天國，倚重湘軍，讓他們得以出任總督、巡撫。(A)(B)(D)與湘軍崛起並無直接關係。"},{"id":"106-social-9","y":"106","n":9,"img":"106_social_q09","pk":"106_social","ans":"D","exp":"有基督教、伊斯蘭教與佛教並存，又任用色目人（來自西亞、中亞的人）當財政官員，還推行全國性紙幣，是元代的特色，所以是大都。(A)(B)(C)的朝代雖也有外來宗教，但沒有以色目人理財、全國通行紙幣的做法。"},{"id":"106-social-10","y":"106","n":10,"img":"106_social_q10","pk":"106_social","ans":"A","exp":"圖中文字提到割讓臺灣及澎湖、總督坐鎮臺北、對方占據臺南，是1895年日本接收臺灣後，勸在臺南的劉永福投降的文件。(B)戰帖應是清法戰爭時期；(C)牡丹社事件是1874年，當時日本尚未統治臺灣；(D)臺灣民主國早已瓦解。"},{"id":"106-social-11","y":"106","n":11,"img":"106_social_q11","pk":"106_social","ans":"B","exp":"在外國大學介紹臺灣美食和風俗，是讓各國學生互相認識、了解不同文化，目的在文化交流。(A)官方外交是政府之間的往來，這是學生活動；(D)文化融合是不同文化合而為一，介紹特色並不等於融合。"},{"id":"106-social-12","y":"106","n":12,"img":"106_social_q12","pk":"106_social","ans":"D","exp":"13歲屬於未滿14歲，刑法規定不罰，但依少年事件處理法，可由法院交付保護處分，如假日生活輔導。(A)(C)罰鍰、罰金和(B)拘役都是對成年人的處罰，不適用於未滿14歲的人。"},{"id":"106-social-13","y":"106","n":13,"img":"106_social_q13","pk":"106_social","ans":"C"},{"id":"106-social-14","y":"106","n":14,"img":"106_social_q14","pk":"106_social","ans":"B"},{"id":"106-social-15","y":"106","n":15,"img":"106_social_q15","pk":"106_social","ans":"C"},{"id":"106-social-16","y":"106","n":16,"img":"106_social_q16","pk":"106_social","ans":"C","exp":"從頭道拐的5.03，經過黃土高原到龍門，含沙量大增到27.6，是因為河水流經黃土高原，沖刷鬆軟的黃土而帶入大量泥沙。(A)河床高於地面是下游地上河的特徵；(B)水庫會讓含沙量下降；(D)斷流與含沙量增加無關。"},{"id":"106-social-17","y":"106","n":17,"img":"106_social_q17","pk":"106_social","ans":"C","exp":"表中目標是推動西部大開發、加強與中亞貿易、利於歐亞經濟整合，這需要橫貫新疆通往中亞的聯外鐵路。(A)(B)是能源與水資源調配，(D)青藏鐵路是連接西藏，都不是通往中亞的貿易路線。"},{"id":"106-social-18","y":"106","n":18,"img":"106_social_q18","pk":"106_social","ans":"B","exp":"稻作面積長期減少，除了國人吃米變少，也與政府推動休耕、獎勵轉作等政策輔導農業轉型有關。(A)糧價升高會鼓勵種稻；(C)機械化主要影響人力，不一定減少面積；(D)單位面積產量不是面積減少的主因。"},{"id":"106-social-19","y":"106","n":19,"img":"106_social_q19","pk":"106_social","ans":"B","exp":"表中國家是吐瓦魯，由低平的珊瑚礁島組成，平均高度僅2到3公尺。全球暖化使海平面上升，海水倒灌、淹水頻繁，國土逐漸縮小。(C)土石流需要高山陡坡；(D)沙漠化與乾旱和該國位置、地形不符。"},{"id":"106-social-20","y":"106","n":20,"img":"106_social_q20","pk":"106_social","ans":"C","exp":"文中溫度高的泉水、濃烈硫磺味與沸騰聲，是火山地形的特徵，宜蘭外海的龜山島是火山島，有硫磺噴氣與溫泉。(A)東沙島、(B)琉球嶼是珊瑚礁島；(D)金門以花崗岩為主，皆沒有火山噴氣。"},{"id":"106-social-21","y":"106","n":21,"img":"106_social_q21","pk":"106_social","ans":"B"},{"id":"106-social-22","y":"106","n":22,"img":"106_social_q22","pk":"106_social","ans":"D"},{"id":"106-social-23","y":"106","n":23,"img":"106_social_q23","pk":"106_social","ans":"A","exp":"起源於十四世紀的義大利、再向西北歐傳播，是文藝復興，內涵是研究古典文獻、強調人文主義。(B)宗教改革起於德國；(C)議會政治興起於英國；(D)工廠制度出現於工業革命，時間與地點都不符。"},{"id":"106-social-24","y":"106","n":24,"img":"106_social_q24","pk":"106_social","ans":"D","exp":"歐洲人來東亞通商傳教、日本鎖國、東北民族（滿人）建立清朝，是十七世紀中期的背景。雙底線的反抗勢力是鄭成功家族，清朝因此實施海禁。(A)(B)(C)分別發生在1895年、1721年與1652年，反抗者不是海禁的對象或時間不符。"},{"id":"106-social-25","y":"106","n":25,"img":"106_social_q25","pk":"106_social","ans":"C"},{"id":"106-social-26","y":"106","n":26,"img":"106_social_q26","pk":"106_social","ans":"B","exp":"流程是立法院表決通過後公告半年，再由公民投票複決，這是憲法修正案的程序（立法院提案、表決通過，公告半年後交付公民複決）。(A)(C)只需立法院或行政院按一般程序處理；(D)彈劾案由立法院提出、司法院大法官審理，不是公民複決。"},{"id":"106-social-27","y":"106","n":27,"img":"106_social_q27","pk":"106_social","ans":"D","exp":"我國採屬人主義，父母任一方具有中華民國國籍，子女出生時即有國籍。縣議員必須是中華民國國民，所以小瑋的父親是國民，小瑋出生就有國籍。(A)只知道出生地是美國；(B)還沒歸化成功；(C)父母是日本人，雖在臺灣出生仍不是自動取得。"},{"id":"106-social-28","y":"106","n":28,"img":"106_social_q28","pk":"106_social","ans":"B","exp":"小江先在甲、乙之間選甲，代表甲>乙。再加入丙後仍選甲，但機會成本提高，表示放棄的丙薪資比乙高，且仍低於甲，所以是甲>丙>乙。機會成本是放棄的選項中價值最高的那一個。"},{"id":"106-social-29","y":"106","n":29,"img":"106_social_q29","pk":"106_social","ans":"D","exp":"當監察委員通過彈劾案後，才交由審理，且無法主動審議，是公務員懲戒委員會（現為懲戒法院）的職權。(A)審計部管審核財務收支；(B)法務部是行政機關；(C)高等行政法院審理行政訴訟，不處理彈劾案件。"},{"id":"106-social-30","y":"106","n":30,"img":"106_social_q30","pk":"106_social","ans":"D","exp":"公共造產是政府自己經營事業，以收費方式增加收入。丁增設漁產觀光市場並向使用者收費，屬於公共造產。(甲)是租稅收入；(乙)是中央補助款；(丙)是行銷城市，不是政府經營事業。"},{"id":"106-social-31","y":"106","n":31,"img":"106_social_q31","pk":"106_social","ans":"A","exp":"100公斤原料只能做出10公斤產品，製成後變輕，運原料不划算，工廠應設在接近原料產地，以降低運輸成本。(乙)原料製成後體積變大，應近市場；(丙)易破碎、(丁)易腐敗，都應靠近市場，減少運送損耗。"},{"id":"106-social-32","y":"106","n":32,"img":"106_social_q32","pk":"106_social","ans":"B","exp":"圖中旅遊人次高峰多在每年1月前後，冬季人最多，代表是避寒勝地，海南省氣候溫暖，適合冬季避寒。山東省、黑龍江省與西藏自治區多半在夏季氣候涼爽時遊客較多，與圖中趨勢相反。"},{"id":"106-social-33","y":"106","n":33,"img":"106_social_q33","pk":"106_social","ans":"A"},{"id":"106-social-34","y":"106","n":34,"img":"106_social_q34","pk":"106_social","ans":"C"},{"id":"106-social-35","y":"106","n":35,"img":"106_social_q35","pk":"106_social","ans":"A","exp":"甲是巴拿馬運河，乙是蘇伊士運河。中國往巴西，經巴拿馬運河由太平洋進入大西洋最近。(B)往南非不必經過蘇伊士運河；(C)往義大利走蘇伊士運河較近；(D)沙烏地阿拉伯可由印度洋直接前往，不必繞經蘇伊士運河。"},{"id":"106-social-36","y":"106","n":36,"img":"106_social_q36","pk":"106_social","ans":"B","exp":"亞非國家強調獨立自主，不依附美、蘇兩大陣營，是第三世界興起的表現。(A)聯合國成立於1945年；(C)共產世界瓦解是1990年前後；(D)九一一事件發生在2001年，時間都不符。"},{"id":"106-social-37","y":"106","n":37,"img":"106_social_q37","pk":"106_social","ans":"D","exp":"十八世紀清廷只在臺灣西部平原設官治理，東部（丁）還屬於化外之地，未設廳縣，因此引起外國人的覬覦。到了十九世紀後期牡丹社事件之後，清廷才開山撫番，積極經營東部。"},{"id":"106-social-38","y":"106","n":38,"img":"106_social_q38","pk":"106_social","ans":"C","exp":"越南當時是法國的殖民地，所以中越邊界的條約，是清廷與法國簽訂，由法屬越南官員查辦革命黨人。(A)日本當時在臺灣、朝鮮；(B)英國管理印度、緬甸；(D)美國的殖民地在菲律賓。"},{"id":"106-social-39","y":"106","n":39,"img":"106_social_q39","pk":"106_social","ans":"D","exp":"海報上有「滿洲建國以後」、「王道光明照亮大地」，滿洲國成立於1932年，所以最早也要在1932年以後。又瀋陽在滿洲國境內，因此是1932至1945年的瀋陽。(A)(B)的臺北不會出現滿洲國的宣傳；(C)時間早於滿洲國成立。"},{"id":"106-social-40","y":"106","n":40,"img":"106_social_q40","pk":"106_social","ans":"A","exp":"刑事案件的順序是：丙被起訴、乙地方法院（第一審）即將判決、丁判決後決定上訴、甲判決確定後想聲請再審來推翻原判決。所以順序是丙、乙、丁、甲。"},{"id":"106-social-41","y":"106","n":41,"img":"106_social_q41","pk":"106_social","ans":"C","exp":"雞排利潤是100×(50-30)=2000元。湯麵利潤要高於雞排，60×(50-甲)>2000，甲須小於約16.7，所以甲是15（20會得到1800，太低）。炒飯要最低，乙×40<2000，乙須小於50，所以乙是45（55會得到2200，太高）。"},{"id":"106-social-42","y":"106","n":42,"img":"106_social_q42","pk":"106_social","ans":"D"},{"id":"106-social-43","y":"106","n":43,"img":"106_social_q43","pk":"106_social","ans":"D"},{"id":"106-social-44","y":"106","n":44,"img":"106_social_q44","pk":"106_social","ans":"D","exp":"告訴乃論的刑事案件（40件）可以和解，加上民事事件（35件），共75件可聲請調解，所以(D)正確。(A)檢察官主動偵查的是非告訴乃論案件，共25件；(B)民事的35件不是都靠和解；(C)民事與刑事共100件才可由法院審理。"},{"id":"106-social-45","y":"106","n":45,"img":"106_social_q45","pk":"106_social","ans":"B"},{"id":"106-social-46","y":"106","n":46,"img":"106_social_q46","pk":"106_social","ans":"D","exp":"1月比7月暖，所以是南半球。全年平均氣溫25.4℃很高，雨量集中在1月（夏季），7月（冬季）幾乎不下雨，是明顯的乾濕季，屬於熱帶莽原。(C)雨林全年多雨；(A)地中海型氣候夏乾冬雨不符；(B)沙漠雨量更少。"},{"id":"106-social-47","y":"106","n":47,"img":"106_social_q47","pk":"106_social","ans":"C","exp":"觀光局請名人拍宣傳片，是想影響日本人的個人偏好，吸引他們來臺灣。日本人來臺人次減少，是因為新臺幣相對日幣升值，日本人換匯後在臺灣花費較貴，旅遊意願降低。(B)(D)貶值會讓日本人更樂意來臺。"},{"id":"106-social-48","y":"106","n":48,"img":"106_social_q48","pk":"106_social","ans":"C","exp":"陪伴商機是因為老年人口增加。甲的人口金字塔底部很窄、頂部很寬，是少子化與高齡化嚴重的型態，乙則是年輕與壯年人口多的型態，所以是由乙轉變成甲。"},{"id":"106-social-49","y":"106","n":49,"img":"106_social_q49","pk":"106_social","ans":"B"},{"id":"106-social-50","y":"106","n":50,"img":"106_social_q50","pk":"106_social","ans":"D","exp":"君王集大權、官員由君王任命、並以才學的平民取代世襲貴族，是戰國以後逐漸形成的君主集權與官僚制度，也就是中央集權的形成。(A)世族社會是官職多由大家族把持；(B)是諸侯各據一方；(C)君主立憲是近代的制度。"},{"id":"106-social-51","y":"106","n":51,"img":"106_social_q51","pk":"106_social","ans":"C","exp":"居民共同運用本地產品辦理料理競賽、形成海產市集，是社區發展的成果。(A)年輕人外出工作，代表當地推力大；(B)養殖漁業是第一級產業；(D)老人與幼童居多是隔代家庭，不是折衷家庭。"},{"id":"106-social-52","y":"106","n":52,"img":"106_social_q52","pk":"106_social","ans":"B","exp":"圖中死亡率在1960年前後突然大幅升高，這是大躍進失敗造成的大饑荒。(A)韓戰是1950年代初；(C)文化大革命從1966年開始；(D)六四天安門事件是1989年，都不在這段曲線的範圍。"},{"id":"106-social-53","y":"106","n":53,"img":"106_social_q53","pk":"106_social","ans":"A","exp":"亞歷山大在埃及建立亞歷山卓城，位置在尼羅河口的甲。(B)乙是羅馬，(C)丙是迦太基，(D)丁在伊比利半島，不是他興建的城市。"},{"id":"106-social-54","y":"106","n":54,"img":"106_social_q54","pk":"106_social","ans":"B","exp":"冷戰時受鄰近強國經濟制裁、靠蘇聯援助、以蔗糖為主的是古巴。蘇聯解體後援助中斷，糖業衰退，後來改以甘蔗渣發電。(A)巴西沒有受蘇聯援助；(C)北韓不是以蔗糖為主；(D)波蘭不是蔗糖國家。"},{"id":"106-social-55","y":"106","n":55,"img":"106_social_q55","pk":"106_social","ans":"C","exp":"仿效羅馬建城的是十六世紀的西班牙，征服墨西哥城、加勒比海與中美洲，並在當地建立有規則街道的城市。(A)神聖羅馬帝國在歐洲；(B)印加帝國在南美洲，是被西班牙征服；(D)十九世紀的美國沒有在這些地區殖民。"},{"id":"106-social-56","y":"106","n":56,"img":"106_social_q56","pk":"106_social","ans":"C","pimg":"106_social_p56","grp":"106-social-56～58","exp":"荷蘭從十七世紀以來長期殖民，並設有東印度公司的地方是印尼，爪哇島在丙。(A)甲是臺灣，(B)乙是菲律賓，(D)丁是中南半島，都不是荷蘭長期殖民的地方。"},{"id":"106-social-57","y":"106","n":57,"img":"106_social_q57","pk":"106_social","ans":"D","pimg":"106_social_p56","grp":"106-social-56～58","exp":"西班牙內戰時，佛朗哥的法西斯黨得到德國與義大利兩個極權統治國家的軍事援助。(C)蘇聯援助的是共和政府一方；(A)英美採取不介入政策；(B)日本與西班牙內戰沒有關係。"},{"id":"106-social-58","y":"106","n":58,"img":"106_social_q58","pk":"106_social","ans":"D","pimg":"106_social_p56","grp":"106-social-56～58","exp":"畢道文一生獻身革命，以超越種族與國籍的行動追求個人崇高的理想，符合馬斯洛需求層次中最高層的自我實現需求。生理、安全、尊重需求都是比較基本的需求。"},{"id":"106-social-59","y":"106","n":59,"img":"106_social_q59","pk":"106_social","ans":"C","pimg":"106_social_p59","grp":"106-social-59～60","exp":"電力坐標是用固定規則編出的一組編號，直接標示出準確位置，與地址一樣，屬於絕對位置。(A)(B)(D)是以另一地點為基準的方向或距離，是相對位置。"},{"id":"106-social-60","y":"106","n":60,"img":"106_social_q60","pk":"106_social","ans":"A","pimg":"106_social_p59","grp":"106-social-59～60"},{"id":"106-social-61","y":"106","n":61,"img":"106_social_q61","pk":"106_social","ans":"A","pimg":"106_social_p61","grp":"106-social-61～63","exp":"第一段說空拍機成為熱銷商品，是消費者對商品的需求增加，消費者先拿錢（貨幣）到商品市場購買，所以最先反應在消費者流向商品市場的貨幣，也就是甲。丁是商品市場的錢再流向生產者，反應較晚。"},{"id":"106-social-62","y":"106","n":62,"img":"106_social_q62","pk":"106_social","ans":"C","pimg":"106_social_p61","grp":"106-social-61～63","exp":"違反《民用航空法》被主管機關開罰，是行政罰，屬於行政責任。對行政處分不服，可提起訴願，再依程序提行政訴訟。(A)(B)刑事責任是犯罪由檢察官起訴；(D)請願是向政府機關陳述意見，不是權利救濟的方式。"},{"id":"106-social-63","y":"106","n":63,"img":"106_social_q63","pk":"106_social","ans":"B","pimg":"106_social_p61","grp":"106-social-61～63","exp":"空拍機屬於交通部民用航空局管理，是行政院的職掌，行政院依法律推行政策。(A)糾正案是監察院的職權；(B)不信任案是立法院的職權；(D)統一解釋法令是司法院的職權。"},{"id":"107-social-1","y":"107","n":1,"img":"107_social_q01","pk":"107_social","ans":"D","exp":"北大西洋暖流由墨西哥灣流延伸而來，往東北流經西北歐沿海，再進入北極海域，所以沿著這條洋流的挪威沿海垃圾最可能被帶到北極。(A)日本在太平洋，受日本暖流影響；(B)波蘭面向波羅的海，不直接面對此洋流；(C)智利在南美洲西岸，洋流屬太平洋。"},{"id":"107-social-2","y":"107","n":2,"img":"107_social_q02","pk":"107_social","ans":"D","exp":"山脊線距離海岸超過3公里時才會改用山脊線劃設，也就是海岸平原狹窄、山地靠近海岸的地方。臺東縣東側有海岸山脈和中央山脈緊臨海岸，最符合；桃園、彰化、高雄的西部海岸有廣闊平原，多依道路或行政界劃設。"},{"id":"107-social-3","y":"107","n":3,"img":"107_social_q03","pk":"107_social","ans":"C","exp":"區域發展不均是指沿海與內陸、東部與西部經濟差距大。農民工從沿海城市返鄉，反映內陸貧窮、沿海較富裕，人口因此大規模流動。(A)沙塵暴屬自然環境問題；(B)海上絲路是對外經濟政策；(D)南水北調是水資源分配問題，都不直接說明發展差距。"},{"id":"107-social-4","y":"107","n":4,"img":"107_social_q04","pk":"107_social","ans":"B","exp":"圖中預警次數集中在7至9月，且約從5月到11月出現，這是颱風季節。颱風是熱帶海洋面上的低氣壓增強形成的。(A)是地震的成因；(C)是梅雨的成因，集中在5、6月；(D)是冷氣團南下造成的寒流，集中在冬季。"},{"id":"107-social-5","y":"107","n":5,"img":"107_social_q05","pk":"107_social","ans":"B"},{"id":"107-social-6","y":"107","n":6,"img":"107_social_q06","pk":"107_social","ans":"A","exp":"大坌坑、圓山、卑南文化屬新石器時代，製作磨製石器和陶器；長濱文化屬舊石器時代，使用打製石器；十三行文化屬金屬器時代，已會煉鐵。所以分類依據是製作器物的技術。(B)臺灣史前文化並未發展出文字，(D)也還沒有貨幣。"},{"id":"107-social-7","y":"107","n":7,"img":"107_social_q07","pk":"107_social","ans":"D","exp":"圖中有漢朝與羅馬帝國之間的貿易路線，這就是絲路，時期約在西漢到東漢。當時中國出口的主要商品是絲綢。(A)紙幣要到宋代才出現；(B)伊斯蘭教創立於七世紀，晚於此時期；(C)玉米、番薯是大航海時代後才從美洲傳入。"},{"id":"107-social-8","y":"107","n":8,"img":"107_social_q08","pk":"107_social","ans":"C"},{"id":"107-social-9","y":"107","n":9,"img":"107_social_q09","pk":"107_social","ans":"A","exp":"二十世紀初期是日治時期，當時臺灣總督府推行公共衛生，透過學校教育、保甲制度和警察宣導防疫。全民健康保險要到1995年才實施，所以最不可能。"},{"id":"107-social-10","y":"107","n":10,"img":"107_social_q10","pk":"107_social","ans":"D"},{"id":"107-social-11","y":"107","n":11,"img":"107_social_q11","pk":"107_social","ans":"B"},{"id":"107-social-12","y":"107","n":12,"img":"107_social_q12","pk":"107_social","ans":"D","exp":"三位首長的作為都是縣市政府依本地情況自行決定事務，例如引進活動、停班停課或停車、公投決定地方事務，這是地方在法定範圍內自己處理地方事務，也就是地方自治。(A)中央集權相反；(B)責任政治是官員為政策負責；(C)三權分立是中央權力分立。"},{"id":"107-social-13","y":"107","n":13,"img":"107_social_q13","pk":"107_social","ans":"D","exp":"圖中修法後的公告把住戶姓名隱去一部分，只留姓氏，目的是保護住戶的個人資料不被隨意公開，因此是《個人資料保護法》。(A)民法規範私人間權利義務；(B)保護消費者；(C)處罰擾亂社會秩序的行為，都不是為了遮蔽姓名。"},{"id":"107-social-14","y":"107","n":14,"img":"107_social_q14","pk":"107_social","ans":"A","exp":"題目中的政府協助職業訓練和就業資訊，屬於政府要主動提供給人民的受益權，也就是社會權。接受國民教育是人民請求國家提供教育資源，性質最類似。(B)是參政權中的結社與表達；(C)是參政權中的罷免權；(D)是遷徙自由，屬自由權。"},{"id":"107-social-15","y":"107","n":15,"img":"107_social_q15","pk":"107_social","ans":"C","exp":"投資報酬率是投資獲利與投入本金的比值。乙是投入的本金30萬元，丙是獲利10萬元，所以報酬率約為10÷30。甲、丁是總現金，並不是投資本身的金額。"},{"id":"107-social-16","y":"107","n":16,"img":"107_social_q16","pk":"107_social","ans":"D"},{"id":"107-social-17","y":"107","n":17,"img":"107_social_q17","pk":"107_social","ans":"B"},{"id":"107-social-18","y":"107","n":18,"img":"107_social_q18","pk":"107_social","ans":"D"},{"id":"107-social-19","y":"107","n":19,"img":"107_social_q19","pk":"107_social","ans":"C","exp":"波斯灣經紅海到蘇伊士運河，必須經過紅海南端的曼德海峽，位在葉門與吉布地之間。葉門位於阿拉伯半島西南角，產油量不高，卻因控制海峽而影響油價，是圖(C)。(A)是馬六甲海峽旁；(B)是巴拿馬；(D)是土耳其，控制的是黑海出口。"},{"id":"107-social-20","y":"107","n":20,"img":"107_social_q20","pk":"107_social","ans":"C","exp":"在只考慮緯度時，緯度越高氣溫越低，入春越晚。哈爾濱緯度最高，4月26日最晚入春是甲；北京居中，4月1日是丙；武漢緯度最低，3月16日最早是乙。所以甲乙丙依序為哈爾濱、武漢、北京。"},{"id":"107-social-21","y":"107","n":21,"img":"107_social_q21","pk":"107_social","ans":"D","exp":"一次大戰後各殖民地民族自決運動興起，日本在1919年起改採文官總督和內地延長主義，希望把臺灣視為日本本土延伸，用同化政策來減少反抗。(A)六三法是1896年；(B)征討臺灣民主國是1895年；(C)縱貫鐵路在1899年開始建造，都早於一次大戰。"},{"id":"107-social-22","y":"107","n":22,"img":"107_social_q22","pk":"107_social","ans":"C"},{"id":"107-social-23","y":"107","n":23,"img":"107_social_q23","pk":"107_social","ans":"D","exp":"馬克思批判資本主義下工人的處境，狄更斯用寫實小說描寫工業革命後的貧窮、童工與社會不公，兩人共同點是對工業革命下的社會提出反省。(A)兩人並未支持帝國主義；(B)是浪漫主義；(C)法西斯政權是二十世紀才出現。"},{"id":"107-social-24","y":"107","n":24,"img":"107_social_q24","pk":"107_social","ans":"B","exp":"文中是鄭氏政權與日本、英國、東南亞貿易，目的是突破清朝對鄭氏的封鎖，也就是海禁政策，讓鄭氏能取得物資。(A)市舶司是宋明時的海外貿易管理機構；(C)渡臺禁令是清領後管制移民；(D)廣州一口通商是乾隆時期，晚於鄭氏。"},{"id":"107-social-25","y":"107","n":25,"img":"107_social_q25","pk":"107_social","ans":"B","exp":"唐朝初期尊崇道教又包容外來宗教，各國僧侶來到長安，後來唐武宗在會昌年間滅佛，毀寺院、令僧尼還俗，連祆教、摩尼教也被禁，這是會昌法難。(A)漢朝時佛教尚未盛行；(C)元代對各宗教多採包容；(D)清朝也沒有大規模毀佛。"},{"id":"107-social-26","y":"107","n":26,"img":"107_social_q26","pk":"107_social","ans":"D","exp":"大法官的工作是做出釋憲，也就是解釋憲法、判斷法律是否違憲，以保障人民權益。(A)大法官不用競選連任；(B)提出糾正案是監察院的職權；(C)大法官由總統提名、立法院同意，不是行政院長提請，也不屬執政團隊。"},{"id":"107-social-27","y":"107","n":27,"img":"107_social_q27","pk":"107_social","ans":"B","exp":"民法規定遺產繼承採限定繼承（2009年修正），繼承人只需在所繼承遺產的範圍內負責還債，因此不用擔心父親欠的大筆債務超過遺產。(C)並非完全不用還，而是限於遺產；(D)債權人仍可在遺產範圍內請求。"},{"id":"107-social-28","y":"107","n":28,"img":"107_social_q28","pk":"107_social","ans":"D","exp":"價格調漲代表原本需求量大於供給量（供不應求，價格上升），價格調降代表供給量大於需求量（供過於求，價格下降）。臺北店需求3、供給2，高雄店需求1、供給2，符合圖(D)。"},{"id":"107-social-29","y":"107","n":29,"img":"107_social_q29","pk":"107_social","ans":"C","exp":"開放政府資料讓民眾取得資訊並監督政府，等於提供人民參與公共事務的新管道，所以是提供政治參與的多元管道。(A)(D)與資訊倫理、媒體教育無關；(B)分權制衡是政府機關之間互相監督，不是人民透過資料監督。"},{"id":"107-social-30","y":"107","n":30,"img":"107_social_q30","pk":"107_social","ans":"C","exp":"案件是檢察官起訴的刑事案件，法院可能判處徒刑、褫奪公權、沒收犯罪所得及罰金等。「罰鍰」是行政罰，由行政機關裁處，刑事判決的財產刑是「罰金」，所以不會判處高額罰鍰。"},{"id":"107-social-31","y":"107","n":31,"img":"107_social_q31","pk":"107_social","ans":"B","exp":"印尼是由一萬多個島嶼組成的群島國家，每個島嶼都有海岸線，加總起來就非常長。(A)峽灣是高緯冰川地形；(C)俄羅斯面積比印尼大得多，但海岸線反而較短；(D)緯度高低不會決定海岸線長短。"},{"id":"107-social-32","y":"107","n":32,"img":"107_social_q32","pk":"107_social","ans":"B"},{"id":"107-social-33","y":"107","n":33,"img":"107_social_q33","pk":"107_social","ans":"C","exp":"題目說棉紡織工廠多設在勞力低廉的地方，美國工資高，紡織業外移，所以棉花消費量很低，而生產量仍不少，國內生產遠大於消費，符合丙。甲、丁生產量和消費量都大且消費略高於生產，屬於紡織業發達的國家。"},{"id":"107-social-34","y":"107","n":34,"img":"107_social_q34","pk":"107_social","ans":"D","exp":"丁是從緬甸通到雲南的中緬管道，要經過橫斷山脈的高山峽谷、潮濕的熱帶叢林、地震活躍的板塊交界，雲南又有石灰岩地形，並跨越怒江、瀾滄江等河流，建設最困難。(A)甲經北方平原與草原；(B)乙經乾燥的中亞，不是叢林。"},{"id":"107-social-35","y":"107","n":35,"img":"107_social_q35","pk":"107_social","ans":"D","exp":"地圖經緯度約在北緯24度、東經118度，是金門，國家公園以保存戰役史蹟和傳統閩南式建築聚落為特色。(A)峽谷景觀是太魯閣；(B)珊瑚礁防風牆是澎湖；(C)火山噴氣孔是陽明山。"},{"id":"107-social-36","y":"107","n":36,"img":"107_social_q36","pk":"107_social","ans":"C"},{"id":"107-social-37","y":"107","n":37,"img":"107_social_q37","pk":"107_social","ans":"C","exp":"鄭和下西洋因花費太大而停止，沿海受倭寇侵擾，皇帝又修築長城抵禦蒙古，這是明代中期以後的情況。(A)南宋與(B)元代沒有鄭和下西洋；(D)清代的外患主要是西方列強。"},{"id":"107-social-38","y":"107","n":38,"img":"107_social_q38","pk":"107_social","ans":"C","exp":"文中有「國民政府」的中央銀行和上海租界仍繁榮，且工廠地帶被轟炸，表示正在對日作戰，約是1937年淞滬會戰前後，也就是1930年代。(A)(B)國民政府尚未成立；(D)租界早已收回。"},{"id":"107-social-39","y":"107","n":39,"img":"107_social_q39","pk":"107_social","ans":"C","exp":"影片內容包含德國空軍與英國交戰、日德義同盟、慶祝滿洲建國十週年（1942年）和夏威夷空襲（1941年），都是二次大戰期間，而且站在日德義軸心國立場，所以最可能在日本統治下的臺北播放。(D)重慶是國民政府，立場相反。"},{"id":"107-social-40","y":"107","n":40,"img":"107_social_q40","pk":"107_social","ans":"D","exp":"告訴乃論是被害人提告才處理，可以調解和解；改成非告訴乃論後，檢察官會主動偵辦，就不能再以調解解決。(A)陳情屬請願權；(B)修法是立法院的職權；(C)盜印是侵權，可能要負刑事責任。"},{"id":"107-social-41","y":"107","n":41,"img":"107_social_q41","pk":"107_social","ans":"C"},{"id":"107-social-42","y":"107","n":42,"img":"107_social_q42","pk":"107_social","ans":"B","exp":"法律修正通過後，由立法院三讀，再由總統公布才會施行。(A)統一解釋法律的是司法院大法官，不是立法院；(C)民眾檢舉交通違規應向警察機關，不是法院；(D)罰鍰收入不是稅收，修法只是限制檢舉期限。"},{"id":"107-social-43","y":"107","n":43,"img":"107_social_q43","pk":"107_social","ans":"D","exp":"丁是圖中最下方的女兒，她的父親、母親、哥哥、外公外婆（甲家的父母）、舅舅都和她有血緣關係。若是丙，他是外來的丈夫，與母親只有婚姻關係，和其他人沒有血緣；甲是外公的妻子，與母親、乙沒有血緣，也不符合。"},{"id":"107-social-44","y":"107","n":44,"img":"107_social_q44","pk":"107_social","ans":"C","exp":"每個景點總利潤是（售價×杯數－成本）×天數：甲(5500－1000)×2＝9000；乙(2700－600)×4＝8400；丙(4000－800)×3＝9600。選某處的機會成本是放棄的最高利潤：選丙放棄9000，選甲或乙都放棄9600，所以甲＝乙＞丙。"},{"id":"107-social-45","y":"107","n":45,"img":"107_social_q45","pk":"107_social","ans":"B"},{"id":"107-social-46","y":"107","n":46,"img":"107_social_q46","pk":"107_social","ans":"C","exp":"圖中水果的進口值遠高於出口值，進口多於出口，貿易是入超。出口值很低，也顯示我國生產水果並沒有比較優勢，所以(B)(D)不對；絕對利益是比別國投入更少資源，圖中看不出來。"},{"id":"107-social-47","y":"107","n":47,"img":"107_social_q47","pk":"107_social","ans":"A","exp":"丙國生育率逐年上升且與甲、乙差距擴大，最可能是政府鼓勵生育，提供幼兒生活補助津貼等鼓勵生育政策。(B)延後退休與(C)長期安養服務是因應高齡化，不影響生育率；(D)子女姓氏協商與生育率沒有直接關係。"},{"id":"107-social-48","y":"107","n":48,"img":"107_social_q48","pk":"107_social","ans":"D","exp":"活動是把水果採摘、旅遊結合在一起，把農產品變成觀光體驗，是農業六級化，目的是提升農業的附加價值。(A)公共造產是地方政府建設；(B)增加單位面積產量是提升生產技術；(C)與出口無關。"},{"id":"107-social-49","y":"107","n":49,"img":"107_social_q49","pk":"107_social","ans":"A"},{"id":"107-social-50","y":"107","n":50,"img":"107_social_q50","pk":"107_social","ans":"B"},{"id":"107-social-51","y":"107","n":51,"img":"107_social_q51","pk":"107_social","ans":"A","exp":"出口商品是茶、樟腦、煤，產地在北部山區，出口港是淡水和基隆。當時開港通商的是淡水、基隆（北部）和安平、打狗（南部），洋行做北部茶、樟腦、煤，故設在甲（北端）。"},{"id":"107-social-52","y":"107","n":52,"img":"107_social_q52","pk":"107_social","ans":"A","exp":"文中有國王，又有國會選舉、聯合政府和總理，可見是君主立憲的內閣制國家，由國會多數黨組閣。(B)有國王不是共和國；(C)聯合政府表示多黨制；(D)最大黨是快樂黨，因為幸福黨只是被邀請組成聯合政府。"},{"id":"107-social-53","y":"107","n":53,"img":"107_social_q53","pk":"107_social","ans":"D","exp":"1929至1932年非農業就業人口大減，是因為1929年股市崩盤引發經濟大恐慌，銀行與工廠倒閉、失業增加。(A)是南北戰爭後；(B)羅斯福新政在1933年後才推行；(C)美國二戰發生在1941年後，不在圖中範圍。"},{"id":"107-social-54","y":"107","n":54,"img":"107_social_q54","pk":"107_social","ans":"C"},{"id":"107-social-55","y":"107","n":55,"img":"107_social_q55","pk":"107_social","ans":"A","exp":"2010年縣市合併，臺南縣（R）和高雄縣（S）、臺中縣（L）等縣與市合併，代碼停止發行；新竹縣（J）仍是縣，沒有被合併，代碼還能使用。"},{"id":"107-social-56","y":"107","n":56,"img":"107_social_q56","pk":"107_social","ans":"A","exp":"狄亞士到達非洲最南端的好望角，位置約在東經18度，經度介於0度和75度東經之間，所以在歐洲和印度之間的甲。乙靠近印度，丙、丁在西半球。"},{"id":"107-social-57","y":"107","n":57,"img":"107_social_q57","pk":"107_social","ans":"D","pimg":"107_social_p57","grp":"107-social-57～59"},{"id":"107-social-58","y":"107","n":58,"img":"107_social_q58","pk":"107_social","ans":"B","pimg":"107_social_p57","grp":"107-social-57～59","exp":"科索沃位於塞爾維亞與阿爾巴尼亞之間，在巴爾幹半島，位置是乙，靠近義大利東邊的亞得里亞海。甲是伊比利半島、丙在東地中海沿岸、丁在北非。"},{"id":"107-social-59","y":"107","n":59,"img":"107_social_q59","pk":"107_social","ans":"A","pimg":"107_social_p57","grp":"107-social-57～59"},{"id":"107-social-60","y":"107","n":60,"img":"107_social_q60","pk":"107_social","ans":"C","pimg":"107_social_p60","grp":"107-social-60～61","exp":"需求法則是價格越高，需求量越少。大醫院看診人潮擁擠，提高大醫院的門診掛號費，能減少輕症民眾前往，讓大醫院的資源留給重症病人。(A)限制人數是行政管制，不是運用需求法則；(B)(D)是增加供給面。"},{"id":"107-social-61","y":"107","n":61,"img":"107_social_q61","pk":"107_social","ans":"A","pimg":"107_social_p60","grp":"107-social-60～61","exp":"政府推動醫療院所分級，是由制度的改變，影響民眾就醫的觀念，養成小感冒先看小診所的習慣，所以屬於透過制度變遷影響觀念變遷。其他選項涉及器物，與此情形不符。"},{"id":"107-social-62","y":"107","n":62,"img":"107_social_q62","pk":"107_social","ans":"C","pimg":"107_social_p62","grp":"107-social-62～63"},{"id":"107-social-63","y":"107","n":63,"img":"107_social_q63","pk":"107_social","ans":"A","pimg":"107_social_p62","grp":"107-social-62～63","exp":"最深色的是年齡中位數40歲以上，表示高齡人口多，這些國家出生率低、少子化，且醫療衛生發達，壽命長，人口組成是紡錘型或倒金字塔型。(B)(C)是年輕國家的特徵；(D)低金字塔型是年輕人口多、出生率高的型態。"},{"id":"108-social-1","y":"108","n":1,"img":"108_social_q01","pk":"108_social","ans":"D"},{"id":"108-social-2","y":"108","n":2,"img":"108_social_q02","pk":"108_social","ans":"C"},{"id":"108-social-3","y":"108","n":3,"img":"108_social_q03","pk":"108_social","ans":"C"},{"id":"108-social-4","y":"108","n":4,"img":"108_social_q04","pk":"108_social","ans":"A","exp":"貨運列車從義烏經西安、蘭州、烏魯木齊後出中國西境，接著要抵達伊朗，中間會穿過哈薩克、烏茲別克等中亞國家。(B)南亞在中國西南方，不在這條路線上；(C)東歐在更西邊，要到伊朗之後再往北才會經過；(D)東南亞在中國南方。"},{"id":"108-social-5","y":"108","n":5,"img":"108_social_q05","pk":"108_social","ans":"C","exp":"海岸線居各洲之冠，成因是面積廣大、未與其他洲接壤（四周臨海）、島嶼眾多、峽灣發達。美洲有北美、南美，北美的加拿大北極群島眾多、阿拉斯加與智利南部峽灣發達，所以符合。(B)非洲海岸平直，島嶼和峽灣都少；(D)歐洲與亞洲相連，不符合「未與其他洲接壤」。"},{"id":"108-social-6","y":"108","n":6,"img":"108_social_q06","pk":"108_social","ans":"C"},{"id":"108-social-7","y":"108","n":7,"img":"108_social_q07","pk":"108_social","ans":"A"},{"id":"108-social-8","y":"108","n":8,"img":"108_social_q08","pk":"108_social","ans":"C"},{"id":"108-social-9","y":"108","n":9,"img":"108_social_q09","pk":"108_social","ans":"C"},{"id":"108-social-10","y":"108","n":10,"img":"108_social_q10","pk":"108_social","ans":"B","exp":"標題是「總統下午將宣告解嚴令」，解嚴是1987年。解嚴後報禁、黨禁解除，人民可以組織政黨，所以對應「開放人民組織政黨」。(A)公地放領是1950年代；(C)十大建設是1970年代；(D)九年國民義務教育是1968年，都不是解嚴時期。"},{"id":"108-social-11","y":"108","n":11,"img":"108_social_q11","pk":"108_social","ans":"A"},{"id":"108-social-12","y":"108","n":12,"img":"108_social_q12","pk":"108_social","ans":"D"},{"id":"108-social-13","y":"108","n":13,"img":"108_social_q13","pk":"108_social","ans":"B","exp":"設備租金是生產成本，少列了成本，補列後成本變高。銷貨收入只看賣出多少錢，與成本無關，所以甲不變；利潤＝收入－成本，成本增加，所以乙下降。"},{"id":"108-social-14","y":"108","n":14,"img":"108_social_q14","pk":"108_social","ans":"D","exp":"甲家有奶奶、爸爸、媽媽、哥哥和甲。爸爸與奶奶、甲、哥哥是直系血親，與媽媽是配偶，圖中沒有爸爸的兄弟姊妹，所以爸爸與家人間沒有旁系血親。(A)奶奶與媽媽是婆媳，屬姻親；(B)媽媽與爸爸是配偶；(C)哥哥與爸媽、奶奶都是直系血親。"},{"id":"108-social-15","y":"108","n":15,"img":"108_social_q15","pk":"108_social","ans":"D"},{"id":"108-social-16","y":"108","n":16,"img":"108_social_q16","pk":"108_social","ans":"D"},{"id":"108-social-17","y":"108","n":17,"img":"108_social_q17","pk":"108_social","ans":"B","exp":"三種品種的原產地分別是衣索比亞、剛果、賴比瑞亞，對應咖啡的阿拉比卡、羅布斯塔、利比里卡三大品種。咖啡適合種在熱帶高地或低海拔地區，中國主要產在雲南與海南島。(A)(C)(D)的原產地和分布範圍都不符合。"},{"id":"108-social-18","y":"108","n":18,"img":"108_social_q18","pk":"108_social","ans":"B","exp":"農牧過渡帶、乾燥少雨、水土流失嚴重，又在2011年對「西海固」地區居民實施搬遷，這個地區位於寧夏回族自治區南部，就是圖中的乙。(A)甲在東北，是黑龍江，氣候濕冷；(C)丙在中南部，氣候濕潤；(D)丁在西南，是雲貴高原一帶。"},{"id":"108-social-19","y":"108","n":19,"img":"108_social_q19","pk":"108_social","ans":"A","exp":"美國、德國都是都市化程度很高的國家，圖中美國的圓圈是白色、德國是淺灰色，而奈及利亞都市化程度較低，顏色較深。所以顏色越淺代表都市化程度越高，最高的圖例是白色。"},{"id":"108-social-20","y":"108","n":20,"img":"108_social_q20","pk":"108_social","ans":"A","exp":"圖中北部約12至13度，中南部約31至32度，北部明顯比南部冷。這是大陸冷氣團南下時，先影響北部、尚未影響到南部造成的溫差。(B)(C)(D)的主要影響是降雨或悶熱，不會造成北冷南暖的氣溫差。"},{"id":"108-social-21","y":"108","n":21,"img":"108_social_q21","pk":"108_social","ans":"A"},{"id":"108-social-22","y":"108","n":22,"img":"108_social_q22","pk":"108_social","ans":"C"},{"id":"108-social-23","y":"108","n":23,"img":"108_social_q23","pk":"108_social","ans":"B"},{"id":"108-social-24","y":"108","n":24,"img":"108_social_q24","pk":"108_social","ans":"C"},{"id":"108-social-25","y":"108","n":25,"img":"108_social_q25","pk":"108_social","ans":"B","exp":"橫跨歐、亞、非三洲，皇帝在政治上至高無上，又是宗教的代表，可任命首都主教、主導教會，這是拜占庭帝國的「政教合一」特色。(D)神聖羅馬帝國只在歐洲，且皇帝與教皇互相爭權；(C)亞歷山大帝國沒有基督教。"},{"id":"108-social-26","y":"108","n":26,"img":"108_social_q26","pk":"108_social","ans":"D"},{"id":"108-social-27","y":"108","n":27,"img":"108_social_q27","pk":"108_social","ans":"D","exp":"改為「非告訴乃論」，表示就算被害的醫護人員同意和解，檢察官仍可偵查起訴。(A)文中團體是醫護的職業團體，不是政治團體；(B)訴願是向行政機關提出，不是向立法院；(C)法律是由總統公布，不是行政院長。"},{"id":"108-social-28","y":"108","n":28,"img":"108_social_q28","pk":"108_social","ans":"C","exp":"無罪推定是指在法院判決有罪確定前，都要先推定被告無罪。(C)大雄雖被起訴，但還沒有判決確定，所以不能認定他有罪，符合原則。(B)只是被逮捕就說她有罪，違反原則；(A)(D)是已受處罰的事實，與有無罪的推定無關。"},{"id":"108-social-29","y":"108","n":29,"img":"108_social_q29","pk":"108_social","ans":"B","exp":"自治條例是由地方立法機關通過，縣的立法機關是縣議會，不是立法院。罰鍰是行政機關對違規者的行政處罰，不是刑事責任，也不是民事賠償責任，所以(C)(D)都錯。"},{"id":"108-social-30","y":"108","n":30,"img":"108_social_q30","pk":"108_social","ans":"A","exp":"利潤＝投資金額×報酬率，利潤相同時，報酬率越低，投資金額就要越高。甲的報酬率最低（10%），所以投資金額最高。"},{"id":"108-social-31","y":"108","n":31,"img":"108_social_q31","pk":"108_social","ans":"A","exp":"臺灣南部冬季（11至4月）降雨少，夏季（5至10月）降雨集中，冬夏雨量差距最大。甲冬季只有1814、夏季15668，差距最大，所以是南部。丁冬夏差距最小，雨量較平均，應是東部或北部。"},{"id":"108-social-32","y":"108","n":32,"img":"108_social_q32","pk":"108_social","ans":"D","exp":"軟木橡樹分布在西班牙、義大利等地中海沿岸，緯度約30至40度，是地中海型氣候，特色是冬雨夏乾，年雨量約400至800毫米。(A)是溫帶海洋性氣候；(B)是沙漠氣候；(C)夏雨冬乾是季風或熱帶莽原型的特色。"},{"id":"108-social-33","y":"108","n":33,"img":"108_social_q33","pk":"108_social","ans":"B"},{"id":"108-social-34","y":"108","n":34,"img":"108_social_q34","pk":"108_social","ans":"A","exp":"甲是高雄、乙是臺南（西南部），丙是臺中梧棲（中部偏西），丁是基隆（北部），戊是蘇澳（東部），己是花蓮（東部）。依序是西南部出發，經過北部，再到東部沿海。"},{"id":"108-social-35","y":"108","n":35,"img":"108_social_q35","pk":"108_social","ans":"C"},{"id":"108-social-36","y":"108","n":36,"img":"108_social_q36","pk":"108_social","ans":"D"},{"id":"108-social-37","y":"108","n":37,"img":"108_social_q37","pk":"108_social","ans":"B"},{"id":"108-social-38","y":"108","n":38,"img":"108_social_q38","pk":"108_social","ans":"C","exp":"劃界封山約在康熙末年（1722年前後），最早；接著是1860年代開港通商；1874年牡丹社事件後推行開山撫番；1885年臺灣建省最晚。順序是丙→乙→丁→甲。"},{"id":"108-social-39","y":"108","n":39,"img":"108_social_q39","pk":"108_social","ans":"C","exp":"文中提到日本之後展開對外作戰，旅遊改為參拜神社、祈福、慰問傷兵，這是戰時體制，與1937年盧溝橋事變（中日戰爭爆發）有關。(A)(B)是武裝抗日事件；(D)請願運動是1920年代的政治運動，不會讓旅遊改變成戰時內容。"},{"id":"108-social-40","y":"108","n":40,"img":"108_social_q40","pk":"108_social","ans":"D","exp":"新竹縣是「縣」，地方民意代表是縣議員；竹北市是縣轄市，市民選出的代表是市民代表，不是議員。立委是中央民意代表，不屬於地方民意代表。"},{"id":"108-social-41","y":"108","n":41,"img":"108_social_q41","pk":"108_social","ans":"A"},{"id":"108-social-42","y":"108","n":42,"img":"108_social_q42","pk":"108_social","ans":"B"},{"id":"108-social-43","y":"108","n":43,"img":"108_social_q43","pk":"108_social","ans":"C"},{"id":"108-social-44","y":"108","n":44,"img":"108_social_q44","pk":"108_social","ans":"C","exp":"不同廠址的成本差異只來自運輸，且離原料產地最近的甲成本最低，表示原料運輸費用比成品運輸費用高。這類原料加工後體積、重量會變小，所以設在原料產地附近最省運費。"},{"id":"108-social-45","y":"108","n":45,"img":"108_social_q45","pk":"108_social","ans":"D","exp":"桃園縣工作機會多、總就業人口大，外流就業人口雖多（59千），但占該區就業人口比率最低（6.28%），反推總就業人口最大。甲、乙占比約三成，總就業人口小，是澎湖、臺東；丙是雲林縣。"},{"id":"108-social-46","y":"108","n":46,"img":"108_social_q46","pk":"108_social","ans":"D"},{"id":"108-social-47","y":"108","n":47,"img":"108_social_q47","pk":"108_social","ans":"C"},{"id":"108-social-48","y":"108","n":48,"img":"108_social_q48","pk":"108_social","ans":"B","exp":"日本對東協投資增加、對中國減少，主要因為東協的生產成本（如工資）較低，而中國工資上漲。(A)天災沒有明顯逐年增加；(C)全面開放二胎是2016年，與圖中年代不符；(D)東協反日意識漸高會讓投資減少。"},{"id":"108-social-49","y":"108","n":49,"img":"108_social_q49","pk":"108_social","ans":"D","exp":"穆斯林要朝聖麥加，所以用虛擬實境做麥加虛擬朝聖，是針對穆斯林的產品。(B)穆斯林禁吃豬肉而不是牛肉，不吃牛肉的是印度教徒；(A)拉丁文與(C)聖經與基督教有關。"},{"id":"108-social-50","y":"108","n":50,"img":"108_social_q50","pk":"108_social","ans":"D","exp":"我國最高行政機關首長是行政院長，由總統任命，向立法院負責，立法院可以對行政院長提出不信任案。(C)彈劾案是針對總統、副總統；(B)監察院針對公務員提糾正與彈劾；(A)憲法法庭不審理這類情形。"},{"id":"108-social-51","y":"108","n":51,"img":"108_social_q51","pk":"108_social","ans":"C","exp":"表中由美國領事法庭審判在中國境內的美國公民，是領事裁判權，這是1842年南京條約後（十九世紀後期）列強在中國取得的特權。後來1940年代已逐步廢除，所以不是二十世紀後期。"},{"id":"108-social-52","y":"108","n":52,"img":"108_social_q52","pk":"108_social","ans":"D"},{"id":"108-social-53","y":"108","n":53,"img":"108_social_q53","pk":"108_social","ans":"A","exp":"表中具投票權人數比例持續上升，表示成年人口比例增加、年輕人口比例相對減少，反映少子化現象。(B)投票率從第10屆後逐屆下降，參與意願並未上升；(C)(D)表中沒有相關資料。"},{"id":"108-social-54","y":"108","n":54,"img":"108_social_q54","pk":"108_social","ans":"B","pimg":"108_social_p54","grp":"108-social-54～56","exp":"「統治政權」是指鄭氏政權（東寧王國），曾在臺灣設置承天府、天興州、萬年州。(A)淡水廳、(C)噶瑪蘭廳是清朝設置；(D)臺東直隸州也是清朝晚期設置。"},{"id":"108-social-55","y":"108","n":55,"img":"108_social_q55","pk":"108_social","ans":"D","pimg":"108_social_p54","grp":"108-social-54～56"},{"id":"108-social-56","y":"108","n":56,"img":"108_social_q56","pk":"108_social","ans":"C","pimg":"108_social_p54","grp":"108-social-54～56","exp":"要減少塞車，又不能影響區公所吸引遊客的目的，提供免費公車可以減少車輛進入又不阻礙遊客前來。(A)(B)會增加遊客或攤商成本，反而可能減少人潮；(D)只增加資訊與優惠，不能減少車潮。"},{"id":"108-social-57","y":"108","n":57,"img":"108_social_q57","pk":"108_social","ans":"B","pimg":"108_social_p57","grp":"108-social-57～58","exp":"智利位於南美洲西岸，濱臨太平洋，霧氣來自海上，所以是太平洋的霧。大西洋在南美洲東側。"},{"id":"108-social-58","y":"108","n":58,"img":"108_social_q58","pk":"108_social","ans":"B","pimg":"108_social_p57","grp":"108-social-57～58","exp":"智利沙漠有寒流經過，海面水氣遇冷凝結成霧，這種沿岸沙漠是缺水、有霧的地區。非洲西南部有納米比亞沙漠，沿海也有寒流與霧，環境相似。(A)(C)(D)是濕潤或降水多的地區，不缺水。"},{"id":"108-social-59","y":"108","n":59,"img":"108_social_q59","pk":"108_social","ans":"D","pimg":"108_social_p59","grp":"108-social-59～61","exp":"毒餌讓農民減少損失，但卻使黑鳶中毒死亡，影響生態環境，這是行為對旁人或環境造成不是交易雙方的影響，屬於外部效果（外部成本）。"},{"id":"108-social-60","y":"108","n":60,"img":"108_social_q60","pk":"108_social","ans":"C","pimg":"108_social_p59","grp":"108-social-59～61","exp":"林姓農夫認同守護黑鳶的想法，所以改變耕作方式，這是理念改變影響生產者（農夫）的行為。文中沒有提到制度改變，也不是消費者的行為。"},{"id":"108-social-61","y":"108","n":61,"img":"108_social_q61","pk":"108_social","ans":"A","pimg":"108_social_p59","grp":"108-social-59～61","exp":"雙方簽訂契約屬於民事關係，發生爭議時可聲請調解，也可提民事訴訟。(B)(C)是刑事案件的處理方式；(D)訴願是人民對行政機關的處分不服時才使用。"},{"id":"108-social-62","y":"108","n":62,"img":"108_social_q62","pk":"108_social","ans":"D","pimg":"108_social_p62","grp":"108-social-62～63","exp":"歐洲綠化帶沿著東德與西德的邊界形成，這是冷戰時期共產和反共集團對峙的鐵幕邊界。(B)一戰壕溝戰的前線不在這裡；(C)德蘇互不侵犯條約是1939年瓜分波蘭等地，不是東西德邊界。"},{"id":"108-social-63","y":"108","n":63,"img":"108_social_q63","pk":"108_social","ans":"A","pimg":"108_social_p62","grp":"108-social-62～63"},{"id":"109-social-1","y":"109","n":1,"img":"109_social_q01","pk":"109_social","ans":"B","exp":"郵戳上標示約北緯66.55度，這是北極圈的緯線，並有馴鹿圖案，且地名為Napapiiri（北極圈）。四個選項中只有芬蘭北部位在北極圈內。(A)日本、(C)英國的緯度都不到66度；(D)紐西蘭在南半球。"},{"id":"109-social-2","y":"109","n":2,"img":"109_social_q02","pk":"109_social","ans":"A"},{"id":"109-social-3","y":"109","n":3,"img":"109_social_q03","pk":"109_social","ans":"B"},{"id":"109-social-4","y":"109","n":4,"img":"109_social_q04","pk":"109_social","ans":"A"},{"id":"109-social-5","y":"109","n":5,"img":"109_social_q05","pk":"109_social","ans":"D","exp":"臺灣冬季盛行東北季風，風從東北方吹向西南方。工業區的廢氣會被吹往它的西南方，圖中位在工業區西南方的是丁。(A)甲在西北方、(B)乙在東北方、(C)丙在東南方，都不在下風處。"},{"id":"109-social-6","y":"109","n":6,"img":"109_social_q06","pk":"109_social","ans":"C"},{"id":"109-social-7","y":"109","n":7,"img":"109_social_q07","pk":"109_social","ans":"B","exp":"圖中人口只有約1.5%的天主教教士和0.5%的貴族，卻擁有35%的土地，稅收卻全由占98%的平民負擔，這是法國大革命前舊制度（三級會議）的社會狀況。(A)美國獨立是殖民地反抗英國課稅；(C)(D)的社會背景和教士、貴族、平民三個等級不同。"},{"id":"109-social-8","y":"109","n":8,"img":"109_social_q08","pk":"109_social","ans":"B","exp":"基隆的海門天險（二沙灣砲臺）和臺南的億載金城都是清末為了抵禦外國軍艦入侵而建的砲臺，分別與中法戰爭、牡丹社事件後的海防有關。(A)(C)是早期開發情形；(D)抗日勢力是日治時期才出現，與這兩處砲臺的興建時間不符。"},{"id":"109-social-9","y":"109","n":9,"img":"109_social_q09","pk":"109_social","ans":"B","exp":"圖(六)中同一個「馬」字在各國寫法不同，圖(七)變成統一的寫法，代表文字統一。秦始皇統一六國後，下令統一文字（小篆）、度量衡與貨幣。(A)齊桓公是春秋霸主；(C)漢武帝重點是獨尊儒術；(D)北魏孝文帝推行漢化。"},{"id":"109-social-10","y":"109","n":10,"img":"109_social_q10","pk":"109_social","ans":"A","exp":"青年節是紀念中華民國成立前的黃花岡之役，屬於中華民國的節日，日本統治臺灣時期不可能指定。(B)日俄戰爭勝利紀念、(C)臺灣神社祭、(D)明治節（明治天皇誕辰）都是日本天皇制度與日本事件相關的節日。"},{"id":"109-social-11","y":"109","n":11,"img":"109_social_q11","pk":"109_social","ans":"A"},{"id":"109-social-12","y":"109","n":12,"img":"109_social_q12","pk":"109_social","ans":"D"},{"id":"109-social-13","y":"109","n":13,"img":"109_social_q13","pk":"109_social","ans":"B"},{"id":"109-social-14","y":"109","n":14,"img":"109_social_q14","pk":"109_social","ans":"D","exp":"利潤等於銷貨收入減生產成本。甲約為6-2.5=3.5百萬元，乙約為4-4=0，丙約為7-8=-1。題目只能停止其中一項，並轉為生產另外兩項中的一種：停止獲利最差的乙，改生產獲利最高的甲，效果最好。(B)(C)的丙雖然虧損，但改產丙是增加虧損的產品。"},{"id":"109-social-15","y":"109","n":15,"img":"109_social_q15","pk":"109_social","ans":"B"},{"id":"109-social-16","y":"109","n":16,"img":"109_social_q16","pk":"109_social","ans":"B","exp":"人口由多到少排列：中國約14億、印度約13億、美國約3億、日本約1.3億。印度比中國少、比美國多，所以應放在中國和美國之間，也就是乙的位置。"},{"id":"109-social-17","y":"109","n":17,"img":"109_social_q17","pk":"109_social","ans":"D","exp":"表中沿海的江蘇、廣東、上海、浙江吸引最多外資，西部的西藏、青海、寧夏、新疆最少，顯示東西部發展差距大。推動與中亞國家的邊境貿易，能帶動西部地區的經濟。(A)東北老工業區不在西部；(B)與東協簽自由貿易協定對沿海較有利；(C)一胎化與外資分布無關。"},{"id":"109-social-18","y":"109","n":18,"img":"109_social_q18","pk":"109_social","ans":"B","exp":"雪梨約為東經151度，跨年時是東11區，時間很早。要再跨一次年，必須到時間更晚的地方。乙位於西經約160度，與雪梨相差約21小時，雪梨零點起飛6小時10分降落，當地仍是前一年12月31日晚上，可以再跨年。(A)紐西蘭比雪梨早，(C)東京只晚2小時，(D)南非相差約9小時，降落時早已過了新年。"},{"id":"109-social-19","y":"109","n":19,"img":"109_social_q19","pk":"109_social","ans":"C","exp":"宜蘭的蘭陽平原由蘭陽溪、宜蘭河、冬山河等河川沖積而成，北方有雪山山脈、南方是中央山脈北端，東部海岸有沙丘。宜蘭山地比例高，平地集中在蘭陽平原。(A)南投縣沒有海岸；(B)苗栗縣沒有這樣的平原與海岸沙丘；(D)臺東縣的平原是縱谷與海岸，不符合。"},{"id":"109-social-20","y":"109","n":20,"img":"109_social_q20","pk":"109_social","ans":"D"},{"id":"109-social-21","y":"109","n":21,"img":"109_social_q21","pk":"109_social","ans":"C"},{"id":"109-social-22","y":"109","n":22,"img":"109_social_q22","pk":"109_social","ans":"B"},{"id":"109-social-23","y":"109","n":23,"img":"109_social_q23","pk":"109_social","ans":"A","exp":"黑奴被販運到美洲的數量最多，主要用在種植園（甘蔗、棉花、菸草等）勞動，乙在每個時期人數都遠高於甲、丙，且18世紀高達數百萬，符合美洲。(C)非洲是黑奴被運出的地方，不是輸入地。"},{"id":"109-social-24","y":"109","n":24,"img":"109_social_q24","pk":"109_social","ans":"B"},{"id":"109-social-25","y":"109","n":25,"img":"109_social_q25","pk":"109_social","ans":"B"},{"id":"109-social-26","y":"109","n":26,"img":"109_social_q26","pk":"109_social","ans":"D","exp":"文末說都市財產犯罪率高於鄉村，要改善都市就要朝鄉村的特性思考對策。鄉村居民彼此熟識、互相照應，所以強化社區意識，鄰里互相守望，最符合文中論點。(A)(B)(C)沒有顯示是鄉村的特性。"},{"id":"109-social-27","y":"109","n":27,"img":"109_social_q27","pk":"109_social","ans":"A","exp":"保護令是由地方法院核發，用來禁止加害人繼續施暴、要求遷出等，具有法律上的隔離效力。警察機關只能聲請，或核發緊急性的處分，不是法律上的隔離令。停止親權是用在父母虐待子女的情形，本題是子女對父母施暴，所以不適用。"},{"id":"109-social-28","y":"109","n":28,"img":"109_social_q28","pk":"109_social","ans":"B","exp":"文中提到吸毒的青少年家庭功能不彰、充滿挫折感，並想獲得同儕認同，這些都屬於需求層次理論中的安全、愛與歸屬、尊重等需求，所以與需求層次理論相關。(A)未成年人刑事責任有減輕規定；(C)文中並未說主要受傳媒影響；(D)與終身學習無關。"},{"id":"109-social-29","y":"109","n":29,"img":"109_social_q29","pk":"109_social","ans":"B"},{"id":"109-social-30","y":"109","n":30,"img":"109_social_q30","pk":"109_social","ans":"A","exp":"圖中灰色是位階低於法律的命令，如行政機關訂定的規則、辦法等，所以可由行政機關訂定。(B)(D)分別是法律及憲法的程序，修憲才需公民複決；(C)原則性規範是法律或憲法的特性。"},{"id":"109-social-31","y":"109","n":31,"img":"109_social_q31","pk":"109_social","ans":"D","exp":"高鐵通車後，與高鐵並行的本島西部航線載客量會大幅減少，甲、乙、丙的人數都明顯下降甚至停飛。只有丁的人數不降反升，因為離島沒有高鐵可以替代，最可能是離島航線。"},{"id":"109-social-32","y":"109","n":32,"img":"109_social_q32","pk":"109_social","ans":"D","exp":"震央位於尼泊爾、不丹、印度附近的喜馬拉雅山區，9月正值夏季風帶來的雨季，連日降雨容易造成土石流掩埋道路，使救援困難。(A)冰河融化主要在春夏溫度升高時，與地震無直接關係；(B)沙塵暴是乾旱區現象；(C)震央在山區，不會有海嘯。"},{"id":"109-social-33","y":"109","n":33,"img":"109_social_q33","pk":"109_social","ans":"A","exp":"丙是唯一從2014年到2050年人口預測減少的洲（741到726百萬），歐洲少子化與高齡化嚴重，人口會減少。(B)非洲是人口成長最快的洲，對應甲；(D)亞洲人口最多，對應丁；(C)美洲人口持續成長。"},{"id":"109-social-34","y":"109","n":34,"img":"109_social_q34","pk":"109_social","ans":"D","exp":"熱帶莽原氣候有明顯的乾濕季，夏季多雨，冬季乾燥。北半球12至2月是冬季，丁在這段時間降水日數是0天，6至8月夏季高達44天，乾濕季最明顯。(A)甲全年多雨，像熱帶雨林；(B)(C)降水較平均，不是莽原氣候。"},{"id":"109-social-35","y":"109","n":35,"img":"109_social_q35","pk":"109_social","ans":"C","exp":"十七世紀統治臺灣的熱蘭遮城屬於荷蘭東印度公司，其亞洲總部設在巴達維亞，也就是今日印尼爪哇島的雅加達，位置是丙。(A)甲是香港附近，(B)乙是馬尼拉，由西班牙統治；(D)丁是新加坡附近。"},{"id":"109-social-36","y":"109","n":36,"img":"109_social_q36","pk":"109_social","ans":"A","exp":"同盟國以德國、奧匈帝國為主。甲向塞爾維亞宣戰並得到德國支持，是奧匈帝國；丙為支持同一民族的奧匈，而向法國和俄國宣戰，是德國。乙是動員軍隊對付奧匈的俄國，丁因德軍入侵比利時而向德國宣戰的是英國，兩國屬協約國。"},{"id":"109-social-37","y":"109","n":37,"img":"109_social_q37","pk":"109_social","ans":"C"},{"id":"109-social-38","y":"109","n":38,"img":"109_social_q38","pk":"109_social","ans":"C","exp":"牌符與驛站路線圖，代表蒙古帝國建立驛站制度（站赤），官員持牌符可以向驛站要求食宿及馬匹，路線橫跨歐亞，反映蒙古帝國勢力範圍廣大。(A)(B)(D)的朝代沒有這種橫跨歐亞的驛站與牌符制度。"},{"id":"109-social-39","y":"109","n":39,"img":"109_social_q39","pk":"109_social","ans":"A","exp":"圖中提出總預算的是行政院，統一解釋法律的是司法院，這兩個人在座位圖的左上與左下，中間隔著甲的座位。阿鴻兩旁分別是行政院和司法院的同學，所以他最可能坐在甲。"},{"id":"109-social-40","y":"109","n":40,"img":"109_social_q40","pk":"109_social","ans":"C","exp":"需求法則是價格越高，需求量越少；價格越低，需求量越多。三點要呈現價格下降、數量增加。乙(80,30)、丙(60,50)、戊(20,110)符合；(A)甲到乙價格降低但數量反而減少；(B)(D)中也有價格下降而數量減少的組合。"},{"id":"109-social-41","y":"109","n":41,"img":"109_social_q41","pk":"109_social","ans":"A","exp":"圖中甲是年齡最小的階段，是無行為能力人。受法院監護宣告的人也是無行為能力人，與甲相同。(B)遭褫奪公權不影響行為能力；(C)(D)的8歲、9歲兒童滿7歲，是限制行為能力人，對應乙。"},{"id":"109-social-42","y":"109","n":42,"img":"109_social_q42","pk":"109_social","ans":"D","exp":"小剛被縣政府開罰九萬元，屬於違反行政法規的行政責任（行政罰）。餐廳因消防檢查不合規定被停止營業，也是行政機關的行政處分。(A)(C)是民事責任；(B)虐待動物被判有期徒刑是刑事責任。"},{"id":"109-social-43","y":"109","n":43,"img":"109_social_q43","pk":"109_social","ans":"D","exp":"隧道打通安地斯山脈，能縮短智利與阿根廷之間由大西洋或太平洋往來的時間。阿根廷在大西洋岸，原本運往太平洋另一端的中國要繞過南美洲南端，若走隧道運到智利太平洋岸，運輸時間可以降低。(A)(B)智利本來就面向太平洋；(C)阿根廷往英國走大西洋，本來就方便。"},{"id":"109-social-44","y":"109","n":44,"img":"109_social_q44","pk":"109_social","ans":"B"},{"id":"109-social-45","y":"109","n":45,"img":"109_social_q45","pk":"109_social","ans":"D","exp":"圖中的商館集中在廣場旁，並有多國商館，包括美國，美國建國後才於1784年到廣州貿易，而十三行是清朝限定廣州一口通商的制度，所以是十九世紀前期的廣州。(A)長崎是荷蘭與中國商人；(B)香港十九世紀中期才割讓；(C)安平是荷蘭時期。"},{"id":"109-social-46","y":"109","n":46,"img":"109_social_q46","pk":"109_social","ans":"A","exp":"表中背景是義大利北部城市興起，重新發現古典文化，這是文藝復興，其中一個特色是用各地的方言創作文學，如但丁用義大利文寫《神曲》，所以方言文學興起。(B)印象畫派是19世紀；(C)浪漫主義是18至19世紀；(D)封建制度是中世紀。"},{"id":"109-social-47","y":"109","n":47,"img":"109_social_q47","pk":"109_social","ans":"C","exp":"價格高時賣不完（過剩），價格低時一個也不剩（可能缺貨）。丙還過剩2個，不是均衡價格；丁已無剩餘，且題目說丁不是均衡價格，代表丁價格太低，出現短缺。因此均衡價格介於過剩的丙與短缺的丁之間。"},{"id":"109-social-48","y":"109","n":48,"img":"109_social_q48","pk":"109_social","ans":"C","exp":"比較利益是看機會成本。做包子的機會成本（放棄的煎餃數）：甲1.2、乙1、丙1.25，乙最低，所以乙負責包子。做煎餃的機會成本（放棄的包子數）：甲約0.83、乙1、丙0.8，丙最低，所以丙負責煎餃。小偉一定做包子，是乙；大智一定做煎餃，是丙；剩下的阿雯就是甲。"},{"id":"109-social-49","y":"109","n":49,"img":"109_social_q49","pk":"109_social","ans":"A","exp":"哈薩克原本靠出口石油賺取外匯，外匯大幅減少，表示石油價格慘跌，所以政策轉向出口馬奶加工乳製品來增加收入。(B)油價飆升外匯會增加；(C)(D)哈薩克並不以咖啡為主要出口品。"},{"id":"109-social-50","y":"109","n":50,"img":"109_social_q50","pk":"109_social","ans":"C","exp":"甲黨58席，超過總席次115席的一半（需58席以上），所以甲黨是國會多數黨，將主導組成新內閣。(A)甲黨單獨過半，不需聯合組閣；(B)只有甲、乙兩大黨，仍是兩黨制；(D)內閣制國家元首與黨魁分開，是由國王等擔任。"},{"id":"109-social-51","y":"109","n":51,"img":"109_social_q51","pk":"109_social","ans":"C"},{"id":"109-social-52","y":"109","n":52,"img":"109_social_q52","pk":"109_social","ans":"D","exp":"去年1甲幣換10乙幣，今年換20乙幣，代表甲幣升值。對乙國遊客來說，在甲國花費變貴，到甲國旅遊的意願下降，使甲國觀光業者擔心客人減少。(A)(B)(C)與匯率變動後乙國人的支出無關，或與題目的升值方向相反。"},{"id":"109-social-53","y":"109","n":53,"img":"109_social_q53","pk":"109_social","ans":"D"},{"id":"109-social-54","y":"109","n":54,"img":"109_social_q54","pk":"109_social","ans":"D"},{"id":"109-social-55","y":"109","n":55,"img":"109_social_q55","pk":"109_social","ans":"B","pimg":"109_social_p55","grp":"109-social-55～57","exp":"蘭姆酒的原料是甘蔗，加勒比海地區屬熱帶氣候，歷史上殖民者在此大量種植甘蔗，是蘭姆酒的主要產地。(A)五大湖區較冷；(C)環地中海地區以葡萄為主；(D)環波羅的海地區以穀類為主。"},{"id":"109-social-56","y":"109","n":56,"img":"109_social_q56","pk":"109_social","ans":"D","pimg":"109_social_p55","grp":"109-social-55～57","exp":"文中說穆斯林禁止飲酒，伊斯蘭世界多以法律明文禁止買賣酒類。沙烏地阿拉伯是伊斯蘭國家，酒類消費量最低。(A)印度有一部分人不禁酒；(B)(C)加拿大、西班牙在西方，多數人可以合法飲酒。"},{"id":"109-social-57","y":"109","n":57,"img":"109_social_q57","pk":"109_social","ans":"A","pimg":"109_social_p55","grp":"109-social-55～57","exp":"文中提到臺灣規定不得以自動販賣機、郵購、電子購物等無法辨識購買者年齡的方式販賣酒類，目的是不讓未成年人買到酒，維護兒童及少年的健康。(C)臺灣不是以穆斯林為主；(B)(D)與規定的重點無關。"},{"id":"109-social-58","y":"109","n":58,"img":"109_social_q58","pk":"109_social","ans":"B","pimg":"109_social_p58","grp":"109-social-58～60","exp":"文中的行政區是臺東縣的池上鄉，鄉有鄉長與鄉民代表，臺東縣還有立法委員選區和縣轄市的市民代表，但臺東縣內沒有省轄市或直轄市，所以不會選出市議員。市議員是直轄市與省轄市才會選出的公職。"},{"id":"109-social-59","y":"109","n":59,"img":"109_social_q59","pk":"109_social","ans":"D","pimg":"109_social_p58","grp":"109-social-58～60","exp":"政府管制車輛進出，是因為遊客隨意停車妨礙農耕，帶給農民不便與損失，這是對他人造成的負面外部成本，管制是為了降低這些外部成本。(A)投資、(B)管理經濟秩序、(C)提升外部效益都與管制車輛的原因不符。"},{"id":"109-social-60","y":"109","n":60,"img":"109_social_q60","pk":"109_social","ans":"C","pimg":"109_social_p58","grp":"109-social-58～60","exp":"農民希望遊客將心比心，站在農民的立場想一想，是從人與人之間應如何相處、體諒他人的倫理道德來提出看法。(B)法律規定是強制規範；(A)風俗習慣、(D)宗教信仰在文中都沒有提到。"},{"id":"109-social-61","y":"109","n":61,"img":"109_social_q61","pk":"109_social","ans":"D","pimg":"109_social_p61","grp":"109-social-61～63"},{"id":"109-social-62","y":"109","n":62,"img":"109_social_q62","pk":"109_social","ans":"B","pimg":"109_social_p61","grp":"109-social-61～63","exp":"袁世凱死後，北洋軍閥各自擁有軍隊，互相爭奪地盤，使北伐完成前中國內戰不斷。(A)是清末情形；(C)汪精衛政權是1940年才成立；(D)共產黨全面控制中國是1949年的事。"},{"id":"109-social-63","y":"109","n":63,"img":"109_social_q63","pk":"109_social","ans":"C","pimg":"109_social_p61","grp":"109-social-61～63"},{"id":"110-social-1","y":"110","n":1,"img":"110_social_q01","pk":"110_social","ans":"C","exp":"達悟族的地下屋和飛魚料理在蘭嶼；七美嶼有柱狀玄武岩和雙心石滬；烈嶼（小金門）有戰地風光和風獅爺文化。所以依序是蘭嶼③、七美嶼⑤、烈嶼⑧。(A)(B)(D)的島嶼都不同時符合這些特色。"},{"id":"110-social-2","y":"110","n":2,"img":"110_social_q02","pk":"110_social","ans":"B"},{"id":"110-social-3","y":"110","n":3,"img":"110_social_q03","pk":"110_social","ans":"B"},{"id":"110-social-4","y":"110","n":4,"img":"110_social_q04","pk":"110_social","ans":"A","exp":"2018年完工、連結香港、澳門和珠海經濟特區的是港珠澳大橋，三地都位在珠江口一帶，所以大橋在珠江的出海口。(B)長江口在上海；(C)海河口在天津；(D)黃河口在山東。"},{"id":"110-social-5","y":"110","n":5,"img":"110_social_q05","pk":"110_social","ans":"B"},{"id":"110-social-6","y":"110","n":6,"img":"110_social_q06","pk":"110_social","ans":"B"},{"id":"110-social-7","y":"110","n":7,"img":"110_social_q07","pk":"110_social","ans":"A","exp":"照片中家庭婦女和軍民合作用土法煉鐵、砌煉鋼爐，是1958年大躍進「全民煉鋼」的景象。(B)抗美援朝是韓戰期間；(C)改革開放是1978年後的經濟改革；(D)文化大革命主要在批鬥與破壞傳統文化。"},{"id":"110-social-8","y":"110","n":8,"img":"110_social_q08","pk":"110_social","ans":"C"},{"id":"110-social-9","y":"110","n":9,"img":"110_social_q09","pk":"110_social","ans":"B","exp":"藍地黃虎旗是臺灣民主國的國旗。1895年清朝簽訂《馬關條約》把臺灣割讓給日本，臺灣官員和仕紳才成立臺灣民主國，想抵抗日本接收，後來日軍逼近就潰散。(C)臺灣地方自治聯盟是日治中期的政治運動；(D)戒嚴令是1949年。"},{"id":"110-social-10","y":"110","n":10,"img":"110_social_q10","pk":"110_social","ans":"A"},{"id":"110-social-11","y":"110","n":11,"img":"110_social_q11","pk":"110_social","ans":"C","exp":"大牛已超過15歲，不受童工規定保護，也已具有刑事責任能力；未滿18歲仍屬限制行為能力人，所以(A)(B)不對。少年事件由少年法庭審理，可能受到保護處分，例如保護管束。(D)十五萬元罰鍰是處罰違法的雇主，不是處罰大牛。"},{"id":"110-social-12","y":"110","n":12,"img":"110_social_q12","pk":"110_social","ans":"A"},{"id":"110-social-13","y":"110","n":13,"img":"110_social_q13","pk":"110_social","ans":"D","exp":"緊急命令由總統發布，須經行政院會議通過，發布後10日內還要提交立法院追認，這幾個機關都參與其中。司法院掌管審判與釋憲，不在緊急命令的發布程序中，所以無關。"},{"id":"110-social-14","y":"110","n":14,"img":"110_social_q14","pk":"110_social","ans":"A"},{"id":"110-social-15","y":"110","n":15,"img":"110_social_q15","pk":"110_social","ans":"D"},{"id":"110-social-16","y":"110","n":16,"img":"110_social_q16","pk":"110_social","ans":"B"},{"id":"110-social-17","y":"110","n":17,"img":"110_social_q17","pk":"110_social","ans":"C","exp":"駝峰航線從印度飛往昆明，途中要越過雲南西部南北走向、山脈與深谷相間的橫斷山脈，飛行軌跡因此高低起伏像駝峰。(A)天山在新疆；(D)內蒙古高原在中國北方，都不在這條航線上。"},{"id":"110-social-18","y":"110","n":18,"img":"110_social_q18","pk":"110_social","ans":"D"},{"id":"110-social-19","y":"110","n":19,"img":"110_social_q19","pk":"110_social","ans":"B","exp":"雲嘉南濱海國家風景區位在臺灣西南沿海，經度約在東經120度多。表中乙是120.14°E，位置在西部沿海；甲、丙約在121.4至121.5°E，是花東一帶；丁119.51°E則在澎湖。"},{"id":"110-social-20","y":"110","n":20,"img":"110_social_q20","pk":"110_social","ans":"D"},{"id":"110-social-21","y":"110","n":21,"img":"110_social_q21","pk":"110_social","ans":"D"},{"id":"110-social-22","y":"110","n":22,"img":"110_social_q22","pk":"110_social","ans":"C","exp":"資料二到四描述的是1900年八國聯軍攻入北京後的搶掠，而八國聯軍的起因是義和團排外、攻擊教堂和傳教士，所以資料一最可能是義和團焚毀教堂與外國人住所。(A)是太平天國北伐；(B)是五四運動；(D)是辛亥革命。"},{"id":"110-social-23","y":"110","n":23,"img":"110_social_q23","pk":"110_social","ans":"B","exp":"史書一描述地廣人稀、火耕水耨的原始農業，史書二則是良田密布的繁榮景象。長江中下游在六朝時期因北方人口大量南遷，加上長期開發，才從荒涼變成富庶。(A)張騫通西域與長江中下游的開發關係不大。"},{"id":"110-social-24","y":"110","n":24,"img":"110_social_q24","pk":"110_social","ans":"D"},{"id":"110-social-25","y":"110","n":25,"img":"110_social_q25","pk":"110_social","ans":"C","exp":"甲報酬率20%。乙投資金額與甲相同，獲利只有一半，所以乙是10%。丙要高於20%：(A)2÷10＝20%，和甲一樣；(B)獲利相同、本金兩倍，報酬率10%；(C)獲利相同、本金一半，報酬率是40%；(D)和乙相同，為10%。"},{"id":"110-social-26","y":"110","n":26,"img":"110_social_q26","pk":"110_social","ans":"B","exp":"菸稅將在2017年調高，民眾預期之後菸價會變貴，所以2016年12月趕在漲價前大量購買，使菸稅金額暴增；新制上路後購買量下降，稅額就驟減。這是預期心理的影響。"},{"id":"110-social-27","y":"110","n":27,"img":"110_social_q27","pk":"110_social","ans":"D","exp":"和解並賠償損失，是民事上的損害賠償問題，屬於民事事件。詐欺罪不需要被害人提出告訴，檢察官和警方就能依法偵辦，屬於非告訴乃論，所以即使老闆不提告，小蔡仍被移送法辦。"},{"id":"110-social-28","y":"110","n":28,"img":"110_social_q28","pk":"110_social","ans":"B","exp":"維持現狀的利潤是80－40＝40，增產甲是120－90＝30。機會成本是放棄的選項中最好的那個，也就是第二名，所以增產乙的利潤要介於30與40之間。105－☆在30到40之間，☆就要介於65到75，只有70符合。"},{"id":"110-social-29","y":"110","n":29,"img":"110_social_q29","pk":"110_social","ans":"C"},{"id":"110-social-30","y":"110","n":30,"img":"110_social_q30","pk":"110_social","ans":"C","exp":"圖中乙最寬，人口最多，應是亞洲；甲底部最寬、年輕人比例最高，是非洲。丙人口規模排第三，且老年人口比例較高，與歐洲人口多、少子化而高齡化的特徵相符。(D)中南美洲人口較少，位置在丁。"},{"id":"110-social-31","y":"110","n":31,"img":"110_social_q31","pk":"110_social","ans":"B","exp":"澳洲位於南半球，季節與北半球相反，秋季是3至5月，所以葡萄採收季約在3、4月。(A)1、2月是澳洲的夏季；(C)6、7月是冬季；(D)9、10月是春季。"},{"id":"110-social-32","y":"110","n":32,"img":"110_social_q32","pk":"110_social","ans":"A","exp":"表中荷蘭、德國、比利時的貨運量最大，這些國家位在萊茵河流域，萊茵河注入北海。多瑙河流經奧地利、匈牙利、斯洛伐克、羅馬尼亞，注入黑海，這些國家的貨運量明顯較小。"},{"id":"110-social-33","y":"110","n":33,"img":"110_social_q33","pk":"110_social","ans":"A","exp":"砍伐、焚燒樹木再種植、幾年後遷移的方式叫刀耕火種，常見於熱帶雨林地區，例如印尼的蘇門答臘島。(B)尼羅河三角洲是灌溉農業；(C)拉布拉多高原和(D)西伯利亞山地氣候寒冷，不適合這種耕作。"},{"id":"110-social-34","y":"110","n":34,"img":"110_social_q34","pk":"110_social","ans":"D","exp":"風向頻率圖中，全年平均和1月都是偏北風出現最多，主要風向是北風。通風廊道要與盛行風向一致，才能把外面的空氣引入城市，所以走向應大致南北向，(D)最符合。"},{"id":"110-social-35","y":"110","n":35,"img":"110_social_q35","pk":"110_social","ans":"D"},{"id":"110-social-36","y":"110","n":36,"img":"110_social_q36","pk":"110_social","ans":"C","exp":"拿破崙向外擴張，征服歐洲，1806年神聖羅馬帝國瓦解；被占領地區的民族意識因此受到激發；他占領西班牙，也讓拉丁美洲趁機爭取獨立。(A)(B)不會造成神聖羅馬帝國瓦解。"},{"id":"110-social-37","y":"110","n":37,"img":"110_social_q37","pk":"110_social","ans":"C"},{"id":"110-social-38","y":"110","n":38,"img":"110_social_q38","pk":"110_social","ans":"C"},{"id":"110-social-39","y":"110","n":39,"img":"110_social_q39","pk":"110_social","ans":"D"},{"id":"110-social-40","y":"110","n":40,"img":"110_social_q40","pk":"110_social","ans":"B","exp":"陣營一有奧匈帝國、鄂圖曼土耳其和保加利亞，陣營二有英、法、義大利，是第一次世界大戰的同盟國與協約國。同盟國最主要的成員是德國（甲）；協約國中軍事死亡人數也很多的是俄國（乙）。"},{"id":"110-social-41","y":"110","n":41,"img":"110_social_q41","pk":"110_social","ans":"C","exp":"1926年臺灣在日本統治下，所謂「國內」是指日本帝國的範圍，包含殖民地朝鮮，而當時首爾稱京城，所以可能包括京城的動物園。(A)上海屬中國；(B)馬尼拉當時是美國殖民地；(D)巴達維亞是荷蘭殖民地。"},{"id":"110-social-42","y":"110","n":42,"img":"110_social_q42","pk":"110_social","ans":"B","exp":"新聞說相關單位決定「提起公訴」，也就是由檢察官負責偵查並代表國家起訴。(A)大法官負責解釋憲法，不審理一般案件；(C)消保官不負責追訴犯罪；(D)書記官的工作是協助法官處理訴訟文書，不是協助業者調解。"},{"id":"110-social-43","y":"110","n":43,"img":"110_social_q43","pk":"110_social","ans":"B"},{"id":"110-social-44","y":"110","n":44,"img":"110_social_q44","pk":"110_social","ans":"A","exp":"停車費率用高價促使車主縮短停車時間，運用的是價格影響需求量的概念。(A)全店半價促銷，是用降價讓購買量增加，同樣是價格影響需求量。(B)是通貨膨脹；(C)是公司營收和利潤；(D)是價格下跌使供給減少，是供給面的反應。"},{"id":"110-social-45","y":"110","n":45,"img":"110_social_q45","pk":"110_social","ans":"D","exp":"外部成本是指某人的行為使旁人受害，卻沒有負擔代價。乙的深夜噪音讓鄰居睡不著，丁的油煙味影響樓下住戶，都屬於外部成本。(甲)(丙)是別人行為帶來的好處，屬於外部效益，不是成本。"},{"id":"110-social-46","y":"110","n":46,"img":"110_social_q46","pk":"110_social","ans":"C"},{"id":"110-social-47","y":"110","n":47,"img":"110_social_q47","pk":"110_social","ans":"A"},{"id":"110-social-48","y":"110","n":48,"img":"110_social_q48","pk":"110_social","ans":"D","exp":"表中有候選人得票和政黨得票，同時有區域候選人與政黨票，是立法委員選舉。立法委員有權提出總統、副總統的彈劾案。(A)公布法律、命令是總統的職權；(B)編列中央政府預算是行政院的工作；(C)質詢的對象是行政院，不是地方政府。"},{"id":"110-social-49","y":"110","n":49,"img":"110_social_q49","pk":"110_social","ans":"A"},{"id":"110-social-50","y":"110","n":50,"img":"110_social_q50","pk":"110_social","ans":"D","exp":"內閣制組閣需要在國會取得過半席次支持。(A)(B)(C)中，最大黨席次都超過50%，可以自己組閣；只有(D)最大黨約44%，沒有任何政黨過半，才可能需要聯合政府卻談不攏。"},{"id":"110-social-51","y":"110","n":51,"img":"110_social_q51","pk":"110_social","ans":"B"},{"id":"110-social-52","y":"110","n":52,"img":"110_social_q52","pk":"110_social","ans":"A"},{"id":"110-social-53","y":"110","n":53,"img":"110_social_q53","pk":"110_social","ans":"B","exp":"由資政院起草、皇帝頒布憲法，強調皇帝神聖不可侵犯、人民權利很少，是清末預備立憲所推行的做法，所以是清朝政府。(A)(D)沒有「皇帝」與「國會」的制度；(C)1947年國民政府的憲法重視民主與人民權利。"},{"id":"110-social-54","y":"110","n":54,"img":"110_social_q54","pk":"110_social","ans":"B","exp":"世界新生兒性別比約106，甲國高達114，明顯偏高，代表可能偏好男孩而用人工方式選擇性別，反映重男輕女的觀念。(A)戰亂與(C)多元性別尊重不會讓男嬰比例異常偏高；(D)母系社會也不會造成這種偏男現象。"},{"id":"110-social-55","y":"110","n":55,"img":"110_social_q55","pk":"110_social","ans":"C"},{"id":"110-social-56","y":"110","n":56,"img":"110_social_q56","pk":"110_social","ans":"A","pimg":"110_social_p56","grp":"110-social-56～57"},{"id":"110-social-57","y":"110","n":57,"img":"110_social_q57","pk":"110_social","ans":"B","pimg":"110_social_p56","grp":"110-social-56～57"},{"id":"110-social-58","y":"110","n":58,"img":"110_social_q58","pk":"110_social","ans":"C","pimg":"110_social_p58","grp":"110-social-58～60"},{"id":"110-social-59","y":"110","n":59,"img":"110_social_q59","pk":"110_social","ans":"B","pimg":"110_social_p58","grp":"110-social-58～60","exp":"文中說多數目擊地點在中央山脈南段的山區，這一帶是魯凱族和排灣族的主要分布地。(A)布農族、鄒族在中部和阿里山；(C)泰雅族、賽夏族在北部山區；(D)太魯閣族、阿美族在花蓮一帶。"},{"id":"110-social-60","y":"110","n":60,"img":"110_social_q60","pk":"110_social","ans":"A","pimg":"110_social_p58","grp":"110-social-58～60"},{"id":"110-social-61","y":"110","n":61,"img":"110_social_q61","pk":"110_social","ans":"C","pimg":"110_social_p61","grp":"110-social-61～63","exp":"文中的聯合國糧農組織是全球性、由各國政府組成的國際組織；世界貿易組織也是遍及全球、由各國政府組成。(A)歐洲聯盟是區域性組織；(B)世界展望會和(D)國際綠色和平組織是民間的非政府組織。"},{"id":"110-social-62","y":"110","n":62,"img":"110_social_q62","pk":"110_social","ans":"C","pimg":"110_social_p61","grp":"110-social-61～63"},{"id":"110-social-63","y":"110","n":63,"img":"110_social_q63","pk":"110_social","ans":"D","pimg":"110_social_p61","grp":"110-social-61～63"},{"id":"111-social-1","y":"111","n":1,"img":"111_social_q01","pk":"111_social","ans":"C"},{"id":"111-social-2","y":"111","n":2,"img":"111_social_q02","pk":"111_social","ans":"B","exp":"題目說該地位於板塊交界和海岸山脈最南端，泥岩惡地是臺東利吉一帶的特色，也就是乙。(A)甲在東北角，(C)丙在恆春半島，(D)丁雖在臺南也有泥岩，但不在海岸山脈最南端，也不是板塊交界。"},{"id":"111-social-3","y":"111","n":3,"img":"111_social_q03","pk":"111_social","ans":"C","exp":"夏季東南季風帶來水氣，東南沿海濕熱；往西北深入內陸，離海越來越遠，水氣變少，轉為乾熱，所以是由東南指向西北的丙。其他路線的方向不是由沿海走向內陸乾燥區。"},{"id":"111-social-4","y":"111","n":4,"img":"111_social_q04","pk":"111_social","ans":"A"},{"id":"111-social-5","y":"111","n":5,"img":"111_social_q05","pk":"111_social","ans":"D","exp":"圖中要求報紙不必事先登記、不必事先檢查，是在爭取出版與言論自由。這些限制是戒嚴時期的報禁，所以訴求與消弭戒嚴體制對人權的限制有關。(A)是國會全面改選；(B)是二二八事件；(C)是國語運動，都和報禁無關。"},{"id":"111-social-6","y":"111","n":6,"img":"111_social_q06","pk":"111_social","ans":"B","exp":"戶籍上記載每戶的人口、年齡和性別，目的是掌握人力，作為徵收賦稅和徵調勞役的依據。建初十二年是西元416年，屬南北朝時期。(A)科舉要到隋唐才出現；(C)(D)與登記戶口的目的無關。"},{"id":"111-social-7","y":"111","n":7,"img":"111_social_q07","pk":"111_social","ans":"C"},{"id":"111-social-8","y":"111","n":8,"img":"111_social_q08","pk":"111_social","ans":"C"},{"id":"111-social-9","y":"111","n":9,"img":"111_social_q09","pk":"111_social","ans":"B","exp":"廟方違法擴建、侵占國土，卻以神明指示為由拒絕拆除，衝突在於國家法律規定與宗教信仰。(D)看似合理，但這裡被處罰的原因是違反法令，不是政府侵犯人民的財產權。"},{"id":"111-social-10","y":"111","n":10,"img":"111_social_q10","pk":"111_social","ans":"C"},{"id":"111-social-11","y":"111","n":11,"img":"111_social_q11","pk":"111_social","ans":"B"},{"id":"111-social-12","y":"111","n":12,"img":"111_social_q12","pk":"111_social","ans":"A","exp":"圖中越晚出生的女性，一生累積的生育數越少，代表少子化。要讓人口結構維持穩定，就要鼓勵生育，所以提高幼兒教育補助最合適。(B)會讓生育更少；(C)(D)並不能提高出生人數。"},{"id":"111-social-13","y":"111","n":13,"img":"111_social_q13","pk":"111_social","ans":"B","exp":"我國國籍採屬人主義，看父母的國籍，不看出生地，所以李大賢雖然生在臺中，但父母都是美國籍，就不曾有我國國籍。王大軒和林小潔父母是中華民國國籍；陳小涵能擔任市議員，必須具備我國國籍，所以是曾經取得過。"},{"id":"111-social-14","y":"111","n":14,"img":"111_social_q14","pk":"111_social","ans":"C"},{"id":"111-social-15","y":"111","n":15,"img":"111_social_q15","pk":"111_social","ans":"D"},{"id":"111-social-16","y":"111","n":16,"img":"111_social_q16","pk":"111_social","ans":"C","exp":"圖中原始森林面積逐年縮小。開發森林造成野生動物的棲地被破壞而減少，趨勢與森林相同；(A)(B)(D)油田、聚落、熱帶作物都是隨開發而增加，趨勢相反。"},{"id":"111-social-17","y":"111","n":17,"img":"111_social_q17","pk":"111_social","ans":"B"},{"id":"111-social-18","y":"111","n":18,"img":"111_social_q18","pk":"111_social","ans":"C"},{"id":"111-social-19","y":"111","n":19,"img":"111_social_q19","pk":"111_social","ans":"C","exp":"歷史事實是客觀、可以查證的事件：在皇宮空地搭突厥帳篷、穿突厥可汗的服飾、用佩刀割羊肉，是具體行為，所以選丙。(甲)(乙)(丁)中的「熱情」「傑出的模仿者」「很有限」都帶有評價或推測，屬於歷史解釋。"},{"id":"111-social-20","y":"111","n":20,"img":"111_social_q20","pk":"111_social","ans":"A"},{"id":"111-social-21","y":"111","n":21,"img":"111_social_q21","pk":"111_social","ans":"B","exp":"葡萄牙天主教徒到日本傳教貿易，是在十六世紀大航海時代，西方國家開拓新航線來到東方的背景下發生的。(A)是十九世紀中葉；(C)是隋唐時期；(D)是冷戰時期，都不是葡萄牙人來日本的時代。"},{"id":"111-social-22","y":"111","n":22,"img":"111_social_q22","pk":"111_social","ans":"D","exp":"列寧領導的布爾什維克黨主張退出戰爭。德國當時與俄國正在第一次世界大戰中作戰，讓列寧回國，是希望俄國發生革命而退出戰爭，德國就可以集中兵力在西線。(A)拿破崙是十九世紀初；(B)冷戰在二戰後；(C)德蘇互不侵犯條約是1939年。"},{"id":"111-social-23","y":"111","n":23,"img":"111_social_q23","pk":"111_social","ans":"D","exp":"甲國要求記者通過效忠領袖思想的考試才能拿到記者證，目的是控管記者的思想，影響民眾看到的新聞。(A)(B)與新聞自由指數長期排名接近倒數不符；(C)圖中記者證數量2020年反而大增，不是削減。"},{"id":"111-social-24","y":"111","n":24,"img":"111_social_q24","pk":"111_social","ans":"B"},{"id":"111-social-25","y":"111","n":25,"img":"111_social_q25","pk":"111_social","ans":"C"},{"id":"111-social-26","y":"111","n":26,"img":"111_social_q26","pk":"111_social","ans":"B","exp":"圖中鐵路穿越瑞士阿爾卑斯山區，全長約291公里，海拔大多在1000公尺以上，中途還翻越高山、再下降又上升，只有(B)的曲線符合。(A)是平地；(C)一路上升；(D)低於海平面，不可能在山區。"},{"id":"111-social-27","y":"111","n":27,"img":"111_social_q27","pk":"111_social","ans":"D"},{"id":"111-social-28","y":"111","n":28,"img":"111_social_q28","pk":"111_social","ans":"D"},{"id":"111-social-29","y":"111","n":29,"img":"111_social_q29","pk":"111_social","ans":"D","exp":"依定義，要比「歷年最暖月」的最高氣溫平均值高5℃以上。臺北最暖月是7月，平均最高氣溫34.3℃，34.3加5是39.3℃，所以要連續5天出現39.3℃以上才算熱浪。(A)(B)(C)是用了其他月份或沒加5℃。"},{"id":"111-social-30","y":"111","n":30,"img":"111_social_q30","pk":"111_social","ans":"B","exp":"「中華民國成立紀念」、國民黨黨旗與國旗飄揚，又提到抵制日貨、勿忘國恥，是1928年國民政府統一全國後的十年建設時期。(A)自強運動時還沒有中華民國；(C)(D)是中華人民共和國時期，不會懸掛國民黨黨旗。"},{"id":"111-social-31","y":"111","n":31,"img":"111_social_q31","pk":"111_social","ans":"D","exp":"第II階段（約1650到1675年）對日本、馬尼拉、南洋的貿易額都大幅下降，這時鄭氏在東南沿海與清廷對抗，清廷實施海禁與遷界，使貿易受阻。(A)(B)(C)時間或內容都與這段貿易驟減不符。"},{"id":"111-social-32","y":"111","n":32,"img":"111_social_q32","pk":"111_social","ans":"A","exp":"謝先生違反保護令，被判拘役，是刑事責任，他必須自己負責。(B)保護令是由法院核發，不是警察局；(C)刑事判決不服應向上級法院上訴，不是提起民事訴訟；(D)《性別平等教育法》規範的是校園，不適用於此。"},{"id":"111-social-33","y":"111","n":33,"img":"111_social_q33","pk":"111_social","ans":"A"},{"id":"111-social-34","y":"111","n":34,"img":"111_social_q34","pk":"111_social","ans":"D"},{"id":"111-social-35","y":"111","n":35,"img":"111_social_q35","pk":"111_social","ans":"D","exp":"到調解委員會調解，經法院核定後與確定判決有相同效力，既能解決糾紛又不必走訴訟，符合「紓解訟源」。(A)訴願是向上級機關申訴行政處分；(B)偷竊是刑事案件；(C)私下和解沒有與判決相同的效力。"},{"id":"111-social-36","y":"111","n":36,"img":"111_social_q36","pk":"111_social","ans":"D","exp":"機會成本是做選擇時放棄的最好選項的價值。大華最在意就近，小年最在意價格低；大華去離家較遠的乙商店，就放棄了近的方便；小年去售價較高的甲商店，就放棄了便宜的價格，所以兩人去對方在意的反面那家，機會成本較高。"},{"id":"111-social-37","y":"111","n":37,"img":"111_social_q37","pk":"111_social","ans":"C","exp":"文中批評政府假借預備立憲、搜刮錢財、出賣鐵路權又不保護人民，顯示對清廷改革徹底失望，因此體認到革命也是救國的方法。(A)是自強運動；(B)是戊戌變法；(D)是新文化運動，與文中批評清廷的內容不符。"},{"id":"111-social-38","y":"111","n":38,"img":"111_social_q38","pk":"111_social","ans":"C"},{"id":"111-social-39","y":"111","n":39,"img":"111_social_q39","pk":"111_social","ans":"C"},{"id":"111-social-40","y":"111","n":40,"img":"111_social_q40","pk":"111_social","ans":"D"},{"id":"111-social-41","y":"111","n":41,"img":"111_social_q41","pk":"111_social","ans":"B"},{"id":"111-social-42","y":"111","n":42,"img":"111_social_q42","pk":"111_social","ans":"D","exp":"甲國出口到乙國，進口來自丙國。要讓出口和進口都大增，甲國貨幣要相對乙國貶值，讓產品在乙國變便宜；同時相對丙國升值，讓從丙國進口變便宜，所以選(D)。"},{"id":"111-social-43","y":"111","n":43,"img":"111_social_q43","pk":"111_social","ans":"A"},{"id":"111-social-44","y":"111","n":44,"img":"111_social_q44","pk":"111_social","ans":"B","pimg":"111_social_p44","grp":"111-social-44～45","exp":"1855年臺灣尚未依條約開港（要到1858年天津條約後才開港），所以裕鐸說洋船不得直接在安平停泊。但官員私下允許洋船在打狗貿易，實際上已有洋商來臺貿易。"},{"id":"111-social-45","y":"111","n":45,"img":"111_social_q45","pk":"111_social","ans":"B","pimg":"111_social_p44","grp":"111-social-44～45","exp":"英國商人說，是府城泉州人組成的商人團體（郊）向福建巡撫告狀，指控外商收購物產使物價上漲，影響本地商人生意，所以府城商人藉「郊」來維護自身利益。(D)與文意相反，郊是在反對洋行，不是與洋行合作。"},{"id":"111-social-46","y":"111","n":46,"img":"111_social_q46","pk":"111_social","ans":"A","pimg":"111_social_p46","grp":"111-social-46～48"},{"id":"111-social-47","y":"111","n":47,"img":"111_social_q47","pk":"111_social","ans":"A","pimg":"111_social_p46","grp":"111-social-46～48"},{"id":"111-social-48","y":"111","n":48,"img":"111_social_q48","pk":"111_social","ans":"B","pimg":"111_social_p46","grp":"111-social-46～48","exp":"「墩」代表位在某一地物或水體的旁邊。圖二十五、二十六顯示家鄉旁有水體，所以地名最可能是潭墩。(A)海墩要靠海；(C)岸壁墩要有岸壁；(D)黑礁墩要有礁石，圖中都沒有這些地貌。"},{"id":"111-social-49","y":"111","n":49,"img":"111_social_q49","pk":"111_social","ans":"C","pimg":"111_social_p49","grp":"111-social-49～51"},{"id":"111-social-50","y":"111","n":50,"img":"111_social_q50","pk":"111_social","ans":"D","pimg":"111_social_p49","grp":"111-social-49～51"},{"id":"111-social-51","y":"111","n":51,"img":"111_social_q51","pk":"111_social","ans":"C","pimg":"111_social_p49","grp":"111-social-49～51"},{"id":"111-social-52","y":"111","n":52,"img":"111_social_q52","pk":"111_social","ans":"A","pimg":"111_social_p52","grp":"111-social-52～54"},{"id":"111-social-53","y":"111","n":53,"img":"111_social_q53","pk":"111_social","ans":"B","pimg":"111_social_p52","grp":"111-social-52～54","exp":"西歐盛行西風，空氣汙染物會被吹向汙染源的下風處，也就是東邊。低技術勞動階級被迫住在汙染嚴重的地方，所以最可能在汙染源東邊的乙。"},{"id":"111-social-54","y":"111","n":54,"img":"111_social_q54","pk":"111_social","ans":"A","pimg":"111_social_p52","grp":"111-social-52～54","exp":"文中描述資本家與勞動階級居住區因貧富差距而不同，勞動階級被迫住在汙染區，恩格斯為此不平。這種關心勞動階級、反對貧富不公的思想屬於社會主義。(B)(C)(D)關心的是民族、侵略擴張與極權統治，不是貧富居住差距。"},{"id":"112-social-1","y":"112","n":1,"img":"112_social_q01","pk":"112_social","ans":"C"},{"id":"112-social-2","y":"112","n":2,"img":"112_social_q02","pk":"112_social","ans":"D"},{"id":"112-social-3","y":"112","n":3,"img":"112_social_q03","pk":"112_social","ans":"A"},{"id":"112-social-4","y":"112","n":4,"img":"112_social_q04","pk":"112_social","ans":"A","exp":"2010年幼年人口比例是16.60%，2020年回升到17.95%，代表出生人口增加。中國在2016年開放生育第二胎，是造成微幅回升的原因。(B)一胎化政策會讓幼年比例持續下降；(C)(D)與2010至2020年的小幅回升無關。"},{"id":"112-social-5","y":"112","n":5,"img":"112_social_q05","pk":"112_social","ans":"A"},{"id":"112-social-6","y":"112","n":6,"img":"112_social_q06","pk":"112_social","ans":"C"},{"id":"112-social-7","y":"112","n":7,"img":"112_social_q07","pk":"112_social","ans":"C","exp":"甲約在1815年前後（拿破崙戰爭）、乙約在1870年（普法戰爭）、丙約在1914至1918年（第一次世界大戰）、丁約在1939至1945年（第二次世界大戰），都是壽命突然下降的年份。這些戰爭讓大量青壯年死亡，所以平均壽命驟降。(A)(B)(D)都不符合這四個時間點。"},{"id":"112-social-8","y":"112","n":8,"img":"112_social_q08","pk":"112_social","ans":"D","exp":"李科羅返回廈門時，當地新統治者是清朝，而鄭氏政權（國姓爺家族）與清帝國敵對，李科羅曾為鄭氏出使，擔心被清朝送往北京處置，所以趁亂逃亡。(A)(B)(C)的國家關係與這段背景無關。"},{"id":"112-social-9","y":"112","n":9,"img":"112_social_q09","pk":"112_social","ans":"C"},{"id":"112-social-10","y":"112","n":10,"img":"112_social_q10","pk":"112_social","ans":"C","exp":"領土包括領陸、領海與領空。圖中甲為陸地，乙為12浬以內的領海，丁、戊分別是甲、乙上方的領空。丙為12至200浬的專屬經濟海域，不屬於領土，其上空的己也不是領空。"},{"id":"112-social-11","y":"112","n":11,"img":"112_social_q11","pk":"112_social","ans":"B"},{"id":"112-social-12","y":"112","n":12,"img":"112_social_q12","pk":"112_social","ans":"D"},{"id":"112-social-13","y":"112","n":13,"img":"112_social_q13","pk":"112_social","ans":"A"},{"id":"112-social-14","y":"112","n":14,"img":"112_social_q14","pk":"112_social","ans":"B","exp":"「水落魚梁淺」是水位變低而露出沙洲，這是河流在乾季（枯水期）水量減少的現象，也就是季節性降水差異造成的水位變化。(A)襄陽不靠冰融補水；(C)襄陽在內陸，不會因海水入侵變化；(D)唐代並無大型堤壩。"},{"id":"112-social-15","y":"112","n":15,"img":"112_social_q15","pk":"112_social","ans":"A","exp":"臺灣不是CPTPP成員國，出口到成員國越南時要面對關稅，而成員之間的貿易關稅階段性取消，臺灣商品就會處於關稅劣勢。(B)(C)的雙方都是成員國，關稅降低反而有利；(D)印度不是成員國。"},{"id":"112-social-16","y":"112","n":16,"img":"112_social_q16","pk":"112_social","ans":"C","exp":"玻里尼西亞位於南太平洋，緯度應為南緯、經度應為西經，只有(C)南緯16.84度、西經151.37度符合，位置在大溪地一帶。(A)在北半球的西非；(B)在北半球的東亞內陸；(D)在南美洲南部，不屬於玻里尼西亞。"},{"id":"112-social-17","y":"112","n":17,"img":"112_social_q17","pk":"112_social","ans":"A","exp":"淡水、雞籠開港通商是在1860年代，大稻埕因此成為茶葉的集散出口中心，周成從事新興商品出口而致富，應是茶葉。(B)鹿皮是荷治時期的出口品；(C)蔗糖主要產在南部；(D)鴉片是進口品。"},{"id":"112-social-18","y":"112","n":18,"img":"112_social_q18","pk":"112_social","ans":"A"},{"id":"112-social-19","y":"112","n":19,"img":"112_social_q19","pk":"112_social","ans":"D","exp":"圖中有許多警察官吏駐在所，還發現炮臺、機槍陣地，顯示這條道路是日治時期為了控制山區原住民而開闢的警備道路，與理蕃政策有關。(A)劃界封山是清代政策；(B)(C)與山區步道無關。"},{"id":"112-social-20","y":"112","n":20,"img":"112_social_q20","pk":"112_social","ans":"A","exp":"文中的人是張學良，因與蔣中正的意見衝突，決定以武力拘禁他，這是1936年的西安事變。張學良的主張是停止內戰、聯合各黨派抗日。(D)攘外必先安內正是蔣中正的主張，與張學良相反。"},{"id":"112-social-21","y":"112","n":21,"img":"112_social_q21","pk":"112_social","ans":"B","exp":"題目討論遷都婆羅洲的好處（改善雅加達問題），同時也要考慮破壞紅毛猩猩棲地的代價，也就是做了這個選擇後放棄的其他價值，這是機會成本的概念。(A)(C)(D)文中都沒有談到。"},{"id":"112-social-22","y":"112","n":22,"img":"112_social_q22","pk":"112_social","ans":"D"},{"id":"112-social-23","y":"112","n":23,"img":"112_social_q23","pk":"112_social","ans":"B","exp":"圖中兩個灰色時期，收入最低20%家庭的可支配所得成長率都掉到負值（約-
