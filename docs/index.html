<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>會考練習卷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: exam booklet on the left, a sticky red-ink answer card (答案卡) on the right; on phones the card becomes a bottom bar. */
:root{
  --paper:#f3f5f7; --sheet:#ffffff; --ink:#1c2230; --muted:#5d6676; --rule:#d9dee5;
  --red:#c5303f; --red-soft:#fbe9eb; --graphite:#23262b; --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#b4541a;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#13161b; --sheet:#1c2027; --ink:#e6e9ef; --muted:#9aa3b2; --rule:#2e343e;
  --red:#ef6b79; --red-soft:#3a1d22; --graphite:#e6e9ef; --ok:#5fcf94; --ok-soft:#173326; --warn:#f0a06a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13161b; --sheet:#1c2027; --ink:#e6e9ef; --muted:#9aa3b2; --rule:#2e343e;
  --red:#ef6b79; --red-soft:#3a1d22; --graphite:#e6e9ef; --ok:#5fcf94; --ok-soft:#173326; --warn:#f0a06a; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;border-bottom:2px solid var(--red);padding-bottom:10px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;margin-left:10px}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--red)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 18px;padding-bottom:4px}
nav.tabs button{flex:0 0 auto;font:inherit;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:96px}
nav.tabs button b{font-family:var(--f-display);font-size:17px}
nav.tabs button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"]{border-color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}
nav.tabs button:focus-visible,.bub:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.note{font-size:13.5px;color:var(--muted);background:var(--sheet);border:1px dashed var(--rule);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.section-h{font-family:var(--f-display);font-size:18px;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.section-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.passage{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--muted);border-radius:6px;padding:12px;margin:22px 0 10px}
.passage .lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 12px 10px;margin-bottom:12px;scroll-margin-top:16px}
.q.wrong{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.q.right{border-color:var(--ok)}
.imgbox{background:#fff;border-radius:3px;overflow-x:auto}
.imgbox img{display:block;width:100%;max-width:760px;height:auto}
.choices{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule)}
.choices .qn{font-family:var(--f-mono);font-weight:600;color:var(--red);min-width:30px}
.bub{font:600 15px var(--f-mono);width:48px;height:32px;border-radius:50%;border:1.6px solid var(--red);background:transparent;color:var(--red);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.bub[aria-pressed="true"]{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.bub.is-ans{box-shadow:0 0 0 3px var(--ok);border-color:var(--ok)}
.bub:disabled{cursor:default}
.verdict{font-size:13.5px;font-weight:700;margin-left:auto}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--red)} .verdict.skip{color:var(--warn)}
.exp{margin-top:10px;border-top:1px dashed var(--rule);padding-top:8px}
.exp summary{cursor:pointer;font-weight:700;color:var(--ok);font-size:14px}
.exp summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.exp-body{margin:8px 0 6px;line-height:1.75;max-width:70ch}
.exp-body b{color:var(--ok);margin-right:2px}
.exp-meta{margin:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
.papers{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline}
.chip span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.chip[aria-selected="true"] span{color:var(--sheet);opacity:.8}
.chip.ak{border-style:dashed}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.qhead{margin-bottom:8px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:1px 8px}
.tag.ak{color:var(--ok);border-color:var(--ok);border-style:dashed}
.txt{font-size:16px;line-height:1.8;max-width:72ch}
.txt p{margin:0 0 6px}
.stem b{font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.opts{list-style:none;margin:4px 0 0;padding:0 0 0 1.6em;display:grid;gap:2px}
.opts span{font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.passage .txt{padding:4px 6px}
aside.card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--sheet);border:1.5px solid var(--red);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
.card h2{margin:0;font-family:var(--f-display);font-size:17px;color:var(--red);letter-spacing:.1em}
.timer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer .t{font:600 26px var(--f-mono);font-variant-numeric:tabular-nums}
.timer .t.over{color:var(--red)}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;border:1.5px solid var(--red);background:var(--sheet);color:var(--red)}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{font:500 12.5px var(--f-mono);border:1px solid var(--rule);border-radius:5px;padding:4px 0;text-align:center;background:transparent;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.cell.done{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.cell.no{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.cell.skip{color:var(--warn);border-color:var(--warn)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score{border-top:1px dashed var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.score .big{display:flex;align-items:baseline;gap:10px}
.score .num{font:600 30px var(--f-mono)}
.score .grade{font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--red)}
.score small{color:var(--muted);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.confirm{font-size:13px;background:var(--red-soft);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.mbar{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.card{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:12px 12px 0 0;max-height:70vh;z-index:20;border-width:1.5px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(calc(100% - 64px - env(safe-area-inset-bottom,0px)));transition:transform .2s}
  aside.card.open{transform:none}
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
  .card h2{display:none}
  .bub{width:52px;height:36px}
}
@media (prefers-reduced-motion:reduce){aside.card{transition:none}}
.panel{display:none}.panel.on{display:block}
.home{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px}
.box h3{margin:0 0 8px;font-family:var(--f-display);font-size:18px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:4px 0 14px}
.stat b{display:block;font:600 26px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.red b{color:var(--red)}
.big-actions{display:flex;flex-wrap:wrap;gap:10px}
.big-actions .btn{padding:12px 18px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--rule);font-variant-numeric:tabular-nums}
.hist li:last-child{border-bottom:0}
.hist .m{color:var(--muted)}
.muted{color:var(--muted);font-size:13.5px}
textarea.code{width:100%;min-height:90px;font:12px var(--f-mono);border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);padding:8px;word-break:break-all}
.msg{font-size:13.5px;font-weight:700;color:var(--ok);min-height:1.2em}
.msg.err{color:var(--red)}
.qno{font:600 14px var(--f-mono);color:var(--red);margin-right:8px}
.streak{font-size:12px;font-weight:700;color:var(--warn);margin-left:6px}
.imgbox img{background:#fff;min-height:40px}
.imgbox img:not([src]){background:repeating-linear-gradient(90deg,#eef1f4 0 20px,#f7f8fa 20px 40px)}
.mode-tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--sheet);background:var(--red);border-radius:4px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.mode-tag.w{background:var(--warn)}
.result{background:var(--sheet);border:1.5px solid var(--red);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.result .num{font:600 30px var(--f-mono)}
.result .grade{font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--red);margin-left:10px}
.inline-confirm{display:none}.inline-confirm.on{display:flex}
@media print{aside.card,nav.tabs,header.top .src{display:none}}
</style>

</section>

_chinese_q44","pk":"110_chinese","ans":"D","pimg":"110_chinese_p44","grp":"110-chinese-44～45"},{"id":"110-chinese-45","y":"110","n":45,"img":"110_chinese_q45","pk":"110_chinese","ans":"A","pimg":"110_chinese_p44","grp":"110-chinese-44～45"},{"id":"110-chinese-46","y":"110","n":46,"img":"110_chinese_q46","pk":"110_chinese","ans":"D","pimg":"110_chinese_p46","grp":"110-chinese-46～48"},{"id":"110-chinese-47","y":"110","n":47,"img":"110_chinese_q47","pk":"110_chinese","ans":"C","pimg":"110_chinese_p46","grp":"110-chinese-46～48"},{"id":"110-chinese-48","y":"110","n":48,"img":"110_chinese_q48","pk":"110_chinese","ans":"D","pimg":"110_chinese_p46","grp":"110-chinese-46～48"},{"id":"111-chinese-1","y":"111","n":1,"img":"111_chinese_q01","pk":"111_chinese","ans":"D"},{"id":"111-chinese-2","y":"111","n":2,"img":"111_chinese_q02","pk":"111_chinese","ans":"A","exp":"「杏林」指醫界，賀醫師開業要用和醫療、醫德有關的詞。「近悅遠來」稱讚店家、政績；「眾望所歸」用在選舉或領導人；「桃李芬芳」稱讚教育者；所以(A)君翰寫的「杏林之光」最恰當。"},{"id":"111-chinese-3","y":"111","n":3,"img":"111_chinese_q03","pk":"111_chinese","ans":"A"},{"id":"111-chinese-4","y":"111","n":4,"img":"111_chinese_q04","pk":"111_chinese","ans":"B","exp":"漢字字體演變順序是金文→小篆→隸書→楷書。第一個字圖案化、線條圓轉，是金文；第二個線條均勻細長，是小篆；第三個橫畫寬扁有波磔，是隸書；最後一個工整端正，是楷書。"},{"id":"111-chinese-5","y":"111","n":5,"img":"111_chinese_q05","pk":"111_chinese","ans":"D"},{"id":"111-chinese-6","y":"111","n":6,"img":"111_chinese_q06","pk":"111_chinese","ans":"C","exp":"「爆冷門」指結果出人意料，表示事前沒什麼人看好，和「各界看好」互相矛盾，所以(C)的說明錯誤。(A)主辦國、(B)轉輸為贏、(D)大勝都解釋正確。"},{"id":"111-chinese-7","y":"111","n":7,"img":"111_chinese_q07","pk":"111_chinese","ans":"C","exp":"句號用在一句話完整說完的地方。丙處前面「就算拼湊起來了也只算是死的標本，生命已蕩然無存」語意已完整，下一句才轉到「何況記憶…」，所以要用句號。甲、乙只是句中停頓，丁處是反問語氣，應用問號。"},{"id":"111-chinese-8","y":"111","n":8,"img":"111_chinese_q08","pk":"111_chinese","ans":"C"},{"id":"111-chinese-9","y":"111","n":9,"img":"111_chinese_q09","pk":"111_chinese","ans":"B"},{"id":"111-chinese-10","y":"111","n":10,"img":"111_chinese_q10","pk":"111_chinese","ans":"C","exp":"這段文字說靠假冒得來的名聲，終究經不起檢驗，到頭來一定失敗。(D)不切實際的夢想遇到現實就破滅，和「虛假終被戳破」相呼應。(A)是靠真本事成功；(B)談的是財物；(C)雖然也有作弊失敗，但重點在適應不良，與「名不符實被看穿」不同。"},{"id":"111-chinese-11","y":"111","n":11,"img":"111_chinese_q11","pk":"111_chinese","ans":"A"},{"id":"111-chinese-12","y":"111","n":12,"img":"111_chinese_q12","pk":"111_chinese","ans":"D","exp":"(D)「撒謊」「撒嬌」的「撒」都念ㄙㄚ。(A)哽咽ㄧㄝˋ、咽下ㄧㄢˋ；(B)悶不吭聲ㄎㄥ、引吭高歌ㄏㄤˊ；(C)禪機ㄔㄢˊ、禪讓ㄕㄢˋ，都不相同。"},{"id":"111-chinese-13","y":"111","n":13,"img":"111_chinese_q13","pk":"111_chinese","ans":"C"},{"id":"111-chinese-14","y":"111","n":14,"img":"111_chinese_q14","pk":"111_chinese","ans":"A","exp":"「矯思以為矢」的「矯」是矯正、使端直的意思，指把心思端正得像箭一樣。(A)「矯世勵俗」是矯正世風，意思相同；(B)(C)的「矯」是強健、靈活；(D)「矯託」是假託。"},{"id":"111-chinese-15","y":"111","n":15,"img":"111_chinese_q15","pk":"111_chinese","ans":"D","exp":"吉光片羽比喻殘存的珍貴文物，用在這裡很恰當。(A)車水馬龍形容道路上車多熱鬧，不是形容船；(B)別開生面是創新格局，不是不愛理人；(C)因噎廢食是因小問題就放棄做事，與認真讀書無關。"},{"id":"111-chinese-16","y":"111","n":16,"img":"111_chinese_q16","pk":"111_chinese","ans":"A"},{"id":"111-chinese-17","y":"111","n":17,"img":"111_chinese_q17","pk":"111_chinese","ans":"A","exp":"(B)「不屈不撓」和「妥協」互相矛盾；(C)「死不賴帳」應改成「死不認帳」，且不合句意；(D)「蔓延」的是疫情，不能「對抗意志力」，應是「對抗疫情」。只有(A)通順恰當。"},{"id":"111-chinese-18","y":"111","n":18,"img":"111_chinese_q18","pk":"111_chinese","ans":"A"},{"id":"111-chinese-19","y":"111","n":19,"img":"111_chinese_q19","pk":"111_chinese","ans":"B","exp":"寫成國字再比較。(B)斑駁陸離、斑爛奪目，都是「斑」。(A)杞人憂天、養尊處優，是「憂」和「優」；(C)自相矛盾是「矛」，茅塞頓開是「茅」；(D)細嚼慢嚥是「慢」，漫不經心是「漫」，都不同。"},{"id":"111-chinese-20","y":"111","n":20,"img":"111_chinese_q20","pk":"111_chinese","ans":"C"},{"id":"111-chinese-21","y":"111","n":21,"img":"111_chinese_q21","pk":"111_chinese","ans":"D","exp":"會意字是把兩個以上的字義組合成新義。「刪」由「刀」和「冊」組成，用刀削簡冊，正是會意。悶、弦、燈都是一邊表意、一邊表音的形聲字。"},{"id":"111-chinese-22","y":"111","n":22,"img":"111_chinese_q22","pk":"111_chinese","ans":"A","exp":"文中說學習像取水、教人像分火，水可以越取越多、火分出去也不減，所以善於學習的人不會限制自己容納的量，善於教導的人不會吝嗇自己的光亮。(A)「不自隘其器／不自吝其光」正好呼應。"},{"id":"111-chinese-23","y":"111","n":23,"img":"111_chinese_q23","pk":"111_chinese","ans":"B"},{"id":"111-chinese-24","y":"111","n":24,"img":"111_chinese_q24","pk":"111_chinese","ans":"A","exp":"文章開頭先說「世人」認為孫叔敖遇到楚莊王是幸運，接著說「有道者論之則不然」，指出這其實是楚國的幸運，這是先提出一般看法，再反駁。(D)順序顛倒；(B)(C)與文中結構不合。"},{"id":"111-chinese-25","y":"111","n":25,"img":"111_chinese_q25","pk":"111_chinese","ans":"D","exp":"乙表是107年的順位，甲說明與十年前(97年)比的升降。腦血管疾病、慢性肝病、蓄意自我傷害順位下降，表示97年排名比107年更前，所以(A)(B)(C)都能推出。肺炎、高血壓、腎臟疾病順位上升，97年排名更後，其中腎臟疾病107年是第9名，97年可能排到第10名以外，無法確定。"},{"id":"111-chinese-26","y":"111","n":26,"img":"111_chinese_q26","pk":"111_chinese","ans":"C","pimg":"111_chinese_p26","grp":"111-chinese-26～27"},{"id":"111-chinese-27","y":"111","n":27,"img":"111_chinese_q27","pk":"111_chinese","ans":"C","pimg":"111_chinese_p26","grp":"111-chinese-26～27","exp":"(A)咖啡機不在十項維修範圍內；(B)週三休診；(D)50元是工本費，不是特殊材料費，且特殊材料費是領回時才繳。(C)電子鍋屬於電鍋（含電子鍋），週六16:00在收件時間內，領件憑取貨聯單，內容相符。"},{"id":"111-chinese-28","y":"111","n":28,"img":"111_chinese_q28","pk":"111_chinese","ans":"D","pimg":"111_chinese_p28","grp":"111-chinese-28～29","exp":"(D)的「蟑螂」是主管說的、能在叢林中生存的對象，象徵適應力強、生命力頑強，不是指人品卑鄙惡劣，所以說明不恰當。(A)坑洞比喻挑戰；(B)方正直角是自己原本的稜角個性；(C)「紙」代表作者自己。"},{"id":"111-chinese-29","y":"111","n":29,"img":"111_chinese_q29","pk":"111_chinese","ans":"B","pimg":"111_chinese_p28","grp":"111-chinese-28～29"},{"id":"111-chinese-30","y":"111","n":30,"img":"111_chinese_q30","pk":"111_chinese","ans":"B","pimg":"111_chinese_p30","grp":"111-chinese-30～31","exp":"(B)乙句說經過長時間的警戒，人們的心腸變硬，連痛苦呻吟聲都不在意，是緊繃後的冷漠麻木。(A)甲是形容酷熱的陽光追著人跑，不是政府監控；(C)丙是熱和恐懼讓事情被誇大，不是政府假稱；(D)丁只是寫巡邏隊離開後的寂靜，沒有說刻意威嚇。"},{"id":"111-chinese-31","y":"111","n":31,"img":"111_chinese_q31","pk":"111_chinese","ans":"D","pimg":"111_chinese_p30","grp":"111-chinese-30～31","exp":"文中說政府「擔心發生最壞情況」，並考慮「萬一這群被困在疫病當中的民眾發生暴動」該採取什麼措施，可見最壞情況是民眾暴動。(A)(B)(C)文中只是氣氛或現象，不是政府擔心的最壞狀況。"},{"id":"111-chinese-32","y":"111","n":32,"img":"111_chinese_q32","pk":"111_chinese","ans":"C","pimg":"111_chinese_p32","grp":"111-chinese-32～33"},{"id":"111-chinese-33","y":"111","n":33,"img":"111_chinese_q33","pk":"111_chinese","ans":"B","pimg":"111_chinese_p32","grp":"111-chinese-32～33"},{"id":"111-chinese-34","y":"111","n":34,"img":"111_chinese_q34","pk":"111_chinese","ans":"C","pimg":"111_chinese_p34","grp":"111-chinese-34～35","exp":"文中說紙本書是最能讓我們學習、體會文字力量的媒介，同一首古詩印在紙本與電子書上氣場不同，感受也不同，所以價值是讓文字散發不同的渲染力。(A)(D)文中沒提；(B)紙本書是對應「黑夜」，並不是不受晝夜限制。"},{"id":"111-chinese-35","y":"111","n":35,"img":"111_chinese_q35","pk":"111_chinese","ans":"D","pimg":"111_chinese_p34","grp":"111-chinese-34～35","exp":"作者把網路閱讀比喻成白晝、紙本閱讀比喻成黑夜，白晝與黑夜都是人類需要的，所以兩者應該並存。(A)作者並不是要說數位不如紙本；(B)夜是白晝的對照，不是延伸；(C)圖表是用來比較兩種閱讀的特質，不是談無限發展。"},{"id":"111-chinese-36","y":"111","n":36,"img":"111_chinese_q36","pk":"111_chinese","ans":"B","pimg":"111_chinese_p36","grp":"111-chinese-36～38"},{"id":"111-chinese-37","y":"111","n":37,"img":"111_chinese_q37","pk":"111_chinese","ans":"B","pimg":"111_chinese_p36","grp":"111-chinese-36～38"},{"id":"111-chinese-38","y":"111","n":38,"img":"111_chinese_q38","pk":"111_chinese","ans":"A","pimg":"111_chinese_p36","grp":"111-chinese-36～38"},{"id":"111-chinese-39","y":"111","n":39,"img":"111_chinese_q39","pk":"111_chinese","ans":"D","pimg":"111_chinese_p39","grp":"111-chinese-39～40","exp":"乙文說鄧通錢的形制、文字、重量都和天子的四銖錢相同，吳錢則「微重」，也就是比天子錢稍重。所以重量是吳錢大於鄧通錢，鄧通錢等於四銖錢。"},{"id":"111-chinese-40","y":"111","n":40,"img":"111_chinese_q40","pk":"111_chinese","ans":"B","pimg":"111_chinese_p39","grp":"111-chinese-39～40","exp":"甲說四銖錢上鑄「半兩」字樣；乙說鄧通錢與天子四銖錢相同，吳錢與天子錢形制文字沒有不同，所以兩者都應有「半兩」。(A)英錢是更早的錢；(C)甲說鑄錢之禁是在吳、鄧錢布天下之後；(D)鄧通得銅山是在他鑄錢之前。"},{"id":"111-chinese-41","y":"111","n":41,"img":"111_chinese_q41","pk":"111_chinese","ans":"C","pimg":"111_chinese_p41","grp":"111-chinese-41～42","exp":"逐句找主語。(A)(B)的「病其…」「乃密令…」是王起；(D)「大怒而去」是門人；(C)「悉以實告」是白敏中把王起的安排全部告訴賀拔恭，所以主語是白敏中。"},{"id":"111-chinese-42","y":"111","n":42,"img":"111_chinese_q42","pk":"111_chinese","ans":"D","pimg":"111_chinese_p41","grp":"111-chinese-41～42","exp":"白敏中本來被安排要和賀拔恭絕交，卻在賀拔恭來訪時如實相告，不肯為了狀元背棄朋友。王起看到他重情義，才說原本只想取白敏中，現在還要取賀拔恭，所以是(C)。(A)(B)(D)文中都沒有這些內容。"},{"id":"112-chinese-1","y":"112","n":1,"img":"112_chinese_q01","pk":"112_chinese","ans":"D"},{"id":"112-chinese-2","y":"112","n":2,"img":"112_chinese_q02","pk":"112_chinese","ans":"D","exp":"「與其…不如…」是固定搭配，前面說不好的選擇，後面接比較好的選擇。(D)後句用「難道讓你犯錯懊悔」，語意不通，應改成「不如讓你…」。(A)(B)(C)的連接詞與用語都正確。"},{"id":"112-chinese-3","y":"112","n":3,"img":"112_chinese_q03","pk":"112_chinese","ans":"C","exp":"分號用在並列的分句之間。這段文字有兩組「有些…」並列，所以在第一組結束的「淪為遺忘」之後(丙)要用分號隔開；(甲)(乙)(丁)只是句中停頓，用逗號即可。"},{"id":"112-chinese-4","y":"112","n":4,"img":"112_chinese_q04","pk":"112_chinese","ans":"C","exp":"(A)「豈非」是反問語氣，和「驚訝」搭配不通順；(B)「並非我與他相識」與「絕不可能善罷甘休」語意不連貫；(D)「若非我故意…」與「你的做法不合理」前後不呼應。(C)「無非是」是「不過是」的意思，與「老生常談」搭配恰當。"},{"id":"112-chinese-5","y":"112","n":5,"img":"112_chinese_q05","pk":"112_chinese","ans":"D","exp":"逐項查音：(A)迄ㄑㄧˋ、屹ㄧˋ；(B)嵌ㄑㄧㄢˋ、坎ㄎㄢˇ；(C)寥ㄌㄧㄠˊ、謬ㄇㄧㄡˋ。(D)「囑」「矚」都念ㄓㄨˇ，讀音相同。"},{"id":"112-chinese-6","y":"112","n":6,"img":"112_chinese_q06","pk":"112_chinese","ans":"C"},{"id":"112-chinese-7","y":"112","n":7,"img":"112_chinese_q07","pk":"112_chinese","ans":"A"},{"id":"112-chinese-8","y":"112","n":8,"img":"112_chinese_q08","pk":"112_chinese","ans":"A","exp":"陽刻是凸起的部分沾上印泥，所以蓋出來的是有顏色的字、白色的底，因此(B)(D)黑底白字是陰刻的效果。另外隸書的橫畫有波磔，筆畫寬扁；(C)字體不是隸書，所以選(A)。"},{"id":"112-chinese-9","y":"112","n":9,"img":"112_chinese_q09","pk":"112_chinese","ans":"A","exp":"「版築」是古代築牆的方法，用來稱讚建築、營造方面的貢獻，不適合送給家具店。(B)貴客盈門適合飯店；(C)仁心仁術稱讚醫生；(D)桃李滿門稱讚教育工作者。"},{"id":"112-chinese-10","y":"112","n":10,"img":"112_chinese_q10","pk":"112_chinese","ans":"D"},{"id":"112-chinese-11","y":"112","n":11,"img":"112_chinese_q11","pk":"112_chinese","ans":"C","exp":"(A)應作「瑣碎」；(B)應作「陌生」；(D)應作「里程碑」。(C)「墊付」是先替人付錢，用字正確。"},{"id":"112-chinese-12","y":"112","n":12,"img":"112_chinese_q12","pk":"112_chinese","ans":"A","exp":"文中少室周讓出職位，趙簡子稱讚他「知賢而讓」，並說這種行為「可以為訓」，意思是可以當作大家學習的榜樣。所以「訓」是典範；(B)(C)(D)放進句子裡都不通順。"},{"id":"112-chinese-13","y":"112","n":13,"img":"112_chinese_q13","pk":"112_chinese","ans":"B"},{"id":"112-chinese-14","y":"112","n":14,"img":"112_chinese_q14","pk":"112_chinese","ans":"C","exp":"(A)「若即若離」是形容關係不遠不近，不是丟棄；(B)「急公好義」是熱心公益，並非莽撞；(D)「庸庸碌碌」是平庸無所作為，不是忙碌。(C)「幡然悔悟」是徹底醒悟悔改，與「痛改前非」相符。"},{"id":"112-chinese-15","y":"112","n":15,"img":"112_chinese_q15","pk":"112_chinese","ans":"B","exp":"乙詩寫「溪曲」「小雨」「鵝鴨」「桃花」，是在春天將盡時溪邊所見的景色。(A)「日西」是傍晚，不是清晨；(D)兩首的第一句也押韻（啼、西、堤；加、沙、花），不是只有偶句押韻。"},{"id":"112-chinese-16","y":"112","n":16,"img":"112_chinese_q16","pk":"112_chinese","ans":"D"},{"id":"112-chinese-17","y":"112","n":17,"img":"112_chinese_q17","pk":"112_chinese","ans":"A","exp":"甲圖說的是「過去12個月」內有18%的女性經歷過伴侶的暴力，沒有經歷的82%只是指這段期間，不能推論成「未曾遭受」。其他選項都符合圖表資料。"},{"id":"112-chinese-18","y":"112","n":18,"img":"112_chinese_q18","pk":"112_chinese","ans":"C"},{"id":"112-chinese-19","y":"112","n":19,"img":"112_chinese_q19","pk":"112_chinese","ans":"A"},{"id":"112-chinese-20","y":"112","n":20,"img":"112_chinese_q20","pk":"112_chinese","ans":"B","exp":"「酒賤常愁客少」是說酒雖然便宜，卻常擔心沒有客人來共飲，表達孤單寂寞，不是在說維持生計。(A)(C)(D)的解釋都符合詞意。"},{"id":"112-chinese-21","y":"112","n":21,"img":"112_chinese_q21","pk":"112_chinese","ans":"C","exp":"1886年出口額是240，1900年降為120，剛好是一半。(B)1886年市占約100%，所以歐洲總量約240；1900年占10%，總量約1200，反而增加；(A)(D)文中沒有提到。"},{"id":"112-chinese-22","y":"112","n":22,"img":"112_chinese_q22","pk":"112_chinese","ans":"D"},{"id":"112-chinese-23","y":"112","n":23,"img":"112_chinese_q23","pk":"112_chinese","ans":"D","exp":"文中說二人的話「當時已謂之工，傳之至今」，所以都受到時人稱讚。(A)(B)二人各記犬與馬兩方面；(C)當時的新風是不用對偶的平文，二人的用語並非崇尚對偶。"},{"id":"112-chinese-24","y":"112","n":24,"img":"112_chinese_q24","pk":"112_chinese","ans":"B","exp":"老水工怕移堤後沒有水患，大家就失去生計，才暗中叫同伴附和，所以水工們為了保生計而阻礙工程。(C)老水工是為了自己的利益，不是真的認為月堤無益；(D)杜偉長是被誤導，不是堅持造成水患。"},{"id":"112-chinese-25","y":"112","n":25,"img":"112_chinese_q25","pk":"112_chinese","ans":"D","pimg":"112_chinese_p25","grp":"112-chinese-25～26"},{"id":"112-chinese-26","y":"112","n":26,"img":"112_chinese_q26","pk":"112_chinese","ans":"A","pimg":"112_chinese_p25","grp":"112-chinese-25～26","exp":"詩中天氣從冷變暖，是由「突圍而出」變得明亮，象徵心情越來越輕鬆，而不是越來越沉重，所以(A)錯誤。(B)「暖暖」重複出現、(C)「暖暖」兼指地名與溫度、(D)最後預想「又鬱結起來」都符合本詩。"},{"id":"112-chinese-27","y":"112","n":27,"img":"112_chinese_q27","pk":"112_chinese","ans":"A","pimg":"112_chinese_p27","grp":"112-chinese-27～29"},{"id":"112-chinese-28","y":"112","n":28,"img":"112_chinese_q28","pk":"112_chinese","ans":"B","pimg":"112_chinese_p27","grp":"112-chinese-27～29"},{"id":"112-chinese-29","y":"112","n":29,"img":"112_chinese_q29","pk":"112_chinese","ans":"C","pimg":"112_chinese_p27","grp":"112-chinese-27～29","exp":"規則是去掉2個最高分與2個最低分，只算中間3位評審的分數。7、8、8、7、9、7、9排序後為7、7、7、8、8、9、9，去掉兩個7和兩個9，剩下7、8、8，再乘以難度係數3.0。"},{"id":"112-chinese-30","y":"112","n":30,"img":"112_chinese_q30","pk":"112_chinese","ans":"A","pimg":"112_chinese_p30","grp":"112-chinese-30～31"},{"id":"112-chinese-31","y":"112","n":31,"img":"112_chinese_q31","pk":"112_chinese","ans":"C","pimg":"112_chinese_p30","grp":"112-chinese-30～31"},{"id":"112-chinese-32","y":"112","n":32,"img":"112_chinese_q32","pk":"112_chinese","ans":"B","pimg":"112_chinese_p32","grp":"112-chinese-32～33"},{"id":"112-chinese-33","y":"112","n":33,"img":"112_chinese_q33","pk":"112_chinese","ans":"C","pimg":"112_chinese_p32","grp":"112-chinese-32～33","exp":"霍普賣月球土地給私人，認為私人可以擁有；艾維斯則說國家或私人企業都不能主張月球土地的所有權。兩人的歧見就是「私人能不能主張月球土地所有權」。"},{"id":"112-chinese-34","y":"112","n":34,"img":"112_chinese_q34","pk":"112_chinese","ans":"B","pimg":"112_chinese_p34","grp":"112-chinese-34～35"},{"id":"112-chinese-35","y":"112","n":35,"img":"112_chinese_q35","pk":"112_chinese","ans":"B","pimg":"112_chinese_p34","grp":"112-chinese-34～35"},{"id":"112-chinese-36","y":"112","n":36,"img":"112_chinese_q36","pk":"112_chinese","ans":"C","pimg":"112_chinese_p36","grp":"112-chinese-36～38"},{"id":"112-chinese-37","y":"112","n":37,"img":"112_chinese_q37","pk":"112_chinese","ans":"B","pimg":"112_chinese_p36","grp":"112-chinese-36～38"},{"id":"112-chinese-38","y":"112","n":38,"img":"112_chinese_q38","pk":"112_chinese","ans":"A","pimg":"112_chinese_p36","grp":"112-chinese-36～38","exp":"文中說畫面正中央是代表神權的十字架，但小銘的模擬圖把十字架畫在右側，位置錯誤。(B)加冕對象是皇后約瑟芬沒錯；(C)教皇舉起右手祝福沒錯；(D)母親出席是畫家虛構，也有畫出。"},{"id":"112-chinese-39","y":"112","n":39,"img":"112_chinese_q39","pk":"112_chinese","ans":"D","pimg":"112_chinese_p39","grp":"112-chinese-39～40"},{"id":"112-chinese-40","y":"112","n":40,"img":"112_chinese_q40","pk":"112_chinese","ans":"D","pimg":"112_chinese_p39","grp":"112-chinese-39～40","exp":"「遣所乘龍舟過海子召嵩」是派皇帝自己乘坐的龍舟去接嚴嵩，表示高規格的禮遇。(A)是門衛因嚴嵩沒有詔令而阻擋；(B)對泣的是嚴嵩和兒子；(C)陸炳誣告後，皇帝是追究已死的仇鸞，並非殺死毀謗的人。"},{"id":"112-chinese-41","y":"112","n":41,"img":"112_chinese_q41","pk":"112_chinese","ans":"B","pimg":"112_chinese_p41","grp":"112-chinese-41～42"},{"id":"112-chinese-42","y":"112","n":42,"img":"112_chinese_q42","pk":"112_chinese","ans":"D","pimg":"112_chinese_p41","grp":"112-chinese-41～42","exp":"「吞舟之魚不游支流，鴻鵠不集汙池」是說志向遠大的人不會屈就小地方。(D)「剖三寸之蚌，難得明月之珠」是說小地方出不了大人才，意思相近；(A)是過河拆橋，(B)是貪求美食而喪命，(C)是比喻速度差別。"},{"id":"113-chinese-1","y":"113","n":1,"img":"113_chinese_q01","pk":"113_chinese","ans":"D"},{"id":"113-chinese-2","y":"113","n":2,"img":"113_chinese_q02","pk":"113_chinese","ans":"D","exp":"(A)「衷」應作「終」，「所終」是最後的下落；(C)「誤」應作「物」，是「失物招領處」。「樹欲靜而風不止」與「盡孝要及時」用字都正確。"},{"id":"113-chinese-3","y":"113","n":3,"img":"113_chinese_q03","pk":"113_chinese","ans":"B"},{"id":"113-chinese-4","y":"113","n":4,"img":"113_chinese_q04","pk":"113_chinese","ans":"B","exp":"否定詞疊加時要先還原真正的問法。「是否同意禁止種植基因改造植物」，反對基因改造就該回答「同意」。(A)(C)(D)的立場和選擇都與題目的意思相反。"},{"id":"113-chinese-5","y":"113","n":5,"img":"113_chinese_q05","pk":"113_chinese","ans":"C"},{"id":"113-chinese-6","y":"113","n":6,"img":"113_chinese_q06","pk":"113_chinese","ans":"D","exp":"「月落星沉」的「落」是下沉、降下。(D)水位下降、石頭露出，「落」也是降下；(A)是著落，(B)是凋零，(C)是遺漏。"},{"id":"113-chinese-7","y":"113","n":7,"img":"113_chinese_q07","pk":"113_chinese","ans":"B","exp":"這段文字說人生走到艱難處，各人要各自尋找方向，重點是「路要自己走」。(D)與此相近；(B)要大家都樂觀面對，文中沒有這個意思，所以相去最遠。"},{"id":"113-chinese-8","y":"113","n":8,"img":"113_chinese_q08","pk":"113_chinese","ans":"C"},{"id":"113-chinese-9","y":"113","n":9,"img":"113_chinese_q09","pk":"113_chinese","ans":"B","exp":"文中說私人遠征隊比較成功，是因為少政治考量、主事者專心主導、成員各有專長。「大批補給裝備」是官方隊伍的缺點，不是私人隊的優點。"},{"id":"113-chinese-10","y":"113","n":10,"img":"113_chinese_q10","pk":"113_chinese","ans":"A","exp":"題目說〈瑯琊臺刻石〉是小篆，特色是筆畫圓轉、粗細均勻、結構匀稱。(A)線條最圓潤均勻，符合小篆；(B)是隸書一類，方折明顯；(D)是甲骨文，筆畫較細而尖。"},{"id":"113-chinese-11","y":"113","n":11,"img":"113_chinese_q11","pk":"113_chinese","ans":"C","exp":"(C)「鐵畫銀鉤」形容書法筆力剛健。(A)「妙筆生花」形容文章寫得好，不是演說；(B)「新鶯出谷」形容歌聲清脆，不是作文；(D)「口若懸河」才是形容演說。"},{"id":"113-chinese-12","y":"113","n":12,"img":"113_chinese_q12","pk":"113_chinese","ans":"C","exp":"詩中寫農民繳稅繁重、吃不飽，只能靠橡實過活，商人卻富貴奢侈，主旨是描寫農民的困苦。(A)這首不是律詩；(B)不是閒適詩；(D)重點是批評不公，不是凸顯人情可貴。"},{"id":"113-chinese-13","y":"113","n":13,"img":"113_chinese_q13","pk":"113_chinese","ans":"C","exp":"作者的意思是：遺忘讓人更能看見光照處，那些沒有被遺忘的才值得珍惜。(A)文中說遺忘「無須哀悼」，不是「無須遺忘」；(B)舞臺上的暗處才是遺忘；(D)是要把眼光投向光明，不是遺忘越多越能看見。"},{"id":"113-chinese-14","y":"113","n":14,"img":"113_chinese_q14","pk":"113_chinese","ans":"B","exp":"下闋首句「尋好夢，夢難成」，寫的是想在夢中和離人相見卻睡不著，不是為了追尋理想離開佳人，所以(B)錯誤。"},{"id":"113-chinese-15","y":"113","n":15,"img":"113_chinese_q15","pk":"113_chinese","ans":"C","exp":"文章說：話語內容和語調、表情不一致時，人們容易受語調和非語言行為影響。(C)說的是「謝謝」，卻臭著臉，大家會相信他的表情，正好符合。"},{"id":"113-chinese-16","y":"113","n":16,"img":"113_chinese_q16","pk":"113_chinese","ans":"D","exp":"(D)「就木」指快入棺材，形容人將死，使用恰當。(A)「五穀不分」是形容缺乏生活常識；(B)「不愧屋漏」是指獨處時也不做虧心事；(C)「蠡測海」是見識淺窄，不可能得到準確數據。"},{"id":"113-chinese-17","y":"113","n":17,"img":"113_chinese_q17","pk":"113_chinese","ans":"B","exp":"文意是：求學要像射箭先立靶心，以聖賢為標準。(B)在「聖賢」後停頓，「猶射者之求中夫正鵠也」意思連貫；其他選項斷句會把句子拆壞。"},{"id":"113-chinese-18","y":"113","n":18,"img":"113_chinese_q18","pk":"113_chinese","ans":"A","exp":"(A)蔡邕聽見燒桐木的聲音，認為是好材料，請人取下做成琴。(B)只說吳地有人燒桐，並非向來以此聞名；(C)是燒的時候聽聲音，不是做好後火烤；(D)他是逃亡到吳郡，不是被流放。"},{"id":"113-chinese-19","y":"113","n":19,"img":"113_chinese_q19","pk":"113_chinese","ans":"D","exp":"這句話說蝎、蟬、螢因為外顯的特質反被人捉，所以愛惜自身的人不追求顯赫的名聲。(D)名氣太大反而招禍，意思最接近；(A)(B)(C)都在談留名或名聲本身是好事。"},{"id":"113-chinese-20","y":"113","n":20,"img":"113_chinese_q20","pk":"113_chinese","ans":"A","exp":"指事是在象形字上加符號表示抽象概念。(A)「本」是在「木」的根部加一點指出根本，屬指事；(B)功是形聲，(C)炎是會意，(D)雨是象形。"},{"id":"113-chinese-21","y":"113","n":21,"img":"113_chinese_q21","pk":"113_chinese","ans":"C","exp":"這段文字用「事必成，然後舉；身必安，而後行」等工整句式，勸太子要先考慮周全再行動。(A)不是鼓勵建功；(B)沒有先抑後揚；(D)文中沒有舉前人失敗的例子。"},{"id":"113-chinese-22","y":"113","n":22,"img":"113_chinese_q22","pk":"113_chinese","ans":"A","exp":"文中說張氏借糧給貧民，還的時候多寡都不計較，也不用斗斛量，所以人稱「不量」。這是行善積德，所以田才沒受災，(A)最合理。"},{"id":"113-chinese-23","y":"113","n":23,"img":"113_chinese_q23","pk":"113_chinese","ans":"D","exp":"文中說假日管制時，車輛改為「北門進、南門出」；非假日沒有管制，所以仍可從南門進入。(A)水位越高，鳥離亭越遠才需要望遠鏡；(C)只在假日8時至16時管制。"},{"id":"113-chinese-24","y":"113","n":24,"img":"113_chinese_q24","pk":"113_chinese","ans":"A","exp":"文章用蠶繭比喻身體，繭不加整治會腐壞，經過教化才成為美錦；說的是教化對修身的重要。(B)(D)不是在批評奢靡或國政，(C)的重點也不是環境影響。"},{"id":"113-chinese-25","y":"113","n":25,"img":"113_chinese_q25","pk":"113_chinese","ans":"A","pimg":"113_chinese_p25","grp":"113-chinese-25～26","exp":"文中說二十幾歲時，人和城市的關係是有目的性的，作者留學愛丁堡就是為了完成學業。(B)「偏頗」指的是帶著目的的生活，不是去咖啡館；(C)(D)文中沒有這些意思。"},{"id":"113-chinese-26","y":"113","n":26,"img":"113_chinese_q26","pk":"113_chinese","ans":"D","pimg":"113_chinese_p25","grp":"113-chinese-25～26","exp":"「尖銳」指當時只帶著單一目標去生活，眼光只看著目標，因此視野狹窄。(D)最符合；(A)(B)(C)講的是粗心、好爭或氣量，文中沒有提到。"},{"id":"113-chinese-27","y":"113","n":27,"img":"113_chinese_q27","pk":"113_chinese","ans":"A","pimg":"113_chinese_p27","grp":"113-chinese-27～28","exp":"原書用三種顏色的絲線暗指三種勳章，是在諷刺沒骨氣的人得寵。出版社改了顏色，寓意就消失，讀者看不出作者的諷刺，所以(A)正確。"},{"id":"113-chinese-28","y":"113","n":28,"img":"113_chinese_q28","pk":"113_chinese","ans":"B","pimg":"113_chinese_p27","grp":"113-chinese-27～28","exp":"文中說這本書表面是奇幻故事，實際是諷刺人性與英國時政權貴，所以是用虛構情節反映現實。(A)是中文世界的印象；(C)是中譯本只翻兩冊，不是譯者濃縮；(D)是誤譯，不是怕得罪人。"},{"id":"113-chinese-29","y":"113","n":29,"img":"113_chinese_q29","pk":"113_chinese","ans":"D","pimg":"113_chinese_p29","grp":"113-chinese-29～30","exp":"文中說如果每個人都像美國人那樣生活，超載日會提前到3月13日，可見美國人的負擔比多數國家大。(A)1990年是評估方法出現的時間；(B)是需要1.75個地球；(C)超載日後是透支，不是耗盡。"},{"id":"113-chinese-30","y":"113","n":30,"img":"113_chinese_q30","pk":"113_chinese","ans":"C","pimg":"113_chinese_p29","grp":"113-chinese-29～30","exp":"文中說肉品消費減半可延後17天，所以增加蔬食比例可延後超載日。(A)(B)文中沒提到；(D)疫情期間超載日只延後三週，隔年就恢復，不是長久辦法。"},{"id":"113-chinese-31","y":"113","n":31,"img":"113_chinese_q31","pk":"113_chinese","ans":"A","pimg":"113_chinese_p31","grp":"113-chinese-31～32","exp":"概述說這些畫是「絹本」，絹是絲織品，可見北宋畫作可畫在絲織品上。(B)只說他們各是巨幅立軸代表；(C)是通過靜觀體悟重新組織；(D)〈萬壑松風〉是時代最近的，最晚才是。"},{"id":"113-chinese-32","y":"113","n":32,"img":"113_chinese_q32","pk":"113_chinese","ans":"A","pimg":"113_chinese_p31","grp":"113-chinese-31～32","exp":"概述說展期不超過42天，但海報上是10/06到12/16，共超過兩個月，所以展出的起迄日期有誤。"},{"id":"113-chinese-33","y":"113","n":33,"img":"113_chinese_q33","pk":"113_chinese","ans":"B","pimg":"113_chinese_p33","grp":"113-chinese-33～35","exp":"三者是包含關係：深度學習屬於機器學習，機器學習又屬於人工智慧，所以用同心圓最適合。(A)金字塔是層級；(C)是交集；(D)是循環，都不對。"},{"id":"113-chinese-34","y":"113","n":34,"img":"113_chinese_q34","pk":"113_chinese","ans":"D","pimg":"113_chinese_p33","grp":"113-chinese-33～35","exp":"生成器和辨識器是互相競爭：一方做出更像真的，另一方就要更會分辨。(D)駭客發展新病毒，防毒軟體就要更新，是對抗與進步，最接近；其他選項是單向依賴或單純操作。"},{"id":"113-chinese-35","y":"113","n":35,"img":"113_chinese_q35","pk":"113_chinese","ans":"C","pimg":"113_chinese_p33","grp":"113-chinese-33～35","exp":"文中說氾濫的深偽影片最大的危機是讓民眾對社會產生不信任感，所以(C)正確。(A)美國媒體是為了提醒大眾；(B)(D)文中沒有這樣的說法。"},{"id":"113-chinese-36","y":"113","n":36,"img":"113_chinese_q36","pk":"113_chinese","ans":"C","pimg":"113_chinese_p36","grp":"113-chinese-36～37","exp":"文中說茶蟲有的在啃茶葉，有的在吃人物手裡的飯和衣服，而古阿明來自貧困茶農家庭，這是他對生活困苦與恐懼的表現。(C)最符合；(A)(B)(D)文中沒有依據。"},{"id":"113-chinese-37","y":"113","n":37,"img":"113_chinese_q37","pk":"113_chinese","ans":"B","pimg":"113_chinese_p36","grp":"113-chinese-36～37","exp":"文中說郭雲天不忍破壞那純潔的心靈裡流露出來的東西，明知有錯也讓他保持原來面目，所以是想保留古阿明特有的創意。(C)只是他作畫的狀況，不是意見少的原因。"},{"id":"113-chinese-38","y":"113","n":38,"img":"113_chinese_q38","pk":"113_chinese","ans":"B","pimg":"113_chinese_p38","grp":"113-chinese-38～39","exp":"「見一事則止知一事」是只看到一件事就只知道那一件事，代表理解不夠全面。(A)是不會活用書本；(C)「氣象」指古人的氣度；(D)是說任性行事，不是更自由。"},{"id":"113-chinese-39","y":"113","n":39,"img":"113_chinese_q39","pk":"113_chinese","ans":"B","pimg":"113_chinese_p38","grp":"113-chinese-38～39","exp":"乙文要人設想「古人遇到這事會怎麼做」，再對照自己的作法，也就是用古人的標準來評斷自己。(A)甲文沒有這樣比較；(C)乙文是用古人當標準；(D)文中沒提效率。"},{"id":"113-chinese-40","y":"113","n":40,"img":"113_chinese_q40","pk":"113_chinese","ans":"C","pimg":"113_chinese_p40","grp":"113-chinese-40～42","exp":"「坐」有因某事而獲罪、受罰的意思。(A)「亡」是丟失；(B)「信」是相信；(D)「其」是表示請求的語氣，不是難道。"},{"id":"113-chinese-41","y":"113","n":41,"img":"113_chinese_q41","pk":"113_chinese","ans":"D","pimg":"113_chinese_p40","grp":"113-chinese-40～42","exp":"楚王說令尹相信有人偷布，他不會因為對方富貴就不依法處置，可見他認為不論身分都要守法。(A)(B)(C)與文中內容不符。"},{"id":"113-chinese-42","y":"113","n":42,"img":"113_chinese_q42","pk":"113_chinese","ans":"B","pimg":"113_chinese_p40","grp":"113-chinese-40～42","exp":"江母說自己的兒子被指為偷布，其實是令尹治理不明才讓盜賊橫行，令尹該負責卻要懲處江乙，所以她是在表達江乙被懲處的不公。(A)(C)(D)與文中的論述不符。"},{"id":"114-chinese-1","y":"114","n":1,"img":"114_chinese_q01","pk":"114_chinese","ans":"D","exp":"簡訊說水費逾期、「務必於三日內繳費，逾期將終止供水」，營造必須馬上處理的緊迫感，讓人來不及思考就點連結，屬於④引發情緒反應。","goal":"能應用文本","pr":90},{"id":"114-chinese-2","y":"114","n":2,"img":"114_chinese_q02","pk":"114_chinese","ans":"B","exp":"文中強調驗屍時「涉案人、關係人和家屬必須在場」，所以(B)正確。(A)禁止把屍體帶到他處；(C)一般大眾可以圍觀；(D)目的是讓大家「質對明白」，不會拒絕家屬確認。","goal":"能應用文本","pr":95},{"id":"114-chinese-3","y":"114","n":3,"img":"114_chinese_q03","pk":"114_chinese","ans":"B","exp":"「月」是依月亮形狀畫出的象形字。「木」畫出樹的枝幹與根，也是象形字。「出」是腳走出坑穴的會意字；「汝」是從水、女聲的形聲字。","goal":"能辨別常用字造字原則","pr":79},{"id":"114-chinese-4","y":"114","n":4,"img":"114_chinese_q04","pk":"114_chinese","ans":"B","exp":"詩中說快樂除以悲傷，「得到的商卻只是1」，一個數除以另一個數等於1，表示兩者相等，也就是「我的快樂等同於我的悲傷」。","goal":"能理解文意","pr":81},{"id":"114-chinese-5","y":"114","n":5,"img":"114_chinese_q05","pk":"114_chinese","ans":"A","exp":"《說文解字》以小篆為主，兼收古文、籀文，都是秦以前的古文字。(A)是楷書，楷書在漢末之後才成熟，《說文》不會收錄。","goal":"能辨別書法字體","pr":88},{"id":"114-chinese-6","y":"114","n":6,"img":"114_chinese_q06","pk":"114_chinese","ans":"A","exp":"資料中各國自封城後，家暴通報、專線來電都上升，所以可推論封城容易誘發家庭暴力。(B)來電增加不代表通報意願較高；(C)是收入與行動受限讓女性更易受害，因果相反；(D)資料沒有提到。","goal":"能根據文本推論","pr":79},{"id":"114-chinese-7","y":"114","n":7,"img":"114_chinese_q07","pk":"114_chinese","ans":"B","exp":"甲圖說最末字仄聲貼右邊（上聯）、平聲貼左邊（下聯）；乙圖標示上聯尾字是仄聲、下聯尾字是平聲。兩圖都指出上聯仄聲結尾、下聯平聲結尾，就是「仄起平收」。(C)順序是上聯→下聯→橫批；(D)面向大門右邊貼上聯。","goal":"能理解對聯的原則與貼法","pr":84},{"id":"114-chinese-8","y":"114","n":8,"img":"114_chinese_q08","pk":"114_chinese","ans":"C","exp":"「菊花」是秋天的花，「金風」指秋風，「桂枝香」是秋天的桂花香，都呼應題目「秋」。(A)〈小梁州〉是曲牌名，不是題目；(B)黃、光、藏、盪、香、望、江、漾、行都押同一韻，一韻到底；(D)斜月、新雁是寫秋景。","goal":"能分析文本的寫作手法","pr":80},{"id":"114-chinese-9","y":"114","n":9,"img":"114_chinese_q09","pk":"114_chinese","ans":"C","exp":"文中說等級最高的是第一種「香片」，例如茉莉花茶；玫瑰烏龍茶是成品內有花的第二種，所以(C)的建議不恰當。","goal":"能應用文本","pr":78},{"id":"114-chinese-10","y":"114","n":10,"img":"114_chinese_q10","pk":"114_chinese","ans":"A","exp":"文中說「北方乾燥，土穴所釀多出於此」，可知土穴中的蜜（穴蜜）多產於乾燥的地方。(B)人工養蜂只占十分之二，崖蜜是天然的；(C)南方卑溼仍有崖蜜；(D)「與蔗漿分勝」是說兩者不相上下。","goal":"能根據文本推論","pr":83},{"id":"114-chinese-11","y":"114","n":11,"img":"114_chinese_q11","pk":"114_chinese","ans":"D","exp":"作者說時間是「傑出的編輯」，那些沒寫成的遊記交給時間處理，最後可能發現不寫也罷。意思是經過時間沉澱，自然會知道什麼才值得寫。","goal":"能理解文意","pr":72},{"id":"114-chinese-12","y":"114","n":12,"img":"114_chinese_q12","pk":"114_chinese","ans":"C","exp":"「我清楚明白」後面接的是明白的內容：「科學需要人文的關懷，而文學需要理性的自覺」，用來提示下文的冒號最適合放在丙。","goal":"能依語境評斷標點符號使用的適切性","pr":71},{"id":"114-chinese-13","y":"114","n":13,"img":"114_chinese_q13","pk":"114_chinese","ans":"C","exp":"(C)「延宕」是拖延，「竣工」是完工，使用正確。(A)「淪為」用於變壞，應為「傳為佳話」；(B)應為「竟然」；(D)應為「多虧」。","goal":"能依語境評斷語詞使用的適切性","pr":57},{"id":"114-chinese-14","y":"114","n":14,"img":"114_chinese_q14","pk":"114_chinese","ans":"A","exp":"(A)揶揄的「揶」讀ㄧㄝˊ，正確。(B)晾讀ㄌㄧㄤˋ；(C)藩讀ㄈㄢ；(D)栽讀ㄗㄞ。","goal":"能記憶常用字的字音","pr":55},{"id":"114-chinese-15","y":"114","n":15,"img":"114_chinese_q15","pk":"114_chinese","ans":"A","exp":"文中引魯迅說此書「亦頗有從唐傳奇轉化而出者」，可見有些唐傳奇是蒲松齡寫作的來源。(B)能找到原型的約百篇，找不到的超過全書一半；(C)能找到原型的是短篇小說；(D)短篇小說長達數千言。","goal":"能理解文意","pr":61},{"id":"114-chinese-16","y":"114","n":16,"img":"114_chinese_q16","pk":"114_chinese","ans":"A","exp":"(A)「有志竟成」正確。(B)應為「趕盡殺絕」；(C)應為「情不自禁」；(D)應為「眼不見為淨」。","goal":"能記憶常用字的字形","pr":52},{"id":"114-chinese-17","y":"114","n":17,"img":"114_chinese_q17","pk":"114_chinese","ans":"C","exp":"「遺恨濃」是抽象的情感，用「碧波流不斷」的江水具體表現遺恨綿延不絕。(A)濃、重、鐘、朧、空、紅、風、中都押平聲韻；(B)下片也是寫景抒情；(D)綠蕪是寫春天已過，並非反襯。","goal":"能分析文本的寫作手法","pr":51},{"id":"114-chinese-18","y":"114","n":18,"img":"114_chinese_q18","pk":"114_chinese","ans":"D","exp":"作者扣門沒人應，「欲去問西家」，西家的人「報道山中去」，所以作者見到了陸鴻漸的鄰居。(A)是桑麻農地，不荒蕪；(B)菊花「未著花」；(C)陸鴻漸要到太陽西斜才回來，作者沒見到他。","goal":"能理解文意","pr":59},{"id":"114-chinese-19","y":"114","n":19,"img":"114_chinese_q19","pk":"114_chinese","ans":"A","exp":"(A)「不可名狀」指無法用言語形容，用來形容戰爭的慘烈正確。(B)「不以為意」是不在意，和「表面上毫不在乎」不能用「但」轉折；(C)「不言而喻」是不用說就明白；(D)「不置可否」是不表示意見，不會讓人有明確方向。","goal":"能依語境評斷詞語使用的適切性","pr":61},{"id":"114-chinese-20","y":"114","n":20,"img":"114_chinese_q20","pk":"114_chinese","ans":"D","exp":"劉基把換丞相比喻成換柱子，「須得大木」，若綁小木頭來做，很快就倒。意思是李善長是能撐住國家的大木，自己只是小木，所以李善長比自己更適合當丞相。(A)是李善長多次想害劉基；(B)太祖想讓劉基取代李善長。","goal":"能理解文意","pr":51},{"id":"114-chinese-21","y":"114","n":21,"img":"114_chinese_q21","pk":"114_chinese","ans":"D","exp":"單淘汰制下，在同一半區的兩隊不可能同時進冠軍賽。(A)阿根廷、巴西都在左半區；(B)荷蘭和澳大利亞在8強前就會碰頭，澳大利亞不可能得季軍；(C)法國、西班牙都在右半區。(D)克羅埃西亞（左）、摩洛哥（右）可在冠軍賽相遇，塞內加爾可在右半區四強輸給摩洛哥後再贏得季軍。","goal":"能根據文本推論","pr":61},{"id":"114-chinese-22","y":"114","n":22,"img":"114_chinese_q22","pk":"114_chinese","ans":"B","exp":"作者給賣餅者一萬錢增加本錢，後來賣餅者不唱歌了，說「本流既大，所謀益增，不暇唱曲矣」，資本變大、要忙的事變多，沒空唱歌。(A)作者是借錢給他，用餅慢慢抵；(D)他仍繼續賣餅。","goal":"能理解文意","pr":51},{"id":"114-chinese-23","y":"114","n":23,"img":"114_chinese_q23","pk":"114_chinese","ans":"D","exp":"文中說遠方戍卒「不習地勢而心畏胡」，而招募的居民保衛家園「赴胡不避死」，所以遠卒畏懼胡人、屯戍的居民不畏懼。(A)遠卒「一歲而更」，屯民久居；(B)室屋、田器、衣食都是給屯民的；(C)遠卒不熟悉地勢。","goal":"能理解文意","pr":43},{"id":"114-chinese-24","y":"114","n":24,"img":"114_chinese_q24","pk":"114_chinese","ans":"B","exp":"文中說後來才知道《碧雲騢》「乃魏泰所為，嫁之聖俞也」，是魏泰寫的，卻栽贓給梅聖俞，所以應非梅聖俞所作。(A)范文正是被揭發的人；(C)官運不達的說法是指梅聖俞，且是誤傳；(D)作者肯定歐陽脩不記人過惡。","goal":"能指出作者的觀點","pr":30},{"id":"114-chinese-25","y":"114","n":25,"img":"114_chinese_q25","pk":"114_chinese","ans":"B","pimg":"114_chinese_p25","grp":"114-chinese-25～26","exp":"公呆遇到動物接近會一起噴水警示，「正好讓人發現位置」，所以噴水反而暴露藏身處。(A)孫子說公呆受不了北極深海；(C)閉殼像石頭的是文蛤，公呆殼很薄；(D)晒太陽是孫子的想像。","goal":"能理解文意","pr":90},{"id":"114-chinese-26","y":"114","n":26,"img":"114_chinese_q26","pk":"114_chinese","ans":"A","pimg":"114_chinese_p25","grp":"114-chinese-25～26","exp":"外婆說公呆「懶」「呆」，孫子卻認為牠們是殼太薄才躺平，且要趁活著享受溫暖；結尾「在躺平年代裡，更容易理解躺平生物」，透過祖孫對話呈現不同世代的價值觀差異。","goal":"能分析文本的寫作手法","pr":86},{"id":"114-chinese-27","y":"114","n":27,"img":"114_chinese_q27","pk":"114_chinese","ans":"B","pimg":"114_chinese_p27","grp":"114-chinese-27～28","exp":"文中說春季北返有兩條路線：一條經臺灣東南外海的蘭嶼、琉球回日本，另一條經臺灣西岸。圖(二)的北上路線只畫了西岸這條，少畫了經由蘭嶼的路線。","goal":"能應用文本","pr":82},{"id":"114-chinese-28","y":"114","n":28,"img":"114_chinese_q28","pk":"114_chinese","ans":"C","pimg":"114_chinese_p27","grp":"114-chinese-27～28","exp":"文中說八卦山的次生林「提供了豐富的食物來源」，且山脈地形能提供猛禽滑翔需要的上升氣流，所以是食物豐富、地形適合。","goal":"能理解文意","pr":89},{"id":"114-chinese-29","y":"114","n":29,"img":"114_chinese_q29","pk":"114_chinese","ans":"C","pimg":"114_chinese_p29","grp":"114-chinese-29～31","exp":"甲文說視覺化寫作是用文字勾勒圖像，描寫場景與角色，讓劇本「深植於令人感覺真實的世界」，讀劇本的人因此較容易掌握情境。(A)視覺化寫作是對白以外的部分；(D)希區考克強調的是整個劇本。","goal":"能理解文意","pr":64},{"id":"114-chinese-30","y":"114","n":30,"img":"114_chinese_q30","pk":"114_chinese","ans":"D","pimg":"114_chinese_p29","grp":"114-chinese-29～31","exp":"「喀啦」是鼓棒斷掉的聲音，安德魯因此停下來，情節從拚命練習轉為停頓、疲憊，製造了轉折。(A)乙劇本沒有對白；(B)只有一個角色；(C)節拍器沒有故障。","goal":"能分析文本的寫作手法","pr":84},{"id":"114-chinese-31","y":"114","n":31,"img":"114_chinese_q31","pk":"114_chinese","ans":"C","pimg":"114_chinese_p29","grp":"114-chinese-29～31","exp":"畫線處寫「陰暗狹小的練習室」（場景外觀）、節拍器正在閃爍（場景事件）、安德魯試著打出雙跳（角色行動），但沒有描寫安德魯的長相或穿著，所以最無法呼應「角色外貌」。","goal":"能比較不同文本的內容","pr":84},{"id":"114-chinese-32","y":"114","n":32,"img":"114_chinese_q32","pk":"114_chinese","ans":"C","pimg":"114_chinese_p32","grp":"114-chinese-32～33","exp":"文中說這些人「並不關切生活品質、工作熱忱……」，一心只想問出金額比大小，所以「重視良好的生活品質」最不可能是原因。","goal":"能理解文意","pr":81},{"id":"114-chinese-33","y":"114","n":33,"img":"114_chinese_q33","pk":"114_chinese","ans":"D","pimg":"114_chinese_p32","grp":"114-chinese-32～33","exp":"「出賣自我、夢想、健康、幸福、信念，到了『夠』的時候，沒有人能不說夠」，意思是為了賺錢犧牲這些東西，犧牲到了極限時，每個人都只能說夠了。","goal":"能理解文意","pr":70},{"id":"114-chinese-34","y":"114","n":34,"img":"114_chinese_q34","pk":"114_chinese","ans":"A","pimg":"114_chinese_p34","grp":"114-chinese-34～35","exp":"「縮水式漲價」是價格不變、分量或內容減少。(A)是直接調漲價格，不是縮水式漲價。(B)滷蛋變半顆、(C)容量變少、(D)不再贈送作業簿，都是價格不變但內容減少。","goal":"能應用文本","pr":80},{"id":"114-chinese-35","y":"114","n":35,"img":"114_chinese_q35","pk":"114_chinese","ans":"D","pimg":"114_chinese_p34","grp":"114-chinese-34～35","exp":"企業推出小包裝新品或搭售，讓「消費者不易與原先的價格比較」，因此較不抗拒，原因是較難直觀察覺價格改變。","goal":"能理解文意","pr":75},{"id":"114-chinese-36","y":"114","n":36,"img":"114_chinese_q36","pk":"114_chinese","ans":"B","pimg":"114_chinese_p36","grp":"114-chinese-36～37","exp":"《舊五代史》把稱帝的十國君主列入「僭偽列傳」，《新五代史》以「世家」（諸侯王的體例）定位，兩者都沒有用帝王的「本紀」，所以都不承認南唐君主的帝王身分。","goal":"能理解文意","pr":52},{"id":"114-chinese-37","y":"114","n":37,"img":"114_chinese_q37","pk":"114_chinese","ans":"C","pimg":"114_chinese_p36","grp":"114-chinese-36～37","exp":"作者指出五代王位之爭血腥、難有建樹，反而南唐三位國君重視文教、珍藏圖書、網羅畫師，使南唐成為文化重鎮，可見作者肯定李氏三代對文化的貢獻。","goal":"能指出作者的觀點","pr":58},{"id":"114-chinese-38","y":"114","n":38,"img":"114_chinese_q38","pk":"114_chinese","ans":"A","pimg":"114_chinese_p38","grp":"114-chinese-38～39","exp":"諸樊、餘祭、夷眛、季子札是四兄弟；公子光是諸樊的兒子；僚是夷眛的兒子。符合的是(A)。","goal":"能理解文意","pr":62},{"id":"114-chinese-39","y":"114","n":39,"img":"114_chinese_q39","pk":"114_chinese","ans":"D","pimg":"114_chinese_p38","grp":"114-chinese-38～39","exp":"公子光說：若照兄弟順序，應該由季子札繼位；若照父子傳承，自己是長兄諸樊的嫡子，應該由自己繼位。僚兩種條件都不符合，所以公子光最無法接受僚當吳王。","goal":"能理解文意","pr":54},{"id":"114-chinese-40","y":"114","n":40,"img":"114_chinese_q40","pk":"114_chinese","ans":"B","pimg":"114_chinese_p40","grp":"114-chinese-40～42","exp":"「比來」是近來的意思。(A)「令郎」是對方的兒子，「令尊」是對方的父親；(C)「一旦」是某天、忽然；(D)「俗故」指世俗雜事，不是老友。","goal":"能理解文言文中字詞的意義","pr":58},{"id":"114-chinese-41","y":"114","n":41,"img":"114_chinese_q41","pk":"114_chinese","ans":"D","pimg":"114_chinese_p40","grp":"114-chinese-40～42","exp":"司馬光形容石月屏「天質圓瑩，非刻非繪」，像秋高氣清般天然，是天地的珍寶，所以非常喜愛。(A)他之前曾在京城朋友處見過；(B)「雖受文錦、白璧，未為重賜」是說石月屏對他來說比這些更珍貴；(C)他欣然收下。","goal":"能理解文意","pr":50},{"id":"114-chinese-42","y":"114","n":42,"img":"114_chinese_q42","pk":"114_chinese","ans":"B","pimg":"114_chinese_p40","grp":"114-chinese-40～42","exp":"這是一封答謝信（〈答薛虢州謝石月屏書〉），司馬光說「豈意一旦不煩懇請，坐致握中」，喜出望外，並為「久不遑修謝」感到惶恐，所以是寫信表達謝意。","goal":"能理解文意","pr":41},{"id":"115-chinese-1","y":"115","n":1,"img":"chinese_q01","pk":"115_chinese","ans":"B","exp":"「若即若離」的「即」是靠近、接近，「離」是離開，形容關係忽近忽遠。(A)立即、(C)就、(D)招之即來的「即」都是「立刻、就」的意思。","goal":"能理解常用字的字義","pr":86},{"id":"115-chinese-2","y":"115","n":2,"img":"chinese_q02","pk":"115_chinese","ans":"A","exp":"文中說「滇、緬、泰、越、寮位置鄰近，料理自然互相滲透，彼此影響」，椒麻雞從雲南傳到泰北再到臺灣，正說明料理會因地緣關係互相影響。其他選項文中都沒有提到。","goal":"能指出作者的觀點","pr":93},{"id":"115-chinese-3","y":"115","n":3,"img":"chinese_q03","pk":"115_chinese","ans":"D","exp":"資料一說史學家用「價值判斷」剪裁歷史；資料二說「史學家的解釋也互有出入」。兩者都認為史學家對歷史會有不同詮釋，所以選(D)。(A)資料一正好說史學家有偏見；(B)資料二認為歷史的客觀性「不容懷疑」；(C)兩則資料都沒有說不能懷疑史學家的記載。","goal":"能比較不同文本的內容","pr":89},{"id":"115-chinese-4","y":"115","n":4,"img":"chinese_q04","pk":"115_chinese","ans":"A","exp":"《說文解字》說「鬲」是「象腹交文，三足」，也就是依照器物的腹部紋路和三隻腳的外形畫出來，屬於依形狀造字的「象形」。","goal":"能辨別漢字造字原則","pr":75},{"id":"115-chinese-5","y":"115","n":5,"img":"chinese_q05","pk":"115_chinese","ans":"D","exp":"空格後面是在解釋「自由」包含哪些內容（體例、選材、篇幅、思想的自由），用來補充說明的標點是破折號「――」。","goal":"能依語境評斷標點符號使用的適切性","pr":78},{"id":"115-chinese-6","y":"115","n":6,"img":"chinese_q06","pk":"115_chinese","ans":"D","exp":"(A)「一無反顧」應為「義無反顧」；(B)「無名小足」應為「無名小卒」；(C)「防不慎防」應為「防不勝防」。只有(D)「安然無恙」完全正確。","goal":"能記憶常用字的字形","pr":55},{"id":"115-chinese-7","y":"115","n":7,"img":"chinese_q07","pk":"115_chinese","ans":"C","exp":"(A)瘡讀ㄔㄨㄤ；(B)置喙的「喙」讀ㄏㄨㄟˋ（鳥嘴，比喻插嘴）；(D)孰讀ㄕㄨˊ。(C)偕同的「偕」讀ㄒㄧㄝˊ，正確。","goal":"能記憶常用字的字音","pr":72},{"id":"115-chinese-8","y":"115","n":8,"img":"chinese_q08","pk":"115_chinese","ans":"C","exp":"資料說「第十二夜」是指聖誕節後第十二天的主顯節，劇本是為這天的宮廷戲劇展演而寫，「故得名」，所以劇名和主顯節的日期有關。(A)劇情與劇名「無直接關聯」；(B)沒有說連演十二天；(D)是先有宮中演戲的習俗，才有這齣劇。","goal":"能根據文本推論","pr":75},{"id":"115-chinese-9","y":"115","n":9,"img":"chinese_q09","pk":"115_chinese","ans":"C","exp":"詩人把書比喻成孩子：書被燒時像慈父生氣地把哭鬧的孩子丟開，但又「徐徐復自撫摩之」，慢慢地再去撫摸，表現捨不得書被燒壞的心情。(A)「元氣不可復」是說書受損後無法恢復，不是作者時日無多；(B)是一時的氣憤；(D)「上壽八十」是感嘆人的壽命有限。","goal":"能理解文意","pr":61},{"id":"115-chinese-10","y":"115","n":10,"img":"chinese_q10","pk":"115_chinese","ans":"D","exp":"《魏三體石經》（又稱正始石經）以古文、小篆、隸書三種字體刻成。圖中最下一列字形扁平、有波磔，正是隸書。行書、草書、楷書都不是這部石經的字體。","goal":"能辨別書法字體","pr":70},{"id":"115-chinese-11","y":"115","n":11,"img":"chinese_q11","pk":"115_chinese","ans":"B","exp":"「寫真式描寫」要細密、按次序、客觀地呈現完整形象。(B)依序寫兩手攀、兩腳縮、身子向左傾，像照片一樣客觀具體（出自朱自清〈背影〉）。(A)是議論；(C)、(D)用了大量抽象、象徵性的語彙。","goal":"能應用文本","pr":66},{"id":"115-chinese-12","y":"115","n":12,"img":"chinese_q12","pk":"115_chinese","ans":"D","exp":"文中說後漢高祖的襆頭「左右長尺餘，橫直之，不復上翹，迄今不改」，「迄今」指作者所在的宋代。所以宋代帝王的襆頭是兩腳又長又平直地向左右伸出，就是(D)。","goal":"能應用文本","pr":58},{"id":"115-chinese-13","y":"115","n":13,"img":"chinese_q13","pk":"115_chinese","ans":"A","exp":"作者評論高帝與僧虔比書法「亦猶雞之搏狸」，像雞去和狸貓打架，表示高帝不自量力，可見作者認為高帝的書法不如僧虔。(B)文中沒說子敬天下第一；(C)「稍乏風骨」是作者的評語；(D)「雞之搏狸」也是作者說的，不是僧虔。","goal":"能理解文意","pr":62},{"id":"115-chinese-14","y":"115","n":14,"img":"chinese_q14","pk":"115_chinese","ans":"B","exp":"2022年的大會訂下「2030年以前」全球陸域和海域要有「30%」保護區。所以前面的30指陸域和海域保護區的面積百分比，後面的30指預計達成目標的年分（2030年）。","goal":"能理解文意","pr":57},{"id":"115-chinese-15","y":"115","n":15,"img":"chinese_q15","pk":"115_chinese","ans":"A","exp":"團隊分工、長輩傳授年輕人、長者祈福，都和人與人之間的連結、文化傳承有關，所以有助社群凝聚與文化延續。「成品可以使用至少30年」只是說地毯耐用，和社群凝聚無關。","goal":"能理解文意","pr":57},{"id":"115-chinese-16","y":"115","n":16,"img":"chinese_q16","pk":"115_chinese","ans":"A","exp":"(A)「小女」謙稱自己的女兒，「令嬡」敬稱對方的女兒，使用正確。(B)問對方的哥哥應說「令兄」；(C)對方說的是「愚父子」（自己和兒子），回應卻用「賢昆仲」（敬稱對方兄弟），稱謂不符；(D)「令堂」是對方的母親，回答卻說「家父」，答非所問。","goal":"能依語境評斷稱謂使用的適切性","pr":51},{"id":"115-chinese-17","y":"115","n":17,"img":"chinese_q17","pk":"115_chinese","ans":"D","exp":"文中最後說賈似道「只想寫給喜愛鬥蟋蟀的賭徒參考」，所以《促織經》的目的是教人鬥蟋蟀時如何取勝。(A)歐洲的書晚了三百年才出現，沒說受它啟發；(C)作者說他不像歐洲博物學家那樣熱衷自然。","goal":"能根據文本推論","pr":56},{"id":"115-chinese-18","y":"115","n":18,"img":"chinese_q18","pk":"115_chinese","ans":"D","exp":"子產身為大國宰相，去拜見壺丘子林時卻和弟子們依年齡就座，「能捨之」放下身分，「以心與人相索」用真心與人交往，所以是跳脫貴賤框架、以誠待人。(C)「唯刑三人、殺二人」說明刑罰很少，不是嚴刑峻法。","goal":"能理解文意","pr":49},{"id":"115-chinese-19","y":"115","n":19,"img":"chinese_q19","pk":"115_chinese","ans":"A","exp":"(A)「胸無點墨」指沒有學問，用來說寫不出好文章，正確。(B)「休戚與共」指同甘共苦，不是休息；(C)「間不容髮」比喻情勢危急，不能形容關係好；(D)「瓜田李下」比喻容易引人懷疑的場合，不是田園生活。","goal":"能依語境評斷詞語使用的適切性","pr":50},{"id":"115-chinese-20","y":"115","n":20,"img":"chinese_q20","pk":"115_chinese","ans":"B","exp":"縣令派來的小吏寧可得罪人也要拿到回信才敢回去，蔣堂推斷「令必能者，使人不敢慢其命令如此」，表示縣令管理嚴格、治事有方；後來證實「縣令果能者」。(A)小吏是忠於命令；(C)蔣堂是替縣令宣揚名聲；(D)「卒為名臣」的是縣令。","goal":"能理解文意","pr":42},{"id":"115-chinese-21","y":"115","n":21,"img":"chinese_q21","pk":"115_chinese","ans":"D","exp":"無鬚者嘲笑鬚者臉皮厚，鬍鬚都能鑽透出來；鬚者反擊：「足下面皮更老，這等硬鬚還鑽不透」，意思是對方的臉皮厚到連硬鬍鬚都鑽不出來，所以以鬚者的立場，最硬的是無鬚者的面皮。","goal":"能理解文意","pr":49},{"id":"115-chinese-22","y":"115","n":22,"img":"chinese_q22","pk":"115_chinese","ans":"C","exp":"有人提議把梁山泊抽乾當農田，被質問大雨時水要往哪裡排？貢父說在旁邊再挖一個一樣大的池子就好，等於又把湖挖回來，大家聽了大笑，提議的人很慚愧。可見貢父是用反諷凸顯這個提議的荒謬。(A)提議是為了增加農田，不是解決淹水。","goal":"能理解文意","pr":54},{"id":"115-chinese-23","y":"115","n":23,"img":"chinese_q23","pk":"115_chinese","ans":"B","exp":"甲曲有「月淡」「一枝雪裡」等視覺，以及「暗香」嗅覺；乙曲有「雪散珍珠亂篩」視覺，以及「一枝風送香來」嗅覺。(A)甲沒有以雪喻梅，乙是以珍珠喻雪；(C)甲的次句「霜禽翠羽同期」沒有回答「誰知」；(D)沒有由近而遠的推移。","goal":"能分析文本的寫作手法","pr":46},{"id":"115-chinese-24","y":"115","n":24,"img":"chinese_q24","pk":"115_chinese","ans":"B","pimg":"chinese_p24","grp":"115-chinese-24～25","exp":"第二節寫黑白切是「一盤切碎的心肝腸肺」，咀嚼起來是「零零落落、毫無秩序的酸甜苦辣」，「切碎」的樣子正好呼應「零零落落」。(A)「野性」指夏天的生命力；(C)「啊！原來夏天如此爽口」是讚嘆；(D)沒有象徵人心險惡。","goal":"能分析文本的寫作手法","pr":80},{"id":"115-chinese-25","y":"115","n":25,"img":"chinese_q25","pk":"115_chinese","ans":"A","pimg":"chinese_p24","grp":"115-chinese-24～25","exp":"麻薏帶出「是去年與誰的故事」，黑白切帶出「生活的色香味」，兩節都是透過食物寫出生活的滋味與回憶。(B)沒有引用典故；(C)只有第二節寫黑與白；(D)黑白切不是當季食材。","goal":"能比較不同文本的內容","pr":86},{"id":"115-chinese-26","y":"115","n":26,"img":"chinese_q26","pk":"115_chinese","ans":"B","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"甲文說垂直農法「在密閉的室內種植農作物」，用營養液和LED燈，不受天候直接影響，所以受風災影響比傳統農業少。(A)用水量只有傳統的十分之一；(C)亞洲支持是因為人口稠密，不是成本低；(D)垂直農場目前只能為少數人服務。","goal":"能根據文本推論","pr":71},{"id":"115-chinese-27","y":"115","n":27,"img":"chinese_q27","pk":"115_chinese","ans":"B","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"②把高爾夫球場、運動場修剪的草屑和啤酒廠用過的穀物、麩，回收做成乳牛飼料，讓別處的廢棄物重新被利用，最能呼應「資源循環再生」。①是產量；③畫線部分講機器代勞；④是減少運輸成本。","goal":"能應用文本","pr":87},{"id":"115-chinese-28","y":"115","n":28,"img":"chinese_q28","pk":"115_chinese","ans":"A","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"研究人員說「乳牛應該在自然棲息地漫步」，把牠們搬到工業化環境「不是對待牠們應有的方式」，考量的是動物福利，也就是友善動物。","goal":"能理解文意","pr":88},{"id":"115-chinese-29","y":"115","n":29,"img":"chinese_q29","pk":"115_chinese","ans":"D","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"兩者都能減少食物里程（樓上種樓下賣、就近銷往當地）、都設在城市、都需要很高的資金成本（成本太高、三億歐元）。漂浮牧場的餵食、擠奶、清理都由機器代勞，並不需要大量人力，所以選(D)。","goal":"能比較不同文本的內容","pr":81},{"id":"115-chinese-30","y":"115","n":30,"img":"chinese_q30","pk":"115_chinese","ans":"D","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"④「有史以來最珍貴的船貨」把孩子比喻成最珍貴的東西，最能看出爸爸對孩子的重視。①②是對家鄉的回憶，③是寫航程的危險。","goal":"能理解文意","pr":84},{"id":"115-chinese-31","y":"115","n":31,"img":"chinese_q31","pk":"115_chinese","ans":"C","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"文中提到「我們穆斯林的清真寺」，家鄉經歷抗議、圍困、轟炸，現在和阿富汗人、敘利亞人等一起在海灘等船、「尋找家園」，還被說是「不速之客」，可知是逃離戰爭的穆斯林難民。","goal":"能理解文意","pr":81},{"id":"115-chinese-32","y":"115","n":32,"img":"chinese_q32","pk":"115_chinese","ans":"A","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"作者先回憶霍姆斯過去繁華的老城、市場、散步的夜晚，再寫後來的轟炸與死亡，用記憶畫面對照今昔變化。(B)列舉國家是說明難民來自各地；(C)他們是離開家鄉，不是近鄉情怯；(D)海的深廣是凸顯父親的無力。","goal":"能分析文本的寫作手法","pr":51},{"id":"115-chinese-33","y":"115","n":33,"img":"chinese_q33","pk":"115_chinese","ans":"C","pimg":"chinese_p33","grp":"115-chinese-33～34","exp":"文中說「翰林供奉的薪水參照八品京官」。(A)獨立辦公的是翰林學士；(B)翰林供奉「大都不兼職」；(D)翰林供奉會幫皇帝處理奏章。","goal":"能理解文意","pr":83},{"id":"115-chinese-34","y":"115","n":34,"img":"chinese_q34","pk":"115_chinese","ans":"B","pimg":"chinese_p33","grp":"115-chinese-33～34","exp":"翰林學士是從翰林供奉中挑出的佼佼者，「不光文筆一流，還通曉政治」，所以處理政務的能力優於翰林供奉。(A)是翰林學士兼任尚書、侍郎；(C)翰林待詔是陪皇帝玩的「幫閒」；(D)三者都「沒有專門的品級」。","goal":"能根據文本推論","pr":77},{"id":"115-chinese-35","y":"115","n":35,"img":"chinese_q35","pk":"115_chinese","ans":"C","pimg":"chinese_p35","grp":"115-chinese-35～36","exp":"文中說「每人四枝箭……四箭投完，司射計算總分，並宣告此局勝負」，所以四箭算一局。(A)沒有讓分的規定；(B)先秦時以禮數為旨，「而非娛樂競技」；(D)是「三局兩勝」，不是比總分。","goal":"能理解文意","pr":71},{"id":"115-chinese-36","y":"115","n":36,"img":"chinese_q36","pk":"115_chinese","ans":"C","pimg":"chinese_p35","grp":"115-chinese-35～36","exp":"依計分方式計算：第一局客人「×✓×✓」＝散箭1＋散箭1＝2分，主人「✓×✓×」＝有初10＋散箭1＝11分，主人勝。第二局客人「✓×××」＝10分，主人「×✓✓×」＝散箭1＋連中5＝6分，客人勝。第三局客人「×××✓」＝有終15分，主人「✓×××」＝10分，客人勝。客人兩勝一負，是最終贏家，所以(C)正確。","goal":"能應用文本","pr":79},{"id":"115-chinese-37","y":"115","n":37,"img":"chinese_q37","pk":"115_chinese","ans":"C","pimg":"chinese_p37","grp":"115-chinese-37～38","exp":"熱帶大頭家蟻殺死保護金合歡的舉尾蟻，沒有舉尾蟻的金合歡被非洲象破壞的速度快了5～7倍。(A)獅子數量保持穩定；(B)金合歡減少後獅子難以伏擊，斑馬反而較不易被獵殺；(D)舉尾蟻是被殺死，不是不再攻擊。","goal":"能理解文意","pr":80},{"id":"115-chinese-38","y":"115","n":38,"img":"chinese_q38","pk":"115_chinese","ans":"A","pimg":"chinese_p37","grp":"115-chinese-37～38","exp":"研究是在保護區內進行，但外來螞蟻照樣入侵並改變生態，所以無法說明設置保護區有助於維護原始生態。(B)外來種造成衝擊、(C)獅子改獵水牛、(D)舉尾蟻與金合歡的互利關係被破壞後引起連鎖反應，都能從研究中看出。","goal":"能根據文本推論","pr":73},{"id":"115-chinese-39","y":"115","n":39,"img":"chinese_q39","pk":"115_chinese","ans":"C","pimg":"chinese_p39","grp":"115-chinese-39～40","exp":"「嘗從余客荔城」的「客」是「旅居、作客」，當動詞用。(A)「至」是副詞，極、非常；(B)「若」是代名詞，你；(D)「過」是名詞，過錯。","goal":"能理解文言文中字詞的詞性","pr":52},{"id":"115-chinese-40","y":"115","n":40,"img":"chinese_q40","pk":"115_chinese","ans":"C","pimg":"chinese_p39","grp":"115-chinese-39～40","exp":"作者要去杭城，遂哭著要跟去，「余止之」，後來遂留在家鄉，所以是想跟從但聽命留下。(A)過世的是「主母」，而且是遂自己去買湯餅；(B)是怕摔壞主人轎中的東西；(D)文中沒有提到歸葬海山。","goal":"能理解文意","pr":42},{"id":"115-chinese-41","y":"115","n":41,"img":"chinese_q41","pk":"115_chinese","ans":"B","pimg":"chinese_p41","grp":"115-chinese-41～42","exp":"「見食相告」指雞看到食物會呼叫同伴，被視為「仁」。(A)「不見察」是不被賞識；(C)「一舉千里」是一飛就是千里；(D)「去之燕」是離開魯國前往燕國。","goal":"能理解句意","pr":68},{"id":"115-chinese-42","y":"115","n":42,"img":"chinese_q42","pk":"115_chinese","ans":"B","pimg":"chinese_p41","grp":"115-chinese-41～42","exp":"田饒說雞有五德卻被烹來吃，是因為「所從來者近」；黃鵠沒有五德卻被看重，是因為「所從來者遠」。意思是哀公看輕身邊的人才、看重遠方來的人，就像俗語「遠來的和尚會念經」。","goal":"能理解文意","pr":35},{"id":"ak-chinese-1","y":"ak","n":1,"html":"下列文句「」中的字，何者讀音正確？","opts":["面試前他「惴」惴不安，一直深呼吸：ㄓㄨㄟˋ","聽到這個消息，大家都「瞠」目結舌：ㄊㄤˊ","他誤觸法網，最後身陷「囹」圄：ㄌㄧㄥˋ","「莘」莘學子齊聚一堂，準備迎接會考：ㄒㄧㄣ"],"ans":"A","exp":"(A)惴讀ㄓㄨㄟˋ，正確。(B)瞠讀ㄔㄥ；(D)莘莘學子的「莘」讀ㄕㄣ；(C)囹讀ㄌㄧㄥˊ。","topic":"字音"},{"id":"ak-chinese-2","y":"ak","n":2,"html":"下列文句，何者用字完全正確？","opts":["他做事一向按步就班，從不馬虎","這次比賽他脫穎而出，令人刮目相看","面對挑戰，我們要再接再勵，不可放棄","老師的講解言簡意駭，大家一聽就懂"],"ans":"B","exp":"(A)應為「按部就班」；(C)應為「再接再厲」；(D)應為「言簡意賅」。只有(B)完全正確。","topic":"字形"},{"id":"ak-chinese-3","y":"ak","n":3,"html":"下列文句「」中的成語，何者使用最恰當？","opts":["他讀書總是「三心二意」，所以成績始終名列前茅","他筆下的花鳥「栩栩如生」，彷彿就要從紙上飛出來","兩人「一見如故」，從此反目成仇，不相往來","這家新開的餐廳「門可羅雀」，每天都大排長龍"],"ans":"B","exp":"(B)「栩栩如生」形容生動逼真，正確。(D)「門可羅雀」形容冷清，與大排長龍矛盾；(A)三心二意是不專心，與名列前茅不合；(C)一見如故是初見就很投緣，與反目成仇矛盾。","topic":"成語"},{"id":"ak-chinese-4","y":"ak","n":4,"html":"「這趟環島旅行，我最難忘的是三個地方□太魯閣的峽谷、墾丁的海灘，以及阿里山的日出。」根據文意，□處最適合填入哪一個標點符號？","opts":["，","；","：","。"],"ans":"C","exp":"空格後面是在列舉「三個地方」的具體內容，用來提示下文的標點是冒號「：」。","topic":"標點符號"},{"id":"ak-chinese-5","y":"ak","n":5,"html":"「讀書如交友，貴精不貴多。與其匆匆翻過一百本書，不如把一本好書讀上十遍，每一遍都會遇見不同的自己。」這段文字的主旨最接近下列何者？","opts":["讀書要廣泛涉獵，越多越好","交朋友應該以數量為重","好書值得反覆細讀，常讀常新","讀書的速度比讀書的內容重要"],"ans":"C","exp":"作者說讀書「貴精不貴多」，一本好書讀十遍，每遍都有新收穫，主旨是好書值得反覆細讀。(A)(D)與文意相反；(B)交友只是比喻。","topic":"文意理解"},{"id":"ak-chinese-6","y":"ak","n":6,"html":"表哥家的新房子落成，想送一幅匾額祝賀，下列題辭何者最適合？","opts":["美輪美奐","福壽全歸","杏林春暖","弄璋之喜"],"ans":"A","exp":"「美輪美奐」形容房屋高大華美，適合賀新居落成。(D)弄璋之喜賀生男孩；(C)杏林春暖用於讚美醫生；(B)福壽全歸用於輓年長男性。","topic":"題辭"},{"id":"ak-chinese-7","y":"ak","n":7,"html":"「時間是一位沉默的雕刻家，在每個人的臉上刻下歲月的紋路。」這句話主要使用了下列哪一種修辭？","opts":["設問","排比","誇飾","譬喻"],"ans":"D","exp":"「時間是一位雕刻家」把時間比喻成雕刻家，屬於譬喻（暗喻）。沒有誇大、沒有句型相同的排比，也沒有提問。","topic":"修辭"},{"id":"ak-chinese-8","y":"ak","n":8,"html":"《論語》：「三人行，必有我師焉：擇其善者而從之，其不善者而改之。」這段話的意思，與下列何者最接近？","opts":["出門在外最好三人同行，彼此照應","只和品德好的人交往，遠離品德不好的人","老師應該從學生身上學習，教學相長","看到別人的優點就學習，看到缺點就反省自己"],"ans":"D","exp":"「擇其善者而從之」是學習別人的優點，「其不善者而改之」是看到別人的缺點，就反省改正自己。所以是(D)。","topic":"文言單題"},{"id":"ak-chinese-9","y":"ak","n":9,"html":"根據本文，友人感到「慚」愧的原因最可能是下列何者？","opts":["陳太丘不等他就先離開了","被元方指出自己既不守信又沒有禮貌","元方年紀雖小，卻不願理睬他","他遲到太久，被罰不能進門"],"ans":"B","exp":"元方說友人約好中午卻沒來是「無信」，當著兒子的面罵父親是「無禮」，友人聽了覺得慚愧。","topic":"文言題組","grp":"ak-chinese-9～10","passage":"<p>陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。<\/p><p style=\"text-align:right\">——《世說新語》<\/p>"},{"id":"ak-chinese-10","y":"ak","n":10,"html":"文中「尊君在不」的「尊君」，指的是下列何者？","opts":["對方的父親","一國的君王","學生的老師","自己的父親"],"ans":"A","exp":"「尊君」是對別人父親的敬稱，相當於「令尊」；元方說的「家君」才是對自己父親的謙稱。客人問的是元方的父親陳太丘在不在。","topic":"文言題組","grp":"ak-chinese-9～10","passage":"<p>陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。<\/p><p style=\"text-align:right\">——《世說新語》<\/p>"},{"id":"ak-chinese-11","y":"ak","n":11,"html":"根據本文，青少年早上不容易起床的主要原因是什麼？","opts":["課業壓力太大","晚上沉迷手機，太晚睡覺","早餐吃得太少","生理時鐘往後延"],"ans":"D","exp":"文中說青春期大腦分泌褪黑激素的時間往後延，「這並不是懶惰，而是生理時鐘的改變」。手機、課業、早餐文中都沒有提到。","topic":"白話閱讀","grp":"ak-chinese-11～12","passage":"<p>研究指出，青少年進入青春期後，大腦分泌褪黑激素的時間會往後延，使他們晚上較晚才有睡意，早上也不容易醒來。這並不是懶惰，而是生理時鐘的改變。然而學校多半很早開始上課，使許多學生長期睡眠不足，上課時注意力下降，情緒也較容易起伏。<\/p><p>美國部分學區將第一節課延後約一小時後，學生遲到與缺席的情形減少，考試成績也略有提升。不過，延後上課也讓家長接送、課後活動的時間安排變得更困難，因此是否跟進，各地仍有不同意見。<\/p>"},{"id":"ak-chinese-12","y":"ak","n":12,"html":"關於文中「延後上課」的說明，下列何者最恰當？","opts":["美國所有學區都已經全面實施","會讓學生的考試成績大幅下降","有好處，但也帶來時間安排上的困難","可以完全解決學生睡眠不足的問題"],"ans":"C","exp":"延後上課讓遲到缺席減少、成績略升（好處），但家長接送和課後活動更難安排（困難）。(D)文中沒說完全解決；(A)只有部分學區；(B)成績是略有提升。","topic":"白話閱讀","grp":"ak-chinese-11～12","passage":"<p>研究指出，青少年進入青春期後，大腦分泌褪黑激素的時間會往後延，使他們晚上較晚才有睡意，早上也不容易醒來。這並不是懶惰，而是生理時鐘的改變。然而學校多半很早開始上課，使許多學生長期睡眠不足，上課時注意力下降，情緒也較容易起伏。<\/p><p>美國部分學區將第一節課延後約一小時後，學生遲到與缺席的情形減少，考試成績也略有提升。不過，延後上課也讓家長接送、課後活動的時間安排變得更困難，因此是否跟進，各地仍有不同意見。<\/p>"},{"id":"ak-chinese-13","y":"ak","n":13,"html":"根據公告，下列敘述何者正確？","opts":["週一晚上可以到館借書","每張借書證最多可借 21 冊","7 月 21 日仍可以把書投入館外還書箱歸還","預約的書可以線上續借一次"],"ans":"C","exp":"整修期間（7/20～7/22）「還書請投入館外還書箱」，所以 7 月 21 日可以這樣還書。(A)週一休館；(D)預約書不得續借；(B)每證最多 10 冊，21 是借期天數。","topic":"公告判讀","g
