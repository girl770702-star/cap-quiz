,"n":9,"img":"chinese_q09","pk":"115_chinese","ans":"C","exp":"詩人把書比喻成孩子：書被燒時像慈父生氣地把哭鬧的孩子丟開，但又「徐徐復自撫摩之」，慢慢地再去撫摸，表現捨不得書被燒壞的心情。(A)「元氣不可復」是說書受損後無法恢復，不是作者時日無多；(B)是一時的氣憤；(D)「上壽八十」是感嘆人的壽命有限。","goal":"能理解文意","pr":61},{"id":"115-chinese-10","y":"115","n":10,"img":"chinese_q10","pk":"115_chinese","ans":"D","exp":"《魏三體石經》（又稱正始石經）以古文、小篆、隸書三種字體刻成。圖中最下一列字形扁平、有波磔，正是隸書。行書、草書、楷書都不是這部石經的字體。","goal":"能辨別書法字體","pr":70},{"id":"115-chinese-11","y":"115","n":11,"img":"chinese_q11","pk":"115_chinese","ans":"B","exp":"「寫真式描寫」要細密、按次序、客觀地呈現完整形象。(B)依序寫兩手攀、兩腳縮、身子向左傾，像照片一樣客觀具體（出自朱自清〈背影〉）。(A)是議論；(C)、(D)用了大量抽象、象徵性的語彙。","goal":"能應用文本","pr":66},{"id":"115-chinese-12","y":"115","n":12,"img":"chinese_q12","pk":"115_chinese","ans":"D","exp":"文中說後漢高祖的襆頭「左右長尺餘，橫直之，不復上翹，迄今不改」，「迄今」指作者所在的宋代。所以宋代帝王的襆頭是兩腳又長又平直地向左右伸出，就是(D)。","goal":"能應用文本","pr":58},{"id":"115-chinese-13","y":"115","n":13,"img":"chinese_q13","pk":"115_chinese","ans":"A","exp":"作者評論高帝與僧虔比書法「亦猶雞之搏狸」，像雞去和狸貓打架，表示高帝不自量力，可見作者認為高帝的書法不如僧虔。(B)文中沒說子敬天下第一；(C)「稍乏風骨」是作者的評語；(D)「雞之搏狸」也是作者說的，不是僧虔。","goal":"能理解文意","pr":62},{"id":"115-chinese-14","y":"115","n":14,"img":"chinese_q14","pk":"115_chinese","ans":"B","exp":"2022年的大會訂下「2030年以前」全球陸域和海域要有「30%」保護區。所以前面的30指陸域和海域保護區的面積百分比，後面的30指預計達成目標的年分（2030年）。","goal":"能理解文意","pr":57},{"id":"115-chinese-15","y":"115","n":15,"img":"chinese_q15","pk":"115_chinese","ans":"A","exp":"團隊分工、長輩傳授年輕人、長者祈福，都和人與人之間的連結、文化傳承有關，所以有助社群凝聚與文化延續。「成品可以使用至少30年」只是說地毯耐用，和社群凝聚無關。","goal":"能理解文意","pr":57},{"id":"115-chinese-16","y":"115","n":16,"img":"chinese_q16","pk":"115_chinese","ans":"A","exp":"(A)「小女」謙稱自己的女兒，「令嬡」敬稱對方的女兒，使用正確。(B)問對方的哥哥應說「令兄」；(C)對方說的是「愚父子」（自己和兒子），回應卻用「賢昆仲」（敬稱對方兄弟），稱謂不符；(D)「令堂」是對方的母親，回答卻說「家父」，答非所問。","goal":"能依語境評斷稱謂使用的適切性","pr":51},{"id":"115-chinese-17","y":"115","n":17,"img":"chinese_q17","pk":"115_chinese","ans":"D","exp":"文中最後說賈似道「只想寫給喜愛鬥蟋蟀的賭徒參考」，所以《促織經》的目的是教人鬥蟋蟀時如何取勝。(A)歐洲的書晚了三百年才出現，沒說受它啟發；(C)作者說他不像歐洲博物學家那樣熱衷自然。","goal":"能根據文本推論","pr":56},{"id":"115-chinese-18","y":"115","n":18,"img":"chinese_q18","pk":"115_chinese","ans":"D","exp":"子產身為大國宰相，去拜見壺丘子林時卻和弟子們依年齡就座，「能捨之」放下身分，「以心與人相索」用真心與人交往，所以是跳脫貴賤框架、以誠待人。(C)「唯刑三人、殺二人」說明刑罰很少，不是嚴刑峻法。","goal":"能理解文意","pr":49},{"id":"115-chinese-19","y":"115","n":19,"img":"chinese_q19","pk":"115_chinese","ans":"A","exp":"(A)「胸無點墨」指沒有學問，用來說寫不出好文章，正確。(B)「休戚與共」指同甘共苦，不是休息；(C)「間不容髮」比喻情勢危急，不能形容關係好；(D)「瓜田李下」比喻容易引人懷疑的場合，不是田園生活。","goal":"能依語境評斷詞語使用的適切性","pr":50},{"id":"115-chinese-20","y":"115","n":20,"img":"chinese_q20","pk":"115_chinese","ans":"B","exp":"縣令派來的小吏寧可得罪人也要拿到回信才敢回去，蔣堂推斷「令必能者，使人不敢慢其命令如此」，表示縣令管理嚴格、治事有方；後來證實「縣令果能者」。(A)小吏是忠於命令；(C)蔣堂是替縣令宣揚名聲；(D)「卒為名臣」的是縣令。","goal":"能理解文意","pr":42},{"id":"115-chinese-21","y":"115","n":21,"img":"chinese_q21","pk":"115_chinese","ans":"D","exp":"無鬚者嘲笑鬚者臉皮厚，鬍鬚都能鑽透出來；鬚者反擊：「足下面皮更老，這等硬鬚還鑽不透」，意思是對方的臉皮厚到連硬鬍鬚都鑽不出來，所以以鬚者的立場，最硬的是無鬚者的面皮。","goal":"能理解文意","pr":49},{"id":"115-chinese-22","y":"115","n":22,"img":"chinese_q22","pk":"115_chinese","ans":"C","exp":"有人提議把梁山泊抽乾當農田，被質問大雨時水要往哪裡排？貢父說在旁邊再挖一個一樣大的池子就好，等於又把湖挖回來，大家聽了大笑，提議的人很慚愧。可見貢父是用反諷凸顯這個提議的荒謬。(A)提議是為了增加農田，不是解決淹水。","goal":"能理解文意","pr":54},{"id":"115-chinese-23","y":"115","n":23,"img":"chinese_q23","pk":"115_chinese","ans":"B","exp":"甲曲有「月淡」「一枝雪裡」等視覺，以及「暗香」嗅覺；乙曲有「雪散珍珠亂篩」視覺，以及「一枝風送香來」嗅覺。(A)甲沒有以雪喻梅，乙是以珍珠喻雪；(C)甲的次句「霜禽翠羽同期」沒有回答「誰知」；(D)沒有由近而遠的推移。","goal":"能分析文本的寫作手法","pr":46},{"id":"115-chinese-24","y":"115","n":24,"img":"chinese_q24","pk":"115_chinese","ans":"B","pimg":"chinese_p24","grp":"115-chinese-24～25","exp":"第二節寫黑白切是「一盤切碎的心肝腸肺」，咀嚼起來是「零零落落、毫無秩序的酸甜苦辣」，「切碎」的樣子正好呼應「零零落落」。(A)「野性」指夏天的生命力；(C)「啊！原來夏天如此爽口」是讚嘆；(D)沒有象徵人心險惡。","goal":"能分析文本的寫作手法","pr":80},{"id":"115-chinese-25","y":"115","n":25,"img":"chinese_q25","pk":"115_chinese","ans":"A","pimg":"chinese_p24","grp":"115-chinese-24～25","exp":"麻薏帶出「是去年與誰的故事」，黑白切帶出「生活的色香味」，兩節都是透過食物寫出生活的滋味與回憶。(B)沒有引用典故；(C)只有第二節寫黑與白；(D)黑白切不是當季食材。","goal":"能比較不同文本的內容","pr":86},{"id":"115-chinese-26","y":"115","n":26,"img":"chinese_q26","pk":"115_chinese","ans":"B","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"甲文說垂直農法「在密閉的室內種植農作物」，用營養液和LED燈，不受天候直接影響，所以受風災影響比傳統農業少。(A)用水量只有傳統的十分之一；(C)亞洲支持是因為人口稠密，不是成本低；(D)垂直農場目前只能為少數人服務。","goal":"能根據文本推論","pr":71},{"id":"115-chinese-27","y":"115","n":27,"img":"chinese_q27","pk":"115_chinese","ans":"B","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"②把高爾夫球場、運動場修剪的草屑和啤酒廠用過的穀物、麩，回收做成乳牛飼料，讓別處的廢棄物重新被利用，最能呼應「資源循環再生」。①是產量；③畫線部分講機器代勞；④是減少運輸成本。","goal":"能應用文本","pr":87},{"id":"115-chinese-28","y":"115","n":28,"img":"chinese_q28","pk":"115_chinese","ans":"A","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"研究人員說「乳牛應該在自然棲息地漫步」，把牠們搬到工業化環境「不是對待牠們應有的方式」，考量的是動物福利，也就是友善動物。","goal":"能理解文意","pr":88},{"id":"115-chinese-29","y":"115","n":29,"img":"chinese_q29","pk":"115_chinese","ans":"D","pimg":"chinese_p26","grp":"115-chinese-26～29","exp":"兩者都能減少食物里程（樓上種樓下賣、就近銷往當地）、都設在城市、都需要很高的資金成本（成本太高、三億歐元）。漂浮牧場的餵食、擠奶、清理都由機器代勞，並不需要大量人力，所以選(D)。","goal":"能比較不同文本的內容","pr":81},{"id":"115-chinese-30","y":"115","n":30,"img":"chinese_q30","pk":"115_chinese","ans":"D","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"④「有史以來最珍貴的船貨」把孩子比喻成最珍貴的東西，最能看出爸爸對孩子的重視。①②是對家鄉的回憶，③是寫航程的危險。","goal":"能理解文意","pr":84},{"id":"115-chinese-31","y":"115","n":31,"img":"chinese_q31","pk":"115_chinese","ans":"C","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"文中提到「我們穆斯林的清真寺」，家鄉經歷抗議、圍困、轟炸，現在和阿富汗人、敘利亞人等一起在海灘等船、「尋找家園」，還被說是「不速之客」，可知是逃離戰爭的穆斯林難民。","goal":"能理解文意","pr":81},{"id":"115-chinese-32","y":"115","n":32,"img":"chinese_q32","pk":"115_chinese","ans":"A","pimg":"chinese_p30","grp":"115-chinese-30～32","exp":"作者先回憶霍姆斯過去繁華的老城、市場、散步的夜晚，再寫後來的轟炸與死亡，用記憶畫面對照今昔變化。(B)列舉國家是說明難民來自各地；(C)他們是離開家鄉，不是近鄉情怯；(D)海的深廣是凸顯父親的無力。","goal":"能分析文本的寫作手法","pr":51},{"id":"115-chinese-33","y":"115","n":33,"img":"chinese_q33","pk":"115_chinese","ans":"C","pimg":"chinese_p33","grp":"115-chinese-33～34","exp":"文中說「翰林供奉的薪水參照八品京官」。(A)獨立辦公的是翰林學士；(B)翰林供奉「大都不兼職」；(D)翰林供奉會幫皇帝處理奏章。","goal":"能理解文意","pr":83},{"id":"115-chinese-34","y":"115","n":34,"img":"chinese_q34","pk":"115_chinese","ans":"B","pimg":"chinese_p33","grp":"115-chinese-33～34","exp":"翰林學士是從翰林供奉中挑出的佼佼者，「不光文筆一流，還通曉政治」，所以處理政務的能力優於翰林供奉。(A)是翰林學士兼任尚書、侍郎；(C)翰林待詔是陪皇帝玩的「幫閒」；(D)三者都「沒有專門的品級」。","goal":"能根據文本推論","pr":77},{"id":"115-chinese-35","y":"115","n":35,"img":"chinese_q35","pk":"115_chinese","ans":"C","pimg":"chinese_p35","grp":"115-chinese-35～36","exp":"文中說「每人四枝箭……四箭投完，司射計算總分，並宣告此局勝負」，所以四箭算一局。(A)沒有讓分的規定；(B)先秦時以禮數為旨，「而非娛樂競技」；(D)是「三局兩勝」，不是比總分。","goal":"能理解文意","pr":71},{"id":"115-chinese-36","y":"115","n":36,"img":"chinese_q36","pk":"115_chinese","ans":"C","pimg":"chinese_p35","grp":"115-chinese-35～36","exp":"依計分方式計算：第一局客人「×✓×✓」＝散箭1＋散箭1＝2分，主人「✓×✓×」＝有初10＋散箭1＝11分，主人勝。第二局客人「✓×××」＝10分，主人「×✓✓×」＝散箭1＋連中5＝6分，客人勝。第三局客人「×××✓」＝有終15分，主人「✓×××」＝10分，客人勝。客人兩勝一負，是最終贏家，所以(C)正確。","goal":"能應用文本","pr":79},{"id":"115-chinese-37","y":"115","n":37,"img":"chinese_q37","pk":"115_chinese","ans":"C","pimg":"chinese_p37","grp":"115-chinese-37～38","exp":"熱帶大頭家蟻殺死保護金合歡的舉尾蟻，沒有舉尾蟻的金合歡被非洲象破壞的速度快了5～7倍。(A)獅子數量保持穩定；(B)金合歡減少後獅子難以伏擊，斑馬反而較不易被獵殺；(D)舉尾蟻是被殺死，不是不再攻擊。","goal":"能理解文意","pr":80},{"id":"115-chinese-38","y":"115","n":38,"img":"chinese_q38","pk":"115_chinese","ans":"A","pimg":"chinese_p37","grp":"115-chinese-37～38","exp":"研究是在保護區內進行，但外來螞蟻照樣入侵並改變生態，所以無法說明設置保護區有助於維護原始生態。(B)外來種造成衝擊、(C)獅子改獵水牛、(D)舉尾蟻與金合歡的互利關係被破壞後引起連鎖反應，都能從研究中看出。","goal":"能根據文本推論","pr":73},{"id":"115-chinese-39","y":"115","n":39,"img":"chinese_q39","pk":"115_chinese","ans":"C","pimg":"chinese_p39","grp":"115-chinese-39～40","exp":"「嘗從余客荔城」的「客」是「旅居、作客」，當動詞用。(A)「至」是副詞，極、非常；(B)「若」是代名詞，你；(D)「過」是名詞，過錯。","goal":"能理解文言文中字詞的詞性","pr":52},{"id":"115-chinese-40","y":"115","n":40,"img":"chinese_q40","pk":"115_chinese","ans":"C","pimg":"chinese_p39","grp":"115-chinese-39～40","exp":"作者要去杭城，遂哭著要跟去，「余止之」，後來遂留在家鄉，所以是想跟從但聽命留下。(A)過世的是「主母」，而且是遂自己去買湯餅；(B)是怕摔壞主人轎中的東西；(D)文中沒有提到歸葬海山。","goal":"能理解文意","pr":42},{"id":"115-chinese-41","y":"115","n":41,"img":"chinese_q41","pk":"115_chinese","ans":"B","pimg":"chinese_p41","grp":"115-chinese-41～42","exp":"「見食相告」指雞看到食物會呼叫同伴，被視為「仁」。(A)「不見察」是不被賞識；(C)「一舉千里」是一飛就是千里；(D)「去之燕」是離開魯國前往燕國。","goal":"能理解句意","pr":68},{"id":"115-chinese-42","y":"115","n":42,"img":"chinese_q42","pk":"115_chinese","ans":"B","pimg":"chinese_p41","grp":"115-chinese-41～42","exp":"田饒說雞有五德卻被烹來吃，是因為「所從來者近」；黃鵠沒有五德卻被看重，是因為「所從來者遠」。意思是哀公看輕身邊的人才、看重遠方來的人，就像俗語「遠來的和尚會念經」。","goal":"能理解文意","pr":35},{"id":"ak-chinese-1","y":"ak","n":1,"html":"下列文句「」中的字，何者讀音正確？","opts":["面試前他「惴」惴不安，一直深呼吸：ㄓㄨㄟˋ","聽到這個消息，大家都「瞠」目結舌：ㄊㄤˊ","他誤觸法網，最後身陷「囹」圄：ㄌㄧㄥˋ","「莘」莘學子齊聚一堂，準備迎接會考：ㄒㄧㄣ"],"ans":"A","exp":"(A)惴讀ㄓㄨㄟˋ，正確。(B)瞠讀ㄔㄥ；(D)莘莘學子的「莘」讀ㄕㄣ；(C)囹讀ㄌㄧㄥˊ。","topic":"字音"},{"id":"ak-chinese-2","y":"ak","n":2,"html":"下列文句，何者用字完全正確？","opts":["他做事一向按步就班，從不馬虎","這次比賽他脫穎而出，令人刮目相看","面對挑戰，我們要再接再勵，不可放棄","老師的講解言簡意駭，大家一聽就懂"],"ans":"B","exp":"(A)應為「按部就班」；(C)應為「再接再厲」；(D)應為「言簡意賅」。只有(B)完全正確。","topic":"字形"},{"id":"ak-chinese-3","y":"ak","n":3,"html":"下列文句「」中的成語，何者使用最恰當？","opts":["他讀書總是「三心二意」，所以成績始終名列前茅","他筆下的花鳥「栩栩如生」，彷彿就要從紙上飛出來","兩人「一見如故」，從此反目成仇，不相往來","這家新開的餐廳「門可羅雀」，每天都大排長龍"],"ans":"B","exp":"(B)「栩栩如生」形容生動逼真，正確。(D)「門可羅雀」形容冷清，與大排長龍矛盾；(A)三心二意是不專心，與名列前茅不合；(C)一見如故是初見就很投緣，與反目成仇矛盾。","topic":"成語"},{"id":"ak-chinese-4","y":"ak","n":4,"html":"「這趟環島旅行，我最難忘的是三個地方□太魯閣的峽谷、墾丁的海灘，以及阿里山的日出。」根據文意，□處最適合填入哪一個標點符號？","opts":["，","；","：","。"],"ans":"C","exp":"空格後面是在列舉「三個地方」的具體內容，用來提示下文的標點是冒號「：」。","topic":"標點符號"},{"id":"ak-chinese-5","y":"ak","n":5,"html":"「讀書如交友，貴精不貴多。與其匆匆翻過一百本書，不如把一本好書讀上十遍，每一遍都會遇見不同的自己。」這段文字的主旨最接近下列何者？","opts":["讀書要廣泛涉獵，越多越好","交朋友應該以數量為重","好書值得反覆細讀，常讀常新","讀書的速度比讀書的內容重要"],"ans":"C","exp":"作者說讀書「貴精不貴多」，一本好書讀十遍，每遍都有新收穫，主旨是好書值得反覆細讀。(A)(D)與文意相反；(B)交友只是比喻。","topic":"文意理解"},{"id":"ak-chinese-6","y":"ak","n":6,"html":"表哥家的新房子落成，想送一幅匾額祝賀，下列題辭何者最適合？","opts":["美輪美奐","福壽全歸","杏林春暖","弄璋之喜"],"ans":"A","exp":"「美輪美奐」形容房屋高大華美，適合賀新居落成。(D)弄璋之喜賀生男孩；(C)杏林春暖用於讚美醫生；(B)福壽全歸用於輓年長男性。","topic":"題辭"},{"id":"ak-chinese-7","y":"ak","n":7,"html":"「時間是一位沉默的雕刻家，在每個人的臉上刻下歲月的紋路。」這句話主要使用了下列哪一種修辭？","opts":["設問","排比","誇飾","譬喻"],"ans":"D","exp":"「時間是一位雕刻家」把時間比喻成雕刻家，屬於譬喻（暗喻）。沒有誇大、沒有句型相同的排比，也沒有提問。","topic":"修辭"},{"id":"ak-chinese-8","y":"ak","n":8,"html":"《論語》：「三人行，必有我師焉：擇其善者而從之，其不善者而改之。」這段話的意思，與下列何者最接近？","opts":["出門在外最好三人同行，彼此照應","只和品德好的人交往，遠離品德不好的人","老師應該從學生身上學習，教學相長","看到別人的優點就學習，看到缺點就反省自己"],"ans":"D","exp":"「擇其善者而從之」是學習別人的優點，「其不善者而改之」是看到別人的缺點，就反省改正自己。所以是(D)。","topic":"文言單題"},{"id":"ak-chinese-9","y":"ak","n":9,"html":"根據本文，友人感到「慚」愧的原因最可能是下列何者？","opts":["陳太丘不等他就先離開了","被元方指出自己既不守信又沒有禮貌","元方年紀雖小，卻不願理睬他","他遲到太久，被罰不能進門"],"ans":"B","exp":"元方說友人約好中午卻沒來是「無信」，當著兒子的面罵父親是「無禮」，友人聽了覺得慚愧。","topic":"文言題組","grp":"ak-chinese-9～10","passage":"<p>陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。<\/p><p style=\"text-align:right\">——《世說新語》<\/p>"},{"id":"ak-chinese-10","y":"ak","n":10,"html":"文中「尊君在不」的「尊君」，指的是下列何者？","opts":["對方的父親","一國的君王","學生的老師","自己的父親"],"ans":"A","exp":"「尊君」是對別人父親的敬稱，相當於「令尊」；元方說的「家君」才是對自己父親的謙稱。客人問的是元方的父親陳太丘在不在。","topic":"文言題組","grp":"ak-chinese-9～10","passage":"<p>陳太丘與友期行，期日中。過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之，元方入門不顧。<\/p><p style=\"text-align:right\">——《世說新語》<\/p>"},{"id":"ak-chinese-11","y":"ak","n":11,"html":"根據本文，青少年早上不容易起床的主要原因是什麼？","opts":["課業壓力太大","晚上沉迷手機，太晚睡覺","早餐吃得太少","生理時鐘往後延"],"ans":"D","exp":"文中說青春期大腦分泌褪黑激素的時間往後延，「這並不是懶惰，而是生理時鐘的改變」。手機、課業、早餐文中都沒有提到。","topic":"白話閱讀","grp":"ak-chinese-11～12","passage":"<p>研究指出，青少年進入青春期後，大腦分泌褪黑激素的時間會往後延，使他們晚上較晚才有睡意，早上也不容易醒來。這並不是懶惰，而是生理時鐘的改變。然而學校多半很早開始上課，使許多學生長期睡眠不足，上課時注意力下降，情緒也較容易起伏。<\/p><p>美國部分學區將第一節課延後約一小時後，學生遲到與缺席的情形減少，考試成績也略有提升。不過，延後上課也讓家長接送、課後活動的時間安排變得更困難，因此是否跟進，各地仍有不同意見。<\/p>"},{"id":"ak-chinese-12","y":"ak","n":12,"html":"關於文中「延後上課」的說明，下列何者最恰當？","opts":["美國所有學區都已經全面實施","會讓學生的考試成績大幅下降","有好處，但也帶來時間安排上的困難","可以完全解決學生睡眠不足的問題"],"ans":"C","exp":"延後上課讓遲到缺席減少、成績略升（好處），但家長接送和課後活動更難安排（困難）。(D)文中沒說完全解決；(A)只有部分學區；(B)成績是略有提升。","topic":"白話閱讀","grp":"ak-chinese-11～12","passage":"<p>研究指出，青少年進入青春期後，大腦分泌褪黑激素的時間會往後延，使他們晚上較晚才有睡意，早上也不容易醒來。這並不是懶惰，而是生理時鐘的改變。然而學校多半很早開始上課，使許多學生長期睡眠不足，上課時注意力下降，情緒也較容易起伏。<\/p><p>美國部分學區將第一節課延後約一小時後，學生遲到與缺席的情形減少，考試成績也略有提升。不過，延後上課也讓家長接送、課後活動的時間安排變得更困難，因此是否跟進，各地仍有不同意見。<\/p>"},{"id":"ak-chinese-13","y":"ak","n":13,"html":"根據公告，下列敘述何者正確？","opts":["週一晚上可以到館借書","每張借書證最多可借 21 冊","7 月 21 日仍可以把書投入館外還書箱歸還","預約的書可以線上續借一次"],"ans":"C","exp":"整修期間（7/20～7/22）「還書請投入館外還書箱」，所以 7 月 21 日可以這樣還書。(A)週一休館；(D)預約書不得續借；(B)每證最多 10 冊，21 是借期天數。","topic":"公告判讀","grp":"ak-chinese-13～15","passage":"<p><b>【社區圖書館暑期公告】<\/b><\/p><p>一、開放時間：週二至週日 9:00～21:00，週一休館。<br>二、借閱：每證最多借 10 冊，借期 21 天，可線上續借一次（14 天）；預約書不得續借。<br>三、逾期：每冊每日罰款 5 元。<br>四、7 月 20 日至 7 月 22 日館內整修暫停開放，期間還書請投入館外還書箱。<\/p>"},{"id":"ak-chinese-14","y":"ak","n":14,"html":"阿哲借了 3 本書，逾期 4 天才歸還，依公告他需要繳多少罰款？","opts":["20 元","45 元","60 元","84 元"],"ans":"C","exp":"每冊每日 5 元：3 冊 × 4 天 × 5 元 ＝ 60 元。","topic":"公告判讀","grp":"ak-chinese-13～15","passage":"<p><b>【社區圖書館暑期公告】<\/b><\/p><p>一、開放時間：週二至週日 9:00～21:00，週一休館。<br>二、借閱：每證最多借 10 冊，借期 21 天，可線上續借一次（14 天）；預約書不得續借。<br>三、逾期：每冊每日罰款 5 元。<br>四、7 月 20 日至 7 月 22 日館內整修暫停開放，期間還書請投入館外還書箱。<\/p>"},{"id":"ak-chinese-15","y":"ak","n":15,"html":"若想讓一本一般的書借得最久，下列做法何者正確？","opts":["借書後線上續借一次，最長可借 35 天","線上續借兩次，最長可借 49 天","先預約這本書，再線上續借","整修期間不算借期，可多借 3 天"],"ans":"A","exp":"借期 21 天，可線上續借一次 14 天，最長 21＋14＝35 天。(B)只能續借一次；(C)預約書不得續借；(D)公告沒有這樣說。","topic":"公告判讀","grp":"ak-chinese-13～15","passage":"<p><b>【社區圖書館暑期公告】<\/b><\/p><p>一、開放時間：週二至週日 9:00～21:00，週一休館。<br>二、借閱：每證最多借 10 冊，借期 21 天，可線上續借一次（14 天）；預約書不得續借。<br>三、逾期：每冊每日罰款 5 元。<br>四、7 月 20 日至 7 月 22 日館內整修暫停開放，期間還書請投入館外還書箱。<\/p>"}],"english":[{"id":"104-english-1","y":"104","n":1,"img":"104_english_q01","pk":"104_english","ans":"D"},{"id":"104-english-2","y":"104","n":2,"img":"104_english_q02","pk":"104_english","ans":"B"},{"id":"104-english-3","y":"104","n":3,"img":"104_english_q03","pk":"104_english","ans":"D"},{"id":"104-english-4","y":"104","n":4,"img":"104_english_q04","pk":"104_english","ans":"A"},{"id":"104-english-5","y":"104","n":5,"img":"104_english_q05","pk":"104_english","ans":"B"},{"id":"104-english-6","y":"104","n":6,"img":"104_english_q06","pk":"104_english","ans":"B"},{"id":"104-english-7","y":"104","n":7,"img":"104_english_q07","pk":"104_english","ans":"D"},{"
