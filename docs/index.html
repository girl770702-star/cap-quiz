sh_q37","pk":"104_english","ans":"A","pimg":"104_english_p37","grp":"104-english-37～40"},{"id":"104-english-38","y":"104","n":38,"img":"104_english_q38","pk":"104_english","ans":"C","pimg":"104_english_p37","grp":"104-english-37～40"},{"id":"104-english-39","y":"104","n":39,"img":"104_english_q39","pk":"104_english","ans":"C","pimg":"104_english_p37","grp":"104-english-37～40"},{"id":"104-english-40","y":"104","n":40,"img":"104_english_q40","pk":"104_english","ans":"D","pimg":"104_english_p37","grp":"104-english-37～40"},{"id":"105-english-1","y":"105","n":1,"img":"105_english_q01","pk":"105_english","ans":"B"},{"id":"105-english-2","y":"105","n":2,"img":"105_english_q02","pk":"105_english","ans":"A"},{"id":"105-english-3","y":"105","n":3,"img":"105_english_q03","pk":"105_english","ans":"B","exp":"感官動詞 saw + 受詞 + V-ing，表示看到男孩「正在」抓鳥。(A) 動詞用法不能直接接在受詞後；(C) to catch 感官動詞後不用不定詞；(D) 過去分詞是被動，語意不通。"},{"id":"105-english-4","y":"105","n":4,"img":"105_english_q04","pk":"105_english","ans":"B"},{"id":"105-english-5","y":"105","n":5,"img":"105_english_q05","pk":"105_english","ans":"D"},{"id":"105-english-6","y":"105","n":6,"img":"105_english_q06","pk":"105_english","ans":"B","exp":"never ___ classes 是「從不缺課」，miss 在這裡是「錯過、缺席」。(A) lose 是遺失；(D) forget 是忘記，後面接 classes 語意不合。"},{"id":"105-english-7","y":"105","n":7,"img":"105_english_q07","pk":"105_english","ans":"D","exp":"問句 Have you got anything ... yet? 中，yet 用在現在完成式的疑問句，意思是「到目前為止、已經」。(C) soon 不用於這種問句；(B) either 只用於否定句末。"},{"id":"105-english-8","y":"105","n":8,"img":"105_english_q08","pk":"105_english","ans":"B","exp":"肯定句中修飾不可數名詞 bread，用 some。(A) many 只修飾可數名詞複數；(C) any 一般用在否定句或疑問句；(D) one 不能直接接不可數名詞。"},{"id":"105-english-9","y":"105","n":9,"img":"105_english_q09","pk":"105_english","ans":"A"},{"id":"105-english-10","y":"105","n":10,"img":"105_english_q10","pk":"105_english","ans":"C","exp":"兩個人中的「一個…另一個」，固定用 One ... the other ...。因為只有兩位父母，剩下的那一位就是 the other。(A) another 表示三者以上的「另一個」。"},{"id":"105-english-11","y":"105","n":11,"img":"105_english_q11","pk":"105_english","ans":"B","exp":"take care of 的受詞要與主詞 me（我）相同，所以用反身代名詞 myself。(A) me 不能當反身用法；(C)(D) 指的是媽媽，語意不對。"},{"id":"105-english-12","y":"105","n":12,"img":"105_english_q12","pk":"105_english","ans":"A"},{"id":"105-english-13","y":"105","n":13,"img":"105_english_q13","pk":"105_english","ans":"D"},{"id":"105-english-14","y":"105","n":14,"img":"105_english_q14","pk":"105_english","ans":"A","exp":"not been kind to Jennie 是「對 Jennie 不友善」，也就是這五年過得很辛苦，所以她看起來比實際年齡老。(B) special、(C) real 搭配 to 語意不通；(D) enough 要放在形容詞後面。"},{"id":"105-english-15","y":"105","n":15,"img":"105_english_q15","pk":"105_english","ans":"D","exp":"love 後面可接 to V 或 V-ing，但這裡狗是被梳毛的對象，要用被動動名詞 being brushed。(A)(B) 是主動，變成狗去刷別的東西；(C) 時態不合。"},{"id":"105-english-16","y":"105","n":16,"img":"105_english_q16","pk":"105_english","ans":"C","pimg":"105_english_p16","grp":"105-english-16～17"},{"id":"105-english-17","y":"105","n":17,"img":"105_english_q17","pk":"105_english","ans":"A","pimg":"105_english_p16","grp":"105-english-16～17","exp":"文中把 Pinky 街比喻成 a parent（像父母）、living history（活的歷史），也直接稱 the old Pinky。只有 a good friend 完全沒出現。要逐一回文章核對，不要憑印象選。"},{"id":"105-english-18","y":"105","n":18,"img":"105_english_q18","pk":"105_english","ans":"D","pimg":"105_english_p18","grp":"105-english-18～20"},{"id":"105-english-19","y":"105","n":19,"img":"105_english_q19","pk":"105_english","ans":"B","pimg":"105_english_p18","grp":"105-english-18～20","exp":"文中說 All year around, the weather on Piso Island is just wonderful，也就是一年四季天氣都好，對應 nice weather in every season。(A) 特別的車只是導覽用車；(C) 沒提到最受歡迎；(D) 只說是最棒的泥漿溫泉之一，不是數量最多。"},{"id":"105-english-20","y":"105","n":20,"img":"105_english_q20","pk":"105_english","ans":"B","pimg":"105_english_p18","grp":"105-english-18～20"},{"id":"105-english-21","y":"105","n":21,"img":"105_english_q21","pk":"105_english","ans":"C","pimg":"105_english_p21","grp":"105-english-21～22","exp":"暑期班從 7/4 到 7/31，約四週，所以 (A) 錯。餐廳關閉，(B) 錯；借舞鞋是找 Mr. Shum，前一天通知的是訂午餐，(D) 錯。第三週體育館借給球賽，其餘週數籃球課在體育館上，所以選 (C)。"},{"id":"105-english-22","y":"105","n":22,"img":"105_english_q22","pk":"105_english","ans":"C","pimg":"105_english_p21","grp":"105-english-21～22","exp":"線索有：早上背很多單字（英文課）、之後有美術（painting）、下午連上兩小時體育、當天沒有電腦課。對照課表，只有星期三是英文、Painting，下午 Tennis 加 Swimming 兩堂體育且沒有電腦課。(D) 星期四下午只有一堂 Basketball。"},{"id":"105-english-23","y":"105","n":23,"img":"105_english_q23","pk":"105_english","ans":"D","pimg":"105_english_p23","grp":"105-english-23～24"},{"id":"105-english-24","y":"105","n":24,"img":"105_english_q24","pk":"105_english","ans":"B","pimg":"105_english_p23","grp":"105-english-23～24"},{"id":"105-english-25","y":"105","n":25,"img":"105_english_q25","pk":"105_english","ans":"D","pimg":"105_english_p25","grp":"105-english-25～27","exp":"圖 7 說要當瘋子，還必須 make the doctor believe IT，IT 指的就是「士兵真的已經瘋了」這件事，醫生要相信他瘋了才會讓他停飛。(A)(B)(C) 都不是這句話的內容。"},{"id":"105-english-26","y":"105","n":26,"img":"105_english_q26","pk":"105_english","ans":"B","pimg":"105_english_p25","grp":"105-english-25～27","exp":"士兵說 I could die any time I fly，想辦法離開危險工作，可見他重視生命勝過工作。(A) 醫生只是解釋規定；(C) 是醫生先給他規則；(D) catch-22 是這本書出名後才被大家使用。"},{"id":"105-english-27","y":"105","n":27,"img":"105_english_q27","pk":"105_english","ans":"C","pimg":"105_english_p25","grp":"105-english-25～27","exp":"catch-22 是兩難死結：想做 A 必須先有 B，但要有 B 又必須先做 A。(C) 要有經驗才能得到工作，但只有這份工作才能得到經驗，結構完全相同。(A)(B) 只是缺少條件，(D) 只是不確定對方意願。"},{"id":"105-english-28","y":"105","n":28,"img":"105_english_q28","pk":"105_english","ans":"C","pimg":"105_english_p28","grp":"105-english-28～31"},{"id":"105-english-29","y":"105","n":29,"img":"105_english_q29","pk":"105_english","ans":"D","pimg":"105_english_p28","grp":"105-english-28～31","exp":"Ellie 說 Olivia 不喜歡死魚、這家餐廳賣海鮮；Alec 回答 you're wrong about this one，this one 指的就是前面 Ellie 猜測的「Olivia 不喜歡吃什麼食物」。(B) 文中沒討論原因。"},{"id":"105-english-30","y":"105","n":30,"img":"105_english_q30","pk":"105_english","ans":"D","pimg":"105_english_p28","grp":"105-english-28～31","exp":"Alec 聽到 Olivia 怕有六隻腳的東西後，說 I'll just take her somewhere else，表示不再帶她去 Buzzing World。(A)(B)(C) 文中都沒有這樣的內容；Lori 還暗示這次約會之後不會有下一次。"},{"id":"105-english-31","y":"105","n":31,"img":"105_english_q31","pk":"105_english","ans":"C","pimg":"105_english_p28","grp":"105-english-28～31","exp":"Lori 說照這個計畫，這會是 Alec 和 Olivia 唯一一次約會，表示計畫不好。同意她的 Emily 最可能叫 Alec 改計畫。(A) 與 Lori 立場相反；(B)(D) 都沒有直接指出計畫要改。"},{"id":"105-english-32","y":"105","n":32,"img":"105_english_q32","pk":"105_english","ans":"C","pimg":"105_english_p32","grp":"105-english-32～34","exp":"報導重點是第一個案例六月出現後，兩個月內幾乎全國都有，並且死牛數量達 5,000 頭，說明傳播得比預期快。(A)(D) 文中說還不知道怎麼處理；(B) 完全沒提到人會不會感染。"},{"id":"105-english-33","y":"105","n":33,"img":"105_english_q33","pk":"105_english","ans":"A","pimg":"105_english_p32","grp":"105-english-32～34"},{"id":"105-english-34","y":"105","n":34,"img":"105_english_q34","pk":"105_english","ans":"A","pimg":"105_english_p32","grp":"105-english-32～34"},{"id":"105-english-35","y":"105","n":35,"img":"105_english_q35","pk":"105_english","ans":"B","pimg":"105_english_p35","grp":"105-english-35～38","exp":"這句描述 Molly 離開時，想記住店「當時」的樣子，與 wanted 同一個過去時間點，用過去式 looked like。(A) 過去完成式表示更早之前；(C)(D) 時態與過去情境不合。"},{"id":"105-english-36","y":"105","n":36,"img":"105_english_q36","pk":"105_english","ans":"C","pimg":"105_english_p35","grp":"105-english-35～38","exp":"「幾小時後人們會來清店」，是以過去的時間點來看將要發生的事，所以用 was going to change 表示過去的未來。(B) 單純過去式表示已發生；(A)(D) 時態也不符。"},{"id":"105-english-37","y":"105","n":37,"img":"105_english_q37","pk":"105_english","ans":"A","pimg":"105_english_p35","grp":"105-english-35～38","exp":"Before it was a bakery 說的是以前這裡曾是咖啡店，現在已不是，用 used to be 表示過去的狀態。(D) is 表示現在還是；(B)(C) 都沒有「過去曾經」的意思。"},{"id":"105-english-38","y":"105","n":38,"img":"105_english_q38","pk":"105_english","ans":"A","pimg":"105_english_p35","grp":"105-english-35～38","exp":"Molly 「決定關店」是過去的事，而「希望麵包店成為家族事業」發生在決定之前，所以用過去完成式 had wanted。(B) 現在完成式與過去情境不合；(C)(D) 是未來或假設。"},{"id":"105-english-39","y":"105","n":39,"img":"105_english_q39","pk":"105_english","ans":"D","pimg":"105_english_p39","grp":"105-english-39～41","exp":"下一句說各種組合是否算家庭，贊成比例不同，可知大家對「什麼才算家庭」想法不一。(A)(C) 與開始組成家庭無關；(B) 沒有與上一代比較。"},{"id":"105-english-40","y":"105","n":40,"img":"105_english_q40","pk":"105_english","ans":"B","pimg":"105_english_p39","grp":"105-english-39～41","exp":"文中比較有小孩與沒小孩的伴侶：未婚有小孩 81% 認為是家庭，沒小孩降到 40%；同性伴侶也是 60% 對 32%。所以「有沒有小孩」才是關鍵。(A) 結婚與否不是比較的重點。"},{"id":"105-english-41","y":"105","n":41,"img":"105_english_q41","pk":"105_english","ans":"A","pimg":"105_english_p39","grp":"105-english-39～41","exp":"前面說多數同住的同性伴侶覺得結婚沒問題，後面用 However 轉折說不是每個人都接受，可見空格要填符合前半的結果「這並不令人意外」。(C)(D) 與 However 後的轉折語氣不合。"},{"id":"106-english-1","y":"106","n":1,"img":"106_english_q01","pk":"106_english","ans":"B"},{"id":"106-english-2","y":"106","n":2,"img":"106_english_q02","pk":"106_english","ans":"B"},{"id":"106-english-3","y":"106","n":3,"img":"106_english_q03","pk":"106_english","ans":"C"},{"id":"106-english-4","y":"106","n":4,"img":"106_english_q04","pk":"106_english","ans":"A","exp":"「被卡車撞到」要用被動語態 be + 過去分詞，hit 的過去分詞仍是 hit。(B) led 是「被帶領」，(C) lost 是「被弄丟」，(D) paid 是「被付錢」，都與 badly hurt 的情境不合。"},{"id":"106-english-5","y":"106","n":5,"img":"106_english_q05","pk":"106_english","ans":"A"},{"id":"106-english-6","y":"106","n":6,"img":"106_english_q06","pk":"106_english","ans":"D"},{"id":"106-english-7","y":"106","n":7,"img":"106_english_q07","pk":"106_english","ans":"D"},{"id":"106-english-8","y":"106","n":8,"img":"106_english_q08","pk":"106_english","ans":"A","exp":"前一句說大家驚訝他們決定結婚，後一句說他們常吵架、在一起不快樂，所以「沒人知道為什麼」要結婚，選 why。(B) where、(C) when、(D) how 都無法連到後面吵架的原因。"},{"id":"106-english-9","y":"106","n":9,"img":"106_english_q09","pk":"106_english","ans":"D","exp":"books 是複數，後面又用冒號補充說明這些書，所以主詞要用複數代名詞 they，動詞 look 才一致。(A) it 是單數，(B) one 與 (C) some 放在這裡語意與文法都不通順。"},{"id":"106-english-10","y":"106","n":10,"img":"106_english_q10","pk":"106_english","ans":"A"},{"id":"106-english-11","y":"106","n":11,"img":"106_english_q11","pk":"106_english","ans":"B"},{"id":"106-english-12","y":"106","n":12,"img":"106_english_q12","pk":"106_english","ans":"A","exp":"in the last few days 表示「從過去到現在」一直持續的狀態，要用現在完成式 has been。後句 I hope the sun will come out soon 也說明現在仍是陰雨。(B) 過去完成式要有更早的過去時間點；(C)(D) 是未來式，與 last few days 不合。"},{"id":"106-english-13","y":"106","n":13,"img":"106_english_q13","pk":"106_english","ans":"A","exp":"All the excuses Nick made 是主詞（Nick made 是修飾 excuses 的形容詞子句），句子還缺主要動詞，所以用複數主詞搭配的 say。(B) saying 不能單獨當動詞；(C) which say 會多出一個子句；(D) to say 不是動詞。"},{"id":"106-english-14","y":"106","n":14,"img":"106_english_q14","pk":"106_english","ans":"B","exp":"從 you don't even know she's just passed by（你甚至不知道她走過去）、feet ever touch the floor 可知她走路非常輕，選 lightly「輕輕地」。(A) freely 是自由地，(C) shyly 是害羞地，(D) slowly 是慢慢地，慢走並不會讓人沒察覺。"},{"id":"106-english-15","y":"106","n":15,"img":"106_english_q15","pk":"106_english","ans":"D","exp":"but now it is part of our everyday life 表示以前大家覺得寄電子郵件、上網看新聞是很新奇、沒人做過的點子，所以用 fresh「新穎的」。(A) simple、(B) popular、(C) good 都無法和「過去人們不認同、現在卻變日常」形成轉折。"},{"id":"106-english-16","y":"106","n":16,"img":"106_english_q16","pk":"106_english","ans":"C","pimg":"106_english_p16","grp":"106-english-16～18"},{"id":"106-english-17","y":"106","n":17,"img":"106_english_q17","pk":"106_english","ans":"B","pimg":"106_english_p16","grp":"106-english-16～18","exp":"海報規定可以拿來交換的是一般書籍，不收教科書、漫畫與字典，書也必須乾淨、沒有寫字。(A) 字典、(D) 數學課的習作都被排除，(C) 有自己的筆記不符合「上面不能有字」，只有 (B) 英文短篇故事集合格。"},{"id":"106-english-18","y":"106","n":18,"img":"106_english_q18","pk":"106_english","ans":"C","pimg":"106_english_p16","grp":"106-english-16～18","exp":"活動分兩階段：3/2–3/14 要用一本書換一張活動卡，3/16–3/31 才是用卡換書。Sean 已有卡，所以要在後半段使用，3/23 在 3/16–3/31 之間。(A)(B) 在前半段，是拿書來換卡的時間；(D) 3/29 雖在後半段，但那天是星期一，圖書館休館。"},{"id":"106-english-19","y":"106","n":19,"img":"106_english_q19","pk":"106_english","ans":"D","pimg":"106_english_p19","grp":"106-english-19～21"},{"id":"106-english-20","y":"106","n":20,"img":"106_english_q20","pk":"106_english","ans":"D","pimg":"106_english_p19","grp":"106-english-19～21","exp":"文中那個人看到「我」看見他袋子裡的繩子、刀子與女用鞋子等東西，立刻慌忙把東西收回袋中並生氣地看著我們，可見他不想被看見袋中物品。(A) 沒有真的攻擊；(B) 是他逃進黑暗，不是作者追過去；(C) 作者其實認為他就是通緝的殺人犯。"},{"id":"106-english-21","y":"106","n":21,"img":"106_english_q21","pk":"106_english","ans":"C","pimg":"106_english_p19","grp":"106-english-19～21"},{"id":"106-english-22","y":"106","n":22,"img":"106_english_q22","pk":"106_english","ans":"C","pimg":"106_english_p22","grp":"106-english-22～24","exp":"the catch 在這裡是指「好事背後隱藏的問題」。Ruth 又給票又給訂位，Nate 覺得不像她，才問 What's the catch；後來才知道她要 Nate 照顧討厭的狗 Charlie 一整個星期。(A)(B)(D) 都不是這種「看似很好、其實藏著條件」的意思。"},{"id":"106-english-23","y":"106","n":23,"img":"106_english_q23","pk":"106_english","ans":"A","pimg":"106_english_p22","grp":"106-english-22～24","exp":"Nate 說 I need to think about it，it 指的是 Ruth 剛剛拜託的事，也就是「讓 Charlie 在他家待一個星期」，所以是照顧 Charlie。(B)(C) 是 Ruth 提供的好處，(D) 是 Ruth 自己要去度假。"},{"id":"106-english-24","y":"106","n":24,"img":"106_english_q24","pk":"106_english","ans":"D","pimg":"106_english_p22","grp":"106-english-22～24","exp":"Nate 一開始就說票早就賣光、餐廳也客滿，對 Ruth 竟能拿到票和訂位感到驚訝，所以包含 Leeds 訂位的事。(A) 要去倫敦的是這個星期五，不是下週六；(B) 文中沒提 Ruth 訂旅館有困難；(C) Ruth 說 You're my last hope，表示 Nate 是最後的希望，不是第一個想到的人。"},{"id":"106-english-25","y":"106","n":25,"img":"106_english_q25","pk":"106_english","ans":"B","pimg":"106_english_p25","grp":"106-english-25～26"},{"id":"106-english-26","y":"106","n":26,"img":"106_english_q26","pk":"106_english","ans":"A","pimg":"106_english_p25","grp":"106-english-25～26","exp":"第三段 Sadly this problem has been around for a long time 緊接在前面談醫師連續工作 34 小時、一週工作 104 小時之後，所以 this problem 指的是醫師工時過長。(B)(C)(D) 文中都沒有提到。"},{"id":"106-english-27","y":"106","n":27,"img":"106_english_q27","pk":"106_english","ans":"C","pimg":"106_english_p27","grp":"106-english-27～28"},{"id":"106-english-28","y":"106","n":28,"img":"106_english_q28","pk":"106_english","ans":"B","pimg":"106_english_p27","grp":"106-english-27～28","exp":"一箱 NT$250，另加服務費 NT$50，只有訂單超過 NT$1,000 才免服務費。買三箱是 750 元，沒超過 1,000，所以要加 3×50＝150 元，總共 NT$900。(A) 20–40% 是賣相不好的蔬果比例；(C) 文中沒有說能選形狀；(D) 寄烹飪照片即有機會得食譜書，不用買六箱。"},{"id":"106-english-29","y":"106","n":29,"img":"106_english_q29","pk":"106_english","ans":"A","pimg":"106_english_p29","grp":"106-english-29～30","exp":"第 3 則說 Dashing Shuttle 是全國第一個開通 Apple City 和 Orange Island 巴士的業者，表示 7/1 以前這條線不存在。(B) 去 Mango Island 原本要在 Melon City 轉車，不是 Berry City；(C) 往 Grape Town 的直達線停駛，要轉車，反而不會更快；(D) 第 1 則是「增加」三班，表示原本就有。"},{"id":"106-english-30","y":"106","n":30,"img":"106_english_q30","pk":"106_english","ans":"D","pimg":"106_english_p29","grp":"106-english-29～30"},{"id":"106-english-31","y":"106","n":31,"img":"106_english_q31","pk":"106_english","ans":"B","pimg":"106_english_p31","grp":"106-english-31～33","exp":"文章提到美國電影在各國越來越受歡迎，本國電影的市占率下降，也就是全球化改變了各國本地電影市場。(A)(C) 文中沒有提到製作方式或電影人聚集；(D) 文中沒有比較美國境內外的收入。"},{"id":"106-english-32","y":"106","n":32,"img":"106_english_q32","pk":"106_english","ans":"D","pimg":"106_english_p31","grp":"106-english-31～33","exp":"文章說大家歡迎美國電影，其實也等於接受美國的思考方式，所以美國電影受歡迎可能代表美國的思考方式也受歡迎。(A) 文章是擔心本國思考方式流失，不是說美國思考方式會改變；(B) 沒有提到民眾要求政府協助；(C) 英語的原因文中沒提。"},{"id":"106-english-33","y":"106","n":33,"img":"106_english_q33","pk":"106_english","ans":"B","pimg":"106_english_p31","grp":"106-english-31～33","exp":"對照圖 2：法國 45→42、義大利 34→19、西班牙 22→18、英國 17→5、德國 17→16，五國的本國電影比例都下降。(A) 西班牙美國電影變動 9，並非最小；(C) 英國降最多（12）；(D) 英國的美國電影也從 81 降到 74，所以不是「本國降、美國升」。"},{"id":"106-english-34","y":"106","n":34,"img":"106_english_q34","pk":"106_english","ans":"C","pimg":"106_english_p34","grp":"106-english-34～37","exp":"從 has been unhappy these months 與後面 But all this changed 可知，Jerry 過去是成功的刨冰店老闆，現在已經不是了，所以用 used to be 表示「過去曾經是」。(A) is 是現在仍是；(B) has been 表示一直到現在；(D) 未來意圖與語意不合。"},{"id":"106-english-35","y":"106","n":35,"img":"106_english_q35","pk":"106_english","ans":"A","pimg":"106_english_p34","grp":"106-english-34～37","exp":"前面說對面餅乾店搶走一半生意，And ... when Dan came 接著要表示情況沒有好轉，反而讓他更困擾，所以選 things didn't get better。後文說 Dan 讓人免費試吃卻很少人買，生意沒起色，與此呼應。(C) 生意開始上升與後文矛盾。"},{"id":"106-english-36","y":"106","n":36,"img":"106_english_q36","pk":"106_english","ans":"B","pimg":"106_english_p34","grp":"106-english-34～37","exp":"前文 Jerry 一直想把 Dan 送走卻不知怎麼辦，接著 one day 之後說「來自對面」，後面又說對 Jerry 是個好機會，所以空格是好消息來了。(A)(C) 都是壞事，與 great chance 矛盾；(D) 與後文也沒有關聯。"},{"id":"106-english-37","y":"106","n":37,"img":"106_english_q37","pk":"106_english","ans":"C","pimg":"106_english_p34","grp":"106-english-34～37","exp":"餅乾店「當時正在找」店員，與 one day 這個過去時間點同時發生，用過去進行式 was looking for。(A) 是過去習慣；(B) 現在完成式與整段過去式不合；(D) 過去完成式要有更早發生的動作，這裡並沒有。"},{"id":"106-english-38","y":"106","n":38,"img":"106_english_q38","pk":"106_english","ans":"C","pimg":"106_english_p38","grp":"106-english-38～41","exp":"第一次旅程讓 Scott 成為明星，第二次對比起來要說明代價。文末提到團隊沒有人活著回去，Scott 自己也死在途中，所以是 cost him his life。(A) 只講健康受損，太輕；(D) 是在第二次沒有達成夢想（Amundsen 先到），與事實相反。"},{"id":"106-english-39","y":"106","n":39,"img":"106_english_q39","pk":"106_english","ans":"B","pimg":"106_english_p38","grp":"106-english-38～41","exp":"However 表示轉折：Scott 想成為第一個站上南極點的人，但下一句說他將和 Amundsen 競賽，所以空格要說他不是唯一有這個夢想的人。(A)(C)(D) 都沒有表現出「有競爭對手」的轉折，也不符合下一句 He would be in a race。"},{"id":"106-english-40","y":"106","n":40,"img":"106_english_q40","pk":"106_english","ans":"D","pimg":"106_english_p38","grp":"106-english-38～41","exp":"空格後說 Amundsen 用狗、Scott 用馬，又說馬不擅長在雪地行走，所以花了 77 天才到。這代表兩隊的交通方式決定了誰先到。(A) 馬並非人氣方法；(C) 文中沒有說 Amundsen 不懂動物；(B) 沒有談出發前的問題。"},{"id":"106-english-41","y":"106","n":41,"img":"106_english_q41","pk":"106_english","ans":"C","pimg":"106_english_p38","grp":"106-english-38～41","exp":"前一句說 Scott 被輸給 Amundsen 的消息重重打擊，what he didn't know was that 後面接的是他當時還不知道的事：更糟的事還在後頭，後文果然提到天氣惡劣、食物缺乏、隊友全數死亡。(A) 與結局矛盾；(B)(D) 文中沒有提到。"},{"id":"107-english-1","y":"107","n":1,"img":"107_english_q01","pk":"107_english","ans":"B"},{"id":"107-english-2","y":"107","n":2,"img":"107_english_q02","pk":"107_english","ans":"D"},{"id":"107-english-3","y":"107","n":3,"img":"107_english_q03","pk":"107_english","ans":"B","exp":"Mr. Wu 在廚房「煮東西的時候」嬰兒哭了，描述過去某時間點正在進行的動作，要用過去進行式 was cooking。(A) 只表示煮過，沒有「正在」的意思；(C) 現在完成式與過去時間 when the baby cried 不合。"},{"id":"107-english-4","y":"107","n":4,"img":"107_english_q04","pk":"107_english","ans":"C","exp":"this morning 是已經過去的時間，丟錢包是過去發生的單一動作，用過去式 lost 即可。(A) had lost 是更早之前的事，題目沒有另一個過去時間點可比較；(D) 過去進行式表示當時正在丟，語意不通。"},{"id":"107-english-5","y":"107","n":5,"img":"107_english_q05","pk":"107_english","ans":"B"},{"id":"107-english-6","y":"107","n":6,"img":"107_english_q06","pk":"107_english","ans":"C"},{"id":"107-english-7","y":"107","n":7,"img":"107_english_q07","pk":"107_english","ans":"D"},{"id":"107-english-8","y":"107","n":8,"img":"107_english_q08","pk":"107_english","ans":"D"},{"id":"107-english-9","y":"107","n":9,"img":"107_english_q09","pk":"107_english","ans":"B"},{"id":"107-english-10","y":"107","n":10,"img":"107_english_q10","pk":"107_english","ans":"D","exp":"It takes + 人 + 時間 + to V，表示「花多少時間做某事」，所以用 to find out。(A)(B)(C) 都無法接在 lots of time 後面形成這個句型。"},{"id":"107-english-11","y":"107","n":11,"img":"107_english_q11","pk":"107_english","ans":"C","exp":"主詞 singers 是複數，且歌手是「被」看見，要用被動語態 are often seen，頻率副詞 often 放在 be 動詞後。(A) 不定詞沒有動詞；(B) 缺 be 動詞；(D) and 後面多餘，連接詞不能這樣用。"},{"id":"107-english-12","y":"107","n":12,"img":"107_english_q12","pk":"107_english","ans":"A"},{"id":"107-english-13","y":"107","n":13,"img":"107_english_q13","pk":"107_english","ans":"B"},{"id":"107-english-14","y":"107","n":14,"img":"107_english_q14","pk":"107_english","ans":"A","exp":"or 後面接的是更輕微的說法：就算不看出嚴重問題，「至少」也會覺得不對勁，所以用 at least。(B) even 與 (D) still 語意不通；(C) in fact 表示事實上，不是遞減的語氣。"},{"id":"107-english-15","y":"107","n":15,"img":"107_english_q15","pk":"107_english","ans":"A","exp":"前半句說「想讀好幾個月」，後半句說「今天終於借到了」，兩者是順接關係，結果導致行動，用 so 表示因果。(A) and 沒有因果意味，語氣較弱；(B) since 與 (D) until 的意思都不符。"},{"id":"107-english-16","y":"107","n":16,"img":"107_english_q16","pk":"107_english","ans":"C","pimg":"107_english_p16","grp":"107-english-16～18","exp":"根據下一句 Shortly after Robert saw it, it was gone，Robert 看到了一個東西又消失，後面說那是蛇，所以是「會動的東西」，that could move。(A) like a snake 會直接說出是蛇，與後文才注意到蛇不符。"},{"id":"107-english-17","y":"107","n":17,"img":"107_english_q17","pk":"107_english","ans":"A","pimg":"107_english_p16","grp":"107-english-16～18","exp":"Robert 坐在長椅上，後來發現剛才看到的蛇出現了，而他嚇得不敢離開長椅，表示蛇就在他身邊，所以是 stopping beside his feet。(A) 爬上長椅會讓他立刻起身離開，與「太害怕而不敢動」不合。"},{"id":"107-english-18","y":"107","n":18,"img":"107_english_q18","pk":"107_english","ans":"C","pimg":"107_english_p16","grp":"107-english-16～18","exp":"女子說的是對寵物蛇 Robert 的話，不是對人。蛇在長椅上，女子會說「人們會被你嚇到」，這與後文她對蛇說話相符，所以選 People will be scared by you。(A)(B)(D) 都和蛇在長椅上的情境無關。"},{"id":"107-english-19","y":"107","n":19,"img":"107_english_q19","pk":"107_english","ans":"A","pimg":"107_english_p19","grp":"107-english-19～21","exp":"後文先舉例「停車位總數不變」，目的是讓人開車更困難、減少車輛，所以 smart ways 是要 make traffic lighter（減少車流）。(D) 蓋更多停車位與文中「總數不變」相反。"},{"id":"107-english-20","y":"107","n":20,"img":"107_english_q20","pk":"107_english","ans":"D","pimg":"107_english_p19","grp":"107-english-19～21","exp":"前一段講停車位限制，這段講另一個方法：計算進城的車輛數，兩者是並列的第二個措施，所以用 Also。(A) This way 通常接在結果前；(B) However 表示轉折；(C) For example 要舉前面的例子，這裡不是舉例。"},{"id":"107-english-21","y":"107","n":21,"img":"107_english_q21","pk":"107_english","ans":"A","pimg":"107_english_p19","grp":"107-english-19～21","exp":"最後說 The answer is simple: The city wants to make more space for its people，是在回答「蘇黎世為什麼這樣做」，所以用 why Zurich is doing this。(C)(D) 以 if 開頭，答案就不會是「要給人更多空間」。"},{"id":"107-english-22","y":"107","n":22,"img":"107_english_q22","pk":"107_english","ans":"C","pimg":"107_english_p22","grp":"107-english-22～24"},{"id":"107-english-23","y":"107","n":23,"img":"107_english_q23","pk":"107_english","ans":"B","pimg":"107_english_p22","grp":"107-english-22～24","exp":"文中說公寓價格含兩人，第三、四個人只要多付一點，朋友或家人一起旅行最划算，所以適合三人以上的團體。(A)(C)(D) 文中都沒有提到一日遊、交朋友或鄉村。"},{"id":"107-english-24","y":"107","n":24,"img":"107_english_q24","pk":"107_english","ans":"A","pimg":"107_english_p22","grp":"107-english-22～24","exp":"at your disposal 前後說客廳、廚房、書房、臥室都是供你自己使用，所以意思是可以自由使用。(B)(C)(D) 與前後文的描述都不相符。"},{"id":"107-english-25","y":"107","n":25,"img":"107_english_q25","pk":"107_english","ans":"C","pimg":"107_english_p25","grp":"107-english-25～26"},{"id":"107-english-26","y":"107","n":26,"img":"107_english_q26","pk":"107_english","ans":"B","pimg":"107_english_p25","grp":"107-english-25～26","exp":"步驟 2 說 T-shirt 有 16 種顏色，步驟 5 說口袋的顏色可以「再從 16 種顏色中選」，所以兩者都能從十六種顏色中選。(A) 圖中沒有最低購買數量；(C)(D) 流程圖也沒提到背面圖案或退貨。"},{"id":"107-english-27","y":"107","n":27,"img":"107_english_q27","pk":"107_english","ans":"A","pimg":"107_english_p27","grp":"107-english-27～28"},{"id":"107-english-28","y":"107","n":28,"img":"107_english_q28","pk":"107_english","ans":"C","pimg":"107_english_p27","grp":"107-english-27～28"},{"id":"107-english-29","y":"107","n":29,"img":"107_english_q29","pk":"107_english","ans":"D","pimg":"107_english_p29","grp":"107-english-29～31","exp":"文中說被水弄濕的動物會變重，跑起來更困難，而跑得快常決定能否存活，所以甩乾身體可能幫助動物在危險時跑得更快。(A) 文中說都是從頭開始；(B)(C) 文中都沒有提到。"},{"id":"107-english-30","y":"107","n":30,"img":"107_english_q30","pk":"107_english","ans":"D","pimg":"107_english_p29","grp":"107-english-29～31","exp":"文中說小動物要甩得更快，大動物用較少次數就能弄乾，表示大動物每次甩動能甩掉較多水。(A) 文中沒有說尾巴能幫助跑步；(B)(C) 文中都沒有這樣說。"},{"id":"107-english-31","y":"107","n":31,"img":"107_english_q31","pk":"107_english","ans":"B","pimg":"107_english_p29","grp":"107-english-29～31","exp":"文中說體型越小的動物要甩得越快：老鼠 18 次、狗 6 次、熊 4 次，所以老虎應該最慢、貓居中、老鼠最快。只有 (B) 圖符合 tiger 最少、mouse 最多的趨勢。(D) 剛好相反。"},{"id":"107-english-32","y":"107","n":32,"img":"107_english_q32","pk":"107_english","ans":"A","pimg":"107_english_p32","grp":"107-english-32～34","exp":"Eric 一直提出擔心，例如店家會不會不給、不窮的人也來要、窮人會不會怕丟臉，Josh 才說「你為什麼總說這種事」，所以 things like that 指的是對免費咖啡計畫的各種疑慮和問題。(C)(D) 是正面的說法，與 Eric 的擔憂不符。"},{"id":"107-english-33","y":"107","n":33,"img":"107_english_q33","pk":"107_english","ans":"A","pimg":"107_english_p32","grp":"107-english-32～34","exp":"Josh 回答了 Eric 的每個疑問，但 Eric 最後仍說「這種事可能會發生」，表示 Josh 沒能完全說服他。(B) 有信心的是 Josh；(C) 兩人沒有找到解決丟臉問題的方法；(D) Josh 認為店主誠實。"},{"id":"107-english-34","y":"107","n":34,"img":"107_english_q34","pk":"107_english","ans":"D","pimg":"107_english_p32","grp":"107-english-32～34","exp":"Josh 說店裡有一塊黑板，寫著已付費的杯數與已送出的杯數，所以看黑板就知道還有沒有免費咖啡可領。(A) Eric 才質疑店家無法分辨誰真的窮；(B)(C) 對話中都沒提到。"},{"id":"107-english-35","y":"107","n":35,"img":"107_english_q35","pk":"107_english","ans":"B","pimg":"107_english_p35","grp":"107-english-35～37","exp":"文章先說鯨魚數量大減與捕鯨問題 (b)，再說明部落把捕鯨當作生活方式 (c)，最後要大家思考是否該要求部落放棄捕鯨 (a)，順序是 b→c→a。"},{"id":"107-english-36","y":"107","n":36,"img":"107_english_q36","pk":"107_english","ans":"C","pimg":"107_english_p35","grp":"107-english-35～37","exp":"作者說部落捕鯨已成為生活方式、甚至是他們身分的一部分，並要大家想想要求他們放棄是否合適，可見他認為部落的生活方式與動物生命同樣重要。(A) 作者反對一概禁止；(B) 作者並沒有說不用擔心鯨魚數量；(D) 文中沒有提到。"},{"id":"107-english-37","y":"107","n":37,"img":"107_english_q37","pk":"107_english","ans":"D","pimg":"107_english_p35","grp":"107-english-35～37","exp":"文中說部落獵鯨取肉，因為土地幾乎種不出東西，還把鯨脂做成油來做蠟燭或油燈，所以捕鯨在不同方面幫助他們的生活。(C) 是 1,500 年前開始捕鯨，但並未說當時造成問題；(A)(B) 文中沒有提到。"},{"id":"107-english-38","y":"107","n":38,"img":"107_english_q38","pk":"107_english","ans":"C","pimg":"107_english_p38","grp":"107-english-38～41"},{"id":"107-english-39","y":"107","n":39,"img":"107_english_q39","pk":"107_english","ans":"D","pimg":"107_english_p38","grp":"107-english-38～41","exp":"Goode 用假名寫書，是希望別人認真看待他的書，而這個獎是全國最大的書獎，可見作家們很重視它。(A)(B)(C) 文中都沒有提到，不能推論；Cole 是第一位新手得獎者，不代表獎項只給新手。"},{"id":"107-english-40","y":"107","n":40,"img":"107_english_q40","pk":"107_english","ans":"C","pimg":"107_english_p38","grp":"107-english-38～41","exp":"文中說 Goode 以圖畫書出名，但曾嘗試寫「嚴肅」的書，還想用別的名字出版，可見他不想只被當成圖畫書作家。(A) 他得過的是兩個全國書獎，不是 Inscriber；(B) 目前他還沒有回應；(D) 他的圖畫書很成功。"},{"id":"107-english-41","y":"107","n":41,"img":"107_english_q41","pk":"107_english","ans":"A","pimg":"107_english_p38","grp":"107-english-38～41"},{"id":"109-english-1","y":"109","n":1,"img":"109_english_q01","pk":"109_english","ans":"B"},{"id":"109-english-2","y":"109","n":2,"img":"109_english_q02","pk":"109_english","ans":"A"},{"id":"109-english-3","y":"109","n":3,"img":"109_english_q03","pk":"109_english","ans":"C"},{"id":"109-english-4","y":"109","n":4,"img":"109_english_q04","pk":"109_english","ans":"A","exp":"家中三個小孩，我是最小的，所以比我大的就是另外兩個姊姊，兩者都是姊姊要用 Both。(B) Few 和 (C) Most 用在三者以上的多數；(D) Some 的語氣不確定，與「剛好兩人」不合。"},{"id":"109-english-5","y":"109","n":5,"img":"109_english_q05","pk":"109_english","ans":"A"},{"id":"109-english-6","y":"109","n":6,"img":"109_english_q06","pk":"109_english","ans":"C"},{"id":"109-english-7","y":"109","n":7,"img":"109_english_q07","pk":"109_english","ans":"B","exp":"句中有 For the past twenty years（過去二十年來），表示從過去持續到現在的動作，要用現在完成式 has worked。(A) 過去式只說過去，沒有延續到現在；(C) 現在進行式不適合長達二十年的期間。"},{"id":"109-english-8","y":"109","n":8,"img":"109_english_q08","pk":"109_english","ans":"C","exp":"save sb. time 是「幫某人節省時間」，用電話訂票不用出門，所以是節省時間。(D) takes 要寫成 It takes us a lot of time，意思是「花很多時間」，與 great 的語氣相反；(A) lends 是借出。"},{"id":"109-english-9","y":"109","n":9,"img":"109_english_q09","pk":"109_english","ans":"D"},{"id":"109-english-10","y":"109","n":10,"img":"109_english_q10","pk":"109_english","ans":"A","exp":"Sue 回答要辦大型烤肉派對，是在說「怎麼慶祝」，所以問句要用 how you will celebrate。(B) where 問地點、(D) when 問時間，Sue 的回答都沒有提到；(C) what 與答句的「方式」不合。"},{"id":"109-english-11","y":"109","n":11,"img":"109_english_q11","pk":"109_english","ans":"D","exp":"like 後面可接不定詞，而「被告知」是被動，要用 to be told；主詞 Alison 不喜歡「被人告訴該做什麼」。(B) to tell 是主動，變成「告訴別人」，意思不對；(A)、(C) 的形式不能直接接在 like 後面。"},{"id":"109-english-12","y":"109","n":12,"img":"109_english_q12","pk":"109_english","ans":"A"},{"id":"109-english-13","y":"109","n":13,"img":"109_english_q13","pk":"109_english","ans":"A","exp":"電話一通接一通，「又一通」要用 another（另一個，不特定）。(D) the other 是指兩者中剩下的那一個，但這裡電話不只兩通；(B) each 是「每一個」，不是「再多一個」，語意不合。"},{"id":"109-english-14","y":"109","n":14,"img":"109_english_q14","pk":"109_english","ans":"D"},{"id":"109-english-15","y":"109","n":15,"img":"109_english_q15","pk":"109_english","ans":"D","exp":"後面說他「更在意」口袋的形狀和大小，表示價格在他心中的重要性比其他東西低，而且是最低，所以用 the least。(B) the most 與 even more about 的意思相反；(A)、(C) 是兩者比較，這裡是和多個條件比較。"},{"id":"109-english-16","y":"109","n":16,"img":"109_english_q16","pk":"109_english","ans":"C","pimg":"109_english_p16","grp":"109-english-16～17","exp":"詩中襯衫與短褲在晾衣繩上跳舞、樹和花搖擺、雲在賽跑、外套被吹進池塘、樹葉被吹走、池面起波紋，這些都是風造成的。(B) 雨不會讓衣服跳舞或把樹葉吹走；(A) 太陽、(D) 彩虹也不會讓東西移動。"},{"id":"109-english-17","y":"109","n":17,"img":"109_english_q17","pk":"109_english","ans":"C","pimg":"109_english_p16","grp":"109-english-16～17","exp":"詩中 Dad's face falls 的意思是爸爸的臉沉下來，因為他的外套和牛仔褲被風吹進池塘，新車還被樹葉弄髒，所以他不開心。(A) 沒有說他害怕；(B) 與臉色沉下來相反；(D) 他很在意衣服和車子，並不是沒興趣。"},{"id":"109-english-18","y":"109","n":18,"img":"109_english_q18","pk":"109_english","ans":"A","pimg":"109_english_p18","grp":"109-english-18～19","exp":"Matt 說他在上一次的 yard sale 交到好朋友，表示他辦過 yard sale，有經驗。(B) Jamie 說的是上週寄出很多東西送人，不是辦 yard sale；(C) Albert 是說星期六最好，不是天氣；(D) Debby 說的是網路上可以賣更高的價錢，不是比較便宜。"},{"id":"109-english-19","y":"109","n":19,"img":"109_english_q19","pk":"109_english","ans":"D","pimg":"109_english_p18","grp":"109-english-18～19","exp":"Jamie 先說「Debby 說得對」，同意 Debby 認為辦 yard sale 很麻煩、賺不多的看法。(A) Albert 和 Matt 說的是賺錢，Matt 另外才提到交朋友；(B) Albert 認為可以賺大錢；(C) Jamie 主張直接送人，Matt 並沒有同意。"},{"id":"109-english-20","y":"109","n":20,"img":"109_english_q20","pk":"109_english","ans":"D","pimg":"109_english_p20","grp":"109-english-20～21"},{"id":"109-english-21","y":"109","n":21,"img":"109_english_q21","pk":"109_english","ans":"B","pimg":"109_english_p20","grp":"109-english-20～21","exp":"Sammy 有 7 張，6 張可以加 200 元買杯子，所以 (B) 可行。(A) 價錢應是 200 元；若要免費拿杯子需要 12 張，還差 5 張，要再花 250 元，所以 (C) 的 3 張、(D) 的 4 張都不夠。"},{"id":"109-english-22","y":"109","n":22,"img":"109_english_q22","pk":"109_english","ans":"B","pimg":"109_english_p22","grp":"109-english-22～24","exp":"文中說大鍋裝一半溫水，小鍋放在大鍋上面，巧克力、奶油、糖放在小鍋裡，且水不能進入小鍋。(B) 完全符合；(A) 的溫水跑進小鍋；(C)、(D) 是把巧克力倒進大鍋或水倒進裝巧克力的鍋，都不對。"},{"id":"109-english-23","y":"109","n":23,"img":"109_english_q23","pk":"109_english","ans":"B","pimg":"109_english_p22","grp":"109-english-22～24"},{"id":"109-english-24","y":"109","n":24,"img":"109_english_q24","pk":"109_english","ans":"B","pimg":"109_english_p22","grp":"109-english-22～24","exp":"文中說 Keep the water under 50°C，所以水溫不能高過 50 度。(A) 文中只說兩個名稱都有人用，沒有比較好壞；(C) 要攪拌約五到十分鐘；(D) 文中說通常要把奶油和糖都放進去一起攪拌。"},{"id":"109-english-25","y":"109","n":25,"img":"109_english_q25","pk":"109_english","ans":"D","pimg":"109_english_p25","grp":"109-english-25～27"},{"id":"109-english-26","y":"109","n":26,"img":"109_english_q26","pk":"109_english","ans":"A","pimg":"109_english_p25","grp":"109-english-25～27"},{"id":"109-english-27","y":"109","n":27,"img":"109_english_q27","pk":"109_english","ans":"C","pimg":"109_english_p25","grp":"109-english-25～27","exp":"that 指的是上一句「希望有一個像唐人街、韓國城、小義大利那樣的街區，專賣台灣食物」。(B) (D) 文中沒有提到；(A) 只是一家餐廳，不是整個街區，也不是 Yangs 的食物車能促成的規模。"},{"id":"109-english-28","y":"109","n":28,"img":"109_english_q28","pk":"109_english","ans":"B","pimg":"109_english_p28","grp":"109-english-28～30"},{"id":"109-english-29","y":"109","n":29,"img":"109_english_q29","pk":"109_english","ans":"D","pimg":"109_english_p28","grp":"109-english-28～30","exp":"文章說大腦在晚上 11 點到早上 8 點分泌幫助睡眠的褪黑激素，表示在褪黑激素分泌時比較容易睡著。(A) 文中沒說太多會傷腦；(B) 11 點之後才開始分泌；(C) 文中沒說睡久會讓分泌變多。"},{"id":"109-english-30","y":"109","n":30,"img":"109_english_q30","pk":"109_english","ans":"D","pimg":"109_english_p28","grp":"109-english-28～30","exp":"另一個研究說有些學生同意自己在早晨的課學得比較好，但 Selena 的信說青少年的大腦在早上運作得不好，兩者意見不同，所以答案是 No。(A)、(B)、(C) 雖然是信裡的內容，但 (A) 只講睡眠時間、(C) 只講到校時間，不能用來比較；(B) 若說 Yes 也不對，因為兩者其實不一致。"},{"id":"109-english-31","y":"109","n":31,"img":"109_english_q31","pk":"109_english","ans":"C","pimg":"109_english_p31","grp":"109-english-31～34","exp":"文章說島可能在 2025 年被海淹沒，居民正與 ReLocate 等團體努力，但沒人確定結果，只能祈禱，可見他們正為最後的希望奮戰。(B) 還沒變成歷史；(A)、(D) 與文中居民努力求生的情況不符。"},{"id":"109-english-32","y":"109","n":32,"img":"109_english_q32","pk":"109_english","ans":"D","pimg":"109_english_p31","grp":"109-english-31～34"},{"id":"109-english-33","y":"109","n":33,"img":"109_english_q33","pk":"109_english","ans":"B","pimg":"109_english_p31","grp":"109-english-31～34","exp":"作者在文中提到搬村子要花上億元，而居民不知道錢從哪裡來，所以他們可能籌不到足夠的錢搬遷。(A) 文中說是公司造成問題，不是居民；(C)、(D) 文中沒有表達這些看法。"},{"id":"109-english-34","y":"109","n":34,"img":"109_english_q34","pk":"109_english","ans":"C","pimg":"109_english_p31","grp":"109-english-31～34","exp":"文中說現在已沒有夠厚的北極冰能保護他們不受風雨侵襲，表示以前的冰在壞天氣時能保護他們。(A) 文中說島可能被海水淹沒，沒說冰蓋住島；(B) 沒說冰融化害死人；(D) 沒有提到冰給他們足夠的水。"},{"id":"109-english-35","y":"109","n":35,"img":"109_english_q35","pk":"109_english","ans":"C","pimg":"109_english_p35","grp":"109-english-35～37","exp":"第一段說在決定長途通勤能不能接受之前，最好先知道它會怎樣改變你的生活，後面整篇都在說睡眠、時間、健康、心情的變化。(D) 文章沒有比較各種交通方式；(A)、(B) 與後文內容無關。"},{"id":"109-english-36","y":"109","n":36,"img":"109_english_q36","pk":"109_english","ans":"B","pimg":"109_english_p35","grp":"109-english-35～37","exp":"空格後面說研究顯示通勤久的人容易變胖、有頸背問題和心臟問題，這些都是健康問題，所以填 hurts your health。(A) 文中沒提到花錢；(C)、(D) 文中也沒有談到交通或地球。"},{"id":"109-english-37","y":"109","n":37,"img":"109_english_q37","pk":"109_english","ans":"B","pimg":"109_english_p35","grp":"109-english-35～37","exp":"前面說的是身體健康的問題，後面說的是常生氣、不快樂等心理與工作上的影響，又多了另一類問題，所以用 But that's not all 連接。(A) 前後沒有因果；(C) 後面不是舉例；(D) 沒有說可以停止這些問題。"},{"id":"109-english-38","y":"109","n":38,"img":"109_english_q38","pk":"109_english","ans":"A","pimg":"109_english_p38","grp":"109-english-38～41","exp":"前面說大家都知道奧運對主辦城市有很多好處，但慕尼黑人民卻不想辦，對想爭取主辦權的城市來說，這是令人驚訝的消息。(B)、(C) 與慕尼黑反對的事實不合；(D) 要指的是大家早就聽過，但文章說的是剛發生的事。"},{"id":"109-english-39","y":"109","n":39,"img":"109_english_q39","pk":"109_english","ans":"B","pimg":"109_english_p38","grp":"109-english-38～41","exp":"前面說奧運對主辦城市通常有好處，後面說對慕尼黑人而言卻可能引來大麻煩，所以奧運對他們是另一回事 are a different story。(C)、(D) 的正面意思與後面「麻煩」相反；(A) 時態和語意都不合。"},{"id":"109-english-40","y":"109","n":40,"img":"109_english_q40","pk":"109_english","ans":"D","pimg":"109_english_p38","grp":"109-english-38～41","exp":"空格後面說慕尼黑辦過 1972 年夏季奧運，鄰近小鎮也辦過 1936 年冬季奧運，所以他們的不想辦不是亂猜，而是從經驗中得到的教訓。(A)、(B)、(C) 都無法接到後面這些過去的主辦經驗。"},{"id":"109-english-41","y":"109","n":41,"img":"109_english_q41","pk":"109_english","ans":"A","pimg":"109_english_p38","grp":"109-english-38～41","exp":"前面說其他城市不擔心慕尼黑付出的重大代價，後面接著說他們反而很高興，語氣是進一步補充事實，用 In fact（事實上）。(B) If so 表示「如果是這樣」，與文意不合；(D) Finally 表示最後，前後並沒有順序關係。"},{"id":"110-english-1","y":"110","n":1,"img":"110_english_q01","pk":"110_english","ans":"D"},{"id":"110-english-2","y":"110","n":2,"img":"110_english_q02","pk":"110_english","ans":"C"},{"id":"110-english-3","y":"110","n":3,"img":"110_english_q03","pk":"110_english","ans":"D"},{"id":"110-english-4","y":"110","n":4,"img":"110_english_q04","pk":"110_english","ans":"A"},{"id":"110-english-5","y":"110","n":5,"img":"110_english_q05","pk":"110_english","ans":"C","exp":"句中有 since + 過去時間點（一年前來台灣工作），表示從過去一直延續到現在的狀態，要用現在完成式 hasn't seen。(A) 過去式只說當時沒見，沒有延續到現在；(B) 現在簡單式不能搭配 since 表示一段期間。"},{"id":"110-english-6","y":"110","n":6,"img":"110_english_q06","pk":"110_english","ans":"B","exp":"前面說 seldom laughs，後面的空格要代替 laughs 這個動詞，避免重複。一般動詞的肯定句用 does 來代替並加強語氣：when she does (laugh)。can、will 後面要接原形動詞，has 則要接過去分詞，都不能單獨代替 laughs。"},{"id":"110-english-7","y":"110","n":7,"img":"110_english_q07","pk":"110_english","ans":"D","exp":"第一句說姊姊「今天要來」，要待一個星期，是還沒發生的事，所以用未來式 will stay。(A) 現在簡單式不表示未來的臨時打算；(B) 過去式、(C) 現在完成式都是已發生的事。"},{"id":"110-english-8","y":"110","n":8,"img":"110_english_q08","pk":"110_english","ans":"B"},{"id":"110-english-9","y":"110","n":9,"img":"110_english_q09","pk":"110_english","ans":"B"},{"id":"110-english-10","y":"110","n":10,"img":"110_english_q10","pk":"110_english","ans":"A","exp":"前半句說 Jimmy 不肯起床，後半句說爸爸已經叫了好幾次，兩句語氣是讓步、轉折（即使爸爸叫了好幾次，他還是不起床），所以用 although。(B) because 的因果不通順；(C) if 與 (D) until 的意思也不合。"},{"id":"110-english-11","y":"110","n":11,"img":"110_english_q11","pk":"110_english","ans":"C","exp":"後句說生意一直沒有好轉，最後只好關店，可知 Duncan 是想「挽救」媽媽留給他的書店，所以用 save。(A) build 與 (D) start 是從無到有，但書店是媽媽留下來的；(B) buy 也不合，因為書店已經是他的。"},{"id":"110-english-12","y":"110","n":12,"img":"110_english_q12","pk":"110_english","ans":"C","exp":"songs 後面省略了關係代名詞 that：songs (that) they learned at school，意思是「他們在學校學的歌」。(A) 不能直接接在名詞後面；(B) that learned 變成歌曲自己會學習，語意不合；(D) 時態用 are learned 變成被動且不合句意。"},{"id":"110-english-13","y":"110","n":13,"img":"110_english_q13","pk":"110_english","ans":"B"},{"id":"110-english-14","y":"110","n":14,"img":"110_english_q14","pk":"110_english","ans":"A","exp":"Matt 說「看看你能不能在裡面找到一些」，if 條件句中表示「一些」要用 any。tools 是複數，不能用單數的 (B) it；(C) others 是「另外的其他東西」，前面沒有提過一組東西；(D) those 指特定的那些，也不合。"},{"id":"110-english-15","y":"110","n":15,"img":"110_english_q15","pk":"110_english","ans":"B","pimg":"110_english_p15","grp":"110-english-15～16"},{"id":"110-english-16","y":"110","n":16,"img":"110_english_q16","pk":"110_english","ans":"D","pimg":"110_english_p15","grp":"110-english-15～16","exp":"廣告中 Surprise 1 是加入會員、Surprise 3 是購物、Surprise 5 是邀請朋友，都能得到點數。Surprise 2 只是已經是會員的人輸入卡號領「免費禮物」，並沒有說會得到點數，所以選 (D)。"},{"id":"110-english-17","y":"110","n":17,"img":"110_english_q17","pk":"110_english","ans":"B","pimg":"110_english_p17","grp":"110-english-17～18"},{"id":"110-english-18","y":"110","n":18,"img":"110_english_q18","pk":"110_english","ans":"C","pimg":"110_english_p17","grp":"110-english-17～18","exp":"Lynn 說她在 Caldron 吃到的東西都在同一個鍋子裡煮，吃起來都一樣，也不覺得自己煮有趣，最後說兩人對「好經驗」的看法不同，可見她不喜歡那裡的食物。(A) 她只是不喜歡在餐廳自己煮；(B) 她不愛吃奇怪的東西；(D) 她並沒有說服 Joey。"},{"id":"110-english-19","y":"110","n":19,"img":"110_english_q19","pk":"110_english","ans":"A","pimg":"110_english_p19","grp":"110-english-19～21","exp":"日記說 Woollie 四歲逃走、六年後被找到，剪毛那天正好是 Katie 出生的日子，所以當時 Woollie 已十歲，比 Katie 年長。(B) 羊毛是賣掉來幫助生病的孩子，不是帶牠去探望；(C) 牠是年老時才生病；(D) 牠是羊毛太多才不像羊。"},{"id":"110-english-20","y":"110","n":20,"img":"110_english_q20","pk":"110_english","ans":"C","pimg":"110_english_p19","grp":"110-english-19～21"},{"id":"110-english-21","y":"110","n":21,"img":"110_english_q21","pk":"110_english","ans":"C","pimg":"110_english_p19","grp":"110-english-19～21","exp":"put down 用在動物身上，是指因為病重無法治療而讓牠安樂死。後文 I hope Woollie will be happy up there in the sky 也暗示牠已經死了。(A)(B)(D) 都與上下文的悲傷情境不合。"},{"id":"110-english-22","y":"110","n":22,"img":"110_english_q22","pk":"110_english","ans":"A","pimg":"110_english_p22","grp":"110-english-22～24","exp":"文中說 Matisse 在 1916 年畫這幅畫，兒子 Pierre 當時已去當兵，Matisse 不知道他能不能回來，所以作畫時兒子不在家。(B) 作者只是猜測那位女子可能是老師或媽媽，其實是另一幅畫；(C) 灰色顯示孩子心情不好；(D) 蠟燭快燒完表示已練習很久。"},{"id":"110-english-23","y":"110","n":23,"img":"110_english_q23","pk":"110_english","ans":"D","pimg":"110_english_p22","grp":"110-english-22～24","exp":"do that 指前面剛說的事：把他自己另一幅畫 Woman on a High Stool 放進這幅畫裡。後面還說「畫裡還有另一件 Matisse 的作品」（雕像），所以是把先前的作品放進新畫中。(A) 家人與 (C) 有趣的顏色都與文中不符。"},{"id":"110-english-24","y":"110","n":24,"img":"110_english_q24","pk":"110_english","ans":"C","pimg":"110_english_p22","grp":"110-english-22～24","exp":"文中稱呼 Matisse 的方式有 the artist、the painter 和 a worried father。the poor kid 是作者用來指畫中的兒子 Pierre，不是指 Matisse，所以選 (C)。"},{"id":"110-english-25","y":"110","n":25,"img":"110_english_q25","pk":"110_english","ans":"B","pimg":"110_english_p25","grp":"110-english-25～28"},{"id":"110-english-26","y":"110","n":26,"img":"110_english_q26","pk":"110_english","ans":"A","pimg":"110_english_p25","grp":"110-english-25～28","exp":"文章說第一屆教師節是 1930 年訂在 6 月 6 日，1939 年改成 8 月 27 日，1952 年又改為 9 月 28 日，可見日期曾經不同。(B) 是老師們自己發起的；(C) 只說孔子是 2500 年前的人，並非慶祝 2500 年；(D) 當初不是老師決定用孔子生日。"},{"id":"110-english-27","y":"110","n":27,"img":"110_english_q27","pk":"110_english","ans":"B","pimg":"110_english_p25","grp":"110-english-25～28","exp":"hail 在這裡是「歡迎、讚許」的意思。後面接著說教師節從來和孔子無關，孔子也不能代表所有老師，可見有人不歡迎這個決定，所以是 not everyone welcomed。"},{"id":"110-english-28","y":"110","n":28,"img":"110_english_q28","pk":"110_english","ans":"C","pimg":"110_english_p25","grp":"110-english-25～28"},{"id":"110-english-29","y":"110","n":29,"img":"110_english_q29","pk":"110_english","ans":"D","pimg":"110_english_p29","grp":"110-english-29～31"},{"id":"110-english-30","y":"110","n":30,"img":"110_english_q30","pk":"110_english","ans":"D","pimg":"110_english_p29","grp":"110-english-29～31","exp":"從信中說明，往返 Green City 與 Cloud City 的火車會改走 Smoke Town - Spring Town 線並且每站都停，Hill Town 就在這條線上，所以搭這類火車可以到 Hill Town。(A) 仍有火車停 Spring Town；(B) 改線火車不是都停 Cloud City；(C) 免費巴士不到 Gray Village。"},{"id":"110-english-31","y":"110","n":31,"img":"110_english_q31","pk":"110_english","ans":"A","pimg":"110_english_p29","grp":"110-english-29～31","exp":"Black Town 在被關閉的 Sand Town - Spring Town 線上，要靠免費巴士，而北上的巴士要在 Spring Town 搭、南下的巴士要在 Green City 搭。James 住 Smoke Town，要先往北到 Green City，搭 RL202（Cloud City 到 Green City，走 Smoke Town 線且每站停），再換免費巴士往南。"},{"id":"110-english-32","y":"110","n":32,"img":"110_english_q32","pk":"110_english","ans":"D","pimg":"110_english_p32","grp":"110-english-32～34","exp":"文章先介紹圖書館是祕密地下圖書館（c 特別之處），再說戰爭帶來的種種問題（a），接著說明學生為了幫助孩子而蓋圖書館（b），最後談圖書館如何讓人忘記痛苦、懷抱希望（d），順序是 c→a→b→d。"},{"id":"110-english-33","y":"110","n":33,"img":"110_english_q33","pk":"110_english","ans":"B","pimg":"110_english_p32","grp":"110-english-32～34"},{"id":"110-english-34","y":"110","n":34,"img":"110_english_q34","pk":"110_english","ans":"A","pimg":"110_english_p32","grp":"110-english-32～34","exp":"文章說這是在戰爭中，為了幫助孩子學習而蓋的地下圖書館，所以是戰爭期間興建。(B) 文中只說蓋在地下是為了避免被炸，沒說它被炸過；(C) 目的是幫助孩子學習；(D) 書多半是從 Darayya 被炸毀的房子找來的。"},{"id":"110-english-35","y":"110","n":35,"img":"110_english_q35","pk":"110_english","ans":"D","pimg":"110_english_p35","grp":"110-english-35～37","exp":"信中說「原本告訴你派對會在 ___ 」，但現在搬家了，所以改到 Mosman Garden，並提醒不要去舊家旁邊的 Northbank Park。這代表原先說的地點就是 Northbank Park。"},{"id":"110-english-36","y":"110","n":36,"img":"110_english_q36","pk":"110_english","ans":"A","pimg":"110_english_p35","grp":"110-english-35～37","exp":"but 之後與前面的「可能會下雨」形成轉折，後面說下雨就把派對移到家裡，表示早有備案，所以填 we have a plan if this happens。(B) 與 (C) 沒有提到雨天的安排；(D) 與後面已經說明的做法重複。"},{"id":"110-english-37","y":"110","n":37,"img":"110_english_q37","pk":"110_english","ans":"C","pimg":"110_english_p35","grp":"110-english-35～37","exp":"if we're lucky and it is fine 是慣用說法，意思是「如果我們運氣好，天氣又晴朗」，表示晴天不一定，要靠運氣。(A) crazy、(B) good、(D) strong 都不能與 we're 搭配成這個意思。"},{"id":"110-english-38","y":"110","n":38,"img":"110_english_q38","pk":"110_english","ans":"C","pimg":"110_english_p38","grp":"110-english-38～41","exp":"這句寫的是過去那一刻的情況，主詞 stories 加上 all，表示許多故事當時「一個接一個湧入腦中」，用過去進行式 were all coming。(A) 現在進行式時態不合；(B) 現在完成式也不合；(D) would come 表示過去的習慣或未來的假設。"},{"id":"110-english-39","y":"110","n":39,"img":"110_english_q39","pk":"110_english","ans":"A","pimg":"110_english_p38","grp":"110-english-38～41","exp":"空格後面是 stupid thing，前面已經說過「第一件蠢事」（進公園），這裡再說「另一件」蠢事，所以用 another。(B) one 不能直接接單數名詞；(C) the last 與 (D) the other 都是特定的，不合文意。"},{"id":"110-english-40","y":"110","n":40,"img":"110_english_q40","pk":"110_english","ans":"B","pimg":"110_english_p38","grp":"110-english-38～41","exp":"前一句說作者希望樹能擋一些雨，意思是「樹真的擋住了雨」，用助動詞 did 代替 kept some rain off（過去式肯定）。後面的 But 轉折也呼應。(A) have、(C) had 與時態不合；(D) would 語意不合。"},{"id":"110-english-41","y":"110","n":41,"img":"110_english_q41","pk":"110_english","ans":"A","pimg":"110_english_p38","grp":"110-english-38～41","exp":"男子大喊的 What? 表示他很驚訝，說他剛才「一直在試著」把包包還給你。因為這是在說他剛才追著跑的當下，用過去進行式 was trying 最合適。(B) try 與 (D) will try 不合時態；(C) would try 是過去的未來，語意不合。"},{"id":"111-english-1","y":"111","n":1,"img":"111_english_q01","pk":"111_english","ans":"A"},{"id":"111-english-2","y":"111","n":2,"img":"111_english_q02","pk":"111_english","ans":"A"},{"id":"111-english-3","y":"111","n":3,"img":"111_english_q03","pk":"111_english","ans":"C"},{"id":"111-english-4","y":"111","n":4,"img":"111_english_q04","pk":"111_english","ans":"C"},{"id":"111-english-5","y":"111","n":5,"img":"111_english_q05","pk":"111_english","ans":"B","exp":"老師要求「必須」留下來完成作業，要用表示義務的 had to（have to 的過去式）。(A) 沒能做到；(C) 希望；(D) 過去習慣，都不符合「被老師要求」的語意。"},{"id":"111-english-6","y":"111","n":6,"img":"111_english_q06","pk":"111_english","ans":"A","exp":"make a choice 是固定搭配，「做選擇」；Kevin 只能在包包和鞋子中選一樣，所以是 hard choice。(B) gift 是禮物、(C) rule 是規則、(D) trick 是把戲，都不能搭配 make。"},{"id":"111-english-7","y":"111","n":7,"img":"111_english_q07","pk":"111_english","ans":"B"},{"id":"111-english-8","y":"111","n":8,"img":"111_english_q08","pk":"111_english","ans":"B","exp":"It takes + 人 + 時間 + to V 是「花時間做某事」的句型，所以空格要用 to prepare。(A) 原形、(C) 動名詞、(D) 過去分詞都不能接在 lots of time 後面表示目的。"},{"id":"111-english-9","y":"111","n":9,"img":"111_english_q09","pk":"111_english","ans":"A"},{"id":"111-english-10","y":"111","n":10,"img":"111_english_q10","pk":"111_english","ans":"D"},{"id":"111-english-11","y":"111","n":11,"img":"111_english_q11","pk":"111_english","ans":"C"},{"id":"111-english-12","y":"111","n":12,"img":"111_english_q12","pk":"111_english","ans":"B","exp":"颱風離開後仍看不到太陽，是因為更大的雨「緊接著」會來，用 follow（跟著來）最合理。(A) catch 是接住或趕上；(C) move 是移動；(D) stop 是停止，意思都相反或不通。"},{"id":"111-english-13","y":"111","n":13,"img":"111_english_q13","pk":"111_english","ans":"D","exp":"弟弟「正要出門」吃晚餐時我剛好到家，過去某個時間點正在進行或即將發生的動作，用過去進行式 was going out。(A) 是現在式；(C) 現在完成式不能搭配 Yesterday；(B) 單純過去式則表示他已出門，就無法邀我同行。"},{"id":"111-english-14","y":"111","n":14,"img":"111_english_q14","pk":"111_english","ans":"C"},{"id":"111-english-15","y":"111","n":15,"img":"111_english_q15","pk":"111_english","ans":"B"},{"id":"111-english-16","y":"111","n":16,"img":"111_english_q16","pk":"111_english","ans":"C","exp":"saw a woman get in his car and drive away：get 與 drive 是 see 後面並列的動作，所以用 and 連接，且 saw 的受詞後面接原形動詞，要用 and drive。(B) 缺少連接詞；(D) drove 時態不對，不能與原形 get 並列。"},{"id":"111-english-17","y":"111","n":17,"img":"111_english_q17","pk":"111_english","ans":"D","exp":"who 指的是 the little girl，女孩是「被帶走」，要用被動語態；且是過去發生的事，所以用過去式被動 was taken away。(A) 是主動；(B) 缺 be 動詞；(C) 現在完成式是主動語態。"},{"id":"111-english-18","y":"111","n":18,"img":"111_english_q18","pk":"111_english","ans":"C","exp":"我們錯過的是「剛才那班」特定的公車，要用代名詞 it 指代前面提到的特定事物。(A) another 是另一個；(C) one 泛指任何一個同類；(D) them 是複數，與 the bus 不符。"},{"id":"111-english-19","y":"111","n":19,"img":"111_english_q19","pk":"111_english","ans":"A"},{"id":"111-english-20","y":"111","n":20,"img":"111_english_q20","pk":"111_english","ans":"D","exp":"故事中 Josh 說「Why are they trolling me like this?」，他以為大家想聽他的看法，結果得到的卻是惡意留言，所以 trolling 是在網路上寫東西傷人或惹人生氣。(A) 唱歌慶祝、(B) 使移動、(C) 拖釣線，都與上下文無關。"},{"id":"111-english-21","y":"111","n":21,"img":"111_english_q21","pk":"111_english","ans":"C","pimg":"111_english_p21","grp":"111-english-21～22"},{"id":"111-english-22","y":"111","n":22,"img":"111_english_q22","pk":"111_english","ans":"C","pimg":"111_english_p21","grp":"111-english-21～22","exp":"廣告要求明信片要寫姓名、生日、電話、電子郵件、最喜愛的茶，並貼兩張茶杯圖。Jason 的明信片已有姓名、電話、電子郵件、喜愛的茶與兩張圖，只缺生日。(B) 地址是收件人的地址，並未要求寄件人寫。"},{"id":"111-english-23","y":"111","n":23,"img":"111_english_q23","pk":"111_english","ans":"D","pimg":"111_english_p23","grp":"111-english-23～24"},{"id":"111-english-24","y":"111","n":24,"img":"111_english_q24","pk":"111_english","ans":"C","pimg":"111_english_p23","grp":"111-english-23～24","exp":"這份「隱藏在食物與飲料中的糖」清單，列出各種食物含糖量，讓人發現自己不知不覺吃進超過每日建議的糖。(A) 糖對身體的傷害已在另一區塊說明；(B)、(D) 圖表都沒有提到。"},{"id":"111-english-25","y":"111","n":25,"img":"111_english_q25","pk":"111_english","ans":"A","pimg":"111_english_p25","grp":"111-english-25～26"},{"id":"111-english-26","y":"111","n":26,"img":"111_english_q26","pk":"111_english","ans":"C","pimg":"111_english_p25","grp":"111-english-25～26","exp":"A to Z 是從字母 A 到 Z 的意思，引申為「從頭到尾、全部」。文中 Darrell 在網站上找到做巧克力蛋糕「從選巧克力到烤蛋糕到做糖花」的完整過程，所以是學到關於它的一切。"},{"id":"111-english-27","y":"111","n":27,"img":"111_english_q27","pk":"111_english","ans":"A","pimg":"111_english_p27","grp":"111-english-27～29"},{"id":"111-english-28","y":"111","n":28,"img":"111_english_q28","pk":"111_english","ans":"D","pimg":"111_english_p27","grp":"111-english-27～29","exp":"文章最後說，對於「喜歡運動、卻太忙沒時間去健身房的人」，Tabata 可能就是答案；另外也說很少運動或有心臟問題的人可能不適合。所以 (B)、(C) 不對，適合的是已經有運動習慣的人。"},{"id":"111-english-29","y":"111","n":29,"img":"111_english_q29","pk":"111_english","ans":"B","pimg":"111_english_p27","grp":"111-english-27～29"},{"id":"111-english-30","y":"111","n":30,"img":"111_english_q30","pk":"111_english","ans":"D","pimg":"111_english_p30","grp":"111-english-30～32"},{"id":"111-english-31","y":"111","n":31,"img":"111_english_q31","pk":"111_english","ans":"A","pimg":"111_english_p30","grp":"111-english-30～32","exp":"this 指的是前一句：工作時數愈長，愈有機會加薪與升遷，於是「長時間工作」成了證明自己勤奮的方式，作者認為這種觀念必須改變。(B)、(C) 只是現象，(D) 是研究結果，都不是被批評的對象。"},{"id":"111-english-32","y":"111","n":32,"img":"111_english_q32","pk":"111_english","ans":"D","pimg":"111_english_p30","grp":"111-english-30～32","exp":"由圖二可看出，工作約 2,200 小時時，男女加薪與升遷的機會都約 13%，幾乎相同。(A) 圖一沒有區分男女；(B) 圖一數字有升有降，並非逐年增加；(C) 多數時候是女性機會較高。"},{"id":"111-english-33","y":"111","n":33,"img":"111_english_q33","pk":"111_english","ans":"D","pimg":"111_english_p33","grp":"111-english-33～36","exp":"1961 年英國部分加入後，國家改名為 Federal Republic of Cameroon，所以 1962 年應是一個整體的聯邦共和國，沒有再分成兩區。(A) 是 1919 年以前的名稱；(B) 是 1919-1960 年分成兩部分；(C) 是 1960 年英國部分尚未加入。"},{"id":"111-english-34","y":"111","n":34,"img":"111_english_q34","pk":"111_english","ans":"B","pimg":"111_english_p33","grp":"111-english-33～36","exp":"文中說英語使用者在政府機關難找工作、常被要求說法語，所以對政府感到憤怒，且決定要為自己奮鬥。resentful 是「憤恨的」，意思接近 angry。(A) 難過、(C) 小心、(D) 擔心，都不夠強烈。"},{"id":"111-english-35","y":"111","n":35,"img":"111_english_q35","pk":"111_english","ans":"D","pimg":"111_english_p33","grp":"111-english-33～36","exp":"Ambazonia 是英語使用者宣布成立的新國家，但政府派警察阻止會議，顯示政府不承認它是一個國家。(C) 是 Ambazonia 自己想脫離，並非政府的想法；(A)、(B) 文中沒有提到。"},{"id":"111-english-36","y":"111","n":36,"img":"111_english_q36","pk":"111_english","ans":"B","pimg":"111_english_p33","grp":"111-english-33～36","exp":"作者介紹歷史，是要說明為什麼雖然英語在現代是取得權力的方式，Cameroon 的英語使用者卻因為政府長期掌握在說法語的人手中，而擁有較少權力。(A) 文章開頭說這在 Cameroon 並不成立；(C)、(D) 只是歷史中的細節。"},{"id":"111-english-37","y":"111","n":37,"img":"111_english_q37","pk":"111_english","ans":"C","pimg":"111_english_p37","grp":"111-english-37～39"},{"id":"111-english-38","y":"111","n":38,"img":"111_english_q38","pk":"111_english","ans":"B","pimg":"111_english_p37","grp":"111-english-37～39"},{"id":"111-english-39","y":"111","n":39,"img":"111_english_q39","pk":"111_english","ans":"A","pimg":"111_english_p37","grp":"111-english-37～39"},{"id":"111-english-40","y":"111","n":40,"img":"111_english_q40","pk":"111_english","ans":"D","pimg":"111_english_p40","grp":"111-english-40～43"},{"id":"111-english-41","y":"111","n":41,"img":"111_english_q41","pk":"111_english","ans":"C","pimg":"111_english_p40","grp":"111-english-40～43","exp":"mistake 的字母是 m, i, s, t, a, k, e，重新排列後可得到 it makes。(A) take sit 沒有 m 且多一個 t；(B) Ms Easy 多了 y；(D) me steak 多一個 e 且少了 i。字母必須全部用到、不多不少。"},{"id":"111-english-42","y":"111","n":42,"img":"111_english_q42","pk":"111_english","ans":"A","pimg":"111_english_p40","grp":"111-english-40～43","exp":"restaurant 變成 Eat rats, run! 這種句子很奇怪，所以變位字有時會變成「奇怪的」意思。(B) 困難、(C) 好吃、(D) 重要，都與上下文不合。"},{"id":"111-english-43","y":"111","n":43,"img":"111_english_q43","pk":"111_english","ans":"A","pimg":"111_english_p40","grp":"111-english-40～43","exp":"後文說迴文可用來學數學與作曲，變位字還能用來隱藏重要的研究，表示它們不只是遊戲。(A) more than just games 最符合；(B)、(C)、(D) 文中都沒有提到。"},{"id":"112-english-1","y":"112","n":1,"img":"112_english_q01","pk":"112_english","ans":"B"},{"id":"112-english-2","y":"112","n":2,"img":"112_english_q02","pk":"112_english","ans":"D"},{"id":"112-english-3","y":"112","n":3,"img":"112_english_q03","pk":"112_english","ans":"D"},{"id":"112-english-4","y":"112","n":4,"img":"112_english_q04","pk":"112_english","ans":"B","exp":"感官動詞 watch 的句型是 watch + 受詞 + 原形動詞或 V-ing（看到對方正在做某事）。選項中只有 dancing 符合。(A) 過去式、(C) 現在完成式、(D) to dance 都不能放在受詞後面。"},{"id":"112-english-5","y":"112","n":5,"img":"112_english_q05","pk":"112_english","ans":"A"},{"id":"112-english-6","y":"112","n":6,"img":"112_english_q06","pk":"112_english","ans":"B","exp":"Rex 沒感覺到地震，是因為地震發生「當時」他正在公園慢跑，描述過去某個時間點正在進行的動作，要用過去進行式 was jogging。(A) 只說慢跑過，沒有「正在」的意思；(C) 現在完成式與 this morning 的過去時間不合。"},{"id":"112-english-7","y":"112","n":7,"img":"112_english_q07","pk":"112_english","ans":"A","exp":"think about 的 about 是介系詞，後面要接動名詞（V-ing）。語意上，在同一家店做了十年，從沒想過「換」工作，所以選 changing。(B) finding、(D) starting 語意不通。"},{"id":"112-english-8","y":"112","n":8,"img":"112_english_q08","pk":"112_english","ans":"C"},{"id":"112-english-9","y":"112","n":9,"img":"112_english_q09","pk":"112_english","ans":"C","exp":"前句是命令（Don't go away），後句說食物可能燒焦，是「否則」的意思，要用 or。(A) but 表轉折；(B) if 後面要接條件；(D) so 表結果，都不合。"},{"id":"112-english-10","y":"112","n":10,"img":"112_english_q10","pk":"112_english","ans":"D","exp":"空格後是完整子句 he was kicked off the soccer team，而且後面說「沒人給他好理由」，所以他想知道的是「為什麼」被踢出球隊。(C) whether 是「是否」，不能搭配後面的 good reason。"},{"id":"112-english-11","y":"112","n":11,"img":"112_english_q11","pk":"112_english","ans":"D","exp":"Jenny 四十歲沒工作又常惹麻煩，對父母來說是 a headache（令人頭痛的人）。這是常見的比喻用法，不是真的頭痛。(A) daughter 事實上沒錯但語意不夠；(B) example 是「榜樣」，(C) gift 是「禮物」，都與麻煩相反。"},{"id":"112-english-12","y":"112","n":12,"img":"112_english_q12","pk":"112_english","ans":"C","exp":"後面說「所以他們得在星期五前寫完功課」，表示露營是這個週末「即將」要做的事，用 are going to 的進行式表示未來。(A)、(B) 是過去式；(D) 現在完成式表示已經去了，語意不合。"},{"id":"112-english-13","y":"112","n":13,"img":"112_english_q13","pk":"112_english","ans":"C","exp":"Doraemon 的耳朵是「被」老鼠咬掉的，主詞 ears 是複數且是被動，所以用 were bitten。since 後面接過去式或過去被動表示「自從那件事發生」。(D) have bitten 是主動語態，且助動詞不合。"},{"id":"112-english-14","y":"112","n":14,"img":"112_english_q14","pk":"112_english","ans":"C","exp":"if 條件句中，主要子句要用 will 表示未來。there be 句型的 be 動詞要用 be 原形，所以是 there will be，主詞是後面的 more fun（不可數名詞）。(A) are 時態不對；(B)、(D) 的 have 不能用在 there 後面。"},{"id":"112-english-15","y":"112","n":15,"img":"112_english_q15","pk":"112_english","ans":"D"},{"id":"112-english-16","y":"112","n":16,"img":"112_english_q16","pk":"112_english","ans":"C","exp":"前面說晴天要看清楚都「不容易」，後面 even less（更不…）是延伸同一個方向，所以要接 possible：陰天更不可能看到。選 difficult 會變成「更不困難」，語意相反。"},{"id":"112-english-17","y":"112","n":17,"img":"112_english_q17","pk":"112_english","ans":"C"},{"id":"112-english-18","y":"112","n":18,"img":"112_english_q18","pk":"112_english","ans":"B","exp":"Jane 的店生意已經不好，對面又開新超市，只會讓情況「更糟」。makes things worse 表示讓事情變得更糟。(A) easier、(D) more convenient 是正面的意思；(C) more boring 與生意無關。"},{"id":"112-english-19","y":"112","n":19,"img":"112_english_q19","pk":"112_english","ans":"D","exp":"空格前是 was，後面直接接 pulled him out，所以空格要補「先行詞 + 關係代名詞」：the one who（就是那個把他拉出著火車子的人）。(A) who 前面沒有先行詞；(B) the one 後面缺連接，pulled 沒有主詞；(C) the one she 會讓 pulled 多出一個主詞，句子不通。"},{"id":"112-english-20","y":"112","n":20,"img":"112_english_q20","pk":"112_english","ans":"C"},{"id":"112-english-21","y":"112","n":21,"img":"112_english_q21","pk":"112_english","ans":"A"},{"id":"112-english-22","y":"112","n":22,"img":"112_english_q22","pk":"112_english","ans":"B","exp":"句中 that just came out on the market 是修飾 medicine 的子句，整句主詞是 The new medicine，還缺一個動詞。新藥剛上市、已經救了數千條人命，用現在完成式 has saved。(A) and saved 時態與前面不一致；(C)、(D) 不是完整動詞。"},{"id":"112-english-23","y":"112","n":23,"img":"112_english_q23","pk":"112_english","ans":"D","exp":"前面說現在「常常想起」和 Pip 的日子，表示 Pip 已經不在，牠過去常常來坐在我旁邊，要用 used to + 原形。(A)、(B) 表示現在或未來的習慣；(C) 現在完成式也不合。"},{"id":"112-english-24","y":"112","n":24,"img":"112_english_q24","pk":"112_english","ans":"B","pimg":"112_english_p24","grp":"112-english-24～25","exp":"兩個 Garden Sandwich 是 $160，Autumn Wind $60，Winter Snow $70，總共 $290。集滿 15 星可免費換一杯 $60 的飲料，要折掉 $60（不能折 $70 的 Winter Snow），所以付 $230。"},{"id":"112-english-25","y":"112","n":25,"img":"112_english_q25","pk":"112_english","ans":"B","pimg":"112_english_p24","grp":"112-english-24～25","exp":"營業時間是 2:00 到 8:00 pm，星期一和每月第二個星期天公休。(A) 8:30 pm 已打烊；(C) 8 月 13 日是第二個星期日，而且還要去家族旅行；(D) 8 月 28 日是星期一。8 月 11 日是星期五，5:00 pm 在營業時間內，行事曆上也沒有安排活動。"},{"id":"112-english-26","y":"112","n":26,"img":"112_english_q26","pk":"112_english","ans":"A","pimg":"112_english_p26","grp":"112-english-26～27","exp":"筆記中說受傷的小鳥要保暖，而且「不要餵食」（don't give it any food），所以先餵食再送醫院是錯誤做法。(B)、(C)、(D) 都與筆記內容一致。"},{"id":"112-english-27","y":"112","n":27,"img":"112_english_q27","pk":"112_english","ans":"A","pimg":"112_english_p26","grp":"112-english-26～27"},{"id":"112-english-28","y":"112","n":28,"img":"112_english_q28","pk":"112_english","ans":"C","pimg":"112_english_p28","grp":"112-english-28～29"},{"id":"112-english-29","y":"112","n":29,"img":"112_english_q29","pk":"112_english","ans":"D","pimg":"112_english_p28","grp":"112-english-28～29","exp":"看圖表，南亞和東南亞在 Stage 4 是 4.6%，高於另外兩區的 2.4% 與 2.2%。(A) 南亞和東南亞最高的是 Stage 2；(B) 歐洲 Stage 3 是 3.9%，比另外兩區都高；(C) 北美洲和大洋洲 Stage 1 是 10.5%，低於歐洲的 11.3%。"},{"id":"112-english-30","y":"112","n":30,"img":"112_english_q30","pk":"112_english","ans":"B","pimg":"112_english_p30","grp":"112-english-30～32"},{"id":"112-english-31","y":"112","n":31,"img":"112_english_q31","pk":"112_english","ans":"A","pimg":"112_english_p30","grp":"112-english-30～32"},{"id":"112-english-32","y":"112","n":32,"img":"112_english_q32","pk":"112_english","ans":"A","pimg":"112_english_p30","grp":"112-english-30～32","exp":"文章最後說，如果蚊子被雨滴打到時飛得太低，就沒時間飛離雨滴，會撞到地面而死。(D) 往下掉大約 6 公分後蚊子就會飛走，是安全的做法，並不危險；(C) 文章說每 20 秒被打到一次，並沒有因為次數多而死亡。"},{"id":"112-english-33","y":"112","n":33,"img":"112_english_q33","pk":"112_english","ans":"D","pimg":"112_english_p33","grp":"112-english-33～35"},{"id":"112-english-34","y":"112","n":34,"img":"112_english_q34","pk":"112_english","ans":"C","pimg":"112_english_p33","grp":"112-english-33～35","exp":"文章說手稿在 1867 年才被發現，是貝多芬過世四十年後，所以手稿是在他死後被找到的。(A) 文章沒說最早出現在歌劇中；(B) 真正的 Elise 是誰沒人知道；(D) 手稿由 Malfatti 留給家人，沒有說在維也納市政府手上。"},{"id":"112-english-35","y":"112","n":35,"img":"112_english_q35","pk":"112_english","ans":"B","pimg":"112_english_p33","grp":"112-english-33～35","exp":"第一個故事說 Röckel 曾在貝多芬的歌劇中演唱，兩人成為很好的朋友，所以她是貝多芬的好友。(A) 只有 Röckel 被貝多芬叫 Elise；(C) 把 Elise 寫錯的是後來抄手稿的人；(D) Barensfeld 是跟 Malfatti 學鋼琴，不是貝多芬的學生。"},{"id":"112-english-36","y":"112","n":36,"img":"112_english_q36","pk":"112_english","ans":"D","pimg":"112_english_p36","grp":"112-english-36～38"},{"id":"112-english-37","y":"112","n":37,"img":"112_english_q37","pk":"112_english","ans":"D","pimg":"112_english_p36","grp":"112-english-36～38","exp":"第三段說玩不同的玩具能讓孩子發現自己的興趣和擅長的事，如果只玩一種，就可能失去這個機會，所以是會錯過發現自己真正喜歡什麼的機會。(C) 文章說不同的玩具會教孩子不同的東西，不是不能學習。"},{"id":"112-english-38","y":"112","n":38,"img":"112_english_q38","pk":"112_english","ans":"B","pimg":"112_english_p36","grp":"112-english-36～38","exp":"第三段先說「不同的玩具教孩子不同的事」，再用「洋娃娃幫助語言能力、積木有助於數學和科學」當作例子。(A) 是主要想法；(C)、(D) 是在說明後果與擔心，不是舉例。"},{"id":"112-english-39","y":"112","n":39,"img":"112_english_q39","pk":"112_english","ans":"B","pimg":"112_english_p39","grp":"112-english-39～41"},{"id":"112-english-40","y":"112","n":40,"img":"112_english_q40","pk":"112_english","ans":"C","pimg":"112_english_p39","grp":"112-english-39～41"},{"id":"112-english-41","y":"112","n":41,"img":"112_english_q41","pk":"112_english","ans":"B","pimg":"112_english_p39","grp":"112-english-39～41","exp":"文章說她在 Sri Lanka 失去左眼，但這從沒阻止她，仍去危險的地方，所以經驗並沒有改變她的報導方式。(A) 沒有提到她因為念書離開工作；(C) 她是在所住的房子被攻擊時喪生；(D) 她在 Yale 念書時就決定要當記者。"},{"id":"112-english-42","y":"112","n":42,"img":"112_english_q42","pk":"112_english","ans":"A","pimg":"112_english_p42","grp":"112-english-42～43"},{"id":"112-english-43","y":"112","n":43,"img":"112_english_q43","pk":"112_english","ans":"A","pimg":"112_english_p42","grp":"112-english-42～43","exp":"前面提到她的祖父說 plimsolls，而女兒說 kicks 或 vans，而她自己說 sneakers，是不同年代的人用不同的說法，所以用詞也顯示出一個人「多大年紀」。(C) 如果是成長地點，這家人都住在紐約，不會有差別。"},{"id":"113-english-1","y":"113","n":1,"img":"113_english_q01","pk":"113_english","ans":"A"},{"id":"113-english-2","y":"113","n":2,"img":"113_english_q02","pk":"113_english","ans":"C"},{"id":"113-english-3","y":"113","n":3,"img":"113_english_q03","pk":"113_english","ans":"B"},{"id":"113-english-4","y":"113","n":4,"img":"113_english_q04","pk":"113_english","ans":"B"},{"id":"113-english-5","y":"113","n":5,"img":"113_english_q05","pk":"113_english","ans":"D"},{"id":"113-english-6","y":"113","n":6,"img":"113_english_q06","pk":"113_english","ans":"D"},{"id":"113-english-7","y":"113","n":7,"img":"113_english_q07","pk":"113_english","ans":"B","exp":"表示「某人也一樣」的肯定倒裝句型是 so + 助動詞 + 主詞。前句的動詞是一般動詞 likes，所以助動詞用 does；但主詞是 I，要配 do：so do I。(A) am 要搭配 be 動詞的句子。"},{"id":"113-english-8","y":"113","n":8,"img":"113_english_q08","pk":"113_english","ans":"D","exp":"前句說冰箱「現在不該」有噪音，後句 but if it still does（如果它「仍然」會），表示現在還繼續發出噪音。already 表示「已經」，finally 表示「終於」，語意都不通。"},{"id":"113-english-9","y":"113","n":9,"img":"113_english_q09","pk":"113_english","ans":"C"},{"id":"113-english-10","y":"113","n":10,"img":"113_english_q10","pk":"113_english","ans":"D"},{"id":"113-english-11","y":"113","n":11,"img":"113_english_q11","pk":"113_english","ans":"C","exp":"until 引導的時間副詞子句中，要用現在式代替未來式，所以 until he finds an apartment。(A)、(B) 在時間子句中不可用 will / would；(D) 過去式時態不合。"},{"id":"113-english-12","y":"113","n":12,"img":"113_english_q12","pk":"113_english","ans":"A","exp":"空格前是 Students，後面是 to go，中間要補一個關係代名詞，修飾 students（想去的學生）：Students who want to go。(C)、(D) 會讓句子缺少動詞或意思不通；(B) 沒有連接詞，句型錯誤。"},{"id":"113-english-13","y":"113","n":13,"img":"113_english_q13","pk":"113_english","ans":"A"},{"id":"113-english-14","y":"113","n":14,"img":"113_english_q14","pk":"113_english","ans":"A","exp":"前半說她花了好幾天計畫邀請 Charlie，後半卻說見面時一句話也說不出來，前後語意相反，要用表示轉折的 but。so 是因果，if 是假設，or 是選擇。"},{"id":"113-english-15","y":"113","n":15,"img":"113_english_q15","pk":"113_english","ans":"C","exp":"因為她「打算這個星期六才會去看」，所以到現在還沒看過，要用現在完成式否定 haven't seen。(B) 現在式表示習慣；(A) 表示正在看；(D) won't see 表示「將不會看」，與 I'll probably watch it 矛盾。"},{"id":"113-english-16","y":"113","n":16,"img":"113_english_q16","pk":"113_english","ans":"D"},{"id":"113-english-17","y":"113","n":17,"img":"113_english_q17","pk":"113_english","ans":"C","exp":"她原本想去鄉下避暑，但一到那裡「開始想念」城市的噪音，才有轉折意味，所以 miss 是「想念」。enjoy 和 mind 的意思不合，notice 則是「注意到」，沒有思念的含意。"},{"id":"113-english-18","y":"113","n":18,"img":"113_english_q18","pk":"113_english","ans":"D","exp":"老闆知道你走路五分鐘就到公司，所以用「塞車」當遲到的藉口是「最糟的」（worst）藉口，因為一眼就被識破。其他選項都無法表達這個諷刺的意思。"},{"id":"113-english-19","y":"113","n":19,"img":"113_english_q19","pk":"113_english","ans":"A","exp":"主詞是 The housework（不可數名詞，視為單數），而且意思是「家事被分擔」，所以用被動語態 is shared。(B) are 與單數主詞不合；(C)、(D) 是主動語態，意思變成家事去分擔別人，不通。"},{"id":"113-english-20","y":"113","n":20,"img":"113_english_q20","pk":"113_english","ans":"C","exp":"空格要補的是「我的牙醫」，也就是 my dentist。mine 是所有格代名詞，等於 my dentist，避免重複。(A) I 和 (D) myself 都指「我」自己，不是牙醫；(B) me 不能當主詞。"},{"id":"113-english-21","y":"113","n":21,"img":"113_english_q21","pk":"113_english","ans":"B","exp":"媽媽問「報告寫完了嗎？」，琳達說「我今天下午已經做了大部分」，是過去已經發生的事，用過去式 did（代替前面的 finished）。(A) 是過去未來式；(D) 是未來式；(C) 是過去進行式，與後半句 I'll finish it by Friday 的語氣不符。"},{"id":"113-english-22","y":"113","n":22,"img":"113_english_q22","pk":"113_english","ans":"D","pimg":"113_english_p22","grp":"113-english-22～23"},{"id":"113-english-23","y":"113","n":23,"img":"113_english_q23","pk":"113_english","ans":"C","pimg":"113_english_p22","grp":"113-english-22～23"},{"id":"113-english-24","y":"113","n":24,"img":"113_english_q24","pk":"113_english","ans":"C","pimg":"113_english_p24","grp":"113-english-24～25","exp":"四種麵包出爐時間：白吐司 10:30am、農家麵包 4:30pm、貝果 11:30am、猶太辮子麵包 3:30pm。要同時買齊，必須等到最晚出爐的農家麵包 4:30pm 之後，選項中最早的時間是 5:00pm。4:00pm 時農家麵包還沒出爐。"},{"id":"113-english-25","y":"113","n":25,"img":"113_english_q25","pk":"113_english","ans":"B","pimg":"113_english_p24","grp":"113-english-24～25","exp":"營業時間平日到 9pm，麵包 8pm 後半價，剛好在打烊前一小時；週末 8pm 打烊、7pm 後半價，也是一小時。(A) 每天都營業，是七天；(C) 可頌和椒鹽卷餅只在週五賣；(D) 會員是省 10%，不是省 100 元。"},{"id":"113-english-26","y":"113","n":26,"img":"113_english_q26","pk":"113_english","ans":"A","pimg":"113_english_p26","grp":"113-english-26～27"},{"id":"113-english-27","y":"113","n":27,"img":"113_english_q27","pk":"113_english","ans":"D","pimg":"113_english_p26","grp":"113-english-26～27","exp":"從地圖可看到，市集所在的 Garden Square 旁邊有捷運站，位置在 Koala Street 一帶，所以最近的捷運站是 Koala Street Station。(A) 花市在公園另一側，中間隔著 Fox Street；(B) 市集和慶典不在同一個街區；(C) 157 號公車的站牌在 Koala Street 旁，不在 Puppy Street。"},{"id":"113-english-28","y":"113","n":28,"img":"113_english_q28","pk":"113_english","ans":"B","pimg":"113_english_p28","grp":"113-english-28～29","exp":"兩位朋友都是用幽默的方式暗示主人太小氣：一個只端上一條小魚，一個說沒有東西吃，所以朋友認為他們不願意與人分享。原文並沒有提到他們喜歡美食、交朋友或不喜歡新事物。"},{"id":"113-english-29","y":"113","n":29,"img":"113_english_q29","pk":"113_english","ans":"B","pimg":"113_english_p28","grp":"113-english-28～29"},{"id":"113-english-30","y":"113","n":30,"img":"113_english_q30","pk":"113_english","ans":"A","pimg":"113_english_p30","grp":"113-english-30～32","exp":"作者把書的修復師比喻成醫生，把大圖書館比喻成醫院，把陳先生的書店比喻成保健所，目的是說明陳先生提供什麼服務：幫人修理小毛病的書。文中並沒有談到他的未來計畫或對書的熱愛。"},{"id":"113-english-31","y":"113","n":31,"img":"113_english_q31","pk":"113_english","ans":"D","pimg":"113_english_p30","grp":"113-english-30～32","exp":"例子中的科學書是老師送的禮物，書修好後，主人彷彿回到和老師相處的時光，所以陳先生的工作能幫助人們想起過去的特別時刻。(C) 的夢想是書的來歷，而不是修書帶來的幫助；(A)、(B) 文中沒有提到。"},{"id":"113-english-32","y":"113","n":32,"img":"113_english_q32","pk":"113_english","ans":"A","pimg":"113_english_p30","grp":"113-english-30～32"},{"id":"113-english-33","y":"113","n":33,"img":"113_english_q33","pk":"113_english","ans":"A","pimg":"113_english_p33","grp":"113-english-33～35"},{"id":"113-english-34","y":"113","n":34,"img":"113_english_q34","pk":"113_english","ans":"B","pimg":"113_english_p33","grp":"113-english-33～35"},{"id":"113-english-35","y":"113","n":35,"img":"113_english_q35","pk":"113_english","ans":"A","pimg":"113_english_p33","grp":"113-english-33～35","exp":"beg to differ 的意思是客氣地表示「不同意」。這裡前一句說有些人認為難民是問題，後一句說兩位創辦人認為難民不必是問題，兩邊看法不同，所以選「他們不同意」。"},{"id":"113-english-36","y":"113","n":36,"img":"113_english_q36","pk":"113_english","ans":"B","pimg":"113_english_p36","grp":"113-english-36～39"},{"id":"113-english-37","y":"113","n":37,"img":"113_english_q37","pk":"113_english","ans":"B","pimg":"113_english_p36","grp":"113-english-36～39"},{"id":"113-english-38","y":"113","n":38,"img":"113_english_q38","pk":"113_english","ans":"C","pimg":"113_english_p36","grp":"113-english-36～39","exp":"作者先說她不同意史密斯，再舉王博士說的「把好錢丟進爛洞裡」，是用專家的話來支持她自己的看法：復育絕種動物花費大，卻沒有成果，使她的想法更清楚。"},{"id":"113-english-39","y":"113","n":39,"img":"113_english_q39","pk":"113_english","ans":"C","pimg":"113_english_p36","grp":"113-english-36～39","exp":"從作者的語氣可知她對復育絕種動物持懷疑態度：她說沒人知道牠們是否真的能回來，又說花了十年和幾百萬美元只得到幾顆死掉的蛙卵，所以她認為這件事做不到。文中沒有討論危險性。"},{"id":"113-english-40","y":"113","n":40,"img":"113_english_q40","pk":"113_english","ans":"A","pimg":"113_english_p40","grp":"113-english-40～43"},{"id":"113-english-41","y":"113","n":41,"img":"113_english_q41","pk":"113_english","ans":"B","pimg":"113_english_p40","grp":"113-english-40～43","exp":"看圖，灰色區域是實施社交距離的時間。New York 從第 2 週左右就開始，其他三個城市大約第 4 或第 5 週才開始，所以紐約開始得最早。"},{"id":"113-english-42","y":"113","n":42,"img":"113_english_q42","pk":"113_english","ans":"B","pimg":"113_english_p40","grp":"113-english-40～43","exp":"前文說 Portland 和 Denver 一開始做得不錯，但圖上灰色區域在中途中斷，之後死亡人數又上升，表示兩座城市太早停止社交距離。(C) 雖然有第二次實施，但那是死亡人數回升之後才發生，不是造成回升的原因。"},{"id":"113-english-43","y":"113","n":43,"img":"113_english_q43","pk":"113_english","ans":"D","pimg":"113_english_p40","grp":"113-english-40～43"},{"id":"114-english-1","y":"114","n":1,"img":"114_english_q01","pk":"114_english","ans":"D","exp":"看圖：飛在房子上方的有鳥、風箏和飛機，但真正「在房子上方」的是右上角的飛機（plane）。鳥停在屋頂、風箏和蝴蝶都在比房子低的地方。","goal":"用圖表表徵文意（單題）","pr":81},{"id":"114-english-2","y":"114","n":2,"img":"114_english_q02","pk":"114_english","ans":"D","exp":"後句說「現在」比較容易和人說話了，表示以前很「害羞」（shy），不敢跟人說話。","goal":"指出適合句中的單字或片語（單題）","pr":73},{"id":"114-english-3","y":"114","n":3,"img":"114_english_q03","pk":"114_english","ans":"C","exp":"她怕水，所以不想去「航行、坐船」（sailing）。dancing、hiking、shopping 都和水無關。","goal":"指出適合句中的單字或片語（單題）","pr":73},{"id":"114-english-4","y":"114","n":4,"img":"114_english_q04","pk":"114_english","ans":"B","exp":"enjoy 後面接動名詞（V-ing）：enjoy listening to。","goal":"指出句中正確的文法（單題）","pr":61},{"id":"114-english-5","y":"114","n":5,"img":"114_english_q05","pk":"114_english","ans":"D","exp":"爸爸在廚房忙著煮飯，晚餐再十分鐘就「準備好」了：Dinner will be ready。","goal":"指出適合句中的單字或片語（單題）","pr":73},{"id":"114-english-6","y":"114","n":6,"img":"114_english_q06","pk":"114_english","ans":"A","exp":"辦公室有很多新「面孔」（new faces，指新同事），所以需要時間記住誰是誰。","goal":"指出適合句中的單字或片語（單題）","pr":76},{"id":"114-english-7","y":"114","n":7,"img":"114_english_q07","pk":"114_english","ans":"A","exp":"找了好幾小時的鑰匙，結果一直在自己口袋裡，覺得自己像個「傻瓜」（fool）。","goal":"指出適合句中的單字或片語（單題）","pr":60},{"id":"114-english-8","y":"114","n":8,"img":"114_english_q08","pk":"114_english","ans":"B","exp":"三個女兒中，兩個讀高中，「剩下的那一個」讀小學。在確定的一群裡剩下的最後一個用 the other。","goal":"指出句中正確的文法（單題）","pr":72},{"id":"114-english-9","y":"114","n":9,"img":"114_english_q09","pk":"114_english","ans":"D","exp":"海邊風很強，樹很難「生長」（grow）。","goal":"指出適合句中的單字或片語（單題）","pr":66},{"id":"114-english-10","y":"114","n":10,"img":"114_english_q10","pk":"114_english","ans":"C","exp":"聖誕節「快到了」，用現在進行式表示即將發生：Christmas is coming。後面也說還有沒有計畫，是未來的事。","goal":"指出句中正確的文法（單題）","pr":68},{"id":"114-english-11","y":"114","n":11,"img":"114_english_q11","pk":"114_english","ans":"A","exp":"so 後面是祈使句，以原形動詞開頭：make sure that…（務必確定……）。","goal":"指出句中正確的文法（單題）","pr":61},{"id":"114-english-12","y":"114 h","ans":"C","pimg":"english_p35","grp":"115-english-35～39","exp":"Adams 認為冰島人可能很快放棄冰島語，是擔心的；Eggertsson 說 does the future really look that bad?，認為冰島語人數足夠、還有學校教，並不擔心。","goal":"指出作者的目的或態度","pr":56},{"id":"115-english-39","y":"115","n":39,"img":"english_q39","pk":"115_english","ans":"B","pimg":"english_p35","grp":"115-english-35～39","exp":"Adams 說冰島語使用者只有 314,000 人，人數少，所以公司不願改語言；Eggertsson 說至少要 35,000 人才安全，314,000 人已足夠。兩人都談到說冰島語的人數是否夠多。","goal":"推論文中隱含的訊息","pr":48},{"id":"115-english-40","y":"115","n":40,"img":"english_q40","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"國王沒有孩子，擔心死後國家落入壞人手中，所以「決定選一個孩子接位」。他發種子給孩子們，所以是要「選出下一任國王」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":68},{"id":"115-english-41","y":"115","n":41,"img":"english_q41","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"後文說 Wong still didn't find anything in his（他的盆裡還是什麼都沒有），所以是「好幾個月過去了，什麼都沒長出來」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":58},{"id":"115-english-42","y":"115","n":42,"img":"english_q42","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"Sung 是第一個告訴大家他的種子長出小植物的人，接著大家才一個個說自己的也長了，所以他是「第一個分享好消息的人」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":49},{"id":"115-english-43","y":"115","n":43,"img":"english_q43","pk":"115_english","ans":"C","pimg":"english_p40","grp":"115-english-40～43","exp":"國王事先把種子煮過，根本不可能發芽。只有 Wong 誠實地帶著空盆子來，所以只有他「誠實」到足以當國王。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":61},{"id":"ak-english-1","y":"ak","n":1,"html":"My brother is really into ______. He plays the guitar, the piano, and the drums.","opts":["drawing","sports","music","cooking"],"ans":"C","exp":"他會彈吉他、鋼琴和打鼓，所以他熱衷的是「音樂」（music）。be into 是「熱衷於」。","topic":"字彙"},{"id":"ak-english-2","y":"ak","n":2,"html":"It's raining cats and dogs outside. Don't forget to take your ______ with you.","opts":["fan","gloves","umbrella","sunglasses"],"ans":"C","exp":"raining cats and dogs 是「下傾盆大雨」，所以要帶傘（umbrella）。","topic":"字彙"},{"id":"ak-english-3","y":"ak","n":3,"html":"Amy loves Japanese food. She has ______ to Japan three times.","opts":["be","been","go","went"],"ans":"B","exp":"現在完成式 has/have + 過去分詞。have been to 表示「去過某地（已經回來）」，所以用 been。","topic":"現在完成式"},{"id":"ak-english-4","y":"ak","n":4,"html":"This chocolate cake looks great! It ______ by my mom last night.","opts":["was made","has made","made","is made"],"ans":"A","exp":"蛋糕是「被做」的，用被動語態 be + 過去分詞；last night 是過去時間，所以用 was made。","topic":"被動語態"},{"id":"ak-english-5","y":"ak","n":5,"html":"Excuse me. Could you tell me ______ the next train will arrive?","opts":["which","when","what","who"],"ans":"B","exp":"問的是火車「什麼時候」到，間接問句用 when + 主詞 + 動詞：when the next train will arrive。","topic":"間接問句"},{"id":"ak-english-6","y":"ak","n":6,"html":"Kevin is the ______ runner in our class. Nobody runs faster than he does.","opts":["fast","fastest","faster","most fast"],"ans":"B","exp":"沒有人跑得比他快，表示他是全班「最快」的。the + 最高級：the fastest。fast 是單音節，不用 most。","topic":"最高級"},{"id":"ak-english-7","y":"ak","n":7,"html":"If it ______ tomorrow, we will stay at home and watch movies.","opts":["rained","will rain","rains","raining"],"ans":"C","exp":"表示未來可能情況的 if 子句，用現在式代替未來式：If it rains tomorrow, we will…","topic":"條件句"},{"id":"ak-english-8","y":"ak","n":8,"html":"Tom: Would you like some more tea?<br>Lisa: ______ I've had enough.","opts":["No, thanks.","Here you are.","Yes, please.","Of course."],"ans":"A","exp":"Lisa 說「我已經喝夠了」，所以要婉拒：No, thanks.","topic":"對話"},{"id":"ak-english-9","y":"ak","n":9,"html":"The movie was so ______ that I fell asleep halfway through it.","opts":["boring","scary","exciting","interesting"],"ans":"A","exp":"看到一半睡著了，表示電影很「無聊」（boring）。so…that… 表示「如此……以致於……」。","topic":"字彙"},{"id":"ak-english-10","y":"ak","n":10,"html":"Neither Ben nor his sisters ______ at home right now. They are all at school.","opts":["is","was","are","be"],"ans":"C","exp":"neither A nor B 的動詞和較靠近的 B 一致；his sisters 是複數，加上 right now 用現在式，所以用 are。","topic":"主詞動詞一致"},{"id":"ak-english-11","y":"ak","n":11,"html":"Why did Owen buy new running shoes?","opts":["He joined a running team.","His old ones were too small.","His grandma asked him to.","They were on sale."],"ans":"B","exp":"信中說 because my old ones were too small，舊鞋太小了。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-12","y":"ak","n":12,"html":"What do we know about the bike?","opts":["He will ride it to the science fair.","Owen has already bought it.","Grandma gave it to him as a gift.","His mom will pay for half of it if he saves enough."],"ans":"D","exp":"Mom says if I save half of the price by December, she'll pay the other half：如果他在12月前存到一半，媽媽會付另一半。他還在存錢，還沒買。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-13","y":"ak","n":13,"html":"What is the main purpose of Owen's letter?","opts":["To invite Grandma to the science fair.","To ask Grandma for more money.","To explain how to build a robot.","To thank Grandma and share his news."],"ans":"D","exp":"信一開始感謝奶奶的卡片和錢，接著分享買鞋、存錢、科展的近況，最後邀請奶奶來過聖誕節。主要目的是道謝和分享近況。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-14","y":"ak","n":14,"html":"Jenny, a junior high student, goes to the pool alone. She brings her student ID but forgets her swimming cap. How much does she need to pay?","opts":["$60","$100","$110","$150"],"ans":"C","exp":"學生票（有學生證）$60，加上一定要戴泳帽，要在櫃臺買一頂 $50，共 $110。","topic":"閱讀：告示","grp":"ak-english-14～15","passage":"<p><b>City Swimming Pool — Summer Hours<\/b><\/p><p>Monday–Friday: 6:00 a.m.–9:00 p.m.<br>Saturday–Sunday: 8:00 a.m.–6:00 p.m.<\/p><p>Tickets: Adults $100 / Students (with ID) $60 / Children under 6: free<\/p><p>* Swimming caps are required. Caps can be bought at the front desk ($50).<br>* The pool is closed for cleaning on the first Monday of every month.<\/p>"},{"id":"ak-english-15","y":"ak","n":15,"html":"Which is true about the City Swimming Pool?","opts":["Children under 6 need to pay $60.","You can swim there at 7:00 a.m. on Sunday.","It is open until 9:00 p.m. on Saturday.","It is closed on the first Monday of every month."],"ans":"D","exp":"告示寫 closed for cleaning on the first Monday of every month。(B)(C)週末是 8:00 a.m.～6:00 p.m.；(A)6歲以下免費。","topic":"閱讀：告示","grp":"ak-english-14～15","passage":"<p><b>City Swimming Pool — Summer Hours<\/b><\/p><p>Monday–Friday: 6:00 a.m.–9:00 p.m.<br>Satu ∠AOB＝50°；△OCD 中 ∠OCD＝∠ODC＝60°，故 ∠COD＝60°。∠AOD 對應弧 ABD＝150°，所以 ∠BOC＝150°－50°－60°＝40°，弧 BC 就是 40°。"},{"id":"105-math-15","y":"105","n":15,"img":"105_math_q15","pk":"105_math","ans":"D","exp":"丙是腰長 2 的等腰直角三角形，面積 2。甲、乙是寬為 w 的長方形（長 2），丁的直角剛好夾在甲、乙頂端之間，所以丁的股長也是 w，面積 w²/2。由 2×2w＝2＋w²/2 得 w²－8w＋4＝0，w＝4±2√3；丁的面積比丙小，要 w＜2，所以 w＝4－2√3。"},{"id":"105-math-16","y":"105","n":16,"img":"105_math_q16","pk":"105_math","ans":"D","exp":"因為 AP：PD＝AQ：QE＝4：1，所以 PQ 平行 DE（也就是平行 CD），平行線上各點到 CD 的距離相等，所以 q＝r。又 R 在 AC 上，同理 AR：RC＝4：1，所以 QE＝AE/5、RC＝AC/5；因為 AE＜AC，所以 QE＜RC。"},{"id":"105-math-17","y":"105","n":17,"img":"105_math_q17","pk":"105_math","ans":"B","exp":"a 同時是 12 和 18 的倍數，所以是 36 的倍數；在 50 到 100 之間只有 72，而 72＝8×9，所以 8 是 a 的因數。若 8 也是 b 的因數，則 a、b 的最大公因數會是 24 的倍數，不是 12，所以 8 不是 b 的因數。(C)(D) 都說 8 不是 a 的因數，已經錯了。"},{"id":"105-math-18","y":"105","n":18,"img":"105_math_q18","pk":"105_math","ans":"D"},{"id":"105-math-19","y":"105","n":19,"img":"105_math_q19","pk":"105_math","ans":"C","exp":"兩年是 24 個月。乙方案月租 600，x 在 400 到 600 之間時每月都只收 600，總花費 13000＋24×600＝27400。甲方案月租 400，x≥400 所以每月收 x，總花費 15000＋24x。要 27400＜15000＋24x，得 x＞516.67，最小整數是 517。"},{"id":"105-math-20","y":"105","n":20,"img":"105_math_q20","pk":"105_math","ans":"A","exp":"以 A 為圓心、AD 為半徑，所以 AF＝AD＝5。以 C 為圓心，CE＝CD＝17/3，在直角三角形 BCE 中 BE＝√((17/3)²－5²)＝8/3。AB＝CD＝17/3，所以 AE＝17/3－8/3＝3，EF＝AF－AE＝5－3＝2。"},{"id":"105-math-21","y":"105","n":21,"img":"105_math_q21","pk":"105_math","ans":"D","exp":"圖形與 x 軸交於 P、Q 且 PQ＝6，對稱軸是 x＝2，所以交點是 x＝－1 和 5。頂點 (2,－1) 在 x 軸下方，開口向上，函數值在 －1 與 5 之間為負、之外為正。x＝1、3 都在兩根之間，a、b 為負；x＝－1 剛好是根，c＝0；x＝－3 在左邊外側，d 為正。"},{"id":"105-math-22","y":"105","n":22,"img":"105_math_q22","pk":"105_math","ans":"A","exp":"甲：E 是 AB 中點，所以 EC＝ED，△DEC 是等腰三角形，頂角平分線 L 就是 CD 的中垂線，且過圓心；DE 的中垂線也過圓心，兩線交點必是圓心，甲正確。乙：∠PDC＝∠QCD＝90°，所以 PC、QD 都是直徑，直徑的交點就是圓心，乙也正確。"},{"id":"105-math-23","y":"105","n":23,"img":"105_math_q23","pk":"105_math","ans":"C","exp":"邊長 2 的正六邊形中，AC＝2√3、CF＝4，△ACF 是直角三角形（∠CAF＝90°），內切圓半徑＝(2＋2√3－4)/2＝√3－1。△CEF 與 △ACF 全等，並對稱於 CF，所以 P、Q 到 CF 的距離都是 √3－1，PQ＝2(√3－1)＝2√3－2。"},{"id":"105-math-24","y":"105","n":24,"img":"105_math_q24","pk":"105_math","ans":"B","exp":"設 OP＝8，則 OA＝2、AP＝6、OB＝3、BP＝5。把 OB 摺向 BP，O 落在距 B 右邊 3 的位置，也就是離 O 原位置 6 處；圖十五的 A 在原線 4 的位置，疊在一起的另一層是原線 2 的位置。所以剪點在原線 2 和 4，三段長為 2、2、4，比為 1：1：2。"},{"id":"105-math-25","y":"105","n":25,"img":"105_math_q25","pk":"105_math","ans":"C","exp":"A、C 的對稱軸就是 AC 的中垂線，會通過 N，並且線上的點到 A、C 等距。在 AD 上設點 X 使 XA＝XC，XA＝x，則 XD＝32－x，由 x²＝(32－x)²＋24² 得 x＝25，所以 XD＝7。FD＝7，因此 F 就是所求的點，直線 FN 是對稱軸。"},{"id":"106-math-1","y":"106","n":1,"img":"106_math_q01","pk":"106_math","ans":"C"},{"id":"106-math-2","y":"106","n":2,"img":"106_math_q02","pk":"106_math","ans":"A"},{"id":"106-math-3","y":"106","n":3,"img":"106_math_q03","pk":"106_math","ans":"A"},{"id":"106-math-4","y":"106","n":4,"img":"106_math_q04","pk":"106_math","ans":"D","exp":"(D) 的兩條對角線是 AC 和 AD，唯一可能的對稱軸要通過 A、D，也就是直線 AD；但對稱後 AC 會變成 AE，而圖中沒有 AE，所以不是線對稱。其他三個選項都能找到一條對稱軸使圖形互相重合。"},{"id":"106-math-5","y":"106","n":5,"img":"106_math_q05","pk":"106_math","ans":"C"},{"id":"106-math-6","y":"106","n":6,"img":"106_math_q06","pk":"106_math","ans":"B","exp":"阿信有 5 種上車方式、小怡也有 5 種，共 5×5＝25 種等可能的情形。兩人同一節車廂有 5 種（5 節車廂各一種），機率為 5/25＝1/5。"},{"id":"106-math-7","y":"106","n":7,"img":"106_math_q07","pk":"106_math","ans":"C","exp":"兩圓外切代表圓心距等於半徑和 2＋2＝4，外離代表圓心距大於 4。AC＝5＞4，所以圓 A 與圓 C 外離；BC＝4＝4，所以圓 B 與圓 C 外切。"},{"id":"106-math-8","y":"106","n":8,"img":"106_math_q08","pk":"106_math","ans":"A","exp":"252＝2²×3²×7。要讓最大公因數是 42＝2×3×7，該數的 2 只能有 1 個、3 至少 1 個、7 至少 1 個。(A) 的 2 只有 1 個、3 有 1 個、7 有 2 個，取共同最小次方得 2×3×7＝42；(C)、(D) 含 2²，會使最大公因數多一個 2；(B) 含 3²，會多一個 3。"},{"id":"106-math-9","y":"106","n":9,"img":"106_math_q09","pk":"106_math","ans":"D","exp":"全隊 11 人，總身高為 178×11＝1958。一、二年級 8 人的身高總和為 2×(172＋174＋176＋178)＝1400，所以三年級 3 人總和為 1958－1400＝558，平均 558÷3＝186 公分。"},{"id":"106-math-10","y":"106","n":10,"img":"106_math_q10","pk":"106_math","ans":"C","exp":"要打八折，原價要超過 190 元。買 n 根原價 9n，需 0.8×9n≦200，即 9n≦250，n≦27.7，所以最多 27 根（原價 243，折後 194.4）；買 28 根折後要 201.6 元，錢不夠。買 22 根只是剛好超過 190 元的最少數
