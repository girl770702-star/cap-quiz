C)贗ㄧㄢˋ、膺ㄧㄥ；(D)躊、籌都讀ㄔㄡˊ，讀音相同。"},{"id":"105-chinese-6","y":"105","n":6,"img":"105_chinese_q06","pk":"105_chinese","ans":"B","exp":"「不分軒輊」指雙方差不多；「望其項背」指勉強還能看見對方的背影，只追得上一點；「望塵莫及」指差太遠，追趕不上。依句意：功力差不多→不分軒輊，比思恩略遜→望其項背，比蔚然差太遠→望塵莫及。"},{"id":"105-chinese-7","y":"105","n":7,"img":"105_chinese_q07","pk":"105_chinese","ans":"B","exp":"(A)(C)(D)中都是哆啦A夢要帶大雄去遊未來世界；(B)引號中的「他」指的是另一個人，不是哆啦A夢自己，所以含意與其他三句差最多。"},{"id":"105-chinese-8","y":"105","n":8,"img":"105_chinese_q08","pk":"105_chinese","ans":"B","exp":"這段話說東西的主人會一代代更換，沒有人能永遠擁有，也就是事過境遷，東西不會永遠屬於同一個人。(B)「物難久持」最貼近。(C)(D)談的是如何對待或使用物品，與「換主人」無關。"},{"id":"105-chinese-9","y":"105","n":9,"img":"105_chinese_q09","pk":"105_chinese","ans":"C"},{"id":"105-chinese-10","y":"105","n":10,"img":"105_chinese_q10","pk":"105_chinese","ans":"D"},{"id":"105-chinese-11","y":"105","n":11,"img":"105_chinese_q11","pk":"105_chinese","ans":"C"},{"id":"105-chinese-12","y":"105","n":12,"img":"105_chinese_q12","pk":"105_chinese","ans":"A"},{"id":"105-chinese-13","y":"105","n":13,"img":"105_chinese_q13","pk":"105_chinese","ans":"A","exp":"「悲傷再不過的語言」是說「氣候變遷」這個詞已成為令人憂慮的話題，表示問題嚴重、已構成威脅。(B)(C)(D)在文中都沒有提到責任、對策或使人悲觀。"},{"id":"105-chinese-14","y":"105","n":14,"img":"105_chinese_q14","pk":"105_chinese","ans":"D","exp":"(A)「全盤托出」是把事情完全說出來，不是用盡力量；(B)「貽笑大方」是自謙作品會被內行人見笑，不能說「不吝」；(C)「移樽就教」是帶著酒杯主動向人請教，孟母搬家應是「孟母三遷」。(D)「破格錄用」指不拘常規錄取人才，用得恰當。"},{"id":"105-chinese-15","y":"105","n":15,"img":"105_chinese_q15","pk":"105_chinese","ans":"B","exp":"這段話開頭就說留名要「以其道得之」，也就是用正當的方式，後面的「成名要拿出最好的一面」是進一步說明。(A)只是前半句；(C)(D)文中沒有這樣的重點。"},{"id":"105-chinese-16","y":"105","n":16,"img":"105_chinese_q16","pk":"105_chinese","ans":"C"},{"id":"105-chinese-17","y":"105","n":17,"img":"105_chinese_q17","pk":"105_chinese","ans":"A","exp":"(A)「眾望所歸」的匾額送到花輪辦公室，表示他投身政壇；(B)「弄璋之喜」是生男孩，不是生女兒；(C)「喬遷」是搬家，「于歸」是出嫁；(D)「廣栽桃李」「杏壇」指教書育才，丸尾是老師，不是醫生。"},{"id":"105-chinese-18","y":"105","n":18,"img":"105_chinese_q18","pk":"105_chinese","ans":"D","exp":"(A)「朦朧」與「清晰」矛盾；(B)因果顛倒，應是潦倒是騰達所致；(C)「通宵長談」後應是天亮，不能說「入暮」；(D)語意通順，沒有語病。"},{"id":"105-chinese-19","y":"105","n":19,"img":"105_chinese_q19","pk":"105_chinese","ans":"D","exp":"柏樹在北風下仍堅挺，象徵節操；北風、冰霜象徵逆境與磨難；陽和指和暖的春光，象徵轉好的境況。(A)北風不是疑慮；(B)柏樹不是國運；(C)冰霜不是隱逸的心志。"},{"id":"105-chinese-20","y":"105","n":20,"img":"105_chinese_q20","pk":"105_chinese","ans":"D","exp":"文中提到曹家得勢是因曹寅自小為康熙伴讀，也提到曹寅的身世和康熙、雍正對曹家的態度，但沒有說曹雪芹自己世襲官職的經歷，只提到他的祖先。"},{"id":"105-chinese-21","y":"105","n":21,"img":"105_chinese_q21","pk":"105_chinese","ans":"A","exp":"空格前說詩人享盡田莊的價值，農夫卻只看到他吃了幾個野蘋果，空格後接「用那不可見而又最優美的籬笆把田莊圍起來」，主詞仍是詩人，指詩人已把田莊寫成詩。(B)主詞變成農人，不合文意。"},{"id":"105-chinese-22","y":"105","n":22,"img":"105_chinese_q22","pk":"105_chinese","ans":"D","exp":"朱熹只說古人為學的次第，《大學》是入門，其次是《論》《孟》。(A)(B)(C)的成書年代、深奧程度、思想源流，文中都沒有提到。"},{"id":"105-chinese-23","y":"105","n":23,"img":"105_chinese_q23","pk":"105_chinese","ans":"B","exp":"「戎」與「戒」字形相近，「赴戎機」誤寫成「赴戒機」是形近而誤。(A)「易」與「益」、(C)「搗」與「倒」是讀音相近的錯字。"},{"id":"105-chinese-24","y":"105","n":24,"img":"105_chinese_q24","pk":"105_chinese","ans":"C","exp":"題目的「令名」意思是美好的名聲，「令」是美好。(C)「令望」是美好的聲望，意義相同；(A)是法令，(B)是命令，(D)是使、讓。"},{"id":"105-chinese-25","y":"105","n":25,"img":"105_chinese_q25","pk":"105_chinese","ans":"B","exp":"(A)拋磚引玉、(C)錯愛、(D)鵝毛都是謙稱自己；(B)「青眼有加」是稱讚對方看重自己，不是自謙，所以沒有自謙的含意。"},{"id":"105-chinese-26","y":"105","n":26,"img":"105_chinese_q26","pk":"105_chinese","ans":"C","exp":"①②④是用來支持論點的例證，③「因此……武俠小說是男權的文化幫兇」前面有「因此」，是根據證據推出的結論，才是作者想陳述的論點。"},{"id":"105-chinese-27","y":"105","n":27,"img":"105_chinese_q27","pk":"105_chinese","ans":"C","exp":"這闋詞說不必斤斤計較，要面對清風明月、喝美酒享受當下，是豁達自適、及時行樂。(A)(D)是憂患意識，(B)是出世求仙，都不符合。"},{"id":"105-chinese-28","y":"105","n":28,"img":"105_chinese_q28","pk":"105_chinese","ans":"A","exp":"對聯上聯貼右邊、下聯貼左邊，上聯結尾是仄聲，下聯結尾是平聲。(乙)在左邊是下聯，要選結尾為平聲的「清樽日月長」；(B)(C)(D)結尾「大」「解」「里」都是仄聲，是上聯。"},{"id":"105-chinese-29","y":"105","n":29,"img":"105_chinese_q29","pk":"105_chinese","ans":"B","exp":"文中說百貨公司的母親節是商業促銷，並諷刺政客、高官只在選舉時想到婦幼，但沒有說每個人都需要被提醒才知道感恩，(B)不符文意。(A)(C)(D)都與文意相符。"},{"id":"105-chinese-30","y":"105","n":30,"img":"105_chinese_q30","pk":"105_chinese","ans":"A","exp":"這段文字說好文章要做到：明白妥當的道理、布置取捨、繁簡得宜、用辭雅正，是在說明好文章需具備的條件。(B)(C)(D)都沒有談到創作步驟或古今文章樣貌。"},{"id":"105-chinese-31","y":"105","n":31,"img":"105_chinese_q31","pk":"105_chinese","ans":"B"},{"id":"105-chinese-32","y":"105","n":32,"img":"105_chinese_q32","pk":"105_chinese","ans":"B","exp":"文中說蔡君謨替歐陽脩的〈集古錄目序〉刻石，歐陽脩因此送他筆、筆格、茶、泉水等物當作潤筆，也就是酬謝。(A)(C)(D)都不是原文的意思。"},{"id":"105-chinese-33","y":"105","n":33,"img":"105_chinese_q33","pk":"105_chinese","ans":"B","exp":"鹽商宴請的菜色表面清淡，其實魚只取一小部分、食材名貴刁鑽，可見清淡之中藏著奢華，(B)最貼切。(A)(C)(D)都在稱讚清淡或批評奢華，與「表面清淡實則豪奢」不符。"},{"id":"105-chinese-34","y":"105","n":34,"img":"105_chinese_q34","pk":"105_chinese","ans":"D","exp":"文中說廉頗的仇人郭開用金子買通使者，要他毀謗廉頗，使者回報「三遺矢」，趙王才認為他老而不召。(B)老態並非真正原因；(A)(C)文中沒有提到。"},{"id":"105-chinese-35","y":"105","n":35,"img":"105_chinese_q35","pk":"105_chinese","ans":"A","exp":"詩中說畫家不了解漁家的辛苦，只把寒夜捕魚畫成漂亮的〈寒江釣雪圖〉，表達作者對漁民疾苦的關切同情。(C)(D)說畫家了解或欣賞，與「不解漁家苦」相反。"},{"id":"105-chinese-36","y":"105","n":36,"img":"105_chinese_q36","pk":"105_chinese","ans":"D","pimg":"105_chinese_p36","grp":"105-chinese-36～37","exp":"文末寫詹氏想起年輕時為了排隊挑水，讓剛會爬行的素娥靠近油燈而成殘疾，所以流淚是想到自己育女疏失。(A)拿藥是為旅途準備；(B)她是想幫忙；(C)寄居是為分擔照顧殘障的女兒。"},{"id":"105-chinese-37","y":"105","n":37,"img":"105_chinese_q37","pk":"105_chinese","ans":"B","pimg":"105_chinese_p36","grp":"105-chinese-36～37","exp":"素娥「不忍她的老母年老還要去做那些像傭婦的事」，對母親有心疼，因此是心疼母親一生操勞。(A)(C)(D)文中都沒有這樣的意思。"},{"id":"105-chinese-38","y":"105","n":38,"img":"105_chinese_q38","pk":"105_chinese","ans":"D","pimg":"105_chinese_p38","grp":"105-chinese-38～39","exp":"(A)參觀要預約，整理青苔是工作人員的事；(B)京都寺廟有唐宋風格；(C)十七處文化景觀中有十三處是佛寺，不是十七處佛寺。(D)保留區內新建、改建、開墾等都要經過許可，與文意相符。"},{"id":"105-chinese-39","y":"105","n":39,"img":"105_chinese_q39","pk":"105_chinese","ans":"C","pimg":"105_chinese_p38","grp":"105-chinese-38～39","exp":"文中說京都佛寺有濃濃唐宋風格並保留木色，中國近代寺廟才上紅漆，所以無法推出唐宋佛寺多為紅漆黑瓦。(A)可由印度式微推知，(B)(D)文中也有提到。"},{"id":"105-chinese-40","y":"105","n":40,"img":"105_chinese_q40","pk":"105_chinese","ans":"A","pimg":"105_chinese_p40","grp":"105-chinese-40～41","exp":"先用乙說明原始燒烤與現代社會有矛盾，再用甲說明燒烤的壞處，最後丙以「可是」轉折，說燒烤仍迷人，銜接首尾，順序為乙→甲→丙。"},{"id":"105-chinese-41","y":"105","n":41,"img":"105_chinese_q41","pk":"105_chinese","ans":"A","pimg":"105_chinese_p40","grp":"105-chinese-40～41"},{"id":"105-chinese-42","y":"105","n":42,"img":"105_chinese_q42","pk":"105_chinese","ans":"A","pimg":"105_chinese_p42","grp":"105-chinese-42～44","exp":"(A)①寫小河乾枯，作者驚愕又失落；(B)②寫小河像一股水聲流入大海、在歲月中流失，不是依戀離去；(C)③是比喻昔日美好消失；(D)④是期待小河復甦。"},{"id":"105-chinese-43","y":"105","n":43,"img":"105_chinese_q43","pk":"105_chinese","ans":"D","pimg":"105_chinese_p42","grp":"105-chinese-42～44","exp":"(A)天氣變化不是暗示人生無常；(B)文中沒有議論探討原因；(C)文中沒有細寫童年盛景；(D)文章用「我站著」的獨白方式，把所見所思所感一一道出。"},{"id":"105-chinese-44","y":"105","n":44,"img":"105_chinese_q44","pk":"105_chinese","ans":"A","pimg":"105_chinese_p42","grp":"105-chinese-42～44"},{"id":"105-chinese-45","y":"105","n":45,"img":"105_chinese_q45","pk":"105_chinese","ans":"C","pimg":"105_chinese_p45","grp":"105-chinese-45～46","exp":"廚娘說扇墜是在黃花魚肚中找到的，可以證明扇墜曾掉進水裡。(A)是皇帝的舊物被尋回，不是特意奉還；(B)是高宗召問；(D)廚娘是賣給提籃人，不是直接賣給鋪家。"},{"id":"105-chinese-46","y":"105","n":46,"img":"105_chinese_q46","pk":"105_chinese","ans":"C","pimg":"105_chinese_p45","grp":"105-chinese-45～46","exp":"文章從扇墜遺失，逐層追問張循王、鋪家、提籃人、廚娘，才找到源頭，像抽絲剝繭層層鋪敘。(A)沒有凸顯所有人物個性；(B)沒有勸世的意思；(D)結尾已寫明賞賜。"},{"id":"105-chinese-47","y":"105","n":47,"img":"105_chinese_q47","pk":"105_chinese","ans":"D","pimg":"105_chinese_p47","grp":"105-chinese-47～48","exp":"「工多而用寡」的主語是篆文，「乃變篆籀之體為隸書」的主語是次仲，「三徵入秦」的主語是始皇，「落二翮於峰巒」的主語是大鳥。(D)正確。"},{"id":"105-chinese-48","y":"105","n":48,"img":"105_chinese_q48","pk":"105_chinese","ans":"C","pimg":"105_chinese_p47","grp":"105-chinese-47～48","exp":"(A)次仲是因為不恭敬被始皇下令送押；(B)次仲化為大鳥飛走，不是始皇急功好利所致；(D)大翮、小翮是次仲化鳥落下的羽毛，不是箭。(C)次仲把篆籀改為隸書，方便世人使用。"},{"id":"106-chinese-1","y":"106","n":1,"img":"106_chinese_q01","pk":"106_chinese","ans":"B"},{"id":"106-chinese-2","y":"106","n":2,"img":"106_chinese_q02","pk":"106_chinese","ans":"D"},{"id":"106-chinese-3","y":"106","n":3,"img":"106_chinese_q03","pk":"106_chinese","ans":"C","exp":"要注意兩個詞語的意思有沒有放反。(A)應是「無限」暢飲、「無線」上網；(B)應是「身手」矯捷、「身首」異處；(D)應是「權力」再大、侵犯他人的「權利」。(C)「報仇」與「報酬」的用法都正確。"},{"id":"106-chinese-4","y":"106","n":4,"img":"106_chinese_q04","pk":"106_chinese","ans":"C"},{"id":"106-chinese-5","y":"106","n":5,"img":"106_chinese_q05","pk":"106_chinese","ans":"A"},{"id":"106-chinese-6","y":"106","n":6,"img":"106_chinese_q06","pk":"106_chinese","ans":"C"},{"id":"106-chinese-7","y":"106","n":7,"img":"106_chinese_q07","pk":"106_chinese","ans":"C","exp":"作者本來想去獅頭山、貢丸湯卻不能盡如人意，意外逛到城隍廟反而有驚喜，所以結論是不必強求，順其自然就會有收穫。(A)(B)文中沒有談到等待或準備；(D)「但求無愧我心」也不是文中的重點。"},{"id":"106-chinese-8","y":"106","n":8,"img":"106_chinese_q08","pk":"106_chinese","ans":"B","exp":"用字精簡是指沒有多餘重複的字。(A)「好比像似」、(C)「似乎像是」、(D)「彷若…一般似的」都把意思相同的詞疊在一起；(B)「彷彿」只用一次，最簡潔。"},{"id":"106-chinese-9","y":"106","n":9,"img":"106_chinese_q09","pk":"106_chinese","ans":"D","exp":"指事字是用符號指出事物的某個部位。「末」是在「木」的上端加一橫，表示樹梢。(A)肉、(B)山、(C)牛都是依照物體的形狀畫出來，屬於象形字。"},{"id":"106-chinese-10","y":"106","n":10,"img":"106_chinese_q10","pk":"106_chinese","ans":"D"},{"id":"106-chinese-11","y":"106","n":11,"img":"106_chinese_q11","pk":"106_chinese","ans":"A"},{"id":"106-chinese-12","y":"106","n":12,"img":"106_chinese_q12","pk":"106_chinese","ans":"A"},{"id":"106-chinese-13","y":"106","n":13,"img":"106_chinese_q13","pk":"106_chinese","ans":"D","exp":"曾國藩說自己每天稍有空閒，就把從前喜愛的班固、司馬遷、韓愈、歐陽脩的文章拿來溫習，用來修養心神。(A)並不是與舊友切磋；(B)是溫習不是仿效寫作；(C)「此念久廢」，表示戎馬時已放下著述。"},{"id":"106-chinese-14","y":"106","n":14,"img":"106_chinese_q14","pk":"106_chinese","ans":"A"},{"id":"106-chinese-15","y":"106","n":15,"img":"106_chinese_q15","pk":"106_chinese","ans":"B","exp":"第二句意思是：眾人都去欣賞荷花（芙蓮），隨他們去吧，自有隱居高潔的人欣賞我這冷淡的秋花。這正是不隨流俗、終能得到知音賞識的想法。(A)只寫秋花的冷淡；(C)(D)是寫寂寞的景色與女子的樣子。"},{"id":"106-chinese-16","y":"106","n":16,"img":"106_chinese_q16","pk":"106_chinese","ans":"C","exp":"題目是用具體的「醇酒」比喻抽象的「友情」。(C)用具體的「衰老的獸」比喻抽象的「孤獨」，方式相同。(A)(B)(D)的被比喻對象，繁花、亂雲等，本來就是具體事物，不是抽象概念。"},{"id":"106-chinese-17","y":"106","n":17,"img":"106_chinese_q17","pk":"106_chinese","ans":"C","exp":"迂公聽到客人說馬肝有毒時就笑他說謊，所以原本是不相信的。(A)食馬肝而死的是文成，不是漢武帝；(B)客人只是開玩笑；(D)馬是因為被割掉肝才死，不能證明馬肝有毒。"},{"id":"106-chinese-18","y":"106","n":18,"img":"106_chinese_q18","pk":"106_chinese","ans":"B"},{"id":"106-chinese-19","y":"106","n":19,"img":"106_chinese_q19","pk":"106_chinese","ans":"B","exp":"第一格在「生理層面」後面，接的是對這個層面的解釋說明，用破折號最恰當。第二格前後是「即將往生」和「面臨生命最後一段歲月」兩個並列的詞語，用頓號隔開；整段是疑問與說明，不適合用刪節號、分號或冒號。"},{"id":"106-chinese-20","y":"106","n":20,"img":"106_chinese_q20","pk":"106_chinese","ans":"B","exp":"(A)應是「不脛而走」；(C)應是「不同凡響」；(D)應是「不知所措」。(B)「功虧一簣」寫法正確，意思是只差一點就成功卻失敗。"},{"id":"106-chinese-21","y":"106","n":21,"img":"106_chinese_q21","pk":"106_chinese","ans":"C"},{"id":"106-chinese-22","y":"106","n":22,"img":"106_chinese_q22","pk":"106_chinese","ans":"A","exp":"句意是：幾乎每個人都羨慕過別人，也幾乎每個人都被羨慕過，只有少數人沒被羨慕。所以羨慕別人的人接近百分之百，被羨慕的人也占絕大多數。(B)(D)出現不少「不羨慕別人」的人，不符「沒有人」；(C)不被羨慕的人佔了六成多，不是少數。"},{"id":"106-chinese-23","y":"106","n":23,"img":"106_chinese_q23","pk":"106_chinese","ans":"C"},{"id":"106-chinese-24","y":"106","n":24,"img":"106_chinese_q24","pk":"106_chinese","ans":"B","exp":"直式信封的規矩是：右欄寫收信人的地址，左欄寫寄信人的地址。這封信是臺北的王小姐寄給高雄的陳先生，但圖中右欄寫臺北、左欄寫高雄，位置放反了，應該對調。"},{"id":"106-chinese-25","y":"106","n":25,"img":"106_chinese_q25","pk":"106_chinese","ans":"D","exp":"「如期完成」的「如」是依照、按照的意思。(D)「有不如法者」是不依照法令的人，意思相同。(A)是到、去；(B)是比得上；(C)是好像。"},{"id":"106-chinese-26","y":"106","n":26,"img":"106_chinese_q26","pk":"106_chinese","ans":"A"},{"id":"106-chinese-27","y":"106","n":27,"img":"106_chinese_q27","pk":"106_chinese","ans":"B","exp":"「昂首」是抬頭向上看，但深淵在腳下，應該是「俯首」或「低頭」往下看，所以(B)有語病。其他三句用語都通順。"},{"id":"106-chinese-28","y":"106","n":28,"img":"106_chinese_q28","pk":"106_chinese","ans":"D","exp":"(D)兩個「荷」都讀ㄏㄜˋ，意思是承擔、扛著。(A)「上」讀ㄕㄤˋ和ㄕㄤˇ；(B)「倔強」讀ㄐㄩㄝˊ ㄐㄧㄤˋ，「強弩之末」讀ㄑㄧㄤˊ；(C)「伺機」讀ㄙˋ，「伺候」讀ㄘˋ。"},{"id":"106-chinese-29","y":"106","n":29,"img":"106_chinese_q29","pk":"106_chinese","ans":"C","exp":"(C)前句寫讀書沒完沒了，後句說不如出去尋春，是把兩件事互相比較。(A)是兩種享受並列，不是因果；(B)是孩子誤以為下雨，是因果不是假設；(D)是拿梅和雪互相比較，一個白、一個香，不是層層遞進。"},{"id":"106-chinese-30","y":"106","n":30,"img":"106_chinese_q30","pk":"106_chinese","ans":"C"},{"id":"106-chinese-31","y":"106","n":31,"img":"106_chinese_q31","pk":"106_chinese","ans":"A"},{"id":"106-chinese-32","y":"106","n":32,"img":"106_chinese_q32","pk":"106_chinese","ans":"A"},{"id":"106-chinese-33","y":"106","n":33,"img":"106_chinese_q33","pk":"106_chinese","ans":"D"},{"id":"106-chinese-34","y":"106","n":34,"img":"106_chinese_q34","pk":"106_chinese","ans":"C","exp":"(C)「如數家珍」形容對事物非常熟悉，用得正確。(A)「殊途同歸」指方法不同而結果相同，不能用來說大家各自回家；(B)「如喪考妣」形容像父母去世般悲痛，不適合用在已過世的母親身上；(D)雙胞胎本來就是兄弟，不必用「情同手足」。"},{"id":"106-chinese-35","y":"106","n":35,"img":"106_chinese_q35","pk":"106_chinese","ans":"B","pimg":"106_chinese_p35","grp":"106-chinese-35～36"},{"id":"106-chinese-36","y":"106","n":36,"img":"106_chinese_q36","pk":"106_chinese","ans":"A","pimg":"106_chinese_p35","grp":"106-chinese-35～36","exp":"文章是在說ADHD的特質可能源自遠古狩獵生活，並引述學者看法，最後希望從不同角度看待、讓教育制度包容。完全沒有談到要培養多元能力來順應社會趨勢，所以(A)最不相關。"},{"id":"106-chinese-37","y":"106","n":37,"img":"106_chinese_q37","pk":"106_chinese","ans":"C","pimg":"106_chinese_p37","grp":"106-chinese-37～38","exp":"文中說男子要先成功出草、獵回人頭，才能紋面成為成年男子，所以紋面時任務已經完成。(C)說「為即將執行出草任務而期待」與文意不合，不可能是他心情澎湃的原因。"},{"id":"106-chinese-38","y":"106","n":38,"img":"106_chinese_q38","pk":"106_chinese","ans":"D","pimg":"106_chinese_p37","grp":"106-chinese-37～38"},{"id":"106-chinese-39","y":"106","n":39,"img":"106_chinese_q39","pk":"106_chinese","ans":"B","pimg":"106_chinese_p39","grp":"106-chinese-39～40"},{"id":"106-chinese-40","y":"106","n":40,"img":"106_chinese_q40","pk":"106_chinese","ans":"D","pimg":"106_chinese_p39","grp":"106-chinese-39～40","exp":"文章依序從建安、唐代、五代說到北宋，講社會組織與文人生活如何改變文風，是按朝代先後論述。(A)並非拿唐和五代對比；(B)沒有空間描寫；(C)李白、杜甫是用來說明文人當門客、作客的情形，不是談科舉。"},{"id":"106-chinese-41","y":"106","n":41,"img":"106_chinese_q41","pk":"106_chinese","ans":"A","pimg":"106_chinese_p41","grp":"106-chinese-41～42"},{"id":"106-chinese-42","y":"106","n":42,"img":"106_chinese_q42","pk":"106_chinese","ans":"B","pimg":"106_chinese_p41","grp":"106-chinese-41～42"},{"id":"106-chinese-43","y":"106","n":43,"img":"106_chinese_q43","pk":"106_chinese","ans":"A","pimg":"106_chinese_p43","grp":"106-chinese-43～44"},{"id":"106-chinese-44","y":"106","n":44,"img":"106_chinese_q44","pk":"106_chinese","ans":"D","pimg":"106_chinese_p43","grp":"106-chinese-43～44","exp":"文中說火山灰顆粒大小恰好讓紅光不易通過，月光才偏藍，可見顆粒大小會影響月亮的顏色。(A)報導日期2015年7月29日是星期三；(B)月亮周期約29.5天，二月最多29天，不會有兩次滿月；(C)「月亮錯覺」是看起來又大又圓，和藍月無關。"},{"id":"106-chinese-45","y":"106","n":45,"img":"106_chinese_q45","pk":"106_chinese","ans":"B","pimg":"106_chinese_p45","grp":"106-chinese-45～46","exp":"「巡撫河南」的「巡撫」原是官名，這裡當動詞用，指擔任巡撫。(B)「肩」本是名詞，這裡當動詞，指承擔。兩者都是名詞活用為動詞。(A)(C)的「燭」「頰」仍是名詞；(D)「為」是介詞。"},{"id":"106-chinese-46","y":"106","n":46,"img":"106_chinese_q46","pk":"106_chinese","ans":"A","pimg":"106_chinese_p45","grp":"106-chinese-45～46"},{"id":"106-chinese-47","y":"106","n":47,"img":"106_chinese_q47","pk":"106_chinese","ans":"D","pimg":"106_chinese_p47","grp":"106-chinese-47～48"},{"id":"106-chinese-48","y":"106","n":48,"img":"106_chinese_q48","pk":"106_chinese","ans":"B","pimg":"106_chinese_p47","grp":"106-chinese-47～48","exp":"(B)甲詩重複「扶桑」，乙詩重複「楊」字，增加節奏感。(A)甲詩第一句就點出目的地扶桑；(C)兩首詩的虛實安排與此敘述不符；(D)甲詩的一、二、四句（中、東、風）也押韻。"},{"id":"107-chinese-1","y":"107","n":1,"img":"107_chinese_q01","pk":"107_chinese","ans":"C"},{"id":"107-chinese-2","y":"107","n":2,"img":"107_chinese_q02","pk":"107_chinese","ans":"B","exp":"「只要…才…」不是搭配，「只要」應配「就」；(C)「與其…反而」應改成「與其…不如」；(D)「更何況」要用在「連…都…，更何況…」，這裡不通。(B)「即使…也…」是正確的讓步用法。"},{"id":"107-chinese-3","y":"107","n":3,"img":"107_chinese_q03","pk":"107_chinese","ans":"A","exp":"情書要稱對方「倩影」；對別人稱自己的父親用「家父」；「作繭自縛」指自己害自己，符合責罵自己的語氣。(B)(D)「先母」「先嚴」是稱已去世的親人；(C)「龍顏」是指帝王的臉。"},{"id":"107-chinese-4","y":"107","n":4,"img":"107_chinese_q04","pk":"107_chinese","ans":"D"},{"id":"107-chinese-5","y":"107","n":5,"img":"107_chinese_q05","pk":"107_chinese","ans":"A"},{"id":"107-chinese-6","y":"107","n":6,"img":"107_chinese_q06","pk":"107_chinese","ans":"B"},{"id":"107-chinese-7","y":"107","n":7,"img":"107_chinese_q07","pk":"107_chinese","ans":"D","exp":"這段先談偶像用浮濫口語、「不行」包辦所有感覺，最後擔心世界的細緻處會消失，主旨是語言粗俗化會影響我們看世界的方式。(B)只說媒體注意到，沒談到後果；(C)與內容無關。"},{"id":"107-chinese-8","y":"107","n":8,"img":"107_chinese_q08","pk":"107_chinese","ans":"A"},{"id":"107-chinese-9","y":"107","n":9,"img":"107_chinese_q09","pk":"107_chinese","ans":"C","exp":"水濁時營養鹽多，植物性浮游生物多，動物性浮游生物和小魚、大魚也跟著多，所以浮游生物多的水域魚類較容易生存。(A)混濁時營養鹽多，大魚反而增加；(B)清澈時營養鹽少，浮游生物少；(D)動物性靠植物性維生，兩者成正比。"},{"id":"107-chinese-10","y":"107","n":10,"img":"107_chinese_q10","pk":"107_chinese","ans":"A"},{"id":"107-chinese-11","y":"107","n":11,"img":"107_chinese_q11","pk":"107_chinese","ans":"B","exp":"「浮沉」官海指在官場中起起落落；後句「仕隱哲學體系」談的是思想，所以填「精神」層面。(A)「沉淪」語意太重且「抽象」不合；(C)「浸淫」是長期沉浸，與「波濤」不搭。"},{"id":"107-chinese-12","y":"107","n":12,"img":"107_chinese_q12","pk":"107_chinese","ans":"A","exp":"「噤聲躡足」形容不敢出聲、輕手輕腳，與怕驚動家人相合。(B)「日出而作，日入而息」是悠閒生活，與「焚膏繼晷」矛盾；(C)「天衣無縫」形容完美沒破綻，不能形容人多擁擠；(D)「表裡相濟」應改成「表裡不一」。"},{"id":"107-chinese-13","y":"107","n":13,"img":"107_chinese_q13","pk":"107_chinese","ans":"B","exp":"(A)應為「殊途同歸」；(C)應為「驕矜」自滿；(D)應為「一成不變」。(B)「茅塞頓開」「豁然開朗」都寫對了。"},{"id":"107-chinese-14","y":"107","n":14,"img":"107_chinese_q14","pk":"107_chinese","ans":"C"},{"id":"107-chinese-15","y":"107","n":15,"img":"107_chinese_q15","pk":"107_chinese","ans":"B","exp":"「離情依依」是形容離別時依依不捨，但句中是想念母親的拿手菜，表達的是思鄉之情，用在這裡語意不合。(C)(D)用詞與邏輯都沒問題。"},{"id":"107-chinese-16","y":"107","n":16,"img":"107_chinese_q16","pk":"107_chinese","ans":"A"},{"id":"107-chinese-17","y":"107","n":17,"img":"107_chinese_q17","pk":"107_chinese","ans":"A","exp":"「秋霜」比喻白髮，句意是照鏡子才發現自己頭上添了白髮。(B)是真的寒霜沾濕衣服；(C)用霜比喻高潔的志節；(D)指秋天降霜的時節。"},{"id":"107-chinese-18","y":"107","n":18,"img":"107_chinese_q18","pk":"107_chinese","ans":"B","exp":"(A)「每位」「們」「各個」意思重複；(D)「不僅僅只是」中「僅僅」與「只」重複。(B)每個詞各有作用，沒有多餘。"},{"id":"107-chinese-19","y":"107","n":19,"img":"107_chinese_q19","pk":"107_chinese","ans":"D","exp":"原句說走未知的路比較長久，意思是未知有更多可能；(A)(B)(C)多少都與已知和未知的差別有關，(D)講的是勇敢面對，並沒有比較兩種路，所以離原意最遠。"},{"id":"107-chinese-20","y":"107","n":20,"img":"107_chinese_q20","pk":"107_chinese","ans":"A"},{"id":"107-chinese-21","y":"107","n":21,"img":"107_chinese_q21","pk":"107_chinese","ans":"C","exp":"把藏書室比作有沉睡靈魂的地方，呼喚他們就會醒來，意思是讀者透過閱讀，與作者的心靈相通。(B)方向相反，是讀者喚醒作品，而非作品喚醒讀者。"},{"id":"107-chinese-22","y":"107","n":22,"img":"107_chinese_q22","pk":"107_chinese","ans":"C","exp":"作者說今人好詩，卻都走偏門、用字雜亂，終日寫作卻沒有精彩警句，大家的作品都流於平庸，是感嘆詩風雖盛、佳作卻少。(A)(D)是讚美，與原意相反。"},{"id":"107-chinese-23","y":"107","n":23,"img":"107_chinese_q23","pk":"107_chinese","ans":"C"},{"id":"107-chinese-24","y":"107","n":24,"img":"107_chinese_q24","pk":"107_chinese","ans":"D","exp":"(A)說服秦王的是旁人，不是中期；(B)秦王是因為爭論被中期說服不了才發怒；(C)「徐行而去」是不肯屈服的樣子，不是謙和。旁人說遇到桀紂必被殺，等於稱秦王是明君，秦王不想被比成桀紂，所以不怪罪。"},{"id":"107-chinese-25","y":"107","n":25,"img":"107_chinese_q25","pk":"107_chinese","ans":"C","exp":"(C)兩個「向」都是「朝著、對著」的意思。(A)「發」是起用與表現出來；(B)「絕」是獨一無二與斷絕；(D)「將」是扶持與傳達、表達。"},{"id":"107-chinese-26","y":"107","n":26,"img":"107_chinese_q26","pk":"107_chinese","ans":"A","exp":"原文說六成四的企業會優先面試，表示仍有四成不會，所以不是所有企業都這樣做。(B)態度屬於無形資產，難以由證照判斷；(C)難以當客觀工具的是無形資產；(D)原文說證照是「除了學經歷以外」最能量化的。"},{"id":"107-chinese-27","y":"107","n":27,"img":"107_chinese_q27","pk":"107_chinese","ans":"C","exp":"(C)是「運籌帷幄」與「拔得頭籌」，兩個「籌」相同。(A)「虧簣」與「匱乏」不同；(B)「衣冠」與「羽扇綸巾」不同；(D)「雍容」與「庸人自擾」不同。"},{"id":"107-chinese-28","y":"107","n":28,"img":"107_chinese_q28","pk":"107_chinese","ans":"D","exp":"以泉聲「鏦然」和鳥聲「磔然」襯托出山林的幽靜，是以聲襯靜的手法。(A)文中也寫了泉、藤、鳥，並非寫松最詳盡；(B)只有寫松時用到譬喻；(C)是依行程由山外到山中的順序寫，不是由小到大。"},{"id":"107-chinese-29","y":"107","n":29,"img":"107_chinese_q29","pk":"107_chinese","ans":"C","exp":"子野只是舉出三則自己最得意的句子，並沒有說平生佳作僅此三則，所以(C)錯誤。(A)(B)(D)都能從詞句風格、愛用「影」字、不贊成「張三中」的稱呼中看出。"},{"id":"107-chinese-30","y":"107","n":30,"img":"107_chinese_q30","pk":"107_chinese","ans":"B","exp":"作者主張找出最優良的一人，把事情交給他；人多了，愚者多、智者少，又互相忌妒。所以在上位者要善於選出優秀的人才並委以重任。(A)(C)(D)與原文意思不合，原文並不主張聽眾議或要求愚智同心。"},{"id":"107-chinese-31","y":"107","n":31,"img":"107_chinese_q31","pk":"107_chinese","ans":"B","exp":"甲詩看雪像花開，在詠雪；乙詩由暗香判斷那不是雪而是梅，在詠梅。(A)乙詩沒有以雪喻梅；(C)兩詩是春雪與凌寒，並非都是暮春夜晚；(D)乙詩靠香氣分辨出是梅花。"},{"id":"107-chinese-32","y":"107","n":32,"img":"107_chinese_q32","pk":"107_chinese","ans":"A","exp":"子胥說別人是因為他有美珠才找他，如果被抓，他會說是邊候吞掉了，這是用話來威脅邊候，邊候怕被牽連，才放了他。(B)沒有賄賂；(D)邊候並非相信他清白，而是怕惹禍上身。"},{"id":"107-chinese-33","y":"107","n":33,"img":"107_chinese_q33","pk":"107_chinese","ans":"D"},{"id":"107-chinese-34","y":"107","n":34,"img":"107_chinese_q34","pk":"107_chinese","ans":"A","pimg":"107_chinese_p34","grp":"107-chinese-34～35","exp":"文末作者看著腳說「這雙大小剛剛好」，表示他也學會穿小一號的拖鞋。(B)(C)印尼和緬甸人是穿小一號、腳不超過鞋；(D)埃及人的體溫與其他國家相同，都是37度。"},{"id":"107-chinese-35","y":"107","n":35,"img":"107_chinese_q35","pk":"107_chinese","ans":"D","pimg":"107_chinese_p34","grp":"107-chinese-34～35","exp":"作者從緬甸人穿小鞋、埃及人搶坐剛坐過的位子，說明自己認為的常識未必適用於別人，所以不要拿自己的常識評斷別人，要尊重當地的生活智慧。(A)(B)(C)只談到片面，不是全文重點。"},{"id":"107-chinese-36","y":"107","n":36,"img":"107_chinese_q36","pk":"107_chinese","ans":"B","pimg":"107_chinese_p36","grp":"107-chinese-36～37","exp":"1949年建國到1990年統一，共41年，超過四十年。(A)是圍牆1989年開放拆除，統一在1990年；(C)圍牆是1961年才開始興建；(D)1971年協議後，西柏林人就能造訪東德。"},{"id":"107-chinese-37","y":"107","n":37,"img":"107_chinese_q37","pk":"107_chinese","ans":"C","pimg":"107_chinese_p36","grp":"107-chinese-36～37","exp":"依圖表，布蘭登堡門關閉在1961年，甘迺迪訪問在1963年，雷根當選在1980年，戈巴契夫下台在1991年，所以順序是乙、甲、丙、丁。"},{"id":"107-chinese-38","y":"107","n":38,"img":"107_chinese_q38","pk":"107_chinese","ans":"D","pimg":"107_chinese_p38","grp":"107-chinese-38～39","exp":"文中說唐太宗這樣的盛世皇帝沒有封禪，而好大喜功的秦始皇、漢武帝，甚至亡國的秦二世也封禪，可見舉行封禪的皇帝不一定賢明。(A)封在山頂、禪在山下；(B)是表揚自己；(C)原文是內外安定的年代才敢，但唐太宗也沒上山。"},{"id":"107-chinese-39","y":"107","n":39,"img":"107_chinese_q39","pk":"107_chinese","ans":"C","pimg":"107_chinese_p38","grp":"107-chinese-38～39","exp":"秦二世的刻石由李斯書寫，用的是小篆，字形圓轉、粗細均勻，(C)最接近。(B)是更早期的金文，(A)是隸書，(D)是行草書。"},{"id":"107-chinese-40","y":"107","n":40,"img":"107_chinese_q40","pk":"107_chinese","ans":"D","pimg":"107_chinese_p40","grp":"107-chinese-40～41"},{"id":"107-chinese-41","y":"107","n":41,"img":"107_chinese_q41","pk":"107_chinese","ans":"B","pimg":"107_chinese_p40","grp":"107-chinese-40～41","exp":"文中只說明藥廠不生產沒利潤的藥，並說製造疫苗的藥廠變少，但沒有說藥廠變少是因為利潤愈來愈低，所以(B)無法推知。(D)文中說疾管局因供應不足而建議延期。"},{"id":"107-chinese-42","y":"107","n":42,"img":"107_chinese_q42","pk":"107_chinese","ans":"A","pimg":"107_chinese_p42","grp":"107-chinese-42～43"},{"id":"107-chinese-43","y":"107","n":43,"img":"107_chinese_q43","pk":"107_chinese","ans":"D","pimg":"107_chinese_p42","grp":"107-chinese-42～43","exp":"文章有舉電影院、旅館、動物等例子，語氣詼諧並穿插反話，用語生動，但沒有拿中國與西方做對照，所以(D)最不恰當。"},{"id":"107-chinese-44","y":"107","n":44,"img":"107_chinese_q44","pk":"107_chinese","ans":"C","pimg":"107_chinese_p44","grp":"107-chinese-44～46","exp":"「亦不應」是守門者看到客人作揖卻不回應，主詞是守門者；(A)(B)(D)的省略主詞都是青州客。"},{"id":"107-chinese-45","y":"107","n":45,"img":"107_chinese_q45","pk":"107_chinese","ans":"B","pimg":"107_chinese_p44","grp":"107-chinese-44～46","exp":"巫者說陽地人來到，陽氣逼人，所以王生病，是因為客靠近王座。(A)只說像中國，不是皆不同；(C)巫建議用飲食車馬答謝送走，不是齋戒沐浴；(D)是國人看不見他。"},{"id":"107-chinese-46","y":"107","n":46,"img":"107_chinese_q46","pk":"107_chinese","ans":"D","pimg":"107_chinese_p44","grp":"107-chinese-44～46","exp":"作者說明這個故事是怎麼從青州客，經賀德儉、楊師厚，再傳到范宣古，最後由他親自聽聞的，目的是強調故事來源可靠、言之有據。"},{"id":"107-chinese-47","y":"107","n":47,"img":"107_chinese_q47","pk":"107_chinese","ans":"B","pimg":"107_chinese_p47","grp":"107-chinese-47～48","exp":"「抑揚爽朗，莫之與京」指文章抑揚起伏、爽朗暢達，沒有人能與之相比。(A)作者是說陶淵明意不在酒；(C)原文沒有說他仕途飛黃騰達；(D)是作者感嘆自己恨不能與他同時。"},{"id":"107-chinese-48","y":"107","n":48,"img":"107_chinese_q48","pk":"107_chinese","ans":"D","pimg":"107_chinese_p47","grp":"107-chinese-47～48","exp":"文中提到陶淵明詩多寫酒、文章獨超眾類，作者也很敬重他，但沒有提到後世文壇是否受他影響，所以(D)無法得知。"},{"id":"108-chinese-1","y":"108","n":1,"img":"108_chinese_q01","pk":"108_chinese","ans":"D","exp":"依語氣逐格看：「只」存在文化裡，「但卻」活靈活現（轉折），「不只」有鮮明圖樣，「還」繁殖出語意象徵（遞進）。(A)(B)(C)的連接詞搭配，都無法同時符合轉折與遞進。"},{"id":"108-chinese-2","y":"108","n":2,"img":"108_chinese_q02","pk":"108_chinese","ans":"A"},{"id":"108-chinese-3","y":"108","n":3,"img":"108_chinese_q03","pk":"108_chinese","ans":"D","exp":"報導原則是只陳述事實、不加主觀推論。(D)引述醫生的警告，是有根據的陳述；(A)「赤子之心」、(B)「惡意肇事者」、(C)「勝券在握」都是記者自己的推測或評價。"},{"id":"108-chinese-4","y":"108","n":4,"img":"108_chinese_q04","pk":"108_chinese","ans":"C"},{"id":"108-chinese-5","y":"108","n":5,"img":"108_chinese_q05","pk":"108_chinese","ans":"D"},{"id":"108-chinese-6","y":"108","n":6,"img":"108_chinese_q06","pk":"108_chinese","ans":"D"},{"id":"108-chinese-7","y":"108","n":7,"img":"108_chinese_q07","pk":"108_chinese","ans":"A","exp":"(A)「峭」讀ㄑㄧㄠˋ，春寒料峭是形容微寒。(B)「湛」讀ㄓㄢˋ；(C)「霾」讀ㄇㄞˊ；(D)「胼手胝足」的「胝」讀ㄓ。"},{"id":"108-chinese-8","y":"108","n":8,"img":"108_chinese_q08","pk":"108_chinese","ans":"C"},{"id":"108-chinese-9","y":"108","n":9,"img":"108_chinese_q09","pk":"108_chinese","ans":"B"},{"id":"108-chinese-10","y":"108","n":10,"img":"108_chinese_q10","pk":"108_chinese","ans":"A","exp":"(A)「遒勁」「力透紙背」都是形容書法有力，用法正確。(B)「宵衣旰食」指帝王勤於政事，不是怕餘震；(C)「吃軟不吃硬」是形容人的態度，不是飲食；(D)「萬頭攢動」是人多熱鬧，與「捉襟見肘」的窮困矛盾。"},{"id":"108-chinese-11","y":"108","n":11,"img":"108_chinese_q11","pk":"108_chinese","ans":"A","exp":"依據句中的理由判斷：「不苟且」是對待自己的態度；「不霸道」是對待別人；「不掠奪」是對待自然資源。所以依序是自己、別人、自然。"},{"id":"108-chinese-12","y":"108","n":12,"img":"108_chinese_q12","pk":"108_chinese","ans":"D","exp":"題目問兩族「都」有的特色。(D)文中說巴提族體型瘦小、耐力驚人，讓人聯想到雪巴族，所以兩族皆有。(A)(B)只有巴提族；(C)文中說這點與雪巴人「迥異」。"},{"id":"108-chinese-13","y":"108","n":13,"img":"108_chinese_q13","pk":"108_chinese","ans":"C"},{"id":"108-chinese-14","y":"108","n":14,"img":"108_chinese_q14","pk":"108_chinese","ans":"B","exp":"作家批評的是：小說人物像「面貌模糊的人」，在「空曠的地方」對話，千篇一律。可推出(A)手法單調、(C)人物缺乏特色、(D)缺少場景描寫；文中完全沒提到第一人稱，所以(B)不在批評之內。"},{"id":"108-chinese-15","y":"108","n":15,"img":"108_chinese_q15","pk":"108_chinese","ans":"C","exp":"這段話是說向不同的人學習優點。(C)「三人行，必有我師焉」是選擇別人的優點學習，最相近。(A)講學習的快樂；(B)講觀察過錯而知仁；(D)講君子的修養與改過，都不是向各種人學習。"},{"id":"108-chinese-16","y":"108","n":16,"img":"108_chinese_q16","pk":"108_chinese","ans":"C","exp":"(C)「擅長」與「能言善道」意思重複，應刪其一。其他選項都沒有贅字。"},{"id":"108-chinese-17","y":"108","n":17,"img":"108_chinese_q17","pk":"108_chinese","ans":"D","exp":"上聯「若不撇開終是苦」：「若」去掉撇（草字頭下的一撇）變成「苦」；下聯「各能捻住即成名」：「各」捻住（收住）下面的捺變成「名」。所以是從字形差異發想。(C)末字「苦」「名」平仄不是刻意不合；(A)(B)都不是對聯本意。"},{"id":"108-chinese-18","y":"108","n":18,"img":"108_chinese_q18","pk":"108_chinese","ans":"B","exp":"九秩晉二是九十二歲的壽辰，應稱「壽誕」；「聖誕」是用於聖人或神明的誕辰。(A)「家嚴」是對人稱自己的父親，用法正確；(C)(D)也都沒錯。"},{"id":"108-chinese-19","y":"108","n":19,"img":"108_chinese_q19","pk":"108_chinese","ans":"A","exp":"這段話依序說：初學求平正、再求險絕、最後回歸平正，說明學書法不同階段與進境。(B)(C)(D)文中都沒有提到。"},{"id":"108-chinese-20","y":"108","n":20,"img":"108_chinese_q20","pk":"108_chinese","ans":"C"},{"id":"108-chinese-21","y":"108","n":21,"img":"108_chinese_q21","pk":"108_chinese","ans":"A","exp":"(A)兩個「微」都是卑賤、低微。(B)前者「悉」是知道，後者是全部；(C)前者「修」是長，後者是整治；(D)前者「窮」是追究到底，後者是貧困。"},{"id":"108-chinese-22","y":"108","n":22,"img":"108_chinese_q22","pk":"108_chinese","ans":"B","exp":"作者舉諸葛亮文辭不華麗卻動人，六朝文人雕飾卻無可傳，結論「文之為文，豈必多且麗」，主張寫作重在抒發情志、感動人心。(A)文采不是作者所講的重點；(C)(D)只是舉例，不是主旨，且(D)與「文采不艷」矛盾。"},{"id":"108-chinese-23","y":"108","n":23,"img":"108_chinese_q23","pk":"108_chinese","ans":"A","exp":"徐鉉說「所乏者知章爾」，意思是皇上尊賢待士，唯一缺的是像賀知章那樣的人，也就是暗指馮謐的才能不如賀知章，所以馮謐才有愧色。(B)(C)(D)文中都沒有這些意思。"},{"id":"108-chinese-24","y":"108","n":24,"img":"108_chinese_q24","pk":"108_chinese","ans":"B"},{"id":"108-chinese-25","y":"108","n":25,"img":"108_chinese_q25","pk":"108_chinese","ans":"B","exp":"(B)「越俎代庖」指超出本分、管別人的事，用法正確。(A)「櫛風沐雨」是形容奔波辛勞，不是氣度雍容；(C)「肝腸寸斷」是極度悲傷，與雄渾的演奏不合；(D)「笨鳥先飛」是自知能力差而先努力，與搶先機的貪利不合。"},{"id":"108-chinese-26","y":"108","n":26,"img":"108_chinese_q26","pk":"108_chinese","ans":"C","exp":"工筆畫宜用熟紙，而文中那位「以口吹毫」讓水墨滲暈的人，是要生紙的滲化效果，不是在畫工筆畫，所以(C)推論錯誤。(A)正楷書宜熟紙；(B)徐青藤的畫水渲墨暈，像用生紙；(D)生紙易滲水，控制水分較困難，都正確。"},{"id":"108-chinese-27","y":"108","n":27,"img":"108_chinese_q27","pk":"108_chinese","ans":"C","exp":"壯馳茲說「國家將興，君子自以為不足」，趙簡子主動問「小人」又求賢人，表示他謙虛、禮賢下士，所以得到祝賀。(A)(B)(D)文中都沒有這些說法。"},{"id":"108-chinese-28","y":"108","n":28,"img":"108_chinese_q28","pk":"108_chinese","ans":"D","exp":"「問人之寒則衣之，問人之饑則食之，稱人之美則爵之」，是不只口頭稱讚，而是給衣、給食、給官位，也就是具體實惠的行動。(C)「無微不至」文中沒有；(B)(A)不是重點。"},{"id":"108-chinese-29","y":"108","n":29,"img":"108_chinese_q29","pk":"108_chinese","ans":"C","exp":"「其除之」是說：（這條法令）應該除去。前文說「今法有誹謗妖言之罪」使臣子不敢進言，所以「之」指的是誹謗妖言之罪。"},{"id":"108-chinese-30","y":"108","n":30,"img":"108_chinese_q30","pk":"108_chinese","ans":"C","exp":"文中說學者校書時，把「酸餡」寫成「餕餡」，是因為不瞭解宋朝飲食，所以(D)正確。(A)只說佛教使吃素流行，並未說包子隨佛教傳入；(B)「酸餡」是名稱，並非味道酸；(C)原指雪裡紅包子，後來泛指素包子，並非最受歡迎。"},{"id":"108-chinese-31","y":"108","n":31,"img":"108_chinese_q31","pk":"108_chinese","ans":"A","exp":"作者提到漂母、洗衣婦、漁父，都是平凡的小人物，說《史記》寫出了主流價值之外的另一種信仰，所以是呈現市井小民的意義。(C)「襯托主角」把小人物當配角，不合作者讚賞的心情；(D)作者肯定大智若愚的隱者，並非顛覆。"},{"id":"108-chinese-32","y":"108","n":32,"img":"108_chinese_q32","pk":"108_chinese","ans":"B","exp":"東坡說歐公學古人詩句只是「鳳凰一毛」，歐公的才華像天上的雲，卻喜歡古人小句，好比放著八珍不吃卻愛螺蛤，讚美他謙沖為懷、才華遠勝古人。(C)與東坡所說相反；(A)(D)文中沒有。"},{"id":"108-chinese-33","y":"108","n":33,"img":"108_chinese_q33","pk":"108_chinese","ans":"D","exp":"前面說有方法就像順流行船，所以空格要接「省力卻能走得遠」的意思。(D)「體不勞而致遠」正好呼應。(A)「心不知其所往」是迷惘，與順流相反。"},{"id":"108-chinese-34","y":"108","n":34,"img":"108_chinese_q34","pk":"108_chinese","ans":"D","exp":"文中說「長者屈而短之，大者削而約之」，所以(D)正確。(A)王鏊只是記載，並非始創，盆景始於漢、唐；(B)「些子景」是元人的說法，劉鑾只是引述；(C)姑蘇人既擅長園林也以盆景聞名。"},{"id":"108-chinese-35","y":"108","n":35,"img":"108_chinese_q35","pk":"108_chinese","ans":"A","pimg":"108_chinese_p35","grp":"108-chinese-35～36","exp":"(A)范德之說沒經歷過人生苦難不配寫小說，又最痛恨小孩喧鬧，所以他把喧鬧視為苦難。(B)蘇軾那句是別人想法子讓吵鬧小孩安靜，不是蘇軾喜歡小孩；(C)卡羅喜愛小孩；(D)兩人對小孩看法相反。"},{"id":"108-chinese-36","y":"108","n":36,"img":"108_chinese_q36","pk":"108_chinese","ans":"A","pimg":"108_chinese_p35","grp":"108-chinese-35～36","exp":"末段說識得孩子的真相，不管最可愛的還是最不可愛的。(甲)說純美表相下隱藏善或惡的可能，正是同時涵蓋「可愛」與「不可愛」兩面。(乙)寫小孩吵鬧自古就有；(丙)(丁)分別只寫喜歡或厭惡的一面。"},{"id":"108-chinese-37","y":"108","n":37,"img":"108_chinese_q37","pk":"108_chinese","ans":"C","pimg":"108_chinese_p37","grp":"108-chinese-37～38","exp":"(C)文中說臺灣遠洋漁船開發漁場後漁獲暴增，所以價格變便宜。(A)無硬刺只是讓獵食者受點苦頭，適合當魚餌是因為肥、腥、躁；(B)只說「曾被以為」，並非事實；(D)名貴是因為從日本進口、量少，不是因為腥躁。"},{"id":"108-chinese-38","y":"108","n":38,"img":"108_chinese_q38","pk":"108_chinese","ans":"B","pimg":"108_chinese_p37","grp":"108-chinese-37～38","exp":"(B)作者拿過去的名貴與現在的便宜對比，說明價格變化。(A)並沒有細筆刻畫外型；(C)羔羊群只是比喻遇襲時只會逃、沒別的本領；(D)重點是讓熱帶水域的獵食者也吃得起，不是凸顯魚價廉。"},{"id":"108-chinese-39","y":"108","n":39,"img":"108_chinese_q39","pk":"108_chinese","ans":"A","pimg":"108_chinese_p39","grp":"108-chinese-39～40","exp":"(A)錯誤。末代感傷、繁華夢醒是晚明文人小品的特色，文中說《徐霞客遊記》「很不一樣」，記錄的是人文風俗、地質景觀等，所以不屬於這種感傷。"},{"id":"108-chinese-40","y":"108","n":40,"img":"108_chinese_q40","pk":"108_chinese","ans":"D","pimg":"108_chinese_p39","grp":"108-chinese-39～40","exp":"豁達是看得開、不執著。(D)「吾荷一鍤來，何處不可埋吾骨耶」是說死在哪裡都可以，看破生死，最能顯出豁達。(A)(B)(C)是堅毅與探險精神。"},{"id":"108-chinese-41","y":"108","n":41,"img":"108_chinese_q41","pk":"108_chinese","ans":"B","pimg":"108_chinese_p41","grp":"108-chinese-41～42","exp":"(B)錯誤。文中說是引擎推動使飛機產生前進速度，機翼才因此產生升力，順序與選項相反。(A)(C)(D)文中都有提到，(C)是370加上少的約20公噸為約390公噸。"},{"id":"108-chinese-42","y":"108","n":42,"img":"108_chinese_q42","pk":"108_chinese","ans":"D","pimg":"108_chinese_p41","grp":"108-chinese-41～42","exp":"依文章，順風、氣溫高、海拔高都需要較長的跑道。所以最短的是平原、氣溫低（15度）、逆風的機場。"},{"id":"108-chinese-43","y":"108","n":43,"img":"108_chinese_q43","pk":"108_chinese","ans":"B","pimg":"108_chinese_p43","grp":"108-chinese-43～44","exp":"詩中說這處是躲過開發計畫、幸而留存的保安林，白翅鷺群飛的景象不易見，作者「不敢太靠近，更不敢向人張揚」，怕賞鳥人潮嚇到牠們，所以視為祕密。(A)作者並非只為獨享；(C)(D)詩中沒有這樣的說明。"},{"id":"108-chinese-44","y":"108","n":44,"img":"108_chinese_q44","pk":"108_chinese","ans":"D","pimg":"108_chinese_p43","grp":"108-chinese-43～44","exp":"(D)錯誤。「迢遙的記憶」是說童年時白翅鷺在水田溝邊是尋常景象，如今要開車探訪；但這次作者也在海邊村落親眼看到白翅鷺，並非只存在童年。"},{"id":"108-chinese-45","y":"108","n":45,"img":"108_chinese_q45","pk":"108_chinese","ans":"C","pimg":"108_chinese_p45","grp":"108-chinese-45～46"},{"id":"108-chinese-46","y":"108","n":46,"img":"108_chinese_q46","pk":"108_chinese","ans":"B","pimg":"108_chinese_p45","grp":"108-chinese-45～46","exp":"全詩寫戰亂中百姓被兵禍、官吏逼迫，過得艱難，結尾「人生值艱難，不如路傍草」，是感嘆野草遇火尚能復生，人在亂世反而難以生存。(A)(C)(D)都與詩意不合。"},{"id":"108-chinese-47","y":"108","n":47,"img":"108_chinese_q47","pk":"108_chinese","ans":"A","pimg":"108_chinese_p47","grp":"108-chinese-47～48","exp":"甲篇說司馬昭專權，賈充、成濟為他殺了皇帝，可見賈充是司馬昭的人。(B)陳泰是被舅舅荀顗叫來；(C)兩人是為皇帝遇害而對泣；(D)文中是陳泰被子弟逼迫才入宮。"},{"id":"108-chinese-48","y":"108","n":48,"img":"108_chinese_q48","pk":"108_chinese","ans":"B","pimg":"108_chinese_p47","grp":"108-chinese-47～48","exp":"甲篇陳泰說「獨有斬賈充，少可以謝天下」，昭問更想其次，他答只能這樣，不知其次。所以「但見其上，未見其下」是說除了殺賈充這最基本的處置之外，別無更輕的辦法。"},{"id":"109-chinese-1","y":"109","n":1,"img":"109_chinese_q01","pk":"109_chinese","ans":"B"},{"id":"109-chinese-2","y":"109","n":2,"img":"109_chinese_q02","pk":"109_chinese","ans":"D"},{"id":"109-chinese-3","y":"109","n":3,"img":"109_chinese_q03","pk":"109_chinese","ans":"D","exp":"空格前面說跑得慢的有人抱怨、有人堅持到終點，跑得快的有人後繼無力、有人中途放棄，所以結論是能堅持到底的人才是贏家。(A)「暗潮洶湧」文中沒提；(B)只談努力的成果，沒回應跑得慢的人；(C)「勝敗由天定」和文中強調努力的態度相反。"},{"id":"109-chinese-4","y":"109","n":4,"img":"109_chinese_q04","pk":"109_chinese","ans":"A"},{"id":"109-chinese-5","y":"109","n":5,"img":"109_chinese_q05","pk":"109_chinese","ans":"D","exp":"小畢主張別人丟石頭不要丟回去，而要把它當成建高樓的基石，也就是忍耐並向上努力；小安說「與其以牙還牙，不如隱忍奮進」，看法最接近。(A)小畢談的是忍讓，不是善惡有報；(B)阿文說「我看你也被他丟死了」，是悲觀的；(C)凱哥說高樓和墓地的建材一樣，是不同意小畢。"},{"id":"109-chinese-6","y":"109","n":6,"img":"109_chinese_q06","pk":"109_chinese","ans":"B","exp":"「不免」是「免不了」，用在見到故居破敗而傷感，語意通順。(A)酒後不開車是對的，不應說「未免」，要改成「以免」；(C)「未免」才是「實在有些」的意思；(D)改正毛病和受處罰前後語意不合。"},{"id":"109-chinese-7","y":"109","n":7,"img":"109_chinese_q07","pk":"109_chinese","ans":"B","exp":"文中說面向房門的座位最尊貴，由長輩老蘇坐，所以老蘇坐在正對房門的上方。老蘇面向房門，他的左手邊是主人位，右手邊是客人位，因此主人大蘇坐圖的右側、客人小秦坐圖的左側，小蘇坐對面的副陪位。"},{"id":"109-chinese-8","y":"109","n":8,"img":"109_chinese_q08","pk":"109_chinese","ans":"B"},{"id":"109-chinese-9","y":"109","n":9,"img":"109_chinese_q09","pk":"109_chinese","ans":"C","exp":"第一格前面是「一個問題」，後面接問句內容，要用冒號「：」引出；第二格是「共振」後面接「閉上眼睛也能……」，句子還沒結束，用逗號；第三格在「我不能放棄兩者」之後接「也不願被兩者放棄」，是同一句的並列，也用逗號。(A)(D)的句號會讓句子被截斷。"},{"id":"109-chinese-10","y":"109","n":10,"img":"109_chinese_q10","pk":"109_chinese","ans":"A","exp":"「不得有誤」的「得」是「可以、能夠」的意思，「不得」就是「不可以」。「得過且過」是「能過就過」，「得」也是「能」。(B)「相得」是相合；(C)「得失」是獲得；(D)「自得」是自己感到滿足。"},{"id":"109-chinese-11","y":"109","n":11,"img":"109_chinese_q11","pk":"109_chinese","ans":"D","exp":"詩中描寫冬天太陽照在屋角，坐著曬太陽，身體暖和，心中什麼雜念都沒有，表現悠閒自得。(A)這首詩不是押一韻到底的律詩；(B)「如飲醇醪」是用喝酒來比喻曬太陽的溫暖舒服，不是昏昏欲睡；(C)詩中是獨坐，沒有歡聚。"},{"id":"109-chinese-12","y":"109","n":12,"img":"109_chinese_q12","pk":"109_chinese","ans":"C","exp":"文中說張贊桃的燈光輕聲細語、典雅寫意，像呼吸般起落，成為雲門的特色，可知燈光恰到好處地襯托演出。(A)林布蘭是拿來形容燈光的比喻；(B)文中說臺灣舞評很少提燈光；(D)「國外談雲門不讚美你的舞評極少」是雙重否定，意思是國外多半有讚美。"},{"id":"109-chinese-13","y":"109","n":13,"img":"109_chinese_q13","pk":"109_chinese","ans":"C","exp":"文中把讀千本書比作犁千片田，把評論畫作比作找出摩托車毛病，意思是腦力工作的價值並不高過勞力工作，兩者價值相當，所以是勞力者不遜於勞心者。(A)(D)都在貶低其中一方，不符合文意。"},{"id":"109-chinese-14","y":"109","n":14,"img":"109_chinese_q14","pk":"109_chinese","ans":"C","exp":"文中說個資法規定須經當事人同意才能蒐集處理，而且只能用於特定目的，所以業者在這兩個條件下可以合法處理個資。(A)使用者是為了使用服務，不是為了讓業者蒐集；(B)文中沒提安全機制；(D)不同意就不能使用服務是業者的做法，不是法律規定。"},{"id":"109-chinese-15","y":"109","n":15,"img":"109_chinese_q15","pk":"109_chinese","ans":"A","exp":"囤積者承受失落與喪慟，卻靠囤積讓自己以為什麼都沒失去，表示他們無法面對的是與所愛之物的分離。(B)(C)(D)都無法呼應「失落、喪慟、以為沒失去」的脈絡。"},{"id":"109-chinese-16","y":"109","n":16,"img":"109_chinese_q16","pk":"109_chinese","ans":"A","exp":"葛清刺的是白居易的詩，所以刺青內容取自白詩。(B)是陳至稱讚他像「白舍人行詩圖」，不是獲贈；(C)是陳至叫他觀看、請他解說，不是主動展示；(D)文中說自頸以下全身都刺，不只背部。"},{"id":"109-chinese-17","y":"109","n":17,"img":"109_chinese_q17","pk":"109_chinese","ans":"A","exp":"「困」是木在囗中，是把意思組合起來的會意字。「安」是屋子(宀)裡有女人，同樣是會意字。(B)寄、(C)宥、(D)宇都是一邊表意、一邊表聲的形聲字，不是用同樣原理造出來的。"},{"id":"109-chinese-18","y":"109","n":18,"img":"109_chinese_q18","pk":"109_chinese","ans":"B"},{"id":"109-chinese-19","y":"109","n":19,"img":"109_chinese_q19","pk":"109_chinese","ans":"B"},{"id":"109-chinese-20","y":"109","n":20,"img":"109_chinese_q20","pk":"109_chinese","ans":"B","exp":"「囿」讀ㄧㄡˋ，「囿於成見」是被限制住的意思。(A)「慨」應讀ㄎㄞˇ；(C)「緝」應讀ㄑㄧˋ；(D)「糙」應讀ㄘㄠ。"},{"id":"109-chinese-21","y":"109","n":21,"img":"109_chinese_q21","pk":"109_chinese","ans":"C","exp":"李太太稱讚王爺爺的兒子「賢喬梓」，兒子謙虛地回答「託您的福」，用語得體。(A)今天壽星是王爺爺，「令堂」是稱對方母親，不妥；(B)王爺爺在自己家，不能說「光臨貴府」，且長輩不該稱晚輩「小張」去歡迎；(D)「內人」是稱自己的妻子，不能用在王奶奶身上。"},{"id":"109-chinese-22","y":"109","n":22,"img":"109_chinese_q22","pk":"109_chinese","ans":"D","exp":"鳩摩羅什說把梵文改成漢文，會失去原有的華美文采，就像把嚼過的飯餵給人，所以要保留原文形式的美並不容易。(A)文中沒有修改內容的主張；(B)音律是梵文的特色，不是他認為的首要關鍵；(C)他反而惋惜失去辭藻之美。"},{"id":"109-chinese-23","y":"109","n":23,"img":"109_chinese_q23","pk":"109_chinese","ans":"D","exp":"詩評說「千古萬古」都是無窮的意思，但後面用了「一」字，一下子就把範圍限制住了，影響了詩句的意境。(A)(B)(C)詩評都沒有這樣稱讚或批評。"},{"id":"109-chinese-24","y":"109","n":24,"img":"109_chinese_q24","pk":"109_chinese","ans":"A"},{"id":"109-chinese-25","y":"109","n":25,"img":"109_chinese_q25","pk":"109_chinese","ans":"C","exp":"主人怕採龍眼的工人偷吃，約定要他們一直唱歌，歌聲停了就沒工錢，這樣就能知道工人有沒有偷吃，所以「唱龍眼」源自主人防弊。(A)主人是找「慣手」，也就是有經驗的人；(B)不唱歌是沒有工資，不是不會唱；(D)「偶偶」是低語聲，並非彼此唱和。"},{"id":"109-chinese-26","y":"109","n":26,"img":"109_chinese_q26","pk":"109_chinese","ans":"C","exp":"「解民倒懸」是解除百姓的痛苦，用來形容振興經濟恰當。(A)應是「越雷池一步」；(B)「小家碧玉」形容小戶人家的秀氣女孩，與豪邁直爽相反；(D)成語應為「剛柔並濟」，不是「剛烈並濟」。"},{"id":"109-chinese-27","y":"109","n":27,"img":"109_chinese_q27","pk":"109_chinese","ans":"B","exp":"詩句「計拙無衣食，途窮仗友生」是說自己沒辦法，只好靠朋友幫忙，所以不是親友疏離、借貸無門。(A)無衣食是經濟拮据；(C)「客睡何曾著」是夜裡睡不著；(D)「老妻書數紙」是妻子寫信，兩地相思。"},{"id":"109-chinese-28","y":"109","n":28,"img":"109_chinese_q28","pk":"109_chinese","ans":"D"},{"id":"109-chinese-29","y":"109","n":29,"img":"109_chinese_q29","pk":"109_chinese","ans":"D","exp":"「魚游沸鼎」是魚在滾水的鍋裡游，比喻處境非常危險，用來形容房子地基被掏空很恰當。(A)「舉案齊眉」是夫妻相敬如賓；(B)「浮雲蔽日」比喻小人蒙蔽賢者，不是隱居；(C)「以鄰為壑」是把禍害推給別人，和守望相助相反。"},{"id":"109-chinese-30","y":"109","n":30,"img":"109_chinese_q30","pk":"109_chinese","ans":"B","exp":"文中說陳子燦到河南，在宋將軍家遇見大鐵椎，所以兩人是在宋府相遇。(A)文中沒說兩人有親戚關係；(C)「宋將軍」是人們對雄健的宋所稱的名號，並不是大鐵椎的別名；(D)文中沒說大鐵椎向陳子燦學藝。"},{"id":"109-chinese-31","y":"109","n":31,"img":"109_chinese_q31","pk":"109_chinese","ans":"A","exp":"(A)「叫好不叫座」、「寥寥可數」用字都正確。(D)「迴境」應寫成「逆境」，這是常見的錯字。"},{"id":"109-chinese-32","y":"109","n":32,"img":"109_chinese_q32","pk":"109_chinese","ans":"D","exp":"文中說烏蒂不去除會損害茶色，所以烏蒂會影響泡出來的顏色。(A)是黎明採茶，見太陽出來就停止；(B)茶工自備新汲的水，是為了把採下的芽泡著保持新鮮，不是試茶；(C)文中的最上品是像雀舌、穀粒的鬥品，一槍一旗只算揀芽。"},{"id":"109-chinese-33","y":"109","n":33,"img":"109_chinese_q33","pk":"109_chinese","ans":"D","exp":"文中這個人用釜灶杵臼等東西，加一點藥就鍛成銀，可知他擁有能把物品變成銀的特殊藥物。(A)他罵道士是因為聚眾造妖，不是搶信徒；(B)聽了道士說明後「怒少解」，是氣消了一些；(C)文中沒有被收買的情節。"},{"id":"109-chinese-34","y":"109","n":34,"img":"109_chinese_q34","pk":"109_chinese","ans":"A"},{"id":"109-chinese-35","y":"109","n":35,"img":"109_chinese_q35","pk":"109_chinese","ans":"B","pimg":"109_chinese_p35","grp":"109-chinese-35～36"},{"id":"109-chinese-36","y":"109","n":36,"img":"109_chinese_q36","pk":"109_chinese","ans":"B","pimg":"109_chinese_p35","grp":"109-chinese-35～36","exp":"表中「誤導」是資訊被錯誤使用而形塑某個事件的樣貌；臺灣媒體忽略並美化海豹的騷擾行為，還捏造原文沒有的事實，使報導樣貌失真。(A)新聞不是為了諷刺趣味；(C)「刻意操弄」需要有政治或經濟目的，文中沒有；(D)不是擷取某句話放大檢視。"},{"id":"109-chinese-37","y":"109","n":37,"img":"109_chinese_q37","pk":"109_chinese","ans":"D","pimg":"109_chinese_p37","grp":"109-chinese-37～38"},{"id":"109-chinese-38","y":"109","n":38,"img":"109_chinese_q38","pk":"109_chinese","ans":"C","pimg":"109_chinese_p37","grp":"109-chinese-37～38"},{"id":"109-chinese-39","y":"109","n":39,"img":"109_chinese_q39","pk":"109_chinese","ans":"B","pimg":"109_chinese_p39","grp":"109-chinese-39～40"},{"id":"109-chinese-40","y":"109","n":40,"img":"109_chinese_q40","pk":"109_chinese","ans":"A","pimg":"109_chinese_p39","grp":"109-chinese-39～40"},{"id":"109-chinese-41","y":"109","n":41,"img":"109_chinese_q41","pk":"109_chinese","ans":"C","pimg":"109_chinese_p41","grp":"109-chinese-41～42","exp":"文中前面說不擔心電腦像人一樣思考，擔憂的是人像電腦那樣思考，而且下一段強調科技要與人文、人性結合，所以空格是指沒有同理心和價值觀、不計後果。(A)(B)是正面的描述，(D)「無法更新」文中沒有談到。"},{"id":"109-chinese-42","y":"109","n":42,"img":"109_chinese_q42","pk":"109_chinese","ans":"A","pimg":"109_chinese_p41","grp":"109-chinese-41～42"},{"id":"109-chinese-43","y":"109","n":43,"img":"109_chinese_q43","pk":"109_chinese","ans":"C","pimg":"109_chinese_p43","grp":"109-chinese-43～44"},{"id":"109-chinese-44","y":"109","n":44,"img":"109_chinese_q44","pk":"109_chinese","ans":"A","pimg":"109_chinese_p43","grp":"109-chinese-43～44","exp":"題幹的「地氈」比喻滿地的熊果，是把甲說成乙的譬喻。甲段把湖岸比喻成「一條黑色緞帶」，用的是相同手法。(丁)「雁向玉米田打招呼」是把雁當人來寫，屬於擬人。"},{"id":"109-chinese-45","y":"109","n":45,"img":"109_chinese_q45","pk":"109_chinese","ans":"B","pimg":"109_chinese_p45","grp":"109-chinese-45～46","exp":"「稚子數請所出」的「請」是詢問，「所出」是來源，意思是小孩多次詢問「更衣」這個名稱從哪裡來，所以才抄錄《漢書》的話給他看。(C)(D)把「請」誤當成邀請，與後文引用文獻解釋的情節不合。"},{"id":"109-chinese-46","y":"109","n":46,"img":"109_chinese_q46","pk":"109_chinese","ans":"D","pimg":"109_chinese_p45","grp":"109-chinese-45～46"},{"id":"109-chinese-47","y":"109","n":47,"img":"109_chinese_q47","pk":"109_chinese","ans":"C","pimg":"109_chinese_p47","grp":"109-chinese-47～48","exp":"「主然而違者，替之」的意思是君主所接近的人若與正道相違，就替換掉他，所以「替」是替換、改變的意思。(A)「孰」是「誰」，不是難道；(B)「俱」是在一起；(D)「接」是接觸、引導，不是招待。"},{"id":"109-chinese-48","y":"109","n":48,"img":"109_chinese_q48","pk":"109_chinese","ans":"D","pimg":"109_chinese_p47","grp":"109-chinese-47～48","exp":"文章一開頭就說治亂的根本在君主的好惡，而好惡又來自所習染的人事，所以君主所習染的關係到天下治亂。(B)文中是大臣要去磨君主的習性，不是大臣被磨練；(A)(C)文章沒有這樣的主張。"},{"id":"110-chinese-1","y":"110","n":1,"img":"110_chinese_q01","pk":"110_chinese","ans":"A"},{"id":"110-chinese-2","y":"110","n":2,"img":"110_chinese_q02","pk":"110_chinese","ans":"D"},{"id":"110-chinese-3","y":"110","n":3,"img":"110_chinese_q03","pk":"110_chinese","ans":"C"},{"id":"110-chinese-4","y":"110","n":4,"img":"110_chinese_q04","pk":"110_chinese","ans":"B"},{"id":"110-chinese-5","y":"110","n":5,"img":"110_chinese_q05","pk":"110_chinese","ans":"C","exp":"山田汽車1916年成立，100週年是2016年。賀詞說「100年來的競爭」，表示兩家競爭了100年，所以高橋汽車在山田成立之前就存在；又說「沒有你的那30年」孤獨，代表高橋比山田早30年，1916－30＝1886。(A)(B)太早，(D)1946比山田還晚，都不合。"},{"id":"110-chinese-6","y":"110","n":6,"img":"110_chinese_q06","pk":"110_chinese","ans":"A"},{"id":"110-chinese-7","y":"110","n":7,"img":"110_chinese_q07","pk":"110_chinese","ans":"A"},{"id":"110-chinese-8","y":"110","n":8,"img":"110_chinese_q08","pk":"110_chinese","ans":"D"},{"id":"110-chinese-9","y":"110","n":9,"img":"110_chinese_q09","pk":"110_chinese","ans":"D","exp":"末兩句「獨夜憶秦關，聽鐘未眠客」寫旅人因思鄉而睡不著。(A)首兩句寫的是自己停舟靠岸，不是餞別友人；(B)「風起」「日沉」是描寫景色，不是自喻懷才不遇；(C)「雁下蘆洲白」寫的是傍晚景象，不是日出。"},{"id":"110-chinese-10","y":"110","n":10,"img":"110_chinese_q10","pk":"110_chinese","ans":"B"},{"id":"110-chinese-11","y":"110","n":11,"img":"110_chinese_q11","pk":"110_chinese","ans":"B"},{"id":"110-chinese-12","y":"110","n":12,"img":"110_chinese_q12","pk":"110_chinese","ans":"B"},{"id":"110-chinese-13","y":"110","n":13,"img":"110_chinese_q13","pk":"110_chinese","ans":"A"},{"id":"110-chinese-14","y":"110","n":14,"img":"110_chinese_q14","pk":"110_chinese","ans":"B","exp":"短文提到三個干擾：同音異字、中外文混用、次文化用語。(A)「勢利」和「視力」、(C)「班導」和「扳倒」都是同音異字；(D)「Facebook」和「非死不可」是外語音譯成中文。(B)「床」和「船」讀音不同，不屬於同音，所以沒被提到。"},{"id":"110-chinese-15","y":"110","n":15,"img":"110_chinese_q15","pk":"110_chinese","ans":"C","exp":"「風馬牛不相及」指兩件事毫無關聯，用來說明把不相干的事混為一談很恰當。(A)「兩害相權取其輕」是兩種壞選擇取較小的，和「都很優秀」矛盾；(B)「雨後春筍」形容事物快速大量出現，不是形容幸運；(D)占上風後怕的是由好轉壞，不能用「轉悲為喜」。"},{"id":"110-chinese-16","y":"110","n":16,"img":"110_chinese_q16","pk":"110_chinese","ans":"B","exp":"要找錯誤的敘述。國小新住民子女人數在93到102學年上升，但105學年比102學年少，並不是「漸趨上升」，所以(B)錯誤。(A)三組總和由約280萬降到約200萬，確實下降；(C)國中新住民子女長條逐年變長，占比上升；(D)非新住民子女占比逐漸下降，兩者都合圖表。"},{"id":"110-chinese-17","y":"110","n":17,"img":"110_chinese_q17","pk":"110_chinese","ans":"A","exp":"「姚黃魏紫」是牡丹的名貴品種，所以(A)正確。(B)文中說洛陽不分貴賤都插花，不限權貴；(C)只是用蠟封住花的蒂（花梗接枝處），不是整株；(D)菜葉是用來包覆、鋪墊，防止花在竹籠中晃動，不是提供養分。"},{"id":"110-chinese-18","y":"110","n":18,"img":"110_chinese_q18","pk":"110_chinese","ans":"D"},{"id":"110-chinese-19","y":"110","n":19,"img":"110_chinese_q19","pk":"110_chinese","ans":"C","exp":"空格後面說「所以我們寧願放掉功課選擇看漫畫、滑手機，因後者帶來的快樂往往是立即的」，可知空格的前提是：等待報酬的時間越短，越有動力，這樣才能推出人們偏愛立即的快樂。(A)(B)(D)都不能導出「寧願放掉功課」的結論。"},{"id":"110-chinese-20","y":"110","n":20,"img":"110_chinese_q20","pk":"110_chinese","ans":"D"},{"id":"110-chinese-21","y":"110","n":21,"img":"110_chinese_q21","pk":"110_chinese","ans":"B","exp":"「曾幾何時」表示時間才過沒多久，用來感嘆家鄉景物變化很快，使用恰當。(A)「前倨後恭」是先傲慢後恭敬，與「謙和有禮」矛盾；(C)「先入為主」指先接受的觀念影響判斷，不是先到先搶座位；(D)「汗牛充棟」形容藏書很多，不能形容教室悶臭。"},{"id":"110-chinese-22","y":"110","n":22,"img":"110_chinese_q22","pk":"110_chinese","ans":"D"},{"id":"110-chinese-23","y":"110","n":23,"img":"110_chinese_q23","pk":"110_chinese","ans":"A"},{"id":"110-chinese-24","y":"110","n":24,"img":"110_chinese_q24","pk":"110_chinese","ans":"D"},{"id":"110-chinese-25","y":"110","n":25,"img":"110_chinese_q25","pk":"110_chinese","ans":"B","exp":"上片首二句「千丈懸崖削翠，一川落日鎔金」、下片首二句「魚肥堪膾，前村酒美重斟」都對仗，所以(B)正確。(A)「西江月」是詞牌，「江行采石岸，戲作漁夫詞」才是副題；(C)上片先寫景後抒情，下片先寫景後抒情的說法不對；(D)結尾「閒管興亡則甚」是不想管興亡，不是以天下為己任。"},{"id":"110-chinese-26","y":"110","n":26,"img":"110_chinese_q26","pk":"110_chinese","ans":"C","exp":"題目問的是「最不恰當」。武昌知府說「再會奉承也沒有用」，其實是在巧妙地奉承彭公，所以說他不會逢迎公正之人是錯的。(A)彭公自認不愛被奉承，符合故事；(B)彭公被拍了馬屁還得意，符合故事；(D)知府一句話就拍到馬屁，可見能力極佳。"},{"id":"110-chinese-27","y":"110","n":27,"img":"110_chinese_q27","pk":"110_chinese","ans":"A"},{"id":"110-chinese-28","y":"110","n":28,"img":"110_chinese_q28","pk":"110_chinese","ans":"B","exp":"淳于恭看見有人偷割他的禾，因為想到對方會慚愧，所以躲在草中等人離開，可見他體恤、寬容他人。(D)慚愧的是小偷，不是淳于恭；(A)(C)文中都沒有提到荒年或盜賊兇悍。"},{"id":"110-chinese-29","y":"110","n":29,"img":"110_chinese_q29","pk":"110_chinese","ans":"D","exp":"文章說名山要有名士才能顯出特色，又說「有其地而非其人，有其人而非其地」都不足以盡遊觀之樂，也就是景致和懂得欣賞的人兩者都要具備，所以(D)最接近。(C)只強調名士，忽略景致；(A)(B)談的是心境或療癒，不是這段重點。"},{"id":"110-chinese-30","y":"110","n":30,"img":"110_chinese_q30","pk":"110_chinese","ans":"C"},{"id":"110-chinese-31","y":"110","n":31,"img":"110_chinese_q31","pk":"110_chinese","ans":"D","exp":"文章以豐年與旱歲為喻：平時受恩不覺得，遇到一時的救助才感恩，卻忽略長久的深恩。(D)對外人一時之助感謝，卻忽略父母深恩，正好呼應。(A)(B)(C)談的是順其自然、磨練心志、幫助農民，和「忽略長久恩惠」無關。"},{"id":"110-chinese-32","y":"110","n":32,"img":"110_chinese_q32","pk":"110_chinese","ans":"D"},{"id":"110-chinese-33","y":"110","n":33,"img":"110_chinese_q33","pk":"110_chinese","ans":"D","pimg":"110_chinese_p33","grp":"110-chinese-33～34"},{"id":"110-chinese-34","y":"110","n":34,"img":"110_chinese_q34","pk":"110_chinese","ans":"C","pimg":"110_chinese_p33","grp":"110-chinese-33～34","exp":"文中說英國人認為「什麼都不加的紅茶，只比白開水好一點」，可推知英國人喝紅茶大多會加牛奶。(A)(B)文章只提到美式加檸檬，沒說糖或茶具等級；(D)能接受牛奶後加的茶具等級更高，表示高級茶具可以直接注入熱茶，所以(D)反而錯。"},{"id":"110-chinese-35","y":"110","n":35,"img":"110_chinese_q35","pk":"110_chinese","ans":"C","pimg":"110_chinese_p35","grp":"110-chinese-35～36","exp":"(C)「孤絕丁零的餘數」是作者用來比喻自己曾以為是被除法剩下的孤單的人，指的是個人，不是作品。作品（一冊冊創作）在文中比喻成其他的質數。其餘(A)(B)(D)都符合文意。"},{"id":"110-chinese-36","y":"110","n":36,"img":"110_chinese_q36","pk":"110_chinese","ans":"B","pimg":"110_chinese_p35","grp":"110-chinese-35～36"},{"id":"110-chinese-37","y":"110","n":37,"img":"110_chinese_q37","pk":"110_chinese","ans":"B","pimg":"110_chinese_p37","grp":"110-chinese-37～38","exp":"IPC標準中，「饑荒」是第五階段，比第四階段「緊急」更嚴重，所以(A)錯；(C)文章強調的是這個詞要有一定標準、才能動員國際救援，不是國家形象；(D)南蘇丹是國際團體評估後才宣布，也沒有被視為放羊的孩子。(B)文章最後說這個詞雖無法律效力，卻有左右生死存亡的力量，故正確。"},{"id":"110-chinese-38","y":"110","n":38,"img":"110_chinese_q38","pk":"110_chinese","ans":"A","pimg":"110_chinese_p37","grp":"110-chinese-37～38","exp":"總戶數2萬，20%是4000戶；人口10萬，每天每一萬人至少2人死亡，就是至少20人；營養不良比例要超過30%。三項都要達到：(A)5000戶、35%、25人全符合。(B)死亡只有15人，(C)3500戶不到4000，(D)死亡10人且戶數不足。"},{"id":"110-chinese-39","y":"110","n":39,"img":"110_chinese_q39","pk":"110_chinese","ans":"A","pimg":"110_chinese_p39","grp":"110-chinese-39～41","exp":"依文意，風雨「狂奔」過上空，泥濘「傾」入公路，燭火突然「爆」出一朵燈花，三個動詞最貼切。(B)「散步」「輕掠」不能形容狂暴的颱風；(C)(D)的「鋪」「澆」「灌溉」「搖」「開」都不合文句語境。"},{"id":"110-chinese-40","y":"110","n":40,"img":"110_chinese_q40","pk":"110_chinese","ans":"C","pimg":"110_chinese_p39","grp":"110-chinese-39～41"},{"id":"110-chinese-41","y":"110","n":41,"img":"110_chinese_q41","pk":"110_chinese","ans":"B","pimg":"110_chinese_p39","grp":"110-chinese-39～41","exp":"作者從颱風來臨前的悶熱、螞蟻奔走、母雞擠在廊下，一直寫到風雨停後安靜的清晨，用細緻的景物描寫表現颱風將至與離去，所以(B)正確。(A)沒有象徵內心憤怒；(C)文章是回憶，不是模仿孩童語氣；(D)最後沒有寫災後災害。"},{"id":"110-chinese-42","y":"110","n":42,"img":"110_chinese_q42","pk":"110_chinese","ans":"A","pimg":"110_chinese_p42","grp":"110-chinese-42～43","exp":"要選不是優點的。黃蓉的辦法是讓郭靖先和兩人各打一場，比賽場次反而變成三場，並沒有減少，所以(A)不是優點。(B)兩人都打一場，公平；(C)可立刻開戰；(D)洪、黃不必互相對打，不傷和氣，都是文中提到的優點。"},{"id":"110-chinese-43","y":"110","n":43,"img":"110_chinese_q43","pk":"110_chinese","ans":"B","pimg":"110_chinese_p42","grp":"110-chinese-42～43","exp":"黃蓉的規則是郭靖先和黃藥師比、再和洪七公比，看誰用的招數少就算勝。黃藥師最後是天下第一，表示他用的招數比洪七公少，所以黃藥師一定打贏了郭靖。(D)兩人沒有直接對戰；(A)(C)郭靖和洪七公的勝負不一定。"},{"id":"110-chinese-44","y":"110","n":44,"img":"110_chinese_q44","pk":"110_chinese","ans":"D","pimg":"110_chinese_p44","grp":"110-chinese-44～45","exp":"《茶經》說「山水上，江水次，井水下」，揚子江是江水，虎丘井是井水，所以揚子江優於虎丘井。(A)分二十種的是《茶經》所載李季卿的說法，不是張又新分的；(B)歐陽脩認為水味只有美惡，不應一一排序；(C)張又新只是記載，反駁的是歐陽脩。"},{"id":"110-chinese-45","y":"110","n":45,"img":"110_chinese_q45","pk":"110_chinese","ans":"A","pimg":"110_chinese_p44","grp":"110-chinese-44～45","exp":"首段列出陸羽、劉伯芻、張又新等各家說法，末段作者說水味只有美惡，並以「惟此說近物理」表達自己的看法，所以(A)正確。(B)(C)(D)都誤解了各段功能，作者並不是用各家說法佐證或總結取水標準。"},{"id":"110-chinese-46","y":"110","n":46,"img":"110_chinese_q46","pk":"110_chinese","ans":"D","pimg":"110_chinese_p46","grp":"110-chinese-46～48","exp":"「如京師」的「如」是「前往」的意思，(D)正確。(A)「名」是名聲，不是姓名；(B)「尤力」是「尤其」用力，不是尚且；(C)「悉」是「全部」，不是明白。"},{"id":"110-chinese-47","y":"110","n":47,"img":"110_chinese_q47","pk":"110_chinese","ans":"C","pimg":"110_chinese_p46","grp":"110-chinese-46～48","exp":"要選不恰當的。甲文確實寫柳開自大（載千軸文章），但乙文寫柳開稱讚張景、厚待他，並沒有凸顯自大，所以(C)錯。(A)甲文「千軸不如一書」比較兩人文才；(B)乙文寫張景投靠柳開後的待遇；(D)兩文都肯定張景的文才。"},{"id":"110-chinese-48","y":"110","n":48,"img":"110_chinese_q48","pk":"110_chinese","ans":"D","pimg":"110_chinese_p46","grp":"110-chinese-46～48","exp":"由表可知，沈括生於1031年，柳開和張景都已去世（1001、1018），甲文是後人傳聞；宋祁生於998年，與張景相近，且為張景寫墓誌銘，乙文較可信。(A)柳開中舉時張景才3歲；(B)柳開卒於1001年，宋祁才3歲，不可能有交情；(C)宋祁卒於1061年，甲文作者沈括1063年才中舉，甲文應較晚。"},{"id":"111-chinese-1","y":"111","n":1,"img":"111_chinese_q01","pk":"111_chinese","ans":"D"},{"id":"111-chinese-2","y":"111","n":2,"img":"111_chinese_q02","pk":"111_chinese","ans":"A","exp":"「杏林」指醫界，賀醫師開業要用和醫療、醫德有關的詞。「近悅遠來」稱讚店家、政績；「眾望所歸」用在選舉或領導人；「桃李芬芳」稱讚教育者；所以(A)君翰寫的「杏林之光」最恰當。"},{"id":"111-chinese-3","y":"111","n":3,"img":"111_chinese_q03","pk":"111_chinese","ans":"A"},{"id":"111-chinese-4","y":"111","n":4,"img":"111_chinese_q04","pk":"111_chinese","ans":"B","exp":"漢字字體演變順序是金文→小篆→隸書→楷書。第一個字圖案化、線條圓轉，是金文；第二個線條均勻細長，是小篆；第三個橫畫寬扁有波磔，是隸書；最後一個工整端正，是楷書。"},{"id":"111-chinese-5","y":"111","n":5,"img":"111_chinese_q05","pk":"111_chinese","ans":"D"},{"id":"111-chinese-6","y":"111","n":6,"img":"111_chinese_q06","pk":"111_chinese","ans":"C","exp":"「爆冷門」指結果出人意料，表示事前沒什麼人看好，和「各界看好」互相矛盾，所以(C)的說明錯誤。(A)主辦國、(B)轉輸為贏、(D)大勝都解釋正確。"},{"id":"111-chinese-7","y":"111","n":7,"img":"111_chinese_q07","pk":"111_chinese","ans":"C","exp":"句號用在一句話完整說完的地方。丙處前面「就算拼湊起來了也只算是死的標本，生命已蕩然無存」語意已完整，下一句才轉到「何況記憶…」，所以要用句號。甲、乙只是句中停頓，丁處是反問語氣，應用問號。"},{"id":"111-chinese-8","y":"111","n":8,"img":"111_chinese_q08","pk":"111_chinese","ans":"C"},{"id":"111-chinese-9","y":"111","n":9,"img":"111_chinese_q09","pk":"111_chinese","ans":"B"},{"id":"111-chinese-10","y":"111","n":10,"img":"111_chinese_q10","pk":"111_chinese","ans":"C","exp":"這段文字說靠假冒得來的名聲，終究經不起檢驗，到頭來一定失敗。(D)不切實際的夢想遇到現實就破滅，和「虛假終被戳破」相呼應。(A)是靠真本事成功；(B)談的是財物；(C)雖然也有作弊失敗，但重點在適應不良，與「名不符實被看穿」不同。"},{"id":"111-chinese-11","y":"111","n":11,"img":"111_chinese_q11","pk":"111_chinese","ans":"A"},{"id":"111-chinese-12","y":"111","n":12,"img":"111_chinese_q12","pk":"111_chinese","ans":"D","exp":"(D)「撒謊」「撒嬌」的「撒」都念ㄙㄚ。(A)哽咽ㄧㄝˋ、咽下ㄧㄢˋ；(B)悶不吭聲ㄎㄥ、引吭高歌ㄏㄤˊ；(C)禪機ㄔㄢˊ、禪讓ㄕㄢˋ，都不相同。"},{"id":"111-chinese-13","y":"111","n":13,"img":"111_chinese_q13","pk":"111_chinese","ans":"C"},{"id":"111-chinese-14","y":"111","n":14,"img":"111_chinese_q14","pk":"111_chinese","ans":"A","exp":"「矯思以為矢」的「矯」是矯正、使端直的意思，指把心思端正得像箭一樣。(A)「矯世勵俗」是矯正世風，意思相同；(B)(C)的「矯」是強健、靈活；(D)「矯託」是假託。"},{"id":"111-chinese-15","y":"111","n":15,"img":"111_chinese_q15","pk":"111_chinese","ans":"D","exp":"吉光片羽比喻殘存的珍貴文物，用在這裡很恰當。(A)車水馬龍形容道路上車多熱鬧，不是形容船；(B)別開生面是創新格局，不是不愛理人；(C)因噎廢食是因小問題就放棄做事，與認真讀書無關。"},{"id":"111-chinese-16","y":"111","n":16,"img":"111_chinese_q16","pk":"111_chinese","ans":"A"},{"id":"111-chinese-17","y":"111","n":17,"img":"111_chinese_q17","pk":"111_chinese","ans":"A","exp":"(B)「不屈不撓」和「妥協」互相矛盾；(C)「死不賴帳」應改成「死不認帳」，且不合句意；(D)「蔓延」的是疫情，不能「對抗意志力」，應是「對抗疫情」。只有(A)通順恰當。"},{"id":"111-chinese-18","y":"111","n":18,"img":"111_chinese_q18","pk":"111_chinese","ans":"A"},{"id":"111-chinese-19","y":"111","n":19,"img":"111_chinese_q19","pk":"111_chinese","ans":"B","exp":"寫成國字再比較。(B)斑駁陸離、斑爛奪目，都是「斑」。(A)杞人憂天、養尊處優，是「憂」和「優」；(C)自相矛盾是「矛」，茅塞頓開是「茅」；(D)細嚼慢嚥是「慢」，漫不經心是「漫」，都不同。"},{"id":"111-chinese-20","y":"111","n":20,"img":"111_chinese_q20","pk":"111_chinese","ans":"C"},{"id":"111-chinese-21","y":"111","n":21,"img":"111_chinese_q21","pk":"111_chinese","ans":"D","exp":"會意字是把兩個以上的字義組合成新義。「刪」由「刀」和「冊」組成，用刀削簡冊，正是會意。悶、弦、燈都是一邊表意、一邊表音的形聲字。"},{"id":"111-chinese-22","y":"111","n":22,"img":"111_chinese_q22","pk":"111_chinese","ans":"A","exp":"文中說學習像取水、教人像分火，水可以越取越多、火分出去也不減，所以善於學習的人不會限制自己容納的量，善於教導的人不會吝嗇自己的光亮。(A)「不自隘其器／不自吝其光」正好呼應。"},{"id":"111-chinese-23","y":"111","n":23,"img":"111_chinese_q23","pk":"111_chinese","ans":"B"},{"id":"111-chinese-24","y":"111","n":24,"img":"111_chinese_q24","pk":"111_chinese","ans":"A","exp":"文章開頭先說「世人」認為孫叔敖遇到楚莊王是幸運，接著說「有道者論之則不然」，指出這其實是楚國的幸運，這是先提出一般看法，再反駁。(D)順序顛倒；(B)(C)與文中結構不合。"},{"id":"111-chinese-25","y":"111","n":25,"img":"111_chinese_q25","pk":"111_chinese","ans":"D","exp":"乙表是107年的順位，甲說明與十年前(97年)比的升降。腦血管疾病、慢性肝病、蓄意自我傷害順位下降，表示97年排名比107年更前，所以(A)(B)(C)都能推出。肺炎、高血壓、腎臟疾病順位上升，97年排名更後，其中腎臟疾病107年是第9名，97年可能排到第10名以外，無法確定。"},{"id":"111-chinese-26","y":"111","n":26,"img":"111_chinese_q26","pk":"111_chinese","ans":"C","pimg":"111_chinese_p26","grp":"111-chinese-26～27"},{"id":"111-chinese-27","y":"111","n":27,"img":"111_chinese_q27","pk":"111_chinese","ans":"C","pimg":"111_chinese_p26","grp":"111-chinese-26～27","exp":"(A)咖啡機不在十項維修範圍內；(B)週三休診；(D)50元是工本費，不是特殊材料費，且特殊材料費是領回時才繳。(C)電子鍋屬於電鍋（含電子鍋），週六16:00在收件時間內，領件憑取貨聯單，內容相符。"},{"id":"111-chinese-28","y":"111","n":28,"img":"111_chinese_q28","pk":"111_chinese","ans":"D","pimg":"111_chinese_p28","grp":"111-chinese-28～29","exp":"(D)的「蟑螂」是主管說的、能在叢林中生存的對象，象徵適應力強、生命力頑強，不是指人品卑鄙惡劣，所以說明不恰當。(A)坑洞比喻挑戰；(B)方正直角是自己原本的稜角個性；(C)「紙」代表作者自己。"},{"id":"111-chinese-29","y":"111","n":29,"img":"111_chinese_q29","pk":"111_chinese","ans":"B","pimg":"111_chinese_p28","grp":"111-chinese-28～29"},{"id":"111-chinese-30","y":"111","n":30,"img":"111_chinese_q30","pk":"111_chinese","ans":"B","pimg":"111_chinese_p30","grp":"111-chinese-30～31","exp":"(B)乙句說經過長時間的警戒，人們的心腸變硬，連痛苦呻吟聲都不在意，是緊繃後的冷漠麻木。(A)甲是形容酷熱的陽光追著人跑，不是政府監控；(C)丙是熱和恐懼讓事情被誇大，不是政府假稱；(D)丁只是寫巡邏隊離開後的寂靜，沒有說刻意威嚇。"},{"id":"111-chinese-31","y":"111","n":31,"img":"111_chinese_q31","pk":"111_chinese","ans":"D","pimg":"111_chinese_p30","grp":"111-chinese-30～31","exp":"文中說政府「擔心發生最壞情況」，並考慮「萬一這群被困在疫病當中的民眾發生暴動」該採取什麼措施，可見最壞情況是民眾暴動。(A)(B)(C)文中只是氣氛或現象，不是政府擔心的最壞狀況。"},{"id":"111-chinese-32","y":"111","n":32,"img":"111_chinese_q32","pk":"111_chinese","ans":"C","pimg":"111_chinese_p32","grp":"111-chinese-32～33"},{"id":"111-chinese-33","y":"111","n":33,"img":"111_chinese_q33","pk":"111_chinese","ans":"B","pimg":"111_chinese_p32","grp":"111-chinese-32～33"},{"id":"111-chinese-34","y":"111","n":34,"img":"111_chinese_q34","pk":"111_chinese","ans":"C","pimg":"111_chinese_p34","grp":"111-chinese-34～35","exp":"文中說紙本書是最能讓我們學習、體會文字力量的媒介，同一首古詩印在紙本與電子書上氣場不同，感受也不同，所以價值是讓文字散發不同的渲染力。(A)(D)文中沒提；(B)紙本書是對應「黑夜」，並不是不受晝夜限制。"},{"id":"111-chinese-35","y":"111","n":35,"img":"111_chinese_q35","pk":"111_chinese","ans":"D","pimg":"111_chinese_p34","grp":"111-chinese-34～35","exp":"作者把網路閱讀比喻成白晝、紙本閱讀比喻成黑夜，白晝與黑夜都是人類需要的，所以兩者應該並存。(A)作者並不是要說數位不如紙本；(B)夜是白晝的對照，不是延伸；(C)圖表是用來比較兩種閱讀的特質，不是談無限發展。"},{"id":"111-chinese-36","y":"111","n":36,"img":"111_chinese_q36","pk":"111_chinese","ans":"B","pimg":"111_chinese_p36","grp":"111-chinese-36～38"},{"id":"111-chinese-37","y":"111","n":37,"img":"111_chinese_q37","pk":"111_chinese","ans":"B","pimg":"111_chinese_p36","grp":"111-chinese-36～38"},{"id":"111-chinese-38","y":"111","n":38,"img":"111_chinese_q38","pk":"111_chinese","ans":"A","pimg":"111_chinese_p36","grp":"111-chinese-36～38"},{"id":"111-chinese-39","y":"111","n":39,"img":"111_chinese_q39","pk":"111_chinese","ans":"D","pimg":"111_chinese_p39","grp":"111-chinese-39～40","exp":"乙文說鄧通錢的形制、文字、重量都和天子的四銖錢相同，吳錢則「微重」，也就是比天子錢稍重。所以重量是吳錢大於鄧通錢，鄧通錢等於四銖錢。"},{"id":"111-chinese-40","y":"111","n":40,"img":"111_chinese_q40","pk":"111_chinese","ans":"B","pimg":"111_chinese_p39","grp":"111-chinese-39～40","exp":"甲說四銖錢上鑄「半兩」字樣；乙說鄧通錢與天子四銖錢相同，吳錢與天子錢形制文字沒有不同，所以兩者都應有「半兩」。(A)英錢是更早的錢；(C)甲說鑄錢之禁是在吳、鄧錢布天下之後；(D)鄧通得銅山是在他鑄錢之前。"},{"id":"111-chinese-41","y":"111","n":41,"img":"111_chinese_q41","pk":"111_chinese","ans":"C","pimg":"111_chinese_p41","grp":"111-chinese-41～42","exp":"逐句找主語。(A)(B)的「病其…」「乃密令…」是王起；(D)「大怒而去」是門人；(C)「悉以實告」是白敏中把王起的安排全部告訴賀拔恭，所以主語是白敏中。"},{"id":"111-chinese-42","y":"111","n":42,"img":"111_chinese_q42","pk":"111_chinese","ans":"D","pimg":"111_chinese_p41","grp":"111-chinese-41～42","exp":"白敏中本來被安排要和賀拔恭絕交，卻在賀拔恭來訪時如實相告，不肯為了狀元背棄朋友。王起看到他重情義，才說原本只想取白敏中，現在還要取賀拔恭，所以是(C)。(A)(B)(D)文中都沒有這些內容。"},{"id":"112-chinese-1","y":"112","n":1,"img":"112_chinese_q01","pk":"112_chinese","ans":"D"},{"id":"112-chinese-2","y":"112","n":2,"img":"112_chinese_q02","pk":"112_chinese","ans":"D","exp":"「與其…不如…」是固定搭配，前面說不好的選擇，後面接比較好的選擇。(D)後句用「難道讓你犯錯懊悔」，語意不通，應改成「不如讓你…」。(A)(B)(C)的連接詞與用語都正確。"},{"id":"112-chinese-3","y":"112","n":3,"img":"112_chinese_q03","pk":"112_chinese","ans":"C","exp":"分號用在並列的分句之間。這段文字有兩組「有些…」並列，所以在第一組結束的「淪為遺忘」之後(丙)要用分號隔開；(甲)(乙)(丁)只是句中停頓，用逗號即可。"},{"id":"112-chinese-4","y":"112","n":4,"img":"112_chinese_q04","pk":"112_chinese","ans":"C","exp":"(A)「豈非」是反問語氣，和「驚訝」搭配不通順；(B)「並非我與他相識」與「絕不可能善罷甘休」語意不連貫；(D)「若非我故意…」與「你的做法不合理」前後不呼應。(C)「無非是」是「不過是」的意思，與「老生常談」搭配恰當。"},{"id":"112-chinese-5","y":"112","n":5,"img":"112_chinese_q05","pk":"112_chinese","ans":"D","exp":"逐項查音：(A)迄ㄑㄧˋ、屹ㄧˋ；(B)嵌ㄑㄧㄢˋ、坎ㄎㄢˇ；(C)寥ㄌㄧㄠˊ、謬ㄇㄧㄡˋ。(D)「囑」「矚」都念ㄓㄨˇ，讀音相同。"},{"id":"112-chinese-6","y":"112","n":6,"img":"112_chinese_q06","pk":"112_chinese","ans":"C"},{"id":"112-chinese-7","y":"112","n":7,"img":"112_chinese_q07","pk":"112_chinese","ans":"A"},{"id":"112-chinese-8","y":"112","n":8,"img":"112_chinese_q08","pk":"112_chinese","ans":"A","exp":"陽刻是凸起的部分沾上印泥，所以蓋出來的是有顏色的字、白色的底，因此(B)(D)黑底白字是陰刻的效果。另外隸書的橫畫有波磔，筆畫寬扁；(C)字體不是隸書，所以選(A)。"},{"id":"112-chinese-9","y":"112","n":9,"img":"112_chinese_q09","pk":"112_chinese","ans":"A","exp":"「版築」是古代築牆的方法，用來稱讚建築、營造方面的貢獻，不適合送給家具店。(B)貴客盈門適合飯店；(C)仁心仁術稱讚醫生；(D)桃李滿門稱讚教育工作者。"},{"id":"112-chinese-10","y":"112","n":10,"img":"112_chinese_q10","pk":"112_chinese","ans":"D"},{"id":"112-chinese-11","y":"112","n":11,"img":"112_chinese_q11","pk":"112_chinese","ans":"C","exp":"(A)應作「瑣碎」；(B)應作「陌生」；(D)應作「里程碑」。(C)「墊付」是先替人付錢，用字正確。"},{"id":"112-chinese-12","y":"112","n":12,"img":"112_chinese_q12","pk":"112_chinese","ans":"A","exp":"文中少室周讓出職位，趙簡子稱讚他「知賢而讓」，並說這種行為「可以為訓」，意思是可以當作大家學習的榜樣。所以「訓」是典範；(B)(C)(D)放進句子裡都不通順。"},{"id":"112-chinese-13","y":"112","n":13,"img":"112_chinese_q13","pk":"112_chinese","ans":"B"},{"id":"112-chinese-14","y":"112","n":14,"img":"112_chinese_q14","pk":"112_chinese","ans":"C","exp":"(A)「若即若離」是形容關係不遠不近，不是丟棄；(B)「急公好義」是熱心公益，並非莽撞；(D)「庸庸碌碌」是平庸無所作為，不是忙碌。(C)「幡然悔悟」是徹底醒悟悔改，與「痛改前非」相符。"},{"id":"112-chinese-15","y":"112","n":15,"img":"112_chinese_q15","pk":"112_chinese","ans":"B","exp":"乙詩寫「溪曲」「小雨」「鵝鴨」「桃花」，是在春天將盡時溪邊所見的景色。(A)「日西」是傍晚，不是清晨；(D)兩首的第一句也押韻（啼、西、堤；加、沙、花），不是只有偶句押韻。"},{"id":"112-chinese-16","y":"112","n":16,"img":"112_chinese_q16","pk":"112_chinese","ans":"D"},{"id":"112-chinese-17","y":"112","n":17,"img":"112_chinese_q17","pk":"112_chinese","ans":"A","exp":"甲圖說的是「過去12個月」內有18%的女性經歷過伴侶的暴力，沒有經歷的82%只是指這段期間，不能推論成「未曾遭受」。其他選項都符合圖表資料。"},{"id":"112-chinese-18","y":"112","n":18,"img":"112_chinese_q18","pk":"112_chinese","ans":"C"},{"id":"112-chinese-19","y":"112","n":19,"img":"112_chinese_q19","pk":"112_chinese","ans":"A"},{"id":"112-chinese-20","y":"112","n":20,"img":"112_chinese_q20","pk":"112_chinese","ans":"B","exp":"「酒賤常愁客少」是說酒雖然便宜，卻常擔心沒有客人來共飲，表達孤單寂寞，不是在說維持生計。(A)(C)(D)的解釋都符合詞意。"},{"id":"112-chinese-21","y":"112","n":21,"img":"112_chinese_q21","pk":"112_chinese","ans":"C","exp":"1886年出口額是240，1900年降為120，剛好是一半。(B)1886年市占約100%，所以歐洲總量約240；1900年占10%，總量約1200，反而增加；(A)(D)文中沒有提到。"},{"id":"112-chinese-22","y":"112","n":22,"img":"112_chinese_q22","pk":"112_chinese","ans":"D"},{"id":"112-chinese-23","y":"112","n":23,"img":"112_chinese_q23","pk":"112_chinese","ans":"D","exp":"文中說二人的話「當時已謂之工，傳之至今」，所以都受到時人稱讚。(A)(B)二人各記犬與馬兩方面；(C)當時的新風是不用對偶的平文，二人的用語並非崇尚對偶。"},{"id":"112-chinese-24","y":"112","n":24,"img":"112_chinese_q24","pk":"112_chinese","ans":"B","exp":"老水工怕移堤後沒有水患，大家就失去生計，才暗中叫同伴附和，所以水工們為了保生計而阻礙工程。(C)老水工是為了自己的利益，不是真的認為月堤無益；(D)杜偉長是被誤導，不是堅持造成水患。"},{"id":"112-chinese-25","y":"112","n":25,"img":"112_chinese_q25","pk":"112_chinese","ans":"D","pimg":"112_chinese_p25","grp":"112-chinese-25～26"},{"id":"112-chinese-26","y":"112","n":26,"img":"112_chinese_q26","pk":"112_chinese","ans":"A","pimg":"112_chinese_p25","grp":"112-chinese-25～26","exp":"詩中天氣從冷變暖，是由「突圍而出」變得明亮，象徵心情越來越輕鬆，而不是越來越沉重，所以(A)錯誤。(B)「暖暖」重複出現、(C)「暖暖」兼指地名與溫度、(D)最後預想「又鬱結起來」都符合本詩。"},{"id":"112-chinese-27","y":"112","n":27,"img":"112_chinese_q27","pk":"112_chinese","ans":"A","pimg":"112_chinese_p27","grp":"112-chinese-27～29"},{"id":"112-chinese-28","y":"112","n":28,"img":"112_chinese_q28","pk":"112_chinese","ans":"B","pimg":"112_chinese_p27","grp":"112-chinese-27～29"},{"id":"112-chinese-29","y":"112","n":29,"img":"112_chinese_q29","pk":"112_chinese","ans":"C","pimg":"112_chinese_p27","grp":"112-chinese-27～29","exp":"規則是去掉2個最高分與2個最低分，只算中間3位評審的分數。7、8、8、7、9、7、9排序後為7、7、7、8、8、9、9，去掉兩個7和兩個9，剩下7、8、8，再乘以難度係數3.0。"},{"id":"112-chinese-30","y":"112","n":30,"img":"112_chinese_q30","pk":"112_chinese","ans":"A","pimg":"112_chinese_p30","grp":"112-chinese-30～31"},{"id":"112-chinese-31","y":"112","n":31,"img":"112_chinese_q31","pk":"112_chinese","ans":"C","pimg":"112_chinese_p30","grp":"112-chinese-30～31"},{"id":"112-chinese-32","y":"112","n":32,"img":"112_chinese_q32","pk":"112_chinese","ans":"B","pimg":"112_chinese_p32","grp":"112-chinese-32～33"},{"id":"112-chinese-33","y":"112","n":33,"img":"112_chinese_q33","pk":"112_chinese","ans":"C","pimg":"112_chinese_p32","grp":"112-chinese-32～33","exp":"霍普賣月球土地給私人，認為私人可以擁有；艾維斯則說國家或私人企業都不能主張月球土地的所有權。兩人的歧見就是「私人能不能主張月球土地所有權」。"},{"id":"112-chinese-34","y":"112","n":34,"img":"112_chinese_q34","pk":"112_chinese","ans":"B","pimg":"112_chinese_p34","grp":"112-chinese-34～35"},{"id":"112-chinese-35","y":"112","n":35,"img":"112_chinese_q35","pk":"112_chinese","ans":"B","pimg":"112_chinese_p34","grp":"112-chinese-34～35"},{"id":"112-chinese-36","y":"112","n":36,"img":"112_chinese_q36","pk":"112_chinese","ans":"C","pimg":"112_chinese_p36","grp":"112-chinese-36～38"},{"id":"112-chinese-37","y":"112","n":37,"img":"112_chinese_q37","pk":"112_chinese","ans":"B","pimg":"112_chinese_p36","grp":"112-chinese-36～38"},{"id":"112-chinese-38","y":"112","n":38,"img":"112_chinese_q38","pk":"112_chinese","ans":"A","pimg":"112_chinese_p36","grp":"112-chinese-36～38","exp":"文中說畫面正中央是代表神權的十字架，但小銘的模擬圖把十字架畫在右側，位置錯誤。(B)加冕對象是皇后約瑟芬沒錯；(C)教皇舉起右手祝福沒錯；(D)母親出席是畫家虛構，也有畫出。"},{"id":"112-chinese-39","y":"112","n":39,"img":"112_chinese_q39","pk":"112_chinese","ans":"D","pimg":"112_chinese_p39","grp":"112-chinese-39～40"},{"id":"112-chinese-40","y":"112","n":40,"img":"112_chinese_q40","pk":"112_chinese","ans":"D","pimg":"112_chinese_p39","grp":"112-chinese-39～40","exp":"「遣所乘龍舟過海子召嵩」是派皇帝自己乘坐的龍舟去接嚴嵩，表示高規格的禮遇。(A)是門衛因嚴嵩沒有詔令而阻擋；(B)對泣的是嚴嵩和兒子；(C)陸炳誣告後，皇帝是追究已死的仇鸞，並非殺死毀謗的人。"},{"id":"112-chinese-41","y":"112","n":41,"img":"112_chinese_q41","pk":"112_chinese","ans":"B","pimg":"112_chinese_p41","grp":"112-chinese-41～42"},{"id":"112-chinese-42","y":"112","n":42,"img":"112_chinese_q42","pk":"112_chinese","ans":"D","pimg":"112_chinese_p41","grp":"112-chinese-41～42","exp":"「吞舟之魚不游支流，鴻鵠不集汙池」是說志向遠大的人不會屈就小地方。(D)「剖三寸之蚌，難得明月之珠」是說小地方出不了大人才，意思相近；(A)是過河拆橋，(B)是貪求美食而喪命，(C)是比喻速度差別。"},{"id":"113-chinese-1","y":"113","n":1,"img":"113_chinese_q01","pk":"113_chinese","ans":"D"},{"id":"113-chinese-2","y":"113","n":2,"img":"113_chinese_q02","pk":"113_chinese","ans":"D","exp":"(A)「衷」應作「終」，「所終」是最後的下落；(C)「誤」應作「物」，是「失物招領處」。「樹欲靜而風不止」與「盡孝要及時」用字都正確。"},{"id":"113-chinese-3","y":"113","n":3,"img":"113_chinese_q03","pk":"113_chinese","ans":"B"},{"id":"113-chinese-4","y":"113","n":4,"img":"113_chinese_q04","pk":"113_chinese","ans":"B","exp":"否定詞疊加時要先還原真正的問法。「是否同意禁止種植基因改造植物」，反對基因改造就該回答「同意」。(A)(C)(D)的立場和選擇都與題目的意思相反。"},{"id":"113-chinese-5","y":"113","n":5,"img":"113_chinese_q05","pk":"113_chinese","ans":"C"},{"id":"113-chinese-6","y":"113","n":6,"img":"113_chinese_q06","pk":"113_chinese","ans":"D","exp":"「月落星沉」的「落」是下沉、降下。(D)水位下降、石頭露出，「落」也是降下；(A)是著落，(B)是凋零，(C)是遺漏。"},{"id":"113-chinese-7","y":"113","n":7,"img":"113_chinese_q07","pk":"113_chinese","ans":"B","exp":"這段文字說人生走到艱難處，各人要各自尋找方向，重點是「路要自己走」。(D)與此相近；(B)要大家都樂觀面對，文中沒有這個意思，所以相去最遠。"},{"id":"113-chinese-8","y":"113","n":8,"img":"113_chinese_q08","pk":"113_chinese","ans":"C"},{"id":"113-chinese-9","y":"113","n":9,"img":"113_chinese_q09","pk":"113_chinese","ans":"B","exp":"文中說私人遠征隊比較成功，是因為少政治考量、主事者專心主導、成員各有專長。「大批補給裝備」是官方隊伍的缺點，不是私人隊的優點。"},{"id":"113-chinese-10","y":"113","n":10,"img":"113_chinese_q10","pk":"113_chinese","ans":"A","exp":"題目說〈瑯琊臺刻石〉是小篆，特色是筆畫圓轉、粗細均勻、結構匀稱。(A)線條最圓潤均勻，符合小篆；(B)是隸書一類，方折明顯；(D)是甲骨文，筆畫較細而尖。"},{"id":"113-chinese-11","y":"113","n":11,"img":"113_chinese_q11","pk":"113_chinese","ans":"C","exp":"(C)「鐵畫銀鉤」形容書法筆力剛健。(A)「妙筆生花」形容文章寫得好，不是演說；(B)「新鶯出谷」形容歌聲清脆，不是作文；(D)「口若懸河」才是形容演說。"},{"id":"113-chinese-12","y":"113","n":12,"img":"113_chinese_q12","pk":"113_chinese","ans":"C","exp":"詩中寫農民繳稅繁重、吃不飽，只能靠橡實過活，商人卻富貴奢侈，主旨是描寫農民的困苦。(A)這首不是律詩；(B)不是閒適詩；(D)重點是批評不公，不是凸顯人情可貴。"},{"id":"113-chinese-13","y":"113","n":13,"img":"113_chinese_q13","pk":"113_chinese","ans":"C","exp":"作者的意思是：遺忘讓人更能看見光照處，那些沒有被遺忘的才值得珍惜。(A)文中說遺忘「無須哀悼」，不是「無須遺忘」；(B)舞臺上的暗處才是遺忘；(D)是要把眼光投向光明，不是遺忘越多越能看見。"},{"id":"113-chinese-14","y":"113","n":14,"img":"113_chinese_q14","pk":"113_chinese","ans":"B","exp":"下闋首句「尋好夢，夢難成」，寫的是想在夢中和離人相見卻睡不著，不是為了追尋理想離開佳人，所以(B)錯誤。"},{"id":"113-chinese-15","y":"113","n":15,"img":"113_chinese_q15","pk":"113_chinese","ans":"C","exp":"文章說：話語內容和語調、表情不一致時，人們容易受語調和非語言行為影響。(C)說的是「謝謝」，卻臭著臉，大家會相信他的表情，正好符合。"},{"id":"113-chinese-16","y":"113","n":16,"img":"113_chinese_q16","pk":"113_chinese","ans":"D","exp":"(D)「就木」指快入棺材，形容人將死，使用恰當。(A)「五穀不分」是形容缺乏生活常識；(B)「不愧屋漏」是指獨處時也不做虧心事；(C)「蠡測海」是見識淺窄，不可能得到準確數據。"},{"id":"113-chinese-17","y":"113","n":17,"img":"113_chinese_q17","pk":"113_chinese","ans":"B","exp":"文意是：求學要像射箭先立靶心，以聖賢為標準。(B)在「聖賢」後停頓，「猶射者之求中夫正鵠也」意思連貫；其他選項斷句會把句子拆壞。"},{"id":"113-chinese-18","y":"113","n":18,"img":"113_chinese_q18","pk":"113_chinese","ans":"A","exp":"(A)蔡邕聽見燒桐木的聲音，認為是好材料，請人取下做成琴。(B)只說吳地有人燒桐，並非向來以此聞名；(C)是燒的時候聽聲音，不是做好後火烤；(D)他是逃亡到吳郡，不是被流放。"},{"id":"113-chinese-19","y":"113","n":19,"img":"113_chinese_q19","pk":"113_chinese","ans":"D","exp":"這句話說蝎、蟬、螢因為外顯的特質反被人捉，所以愛惜自身的人不追求顯赫的名聲。(D)名氣太大反而招禍，意思最接近；(A)(B)(C)都在談留名或名聲本身是好事。"},{"id":"113-chinese-20","y":"113","n":20,"img":"113_chinese_q20","pk":"113_chinese","ans":"A","exp":"指事是在象形字上加符號表示抽象概念。(A)「本」是在「木」的根部加一點指出根本，屬指事；(B)功是形聲，(C)炎是會意，(D)雨是象形。"},{"id":"113-chinese-21","y":"113","n":21,"img":"113_chinese_q21","pk":"113_chinese","ans":"C","exp":"這段文字用「事必成，然後舉；身必安，而後行」等工整句式，勸太子要先考慮周全再行動。(A)不是鼓勵建功；(B)沒有先抑後揚；(D)文中沒有舉前人失敗的例子。"},{"id":"113-chinese-22","y":"113","n":22,"img":"113_chinese_q22","pk":"113_chinese","ans":"A","exp":"文中說張氏借糧給貧民，還的時候多寡都不計較，也不用斗斛量，所以人稱「不量」。這是行善積德，所以田才沒受災，(A)最合理。"},{"id":"113-chinese-23","y":"113","n":23,"img":"113_chinese_q23","pk":"113_chinese","ans":"D","exp":"文中說假日管制時，車輛改為「北門進、南門出」；非假日沒有管制，所以仍可從南門進入。(A)水位越高，鳥離亭越遠才需要望遠鏡；(C)只在假日8時至16時管制。"},{"id":"113-chinese-24","y":"113","n":24,"img":"113_chinese_q24","pk":"113_chinese","ans":"A","exp":"文章用蠶繭比喻身體，繭不加整治會腐壞，經過教化才成為美錦；說的是教化對修身的重要。(B)(D)不是在批評奢靡或國政，(C)的重點也不是環境影響。"},{"id":"113-chinese-25","y":"113","n":25,"img":"113_chinese_q25","pk":"113_chinese","ans":"A","pimg":"113_chinese_p25","grp":"113-chinese-25～26","exp":"文中說二十幾歲時，人和城市的關係是有目的性的，作者留學愛丁堡就是為了完成學業。(B)「偏頗」指的是帶著目的的生活，不是去咖啡館；(C)(D)文中沒有這些意思。"},{"id":"113-chinese-26","y":"113","n":26,"img":"113_chinese_q26","pk":"113_chinese","ans":"D","pimg":"113_chinese_p25","grp":"113-chinese-25～26","exp":"「尖銳」指當時只帶著單一目標去生活，眼光只看著目標，因此視野狹窄。(D)最符合；(A)(B)(C)講的是粗心、好爭或氣量，文中沒有提到。"},{"id":"113-chinese-27","y":"113","n":27,"img":"113_chinese_q27","pk":"113_chinese","ans":"A","pimg":"113_chinese_p27","grp":"113-chinese-27～28","exp":"原書用三種顏色的絲線暗指三種勳章，是在諷刺沒骨氣的人得寵。出版社改了顏色，寓意就消失，讀者看不出作者的諷刺，所以(A)正確。"},{"id":"113-chinese-28","y":"113","n":28,"img":"113_chinese_q28","pk":"113_chinese","ans":"B","pimg":"113_chinese_p27","grp":"113-chinese-27～28","exp":"文中說這本書表面是奇幻故事，實際是諷刺人性與英國時政權貴，所以是用虛構情節反映現實。(A)是中文世界的印象；(C)是中譯本只翻兩冊，不是譯者濃縮；(D)是誤譯，不是怕得罪人。"},{"id":"113-chinese-29","y":"113","n":29,"img":"113_chinese_q29","pk":"113_chinese","ans":"D","pimg":"113_chinese_p29","grp":"113-chinese-29～30","exp":"文中說如果每個人都像美國人那樣生活，超載日會提前到3月13日，可見美國人的負擔比多數國家大。(A)1990年是評估方法出現的時間；(B)是需要1.75個地球；(C)超載日後是透支，不是耗盡。"},{"id":"113-chinese-30","y":"113","n":30,"img":"113_chinese_q30","pk":"113_chinese","ans":"C","pimg":"113_chinese_p29","grp":"113-chinese-29～30","exp":"文中說肉品消費減半可延後17天，所以增加蔬食比例可延後超載日。(A)(B)文中沒提到；(D)疫情期間超載日只延後三週，隔年就恢復，不是長久辦法。"},{"id":"113-chinese-31","y":"113","n":31,"img":"113_chinese_q31","pk":"113_chinese","ans":"A","pimg":"113_chinese_p31","grp":"113-chinese-31～32","exp":"概述說這些畫是「絹本」，絹是絲織品，可見北宋畫作可畫在絲織品上。(B)只說他們各是巨幅立軸代表；(C)是通過靜觀體悟重新組織；(D)〈萬壑松風〉是時代最近的，最晚才是。"},{"id":"113-chinese-32","y":"113","n":32,"img":"113_chinese_q32","pk":"113_chinese","ans":"A","pimg":"113_chinese_p31","grp":"113-chinese-31～32","exp":"概述說展期不超過42天，但海報上是10/06到12/16，共超過兩個月，所以展出的起迄日期有誤。"},{"id":"113-chinese-33","y":"113","n":33,"img":"113_chinese_q33","pk":"113_chinese","ans":"B","pimg":"113_chinese_p33","grp":"113-chinese-33～35","exp":"三者是包含關係：深度學習屬於機器學習，機器學習又屬於人工智慧，所以用同心圓最適合。(A)金字塔是層級；(C)是交集；(D)是循環，都不對。"},{"id":"113-chinese-34","y":"113","n":34,"img":"113_chinese_q34","pk":"113_chinese","ans":"D","pimg":"113_chinese_p33","grp":"113-chinese-33～35","exp":"生成器和辨識器是互相競爭：一方做出更像真的，另一方就要更會分辨。(D)駭客發展新病毒，防毒軟體就要更新，是對抗與進步，最接近；其他選項是單向依賴或單純操作。"},{"id":"113-chinese-35","y":"113","n":35,"img":"113_chinese_q35","pk":"113_chinese","ans":"C","pimg":"113_chinese_p33","grp":"113-chinese-33～35","exp":"文中說氾濫的深偽影片最大的危機是讓民眾對社會產生不信任感，所以(C)正確。(A)美國媒體是為了提醒大眾；(B)(D)文中沒有這樣的說法。"},{"id":"113-chinese-36","y":"113","n":36,"img":"113_chinese_q36","pk":"113_chinese","ans":"C","pimg":"113_chinese_p36","grp":"113-chinese-36～37","exp":"文中說茶蟲有的在啃茶葉，有的在吃人物手裡的飯和衣服，而古阿明來自貧困茶農家庭，這是他對生活困苦與恐懼的表現。(C)最符合；(A)(B)(D)文中沒有依據。"},{"id":"113-chinese-37","y":"113","n":37,"img":"113_chinese_q37","pk":"113_chinese","ans":"B","pimg":"113_chinese_p36","grp":"113-chinese-36～37","exp":"文中說郭雲天不忍破壞那純潔的心靈裡流露出來的東西，明知有錯也讓他保持原來面目，所以是想保留古阿明特有的創意。(C)只是他作畫的狀況，不是意見少的原因。"},{"id":"113-chinese-38","y":"113","n":38,"img":"113_chinese_q38","pk":"113_chinese","ans":"B","pimg":"113_chinese_p38","grp":"113-chinese-38～39","exp":"「見一事則止知一事」是只看到一件事就只知道那一件事，代表理解不夠全面。(A)是不會活用書本；(C)「氣象」指古人的氣度；(D)是說任性行事，不是更自由。"},{"id":"113-chinese-39","y":"113","n":39,"img":"113_chinese_q39","pk":"113_chinese","ans":"B","pimg":"113_chinese_p38","grp":"113-chinese-38～39","exp":"乙文要人設想「古人遇到這事會怎麼做」，再對照自己的作法，也就是用古人的標準來評斷自己。(A)甲文沒有這樣比較；(C)乙文是用古人當標準；(D)文中沒提效率。"},{"id":"113-chinese-40","y":"113","n":40,"img":"113_chinese_q40","pk":"113_chinese","ans":"C","pimg":"113_chinese_p40","grp":"113-chinese-40～42","exp":"「坐」有因某事而獲罪、受罰的意思。(A)「亡」是丟失；(B)「信」是相信；(D)「其」是表示請求的語氣，不是難道。"},{"id":"113-chinese-41","y":"113","n":41,"img":"113_chinese_q41","pk":"113_chinese","ans":"D","pimg":"113_chinese_p40","grp":"113-chinese-40～42","exp":"楚王說令尹相信有人偷布，他不會因為對方富貴就不依法處置，可見他認為不論身分都要守法。(A)(B)(C)與文中內容不符。"},{"id":"113-chinese-42","y":"113","n":42,"img":"113_chinese_q42","pk":"113_chinese","ans":"B","pimg":"113_chinese_p40","grp":"113-chinese-40～42","exp":"江母說自己的兒子被指為偷布，其實是令尹治理不明才讓盜賊橫行，令尹該負責卻要懲處江乙，所以她是在表達江乙被懲處的不公。(A)(C)(D)與文中的論述不符。"},{"id":"114-chinese-1","y":"114","n":1,"img":"114_chinese_q01","pk":"114_chinese","ans":"D","exp":"簡訊說水費逾期、「務必於三日內繳費，逾期將終止供水」，營造必須馬上處理的緊迫感，讓人來不及思考就點連結，屬於④引發情緒反應。","goal":"能應用文本","pr":90},{"id":"114-chinese-2","y":"114","n":2,"img":"114_chinese_q02","pk":"114_chinese","ans":"B","exp":"文中強調驗屍時「涉案人、關係人和家屬必須在場」，所以(B)正確。(A)禁止把屍體帶到他處；(C)一般大眾可以圍觀；(D)目的是讓大家「質對明白」，不會拒絕家屬確認。","goal":"能應用文本","pr":95},{"id":"114-chinese-3","y":"114","n":3,"img":"114_chinese_q03","pk":"114_chinese","ans":"B","exp":"「月」是依月亮形狀畫出的象形字。「木」畫出樹的枝幹與根，也是象形字。「出」是腳走出坑穴的會意字；「汝」是從水、女聲的形聲字。","goal":"能辨別常用字造字原則","pr":79},{"id":"114-chinese-4","y":"114","n":4,"img":"114_chinese_q04","pk":"114_chinese","ans":"B","exp":"詩中說快樂除以悲傷，「得到的商卻只是1」，一個數除以另一個數等於1，表示兩者相等，也就是「我的快樂等同於我的悲傷」。","goal":"能理解文意","pr":81},{"id":"114-chinese-5","y":"114","n":5,"img":"114_chinese_q05","pk":"114_chinese","ans":"A","exp":"《說文解字》以小篆為主，兼收古文、籀文，都是秦以前的古文字。(A)是楷書，楷書在漢末之後才成熟，《說文》不會收錄。","goal":"能辨別書法字體","pr":88},{"id":"114-chinese-6","y":"114","n":6,"img":"114_chinese_q06","pk":"114_chinese","ans":"A","exp":"資料中各國自封城後，家暴通報、專線來電都上升，所以可推論封城容易誘發家庭暴力。(B)來電增加不代表通報意願較高；(C)是收入與行動受限讓女性更易受害，因果相反；(D)資料沒有提到。","goal":"能根據文本推論","pr":79},{"id":"114-chinese-7","y":"114","n":7,"img":"114_chinese_q07","pk":"114_chinese","ans":"B","exp":"甲圖說最末字仄聲貼右邊（上聯）、平聲貼左邊（下聯）；乙圖標示上聯尾字是仄聲、下聯尾字是平聲。兩圖都指出上聯仄聲結尾、下聯平聲結尾，就是「仄起平收」。(C)順序是上聯→下聯→橫批；(D)面向大門右邊貼上聯。","goal":"能理解對聯的原則與貼法","pr":84},{"id":"114-chinese-8","y":"114","n":8,"img":"114_chinese_q08","pk":"114_chinese","ans":"C","exp":"「菊花」是秋天的花，「金風」指秋風，「桂枝香」是秋天的桂花香，都呼應題目「秋」。(A)〈小梁州〉是曲牌名，不是題目；(B)黃、光、藏、盪、香、望、江、漾、行都押同一韻，一韻到底；(D)斜月、新雁是寫秋景。","goal":"能分析文本的寫作手法","pr":80},{"id":"114-chinese-9","y":"114","n":9,"img":"114_chinese_q09","pk":"114_chinese","ans":"C","exp":"文中說等級最高的是第一種「香片」，例如茉莉花茶；玫瑰烏龍茶是成品內有花的第二種，所以(C)的建議不恰當。","goal":"能應用文本","pr":78},{"id":"114-chinese-10","y":"114","n":10,"img":"114_chinese_q10","pk":"114_chinese","ans":"A","exp":"文中說「北方乾燥，土穴所釀多出於此」，可知土穴中的蜜（穴蜜）多產於乾燥的地方。(B)人工養蜂只占十分之二，崖蜜是天然的；(C)南方卑溼仍有崖蜜；(D)「與蔗漿分勝」是說兩者不相上下。","goal":"能根據文本推論","pr":83},{"id":"114-chinese-11","y":"114","n":11,"img":"114_chinese_q11","pk":"114_chinese","ans":"D","exp":"作者說時間是「傑出的編輯」，那些沒寫成的遊記交給時間處理，最後可能發現不寫也罷。意思是經過時間沉澱，自然會知道什麼才值得寫。","goal":"能理解文意","pr":72},{"id":"114-chinese-12","y":"114","n":12,"img":"114_chinese_q12","pk":"114_chinese","ans":"C","exp":"「我清楚明白」後面接的是明白的內容：「科學需要人文的關懷，而文學需要理性的自覺」，用來提示下文的冒號最適合放在丙。","goal":"能依語境評斷標點符號使用的適切性","pr":71},{"id":"114-chinese-13","y":"114","n":13,"img":"114_chinese_q13","pk":"114_chinese","ans":"C","exp":"(C)「延宕」是拖延，「竣工」是完工，使用正確。(A)「淪為」用於變壞，應為「傳為佳話」；(B)應為「竟然」；(D)應為「多虧」。","goal":"能依語境評斷語詞使用的適切性","pr":57},{"id":"114-chinese-14","y":"114","n":14,"img":"114_chinese_q14","pk":"114_chinese","ans":"A","exp":"(A)揶揄的「揶」讀ㄧㄝˊ，正確。(B)晾讀ㄌㄧㄤˋ；(C)藩讀ㄈㄢ；(D)栽讀ㄗㄞ。","goal":"能記憶常用字的字音","pr":55},{"id":"114-chinese-15","y":"114","n":15,"img":"114_chinese_q15","pk":"114_chinese","ans":"A","exp":"文中引魯迅說此書「亦頗有從唐傳奇轉化而出者」，可見有些唐傳奇是蒲松齡寫作的來源。(B)能找到原型的約百篇，找不到的超過全書一半；(C)能找到原型的是短篇小說；(D)短篇小說長達數千言。","goal":"能理解文意","pr":61},{"id":"114-chinese-16","y":"114","n":16,"img":"114_chinese_q16","pk":"114_chinese","ans":"A","exp":"(A)「有志竟成」正確。(B)應為「趕盡殺絕」；(C)應為「情不自禁」；(D)應為「眼不見為淨」。","goal":"能記憶常用字的字形","pr":52},{"id":"114-chinese-17","y":"114","n":17,"img":"114_chinese_q17","pk":"114_chinese","ans":"C","exp":"「遺恨濃」是抽象的情感，用「碧波流不斷」的江水具體表現遺恨綿延不絕。(A)濃、重、鐘、朧、空、紅、風、中都押平聲韻；(B)下片也是寫景抒情；(D)綠蕪是寫春天已過，並非反襯。","goal":"能分析文本的寫作手法","pr":51},{"id":"114-chinese-18","y":"114","n":18,"img":"114_chinese_q18","pk":"114_chinese","ans":"D","exp":"作者扣門沒人應，「欲去問西家」，西家的人「報道山中去」，所以作者見到了陸鴻漸的鄰居。(A)是桑麻農地，不荒蕪；(B)菊花「未著花」；(C)陸鴻漸要到太陽西斜才回來，作者沒見到他。","goal":"能理解文意","pr":59},{"id":"114-chinese-19","y":"114","n":19,"img":"114_chinese_q19","pk":"114_chinese","ans":"A","exp":"(A)「不可名狀」指無法用言語形容，用來形容戰爭的慘烈正確。(B)「不以為意」是不在意，和「表面上毫不在乎」不能用「但」轉折；(C)「不言而喻」是不用說就明白；(D)「不置可否」是不表示意見，不會讓人有明確方向。","goal":"能依語境評斷詞語使用的適切性","pr":61},{"id":"114-chinese-20","y":"114","n":20,"img":"114_chinese_q20","pk":"114_chinese","ans":"D","exp":"劉基把換丞相比喻成換柱子，「須得大木」，若綁小木頭來做，很快就倒。意思是李善長是能撐住國家的大木，自己只是小木，所以李善長比自己更適合當丞相。(A)是李善長多次想害劉基；(B)太祖想讓劉基取代李善長。","goal":"能理解文意","pr":51},{"id":"114-chinese-21","y":"114","n":21,"img":"114_chinese_q21","pk":"114_chinese","ans":"D","exp":"單淘汰制下，在同一半區的兩隊不可能同時進冠軍賽。(A)阿根廷、巴西都在左半區；(B)荷蘭和澳大利亞在8強前就會碰頭，澳大利亞不可能得季軍；(C)法國、西班牙都在右半區。(D)克羅埃西亞（左）、摩洛哥（右）可在冠軍賽相遇，塞內加爾可在右半區四強輸給摩洛哥後再贏得季軍。","goal":"能根據文本推論","pr":61},{"id":"114-chinese-22","y":"114","n":22,"img":"114_chinese_q22","pk":"114_chinese","ans":"B","exp":"作者給賣餅者一萬錢增加本錢，後來賣餅者不唱歌了，說「本流既大，所謀益增，不暇唱曲矣」，資本變大、要忙的事變多，沒空唱歌。(A)作者是借錢給他，用餅慢慢抵；(D)他仍繼續賣餅。","goal":"能理解文意","pr":51},{"id":"114-chinese-23","y":"114","n":23,"img":"114_chinese_q23","pk":"114_chinese","ans":"D","exp":"文中說遠方戍卒「不習地勢而心畏胡」，而招募的居民保衛家園「赴胡不避死」，所以遠卒畏懼胡人、屯戍的居民不畏懼。(A)遠卒「一歲而更」，屯民久居；(B)室屋、田器、衣食都是給屯民的；(C)遠卒不熟悉地勢。","goal":"能理解文意","pr":43},{"id":"114-chinese-24","y":"114","n":24,"img":"114_chinese_q24","pk":"114_chinese","ans":"B","exp":"文中說後來才知道《碧雲騢》「乃魏泰所為，嫁之聖俞也」，是魏泰寫的，卻栽贓給梅聖俞，所以應非梅聖俞所作。(A)范文正是被揭發的人；(C)官運不達的說法是指梅聖俞，且是誤傳；(D)作者肯定歐陽脩不記人過惡。","goal":"能指出作者的觀點","pr":30},{"id":"114-chinese-25","y":"114","n":25,"img":"114_chinese_q25","pk":"114_chinese","ans":"B","pimg":"114_chinese_p25","grp":"114-chinese-25
