10-english-41","y":"110","n":41,"img":"110_english_q41","pk":"110_english","ans":"A","pimg":"110_english_p38","grp":"110-english-38～41"},{"id":"111-english-1","y":"111","n":1,"img":"111_english_q01","pk":"111_english","ans":"A"},{"id":"111-english-2","y":"111","n":2,"img":"111_english_q02","pk":"111_english","ans":"A"},{"id":"111-english-3","y":"111","n":3,"img":"111_english_q03","pk":"111_english","ans":"C"},{"id":"111-english-4","y":"111","n":4,"img":"111_english_q04","pk":"111_english","ans":"C"},{"id":"111-english-5","y":"111","n":5,"img":"111_english_q05","pk":"111_english","ans":"B","exp":"老師要求「必須」留下來完成作業，要用表示義務的 had to（have to 的過去式）。(A) 沒能做到；(C) 希望；(D) 過去習慣，都不符合「被老師要求」的語意。"},{"id":"111-english-6","y":"111","n":6,"img":"111_english_q06","pk":"111_english","ans":"A","exp":"make a choice 是固定搭配，「做選擇」；Kevin 只能在包包和鞋子中選一樣，所以是 hard choice。(B) gift 是禮物、(C) rule 是規則、(D) trick 是把戲，都不能搭配 make。"},{"id":"111-english-7","y":"111","n":7,"img":"111_english_q07","pk":"111_english","ans":"B"},{"id":"111-english-8","y":"111","n":8,"img":"111_english_q08","pk":"111_english","ans":"B","exp":"It takes + 人 + 時間 + to V 是「花時間做某事」的句型，所以空格要用 to prepare。(A) 原形、(C) 動名詞、(D) 過去分詞都不能接在 lots of time 後面表示目的。"},{"id":"111-english-9","y":"111","n":9,"img":"111_english_q09","pk":"111_english","ans":"A"},{"id":"111-english-10","y":"111","n":10,"img":"111_english_q10","pk":"111_english","ans":"D"},{"id":"111-english-11","y":"111","n":11,"img":"111_english_q11","pk":"111_english","ans":"C"},{"id":"111-english-12","y":"111","n":12,"img":"111_english_q12","pk":"111_english","ans":"B","exp":"颱風離開後仍看不到太陽，是因為更大的雨「緊接著」會來，用 follow（跟著來）最合理。(A) catch 是接住或趕上；(C) move 是移動；(D) stop 是停止，意思都相反或不通。"},{"id":"111-english-13","y":"111","n":13,"img":"111_english_q13","pk":"111_english","ans":"D","exp":"弟弟「正要出門」吃晚餐時我剛好到家，過去某個時間點正在進行或即將發生的動作，用過去進行式 was going out。(A) 是現在式；(C) 現在完成式不能搭配 Yesterday；(B) 單純過去式則表示他已出門，就無法邀我同行。"},{"id":"111-english-14","y":"111","n":14,"img":"111_english_q14","pk":"111_english","ans":"C"},{"id":"111-english-15","y":"111","n":15,"img":"111_english_q15","pk":"111_english","ans":"B"},{"id":"111-english-16","y":"111","n":16,"img":"111_english_q16","pk":"111_english","ans":"C","exp":"saw a woman get in his car and drive away：get 與 drive 是 see 後面並列的動作，所以用 and 連接，且 saw 的受詞後面接原形動詞，要用 and drive。(B) 缺少連接詞；(D) drove 時態不對，不能與原形 get 並列。"},{"id":"111-english-17","y":"111","n":17,"img":"111_english_q17","pk":"111_english","ans":"D","exp":"who 指的是 the little girl，女孩是「被帶走」，要用被動語態；且是過去發生的事，所以用過去式被動 was taken away。(A) 是主動；(B) 缺 be 動詞；(C) 現在完成式是主動語態。"},{"id":"111-english-18","y":"111","n":18,"img":"111_english_q18","pk":"111_english","ans":"C","exp":"我們錯過的是「剛才那班」特定的公車，要用代名詞 it 指代前面提到的特定事物。(A) another 是另一個；(C) one 泛指任何一個同類；(D) them 是複數，與 the bus 不符。"},{"id":"111-english-19","y":"111","n":19,"img":"111_english_q19","pk":"111_english","ans":"A"},{"id":"111-english-20","y":"111","n":20,"img":"111_english_q20","pk":"111_english","ans":"D","exp":"故事中 Josh 說「Why are they trolling me like this?」，他以為大家想聽他的看法，結果得到的卻是惡意留言，所以 trolling 是在網路上寫東西傷人或惹人生氣。(A) 唱歌慶祝、(B) 使移動、(C) 拖釣線，都與上下文無關。"},{"id":"111-english-21","y":"111","n":21,"img":"111_english_q21","pk":"111_english","ans":"C","pimg":"111_english_p21","grp":"111-english-21～22"},{"id":"111-english-22","y":"111","n":22,"img":"111_english_q22","pk":"111_english","ans":"C","pimg":"111_english_p21","grp":"111-english-21～22","exp":"廣告要求明信片要寫姓名、生日、電話、電子郵件、最喜愛的茶，並貼兩張茶杯圖。Jason 的明信片已有姓名、電話、電子郵件、喜愛的茶與兩張圖，只缺生日。(B) 地址是收件人的地址，並未要求寄件人寫。"},{"id":"111-english-23","y":"111","n":23,"img":"111_english_q23","pk":"111_english","ans":"D","pimg":"111_english_p23","grp":"111-english-23～24"},{"id":"111-english-24","y":"111","n":24,"img":"111_english_q24","pk":"111_english","ans":"C","pimg":"111_english_p23","grp":"111-english-23～24","exp":"這份「隱藏在食物與飲料中的糖」清單，列出各種食物含糖量，讓人發現自己不知不覺吃進超過每日建議的糖。(A) 糖對身體的傷害已在另一區塊說明；(B)、(D) 圖表都沒有提到。"},{"id":"111-english-25","y":"111","n":25,"img":"111_english_q25","pk":"111_english","ans":"A","pimg":"111_english_p25","grp":"111-english-25～26"},{"id":"111-english-26","y":"111","n":26,"img":"111_english_q26","pk":"111_english","ans":"C","pimg":"111_english_p25","grp":"111-english-25～26","exp":"A to Z 是從字母 A 到 Z 的意思，引申為「從頭到尾、全部」。文中 Darrell 在網站上找到做巧克力蛋糕「從選巧克力到烤蛋糕到做糖花」的完整過程，所以是學到關於它的一切。"},{"id":"111-english-27","y":"111","n":27,"img":"111_english_q27","pk":"111_english","ans":"A","pimg":"111_english_p27","grp":"111-english-27～29"},{"id":"111-english-28","y":"111","n":28,"img":"111_english_q28","pk":"111_english","ans":"D","pimg":"111_english_p27","grp":"111-english-27～29","exp":"文章最後說，對於「喜歡運動、卻太忙沒時間去健身房的人」，Tabata 可能就是答案；另外也說很少運動或有心臟問題的人可能不適合。所以 (B)、(C) 不對，適合的是已經有運動習慣的人。"},{"id":"111-english-29","y":"111","n":29,"img":"111_english_q29","pk":"111_english","ans":"B","pimg":"111_english_p27","grp":"111-english-27～29"},{"id":"111-english-30","y":"111","n":30,"img":"111_english_q30","pk":"111_english","ans":"D","pimg":"111_english_p30","grp":"111-english-30～32"},{"id":"111-english-31","y":"111","n":31,"img":"111_english_q31","pk":"111_english","ans":"A","pimg":"111_english_p30","grp":"111-english-30～32","exp":"this 指的是前一句：工作時數愈長，愈有機會加薪與升遷，於是「長時間工作」成了證明自己勤奮的方式，作者認為這種觀念必須改變。(B)、(C) 只是現象，(D) 是研究結果，都不是被批評的對象。"},{"id":"111-english-32","y":"111","n":32,"img":"111_english_q32","pk":"111_english","ans":"D","pimg":"111_english_p30","grp":"111-english-30～32","exp":"由圖二可看出，工作約 2,200 小時時，男女加薪與升遷的機會都約 13%，幾乎相同。(A) 圖一沒有區分男女；(B) 圖一數字有升有降，並非逐年增加；(C) 多數時候是女性機會較高。"},{"id":"111-english-33","y":"111","n":33,"img":"111_english_q33","pk":"111_english","ans":"D","pimg":"111_english_p33","grp":"111-english-33～36","exp":"1961 年英國部分加入後，國家改名為 Federal Republic of Cameroon，所以 1962 年應是一個整體的聯邦共和國，沒有再分成兩區。(A) 是 1919 年以前的名稱；(B) 是 1919-1960 年分成兩部分；(C) 是 1960 年英國部分尚未加入。"},{"id":"111-english-34","y":"111","n":34,"img":"111_english_q34","pk":"111_english","ans":"B","pimg":"111_english_p33","grp":"111-english-33～36","exp":"文中說英語使用者在政府機關難找工作、常被要求說法語，所以對政府感到憤怒，且決定要為自己奮鬥。resentful 是「憤恨的」，意思接近 angry。(A) 難過、(C) 小心、(D) 擔心，都不夠強烈。"},{"id":"111-english-35","y":"111","n":35,"img":"111_english_q35","pk":"111_english","ans":"D","pimg":"111_english_p33","grp":"111-english-33～36","exp":"Ambazonia 是英語使用者宣布成立的新國家，但政府派警察阻止會議，顯示政府不承認它是一個國家。(C) 是 Ambazonia 自己想脫離，並非政府的想法；(A)、(B) 文中沒有提到。"},{"id":"111-english-36","y":"111","n":36,"img":"111_english_q36","pk":"111_english","ans":"B","pimg":"111_english_p33","grp":"111-english-33～36","exp":"作者介紹歷史，是要說明為什麼雖然英語在現代是取得權力的方式，Cameroon 的英語使用者卻因為政府長期掌握在說法語的人手中，而擁有較少權力。(A) 文章開頭說這在 Cameroon 並不成立；(C)、(D) 只是歷史中的細節。"},{"id":"111-english-37","y":"111","n":37,"img":"111_english_q37","pk":"111_english","ans":"C","pimg":"111_english_p37","grp":"111-english-37～39"},{"id":"111-english-38","y":"111","n":38,"img":"111_english_q38","pk":"111_english","ans":"B","pimg":"111_english_p37","grp":"111-english-37～39"},{"id":"111-english-39","y":"111","n":39,"img":"111_english_q39","pk":"111_english","ans":"A","pimg":"111_english_p37","grp":"111-english-37～39"},{"id":"111-english-40","y":"111","n":40,"img":"111_english_q40","pk":"111_english","ans":"D","pimg":"111_english_p40","grp":"111-english-40～43"},{"id":"111-english-41","y":"111","n":41,"img":"111_english_q41","pk":"111_english","ans":"C","pimg":"111_english_p40","grp":"111-english-40～43","exp":"mistake 的字母是 m, i, s, t, a, k, e，重新排列後可得到 it makes。(A) take sit 沒有 m 且多一個 t；(B) Ms Easy 多了 y；(D) me steak 多一個 e 且少了 i。字母必須全部用到、不多不少。"},{"id":"111-english-42","y":"111","n":42,"img":"111_english_q42","pk":"111_english","ans":"A","pimg":"111_english_p40","grp":"111-english-40～43","exp":"restaurant 變成 Eat rats, run! 這種句子很奇怪，所以變位字有時會變成「奇怪的」意思。(B) 困難、(C) 好吃、(D) 重要，都與上下文不合。"},{"id":"111-english-43","y":"111","n":43,"img":"111_english_q43","pk":"111_english","ans":"A","pimg":"111_english_p40","grp":"111-english-40～43","exp":"後文說迴文可用來學數學與作曲，變位字還能用來隱藏重要的研究，表示它們不只是遊戲。(A) more than just games 最符合；(B)、(C)、(D) 文中都沒有提到。"},{"id":"112-english-1","y":"112","n":1,"img":"112_english_q01","pk":"112_english","ans":"B"},{"id":"112-english-2","y":"112","n":2,"img":"112_english_q02","pk":"112_english","ans":"D"},{"id":"112-english-3","y":"112","n":3,"img":"112_english_q03","pk":"112_english","ans":"D"},{"id":"112-english-4","y":"112","n":4,"img":"112_english_q04","pk":"112_english","ans":"B","exp":"感官動詞 watch 的句型是 watch + 受詞 + 原形動詞或 V-ing（看到對方正在做某事）。選項中只有 dancing 符合。(A) 過去式、(C) 現在完成式、(D) to dance 都不能放在受詞後面。"},{"id":"112-english-5","y":"112","n":5,"img":"112_english_q05","pk":"112_english","ans":"A"},{"id":"112-english-6","y":"112","n":6,"img":"112_english_q06","pk":"112_english","ans":"B","exp":"Rex 沒感覺到地震，是因為地震發生「當時」他正在公園慢跑，描述過去某個時間點正在進行的動作，要用過去進行式 was jogging。(A) 只說慢跑過，沒有「正在」的意思；(C) 現在完成式與 this morning 的過去時間不合。"},{"id":"112-english-7","y":"112","n":7,"img":"112_english_q07","pk":"112_english","ans":"A","exp":"think about 的 about 是介系詞，後面要接動名詞（V-ing）。語意上，在同一家店做了十年，從沒想過「換」工作，所以選 changing。(B) finding、(D) starting 語意不通。"},{"id":"112-english-8","y":"112","n":8,"img":"112_english_q08","pk":"112_english","ans":"C"},{"id":"112-english-9","y":"112","n":9,"img":"112_english_q09","pk":"112_english","ans":"C","exp":"前句是命令（Don't go away），後句說食物可能燒焦，是「否則」的意思，要用 or。(A) but 表轉折；(B) if 後面要接條件；(D) so 表結果，都不合。"},{"id":"112-english-10","y":"112","n":10,"img":"112_english_q10","pk":"112_english","ans":"D","exp":"空格後是完整子句 he was kicked off the soccer team，而且後面說「沒人給他好理由」，所以他想知道的是「為什麼」被踢出球隊。(C) whether 是「是否」，不能搭配後面的 good reason。"},{"id":"112-english-11","y":"112","n":11,"img":"112_english_q11","pk":"112_english","ans":"D","exp":"Jenny 四十歲沒工作又常惹麻煩，對父母來說是 a headache（令人頭痛的人）。這是常見的比喻用法，不是真的頭痛。(A) daughter 事實上沒錯但語意不夠；(B) example 是「榜樣」，(C) gift 是「禮物」，都與麻煩相反。"},{"id":"112-english-12","y":"112","n":12,"img":"112_english_q12","pk":"112_english","ans":"C","exp":"後面說「所以他們得在星期五前寫完功課」，表示露營是這個週末「即將」要做的事，用 are going to 的進行式表示未來。(A)、(B) 是過去式；(D) 現在完成式表示已經去了，語意不合。"},{"id":"112-english-13","y":"112","n":13,"img":"112_english_q13","pk":"112_english","ans":"C","exp":"Doraemon 的耳朵是「被」老鼠咬掉的，主詞 ears 是複數且是被動，所以用 were bitten。since 後面接過去式或過去被動表示「自從那件事發生」。(D) have bitten 是主動語態，且助動詞不合。"},{"id":"112-english-14","y":"112","n":14,"img":"112_english_q14","pk":"112_english","ans":"C","exp":"if 條件句中，主要子句要用 will 表示未來。there be 句型的 be 動詞要用 be 原形，所以是 there will be，主詞是後面的 more fun（不可數名詞）。(A) are 時態不對；(B)、(D) 的 have 不能用在 there 後面。"},{"id":"112-english-15","y":"112","n":15,"img":"112_english_q15","pk":"112_english","ans":"D"},{"id":"112-english-16","y":"112","n":16,"img":"112_english_q16","pk":"112_english","ans":"C","exp":"前面說晴天要看清楚都「不容易」，後面 even less（更不…）是延伸同一個方向，所以要接 possible：陰天更不可能看到。選 difficult 會變成「更不困難」，語意相反。"},{"id":"112-english-17","y":"112","n":17,"img":"112_english_q17","pk":"112_english","ans":"C"},{"id":"112-english-18","y":"112","n":18,"img":"112_english_q18","pk":"112_english","ans":"B","exp":"Jane 的店生意已經不好，對面又開新超市，只會讓情況「更糟」。makes things worse 表示讓事情變得更糟。(A) easier、(D) more convenient 是正面的意思；(C) more boring 與生意無關。"},{"id":"112-english-19","y":"112","n":19,"img":"112_english_q19","pk":"112_english","ans":"D","exp":"空格前是 was，後面直接接 pulled him out，所以空格要補「先行詞 + 關係代名詞」：the one who（就是那個把他拉出著火車子的人）。(A) who 前面沒有先行詞；(B) the one 後面缺連接，pulled 沒有主詞；(C) the one she 會讓 pulled 多出一個主詞，句子不通。"},{"id":"112-english-20","y":"112","n":20,"img":"112_english_q20","pk":"112_english","ans":"C"},{"id":"112-english-21","y":"112","n":21,"img":"112_english_q21","pk":"112_english","ans":"A"},{"id":"112-english-22","y":"112","n":22,"img":"112_english_q22","pk":"112_english","ans":"B","exp":"句中 that just came out on the market 是修飾 medicine 的子句，整句主詞是 The new medicine，還缺一個動詞。新藥剛上市、已經救了數千條人命，用現在完成式 has saved。(A) and saved 時態與前面不一致；(C)、(D) 不是完整動詞。"},{"id":"112-english-23","y":"112","n":23,"img":"112_english_q23","pk":"112_english","ans":"D","exp":"前面說現在「常常想起」和 Pip 的日子，表示 Pip 已經不在，牠過去常常來坐在我旁邊，要用 used to + 原形。(A)、(B) 表示現在或未來的習慣；(C) 現在完成式也不合。"},{"id":"112-english-24","y":"112","n":24,"img":"112_english_q24","pk":"112_english","ans":"B","pimg":"112_english_p24","grp":"112-english-24～25","exp":"兩個 Garden Sandwich 是 $160，Autumn Wind $60，Winter Snow $70，總共 $290。集滿 15 星可免費換一杯 $60 的飲料，要折掉 $60（不能折 $70 的 Winter Snow），所以付 $230。"},{"id":"112-english-25","y":"112","n":25,"img":"112_english_q25","pk":"112_english","ans":"B","pimg":"112_english_p24","grp":"112-english-24～25","exp":"營業時間是 2:00 到 8:00 pm，星期一和每月第二個星期天公休。(A) 8:30 pm 已打烊；(C) 8 月 13 日是第二個星期日，而且還要去家族旅行；(D) 8 月 28 日是星期一。8 月 11 日是星期五，5:00 pm 在營業時間內，行事曆上也沒有安排活動。"},{"id":"112-english-26","y":"112","n":26,"img":"112_english_q26","pk":"112_english","ans":"A","pimg":"112_english_p26","grp":"112-english-26～27","exp":"筆記中說受傷的小鳥要保暖，而且「不要餵食」（don't give it any food），所以先餵食再送醫院是錯誤做法。(B)、(C)、(D) 都與筆記內容一致。"},{"id":"112-english-27","y":"112","n":27,"img":"112_english_q27","pk":"112_english","ans":"A","pimg":"112_english_p26","grp":"112-english-26～27"},{"id":"112-english-28","y":"112","n":28,"img":"112_english_q28","pk":"112_english","ans":"C","pimg":"112_english_p28","grp":"112-english-28～29"},{"id":"112-english-29","y":"112","n":29,"img":"112_english_q29","pk":"112_english","ans":"D","pimg":"112_english_p28","grp":"112-english-28～29","exp":"看圖表，南亞和東南亞在 Stage 4 是 4.6%，高於另外兩區的 2.4% 與 2.2%。(A) 南亞和東南亞最高的是 Stage 2；(B) 歐洲 Stage 3 是 3.9%，比另外兩區都高；(C) 北美洲和大洋洲 Stage 1 是 10.5%，低於歐洲的 11.3%。"},{"id":"112-english-30","y":"112","n":30,"img":"112_english_q30","pk":"112_english","ans":"B","pimg":"112_english_p30","grp":"112-english-30～32"},{"id":"112-english-31","y":"112","n":31,"img":"112_english_q31","pk":"112_english","ans":"A","pimg":"112_english_p30","grp":"112-english-30～32"},{"id":"112-english-32","y":"112","n":32,"img":"112_english_q32","pk":"112_english","ans":"A","pimg":"112_english_p30","grp":"112-english-30～32","exp":"文章最後說，如果蚊子被雨滴打到時飛得太低，就沒時間飛離雨滴，會撞到地面而死。(D) 往下掉大約 6 公分後蚊子就會飛走，是安全的做法，並不危險；(C) 文章說每 20 秒被打到一次，並沒有因為次數多而死亡。"},{"id":"112-english-33","y":"112","n":33,"img":"112_english_q33","pk":"112_english","ans":"D","pimg":"112_english_p33","grp":"112-english-33～35"},{"id":"112-english-34","y":"112","n":34,"img":"112_english_q34","pk":"112_english","ans":"C","pimg":"112_english_p33","grp":"112-english-33～35","exp":"文章說手稿在 1867 年才被發現，是貝多芬過世四十年後，所以手稿是在他死後被找到的。(A) 文章沒說最早出現在歌劇中；(B) 真正的 Elise 是誰沒人知道；(D) 手稿由 Malfatti 留給家人，沒有說在維也納市政府手上。"},{"id":"112-english-35","y":"112","n":35,"img":"112_english_q35","pk":"112_english","ans":"B","pimg":"112_english_p33","grp":"112-english-33～35","exp":"第一個故事說 Röckel 曾在貝多芬的歌劇中演唱，兩人成為很好的朋友，所以她是貝多芬的好友。(A) 只有 Röckel 被貝多芬叫 Elise；(C) 把 Elise 寫錯的是後來抄手稿的人；(D) Barensfeld 是跟 Malfatti 學鋼琴，不是貝多芬的學生。"},{"id":"112-english-36","y":"112","n":36,"img":"112_english_q36","pk":"112_english","ans":"D","pimg":"112_english_p36","grp":"112-english-36～38"},{"id":"112-english-37","y":"112","n":37,"img":"112_english_q37","pk":"112_english","ans":"D","pimg":"112_english_p36","grp":"112-english-36～38","exp":"第三段說玩不同的玩具能讓孩子發現自己的興趣和擅長的事，如果只玩一種，就可能失去這個機會，所以是會錯過發現自己真正喜歡什麼的機會。(C) 文章說不同的玩具會教孩子不同的東西，不是不能學習。"},{"id":"112-english-38","y":"112","n":38,"img":"112_english_q38","pk":"112_english","ans":"B","pimg":"112_english_p36","grp":"112-english-36～38","exp":"第三段先說「不同的玩具教孩子不同的事」，再用「洋娃娃幫助語言能力、積木有助於數學和科學」當作例子。(A) 是主要想法；(C)、(D) 是在說明後果與擔心，不是舉例。"},{"id":"112-english-39","y":"112","n":39,"img":"112_english_q39","pk":"112_english","ans":"B","pimg":"112_english_p39","grp":"112-english-39～41"},{"id":"112-english-40","y":"112","n":40,"img":"112_english_q40","pk":"112_english","ans":"C","pimg":"112_english_p39","grp":"112-english-39～41"},{"id":"112-english-41","y":"112","n":41,"img":"112_english_q41","pk":"112_english","ans":"B","pimg":"112_english_p39","grp":"112-english-39～41","exp":"文章說她在 Sri Lanka 失去左眼，但這從沒阻止她，仍去危險的地方，所以經驗並沒有改變她的報導方式。(A) 沒有提到她因為念書離開工作；(C) 她是在所住的房子被攻擊時喪生；(D) 她在 Yale 念書時就決定要當記者。"},{"id":"112-english-42","y":"112","n":42,"img":"112_english_q42","pk":"112_english","ans":"A","pimg":"112_english_p42","grp":"112-english-42～43"},{"id":"112-english-43","y":"112","n":43,"img":"112_english_q43","pk":"112_english","ans":"A","pimg":"112_english_p42","grp":"112-english-42～43","exp":"前面提到她的祖父說 plimsolls，而女兒說 kicks 或 vans，而她自己說 sneakers，是不同年代的人用不同的說法，所以用詞也顯示出一個人「多大年紀」。(C) 如果是成長地點，這家人都住在紐約，不會有差別。"},{"id":"113-english-1","y":"113","n":1,"img":"113_english_q01","pk":"113_english","ans":"A"},{"id":"113-english-2","y":"113","n":2,"img":"113_english_q02","pk":"113_english","ans":"C"},{"id":"113-english-3","y":"113","n":3,"img":"113_english_q03","pk":"113_english","ans":"B"},{"id":"113-english-4","y":"113","n":4,"img":"113_english_q04","pk":"113_english","ans":"B"},{"id":"113-english-5","y":"113","n":5,"img":"113_english_q05","pk":"113_english","ans":"D"},{"id":"113-english-6","y":"113","n":6,"img":"113_english_q06","pk":"113_english","ans":"D"},{"id":"113-english-7","y":"113","n":7,"img":"113_english_q07","pk":"113_english","ans":"B","exp":"表示「某人也一樣」的肯定倒裝句型是 so + 助動詞 + 主詞。前句的動詞是一般動詞 likes，所以助動詞用 does；但主詞是 I，要配 do：so do I。(A) am 要搭配 be 動詞的句子。"},{"id":"113-english-8","y":"113","n":8,"img":"113_english_q08","pk":"113_english","ans":"D","exp":"前句說冰箱「現在不該」有噪音，後句 but if it still does（如果它「仍然」會），表示現在還繼續發出噪音。already 表示「已經」，finally 表示「終於」，語意都不通。"},{"id":"113-english-9","y":"113","n":9,"img":"113_english_q09","pk":"113_english","ans":"C"},{"id":"113-english-10","y":"113","n":10,"img":"113_english_q10","pk":"113_english","ans":"D"},{"id":"113-english-11","y":"113","n":11,"img":"113_english_q11","pk":"113_english","ans":"C","exp":"until 引導的時間副詞子句中，要用現在式代替未來式，所以 until he finds an apartment。(A)、(B) 在時間子句中不可用 will / would；(D) 過去式時態不合。"},{"id":"113-english-12","y":"113","n":12,"img":"113_english_q12","pk":"113_english","ans":"A","exp":"空格前是 Students，後面是 to go，中間要補一個關係代名詞，修飾 students（想去的學生）：Students who want to go。(C)、(D) 會讓句子缺少動詞或意思不通；(B) 沒有連接詞，句型錯誤。"},{"id":"113-english-13","y":"113","n":13,"img":"113_english_q13","pk":"113_english","ans":"A"},{"id":"113-english-14","y":"113","n":14,"img":"113_english_q14","pk":"113_english","ans":"A","exp":"前半說她花了好幾天計畫邀請 Charlie，後半卻說見面時一句話也說不出來，前後語意相反，要用表示轉折的 but。so 是因果，if 是假設，or 是選擇。"},{"id":"113-english-15","y":"113","n":15,"img":"113_english_q15","pk":"113_english","ans":"C","exp":"因為她「打算這個星期六才會去看」，所以到現在還沒看過，要用現在完成式否定 haven't seen。(B) 現在式表示習慣；(A) 表示正在看；(D) won't see 表示「將不會看」，與 I'll probably watch it 矛盾。"},{"id":"113-english-16","y":"113","n":16,"img":"113_english_q16","pk":"113_english","ans":"D"},{"id":"113-english-17","y":"113","n":17,"img":"113_english_q17","pk":"113_english","ans":"C","exp":"她原本想去鄉下避暑，但一到那裡「開始想念」城市的噪音，才有轉折意味，所以 miss 是「想念」。enjoy 和 mind 的意思不合，notice 則是「注意到」，沒有思念的含意。"},{"id":"113-english-18","y":"113","n":18,"img":"113_english_q18","pk":"113_english","ans":"D","exp":"老闆知道你走路五分鐘就到公司，所以用「塞車」當遲到的藉口是「最糟的」（worst）藉口，因為一眼就被識破。其他選項都無法表達這個諷刺的意思。"},{"id":"113-english-19","y":"113","n":19,"img":"113_english_q19","pk":"113_english","ans":"A","exp":"主詞是 The housework（不可數名詞，視為單數），而且意思是「家事被分擔」，所以用被動語態 is shared。(B) are 與單數主詞不合；(C)、(D) 是主動語態，意思變成家事去分擔別人，不通。"},{"id":"113-english-20","y":"113","n":20,"img":"113_english_q20","pk":"113_english","ans":"C","exp":"空格要補的是「我的牙醫」，也就是 my dentist。mine 是所有格代名詞，等於 my dentist，避免重複。(A) I 和 (D) myself 都指「我」自己，不是牙醫；(B) me 不能當主詞。"},{"id":"113-english-21","y":"113","n":21,"img":"113_english_q21","pk":"113_english","ans":"B","exp":"媽媽問「報告寫完了嗎？」，琳達說「我今天下午已經做了大部分」，是過去已經發生的事，用過去式 did（代替前面的 finished）。(A) 是過去未來式；(D) 是未來式；(C) 是過去進行式，與後半句 I'll finish it by Friday 的語氣不符。"},{"id":"113-english-22","y":"113","n":22,"img":"113_english_q22","pk":"113_english","ans":"D","pimg":"113_english_p22","grp":"113-english-22～23"},{"id":"113-english-23","y":"113","n":23,"img":"113_english_q23","pk":"113_english","ans":"C","pimg":"113_english_p22","grp":"113-english-22～23"},{"id":"113-english-24","y":"113","n":24,"img":"113_english_q24","pk":"113_english","ans":"C","pimg":"113_english_p24","grp":"113-english-24～25","exp":"四種麵包出爐時間：白吐司 10:30am、農家麵包 4:30pm、貝果 11:30am、猶太辮子麵包 3:30pm。要同時買齊，必須等到最晚出爐的農家麵包 4:30pm 之後，選項中最早的時間是 5:00pm。4:00pm 時農家麵包還沒出爐。"},{"id":"113-english-25","y":"113","n":25,"img":"113_english_q25","pk":"113_english","ans":"B","pimg":"113_english_p24","grp":"113-english-24～25","exp":"營業時間平日到 9pm，麵包 8pm 後半價，剛好在打烊前一小時；週末 8pm 打烊、7pm 後半價，也是一小時。(A) 每天都營業，是七天；(C) 可頌和椒鹽卷餅只在週五賣；(D) 會員是省 10%，不是省 100 元。"},{"id":"113-english-26","y":"113","n":26,"img":"113_english_q26","pk":"113_english","ans":"A","pimg":"113_english_p26","grp":"113-english-26～27"},{"id":"113-english-27","y":"113","n":27,"img":"113_english_q27","pk":"113_english","ans":"D","pimg":"113_english_p26","grp":"113-english-26～27","exp":"從地圖可看到，市集所在的 Garden Square 旁邊有捷運站，位置在 Koala Street 一帶，所以最近的捷運站是 Koala Street Station。(A) 花市在公園另一側，中間隔著 Fox Street；(B) 市集和慶典不在同一個街區；(C) 157 號公車的站牌在 Koala Street 旁，不在 Puppy Street。"},{"id":"113-english-28","y":"113","n":28,"img":"113_english_q28","pk":"113_english","ans":"B","pimg":"113_english_p28","grp":"113-english-28～29","exp":"兩位朋友都是用幽默的方式暗示主人太小氣：一個只端上一條小魚，一個說沒有東西吃，所以朋友認為他們不願意與人分享。原文並沒有提到他們喜歡美食、交朋友或不喜歡新事物。"},{"id":"113-english-29","y":"113","n":29,"img":"113_english_q29","pk":"113_english","ans":"B","pimg":"113_english_p28","grp":"113-english-28～29"},{"id":"113-english-30","y":"113","n":30,"img":"113_english_q30","pk":"113_english","ans":"A","pimg":"113_english_p30","grp":"113-english-30～32","exp":"作者把書的修復師比喻成醫生，把大圖書館比喻成醫院，把陳先生的書店比喻成保健所，目的是說明陳先生提供什麼服務：幫人修理小毛病的書。文中並沒有談到他的未來計畫或對書的熱愛。"},{"id":"113-english-31","y":"113","n":31,"img":"113_english_q31","pk":"113_english","ans":"D","pimg":"113_english_p30","grp":"113-english-30～32","exp":"例子中的科學書是老師送的禮物，書修好後，主人彷彿回到和老師相處的時光，所以陳先生的工作能幫助人們想起過去的特別時刻。(C) 的夢想是書的來歷，而不是修書帶來的幫助；(A)、(B) 文中沒有提到。"},{"id":"113-english-32","y":"113","n":32,"img":"113_english_q32","pk":"113_english","ans":"A","pimg":"113_english_p30","grp":"113-english-30～32"},{"id":"113-english-33","y":"113","n":33,"img":"113_english_q33","pk":"113_english","ans":"A","pimg":"113_english_p33","grp":"113-english-33～35"},{"id":"113-english-34","y":"113","n":34,"img":"113_english_q34","pk":"113_english","ans":"B","pimg":"113_english_p33","grp":"113-english-33～35"},{"id":"113-english-35","y":"113","n":35,"img":"113_english_q35","pk":"113_english","ans":"A","pimg":"113_english_p33","grp":"113-english-33～35","exp":"beg to differ 的意思是客氣地表示「不同意」。這裡前一句說有些人認為難民是問題，後一句說兩位創辦人認為難民不必是問題，兩邊看法不同，所以選「他們不同意」。"},{"id":"113-english-36","y":"113","n":36,"img":"113_english_q36","pk":"113_english","ans":"B","pimg":"113_english_p36","grp":"113-english-36～39"},{"id":"113-english-37","y":"113","n":37,"img":"113_english_q37","pk":"113_english","ans":"B","pimg":"113_english_p36","grp":"113-english-36～39"},{"id":"113-english-38","y":"113","n":38,"img":"113_english_q38","pk":"113_english","ans":"C","pimg":"113_english_p36","grp":"113-english-36～39","exp":"作者先說她不同意史密斯，再舉王博士說的「把好錢丟進爛洞裡」，是用專家的話來支持她自己的看法：復育絕種動物花費大，卻沒有成果，使她的想法更清楚。"},{"id":"113-english-39","y":"113","n":39,"img":"113_english_q39","pk":"113_english","ans":"C","pimg":"113_english_p36","grp":"113-english-36～39","exp":"從作者的語氣可知她對復育絕種動物持懷疑態度：她說沒人知道牠們是否真的能回來，又說花了十年和幾百萬美元只得到幾顆死掉的蛙卵，所以她認為這件事做不到。文中沒有討論危險性。"},{"id":"113-english-40","y":"113","n":40,"img":"113_english_q40","pk":"113_english","ans":"A","pimg":"113_english_p40","grp":"113-english-40～43"},{"id":"113-english-41","y":"113","n":41,"img":"113_english_q41","pk":"113_english","ans":"B","pimg":"113_english_p40","grp":"113-english-40～43","exp":"看圖，灰色區域是實施社交距離的時間。New York 從第 2 週左右就開始，其他三個城市大約第 4 或第 5 週才開始，所以紐約開始得最早。"},{"id":"113-english-42","y":"113","n":42,"img":"113_english_q42","pk":"113_english","ans":"B","pimg":"113_english_p40","grp":"113-english-40～43","exp":"前文說 Portland 和 Denver 一開始做得不錯，但圖上灰色區域在中途中斷，之後死亡人數又上升，表示兩座城市太早停止社交距離。(C) 雖然有第二次實施，但那是死亡人數回升之後才發生，不是造成回升的原因。"},{"id":"113-english-43","y":"113","n":43,"img":"113_english_q43","pk":"113_english","ans":"D","pimg":"113_english_p40","grp":"113-english-40～43"},{"id":"114-english-1","y":"114","n":1,"img":"114_english_q01","pk":"114_english","ans":"D","exp":"看圖：飛在房子上方的有鳥、風箏和飛機，但真正「在房子上方」的是右上角的飛機（plane）。鳥停在屋頂、風箏和蝴蝶都在比房子低的地方。","goal":"用圖表表徵文意（單題）","pr":81},{"id":"114-english-2","y":"114","n":2,"img":"114_english_q02","pk":"114_english","ans":"D","exp":"後句說「現在」比較容易和人說話了，表示以前很「害羞」（shy），不敢跟人說話。","goal":"指出適合句中的單字或片語（單題）","pr":73},{"id":"114-english-3","y":"114","n":3,"img":"114_english_q03","pk":"114_english","ans":"C","e nglish","ans":"D","pimg":"english_p32","grp":"115-english-32～34","exp":"玻璃瓶被丟進海裡，經過多年變成海玻璃，再被藝術家撿來放進作品中，所以是玻璃瓶的「第二次生命」。","goal":"指出內容的主旨","pr":65},{"id":"115-english-33","y":"115","n":33,"img":"english_q33","pk":"115_english","ans":"C","pimg":"english_p32","grp":"115-english-32～34","exp":"圖4說明：在海裡經過幾十到幾百年，玻璃外層會長出像冰一樣的白色，變成海玻璃。(A)是在海底被推動時變圓，不是上岸後；(B)、(D)文中沒有提到。","goal":"在圖表中找出所需的資訊","pr":58},{"id":"115-english-34","y":"115","n":34,"img":"english_q34","pk":"115_english","ans":"A","pimg":"english_p32","grp":"115-english-32～34","exp":"最後一段說人們現在很少用玻璃做瓶子和碗，改用紙碗紙杯，所以海裡的玻璃變少，未來能找到的海玻璃也會變少。","goal":"推論文中隱含的訊息","pr":55},{"id":"115-english-35","y":"115","n":35,"img":"english_q35","pk":"115_english","ans":"A","pimg":"english_p35","grp":"115-english-35～39","exp":"後文說 You see English everywhere in Iceland，用機器人、手機、看電影都用英文，可見 prevalence 是「普遍、盛行」，英文非常常見。","goal":"根據上下文意猜測字詞的意義","pr":63},{"id":"115-english-36","y":"115","n":36,"img":"english_q36","pk":"115_english","ans":"B","pimg":"english_p35","grp":"115-english-35～39","exp":"Anna Adams 引用工程師 Helgi Atlason 和老師 Eirikur Wilson 的說法與經驗，來支持她的看法。","goal":"指出作者的目的或態度","pr":46},{"id":"115-english-37","y":"115","n":37,"img":"english_q37","pk":"115_english","ans":"B","pimg":"english_p35","grp":"115-english-35～39","exp":"第二篇提到 a language in its sickbed（別人的看法）、our first language、this beautiful language 都是在形容冰島語；a dying language 是 Dr. Clingingsmith 說明「瀕死語言」的標準，並不是用來形容冰島語。","goal":"掌握上下文意了解文章中的句法連貫：代詞指涉","pr":50},{"id":"115-english-38","y":"115","n":38,"img":"english_q38","pk":"115_english","ans":"C","pimg":"english_p35","grp":"115-english-35～39","exp":"Adams 認為冰島人可能很快放棄冰島語，是擔心的；Eggertsson 說 does the future really look that bad?，認為冰島語人數足夠、還有學校教，並不擔心。","goal":"指出作者的目的或態度","pr":56},{"id":"115-english-39","y":"115","n":39,"img":"english_q39","pk":"115_english","ans":"B","pimg":"english_p35","grp":"115-english-35～39","exp":"Adams 說冰島語使用者只有 314,000 人，人數少，所以公司不願改語言；Eggertsson 說至少要 35,000 人才安全，314,000 人已足夠。兩人都談到說冰島語的人數是否夠多。","goal":"推論文中隱含的訊息","pr":48},{"id":"115-english-40","y":"115","n":40,"img":"english_q40","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"國王沒有孩子，擔心死後國家落入壞人手中，所以「決定選一個孩子接位」。他發種子給孩子們，所以是要「選出下一任國王」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":68},{"id":"115-english-41","y":"115","n":41,"img":"english_q41","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"後文說 Wong still didn't find anything in his（他的盆裡還是什麼都沒有），所以是「好幾個月過去了，什麼都沒長出來」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":58},{"id":"115-english-42","y":"115","n":42,"img":"english_q42","pk":"115_english","ans":"B","pimg":"english_p40","grp":"115-english-40～43","exp":"Sung 是第一個告訴大家他的種子長出小植物的人，接著大家才一個個說自己的也長了，所以他是「第一個分享好消息的人」。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":49},{"id":"115-english-43","y":"115","n":43,"img":"english_q43","pk":"115_english","ans":"C","pimg":"english_p40","grp":"115-english-40～43","exp":"國王事先把種子煮過，根本不可能發芽。只有 Wong 誠實地帶著空盆子來，所以只有他「誠實」到足以當國王。","goal":"根據上下文辨認符合文意的字句（克漏字）","pr":61},{"id":"ak-english-1","y":"ak","n":1,"html":"My brother is really into ______. He plays the guitar, the piano, and the drums.","opts":["drawing","sports","music","cooking"],"ans":"C","exp":"他會彈吉他、鋼琴和打鼓，所以他熱衷的是「音樂」（music）。be into 是「熱衷於」。","topic":"字彙"},{"id":"ak-english-2","y":"ak","n":2,"html":"It's raining cats and dogs outside. Don't forget to take your ______ with you.","opts":["fan","gloves","umbrella","sunglasses"],"ans":"C","exp":"raining cats and dogs 是「下傾盆大雨」，所以要帶傘（umbrella）。","topic":"字彙"},{"id":"ak-english-3","y":"ak","n":3,"html":"Amy loves Japanese food. She has ______ to Japan three times.","opts":["be","been","go","went"],"ans":"B","exp":"現在完成式 has/have + 過去分詞。have been to 表示「去過某地（已經回來）」，所以用 been。","topic":"現在完成式"},{"id":"ak-english-4","y":"ak","n":4,"html":"This chocolate cake looks great! It ______ by my mom last night.","opts":["was made","has made","made","is made"],"ans":"A","exp":"蛋糕是「被做」的，用被動語態 be + 過去分詞；last night 是過去時間，所以用 was made。","topic":"被動語態"},{"id":"ak-english-5","y":"ak","n":5,"html":"Excuse me. Could you tell me ______ the next train will arrive?","opts":["which","when","what","who"],"ans":"B","exp":"問的是火車「什麼時候」到，間接問句用 when + 主詞 + 動詞：when the next train will arrive。","topic":"間接問句"},{"id":"ak-english-6","y":"ak","n":6,"html":"Kevin is the ______ runner in our class. Nobody runs faster than he does.","opts":["fast","fastest","faster","most fast"],"ans":"B","exp":"沒有人跑得比他快，表示他是全班「最快」的。the + 最高級：the fastest。fast 是單音節，不用 most。","topic":"最高級"},{"id":"ak-english-7","y":"ak","n":7,"html":"If it ______ tomorrow, we will stay at home and watch movies.","opts":["rained","will rain","rains","raining"],"ans":"C","exp":"表示未來可能情況的 if 子句，用現在式代替未來式：If it rains tomorrow, we will…","topic":"條件句"},{"id":"ak-english-8","y":"ak","n":8,"html":"Tom: Would you like some more tea?<br>Lisa: ______ I've had enough.","opts":["No, thanks.","Here you are.","Yes, please.","Of course."],"ans":"A","exp":"Lisa 說「我已經喝夠了」，所以要婉拒：No, thanks.","topic":"對話"},{"id":"ak-english-9","y":"ak","n":9,"html":"The movie was so ______ that I fell asleep halfway through it.","opts":["boring","scary","exciting","interesting"],"ans":"A","exp":"看到一半睡著了，表示電影很「無聊」（boring）。so…that… 表示「如此……以致於……」。","topic":"字彙"},{"id":"ak-english-10","y":"ak","n":10,"html":"Neither Ben nor his sisters ______ at home right now. They are all at school.","opts":["is","was","are","be"],"ans":"C","exp":"neither A nor B 的動詞和較靠近的 B 一致；his sisters 是複數，加上 right now 用現在式，所以用 are。","topic":"主詞動詞一致"},{"id":"ak-english-11","y":"ak","n":11,"html":"Why did Owen buy new running shoes?","opts":["He joined a running team.","His old ones were too small.","His grandma asked him to.","They were on sale."],"ans":"B","exp":"信中說 because my old ones were too small，舊鞋太小了。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-12","y":"ak","n":12,"html":"What do we know about the bike?","opts":["He will ride it to the science fair.","Owen has already bought it.","Grandma gave it to him as a gift.","His mom will pay for half of it if he saves enough."],"ans":"D","exp":"Mom says if I save half of the price by December, she'll pay the other half：如果他在12月前存到一半，媽媽會付另一半。他還在存錢，還沒買。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-13","y":"ak","n":13,"html":"What is the main purpose of Owen's letter?","opts":["To invite Grandma to the science fair.","To ask Grandma for more money.","To explain how to build a robot.","To thank Grandma and share his news."],"ans":"D","exp":"信一開始感謝奶奶的卡片和錢，接著分享買鞋、存錢、科展的近況，最後邀請奶奶來過聖誕節。主要目的是道謝和分享近況。","topic":"閱讀：書信","grp":"ak-english-11～13","passage":"<p>Hi Grandma,<\/p><p>Thanks for the birthday card and the money! I used part of it to buy a new pair of running shoes, because my old ones were too small. I put the rest in the bank. I'm saving for a bike, so I can ride to school with my friends next year. Mom says if I save half of the price by December, she'll pay the other half.<\/p><p>School is busy. We have a big science fair next month, and my team is making a robot that can pick up trash. It's hard work, but it's fun.<\/p><p>Can you come for Christmas this year? We all miss you.<\/p><p>Love,<br>Owen<\/p>"},{"id":"ak-english-14","y":"ak","n":14,"html":"Jenny, a junior high student, goes to the pool alone. She brings her student ID but forgets her swimming cap. How much does she need to pay?","opts":["$60","$100","$110","$150"],"ans":"C","exp":"學生票（有學生證）$60，加上一定要戴泳帽，要在櫃臺買一頂 $50，共 $110。","topic":"閱讀：告示","grp":"ak-english-14～15","passage":"<p><b>City Swimming Pool — Summer Hours<\/b><\/p><p>Monday–Friday: 6:00 a.m.–9:00 p.m.<br>Saturday–Sunday: 8:00 a.m.–6:00 p.m.<\/p><p>Tickets: Adults $100 / Students (with ID) $60 / Children under 6: free<\/p><p>* Swimming caps are required. Caps can be bought at the front desk ($50).<br>* The pool is closed for cleaning on the first Monday of every month.<\/p>"},{"id":"ak-english-15","y":"ak","n":15,"html":"Which is true about the City Swimming Pool?","opts":["Children under 6 need to pay $60.","You can swim there at 7:00 a.m. on Sunday.","It is open until 9:00 p.m. on Saturday.","It is closed on the first Monday of every month."],"ans":"D","exp":"告示寫 closed for cleaning on the first Monday of every month。(B)(C)週末是 8:00 a.m.～6:00 p.m.；(A)6歲以下免費。","topic":"閱讀：告示","grp":"ak-english-14～15","passage":"<p><b>City Swimming Pool — Summer Hours<\/b><\/p><p>Monday–Friday: 6:00 a.m.–9:00 p.m.<br>Saturday–Sunday: 8:00 a.m.–6:00 p.m.<\/p><p>Tickets: Adults $100 / Students (with ID) $60 / Children under 6: free<\/p><p>* Swimming caps are required. Caps can be bought at the front desk ($50).<br>* The pool is closed for cleaning on the first Monday of every month.<\/p>"}],"math":[{"id":"104-math-1","y":"104","n":1,"img":"104_math_q01","pk":"104_math","ans":"D"},{"id":"104-math-2","y":"104","n":2,"img":"104_math_q02","pk":"104_math","ans":"B"},{"id":"104-math-3", q09","pk":"113_math","ans":"C","exp":"(甲) 四期乳癌的長條約 53%，高於 50%，所以甲正確。(乙) 三期減四期：胃癌約 56－13＝43，大腸癌約 83－29＝54，大腸癌差距比胃癌大，所以乙錯誤。"},{"id":"113-math-10","y":"113","n":10,"img":"113_math_q10","pk":"113_math","ans":"C","exp":"兩項都有公因式 (5x－2)，先提出來：(5x－2)[5x－4(5x－2)]＝(5x－2)(5x－20x＋8)＝(5x－2)(－15x＋8)。"},{"id":"113-math-11","y":"113","n":11,"img":"113_math_q11","pk":"113_math","ans":"A"},{"id":"113-math-12","y":"113","n":12,"img":"113_math_q12","pk":"113_math","ans":"C"},{"id":"113-math-13","y":"113","n":13,"img":"113_math_q13","pk":"113_math","ans":"B","exp":"原本的比例是 1920：1080＝16：9，比例不變才不會有黑邊。只有 1600×900 化簡後是 16：9；(A) 1680：1050＝8：5，(C) 1440：900＝8：5，(D) 1280：1024＝5：4，都不是 16：9。"},{"id":"113-math-14","y":"113","n":14,"img":"113_math_q14","pk":"113_math","ans":"C","exp":"每天改搭公車，少產生的碳排放量是 20×(0.17－0.04)＝2.6 公斤。要超過 800 公斤，需要天數大於 800÷2.6≈307.7，所以至少要 308 天；307 天只減少 798.2 公斤，還不夠。"},{"id":"113-math-15","y":"113","n":15,"img":"113_math_q15","pk":"113_math","ans":"B","exp":"10/a 通分後分子變 50，表示分子、分母都乘 5，分母是 5a；18/b 分子變 54，表示都乘 3，分母是 3b。分母相同，所以 5a＝3b，5 與 3 互質，a 必是 3 的倍數。又 10/a 是最簡分數，a 與 10 沒有公因數，所以 a 不是 5 的倍數。"},{"id":"113-math-16","y":"113","n":16,"img":"113_math_q16","pk":"113_math","ans":"B","exp":"每十年上升 0.08 ℃，所以每年上升 0.008 ℃。2020 年之後第 x 年，就是從 2020 年起再上升 x 年，氣溫為 14.88＋0.008x。(C)、(D) 把 1880 到 2020 的年數又加了一次，是錯的。"},{"id":"113-math-17","y":"113","n":17,"img":"113_math_q17","pk":"113_math","ans":"A","exp":"∠A＝180°－55°－65°＝60°。三角形中大角對大邊，所以 AB（對 65°）＞BC（對 60°）＞AC（對 55°）。AB＞BC＝圓 B 半徑，A 在圓 B 外部；AC＜BC＝圓 C 半徑，A 在圓 C 內部。"},{"id":"113-math-18","y":"113","n":18,"img":"113_math_q18","pk":"113_math","ans":"A","exp":"兩平行四邊形全等，所以 FG＝CD＝7、EF＝BC＝5、GH＝AD＝5、EH＝AB＝7。CG＝FG－FC＝7－3＝4。因為 ∠EFC＝∠ECF（都等於平行四邊形的 ∠C），所以 EC＝EF＝5。周長＝5＋4＋5＋7＝21。"},{"id":"113-math-19","y":"113","n":19,"img":"113_math_q19","pk":"113_math","ans":"B","exp":"p、q 互為倒數，P 在 A 左側表示 p＜－2，所以 q＝1/p 在 －1/2 與 0 之間，Q 在 AO 上。此時 QO＝|q|＜1/2，而 AQ＝q＋2＞3/2，所以 AQ＞QO。"},{"id":"113-math-20","y":"113","n":20,"img":"113_math_q20","pk":"113_math","ans":"D"},{"id":"113-math-21","y":"113","n":21,"img":"113_math_q21","pk":"113_math","ans":"D","exp":"B 是半圓 AC 的圓心，BE＝BC，∠CBE＝58°。半圓 BD 的圓心 M 是 BD 中點，ME＝MB，所以 ∠BEM＝∠EBM＝58°。三角形 BEM 內角和 180°，∠BME＝180°－58°－58°＝64°，弧 BE 的度數等於圓心角，為 64°。"},{"id":"113-math-22","y":"113","n":22,"img":"113_math_q22","pk":"113_math","ans":"A","exp":"三個小三角形面積和為 12，所以 △ABC 面積 12。重心 G 使 △GAB、△GBC、△GCA 面積都是 4。△DBC＝4＝△GBC，兩者同底 BC 且面積相等，高就相等，D、G 在 BC 同側，所以 DG ∥ BC。△DCA＝3 與 △GCA＝4 不相等，(C)、(D) 錯誤。"},{"id":"113-math-23","y":"113","n":23,"img":"113_math_q23","pk":"113_math","ans":"B","exp":"DE ∥ AB，ABED 是平行四邊形，所以 AB＝DE＝4，DC＝4。三角形 DCE 中 DC＝DE＝4、CE＝2，是以 DE、DC 為兩腰的等腰三角形。摺後 C 落在 AB 上（記為 C′），三角形 BEC′ 中 ∠B＝∠C，可推得 BE＝C′E＝2，也是等腰三角形，且與三角形 DCE 的底角相同，所以兩者相似：BC′∶BE＝CE∶DC，得 BC′＝1，AC′＝4－1＝3，比為 1：3。"},{"id":"113-math-24","y":"113","n":24,"img":"113_math_q24","pk":"113_math","ans":"D","pimg":"113_math_p24","grp":"113-math-24～25","exp":"設身高 h 公尺。(甲) 22h²＝(100h－70)×0.6 整理成 11h²－30h＋21＝0，判別式 900－924＜0，無解，所以甲錯誤。(乙) (100h－70)×0.6＝(100h－158)×0.5＋52，得 60h－42＝50h－27，h＝1.5，是合理身高，所以乙正確。"},{"id":"113-math-25","y":"113","n":25,"img":"113_math_q25","pk":"113_math","ans":"B","pimg":"113_math_p24","grp":"113-math-24～25","exp":"身高 1.8 公尺時，算法② 理想體重為 (180－80)×0.7＝70，算法③ 為 (180－170)×0.6＋62＝68。實際體重在 63 到 77 公斤之間，除以 68 得約 0.926 到 1.132，也就是約 92.6% 到 113.2%。這落在 90%～110% 的正常及 110%～120% 的過重，不會低於 90%，所以沒有過輕。"},{"id":"114-math-1","y":"114","n":1,"img":"114_math_q01","pk":"114_math","ans":"C","exp":"同底數相乘指數相加、相除指數相減：7¹⁰×7²÷7⁴＝7¹⁰⁺²⁻⁴＝7⁸。","goal":"評量學生是否能做指數律運算","pr":75},{"id":"114-math-2","y":"114","n":2,"img":"114_math_q02","pk":"114_math","ans":"B","exp":"去括號時，減號後面的括號要變號：(5x²－2x)－(4－3x)＝5x²－2x－4＋3x＝5x²＋x－4。","goal":"評量學生是否能做多項式減法","pr":82},{"id":"114-math-3","y":"114","n":3,"img":"114_math_q03","pk":"114_math","ans":"C","exp":"在方格紙上逐一試擦去各選項的兩條線段，再找剩下的圖形有沒有對稱軸。擦去①②、①③、②④後都還能找到對稱軸；擦去②和③後，剩下的圖形找不到任何一條對稱軸，所以不是線對稱圖形。","goal":"評量學生是否能分辨線對稱圖形","pr":88},{"id":"114-math-4","y":"114","n":4,"img":"114_math_q04","pk":"114_math","ans":"B","exp":"兩式相加消去 y：60x＝120，x＝2。代回 37×2＋2y＝81，2
