10%），而收入最高20%家庭仍維持正成長，表示經濟大衰退時低收入者受到的衝擊較嚴重。(A)(D)與圖相反；(C)圖中沒有區域資料。"},{"id":"112-social-24","y":"112","n":24,"img":"112_social_q24","pk":"112_social","ans":"B","exp":"甲是在質詢部長，所以甲是立法委員，立法院的職權包括審查中央政府預算。(A)審查法律是否違憲是司法院大法官的職權；(C)立委是全國性選舉產生；(D)部長才是由行政院院長提請總統任命，不是甲。"},{"id":"112-social-25","y":"112","n":25,"img":"112_social_q25","pk":"112_social","ans":"A","exp":"圖中橫軸是人口占世界的累計百分比，甲國寬度約16%，表示人口很多，但人均GDP遠低於世界平均，符合印度。(B)美國、(C)德國人均GDP高；(D)奈及利亞人口比例沒有那麼大。"},{"id":"112-social-26","y":"112","n":26,"img":"112_social_q26","pk":"112_social","ans":"B","exp":"巴拿馬到哥倫比亞之間的路段位在熱帶雨林地區，這段地形崎嶇、生態珍貴，因此未修建公路以保護熱帶雨林生態。(A)熱帶地區年溫差小；(C)運河在巴拿馬中部，不在此路段；(D)因紐特人住在北極圈，不在此地。"},{"id":"112-social-27","y":"112","n":27,"img":"112_social_q27","pk":"112_social","ans":"D","exp":"圖中熔岩流與火山灰都向西延伸，火山灰往西落下，表示當時吹東風，熔岩流由東向西流往海洋，所以地勢東高西低。依比例尺，噴發地點到海邊約6公里，(D)正確。(A)風向應為東風；(B)地勢東高西低；(C)西班牙海外島嶼在大西洋，不是太平洋。"},{"id":"112-social-28","y":"112","n":28,"img":"112_social_q28","pk":"112_social","ans":"B","exp":"乙站在臺灣北端的基隆一帶，位於東北季風的迎風面，冬季多雨，年降水量最多。甲在花蓮、丁在臺中盆地、丙在臺南平原，降水量都較少。"},{"id":"112-social-29","y":"112","n":29,"img":"112_social_q29","pk":"112_social","ans":"A","exp":"天狼星與太陽同時出現在地平線的時間，與尼羅河每年定期氾濫的時間吻合，古埃及人藉此推算氾濫日期並安排農事，發明了太陽曆。(B)是希臘城邦；(C)是印度；(D)是希伯來人。"},{"id":"112-social-30","y":"112","n":30,"img":"112_social_q30","pk":"112_social","ans":"D"},{"id":"112-social-31","y":"112","n":31,"img":"112_social_q31","pk":"112_social","ans":"C","exp":"俄國在第一次世界大戰初期支援斯拉夫兄弟塞爾維亞而參戰，1917年國內爆發革命、共產政權成立後，與同盟國議和退出戰爭。(A)是日本；(B)是德國；(D)是美國參戰的原因。"},{"id":"112-social-32","y":"112","n":32,"img":"112_social_q32","pk":"112_social","ans":"D","exp":"周朝為了管理遼闊的土地，實施封建制度，依照貴族的身分等級授予土地並冊封爵位。(A)郡縣制是秦朝；(B)科舉制度是隋唐以後；(C)編戶齊民與法律規範是戰國秦漢以後的作法。"},{"id":"112-social-33","y":"112","n":33,"img":"112_social_q33","pk":"112_social","ans":"B","exp":"文中描述西羅馬帝國滅亡後知識衰退，君主聘請學者復興文化、推廣拉丁文，這是查理曼聘請的學者，約在西元八世紀，當時的知識分子多為基督教教士。(A)(C)(D)的時代都不符合。"},{"id":"112-social-34","y":"112","n":34,"img":"112_social_q34","pk":"112_social","ans":"D","exp":"要同時比較每位醫師與每張病床負擔人數，數字越大代表資源越不足。丙地區的醫師負擔764.3人、病床負擔210.1人，兩項都是最高，所以最不足。(A)(B)人口與老年人口多寡不能直接決定資源不足；(C)乙地區並非最高。"},{"id":"112-social-35","y":"112","n":35,"img":"112_social_q35","pk":"112_social","ans":"D","exp":"飢餓行銷是利用排隊搶購的話題與流行，引發民眾的購買欲望，這是非價格的誘因，也就是非金錢誘因。(C)文中並未降價，不是價格誘因；(A)(B)談的是廠商競爭，與題意無關。"},{"id":"112-social-36","y":"112","n":36,"img":"112_social_q36","pk":"112_social","ans":"C"},{"id":"112-social-37","y":"112","n":37,"img":"112_social_q37","pk":"112_social","ans":"B","exp":"題目要的是增加國民人數，只有鼓勵各國人才歸化入籍，才會增加具有國籍的國民。(A)外籍移工不會成為國民；(C)(D)是照顧老人或育兒的措施，不能直接增加國民人數。"},{"id":"112-social-38","y":"112","n":38,"img":"112_social_q38","pk":"112_social","ans":"D","exp":"乙寫客家人抗日（1895年乙未戰爭前後），丙是1920年代文化協會與農民運動，甲是1940年代前後臺灣青年被徵召到南洋戰場。所以時間順序為乙、丙、甲。"},{"id":"112-social-39","y":"112","n":39,"img":"112_social_q39","pk":"112_social","ans":"A","exp":"1830年代清朝仍採一口通商，只有廣州可以對外貿易，上海要到1842年南京條約後才開港，所以出口量只出現在廣州，上海為0。(B)(C)(D)都顯示上海已有出口，是開港以後的情形。"},{"id":"112-social-40","y":"112","n":40,"img":"112_social_q40","pk":"112_social","ans":"A","exp":"1甲幣由可換10乙幣變成20乙幣，表示甲幣升值、乙幣貶值。甲國商品換算成乙幣後變貴，在乙國銷售量下滑；乙國商品則變便宜，在甲國更好賣。所以(B)(C)(D)的方向都反了。"},{"id":"112-social-41","y":"112","n":41,"img":"112_social_q41","pk":"112_social","ans":"C"},{"id":"112-social-42","y":"112","n":42,"img":"112_social_q42","pk":"112_social","ans":"D","exp":"不實業者被主管機關處罰，是違反行政法規而受到的行政罰。(D)少年抽菸、父母被處分也是行政處分。(A)借物不還是民事問題；(B)竊盜是刑事責任；(C)官員政策引發不滿，是政治責任。"},{"id":"112-social-43","y":"112","n":43,"img":"112_social_q43","pk":"112_social","ans":"C","exp":"表中30至44歲女性未就業主因是照顧子女，45歲以後則多是負責打理家務，顯示女性仍被期待承擔家庭照顧工作，因此家庭平權觀念仍待加強。(A)(B)(D)無法由表中數據看出。"},{"id":"112-social-44","y":"112","n":44,"img":"112_social_q44","pk":"112_social","ans":"C","pimg":"112_social_p44","grp":"112-social-44～45"},{"id":"112-social-45","y":"112","n":45,"img":"112_social_q45","pk":"112_social","ans":"D","pimg":"112_social_p44","grp":"112-social-44～45","exp":"「政治局勢發生變化」是指琉球王國被日本併吞，日本藉牡丹社事件向琉球及臺灣擴張勢力，進而在1879年廢琉球藩。(A)(C)的時間在琉球被併吞之後；(B)唐朝時日本效法中國，與此無關。"},{"id":"112-social-46","y":"112","n":46,"img":"112_social_q46","pk":"112_social","ans":"B","pimg":"112_social_p46","grp":"112-social-46～48","exp":"富士山每年7月上旬至9月上旬開放，是夏季，山上冬季的積雪大多已融化，適合登山。(C)日本夏季多雨，不是乾季；(D)西北季風盛行是冬季；(A)地質與地震不是季節性開放的原因。"},{"id":"112-social-47","y":"112","n":47,"img":"112_social_q47","pk":"112_social","ans":"C","pimg":"112_social_p46","grp":"112-social-46～48","exp":"圖中起點靠近1400公尺等高線，終點在3600公尺以上，最符合起點海拔1,440公尺、終點3,715公尺的丙。甲乙丁的起點分別是2,305、1,970、2,380公尺，都比圖中的起點高很多。"},{"id":"112-social-48","y":"112","n":48,"img":"112_social_q48","pk":"112_social","ans":"D","pimg":"112_social_p46","grp":"112-social-46～48","exp":"小婷要選平均坡度最陡的路線，丁是26.7%最大。體力、經驗不足者要選坡度最緩的路線，甲是18.9%最小。(B)(C)的選擇不是最陡或最緩。"},{"id":"112-social-49","y":"112","n":49,"img":"112_social_q49","pk":"112_social","ans":"B","pimg":"112_social_p49","grp":"112-social-49～51","exp":"開普敦在南緯約34度、非洲西南端，屬於地中海型氣候，位在南半球，所以一月是夏季，溫暖且雨量少，冬季才多雨。(A)(C)(D)的氣溫與降水型態都不符合。"},{"id":"112-social-50","y":"112","n":50,"img":"112_social_q50","pk":"112_social","ans":"A","pimg":"112_social_p49","grp":"112-social-49～51","exp":"文中說部分奴隸是荷蘭由亞洲殖民地輸出，荷蘭在亞洲的殖民地是現在的印尼一帶，也就是南洋群島。(B)(C)(D)都不是荷蘭當時的亞洲殖民地。"},{"id":"112-social-51","y":"112","n":51,"img":"112_social_q51","pk":"112_social","ans":"A","pimg":"112_social_p49","grp":"112-social-49～51","exp":"1869年蘇伊士運河通航，歐洲到印度洋周邊不用再繞過好望角，航程大幅縮短，所以船隻改走新航線，開普敦因此沒落。(B)(C)(D)與蘇伊士運河的位置和優勢無關。"},{"id":"112-social-52","y":"112","n":52,"img":"112_social_q52","pk":"112_social","ans":"D","pimg":"112_social_p52","grp":"112-social-52～54"},{"id":"112-social-53","y":"112","n":53,"img":"112_social_q53","pk":"112_social","ans":"B","pimg":"112_social_p52","grp":"112-social-52～54","exp":"標語邀請大家「試試看不要打小孩」，是希望透過改變家長的觀念與價值觀，進而帶動社會風氣的改變。(A)標語沒有主張提告；(C)沒有請願行動；(D)對象是大人，不是教導兒童。"},{"id":"112-social-54","y":"112","n":54,"img":"112_social_q54","pk":"112_social","ans":"C","pimg":"112_social_p52","grp":"112-social-52～54"},{"id":"113-social-1","y":"113","n":1,"img":"113_social_q01","pk":"113_social","ans":"B"},{"id":"113-social-2","y":"113","n":2,"img":"113_social_q02","pk":"113_social","ans":"A"},{"id":"113-social-3","y":"113","n":3,"img":"113_social_q03","pk":"113_social","ans":"B","exp":"上營盤在地勢較高處，營盤腳是它的西北山腳，所以上營盤應在營盤腳的東南方且等高線數值較大。圖中乙位於營盤腳東南方約140至150公尺處，符合；甲在北方、丁在西北方，丙在西南方，方位都不對。"},{"id":"113-social-4","y":"113","n":4,"img":"113_social_q04","pk":"113_social","ans":"A","exp":"圖中第五名是阿拉伯語，主要使用地區在西亞和北非。(B)東亞、南亞對應華語、印度語等；(C)南歐、南美洲是西班牙語和葡萄牙語；(D)北美洲、大洋洲主要是英語。"},{"id":"113-social-5","y":"113","n":5,"img":"113_social_q05","pk":"113_social","ans":"B","exp":"漳州人與客家人為了對抗泉州人，靠宗教活動團結成「七十二庄」，這是清代移民社會中不同籍貫、族群為爭奪土地水源而常發生的械鬥。(A)(C)(D)和閩客聯合對抗泉州人無關。"},{"id":"113-social-6","y":"113","n":6,"img":"113_social_q06","pk":"113_social","ans":"C","exp":"「圍攻外國領事館」「慈禧太后」「洋鬼子」指的是1900年的義和團事件，之後英、美、日、俄、德、法、奧、義八國組成聯軍攻入北京。(B)是鴉片戰爭；(D)是1926年國民政府北伐。"},{"id":"113-social-7","y":"113","n":7,"img":"113_social_q07","pk":"113_social","ans":"D","exp":"地圖畫的是西元前六世紀的巴比倫城與幼發拉底河，巴比倫位於兩河流域，當地使用的是楔形文字。象形文字是古埃及；拉丁文是羅馬及歐洲；片假名是日本。"},{"id":"113-social-8","y":"113","n":8,"img":"113_social_q08","pk":"113_social","ans":"C","exp":"日本在1894年的甲午戰爭、第一次世界大戰、九一八事變到太平洋戰爭都曾參與，日本在十九世紀末於廣島似島設置檢疫所。德國、法國沒有參與甲午戰爭；美國沒有參與九一八事變。"},{"id":"113-social-9","y":"113","n":9,"img":"113_social_q09","pk":"113_social","ans":"A","exp":"十七世紀荷蘭東印度公司在臺灣提供土地、耕牛與資金，招募漢人興建城堡、種稻種蔗，並常以武力處罰不服從的人。清帝國與鄭氏的統治在時間或方式上都不符合。"},{"id":"113-social-10","y":"113","n":10,"img":"113_social_q10","pk":"113_social","ans":"C"},{"id":"113-social-11","y":"113","n":11,"img":"113_social_q11","pk":"113_social","ans":"C"},{"id":"113-social-12","y":"113","n":12,"img":"113_social_q12","pk":"113_social","ans":"B","exp":"大法官宣告《民法》違反《憲法》，表示一切法律不得牴觸憲法，也就是憲法的法律位階最高。(A)規範範圍最廣和題意無關；(C)修改程序困難說的是憲法修憲門檻高。"},{"id":"113-social-13","y":"113","n":13,"img":"113_social_q13","pk":"113_social","ans":"C","exp":"7歲以上未滿18歲是限制行為能力人，訂定契約須經法定代理人同意才有效，目的是保護這類未成年人的權益。(A)無行為能力人是未滿7歲或受監護宣告者；(B)(D)與犯罪無關。"},{"id":"113-social-14","y":"113","n":14,"img":"113_social_q14","pk":"113_social","ans":"D"},{"id":"113-social-15","y":"113","n":15,"img":"113_social_q15","pk":"113_social","ans":"C","exp":"對照1976年與1985年的圖，新的市區範圍原本是魚塭的位置，可見新市區用地是由魚塭填土而來。(A)圖中沒有顯示海岸侵蝕；(B)魚塭面積是先因新生地增加再被取代，並非先減後增。"},{"id":"113-social-16","y":"113","n":16,"img":"113_social_q16","pk":"113_social","ans":"C","exp":"撒哈拉以南非洲經濟發展較落後、醫療衛生條件較差，因此平均壽命最低，但人口成長快。圖中只有丙在1990年約50歲、2019年約61歲，壽命最低且人口增加很多，最符合。"},{"id":"113-social-17","y":"113","n":17,"img":"113_social_q17","pk":"113_social","ans":"A"},{"id":"113-social-18","y":"113","n":18,"img":"113_social_q18","pk":"113_social","ans":"C"},{"id":"113-social-19","y":"113","n":19,"img":"113_social_q19","pk":"113_social","ans":"D","exp":"乙國領袖要求對方停止在古巴建立飛彈基地，是美國對蘇聯的要求；甲國提到對方在周邊部署飛彈包圍自己，是蘇聯的回應。這是1962年的古巴飛彈危機。"},{"id":"113-social-20","y":"113","n":20,"img":"113_social_q20","pk":"113_social","ans":"A","exp":"中世紀歐洲主流是地心說，認為地球在宇宙中心，太陽、月球、行星都繞地球轉，所以是圖左，說明為太陽繞行地球。圖右是日心說，要到哥白尼之後才逐漸被接受。"},{"id":"113-social-21","y":"113","n":21,"img":"113_social_q21","pk":"113_social","ans":"B","exp":"題目提到十四世紀中國結合原料製成特色商品，銷往印度、埃及，西班牙商船運往馬尼拉、墨西哥城、利馬，並受歐洲貴族喜愛，這是中國的瓷器。白銀是由美洲流向中國的，不符合題意。"},{"id":"113-social-22","y":"113","n":22,"img":"113_social_q22","pk":"113_social","ans":"C","exp":"表中柬埔寨、泰國、緬甸、不丹、斯里蘭卡都是信仰佛教人口比例高的國家，佛教發源於古印度，位置是圖中的丙。丁是西亞（伊斯蘭教、猶太教、基督教發源地附近）。"},{"id":"113-social-23","y":"113","n":23,"img":"113_social_q23","pk":"113_social","ans":"B","exp":"表中男性有71.4%從事產業移工，女性有99.2%從事社福移工，工作類別有明顯性別差異。(C)印尼移工主要從事看護等第三級產業；(D)越南移工主要在營建、製造、漁業，這些屬第一、二級產業。表中沒有薪資或權益差別的資料。"},{"id":"113-social-24","y":"113","n":24,"img":"113_social_q24","pk":"113_social","ans":"A"},{"id":"113-social-25","y":"113","n":25,"img":"113_social_q25","pk":"113_social","ans":"B","exp":"旁系血親是同源於祖父母輩的親戚，舅舅是母親的兄弟，姑姑是父親的姊妹，姨丈和伯母屬於姻親。再看地點：新北市、臺南市是直轄市，沒有市民代表，只有縣轄市和鄉鎮等才有市民代表，因此只有花蓮縣的舅舅符合。"},{"id":"113-social-26","y":"113","n":26,"img":"113_social_q26","pk":"113_social","ans":"C","exp":"復興區位於石門水庫集水區的上游，區內土地利用方式（如開墾、農藥）會隨雨水流入水庫，影響水質。(A)玉山山脈不在石門水庫集水區內；(B)福山位於集水區範圍外；(D)石門(3)是雨量站，並非淤積的河道。"},{"id":"113-social-27","y":"113","n":27,"img":"113_social_q27","pk":"113_social","ans":"A"},{"id":"113-social-28","y":"113","n":28,"img":"113_social_q28","pk":"113_social","ans":"B","exp":"後期最嚴重的地區已移到高鐵沿線附近，雲林地層下陷主要是過度抽取地下水造成，改種省水作物可減少抽水。(A)提高水費可能反而讓民眾更依賴地下水；(D)臺鐵不在下陷最嚴重處。"},{"id":"113-social-29","y":"113","n":29,"img":"113_social_q29","pk":"113_social","ans":"A","exp":"荔枝適合溫暖潮濕的亞熱帶氣候。臺灣中南部是亞熱帶，澳洲東北海岸的甲也是亞熱帶溼潤氣候；乙塔斯馬尼亞偏冷，丙在內陸沙漠區，丁在西南部是夏乾冬雨的地中海型氣候。"},{"id":"113-social-30","y":"113","n":30,"img":"113_social_q30","pk":"113_social","ans":"C","exp":"他希望女子能當總統、組織新政權，總統是共和制才有的職位，所以必須推翻清朝建立共和。(B)(D)保留皇帝或君主，不可能由人民選出總統。"},{"id":"113-social-31","y":"113","n":31,"img":"113_social_q31","pk":"113_social","ans":"D"},{"id":"113-social-32","y":"113","n":32,"img":"113_social_q32","pk":"113_social","ans":"A"},{"id":"113-social-33","y":"113","n":33,"img":"113_social_q33","pk":"113_social","ans":"D","exp":"此電纜橫跨太平洋，一端連到東南亞。丁一端在臺灣（約24.86°N、121.83°E），另一端在美國西岸洛杉磯附近（33.91°N、118.42°W），可由臺灣連到東南亞。甲在非洲與馬來西亞之間，乙橫跨大西洋，丙在地中海。"},{"id":"113-social-34","y":"113","n":34,"img":"113_social_q34","pk":"113_social","ans":"D","exp":"認養規定一的要求是年滿20歲才能自己辦理。小安第一次由爸爸陪同辦理，表示還沒滿20歲，卻已能投票，只有公民投票的投票權是年滿18歲；選舉的投票權要年滿20歲，所以第二次是自己辦理時的中央選舉。"},{"id":"113-social-35","y":"113","n":35,"img":"113_social_q35","pk":"113_social","ans":"B"},{"id":"113-social-36","y":"113","n":36,"img":"113_social_q36","pk":"113_social","ans":"B"},{"id":"113-social-37","y":"113","n":37,"img":"113_social_q37","pk":"113_social","ans":"C","exp":"題目要降低經過馬六甲海峽的風險，並連接中國西部與西亞、南亞，就是由新疆南下經巴基斯坦到阿拉伯海的中巴經濟走廊（丙）。乙是向西通往歐洲的陸路，丁是通往中南半島，甲是向北。"},{"id":"113-social-38","y":"113","n":38,"img":"113_social_q38","pk":"113_social","ans":"D","exp":"有法國租界、英國租界、自來水管和水塔，是上海在十九世紀末的情況。上海在鴉片戰爭後開港，設有英、法等國租界；北京在十八世紀初沒有租界；廣州在十八世紀末是一口通商，也沒有這樣的租界。"},{"id":"113-social-39","y":"113","n":39,"img":"113_social_q39","pk":"113_social","ans":"C"},{"id":"113-social-40","y":"113","n":40,"img":"113_social_q40","pk":"113_social","ans":"B","exp":"非告訴乃論案件不能調解，只有告訴乃論案件才可以調解。若調解不成功改由法院判決，所有刑事判決件數（甲）會增加，而非告訴乃論的案件（乙）不會因此改變。"},{"id":"113-social-41","y":"113","n":41,"img":"113_social_q41","pk":"113_social","ans":"A","exp":"11月11日是第一次世界大戰停戰紀念日，英國及其殖民地在獨立後仍保留，澳洲曾是英國殖民地且屬大英國協，所以最可能有同樣活動。巴西、韓國不是英國殖民地；荷蘭也不是。"},{"id":"113-social-42","y":"113","n":42,"img":"113_social_q42","pk":"113_social","ans":"D","exp":"島嶼高僅2公尺、很快消失，是河流在恆河口堆積的泥沙形成的沙洲，豪雨時河流帶來大量堆積物最可能造成。(A)恆河口不在板塊交界火山帶；(B)水土保持改善會讓泥沙減少；(C)海平面上升會淹沒陸地，不會形成島。"},{"id":"113-social-43","y":"113","n":43,"img":"113_social_q43","pk":"113_social","ans":"A","exp":"打狗港輸往日本的金額從1906至1915年大增，與日本資本投入糖業有關。(B)基隆離日本近，但表中打狗港對日本輸出額反而最多；(C)十八世紀後期臺灣的主要港口在鹿港、府城一帶；(D)十大建設是1970年代，與表中日治時期無關。"},{"id":"113-social-44","y":"113","n":44,"img":"113_social_q44","pk":"113_social","ans":"C","pimg":"113_social_p44","grp":"113-social-44～45","exp":"巫童被宗教團體當作災難來源而遭到虐待，顯示人們的行為會受到宗教信仰、習俗等社會規範影響，而且即使傷害孩子也深信不疑。(B)文中看不出法律比宗教強；(D)未提到公共意見的形成。"},{"id":"113-social-45","y":"113","n":45,"img":"113_social_q45","pk":"113_social","ans":"A","pimg":"113_social_p44","grp":"113-social-44～45"},{"id":"113-social-46","y":"113","n":46,"img":"113_social_q46","pk":"113_social","ans":"B","pimg":"113_social_p46","grp":"113-social-46～48","exp":"電動自行車不需掛牌、不需駕照、價格低廉，所以使用它的機會成本較低（花費的金錢和手續較少）。(A)(C)文中沒提；(D)負向誘因會讓人減少使用，與題意相反。"},{"id":"113-social-47","y":"113","n":47,"img":"113_social_q47","pk":"113_social","ans":"D","pimg":"113_social_p46","grp":"113-social-46～48","exp":"修正《道路交通管理處罰條例》是修改法律，必須由立法院三讀通過，再由總統公布。公民投票複決是修憲或領土變更時才有的程序；憲法法庭審理是解釋或審查憲法問題。"},{"id":"113-social-48","y":"113","n":48,"img":"113_social_q48","pk":"113_social","ans":"C","pimg":"113_social_p46","grp":"113-social-46～48","exp":"規定自2022年11月30日起施行，施行前已持有者在施行後二年內領用，最晚到2024年11月29日。逾期是遭主管機關開罰，屬於行政處罰，不是刑事處罰。"},{"id":"113-social-49","y":"113","n":49,"img":"113_social_q49","pk":"113_social","ans":"A","pimg":"113_social_p49","grp":"113-social-49～51","exp":"圖中南部和西部的州（如德州、佛羅里達）席次增加，東北部州席次減少，表示南部人口成長速度比東北部快。(B)全國席次固定，人口沒有持續負成長；(C)(D)文中沒有提到移民或禁止移民的因素。"},{"id":"113-social-50","y":"113","n":50,"img":"113_social_q50","pk":"113_social","ans":"D","pimg":"113_social_p49","grp":"113-social-49～51","exp":"席次僅1席的州多在高緯度或內陸，如阿拉斯加、北達科他、蒙大拿，常有地形、氣候、工業機會不足等因素。殖民地式經濟並非美國各州人口多寡的原因，所以較無關。"},{"id":"113-social-51","y":"113","n":51,"img":"113_social_q51","pk":"113_social","ans":"B","pimg":"113_social_p49","grp":"113-social-49～51"},{"id":"113-social-52","y":"113","n":52,"img":"113_social_q52","pk":"113_social","ans":"D","pimg":"113_social_p52","grp":"113-social-52～54"},{"id":"113-social-53","y":"113","n":53,"img":"113_social_q53","pk":"113_social","ans":"B","pimg":"113_social_p52","grp":"113-social-52～54"},{"id":"113-social-54","y":"113","n":54,"img":"113_social_q54","pk":"113_social","ans":"C","pimg":"113_social_p52","grp":"113-social-52～54","exp":"削蘋果事件是政府限制電影的內容，是對言論及出版自由的限制，禁止過度血腥暴力影像出版也屬於同類限制。(A)被告褫奪公權是參政權；(B)是應考試服公職權；(D)入境審查是遷徙自由。"},{"id":"114-social-1","y":"114","n":1,"img":"114_social_q01","pk":"114_social","ans":"A","exp":"題目說臺灣因位於地震帶、常有颱風而被列入。日本同樣位在環太平洋地震帶，又常受颱風侵襲，最符合。伊朗多地震但少颱風；北韓、澳洲都不是兩者兼具。","goal":"了解世界重要國家的自然環境特色。","pr":91},{"id":"114-social-2","y":"114","n":2,"img":"114_social_q02","pk":"114_social","ans":"A","exp":"臺灣開放農場、牧場合法聘僱農業移工，主要是因為農村人口老化、年輕人不願務農，農業勞動力不足。","goal":"了解臺灣面臨的農業問題與可能的因應方式。","pr":86},{"id":"114-social-3","y":"114","n":3,"img":"114_social_q03","pk":"114_social","ans":"B","exp":"電影中移民在美國仍說華語、過春節清明，是移民把原鄉文化帶到新居地延續。泰、緬新住民與移工在臺灣齊聚慶祝潑水節，也是同樣的概念。","goal":"了解文化擴散的概念。","pr":83},{"id":"114-social-4","y":"114","n":4,"img":"114_social_q04","pk":"114_social","ans":"B","exp":"從1904年臺灣堡圖可看到挖仔聚落位在河道彎曲處旁邊，且在臺灣西南部平原，地名最可能是指鄰近河道轉彎的地方。","goal":"判讀地圖資訊並作出合理推論。","pr":62},{"id":"114-social-5","y":"114","n":5,"img":"114_social_q05","pk":"114_social","ans":"B","exp":"離島地區醫療資源不足，重症常需送往本島，所以離島民眾最關心醫療資源分配。房價、重工業汙染、大規模土石流都較不是離島的主要問題。","goal":"了解臺灣的區域差異及問題。","pr":81},{"id":"114-social-6","y":"114","n":6,"img":"114_social_q06","pk":"114_social","ans":"C","exp":"圖中標示「臺灣總督府」「帝國大學」「鐵道部工場」「臺灣神社」，都是日本統治時期的建築，所以是〈臺北州大觀〉。","goal":"認識臺灣日治時期社會的樣貌。","pr":85},{"id":"114-social-7","y":"114","n":7,"img":"114_social_q07","pk":"114_social","ans":"D","exp":"提倡女性的入學、交友、營業、財產、出入、婚姻自由等「自然權利」，是受到近代歐洲天賦人權思想影響，屬於晚清西方思潮傳入中國的時期。","goal":"認識中國晚清時期婦女角色的轉變。","pr":79},{"id":"114-social-8","y":"114","n":8,"img":"114_social_q08","pk":"114_social","ans":"C","exp":"在廣州負責管理外國商人、收取關稅、接收貢品、專賣進口商品的機構，是唐宋以後設立的「市舶司」。洋行是清代的；總理衙門是清末的外交機構。","goal":"認識中國歷史上對外商貿的管理機構。","pr":66},{"id":"114-social-9","y":"114","n":9,"img":"114_social_q09","pk":"114_social","ans":"C","exp":"五四運動後，部分知識分子對西方失望，轉向俄國革命理論（共產主義），因此在1921年成立中國共產黨。","goal":"了解中國共產黨成立的歷史背景。","pr":52},{"id":"114-social-10","y":"114","n":10,"img":"114_social_q10","pk":"114_social","ans":"B","exp":"版畫把羅馬教宗畫成怪獸，諷刺教會用「滿滿一袋赦罪，用錢來贖」販賣贖罪券，這是宗教改革時期支持路德、批評天主教會的立場。路德主張「因信得救」。","goal":"了解宗教改革的重要主張。","pr":62},{"id":"114-social-11","y":"114","n":11,"img":"114_social_q11","pk":"114_social","ans":"C","exp":"跨國咖啡公司改用與當地環境相容的色系、當地文字招牌、加入當地料理，是尊重當地文化並與之融合。","goal":"發覺面對文化差異時，互相尊重與包容的作為。","pr":90},{"id":"114-social-12","y":"114","n":12,"img":"114_social_q12","pk":"114_social","ans":"D","exp":"美國禁止進口新疆強迫勞動生產的商品，是為了避免企業從侵害人權的生產中獲利。","goal":"從他國實例中發覺關於人權議題的作為。","pr":88},{"id":"114-social-13","y":"114","n":13,"img":"114_social_q13","pk":"114_social","ans":"D","exp":"廠商越多，消費者選擇越多，彼此競爭越激烈。招募更多廠商進駐美食街最能提升市場競爭程度。","goal":"理解市場競爭程度的概念。","pr":74},{"id":"114-social-14","y":"114","n":14,"img":"114_social_q14","pk":"114_social","ans":"C","exp":"乙、丙是姊妹（旁系血親），甲和乙、丙和丁是夫妻（配偶），甲和丙、乙和丁、甲和丁是姻親。四人之中沒有父母子女這種直系血親。","goal":"理解家人間的親屬關係。","pr":63},{"id":"114-social-15","y":"114","n":15,"img":"114_social_q15","pk":"114_social","ans":"C","exp":"W電視報導該候選人時負面報導占了28%中的21%，水果臺則多數是正面報導，可見不同媒體對同一候選人有不同立場，閱聽人要留意媒體是否持有特定立場。","goal":"檢視媒體報導政治人物時間、評價的差異，探討媒體在公共意見形成過程中的影響。","pr":78},{"id":"114-social-16","y":"114","n":16,"img":"114_social_q16","pk":"114_social","ans":"C","exp":"西部陸海新通道從成都、重慶通往廣西南寧，再出海往南，最主要是方便中國西部與東南亞國家（東協）的貿易往來。","goal":"分析交通建設對區域發展的影響。","pr":74},{"id":"114-social-17","y":"114","n":17,"img":"114_social_q17","pk":"114_social","ans":"A","exp":"告示牌說上游水壩會洩洪，不能進入溪谷，所以祕境在水壩下游的溪谷中。圖中甲位在水壩下游的河谷，最符合。","goal":"了解水系的概念並判讀等高線地形圖。","pr":60},{"id":"114-social-18","y":"114","n":18,"img":"114_social_q18","pk":"114_social","ans":"B","exp":"甲地物價、房價高，鄰國乙地一天薪水在甲地一小時就賺得到，人們住在乙地、通勤到甲地工作。美國與墨西哥相鄰、薪資差距很大，最符合。","goal":"了解世界重要國家的經濟發展特色。","pr":72},{"id":"114-social-19","y":"114","n":19,"img":"114_social_q19","pk":"114_social","ans":"D","exp":"甲區域的人口金字塔底部寬、頂部尖，幼年人口多、老年人口少，是高出生率的年輕型人口結構，最可能是漠南非洲。歐洲、北美、東北亞都較高齡化。","goal":"判讀人口金字塔及了解漠南非洲的人口特色。","pr":67},{"id":"114-social-20","y":"114","n":20,"img":"114_social_q20","pk":"114_social","ans":"C","exp":"圖(八)的漏斗狀陶器（糖漏）是用來製糖的。18～19世紀臺灣的製糖業集中在西南部的臺南一帶，也就是丙。","goal":"認識臺灣清帝國時期的糖業發展。","pr":65},{"id":"114-social-21","y":"114","n":21,"img":"114_social_q21","pk":"114_social","ans":"A","exp":"由統治者任用非世襲的官員，建立中央集權政府，起源於東周、秦統一後全面施行，是「郡縣制度」。封建制度是世襲的；科舉、九品官人法是選才制度。","goal":"了解中國歷史上的重要政治制度。","pr":63},{"id":"114-social-22","y":"114","n":22,"img":"114_social_q22","pk":"114_social","ans":"C","exp":"報導中提到重慶是「陪都」，和中、英、美、蘇「四國」聯合同盟，慶祝「大功告成」，是八年抗戰勝利的慶祝。","goal":"認識第二次世界大戰期間的中國局勢。","pr":72},{"id":"114-social-23","y":"114","n":23,"img":"114_social_q23","pk":"114_social","ans":"A","exp":"1989年的泛歐野餐，從共產國家逃往奧地利的大多是東德人。圖中甲是當時的東德，屬於共產集團；乙、丙、丁都是西歐國家。","goal":"了解美、蘇冷戰下的歐洲局勢。","pr":68},{"id":"114-social-24","y":"114","n":24,"img":"114_social_q24","pk":"114_social","ans":"D","exp":"各年級願意用網路投票的比例（90%以上）都遠高於實體投票（約40多%），可見使用科技能提升學生參與公共事務的程度。","goal":"發覺科技發展對中學生參與公共事務的影響。","pr":82},{"id":"114-social-25","y":"114","n":25,"img":"114_social_q25","pk":"114_social","ans":"D","exp":"規定出勤紀錄預設是加班，要由雇主舉證，因為員工通常較難取得證據，這樣規定是為了平衡勞資雙方不對等的權力關係。","goal":"從日常生活的勞資糾紛中，解釋立法保障勞動權益的理由。","pr":73},{"id":"114-social-26","y":"114","n":26,"img":"114_social_q26","pk":"114_social","ans":"A","exp":"家中有未滿6歲子女的已婚女性，勞動力參與率比沒有子女或子女都在6歲以上的女性低，可見照顧幼兒等家務勞動影響了女性參與市場勞動的機會。","goal":"檢視關於已婚女性勞動力參與率的統計資料，解析家務勞動的分擔影響女性的個人發展與市場勞動參與。","pr":74},{"id":"114-social-27","y":"114","n":27,"img":"114_social_q27","pk":"114_social","ans":"D","exp":"博斯普魯斯海峽航運量太大，船隻常要排隊等候。開鑿新運河分流後，等候通過海峽的時間會減少。","goal":"分析交通路線的興建對區域發展的影響。","pr":71},{"id":"114-social-28","y":"114","n":28,"img":"114_social_q28","pk":"114_social","ans":"B","exp":"圖中國家是新加坡，位在北緯1.33度，接近赤道、在太陽直射範圍內，太陽輻射強，適合發展太陽能。最高點只有163公尺，沒有高山發展水力。","goal":"分析世界重要國家發展綠能的條件。","pr":63},{"id":"114-social-29","y":"114","n":29,"img":"114_social_q29","pk":"114_social","ans":"B","exp":"中國降水由東南沿海向西北內陸遞減。年降水量低於全國平均（691.6毫米）的地區，主要是北方和西北內陸，所以深灰色應分布在北部與西部，符合(B)。","goal":"了解中國的氣候特色。","pr":57},{"id":"114-social-30","y":"114","n":30,"img":"114_social_q30","pk":"114_social","ans":"C","exp":"碳匯是能吸收、儲存碳的地方，如土壤、森林。恢復農地並以友善環境方式耕作，可以增加土壤的儲碳量。(A)焚林會釋放碳；(B)(D)是減少排放，不是增加碳匯。","goal":"了解減緩全球暖化的策略。","pr":66},{"id":"114-social-31","y":"114","n":31,"img":"114_social_q31","pk":"114_social","ans":"A","exp":"碑文說政府召募高砂族青年組成義勇隊，在南洋戰場上作戰，這是二次大戰時期日本推動皇民化運動的背景。","goal":"了解皇民化時期臺灣原住民的戰爭經驗。","pr":65},{"id":"114-social-32","y":"114","n":32,"img":"114_social_q32","pk":"114_social","ans":"B","exp":"臺灣原住民被日本人帶去日本、回來後被荷蘭人監禁，引發日人挾持臺灣長官的衝突（濱田彌兵衛事件），發生在17世紀荷蘭統治的大員（今臺南安平）。","goal":"認識大航海時代臺灣原住民與各方勢力的互動。","pr":70},{"id":"114-social-33","y":"114","n":33,"img":"114_social_q33","pk":"114_social","ans":"D","exp":"1946年臺灣光復後與中國大陸仍有往來，可以出口鳳梨罐頭；1949年政府遷臺後兩岸隔絕，之後出口數量都是0。符合的是丁。","goal":"了解臺海兩岸關係變化對臺灣貿易的影響。","pr":38},{"id":"114-social-34","y":"114","n":34,"img":"114_social_q34","pk":"114_social","ans":"C","exp":"演講者曾擔任立法委員，立法委員可以對司法院院長的被提名人行使同意權。(A)審核決算是監察院審計部；(B)提請任命部會首長是行政院長；(D)彈劾法官是監察委員。","goal":"理解立法院的職權。","pr":53},{"id":"114-social-35","y":"114","n":35,"img":"114_social_q35","pk":"114_social","ans":"B","exp":"乙資料中地方議會要求政府依法召開公聽會、聽取居民意見，顯示政府權力受到約束與制衡。甲資料是強迫人民服勞役，沒有保障勞動權利。","goal":"從不同時空脈絡中的人類生活情形，探討法治與人治的差異。","pr":77},{"id":"114-social-36","y":"114","n":36,"img":"114_social_q36","pk":"114_social","ans":"A","exp":"甲是檢察官，依據犯罪事證提起公訴是檢察官的職權，所以(A)適當。(B)法庭上有檢察官，是刑事案件，被告說要償還借款（民事）不符情境；(C)丙是辯護律師，判決是法官的工作，不是由檢察官甲判決；(D)撤銷行政處分是行政訴訟，與本案不符。","goal":"理解在犯罪的追訴及處罰過程中，檢察官及法官的功能與權限。","pr":68},{"id":"114-social-37","y":"114","n":37,"img":"114_social_q37","pk":"114_social","ans":"C","exp":"社會企業以商業活動獲利，並把利潤投入改善社會問題。提倡公平貿易、用合理價格收購小農產品幫助小農，符合這種模式。(D)募捐是非營利組織的做法。","goal":"檢視新型態的企業經營模式，解析有助促進社會公平正義的商業活動。","pr":43},{"id":"114-social-38","y":"114","n":38,"img":"114_social_q38","pk":"114_social","ans":"A","exp":"法院對爺爺作出監護宣告後，爺爺會成為無行為能力人，他自己做的贈與等法律行為無效，由監護人代理，以保障他的財產。","goal":"從新聞事件中的法律議題，解析監護宣告的目的及法律效果。","pr":43},{"id":"114-social-39","y":"114","n":39,"img":"114_social_q39","pk":"114_social","ans":"A","exp":"每月用相同的日幣換披索，年底換到的披索卻變少，表示1日幣能換的披索變少，也就是披索相對日幣升值（日幣貶值），在日本工作的實際收入減少。","goal":"從國際移工變更工作地點的考量，解析匯率與機會成本的變化情形。","pr":65},{"id":"114-social-40","y":"114","n":40,"img":"114_social_q40","pk":"114_social","ans":"D","exp":"加里寧格勒是俄羅斯在波羅的海、夾在波蘭和立陶宛之間的飛地，周圍都是北約國家，是俄羅斯面對北約的重要軍事基地。它不靠太平洋，也不在往芬蘭的路徑上。","goal":"分析位置對國際合作與競爭的重要性。","pr":46},{"id":"114-social-41","y":"114","n":41,"img":"114_social_q41","pk":"114_social","ans":"D","exp":"表中各水庫2020年11月底蓄水已偏低，到2021年5月更是見底。2020年沒有颱風侵臺，夏秋缺乏颱風雨補充水庫，是最主要的原因。","goal":"分析影響臺灣水資源豐缺的因素。","pr":32},{"id":"114-social-42","y":"114","n":42,"img":"114_social_q42","pk":"114_social","ans":"C","exp":"可以調解的是民事事件和告訴乃論的刑事案件。2020年：民事200件，加上超過半數（多於90件）的刑事案件，可調解件數應在290～380件之間。2021年：民事230件，加上不到半數（少於75件）的刑事案件，應在230～305件之間。只有(C)兩年都符合。","goal":"檢視法律諮詢服務件數的相關統計資料，解析可採調解方式處理的紛爭類型。","pr":60},{"id":"114-social-43","y":"114","n":43,"img":"114_social_q43","pk":"114_social","ans":"B","pimg":"114_social_p43","grp":"114-social-43～45","exp":"博物館在墨西哥首都，館藏以當地古文明（阿茲提克、馬雅等）文物為主，所以阿茲提克容器最可能是主要館藏。巴比倫城門、南島語族樹皮布、因紐特獵具都不是當地文物。","goal":"認識美洲重要的古文明。","pr":71},{"id":"114-social-44","y":"114","n":44,"img":"114_social_q44","pk":"114_social","ans":"A","pimg":"114_social_p43","grp":"114-social-43～45","exp":"選文說神官手中的物品是「原產於美洲的作物」，也是當地古文明的主食，答案是玉米。橄欖、小麥、稻米都原產於舊大陸。","goal":"認識世界歷史上的重要作物。","pr":65},{"id":"114-social-45","y":"114","n":45,"img":"114_social_q45","pk":"114_social","ans":"D","pimg":"114_social_p43","grp":"114-social-43～45","exp":"文中說展品說明大多僅採用「今日當地的官方語文」，墨西哥曾受西班牙殖民，官方語言是西班牙文。","goal":"認識近代歐洲的海外擴張與殖民。","pr":67},{"id":"114-social-46","y":"114","n":46,"img":"114_social_q46","pk":"114_social","ans":"D","pimg":"114_social_p46","grp":"114-social-46～48","exp":"我國車牌不用數字「4」，是因為民眾認為與「死」諧音、觸霉頭，政府施政因而受到民間習俗這種社會規範的影響。民間習俗本身沒有強制力。","goal":"發覺社會規範對於政府施政的影響。","pr":57},{"id":"114-social-47","y":"114","n":47,"img":"114_social_q47","pk":"114_social","ans":"D","pimg":"114_social_p46","grp":"114-social-46～48","exp":"同樣的車牌號碼，有些人願意多付錢買8888等特殊號碼，有些人在意紀念日號碼，有些人完全不在意，說明不同人對同一誘因的感受不同。","goal":"從民眾是否付費選擇車牌的行為，說明不同人對同一誘因反應不同的概念。","pr":82},{"id":"114-social-48","y":"114","n":48,"img":"114_social_q48","pk":"114_social","ans":"C","pimg":"114_social_p46","grp":"114-social-46～48","exp":"違反《道路交通管理處罰條例》被罰是行政處分（罰鍰），不服可以透過行政救濟（如聲明異議、行政訴訟）維護權益。(A)訴願不是向立法機關提出；(D)不是刑事案件。","goal":"理解生活中常見的行政管制與行政救濟的途徑。","pr":50},{"id":"114-social-49","y":"114","n":49,"img":"114_social_q49","pk":"114_social","ans":"A","pimg":"114_social_p49","grp":"114-social-49～51","exp":"巴斯人的祖先來自伊朗高原，世代信仰發源於伊朗高原的宗教，也就是祆教（瑣羅亞斯德教）。","goal":"認識西亞古文明的重要宗教。","pr":55},{"id":"114-social-50","y":"114","n":50,"img":"114_social_q50","pk":"114_social","ans":"B","pimg":"114_social_p49","grp":"114-social-49～51","exp":"18世紀後期到19世紀中期，巴斯人與英國殖民者合作，從印度把鴉片運到中國販賣，換取白銀。","goal":"了解中國晚清時期的對外貿易情形。","pr":59},{"id":"114-social-51","y":"114","n":51,"img":"114_social_q51","pk":"114_social","ans":"D","pimg":"114_social_p49","grp":"114-social-49～51","exp":"墓碑用「伊嗣俟紀元」紀年，伊嗣俟是薩珊王朝最後一位國王，巴斯人用他的紀元，反映他們珍視薩珊王朝的歷史。(B)碑上只有去世年份，無法確定何時來華。","goal":"了解紀年對建構族群認同所代表的意義。","pr":63},{"id":"114-social-52","y":"114","n":52,"img":"114_social_q52","pk":"114_social","ans":"C","pimg":"114_social_p52","grp":"114-social-52～54","exp":"1982年與英國爆發戰爭、宣稱擁有南大西洋島嶼主權的是阿根廷（福克蘭群島戰爭），圖中甲也位在阿根廷附近。","goal":"了解全球海陸分布及世界重要國家的位置。","pr":49},{"id":"114-social-53","y":"114","n":53,"img":"114_social_q53","pk":"114_social","ans":"B","pimg":"114_social_p52","grp":"114-social-52～54","exp":"圖中冰山從2017年7月的位置，經2019年11月，到2020年7月往南喬治亞島移動，依圖上經緯度判斷，是從西南往東北漂流。","goal":"應用經緯度座標判斷方位。","pr":45},{"id":"114-social-54","y":"114","n":54,"img":"114_social_q54","pk":"114_social","ans":"D","pimg":"114_social_p52","grp":"114-social-52～54","exp":"選文說南喬治亞島有大量海獅、象鼻海豹、國王企鵝等動物，巨大冰山撞上島嶼會破壞海岸，危及動物棲地。島上幾乎沒有常住人口和工業；冰山融化會讓鹽度下降而不是上升。","goal":"分析氣候變遷所造成的影響。","pr":73},{"id":"115-social-1","y":"115","n":1,"img":"social_q01","pk":"115_social","ans":"A","exp":"7月下旬是颱風季，雲林、臺南、嘉義位在西南部平原，颱風（2024年凱米颱風）帶來的西南氣流豪雨容易淹沒農田。東北季風在冬季；梅雨在5～6月；焚風多發生在東部。","goal":"了解臺灣的氣象災害及其影響。","pr":80},{"id":"115-social-2","y":"115","n":2,"img":"social_q02","pk":"115_social","ans":"D","exp":"臺灣同樣缺乏看護、營造等勞動力，而且外籍移工主要來自越南、菲律賓、印尼、泰國，和日本招募的來源國高度重疊，彼此會搶人，衝擊最大。","goal":"分析不同國家的人口結構及其外籍勞工來源。","pr":84},{"id":"115-social-3","y":"115","n":3,"img":"social_q03","pk":"115_social","ans":"C","exp":"坐標約北緯6度、東經38度，位於衣索比亞（咖啡產地）。圖中說明要「以人工翻動果實」曬乾、剝除果皮果肉，需要大量人力；產品「上市販售」是為了賣錢，所以是勞力密集的商業性農業。","goal":"了解非洲熱帶栽培業的特色。","pr":71},{"id":"115-social-4","y":"115","n":4,"img":"social_q04","pk":"115_social","ans":"A","exp":"雪山山脈與中央山脈之間的平原是蘭陽平原，也就是宜蘭縣，當地平埔族為噶瑪蘭族。","goal":"了解臺灣主要地形與行政區的分布。","pr":68},{"id":"115-social-5","y":"115","n":5,"img":"social_q05","pk":"115_social","ans":"A","exp":"歐洲西半部國家經濟發達、工業化早，人均國民所得高、都市化程度也高，所以位於兩項都高於世界平均的「甲」區塊。","goal":"了解世界各洲的經濟及都市發展特色。","pr":70},{"id":"115-social-6","y":"115","n":6,"img":"social_q06","pk":"115_social","ans":"D","exp":"斯巴達以軍事教育聞名，男孩從小接受嚴格軍事訓練，所以後人容易誤以為斯巴達會丟棄不健壯的嬰兒。","goal":"認識古希臘的城邦政治。","pr":77},{"id":"115-social-7","y":"115","n":7,"img":"social_q07","pk":"115_social","ans":"D","exp":"漫畫標示1931年，主角是「銀行倒閉的受害者」，存在銀行的錢都沒了，這是1929年美國股市崩盤後引發的經濟大恐慌，大量銀行倒閉。","goal":"認識經濟大恐慌期間的社會面貌。","pr":89},{"id":"115-social-8","y":"115","n":8,"img":"social_q08","pk":"115_social","ans":"B","exp":"《中美共同防禦條約》即將失效、權貴想移民國外、政府推動愛國捐獻，〈龍的傳人〉也是1978年底的歌曲，這是1978年美國宣布將與中華民國斷交（1979年生效）時的社會情況。","goal":"認識戰後臺灣的國際處境。","pr":70},{"id":"115-social-9","y":"115","n":9,"img":"social_q09","pk":"115_social","ans":"A","exp":"17世紀西班牙曾占領臺灣北部（基隆、淡水一帶），在當地傳教，所以會說西班牙語、受洗為天主教徒的原住民分布在北部的「甲」區域。","goal":"認識大航海時代各方勢力在臺灣的競逐。","pr":77},{"id":"115-social-10","y":"115","n":10,"img":"social_q10","pk":"115_social","ans":"C","exp":"同樣的「○」「✓」符號，在臺灣和日本代表的意思不同，這說明不同文化之間存在差異。","goal":"發覺生活經驗中的文化差異。","pr":96},{"id":"115-social-11","y":"115","n":11,"img":"social_q11","pk":"115_social","ans":"C","exp":"原本售價19,999元、供貨99臺。調整後幾分鐘就賣光，還多出數百筆訂單，表示需求量突然大增，最可能是售價降到9,999元。若只把供貨量改成19臺，不會多出數百筆訂單；改成999臺或漲價都不會讓商品瞬間賣光。","goal":"理解價格如何影響資源分配。","pr":80},{"id":"115-social-12","y":"115","n":12,"img":"social_q12","pk":"115_social","ans":"D","exp":"臭蟲因觀光客、商務旅客、國際移工跨國移動而擴散到許多國家，說明經濟全球化讓人員流動頻繁，也影響人類的日常生活。","goal":"發覺社會現象中全球化帶來的影響。","pr":68},{"id":"115-social-13","y":"115","n":13,"img":"social_q13","pk":"115_social","ans":"C","exp":"陳小花受監護宣告，吳阿杰被褫奪公權，兩人都不能登記為公職人員候選人。(A)受監護宣告者為無行為能力人；(B)受監護宣告不是刑罰；(D)褫奪公權不影響投票權，吳阿杰年滿20歲且設籍超過4個月，仍可投票。","goal":"理解公平投票的原則。","pr":69},{"id":"115-social-14","y":"115","n":14,"img":"social_q14","pk":"115_social","ans":"A","exp":"阿德是小蔓母親的丈夫（繼父），小蔓與阿德沒有血緣關係，因為婚姻而產生的親屬關係是「姻親」（若沒有辦理收養）。","goal":"理解家人間的親屬關係。","pr":62},{"id":"115-social-15","y":"115","n":15,"img":"social_q15","pk":"115_social","ans":"C","exp":"位於安地斯山脈高山上、以石塊精密堆砌、能抗地震的古城，是印加文明的馬丘比丘，在南美洲西部的秘魯，也就是「丙」。","goal":"了解美洲古文明的分布與環境特色。","pr":56},{"id":"115-social-16","y":"115","n":16,"img":"social_q16","pk":"115_social","ans":"A","exp":"全球暖化使北極海冰大量融化，北極航線通航時間變長，歐亞之間行經北極的航行次數因此增加。","goal":"分析北極融冰加劇對於全球航運的影響。","pr":58},{"id":"115-social-17","y":"115","n":17,"img":"social_q17","pk":"115_social","ans":"B","exp":"石油輸出國家組織（OPEC）減產會讓全球石油供應變少，歐盟更難找到替代俄羅斯的油源，無助於擺脫對俄依賴。其他選項都能減少能源需求或增加替代來源。","goal":"分析歐洲降低能源依賴的策略。","pr":57},{"id":"115-social-18","y":"115","n":18,"img":"social_q18","pk":"115_social","ans":"B","exp":"黃河泥沙主要來自上游的黃土高原。瀑布「上游」推動造林固沙，減少泥沙流入，才可能讓壺口的河水變清。(A)會讓河水更濁；(C)、(D)是下游的事，影響不了上游的瀑布。","goal":"分析人類活動對自然環境的影響。","pr":60},{"id":"115-social-19","y":"115","n":19,"img":"social_q19","pk":"115_social","ans":"A","exp":"「扶清滅洋」、誅殺洋人與「教匪」（傳教士和教徒），還宣稱「神明附身」，這是清末的義和團。","goal":"認識中國晚清時期的東西方衝突。","pr":80},{"id":"115-social-20","y":"115","n":20,"img":"social_q20","pk":"115_social","ans":"B","exp":"西元7～8世紀是唐朝，從中亞引進馬匹、羊肉消費增加、婦女戴胡帽騎馬，都是胡人文化的影響，屬於魏晉到隋唐的民族互動。","goal":"了解中國隋唐時期不同民族間的文化交流。","pr":58},{"id":"115-social-21","y":"115","n":21,"img":"social_q21","pk":"115_social","ans":"D","exp":"圖中有「鐵道部」「電信郵便局」「公學校校長」等日治時期的機關與職稱，所以是日治時期的《臺灣總督府公文類纂》。","goal":"認識臺灣在日本時期的重要發展。","pr":78},{"id":"115-social-22","y":"115","n":22,"img":"social_q22","pk":"115_social","ans":"C","exp":"19世紀末美國取得菲律賓，總統主張用教育和基督教「教化欠缺能力」的人民，認為某些民族較優越、有責任教化其他民族，這是社會達爾文主義。","goal":"了解十九世紀帝國主義的發展。","pr":59},{"id":"115-social-23","y":"115","n":23,"img":"social_q23","pk":"115_social","ans":"B","exp":"依我國規定，外國人取得永久居留仍不是國民，不能參與公投、不能擔任民意代表，也沒有接受國民教育的義務；但言論自由是人人都享有的權利，所以兩者都能發表時事評論。","goal":"理解本國國民與外國籍勞工在權利義務上的異同。","pr":70},{"id":"115-social-24","y":"115","n":24,"img":"social_q24","pk":"115_social","ans":"B","exp":"小毛「起訴」案件是檢察官，阿雄「判決」案件是法官，小芳替大家「調解」糾紛是調解委員。騎車撞傷人涉及過失傷害（告訴乃論的刑事案件）和民事賠償，可以由檢察官偵查起訴、法官審判，也可以申請調解。(A)竊盜不是告訴乃論，不能調解；(C)借錢不還是純民事；(D)不服罰單屬行政程序。","goal":"理解檢察官、法官與調解委員的職權範圍。","pr":45},{"id":"115-social-25","y":"115","n":25,"img":"social_q25","pk":"115_social","ans":"A","exp":"對貝里斯白蝦零關稅，進口白蝦成本下降、供給增加，我國市場上白蝦售價可能下降。(B)貝里斯出口增加，出超應上升；(C)宏都拉斯出口減少，出超應下降；(D)宏都拉斯白蝦減少，競爭程度下降。","goal":"檢視我國市場上商品進口來源的變化，解析開放外國商品進口對我國市場及市場競爭程度的影響。","pr":62},{"id":"115-social-26","y":"115","n":26,"img":"social_q26","pk":"115_social","ans":"B","exp":"民事紛爭的途徑：至法院提告對方違反契約（甲）；結果：雙方在法院達成訴訟上和解（丁）。乙「自訴」和丙「罰金」都屬於刑事案件。","goal":"理解民事紛爭的解決途徑。","pr":56},{"id":"115-social-27","y":"115","n":27,"img":"social_q27","pk":"115_social","ans":"A","exp":"壯年人口比例高（15～64歲占近70%），而且「未來數十年仍占極高比例」，表示底下的幼年人口也還多，未來會持續補充勞動力，所以是(A)這種青壯年多、底部也寬的金字塔。(D)壯年集中在中高齡、幼年少，未來勞動力會減少。","goal":"判讀人口金字塔及了解世界重要國家的人口組成及其經濟發展特色。","pr":53},{"id":"115-social-28","y":"115","n":28,"img":"social_q28","pk":"115_social","ans":"A","exp":"震央在阿拉斯加南方海域（西經149度、北緯56度），位於太平洋北部，所以由太平洋海嘯警報中心研判。","goal":"應用全球經緯度座標判斷位置。","pr":49},{"id":"115-social-29","y":"115","n":29,"img":"social_q29","pk":"115_social","ans":"B","exp":"閩南的「坑頭」在溪流上游；客家依開墾順序命名，由下游往上游開墾，最後開墾的「坑尾」也在上游。所以兩個聚落都應位在溪谷上游（地勢較高、等高線數值較大處），只有(B)符合。","goal":"判讀等高線地形圖及了解各族群聚落地名的命名與環境的關係。","pr":50},{"id":"115-social-30","y":"115","n":30,"img":"social_q30","pk":"115_social","ans":"A","exp":"契約寫明竹塹社因「稅賦繁重」加上鹿變少，才把草地賣給漢人，並由漢人每年補貼稅銀，可見官府的賦稅影響原住民的土地經營方式。(B)竹塹社繳稅，屬「熟番」；(C)漢人買地是為了開墾；(D)文中沒有提到遷徙。","goal":"了解臺灣清帝國時期原住民社會的發展。","pr":67},{"id":"115-social-31","y":"115","n":31,"img":"social_q31","pk":"115_social","ans":"B","exp":"法國國王為解決財政危機，召開自1614年後就未再召開的「三級會議」（1789年），這也是法國大革命的開端。","goal":"認識法國大革命的歷史背景。","pr":61},{"id":"115-social-32","y":"115","n":32,"img":"social_q32","pk":"115_social","ans":"D","exp":"日治時期臺灣人要求設置臺灣議會（臺灣議會設置請願運動），檢察官說統治「過於優厚」、要臺灣人做日本國民，指的是當時推行的「內地延長主義」，把臺灣視為日本內地的延長。","goal":"了解臺灣在日本時期各階段的統治政策。","pr":68},{"id":"115-social-33","y":"115","n":33,"img":"social_q33","pk":"115_social","ans":"A","exp":"「伐遼」「從契丹人手中奪回燕雲十六州」是宋代的背景。宋代重視科舉，考中進士者由皇帝親授官職，因此有「比收復燕雲十六州還光榮」的說法。","goal":"了解中國歷史上的重要政治制度。","pr":64},{"id":"115-social-34","y":"115","n":34,"img":"social_q34","pk":"115_social","ans":"C","exp":"文物以拉丁文刻寫《新約聖經》的經文，又刻有福音書的宗教故事，是基督教在西歐盛行時期的作品，最可能是西元9世紀的西歐（如查理曼帝國時期）。西元前沒有《新約聖經》；14世紀的中南美洲尚未接觸基督教。","goal":"了解世界歷史上重要宗教的發展。","pr":47},{"id":"115-social-35","y":"115","n":35,"img":"social_q35","pk":"115_social","ans":"C","exp":"行政院對立法院通過的法案認為窒礙難行而提出覆議，是行政權對立法權的制衡，符合權力分立的精神。","goal":"理解我國政府體制中權力分立與制衡的機制。","pr":69},{"id":"115-social-36","y":"115","n":36,"img":"social_q36","pk":"115_social","ans":"C","exp":"罰鍰是行政罰，不服行政處分可以提起訴願救濟。(A)罰鍰是負向誘因；(B)臺北市的自治條例由臺北市議會修正；(D)罰鍰不是刑事處罰。","goal":"檢視地方政府制定地方法規處理問題的過程，解析地方自治的制度及行政救濟的途徑。","pr":56},{"id":"115-social-37","y":"115","n":37,"img":"social_q37","pk":"115_social","ans":"D","exp":"出席會議、提出法律修正案、審查預算，都是立法委員的工作。要評鑑立委的工作品質，可以看他「質詢內容」。(A)糾正案是監察院；(B)審理案件是法院；(C)編列預算是行政機關。","goal":"理解立法委員的職權。","pr":53},{"id":"115-social-38","y":"115","n":38,"img":"social_q38","pk":"115_social","ans":"D","exp":"APP 讓消費者知道哪些企業違反環保法規，藉此影響消費者的偏好，進而改變購買行為。","goal":"檢視環保團體的作為，解析影響消費行為的因素。","pr":56},{"id":"115-social-39","y":"115","n":39,"img":"social_q39","pk":"115_social","ans":"B","exp":"官軍從鹿港登陸、事件後將「諸羅」改名「嘉義」，是清乾隆年間的林爽文事件。","goal":"了解臺灣清帝國時期重要民變及其影響。","pr":53},{"id":"115-social-40","y":"115","n":40,"img":"social_q40","pk":"115_social","ans":"A","exp":"甲的航線遍布北美、印度等地，符合殖民地最多的英國；乙的航線集中到南非好望角與東印度群島（印尼），符合荷蘭的勢力範圍。","goal":"了解大航海時代以來，歐洲國家在世界各地的擴張情形。","pr":52},{"id":"115-social-41","y":"115","n":41,"img":"social_q41","pk":"115_social","ans":"B","exp":"乙幣價格固定，若成本（甲幣）越來越低，表示1甲幣能換到越來越多乙幣，匯率上升；6月22日成本最高，表示當天1甲幣換到的乙幣最少，匯率最低。所以匯率是6月初先上升，之後下降，到6月22日左右最低，符合(B)。","goal":"解析匯率變動對進口貿易的影響。","pr":42},{"id":"115-social-42","y":"115","n":42,"img":"social_q42","pk":"115_social","ans":"D","exp":"喀土穆位於青尼羅河與白尼羅河交會處，尼羅河往北流入埃及，埃及用水依賴尼羅河。若喀土穆被占領、河流遭控制，會影響埃及用水。(A)蘇丹不與肯亞相鄰；(B)蘇丹港不在波斯灣；(C)圖上沒有橄欖園。","goal":"分析國際衝突的影響。","pr":44},{"id":"115-social-43","y":"115","n":43,"img":"social_q43","pk":"115_social","ans":"B","exp":"修法後從母姓的比例雖然逐年增加，但到2018年也只有2.3%，表示大多數人仍選擇從父姓，選擇姓氏時仍受傳統社會規範影響。","goal":"檢視我國新生兒從母姓統計資料的變化，解析社會規範對於選擇新生兒姓氏的影響。","pr":47},{"id":"115-social-44","y":"115","n":44,"img":"social_q44","pk":"115_social","ans":"D","pimg":"social_p44","grp":"115-social-44～45","exp":"「五腳基」有頂蓋的步行通道，在新加坡這種炎熱多雨的熱帶氣候下，可以讓行人避免日晒和雨淋。","goal":"了解自然環境對人類生活型態的影響。","pr":87},{"id":"115-social-45","y":"115","n":45,"img":"social_q45","pk":"115_social","ans":"C","pimg":"social_p44","grp":"115-social-44～45","exp":"因地形多山、可耕地少而大量人口移往南洋，返鄉蓋洋樓，這是中國東南沿海的福建、廣東一帶（僑鄉）。","goal":"了解中國人口遷移的原因及影響。","pr":62},{"id":"115-social-46","y":"115","n":46,"img":"social_q46","pk":"115_social","ans":"A","pimg":"social_p46","grp":"115-social-46～48","exp":"阿華透過通訊群組轉傳訊息，朋友們看了開始批評政府和法律，可見是透過社群網路影響公共意見。","goal":"發覺生活經驗中社群網路對公共意見的影響。","pr":84},{"id":"115-social-47","y":"115","n":47,"img":"social_q47","pk":"115_social","ans":"C","pimg":"social_p46","grp":"115-social-46～48","exp":"表(八)顯示新增感染者人數從2017年的2,519人逐年減少到2021年的1,247人，訊息說「同性婚姻合法化後患者大幅增加」與事實不符。(D)我國盛行率0.3%和歐美國家差不多，不是較低。","goal":"檢視關於疾病統計數據的變化，探討日常生活中個人或群體可能面臨的不公平處境。","pr":80},{"id":"115-social-48","y":"115","n":48,"img":"social_q48","pk":"115_social","ans":"B","pimg":"social_p46","grp":"115-social-46～48","exp":"小明收到訊息後，主動查詢政府公開的統計資料和其他國家資料來查證，顯示面對各種媒體資訊，要具備媒體識讀能力。","goal":"理解閱聽人具備媒體識讀能力的重要性。","pr":88},{"id":"115-social-49","y":"115","n":49,"img":"social_q49","pk":"115_social","ans":"D","pimg":"social_p49","grp":"115-social-49～51","exp":"最適合製糖的作物是甘蔗，生長在高溫多雨的熱帶、副熱帶地區，大約南緯25度到北緯25度之間。","goal":"了解重要農作物的生產與地理環境的關係。","pr":71},{"id":"115-social-50","y":"115","n":50,"img":"social_q50","pk":"115_social","ans":"A","pimg":"social_p49","grp":"115-social-49～51","exp":"1950年代政府以出口糖、米等農產加工品賺取外匯，用來扶植國內的輕工業，這是臺灣戰後初期的產業特色。","goal":"了解臺灣產業發展的歷程。","pr":50},{"id":"115-social-51","y":"115","n":51,"img":"social_q51","pk":"115_social","ans":"C","pimg":"social_p49","grp":"115-social-49～51","exp":"糖廠除了製糖，也生產酒精、有機肥、飼料，並轉型觀光，目的是提高產業的附加價值。","goal":"分析產業轉型的原因與目的。","pr":86},{"id":"115-social-52","y":"115","n":52,"img":"social_q52","pk":"115_social","ans":"B","pimg":"social_p52","grp":"115-social-52～54","exp":"配合自強運動的商人家族，最可能經營的是自強運動推動的新式事業，如興築鐵路、開採煤鐵礦。(C)大躍進是中共時期；(D)市舶司是唐宋以後的海關機構。","goal":"了解中國晚清時期的重要變革。","pr":53},{"id":"115-social-53","y":"115","n":53,"img":"social_q53","pk":"115_social","ans":"B","pimg":"social_p52","grp":"115-social-52～54","exp":"1933～1937年發行「航空公路建設獎券」，是國民政府北伐統一後（1928～1937年）推動「十年建設」的一部分。","goal":"了解中國現代歷史的發展。","pr":56},{"id":"115-social-54","y":"115","n":54,"img":"social_q54","pk":"115_social","ans":"D","pimg":"social_p52","grp":"115-social-52～54","exp":"1941年太平洋戰爭爆發，日本向英美宣戰，進占上海租界，並以「東亞民族解放者」自居，開放中國人使用租界內的設施。","goal":"了解日本帝國主義對中國的侵略行為。","pr":45},{"id":"ak-social-1","y":"ak","n":1,"html":"小羽寒假到臺灣各地旅行，發現某地一月時幾乎天天下雨，當地人說這是「冬季季風帶來的雨」。小羽最可能在下列哪一個縣市？","opts":["宜蘭縣","臺南市","臺中市","屏東縣"],"ans":"A","exp":"臺灣冬季吹東北季風，位在東北部迎風面的宜蘭、基隆冬天多雨。屏東、臺南、臺中在背風面，冬季較乾燥。","topic":"地理：氣候"},{"id":"ak-social-2","y":"ak","n":2,"html":"某地位於赤道以南、本初子午線以東。下列哪一個坐標（緯度, 經度）最可能是該地？","opts":["(20°N, 30°W)","(20°N, 30°E)","(20°S, 30°E)","(20°S, 30°W)"],"ans":"C","exp":"赤道以南是南緯（S），本初子午線以東是東經（E），所以是 (20°S, 30°E)。","topic":"地理：經緯度"},{"id":"ak-social-3","y":"ak","n":3,"html":"夏天傍晚，阿哲發現市中心的氣溫常比郊區山邊高好幾度。造成這種「都市熱島效應」的原因，最可能是下列何者？","opts":["市中心的森林覆蓋率比郊區高","市中心建築密集、柏油路面吸熱，冷氣與車輛也排放廢熱","市中心的海拔比郊區高","市中心位在季風的迎風面"],"ans":"B","exp":"都市建築密集不易散熱，水泥、柏油吸熱後慢慢放出，加上冷氣、汽機車排放廢熱，使市區比郊區熱。海拔越高氣溫反而越低；森林多會降溫。","topic":"地理：都市"},{"id":"ak-social-4","y":"ak","n":4,"html":"小華到印尼交換學生，發現當地每天有固定時間的禮拜，學校餐廳也不供應豬肉。這最可能和印尼信仰人口最多的哪一種宗教有關？","opts":["伊斯蘭教","天主教","印度教","佛教"],"ans":"A","exp":"印尼是全世界穆斯林人口最多的國家。伊斯蘭教每天有固定的禮拜時間，並禁食豬肉。","topic":"地理：東南亞"},{"id":"ak-social-5","y":"ak","n":5,"html":"十七世紀荷蘭東印度公司來到臺灣，在當地建立熱蘭遮城作為統治與貿易中心。這座城位在今天的哪裡？","opts":["臺北萬華","基隆和平島","彰化鹿港","臺南安平"],"ans":"D","exp":"荷蘭人以大員（今臺南安平）為據點，建立熱蘭遮城。基隆和平島是西班牙人建城的地方。","topic":"臺灣史：荷蘭時期"},{"id":"ak-social-6","y":"ak","n":6,"html":"1860 年代臺灣開港通商後，北臺灣的經濟地位逐漸超越南臺灣，最主要的原因是下列何者？","opts":["茶葉與樟腦大量外銷","政府設立加工出口區","稻米大量輸往日本","蔗糖產量大幅增加"],"ans":"A","exp":"開港後茶、糖、樟腦是三大出口品，茶葉和樟腦主要產在北部，帶動北部發展。蔗糖主要產在南部；加工出口區是戰後的政策。","topic":"臺灣史：清代開港"},{"id":"ak-social-7","y":"ak","n":7,"html":"某時期政府鼓勵臺灣人改日本姓名、在家說日語可獲「國語家庭」認定，並推動參拜神社。這些措施屬於下列何者？","opts":["土地改革","皇民化運動","十大建設","開山撫番"],"ans":"B","exp":"改日本姓名、國語家庭、參拜神社，是日治後期（中日戰爭爆發後）推動的皇民化運動，目的是讓臺灣人成為效忠天皇的日本人。","topic":"臺灣史：日治"},{"id":"ak-social-8","y":"ak","n":8,"html":"戰後政府推行「三七五減租」、「公地放領」與「耕者有其田」。這一系列政策的主要目的是下列何者？","opts":["吸引外國資金投資","改善佃農生活並提高農業生產","推動都市更新","發展重化工業"],"ans":"B","exp":"這三項是戰後的土地改革，降低佃租、讓佃農擁有自己的土地，提高耕作意願與農業生產，也改善佃農的生活。","topic":"臺灣史：戰後"},{"id":"ak-social-9","y":"ak","n":9,"html":"十八世紀後期，某國率先以蒸汽機帶動紡織業機械化，工廠林立，人口大量湧向城市。這個率先發生工業革命的國家是下列何者？","opts":["美國","德國","英國","法國"],"ans":"C","exp":"工業革命最早在十八世紀後期的英國展開，瓦特改良蒸汽機，紡織業率先機械化。","topic":"世界史"},{"id":"ak-social-10","y":"ak","n":10,"html":"依我國憲法規定，下列何者同時是人民的權利，也是人民的義務？","opts":["納稅","服兵役","受國民教育","集會遊行"],"ans":"C","exp":"憲法規定人民有受國民教育的權利與義務。服兵役、納稅是義務；集會遊行是權利。","topic":"公民：權利義務"},{"id":"ak-social-11","y":"ak","n":11,"html":"15 歲的小凱沒有告訴父母，就用壓歲錢在網路上買了一臺 3 萬元的筆電。依我國《民法》，這個買賣契約的效力為何？","opts":["無效，因為小凱未成年","效力未定，須經法定代理人承認才有效","有效，因為是用自己的錢","有效，但父母可以隨時撤銷"],"ans":"B","exp":"7 歲以上未滿 18 歲是限制行為能力人，訂立一般契約須經法定代理人（父母）同意；事前未同意的，效力未定，父母事後承認才生效。","topic":"公民：行為能力"},{"id":"ak-social-12","y":"ak","n":12,"html":"小明週六下午可以去便利商店打工賺 800 元，也可以去看一場免費的展覽，他最後選擇去看展覽。他看展覽的機會成本是下列何者？","opts":["展覽的門票錢","看展覽的交通費","0 元，因為展覽免費","放棄的 800 元打工收入"],"ans":"D","exp":"機會成本是做選擇時放棄的其他選項中價值最高者。小明選了看展，放棄的是打工的 800 元收入。","topic":"經濟：機會成本"},{"id":"ak-social-13","y":"ak","n":13,"html":"颱風過後，許多菜園受損，市場上的高麗菜價格大漲。若其他條件不變，這主要是因為下列何者？","opts":["供給減少","需求減少","需求增加","供給增加"],"ans":"A","exp":"菜園受損使高麗菜的供給減少，在需求不變的情況下，價格上漲。","topic":"經濟：供需"},{"id":"ak-social-14","y":"ak","n":14,"html":"下列何者是我國立法院的職權？","opts":["彈劾違法失職的公務人員","審判民事與刑事案件","舉辦公務人員考試","議決法律案與預算案"],"ans":"D","exp":"立法院議決法律案、預算案。彈劾是監察院；審判是司法院（法院）；舉辦考試是考試院。","topic":"公民：政府"},{"id":"ak-social-15","y":"ak","n":15,"html":"小芸在網路上看到一則「喝某種茶可以治好近視」的貼文，轉傳數已破萬。下列哪一種做法最能展現媒體識讀能力？","opts":["既然很多人轉傳，內容應該可信","先轉傳給家人，讓他們自己判斷","查證訊息來源，並比對專業機構的資料","只要貼文附有照片，就可以相信"],"ans":"C","exp":"媒體識讀是能判斷訊息的真假與立場。轉傳多、附照片都不代表正確，應查證來源、比對專業機構的資料。","topic":"公民：媒體識讀"}],"science":[{"id":"104-science-1","y":"104","n":1,"img":"104_science_q01","pk":"104_science","ans":"C"},{"id":"104-science-2","y":"104","n":2,"img":"104_science_q02","pk":"104_science","ans":"A"},{"id":"104-science-3","y":"104","n":3,"img":"104_science_q03","pk":"104_science","ans":"C"},{"id":"104-science-4","y":"104","n":4,"img":"104_science_q04","pk":"104_science","ans":"B"},{"id":"104-science-5","y":"104","n":5,"img":"104_science_q05","pk":"104_science","ans":"B"},{"id":"104-science-6","y":"104","n":6,"img":"104_science_q06","pk":"104_science","ans":"D"},{"id":"104-science-7","y":"104","n":7,"img":"104_science_q07","pk":"104_science","ans":"B"},{"id":"104-science-8","y":"104","n":8,"img":"104_science_q08","pk":"104_science","ans":"A"},{"id":"104-science-9","y":"104","n":9,"img":"104_science_q09","pk":"104_science","ans":"C"},{"id":"104-science-10","y":"104","n":10,"img":"104_science_q10","pk":"104_science","ans":"C"},{"id":"104-science-11","y":"104","n":11,"img":"104_science_q11","pk":"104_science","ans":"A"},{"id":"104-science-12","y":"104","n":12,"img":"104_science_q12","pk":"104_science","ans":"C"},{"id":"104-science-13","y":"104","n":13,"img":"104_science_q13","pk":"104_science","ans":"B"},{"id":"104-science-14","y":"104","n":14,"img":"104_science_q14","pk":"104_science","ans":"B"},{"id":"104-science-15","y":"104","n":15,"img":"104_science_q15","pk":"104_science","ans":"A"},{"id":"104-science-16","y":"104","n":16,"img":"104_science_q16","pk":"104_science","ans" ence-1","y":"105","n":1,"img":"105_science_q01","pk":"105_science","ans":"A","exp":"方糖溶入水中，糖分子會從濃度高的地方慢慢擴散到整杯水，這是擴散現象。飯菜的氣味分子飄散到客廳也是擴散。(B)吸管吸水是大氣壓力的作用；(C)是氣體變成固體的狀態變化；(D)純金不變色是金的化學性質穩定。"},{"id":"105-science-2","y":"105","n":2,"img":"105_science_q02","pk":"105_science","ans":"C"},{"id":"105-science-3","y":"105","n":3,"img":"105_science_q03","pk":"105_science","ans":"A","exp":"黑蟲的比例逐年上升，是因為在此環境中黑蟲較容易存活（例如不易被天敵發現），能留下較多後代，這就是天擇。(B)若黑蟲較易被捕捉，比例會下降；(C)(D)基因突變是隨機發生的，不是為了躲避天敵而主動改變。"},{"id":"105-science-4","y":"105","n":4,"img":"105_science_q04","pk":"105_science","ans":"D"},{"id":"105-science-5","y":"105","n":5,"img":"105_science_q05","pk":"105_science","ans":"B"},{"id":"105-science-6","y":"105","n":6,"img":"105_science_q06","pk":"105_science","ans":"B"},{"id":"105-science-7","y":"105","n":7,"img":"105_science_q07","pk":"105_science","ans":"C","exp":"呼吸作用是分解養分、釋放能量，所有活的生物每天都會進行；此生物具有葉綠體，有光時也能行光合作用。題目說牠會分解養分產生能量，代表可呼吸，又有葉綠體，所以兩種作用都能進行。"},{"id":"105-science-8","y":"105","n":8,"img":"105_science_q08","pk":"105_science","ans":"B"},{"id":"105-science-9","y":"105","n":9,"img":"105_science_q09","pk":"105_science","ans":"A"},{"id":"105-science-10","y":"105","n":10,"img":"105_science_q10","pk":"105_science","ans":"C","exp":"底座搖晃的大小，代表的是某地所感受到的搖晃程度，也就是震度（地震強度）。(A)(B)是地震發生位置的描述；(D)規模代表地震釋放的能量大小，每次地震只有一個規模，不會隨地點改變。"},{"id":"105-science-11","y":"105","n":11,"img":"105_science_q11","pk":"105_science","ans":"D"},{"id":"105-science-12","y":"105","n":12,"img":"105_science_q12","pk":"105_science","ans":"C","exp":"平均速率等於總路程除以時間。路徑為 P→Q→P→Q→P→S，路程是 10×4＋5＝45 m，所以 45÷15＝3 m/s，速率沒有方向。(A)(B)是用位移 5 m 除以 15 s 的平均速度（0.33 m/s，向西），題目問的是速率，不能用位移算。"},{"id":"105-science-13","y":"105","n":13,"img":"105_science_q13","pk":"105_science","ans":"B"},{"id":"105-science-14","y":"105","n":14,"img":"105_science_q14","pk":"105_science","ans":"D"},{"id":"105-science-15","y":"105","n":15,"img":"105_science_q15","pk":"105_science","ans":"A","exp":"圖中 5～7 月白晝最長、11～1 月白晝最短，表示該地夏至在六月，是北半球，應在赤道以北。(A)說在赤道以南，才是不合理的敘述。(B)(C)(D)都符合圖中的資料。"},{"id":"105-science-16","y":"105","n":16,"img":"105_science_q16","pk":"105_science","ans":"B"},{"id":"105-science-17","y":"105","n":17,"img":"105_science_q17","pk":"105_science","ans":"C","exp":"果實是由子房發育而成，種子是由胚珠發育而成。向日葵的子房內只有一個胚珠，成熟後整個子房變成帶殼的葵瓜子，所以它是果實；南瓜的子房內有很多胚珠，瓜子是胚珠發育成的種子，整個南瓜才是果實。"},{"id":"105-science-18","y":"105","n":18,"img":"105_science_q18","pk":"105_science","ans":"D","exp":"要判斷老的地層在下、年輕的在上，要靠化石來看年代：三葉蟲是古生代、恐龍是中生代、原始人是新生代，由下往上依序越來越年輕。(A)地層水平只能說明沒有被擠壓傾斜；(B)(C)岩性或厚度與地層年代先後無關。"},{"id":"105-science-19","y":"105","n":19,"img":"105_science_q19","pk":"105_science","ans":"D"},{"id":"105-science-20","y":"105","n":20,"img":"105_science_q20","pk":"105_science","ans":"C","exp":"碳酸鈉溶液 pH 大於 7（丙、丁），鹽酸 pH 小於 7（甲、乙）。反應速率受濃度影響：酸越弱（pH 越大）、鹼越弱（pH 越接近 7）反應越慢，所以最慢的是 pH 約 4.5 的乙和 pH 約 8.3 的丙。"},{"id":"105-science-21","y":"105","n":21,"img":"105_science_q21","pk":"105_science","ans":"A"},{"id":"105-science-22","y":"105","n":22,"img":"105_science_q22","pk":"105_science","ans":"A"},{"id":"105-science-23","y":"105","n":23,"img":"105_science_q23","pk":"105_science","ans":"D"},{"id":"105-science-24","y":"105","n":24,"img":"105_science_q24","pk":"105_science","ans":"C"},{"id":"105-science-25","y":"105","n":25,"img":"105_science_q25","pk":"105_science","ans":"C","exp":"兩次乾潮分別在 08:09 和 20:40，滿潮在兩次乾潮的中間，約是 14:25，所以 14:00～16:00 最接近滿潮。(A)(D)接近乾潮，土地面積會接近 5 公頃，不能驗證滿潮時的 3 公頃。"},{"id":"105-science-26","y":"105","n":26,"img":"105_science_q26","pk":"105_science","ans":"A"},{"id":"105-science-27","y":"105","n":27,"img":"105_science_q27","pk":"105_science","ans":"C","exp":"空杯重 200 gw、壓力 10 gw/cm²，所以底面積為 200÷10＝20 cm²。裝滿水後壓力 30 gw/cm²，總重為 30×20＝600 gw，水重 600－200＝400 gw，水的密度 1 g/cm³，所以容量約 400 mL。"},{"id":"105-science-28","y":"105","n":28,"img":"105_science_q28","pk":"105_science","ans":"C","exp":"碘液遇澱粉會變藍黑色，沒有澱粉就維持黃褐色。丙加水是黃褐色，表示 X 本身沒有澱粉（排除 A）；乙加澱粉後仍是黃褐色，表示澱粉被分解掉了，所以 X 中有分解澱粉的酵素。(B)(D)甲的結果不能證明 X 有葡萄糖或分解葡萄糖的酵素。"},{"id":"105-science-29","y":"105","n":29,"img":"105_science_q29","pk":"105_science","ans":"B","exp":"由表得知，甲反應掉 96 g、乙 28 g、丙生成 36 g，所以丁生成 96＋28－36＝88 g，質量比為甲：乙：丁＝96：28：88。24 g 的甲只需要 7 g 的乙就能反應完，乙有剩，所以由甲決定：24÷96×88＝22 g。"},{"id":"105-science-30","y":"105","n":30,"img":"105_science_q30","pk":"105_science","ans":"A","exp":"鋅銅電池中鋅是負極，檢流計往左偏。圖(十六)的電極 X 接在與銅片相同的端子，指針卻往右偏，與鋅銅電池相反，表示 X 相當於鋅，是負極，電子由負極（X）經導線流出。(C)(D)把 Y 當成負極就和指針偏向相矛盾。"},{"id":"105-science-31","y":"105","n":31,"img":"105_science_q31","pk":"105_science","ans":"A"},{"id":"105-science-32","y":"105","n":32,"img":"105_science_q32","pk":"105_science","ans":"B","exp":"甲接回心臟，是靜脈，丙是由心臟流出的動脈，兩者都是血管，裡面有紅血球。乙是收集由微血管滲出的組織液的淋巴管，淋巴液中沒有紅血球。所以只有甲、丙有。"},{"id":"105-science-33","y":"105","n":33,"img":"105_science_q33","pk":"105_science","ans":"D","exp":"KClO3 中的氯由＋5 變成 －1，是氧化劑；硫由 0 變成＋4，是還原劑。因 y＋z＝5，且 KCl 與 SO2 的係數比為 2：3（由配平得出），可得 2KClO3＋3S→2KCl＋3SO2，所以係數為 3 的是還原劑（硫）和二氧化硫。"},{"id":"105-science-34","y":"105","n":34,"img":"105_science_q34","pk":"105_science","ans":"B","exp":"第 1 組：甲＋乙＝280 g；第 2 組：乙＋丙＝650 g；第 3 組：甲＋乙＋丙＝920 g。所以丙＝640 g，乙＝10 g，甲＝270 g。同材質質量與體積成正比，乙體積 1 cm³，所以甲 27 cm³（邊長 3 cm），丙 64 cm³（邊長 4 cm）。"},{"id":"105-science-35","y":"105","n":35,"img":"105_science_q35","pk":"105_science","ans":"C","exp":"把甲、乙、丙看成一個整體，漂浮靜止時總浮力＝總重量。乙一半在水中，浮力 200 gf；丙全在水中，浮力 250 gf，共 450 gf。總重＝50＋乙 200（0.5×400）＋丙，所以丙重 200 gf，密度＝200÷250＝0.8 g/cm³。"},{"id":"105-science-36","y":"105","n":36,"img":"105_science_q36","pk":"105_science","ans":"A","exp":"樹幹由外往內依序是樹皮、韌皮部（運輸養分）、形成層（細胞分裂）、木質部（運輸水分）。從樹皮上的 X 點往內鑽，距離由近到遠是甲（韌皮部）＜丙（形成層）＜乙（木質部）。"},{"id":"105-science-37","y":"105","n":37,"img":"105_science_q37","pk":"105_science","ans":"B","exp":"氯原子質子數 17、電子數 17、質量數 35、中子數 18；H⁺ 質子數 1、電子數 0、質量數 1、中子數 0。對照表可知：甲為質量數（35、1），乙為中子數（18、0），丙為質子數（17、1），丁為電子數（17、0）。"},{"id":"105-science-38","y":"105","n":38,"img":"105_science_q38","pk":"105_science","ans":"D","exp":"中洋脊是新地殼形成處，離中洋脊越遠，地殼年代越老；兩側張裂速率相同，所以年代 8、17、40 百萬年的甲、乙、丙，離中洋脊的距離必為甲＜乙＜丙。(A)(B)三地在中洋脊兩側都有可能，與海溝距離無法確定；(C)順序反了。"},{"id":"105-science-39","y":"105","n":39,"img":"105_science_q39","pk":"105_science","ans":"D"},{"id":"105-science-40","y":"105","n":40,"img":"105_science_q40","pk":"105_science","ans":"D"},{"id":"105-science-41","y":"105","n":41,"img":"105_science_q41","pk":"105_science","ans":"A","exp":"氮的質量比例＝含氮的原子量總和÷化合物式量。(A)28÷60≈47％；(B)28÷132≈21％；(C)28÷164≈17％；(D)28÷80＝35％。只有尿素 CO(NH2)2 超過 40％。"},{"id":"105-science-42","y":"105","n":42,"img":"105_science_q42","pk":"105_science","ans":"D","exp":"自由落體時，兩球速度相同，動能 K＝½mv²，與質量成正比，所以質量大的甲動能較大。兩球原來在同一高度，下落 2 秒後高度仍相同，重力位能 U＝mgh 也與質量成正比，所以 U甲＞U乙。"},{"id":"105-science-43","y":"105","n":43,"img":"105_science_q43","pk":"105_science","ans":"A","exp":"近視眼是水晶體太凸，折射太強，影像落在視網膜前，所以步驟 2 應該用「焦距較短（折射力更強）的凸透鏡」來模擬，而不是焦距相同的凹透鏡。步驟 3 用凹透鏡矯正近視則是正確的，不須更改。"},{"id":"105-science-44","y":"105","n":44,"img":"105_science_q44","pk":"105_science","ans":"C","exp":"隱性基因在 X 染色體上，兒子的 X 來自母親、女兒一個 X 來自父親。女兒必帶基因，表示父親（丈夫）的 X 有此基因；兒子必無，表示母親（妻子）兩個 X 都沒有。妻子的 X 一個來自父親，所以她的父親一定沒有；她的母親和丈夫的雙親則不一定。"},{"id":"105-science-45","y":"105","n":45,"img":"105_science_q45","pk":"105_science","ans":"B"},{"id":"105-science-46","y":"105","n":46,"img":"105_science_q46","pk":"105_science","ans":"B","exp":"(阿春)動摩擦力大小固定，不會逐漸變小；木塊加速是因為 F 大於摩擦力。(阿偉)F 與反作用力是作用在不同物體上，不能互相抵消；木塊靜止是因為靜摩擦力與 F 平衡。所以兩人皆不正確。"},{"id":"105-science-47","y":"105","n":47,"img":"105_science_q47","pk":"105_science","ans":"D","pimg":"105_science_p47","grp":"105-science-47～48"},{"id":"105-science-48","y":"105","n":48,"img":"105_science_q48","pk":"105_science","ans":"C","pimg":"105_science_p47","grp":"105-science-47～48","exp":"無根萍主要以植株一端長出小芽的方式繁殖，這是不經過減數分裂、也沒有精卵結合的無性生殖，後代遺傳性狀與母體相同，不會增加遺傳變異。(A)(B)文中說植株具有雄蕊、雌蕊，能開花結果，所以會產生胚珠與生殖細胞。"},{"id":"105-science-49","y":"105","n":49,"img":"105_science_q49","pk":"105_science","ans":"D","pimg":"105_science_p49","grp":"105-science-49～50"},{"id":"105-science-50","y":"105","n":50,"img":"105_science_q50","pk":"105_science","ans":"A","pimg":"105_science_p49","grp":"105-science-49～50"},{"id":"105-science-51","y":"105","n":51,"img":"105_science_q51","pk":"105_science","ans":"C","pimg":"105_science_p51","grp":"105-science-51～52","exp":"甲在 1028 hPa 的等壓線內，中心氣壓高，是高氣壓，氣流下沉；乙中心氣壓低且有鋒面，是低氣壓，氣流上升，容易有雲雨。"},{"id":"105-science-52","y":"105","n":52,"img":"105_science_q52","pk":"105_science","ans":"B","pimg":"105_science_p51","grp":"105-science-51～52"},{"id":"105-science-53","y":"105","n":53,"img":"105_science_q53","pk":"105_science","ans":"B","pimg":"105_science_p53","grp":"105-science-53～54"},{"id":"105-science-54","y":"105","n":54,"img":"105_science_q54","pk":"105_science","ans":"D","pimg":"105_science_p53","grp":"105-science-53～54","exp":"硫酸質量＝100×1.8×0.98＝176.4 g，莫耳數＝176.4÷98＝1.8 mol。配成 200 mL（0.2 L）後，體積莫耳濃度＝1.8÷0.2＝9.00 M。"},{"id":"106-science-1","y":"106","n":1,"img":"106_science_q01","pk":"106_science","ans":"B"},{"id":"106-science-2","y":"106","n":2,"img":"106_science_q02","pk":"106_science","ans":"A"},{"id":"106-science-3","y":"106","n":3,"img":"106_science_q03","pk":"106_science","ans":"B","exp":"天敵靠視覺捕食，所以和背景顏色相近的蝸牛不容易被發現、存活較多。陰暗石頭縫中深色蝸牛較多，明亮草地上淺色蝸牛較多，才符合這個推論。(A)兩處深色都較多，看不出和環境的關係；(C)(D)的顏色與背景正好相反，會是更容易被捕食的結果。"},{"id":"106-science-4","y":"106","n":4,"img":"106_science_q04","pk":"106_science","ans":"D"},{"id":"106-science-5","y":"106","n":5,"img":"106_science_q05","pk":"106_science","ans":"B"},{"id":"106-science-6","y":"106","n":6,"img":"106_science_q06","pk":"106_science","ans":"A"},{"id":"106-science-7","y":"106","n":7,"img":"106_science_q07","pk":"106_science","ans":"C","exp":"物質甲是肥皂，一端親水、一端親油，能把油汙帶離衣料。油脂和氫氧化鈉反應（皂化反應）會生成肥皂和甘油。(A)產生酯類；(B)產生氯化鈣、水和二氧化碳；(D)是酸鹼中和，產生硫酸鈉和水。"},{"id":"106-science-8","y":"106","n":8,"img":"106_science_q08","pk":"106_science","ans":"B"},{"id":"106-science-9","y":"106","n":9,"img":"106_science_q09","pk":"106_science","ans":"C","exp":"這種動物雖然同時有卵和精子，但要和不同個體交換精子才能受精，表示有精卵結合，屬於有性生殖，子代的遺傳物質一半來自父方、一半來自母方，所以具有親代的部分特徵。(A)有精卵結合不是無性生殖；(B)子代一樣能生殖；(D)體細胞增加是靠有絲分裂，減數分裂是產生生殖細胞。"},{"id":"106-science-10","y":"106","n":10,"img":"106_science_q10","pk":"106_science","ans":"B"},{"id":"106-science-11","y":"106","n":11,"img":"106_science_q11","pk":"106_science","ans":"C"},{"id":"106-science-12","y":"106","n":12,"img":"106_science_q12","pk":"106_science","ans":"B"},{"id":"106-science-13","y":"106","n":13,"img":"106_science_q13","pk":"106_science","ans":"A","exp":"pH 小於 5.0 表示雨水呈酸性，酸性溶液會使藍色石蕊試紙變紅色。(B)紅色石蕊變藍是鹼性；(C)(D)氯化亞鈷試紙是用來檢驗水的存在，和酸鹼性無關。"},{"id":"106-science-14","y":"106","n":14,"img":"106_science_q14","pk":"106_science","ans":"B","exp":"硫燃燒生成二氧化硫，溶於水形成亞硫酸；兩瓶的硫質量相同，但甲瓶水較少（100 mL），所以濃度較大，與大理石反應較快。大理石質量相同時，粉狀的接觸面積比塊狀大，反應更快，因此甲瓶溶液搭配粉狀的丁最快。"},{"id":"106-science-15","y":"106","n":15,"img":"106_science_q15","pk":"106_science","ans":"A"},{"id":"106-science-16","y":"106","n":16,"img":"106_science_q16","pk":"106_science","ans":"B","exp":"甲地在 12:40 水位最高（高潮），乙地的潮汐比甲地晚 30 分鐘，所以乙地高潮在 13:10。船隻只能在水位較高的連續四小時進出，也就是高潮前後各 2 小時，為 11:10～15:10。"},{"id":"106-science-17","y":"106","n":17,"img":"106_science_q17","pk":"106_science","ans":"D"},{"id":"106-science-18","y":"106","n":18,"img":"106_science_q18","pk":"106_science","ans":"D","exp":"表中兩種細胞都能進行呼吸作用（葡萄糖＋氧氣→水＋二氧化碳），所以兩者都含有粒線體，(A)(C)不合理。只有乙細胞能進行光合作用（水＋二氧化碳→葡萄糖＋氧氣＋水），所以只有乙含有葉綠體；甲不能行光合作用，沒有葉綠體。"},{"id":"106-science-19","y":"106","n":19,"img":"106_science_q19","pk":"106_science","ans":"A","exp":"牛頓第一運動定律（慣性定律）是：物體不受外力或合力為零時，靜止的物體會維持靜止，運動中的物體會維持等速度直線運動。兩人的敘述都正確，而且「受外力作用但合力為零」和「不受外力」的效果相同。"},{"id":"106-science-20","y":"106","n":20,"img":"106_science_q20","pk":"106_science","ans":"B","exp":"氣體 X 在正極產生，是氧氣，8 公克 O₂ 為 8÷32＝0.25 莫耳。電解水的反應式是 2H₂O → 2H₂＋O₂，每生成 1 莫耳 O₂ 要消耗 2 莫耳水，所以消耗的水為 0.5 莫耳。"},{"id":"106-science-21","y":"106","n":21,"img":"106_science_q21","pk":"106_science","ans":"A","exp":"物體的顏色是它反射的光的顏色，其他色光被吸收。紅光照射時，紅色和白色部分能反射紅光，仍看到紅色；藍色和綠色部分不反射紅光，看起來是黑色，面積為 8＋2＝10 cm²。(B)藍光下黑色是 4＋2＝6 cm²；(C)綠光下黑色是 8＋4＝12 cm²；(D)白光下沒有黑色。"},{"id":"106-science-22","y":"106","n":22,"img":"106_science_q22","pk":"106_science","ans":"B","exp":"還原劑是自己被氧化（氧化數增加）的物質。階段一中硫由 0 變成 +4（SO₂），所以還原劑是 S；階段二中 SO₂ 的硫由 +4 變成 +6（SO₃），所以還原劑是 SO₂。氧氣在兩個反應中都是被還原，是氧化劑。"},{"id":"106-science-23","y":"106","n":23,"img":"106_science_q23","pk":"106_science","ans":"B"},{"id":"106-science-24","y":"106","n":24,"img":"106_science_q24","pk":"106_science","ans":"A"},{"id":"106-science-25","y":"106","n":25,"img":"106_science_q25","pk":"106_science","ans":"C"},{"id":"106-science-26","y":"106","n":26,"img":"106_science_q26","pk":"106_science","ans":"A","exp":"臺灣夏季盛行西南季風、冬季盛行東北季風，兩者都是從海洋方向吹來，經過海面會挾帶水氣。(B)夏季是西南季風、冬季是東北季風，不是東南和西北；(C)兩者都源自高氣壓（太平洋高壓、蒙古高壓）；(D)西南部在冬季是背風面，降雨少。"},{"id":"106-science-27","y":"106","n":27,"img":"106_science_q27","pk":"106_science","ans":"C"},{"id":"106-science-28","y":"106","n":28,"img":"106_science_q28","pk":"106_science","ans":"D","exp":"依牛頓第二運動定律 F＝ma，外力等於質量乘以加速度。乙組 1×2＝2、丙組 2×1＝2 都符合：X 為質量，Y 為水平外力，Z 為加速度；甲組 1×1＝1 也成立。其他選項代入乙或丙組都無法成立。"},{"id":"106-science-29","y":"106","n":29,"img":"106_science_q29","pk":"106_science","ans":"C","exp":"圖中每一組正離子數都是負離子數的 2 倍，表示化合物解離後正負離子數目比為 2：1，例如 Na₂SO₄ → 2Na⁺＋SO₄²⁻。(A)CaCl₂ 是 1：2；(B)CuSO₄ 是 1：1；(D)CH₃COOH 是弱電解質，不符合「強電解質」的條件。"},{"id":"106-science-30","y":"106","n":30,"img":"106_science_q30","pk":"106_science","ans":"C","exp":"三塊鋁吸收相同熱量，Q＝m×比熱×溫度變化，比熱相同，所以質量與溫度變化成反比。溫度變化分別是 60、40、20 ℃，質量比為 1/60：1/40：1/20＝2：3：6。"},{"id":"106-science-31","y":"106","n":31,"img":"106_science_q31","pk":"106_science","ans":"A","exp":"溫室效應增強，是因為大氣中溫室氣體增加，吸收了更多地表放出的輻射（紅外線），再放射回地表使氣溫上升，也就是甲「大氣吸收的地表輻射量」增加。乙、丙是吸收太陽輻射，不是溫室氣體增加的主要影響。"},{"id":"106-science-32","y":"106","n":32,"img":"106_science_q32","pk":"106_science","ans":"C"},{"id":"106-science-33","y":"106","n":33,"img":"106_science_q33","pk":"106_science","ans":"D"},{"id":"106-science-34","y":"106","n":34,"img":"106_science_q34","pk":"106_science","ans":"B","exp":"空氣中氮氣（78.1%）和氧氣（20.9%）都是雙原子分子，合計 99.0%。(A)氮氣不是單原子分子；(C)(D)單原子分子主要是氬氣（約 0.9%），也不是 0.1%，雙原子分子也不是 79.1%。"},{"id":"106-science-35","y":"106","n":35,"img":"106_science_q35","pk":"106_science","ans":"A","exp":"水波傳遞的是能量，水面上的落葉只會上下晃動，不會隨波移動，所以兩片落葉仍在原位置。P、Q 在 O 點兩側，距離為 1＋2＝3 m。(B)(C)(D)是誤以為落葉會隨水波散開。"},{"id":"106-science-36","y":"106","n":36,"img":"106_science_q36","pk":"106_science","ans":"C"},{"id":"106-science-37","y":"106","n":37,"img":"106_science_q37","pk":"106_science","ans":"D","exp":"圖中甲、乙是一對同源染色體，丙、丁是另一對。減數分裂時同源染色體要分開，所以丙與丁必分離到不同細胞。(A)(B)細胞分裂（有絲分裂）是每條染色體複製後平分，同源染色體不會分開，各細胞都會有甲、乙、丙、丁；(C)乙與丙不是同源染色體，分離時可以到同一個細胞。"},{"id":"106-science-38","y":"106","n":38,"img":"106_science_q38","pk":"106_science","ans":"C"},{"id":"106-science-39","y":"106","n":39,"img":"106_science_q39","pk":"106_science","ans":"C","exp":"大西洋中的海底山脈是中洋脊，是板塊張裂的地方，地函熱對流使岩漿湧出，冷卻後形成新的海洋地殼。(A)海溝和(B)擠壓造山發生在板塊聚合處；(D)中洋脊附近的海洋地殼最年輕，最古老的離中洋脊最遠。"},{"id":"106-science-40","y":"106","n":40,"img":"106_science_q40","pk":"106_science","ans":"D","exp":"甲＝質量數 19－電子數 9（質子數）＝10；乙＝電子數＝質子數＝原子序 17；丙＝質量數 80－中子數 45＝35。丁是碘的中子數，表中沒有碘的質量數，無法由已知數值推出。"},{"id":"106-science-41","y":"106","n":41,"img":"106_science_q41","pk":"106_science","ans":"D","exp":"掛 600 gw 時彈簧伸長 5 cm，所以每 1 cm 的力是 120 gw。水平放置時伸長 4 cm，彈簧拉力為 480 gw，彈簧在右邊，拉金屬塊向右。左邊拉力是 600 gw，合力要為零，所以摩擦力是 120 gw 向右。"},{"id":"106-science-42","y":"106","n":42,"img":"106_science_q42","pk":"106_science","ans":"B","exp":"木塊兩次都是漂浮，浮力等於木塊重量，所以浮力不變，(C)(D)錯。油的密度（0.8）比水小，木塊密度 0.6 比油還小，木塊在油水中所受單位體積浮力比在水中小，因此要沒入更多體積才能提供同樣的浮力，沒入液體的體積變大。"},{"id":"106-science-43","y":"106","n":43,"img":"106_science_q43","pk":"106_science","ans":"D","exp":"太陽直射時，旗竿影長為 0。圖中影長最短約 0.3 m，從來沒有到達 0，所以這個地方一年中都不會受到太陽直射。(A)(B)(C)都必須在某個月影長為 0。"},{"id":"106-science-44","y":"106","n":44,"img":"106_science_q44","pk":"106_science","ans":"C","exp":"銀杏是裸子植物，種子外沒有子房壁包住，不會形成真正的果實，白果其實是種子，所以不具有果實構造。(A)Ginkgo 是屬名，是名詞；(B)銀杏是裸子植物，不是單子葉植物；(D)裸子植物不開花。"},{"id":"106-science-45","y":"106","n":45,"img":"106_science_q45","pk":"106_science","ans":"D","exp":"原溶液 150 g、濃度 40%，含檸檬酸 60 g、水 90 g。再加 65 g 只溶解 60 g，所以在 90 g 水中共溶解 60＋60＝120 g，達到飽和。溶解度＝120÷90×100≈133 g/100 g 水。"},{"id":"106-science-46","y":"106","n":46,"img":"106_science_q46","pk":"106_science","ans":"D","exp":"甲、乙並聯，電壓相同，功率相等所以電阻相等，且各通過電流的一半。設丙的電流為 I，則甲、乙各為 I/2。丙的功率 I²R丙 ＝ 甲的功率 (I/2)²R甲，得 R甲＝4R丙，也就是 R甲＝R乙＝4R丙。"},{"id":"106-science-47","y":"106","n":47,"img":"106_science_q47","pk":"106_science","ans":"D","pimg":"106_science_p47","grp":"106-science-47～48","exp":"要探討「沒有營養素 X 時，物質 Y 的影響」，就要讓營養素 X 這個變因固定在「沒有」，只改變物質 Y 的有無，也就是丙（注射 Y）和丁（未注射 Y）。(A)(B)(C)的組合都同時改變了營養素 X。"},{"id":"106-science-48","y":"106","n":48,"img":"106_science_q48","pk":"106_science","ans":"C","pimg":"106_science_p47","grp":"106-science-47～48","exp":"圖中甲、乙在第 4 週都約 190 gw，超過 100 gw，這兩組都有營養素 X；丙、丁沒有 X，增加量都不到 100 gw。所以營養素 X 會使體重增加量超過 100 gw。物質 Y 有無（甲和乙、丙和丁的比較）幾乎沒有差別，不會。"},{"id":"106-science-49","y":"106","n":49,"img":"106_science_q49","pk":"106_science","ans":"A","pimg":"106_science_p49","grp":"106-science-49～50"},{"id":"106-science-50","y":"106","n":50,"img":"106_science_q50","pk":"106_science","ans":"D","pimg":"106_science_p49","grp":"106-science-49～50","exp":"碳化鈣加水的反應式為 CaC₂＋2H₂O → C₂H₂＋Ca(OH)₂。反應物係數和為 1＋2＝3，生成物係數和為 1＋1＝2，比值為 3：2。"},{"id":"106-science-51","y":"106","n":51,"img":"106_science_q51","pk":"106_science","ans":"D","pimg":"106_science_p51","grp":"106-science-51～52","exp":"阿祁作等速度運動，單位時間移動的距離相同，所以兩張照片間人移動的距離越大，經過時間就越長。比較欄杆數：1→2 移動最少，2→3 較多，3→4 最多，因此 t₁＜t₂＜t₃。"},{"id":"106-science-52","y":"106","n":52,"img":"106_science_q52","pk":"106_science","ans":"B","pimg":"106_science_p51","grp":"106-science-51～52","exp":"重力位能與物體離地面的高度成正比。照片 2 和照片 3 中，籃球都在籃框的高度，離地高度相同，重力位能就相等。照片 1 的球在籃框下方，照片 4 的球已落到地面附近。"},{"id":"106-science-53","y":"106","n":53,"img":"106_science_q53","pk":"106_science","ans":"A","pimg":"106_science_p53","grp":"106-science-53～54","exp":"規模代表地震釋放的能量，一次地震只有一個規模（6.2）；震度代表各地搖晃程度，離震央越近越大。震央最靠近丙，其次丁、乙，甲最遠且搖晃很小，所以震度為丙 5 級、丁 4 級、乙 3 級、甲 1 級。(C)(D)把規模和震度弄反。"},{"id":"106-science-54","y":"106","n":54,"img":"106_science_q54","pk":"106_science","ans":"B","pimg":"106_science_p53","grp":"106-science-53～54"},{"id":"107-science-1","y":"107","n":1,"img":"107_science_q01","pk":"107_science","ans":"A"},{"id":"107-science-2","y":"107","n":2,"img":"107_science_q02","pk":"107_science","ans":"A","exp":"天氣圖只能看出等壓線、高低氣壓位置與風的大致方向，無法得知實際氣溫，所以氣溫是否為 35℃ 無法從圖中得知。(B)甲地在高壓東南側、低壓西側，風由高壓吹向低壓，大致為南風；(C)甲地位於 1008 與 1012 之間，氣壓高於 1008 百帕；(D)甲地靠近右下方的高氣壓。"},{"id":"107-science-3","y":"107","n":3,"img":"107_science_q03","pk":"107_science","ans":"D"},{"id":"107-science-4","y":"107","n":4,"img":"107_science_q04","pk":"107_science","ans":"B"},{"id":"107-science-5","y":"107","n":5,"img":"107_science_q05","pk":"107_science","ans":"C","exp":"顏色、狀態（紅色固體）不用經過化學變化就能觀察到，屬於物理性質；抗氧化是指會與氧化物質發生反應，必須透過化學反應才能表現，屬於化學性質。"},{"id":"107-science-6","y":"107","n":6,"img":"107_science_q06","pk":"107_science","ans":"C","exp":"魚類、兩生類都是外溫動物（體溫隨環境改變），左方全為外溫動物。右方的哺乳類是內溫動物，但爬蟲類是外溫動物，所以右方不全是內溫動物，這樣分區並不適當。"},{"id":"107-science-7","y":"107","n":7,"img":"107_science_q07","pk":"107_science","ans":"D"},{"id":"107-science-8","y":"107","n":8,"img":"107_science_q08","pk":"107_science","ans":"A"},{"id":"107-science-9","y":"107","n":9,"img":"107_science_q09","pk":"107_science","ans":"B","exp":"圖中島嶼面積在一天內約有兩次大小變化，週期約半天多，與漲潮、退潮約每天兩次的規律相符，所以是潮汐使水位高低改變。(A)全球暖化造成的海平面變化是長期且緩慢的；(C)海水熱脹冷縮很微小；(D)海陸風不會造成海水水位大幅漲退。"},{"id":"107-science-10","y":"107","n":10,"img":"107_science_q10","pk":"107_science","ans":"D","exp":"道耳吞提出物質由原子組成（甲＝原子）；湯姆森發現原子內有帶負電的電子（乙＝電子）；拉塞福發現原子大部分是空的，質量集中在原子核（丙），原子核內有帶正電的質子（丁）；查兌克發現中子，質量與質子接近。"},{"id":"107-science-11","y":"107","n":11,"img":"107_science_q11","pk":"107_science","ans":"C","exp":"地球對月球的引力指向地球。當月球在丙時，月球位於地球與太陽之間的直線上（太陽在右方），此時太陽受到地球的引力也是指向地球，也就是同為向左，方向相同。其他位置兩個引力方向都不一致。"},{"id":"107-science-12","y":"107","n":12,"img":"107_science_q12","pk":"107_science","ans":"B","exp":"圖中乙、丙是由甲塊根長出的新芽，屬於無性生殖（營養繁殖），子代基因與親代相同，所以乙與丙基因型相同。(A)甲與丙基因型相同；(C)塊根是營養器官，不是生殖器官；(D)體細胞染色體數相同。"},{"id":"107-science-13","y":"107","n":13,"img":"107_science_q13","pk":"107_science","ans":"C"},{"id":"107-science-14","y":"107","n":14,"img":"107_science_q14","pk":"107_science","ans":"A","exp":"熱塑性塑膠由長鏈狀分子彼此互相排列、沒有互相交聯，加熱時分子容易滑動而熔化，所以應選擇線狀結構且加熱後會熔化的選項。有網狀交聯結構的是熱固性塑膠，加熱不會熔化。"},{"id":"107-science-15","y":"107","n":15,"img":"107_science_q15","pk":"107_science","ans":"B"},{"id":"107-science-16","y":"107","n":16,"img":"107_science_q16","pk":"107_science","ans":"B","exp":"宇宙的組成由大到小：銀河系＞太陽系＞行星＞衛星。若甲是銀河系，乙可以是太陽（恆星），丙是行星，最後是衛星。(A)太陽系比星系小，不能放在乙；(C)行星比恆星小，恆星不能放在丙；(D)星系比銀河系小，不可能在銀河系之後。"},{"id":"107-science-17","y":"107","n":17,"img":"107_science_q17","pk":"107_science","ans":"A"},{"id":"107-science-18","y":"107","n":18,"img":"107_science_q18","pk":"107_science","ans":"D"},{"id":"107-science-19","y":"107","n":19,"img":"107_science_q19","pk":"107_science","ans":"C"},{"id":"107-science-20","y":"107","n":20,"img":"107_science_q20","pk":"107_science","ans":"D","exp":"容器甲的材料密度為 2.5 g/cm³，大於水。倒滿水後，容器內的水重與它所排開的水浮力互相抵消，等於只剩下密度大於水的材料本身，浮力小於重力，所以最後會下沉到水底。"},{"id":"107-science-21","y":"107","n":21,"img":"107_science_q21","pk":"107_science","ans":"C","exp":"單擺的週期只和擺長有關，和擺錘質量無關。丙組擺動 10 次為 20.0 秒，和甲組（擺長 100.0 公分，10 次 20.1 秒）幾乎相同，所以丙的擺長應約 100.0 公分。(A)25.0 公分是乙組的擺長，週期只有一半。"},{"id":"107-science-22","y":"107","n":22,"img":"107_science_q22","pk":"107_science","ans":"B"},{"id":"107-science-23","y":"107","n":23,"img":"107_science_q23","pk":"107_science","ans":"B","exp":"氣體溶解度越大，進入試管的水越多。圖中甲水最多、乙次之、丙最少，所以溶解度甲＞乙＞丙。排水集氣法適合收集不易溶於水的氣體，因此丙最適用。"},{"id":"107-science-24","y":"107","n":24,"img":"107_science_q24","pk":"107_science","ans":"D","exp":"看到朋友後有意識地揮手，是由大腦參與的意識行為，不是反射；眼睛才是接受視覺刺激的受器；興奮的感覺由大腦產生；傳遞揮手命令到肌肉的是運動神經。(A)反射不經大腦思考；(B)手部肌肉是反應器；(C)感覺神經只負責傳遞訊息到腦。"},{"id":"107-science-25","y":"107","n":25,"img":"107_science_q25","pk":"107_science","ans":"D","exp":"農曆 16 日的月亮接近滿月，滿月在傍晚日落時從東方升起，半夜到達天空最高處，清晨日出時落入西方。所以凌晨 4:30 的滿月會在西方地平線附近。"},{"id":"107-science-26","y":"107","n":26,"img":"107_science_q26","pk":"107_science","ans":"A","exp":"物質 X 來自光合作用，由葉運輸到竹筍，是光合作用產生的養分，也就是醣類。運輸養分的構造是韌皮部。(C)(D)水分是由木質部從根往上運輸，方向與圖中箭頭相反。"},{"id":"107-science-27","y":"107","n":27,"img":"107_science_q27","pk":"107_science","ans":"D"},{"id":"107-science-28","y":"107","n":28,"img":"107_science_q28","pk":"107_science","ans":"C","exp":"甲有 8 條染色體、為 4 對；乙只有 4 條，且沒有成對的同源染色體，所以乙是減數分裂後形成的生殖細胞（卵），只有半數染色體。因此甲有成對的基因時，乙一定不具成對的基因。(A)染色體上有很多基因；(B)乙也可能含有一條性染色體；(D)乙沒有成對染色體。"},{"id":"107-science-29","y":"107","n":29,"img":"107_science_q29","pk":"107_science","ans":"A","exp":"靜止液體中，同一點向各個方向的壓力大小都相等，壓力只和深度及液體密度有關，與方向無關。所以 X 點上、下、左、右的壓力都相等。不要因為上方水比較深就以為向上壓力較大。"},{"id":"107-science-30","y":"107","n":30,"img":"107_science_q30","pk":"107_science","ans":"C","exp":"對流層的氣溫與氣壓都隨高度升高而降低。(A)臭氧層位於平流層；(B)依溫度變化分成四層是整個大氣層，不是只有對流層；(D)對流層的大氣除了上下對流，也有水平方向的風。"},{"id":"107-science-31","y":"107","n":31,"img":"107_science_q31","pk":"107_science","ans":"D","exp":"步驟一的甲是鹼性（pH 10.6），乙是酸性（pH 0.8），兩者混合會發生中和反應並放熱，所以溫度會大於 25℃。混合後酸鹼互相抵消，pH 會介於 0.8 與 10.6 之間，不會比原本更酸或更鹼。"},{"id":"107-science-32","y":"107","n":32,"img":"107_science_q32","pk":"107_science","ans":"C","exp":"由波速＝頻率×波長，頻率＝34000÷1000＝34 Hz。大象聽覺範圍 16～12000 Hz，包含 34 Hz，聽得到；兔子最低只能聽到 360 Hz，聽不到 34 Hz。"},{"id":"107-science-33","y":"107","n":33,"img":"107_science_q33","pk":"107_science","ans":"D","exp":"圖中甲、乙是並聯，各自有獨立的電流路徑，電池兩端電壓都直接加在每個燈泡上。甲燒毀後只是甲這條路徑斷路，乙兩端電壓不變、電流不變，所以乙仍正常發亮。(C)並聯電路中各支路電流互不影響，不會變成 2 倍。"},{"id":"107-science-34","y":"107","n":34,"img":"107_science_q34","pk":"107_science","ans":"B","exp":"水混合後達到熱平衡，高於 50℃ 的水放熱、低於 50℃ 的水吸熱，吸收與放出的熱量要相等，所以三杯中必須同時有水溫高於 50℃ 與低於 50℃ 的。(A)只有 0℃ 的在吸熱，沒有水放熱，混合後會低於 50℃；(C)全低於 50℃；(D)全不低於 50℃，混合後不可能剛好 50℃。"},{"id":"107-science-35","y":"107","n":35,"img":"107_science_q35","pk":"107_science","ans":"B","exp":"圖中夏至與冬至正午的影子都指向北方，表示正午太陽都在南方，所以地點在北半球，且緯度比 23.5 度還高（夏至太陽直射北緯約 23.5 度）。夏至影子短、冬至影子長，因此最可能是北緯 40 度。北緯 20 度的夏至正午太陽在北方，影子會指向南方。"},{"id":"107-science-36","y":"107","n":36,"img":"107_science_q36","pk":"107_science","ans":"A"},{"id":"107-science-37","y":"107","n":37,"img":"107_science_q37","pk":"107_science","ans":"A","exp":"從任一隻手的靜脈注入藥劑，都會匯入上腔靜脈，再回到右心房，與注射在左手或右手無關。不要把手的左右和心臟的左右心房混淆。"},{"id":"107-science-38","y":"107","n":38,"img":"107_science_q38","pk":"107_science","ans":"C","exp":"v-t 圖斜率代表加速度。25 秒時，甲的加速度為 (9－3)÷15＝0.4 m/s²；乙的加速度為 (6－3)÷30＝0.1 m/s²。質量都是 1 kg，由 F＝ma，合力比等於加速度比，為 4：1。"},{"id":"107-science-39","y":"107","n":39,"img":"107_science_q39","pk":"107_science","ans":"A","exp":"濃硝酸與銅反應產生 NO₂，稀硝酸與銅反應產生 NO。甲反應式 Cu＋4HNO₃ 對應濃硝酸，補上 2NO₂ 後，氮原子左右各 4 個、氧原子各 12 個，才平衡。乙反應式 3Cu＋8HNO₃ 對應稀硝酸，應補 2NO，不是 6NO。"},{"id":"107-science-40","y":"107","n":40,"img":"107_science_q40","pk":"107_science","ans":"A","exp":"甲位於海洋中兩板塊分離處，屬張裂（離散）邊界，也就是中洋脊。這類邊界會有地震、火山和斷層，但海溝出現在聚合邊界（一個板塊隱沒到另一個之下），所以通常不會在甲處出現海溝。"},{"id":"107-science-41","y":"107","n":41,"img":"107_science_q41","pk":"107_science","ans":"B","exp":"能量沿食物鏈每上一個階層約只剩 10%，所以最高階層能量相同時，階層數越多的食物鏈，底下各層需要的能量越多。乙塔階層比甲多，所以乙的生產者及其他各階層能量都比甲大，生產者總能量乙＞甲。(A)(C)要比較的階層，乙都比較大；(D)甲的初級消費者能量反而大於乙的三級消費者。"},{"id":"107-science-42","y":"107","n":42,"img":"107_science_q42","pk":"107_science","ans":"C","exp":"木瓜酵素是催化劑，能加快蛋白質分解的反應速率。製造乙酸乙酯時加入濃硫酸，也是用來當催化劑，加快反應速率。(A)酚酞是指示劑；(B)氫氧化鈉是反應物（鹼）；(D)鹽酸是反應物。"},{"id":"107-science-43","y":"107","n":43,"img":"107_science_q43","pk":"107_science","ans":"D","exp":"凸透鏡焦距 10 cm，從圖中看，丙區在透鏡左側 10 cm 以內，也就是物距小於焦距，此時成正立放大的虛像，無法成在紙屏上，必須移除紙屏，從透鏡另一側（丁、戊、己區）用眼睛透過透鏡觀察。(A)(B)(C)虛像不能用紙屏呈現。"},{"id":"107-science-44","y":"107","n":44,"img":"107_science_q44","pk":"107_science","ans":"C","exp":"赤道附近的東太平洋，信風使表層暖水被吹離，深層冷水沿岸湧升，湧升流強時表層水溫較低，浮游生物多、漁獲豐富，如圖(三十五)。圖(三十四)漁獲減少，是湧升流減弱、表層水溫上升（類似聖嬰現象）。(A)(B)(D)把湧升流強弱和水溫變化的關係說反了。"},{"id":"107-science-45","y":"107","n":45,"img":"107_science_q45","pk":"107_science","ans":"B","exp":"平均速度是位移除以時間；平均速率是總路程除以時間。位移是甲到乙的 S1，總路程是 S1＋2S2。平均速率是平均速度的 15÷3＝5 倍，所以 (S1＋2S2)÷S1＝5，得 S2＝2S1，所以 S1：S2＝1：2。"},{"id":"107-science-46","y":"107","n":46,"img":"107_science_q46","pk":"107_science","ans":"A"},{"id":"107-science-47","y":"107","n":47,"img":"107_science_q47","pk":"107_science","ans":"B"},{"id":"107-science-48","y":"107","n":48,"img":"107_science_q48","pk":"107_science","ans":"D","exp":"水可自由進出薄膜，蔗糖不行。甲是 0.5 M（約 17％）濃度很高，乙是 0.5％，濃度很低。小袋縮小表示放在濃度較高的溶液中失水，不變的那杯表示內外濃度相近，所以丙與較稀的乙相近，而甲最濃。若丙和甲相近，放入乙會吸水變大。"},{"id":"107-science-49","y":"107","n":49,"img":"107_science_q49","pk":"107_science","ans":"A","pimg":"107_science_p49","grp":"107-science-49～50","exp":"偏側蛇蟲草菌感染螞蟻後，從螞蟻身上獲得養分，使螞蟻死亡，一方受益、另一方受害，屬於寄生。(B)合作是雙方都有利；(C)(D)競爭是兩種生物搶奪相同資源，文中沒有此情形。"},{"id":"107-science-50","y":"107","n":50,"img":"107_science_q50","pk":"107_science","ans":"C","pimg":"107_science_p49","grp":"107-science-49～50","exp":"偏側蛇蟲草菌有菌絲、會釋放孢子，屬於真菌，和同樣是真菌的酵母菌親緣最近。(A)蕨類是植物；(B)藍綠菌是原核生物（細菌）；(D)節肢動物是動物，螞蟻就屬於此類。"},{"id":"107-science-51","y":"107","n":51,"img":"107_science_q51","pk":"107_science","ans":"B","pimg":"107_science_p51","grp":"107-science-51～52","exp":"節省電能 2700 度，燈具共使用 300 盞×10 小時×30 天＝90000 小時，所以每盞燈每小時省 2700÷90000＝0.03 度，也就是 30 W。40W 換成 10W 剛好省 30 W。(A)省 33 W；(C)省 51 W；(D)省 47 W。"},{"id":"107-science-52","y":"107","n":52,"img":"107_science_q52","pk":"107_science","ans":"B","pimg":"107_science_p51","grp":"107-science-51～52","exp":"CO₂ 分子量為 12＋16×2＝44，所以 44 g 為 1 莫耳，含 6×10²³ 個分子。1447 公斤＝1447000 公克，莫耳數為 1447000÷44，再乘以 6×10²³ 就是分子個數。(A)(C)公斤沒有換算成公克；(C)(D)莫耳數與分子個數不同。"},{"id":"107-science-53","y":"107","n":53,"img":"107_science_q53","pk":"107_science","ans":"C","pimg":"107_science_p53","grp":"107-science-53～54","exp":"氣溫 30℃ 時，濕度在 50％ 以上，對應的體感溫度由 31 一路上升到 44，都高於 30℃。(A)氣溫 27℃、濕度 40％ 時體感溫度也是 27℃，沒有比較高；(B)氣溫 27℃、濕度 100％ 時體感溫度 31℃，屬於警告等級；(D)氣溫 31℃ 時最高只有 49，屬於危險，沒有達到極度危險。"},{"id":"107-science-54","y":"107","n":54,"img":"107_science_q54","pk":"107_science","ans":"B","pimg":"107_science_p53","grp":"107-science-53～54","exp":"水分蒸發是液態水變成水蒸氣，需要吸收熱量，所以是吸熱。這只是狀態改變，屬於物理變化，水分子本身沒有改變，分子內的原子不會重新排列。(A)原子重新排列是化學變化才有的現象；(C)(D)蒸發是吸熱，不是放熱。"},{"id":"108-science-1","y":"108","n":1,"img":"108_science_q01","pk":"108_science","ans":"D"},{"id":"108-science-2","y":"108","n":2,"img":"108_science_q02","pk":"108_science","ans":"B","exp":"氯化鈣與碳酸鈉反應會生成碳酸鈣沉澱和氯化鈉，過濾掉沉澱後，濾液中仍溶有氯化鈉。氯化鈉是電解質，溶於水會解離出可自由移動的離子，所以能導電使燈泡發亮。(A)(C)濾液不是只有水。"},{"id":"108-science-3","y":"108","n":3,"img":"108_science_q03","pk":"108_science","ans":"C"},{"id":"108-science-4","y":"108","n":4,"img":"108_science_q04","pk":"108_science","ans":"D"},{"id":"108-science-5","y":"108","n":5,"img":"108_science_q05","pk":"108_science","ans":"A"},{"id":"108-science-6","y":"108","n":6,"img":"108_science_q06","pk":"108_science","ans":"B"},{"id":"108-science-7","y":"108","n":7,"img":"108_science_q07","pk":"108_science","ans":"A","exp":"位移只看起點到終點的直線距離與方向，兩種路線起點、終點相同，所以位移相同。(B)開車 4.5 公里、步行 2.3 公里，路徑長不同；(C)(D)花的時間不同，平均速度與平均速率都不同。"},{"id":"108-science-8","y":"108","n":8,"img":"108_science_q08","pk":"108_science","ans":"B","exp":"彈簧伸長量和所掛重量成正比。乙比原長（甲）伸長 2 cm，掛 W₁；丙再多伸長 1 cm，總共伸長 3 cm，掛 W₁＋W₂。所以 W₁：(W₁＋W₂)＝2：3，得 W₁：W₂＝2：1。"},{"id":"108-science-9","y":"108","n":9,"img":"108_science_q09","pk":"108_science","ans":"A","exp":"甲是原子序 8、電子數 8 的氧原子，丙是原子序 10、電子數 10 的氖原子，質子數等於電子數，所以都呈電中性。(B)乙、丙原子序不同，不是同一種；(C)乙帶 -1 價，丁帶 +2 價；(D)甲的質子數等於電子數。"},{"id":"108-science-10","y":"108","n":10,"img":"108_science_q10","pk":"108_science","ans":"A"},{"id":"108-science-11","y":"108","n":11,"img":"108_science_q11","pk":"108_science","ans":"B","exp":"石頭在河中被水流搬運時，不斷互相碰撞、摩擦，搬運越遠，稜角越被磨掉，變得圓滑。所以表面光滑的乙組是搬運距離較遠的下游石頭，有稜角的甲組則在上游。(C)(D)上游水流湍急，搬運能力反而較強。"},{"id":"108-science-12","y":"108","n":12,"img":"108_science_q12","pk":"108_science","ans":"A"},{"id":"108-science-13","y":"108","n":13,"img":"108_science_q13","pk":"108_science","ans":"B","exp":"帶正電的玻璃棒靠近金屬球，會吸引金屬球內的自由電子，使靠近玻璃棒的一側帶負電、遠端帶正電，整個球仍不帶電。因為異性相吸的力大於同性相斥的力，金屬球會被吸向玻璃棒，所以懸線向玻璃棒方向偏。"},{"id":"108-science-14","y":"108","n":14,"img":"108_science_q14","pk":"108_science","ans":"D"},{"id":"108-science-15","y":"108","n":15,"img":"108_science_q15","pk":"108_science","ans":"D"},{"id":"108-science-16","y":"108","n":16,"img":"108_science_q16","pk":"108_science","ans":"B","exp":"岩層含海洋生物碎屑和完整珊瑚化石，表示當時是淺海環境，並且是沉積岩。層狀構造原本是水平堆積，現在傾斜，是形成之後受到地殼的力才傾斜。(A)岩漿冷卻形成的是火成岩；(C)環境是海洋；(D)風化侵蝕不會使岩層傾斜。"},{"id":"108-science-17","y":"108","n":17,"img":"108_science_q17","pk":"108_science","ans":"D","exp":"深色是顯性，只要有 T 就是深色。丁組 Tt × TT 的子代全部帶有 T（TT 或 Tt），全是深色，在深色易被捕食的環境中，被捕食的數量最多。甲組 tt × tt 全是淺色，被捕食最少。"},{"id":"108-science-18","y":"108","n":18,"img":"108_science_q18","pk":"108_science","ans":"D","exp":"天平平衡時，力臂 × 重量左右相等。丁：左臂 5 cm、右臂 10 cm，所以左物重是右物的 2 倍。左右互換後，左邊 5 cm 掛輕物，右邊 10 cm 掛重物，右邊力矩較大，向右傾斜。丙互換後則向左傾斜，甲、乙臂長相等，互換後仍平衡。"},{"id":"108-science-19","y":"108","n":19,"img":"108_science_q19","pk":"108_science","ans":"B"},{"id":"108-science-20","y":"108","n":20,"img":"108_science_q20","pk":"108_science","ans":"C"},{"id":"108-science-21","y":"108","n":21,"img":"108_science_q21","pk":"108_science","ans":"B","exp":"陽光直射的緯度在夏季（北半球）約在北緯 23.5 度。夏季直射北回歸線附近，北半球白晝長，而北緯 23.5 度的白晝約 13.5 小時，與表中乙相符。甲雖然白晝最長，但在北緯 40 度，陽光不會直射。"},{"id":"108-science-22","y":"108","n":22,"img":"108_science_q22","pk":"108_science","ans":"C"},{"id":"108-science-23","y":"108","n":23,"img":"108_science_q23","pk":"108_science","ans":"C"},{"id":"108-science-24","y":"108","n":24,"img":"108_science_q24","pk":"108_science","ans":"A","exp":"步驟 2 是把析出的醋酸鈉晶體加熱使它重新溶解成澄清溶液，溶解需要吸收熱量，所以是吸熱變化。加熱後晶體能溶解，表示溫度升高時醋酸鈉的溶解度增加。"},{"id":"108-science-25","y":"108","n":25,"img":"108_science_q25","pk":"108_science","ans":"C"},{"id":"108-science-26","y":"108","n":26,"img":"108_science_q26","pk":"108_science","ans":"A","exp":"小球放開後，在水平方向會保持原本隨機器運動的速度（慣性）。P 點在圓的最南側，機器作逆時針運動，在此位置運動方向向東，所以爸爸會看到小球在水平方向沿著東方運動。"},{"id":"108-science-27","y":"108","n":27,"img":"108_science_q27","pk":"108_science","ans":"B"},{"id":"108-science-28","y":"108","n":28,"img":"108_science_q28","pk":"108_science","ans":"C","exp":"N₂O₄ 中氮的氧化數為 +4，反應後變成 N₂，氧化數為 0，氧化數下降，代表進行還原反應。自己被還原，同時使別的物質（N₂H₄）被氧化，所以是氧化劑。"},{"id":"108-science-29","y":"108","n":29,"img":"108_science_q29","pk":"108_science","ans":"A","exp":"甲位在日本海上方，且東京受它影響吹偏南風。北半球低氣壓的風向呈逆時針向內吹，東京在甲的東側，吹偏南風，所以甲是低氣壓。秋田在甲的東邊偏南處，風向主要為東南風。高氣壓的風向則是順時針向外吹。"},{"id":"108-science-30","y":"108","n":30,"img":"108_science_q30","pk":"108_science","ans":"B","exp":"「6.3」是芮氏規模，代表地震釋放的能量，一次地震只有一個規模；震度則是各地感受到的搖晃程度，會隨地點不同。圖中仁愛鄉最大震度是 5 級，不是 6.3 級，所以 (B) 最不符合。"},{"id":"108-science-31","y":"108","n":31,"img":"108_science_q31","pk":"108_science","ans":"C","exp":"導體電阻 R 和長度成正比、和截面積成反比。設甲的電阻為 R，則乙長度 2 倍，電阻為 2R；丙截面積 2 倍，電阻為 R/2。電壓都是 1.5 V，電流和電阻成反比，所以電流大小為丙 > 甲 > 乙。"},{"id":"108-science-32","y":"108","n":32,"img":"108_science_q32","pk":"108_science","ans":"C","exp":"轉殖基因是轉入受精卵，受精卵分裂產生的每一個體細胞都帶有此基因，所以小鼠全身體細胞都有人類感光色素基因。(A)是由受精卵發育，屬有性生殖；(B)雄鼠只有帶 X 染色體的精子有此基因，帶 Y 的沒有；(D)基因可遺傳給下一代。"},{"id":"108-science-33","y":"108","n":33,"img":"108_science_q33","pk":"108_science","ans":"D"},{"id":"108-science-34","y":"108","n":34,"img":"108_science_q34","pk":"108_science","ans":"B","exp":"光速極快，光到達幾乎不需時間，而聲音速率約 340 公尺／秒。距離 1.5 公里＝1500 公尺，聲音要約 1500÷340 ≒ 4.4 秒才到，所以是先看到火光，約 4～5 秒後才聽到爆炸聲。"},{"id":"108-science-35","y":"108","n":35,"img":"108_science_q35","pk":"108_science","ans":"D","exp":"電解硫酸銅時，銅離子在陰極得電子析出銅，使電極質量增加；碳棒甲最重，是陰極（還原），所以碳棒乙是陽極，進行氧化反應。鋅銅電池中，鋅極被氧化而溶解，質量減少，所以質量最小的電極丁是鋅極（氧化）。"},{"id":"108-science-36","y":"108","n":36,"img":"108_science_q36","pk":"108_science","ans":"A","exp":"丙酮平衡後為 C₃H₆O＋4O₂ → 3CO₂＋3H₂O，丙烷為 C₃H₈＋5O₂ → 3CO₂＋4H₂O。相同莫耳數時，丙酮耗氧 4 莫耳、產生水 3 莫耳；丙烷耗氧 5 莫耳、產生水 4 莫耳，所以丙酮兩者都比較少。"},{"id":"108-science-37","y":"108","n":37,"img":"108_science_q37","pk":"108_science","ans":"A"},{"id":"108-science-38","y":"108","n":38,"img":"108_science_q38","pk":"108_science","ans":"C","exp":"二氧化碳等非金屬氧化物溶於水會形成酸，使海水 pH 值下降，所以第（一）句合理。碳酸鈣會和氫離子反應而被溶解，所以海水中氫離子增加時，海洋生物的碳酸鈣外殼可能被分解，第（二）句也合理。"},{"id":"108-science-39","y":"108","n":39,"img":"108_science_q39","pk":"108_science","ans":"D","exp":"連通管內水面齊高時，同一水平面的壓力相同，所以活塞下方水的壓力相同。活塞重量＝壓力 × 面積，管口口徑越大，面積越大，活塞就越重，所以丙 > 乙 > 甲。"},{"id":"108-science-40","y":"108","n":40,"img":"108_science_q40","pk":"108_science","ans":"D","exp":"丁是從生產者傳給消費者的含氮物質，是動物吃植物取得的蛋白質。(A)甲是微生物吸收氮氣，是固氮作用，不是呼吸作用；(B)乙是微生物把含氮物質轉成氮氣釋出，不是光合作用；(C)丙是被植物吸收的含氮無機鹽（如硝酸鹽），不是葡萄糖。"},{"id":"108-science-41","y":"108","n":41,"img":"108_science_q41","pk":"108_science","ans":"B","exp":"甲運輸有機養分，位在韌皮部。乙在不同時間可向上或向下流動，是葉行光合作用製造出的醣類，可由葉送往根或其他部位。木質部運輸水和礦物質，只能單向由根向上，所以 (A)(C)(D) 不合理。"},{"id":"108-science-42","y":"108","n":42,"img":"108_science_q42","pk":"108_science","ans":"A","exp":"塑膠球會浮起，所以要用金屬球拉它沉下去。步驟三的水位 X₃ 包含水、塑膠球和金屬球的體積；步驟四只剩金屬球，水位為 X₄，兩者相減就是塑膠球的體積 (X₃－X₄)。X₁ 是原本水的體積，不用再減。"},{"id":"108-science-43","y":"108","n":43,"img":"108_science_q43","pk":"108_science","ans":"C"},{"id":"108-science-44","y":"108","n":44,"img":"108_science_q44","pk":"108_science","ans":"A","exp":"木塊本來浮在水面，多放 300 g 砝碼後，多下沉 3 cm，增加的浮力等於砝碼重量。增加的排開水體積為 A × 3 cm³，水密度 1 g/cm³，浮力相當於 3A g，所以 3A＝300，A＝100 cm²。"},{"id":"108-science-45","y":"108","n":45,"img":"108_science_q45","pk":"108_science","ans":"D","exp":"酵素 X 超過 70℃ 就永久失去活性。綠茶在步驟 I 就超過 70℃，酵素失活；紅茶到步驟 III 才超過 70℃。步驟 IV 時兩者的酵素都已經被破壞，溫度降低後也不會恢復，活性相等。(A)步驟 I 結束時綠茶已失活，應是綠茶 < 紅茶。"},{"id":"108-science-46","y":"108","n":46,"img":"108_science_q46","pk":"108_science","ans":"C","exp":"合力等於質量乘加速度。丙：2 kg × 0.5 m/s² ＝ 1 N。(A)(B)靜止或等速運動，合力為 0；(D)丁的合力為 2 kg × 1 m/s² ＝ 2 N。不能直接用兩個力相減，因為桌面可能還有摩擦力。"},{"id":"108-science-47","y":"108","n":47,"img":"108_science_q47","pk":"108_science","ans":"A","pimg":"108_science_p47","grp":"108-science-47～48","exp":"光反射時，法線是入射光線與反射光線夾角的角平分線，也就是會垂直於反射面。入射光線反射後射向接收器，所以法線要落在入射光線和反射光線中間，對應的虛線為 L₁。"},{"id":"108-science-48","y":"108","n":48,"img":"108_science_q48","pk":"108_science","ans":"A","pimg":"108_science_p47","grp":"108-science-47～48","exp":"玻璃外殼與不鏽鋼管間是真空，沒有空氣或其他物質，所以熱量無法靠物質接觸的傳導，也無法靠流體流動的對流散失。但輻射（如光、紅外線）不需要介質，仍可穿過真空，所以真空不能減少輻射散熱。"},{"id":"108-science-49","y":"108","n":49,"img":"108_science_q49","pk":"108_science","ans":"B","pimg":"108_science_p49","grp":"108-science-49～50","exp":"臺北當天是滿月，月相每天只有一個，同一天世界各地看到的月相都相同。因此同一天阿振和阿榮所見的月相也都是滿月。"},{"id":"108-science-50","y":"108","n":50,"img":"108_science_q50","pk":"108_science","ans":"D","pimg":"108_science_p49","grp":"108-science-49～50","exp":"阿振在東經 31.5 度，阿榮在西經 58.5 度，兩地經度差 90 度，阿榮在阿振的西邊。地球自西向東自轉，西邊的地方時間較晚到，約晚 6 小時，所以阿振看到月亮剛升起時，阿榮那裡的月亮還沒升起，位在東方地平面下。"},{"id":"108-science-51","y":"108","n":51,"img":"108_science_q51","pk":"108_science","ans":"C","pimg":"108_science_p51","grp":"108-science-51～52","exp":"甲、丙兩區樹數與果實量相同，熊的總數都是 11 隻，而乙區果實稀少，熊只有 3 隻，所以果實結果量越多，熊越多。(A)乙區樹最多但熊最少；(B)甲、丙樹數相同，雌雄比例卻相反；(D)甲、丙果實量相同，雌雄比例仍差很多。"},{"id":"108-science-52","y":"108","n":52,"img":"108_science_q52","pk":"108_science","ans":"B","pimg":"108_science_p51","grp":"108-science-51～52"},{"id":"108-science-53","y":"108","n":53,"img":"108_science_q53","pk":"108_science","ans":"D","pimg":"108_science_p53","grp":"108-science-53～54","exp":"NaOH 式量為 23＋16＋1＝40，16.0 g 為 0.4 莫耳，配成 100 mL（0.1 L），原本想配的濃度為 0.4÷0.1＝4.0 M。實際倒入量筒後，體積小於 100 mL（約 95 mL），溶質不變，濃度就會大於 4.0 M。"},{"id":"108-science-54","y":"108","n":54,"img":"108_science_q54","pk":"108_science","ans":"C","pimg":"108_science_p53","grp":"108-science-53～54"},{"id":"109-science-1","y":"109","n":1,"img":"109_science_q01","pk":"109_science","ans":"A"},{"id":"109-science-2","y":"109","n":2,"img":"109_science_q02","pk":"109_science","ans":"A"},{"id":"109-science-3","y":"109","n":3,"img":"109_science_q03","pk":"109_science","ans":"A"},{"id":"109-science-4","y":"109","n":4,"img":"109_science_q04","pk":"109_science","ans":"C"},{"id":"109-science-5","y":"109","n":5,"img":"109_science_q05","pk":"109_science","ans":"C","exp":"白天蒸散旺盛時，水分由根經莖向上運送到葉，所以方向是向上的乙。蒸散作用主要經由氣孔散失水分，氣孔張開時保衛細胞膨大，中間會露出開口，所以是丙。"},{"id":"109-science-6","y":"109","n":6,"img":"109_science_q06","pk":"109_science","ans":"B"},{"id":"109-science-7","y":"109","n":7,"img":"109_science_q07","pk":"109_science","ans":"C","exp":"由圖中相同符號可知地層由上到下依序為甲、乙、丙、丁、戊、己、庚，越下面越老。乙是一千萬年、戊是五千萬年，三千萬年的地層應介於乙與戊之間，也就是丙或丁。"},{"id":"109-science-8","y":"109","n":8,"img":"109_science_q08","pk":"109_science","ans":"A"},{"id":"109-science-9","y":"109","n":9,"img":"109_science_q09","pk":"109_science","ans":"A"},{"id":"109-science-10","y":"109","n":10,"img":"109_science_q10","pk":"109_science","ans":"D"},{"id":"109-science-11","y":"109","n":11,"img":"109_science_q11","pk":"109_science","ans":"B","exp":"兩杯一開始質量減少，指針偏向右，表示甲杯質量減少得比乙杯多，也就是甲杯放出的二氧化碳較多、反應較快。其他條件相同時，固體顆粒越小，總表面積越大，反應越快，所以 X 的顆粒較小。"},{"id":"109-science-12","y":"109","n":12,"img":"109_science_q12","pk":"109_science","ans":"D"},{"id":"109-science-13","y":"109","n":13,"img":"109_science_q13","pk":"109_science","ans":"C"},{"id":"109-science-14","y":"109","n":14,"img":"109_s
